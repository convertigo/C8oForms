name: No code studio E2E shards

on:
  workflow_call:
    inputs:
      browser:
        description: Playwright browser used by every shard.
        required: true
        type: string
      endpoint:
        description: Optional Convertigo endpoint override.
        required: false
        default: ''
        type: string

jobs:
  shards:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      # Firefox refuses to start as root when GitHub mounts /github/home for
      # pwuser. Run the scheduled phase as the image's non-root pwuser instead.
      options: --user 1001
    env:
      E2E_SHARD_TOTAL: 8
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - shard: 1
            chromium_user_index: 1
            firefox_user_index: 9
          - shard: 2
            chromium_user_index: 2
            firefox_user_index: 10
          - shard: 3
            chromium_user_index: 3
            firefox_user_index: 11
          - shard: 4
            chromium_user_index: 4
            firefox_user_index: 12
          - shard: 5
            chromium_user_index: 5
            firefox_user_index: 13
          - shard: 6
            chromium_user_index: 6
            firefox_user_index: 14
          - shard: 7
            chromium_user_index: 7
            firefox_user_index: 15
          - shard: 8
            chromium_user_index: 8
            firefox_user_index: 16
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore previous e2e timings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/dist/sharding
          if git ls-remote --exit-code --heads origin refs/heads/badges >/dev/null; then
            git fetch --no-tags --depth=1 origin refs/heads/badges
            if git cat-file -e FETCH_HEAD:e2e-timings.json 2>/dev/null; then
              git show FETCH_HEAD:e2e-timings.json > tests/dist/sharding/e2e-timings.json
              echo "Restored previous e2e timings from the badges branch."
            else
              echo "No e2e-timings.json on the badges branch; using fallback weights."
            fi
          else
            echo "No badges branch found; using fallback weights."
          fi

      - name: Install test dependencies
        working-directory: tests
        run: npm ci || npm install

      - name: Create e2e MCP token
        working-directory: tests
        env:
          TEST_NOCODE_ENDPOINT: ${{ inputs.endpoint || secrets.TEST_NOCODE_ENDPOINT }}
          C8OFORMS_TEST_USERS: testuser-convertigo@yopmail.com,testuser2-convertigo@yopmail.com,testuser3-convertigo@yopmail.com,testuser4-convertigo@yopmail.com,testuser5-convertigo@yopmail.com,testuser6-convertigo@yopmail.com,testuser7-convertigo@yopmail.com,testuser8-convertigo@yopmail.com,testuser9-convertigo@yopmail.com,testuser10-convertigo@yopmail.com,testuser11-convertigo@yopmail.com,testuser12-convertigo@yopmail.com,testuser13-convertigo@yopmail.com,testuser14-convertigo@yopmail.com,testuser15-convertigo@yopmail.com,testuser16-convertigo@yopmail.com
          C8OFORMS_TEST_USER_INDEX: ${{ inputs.browser == 'firefox' && matrix.firefox_user_index || matrix.chromium_user_index }}
        run: node ci/ensure-test-users.mjs --emit-mcp-token

      - name: Run e2e tests (${{ inputs.browser }} shard ${{ matrix.shard }}/8)
        working-directory: tests
        shell: bash
        env:
          TEST_NOCODE_ENDPOINT: ${{ inputs.endpoint || secrets.TEST_NOCODE_ENDPOINT }}
          TEST_NOCODE_USER: ${{ secrets.TEST_NOCODE_USER }}
          TEST_NOCODE_PASSWORD: ${{ secrets.TEST_NOCODE_PASSWORD }}
          CONVERTIGO_ADMIN_USER: ${{ secrets.TEST_NOCODE_USER || 'admin' }}
          CONVERTIGO_ADMIN_PASSWORD: ${{ secrets.TEST_NOCODE_PASSWORD }}
          C8OFORMS_BROWSER: ${{ inputs.browser }}
          C8OFORMS_TEST_USERS: testuser-convertigo@yopmail.com,testuser2-convertigo@yopmail.com,testuser3-convertigo@yopmail.com,testuser4-convertigo@yopmail.com,testuser5-convertigo@yopmail.com,testuser6-convertigo@yopmail.com,testuser7-convertigo@yopmail.com,testuser8-convertigo@yopmail.com,testuser9-convertigo@yopmail.com,testuser10-convertigo@yopmail.com,testuser11-convertigo@yopmail.com,testuser12-convertigo@yopmail.com,testuser13-convertigo@yopmail.com,testuser14-convertigo@yopmail.com,testuser15-convertigo@yopmail.com,testuser16-convertigo@yopmail.com
          C8OFORMS_TEST_USER_INDEX: ${{ inputs.browser == 'firefox' && matrix.firefox_user_index || matrix.chromium_user_index }}
          C8OFORMS_PRIMARY_TEST_USER: testuser-convertigo@yopmail.com
          C8OFORMS_PRIMARY_TEST_PASSWORD: testuser-convertigo@yopmail.com
          C8OFORMS_SHARD_DEBUG: 1
        run: |
          export C8OFORMS_APP_URL="${TEST_NOCODE_ENDPOINT%/}/projects/C8Oforms/DisplayObjects/mobile/"
          : "${C8OFORMS_MCP_URL:=${TEST_NOCODE_ENDPOINT%/}/api/mcp}"
          export C8OFORMS_MCP_URL
          echo "App URL: $C8OFORMS_APP_URL"
          echo "MCP URL: $C8OFORMS_MCP_URL"
          echo "Served version: $(curl -s "$C8OFORMS_APP_URL/assets/i18n/fr.json" | grep -o '\"version_c8o\"[^,]*' || echo '?')"
          echo "Browser: $C8OFORMS_BROWSER"
          echo "Test user index: $C8OFORMS_TEST_USER_INDEX"
          TIMINGS_FILE="dist/sharding/e2e-timings.json"
          SPECS="$(node ci/shard-specs.mjs ${{ matrix.shard }} "$E2E_SHARD_TOTAL" "$TIMINGS_FILE")"
          echo "Shard ${{ matrix.shard }}/$E2E_SHARD_TOTAL specs: $SPECS"
          if [ -z "$SPECS" ]; then
            echo "No specs for shard ${{ matrix.shard }}/$E2E_SHARD_TOTAL; nothing to run."
            mkdir -p test-results
            printf '{"config":{},"suites":[],"errors":[],"stats":{"expected":0,"skipped":0,"unexpected":0,"flaky":0}}\n' > test-results/results.json
            exit 0
          fi
          set +e
          npx playwright test $SPECS --workers=1 --retries=1
          TEST_STATUS=$?
          set -e
          if [ ! -f test-results/results.json ]; then
            echo "Playwright did not produce test-results/results.json (infra/setup failure)"
            exit "$TEST_STATUS"
          fi
          echo "Shard ${{ matrix.shard }} exited with $TEST_STATUS; report generation will classify the failures."
          exit "$TEST_STATUS"

      - name: Upload Playwright results (${{ inputs.browser }} shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ inputs.browser }}-${{ matrix.shard }}
          path: |
            tests/test-results/results.json
            tests/test-results/**/error-context.md
            tests/test-results/**/*.png
            tests/test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
