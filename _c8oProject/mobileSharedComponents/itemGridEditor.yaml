        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	getIconNameByType(type){
        		switch(type){
        			case "text":
        				return "text-outline";
        			default:
        				return "help-outline";
        		}
        	}
        	async defineBRelements(){
        		const data: any = await firstValueFrom(this.c8o.httpPublic.get("assets/components/BRtypes.json"));
        		this.local.brList = data.filter((x)=> {return x.hide != true});
        		
        	}
        	getIconByType(type){
        		let item = this.local?.brList?.find(x => x.type == type);
        		if(item){
        			return "assets/images/svg/br/" +item.icon + ".svg";
        		}
        		else{
        			"";
        		}
        	}
        	/*End_c8o_CompFunction*/
        '
