                    →: |
                      '		page.c8o.log.debug(''[MB] ''+ props.actionFunction +'': ''+ props.actionName);
                      		const rawPageSize =
                      			event?.detail?.value;
                      
                      		const selectedPageSize =
                      			typeof rawPageSize === "string" &&
                      			rawPageSize
                      				.toLowerCase()
                      				.trim() === "infinite"
                      					? "infinite"
                      					: Number(rawPageSize);
                      
                      		const rawAllowedValues =
                      			Array.isArray(page.page_size_options)
                      				? page.page_size_options
                      				: [10, 25, 50, 100, 500, "infinite"];
                      
                      		const allowedValues =
                      			rawAllowedValues.map((value) => {
                      				if (
                      					typeof value === "string" &&
                      					value
                      						.toLowerCase()
                      						.trim() === "infinite"
                      				) {
                      					return "infinite";
                      				}
                      
                      				return Number(value);
                      			});
                      
                      		const isValidPageSize =
                      			selectedPageSize === "infinite" ||
                      			Number.isInteger(selectedPageSize);
                      
                      		if (
                      			!isValidPageSize ||
                      			!allowedValues.includes(
                      				selectedPageSize
                      			)
                      		) {
                      			resolve(false);
                      			return;
                      		}
                      //		console.log(		{
                      //					action: "pageSizeChange",
                      //					page: 1,
                      //					pageSize: selectedPageSize
                      //				})
                      		resolve({
                      			action: "pageSizeChange",
                      			page: 1,
                      			pageSize: selectedPageSize
                      		});
                      '
