        	/**
        	 * Nombre total de pages (arrondi toujours vers le haut).
        	 */
        	public getPageNumber(): number {
        	  // Si per_page n''''est pas défini ou invalide, on renvoie 0
        	  if (!this.per_page || this.per_page <= 0) {
        	    return 0;
        	  }
        	  // Exemple : total_count = 51, per_page = 50 → 2 pages
        	  return Math.ceil(this.total_count / this.per_page);
        	}
        
        	/**
        	 * Convertit une chaîne en nombre, avec valeur par défaut si échec.
        	 * @param value La chaîne à parser
        	 * @param defaultValue Valeur retournée si NaN (par défaut 0)
        	 */
        	public getNumber(value: string, defaultValue = 0): number {
        	  const n = Number(value);
        	  return Number.isFinite(n) ? n : defaultValue;
        	}
        	
        	public canGoPrevious(): boolean {
        		return (
        			!this.isTrue(this.loading) &&
        			this.getCurrentPage() > 1
        		);
        	}
        	
        	public isTrue(value: unknown): boolean {
        		return value === true || value === "true";
        	}
        
        	public canGoNext(): boolean {
        		return (
        			!this.isTrue(this.loading) &&
        			this.isTrue(this.has_next_page)
        		);
        	}
        	
        	public normalizePage(
        		value: unknown
        	): number {
        		const numericValue =
        			Number(value);
        
        		return (
        			Number.isInteger(
        				numericValue
        			) &&
        			numericValue > 0
        		)
        			? numericValue
        			: 1;
        	}
        
        	public getCurrentPage(): number {
        		if (
        			this.local != null &&
        			this.local.currentPage != null
        		) {
        			return this.normalizePage(
        				this.local.currentPage
        			);
        		}
        
        		return this.normalizePage(
        			this.page
        		);
        	}
        	
        	public calculatePageCount(
        		totalCountValue: unknown,
        		pageSizeValue: unknown
        	): number {
        		const totalCount =
        			Number(totalCountValue);
        
        		if (
        			!Number.isFinite(totalCount) ||
        			totalCount <= 0
        		) {
        			return 0;
        		}
        
        		if (
        			typeof pageSizeValue === "string" &&
        			pageSizeValue
        				.toLowerCase()
        				.trim() === "infinite"
        		) {
        			return 1;
        		}
        
        		const pageSize =
        			Number(pageSizeValue);
        
        		if (
        			!Number.isInteger(pageSize) ||
        			pageSize <= 0
        		) {
        			return 0;
        		}
        
        		return Math.ceil(
        			totalCount / pageSize
        		);
        	}
        	/*End_c8o_CompFunction*/
