            '		page.c8o.log.debug(''[MB] ''+ props.actionFunction +'': ''+ props.actionName);
            		if (page.page != 1) {
            			page.local.selected = page.page_selected;
            			page.page = (Number(page.page) < page.getPageNumber()) ? Number(page.page) + 1 : page.getPageNumber();
            			switch (page.local.selected) {
            				case 1:
            					if (page.page == page.getPageNumber()) {
            						if (page.getPageNumber() > 2) {
            							page.local.selected = 2;							
            						} else if (page.getPageNumber() <= 2) {
            							page.local.selected = 3;
            						} else {
            							page.local.selected = 1;
            						}
            					} else {					
            						page.local.selected = 1;
            					}
            					break;
            				case 2:					
            					page.local.selected = 3;
            					break;
            				case 3:
            					page.local.selected = 3;
            					break;
            				default:
            					break;
            			}
            		} else {
            			page.local.selected = page.page;
            		}
            		page.ref.detectChanges();
            		resolve();
            '
