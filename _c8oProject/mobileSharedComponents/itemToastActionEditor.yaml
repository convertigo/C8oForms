        	public toastPositionOptions() {
        		return [{id: ''top''}, {id: ''middle''}, {id: ''bottom''}];
        	}
        
        	public toastPositionLabel(value: string) {
        		if (value === ''top'') {
        			return this.translate.instant(''start_t'');
        		}
        		if (value === ''bottom'') {
        			return this.translate.instant(''end_b'');
        		}
        		return this.translate.instant(''Center'');
        	}
        
        	public getActionValue(event: any) {
        		let value = event;
        		if (value != null && typeof value === ''object'' && value.out !== undefined) {
        			value = value.out;
        		}
        		if (value != null && typeof value === ''object'' && value.item !== undefined) {
        			return value.item;
        		}
        		return value;
        	}
        
        	public updateActionState() {
        		let owner = this.pageOwner != undefined ? this.pageOwner : this.owner;
        		if (owner != undefined && owner["updateState"] != undefined) {
        			owner["updateState"]();
        		}
        		this.itemChange.emit(this.item);
        		this.ref.markForCheck();
        	}
        
        	public setToastConfig(key: string, event: any) {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		let value = this.getActionValue(event);
        		if (key === ''duration'') {
        			value = value === '''' || value == null ? value : Number(value);
        		}
        		this.item.config[key] = value;
        		this.updateActionState();
        	}
        
        	public setToastCloseButton(event: any) {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		this.item.config.closeBtn = this.getActionValue(event) === ''oui'';
        		this.updateActionState();
        	}
        	/*End_c8o_CompFunction*/'
