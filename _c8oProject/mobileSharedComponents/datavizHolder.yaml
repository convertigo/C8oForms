          →: |
            '		try {
            			if (props.parent.scope?.changes?.sequence?.firstChange && props.parent.scope?.changes?.data?.currentValue == null) {
            				page.isLoading = true;
            				let response: any = await page.c8o.callJsonObject(page.sequence, page.sequenceVars).async();
            				if (page.types.indexOf(''bar'') != -1) {
            					if (response?.options?.name != undefined) {
            						response.options.name = page.translate.instant(''dataviz_'' + response.options.name.replaceAll('' '', ''_'').toLowerCase());
            					}
            					if(response.options.series[0]?.name != undefined){
            						response.options.series[0].name = page.translate.instant(''dataviz_'' + response.options.series[0]?.name.replaceAll('' '', ''_'').toLowerCase());
            					}
            					//horizontal chart
            					if (response.plotOptions?.bar?.horizontal) {
            						response.options.xaxis = Object.assign({}, response.options.xaxis, {
            							labels: {
            								formatter: function(val) {
            									return Math.round(val);
            								}
            							}, min: 0, max: 0
            						});
            						for (let i = 0; i < (response.options.series[0].data).length; i++) {
            							response.options.series[0].data[i] = Math.log10(response.options.series[0].data[i]);
            							response.options.xaxis[''max''] = Math.max(response.options.xaxis[''max''], Math.ceil(response.options.series[0].data[i]));
            						}
            						response.options.xaxis[''tickAmount''] = response.options.xaxis[''max''];
            					}
            					//vertical chart
            					else {
            						response.options.dataLabels = {
            							enabled: true,
            							formatter: function(val) {
            								return val.toString();
            							}
            						}
            						response.options.xaxis.labels.formatter = function(value: string) {
            					      return value?.length > 10 ? value?.substring(0, 10) + ''...'' : value;
            					    }
            					}
            				}
            				else if(page.types.indexOf("line") != -1){
            					response.options.dataLabels = {
            						enabled: true,
            						formatter: function(val) {
            							return val.toString();
            						}
            					}
            				}
            				if (page.types.indexOf(''grid'') != -1) {
            					response?.data?.labels.map((x) => {
            						let hn: string = ''dataviz_'' + x.headerName.replaceAll('' '', ''_'').toLowerCase();
            						x.headerName = page.translate.instant(hn);
            						if(x.type == "timestamp"){
            							x.valueFormatter = function(params) {
            						      if (params.value) {
            						        var date = new Date(+params.value);
            						        var day = (''0'' + date.getDate()).slice(-2);
            						        var month = (''0'' + (date.getMonth() + 1)).slice(-2);
            						        var year = date.getFullYear();
            
            						        return day + ''/'' + month + ''/'' + year;
            						      }
            						      return '''';
            						    }
            						}
            						return x;
            					});
            				}
            				page.data = response;
            				page.isLoading = false;
            			}
            		} catch (e) {
            			console.error("myErr", e);
            			page.isLoading = false;
            		}
            		return;
            '
