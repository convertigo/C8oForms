                  			if (page.myaggrid4?.agGrid?.api?.getSelectedNodes().length == 0) {
                  				return;
                  			}
                  			let docs = page.myaggrid4?.agGrid?.api?.getSelectedNodes().map((node) => { return node.data.group });
                  			let docs2 = [page.local.navParams.data.user];
                  			var deleted : any = {success: true};	
                  			let meta = {groups: JSON.stringify(docs), users: JSON.stringify(docs2)};
                  			let sequence = "C8Oforms.admin_users_remove_from_groups";
                  			deleted = await this.c8o.callJsonObject(sequence, meta).async();
                  			
                  			if((deleted?.success != undefined && deleted?.success.length == 0) || deleted?.success || deleted?.success.indexOf(''is added'') != -1){
                  				page.loadGridData();
                  				await page.presentToast(page.translate.instant("user_move_to_group_successfull", {groupName: ''''}), ''toastSuccess'');
                  				return true;
                  			}
                  			else if(!deleted?.success){
                  				await page.presentToast(page.translate.instant("user_already_moved_to_group", { groupName: '''' }), ''toastError'');
                  				return false;
                  			}
                  			else{
                  				await page.presentToast(page.translate.instant("user_move_to_group_failed"), ''toastError'');
                  				return false;
                  			}
                  		} catch (e) {
                  			await page.presentToast(page.translate.instant("user_move_to_group_failed"), ''toastError'');
                  			return false;
                  		}
                  '
