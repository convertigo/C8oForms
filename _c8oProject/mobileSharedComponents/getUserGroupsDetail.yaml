        '/*Begin_c8o_CompImport*/
        import { C8Oforms_AddUserToGroupForm } from ''../../components/c8oforms.addusertogroupform/c8oforms-addusertogroupform'';
        type Permissions = {
          publication: boolean;
          admin: boolean;
          admin_readonly: boolean;
          formulas: boolean;
          editing_rights: boolean;
          nocode_db_rights: boolean;
        };
        import { inject } from ''@angular/core'';
        import { SafeHtml } from ''@angular/platform-browser'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public toastController: ToastController;
        	public modalController: ModalController;
        	public selectedGroups: Array<any>;
        	public buttonClicked: string;
        	public modalTitle: string;
        	public modalSubtitle: string;
        	public usernamePlaceholder = '''';
        	public descriptionText: string = '''';
        	public opts: any = {
        		cssClass: ''custom-select-popover'',
        		showBackdrop: true,
        		backdropDismiss: true,
        		translucent: true,
        		animated: true,
        		size: ''auto'',
        		side: ''bottom'',
        		alignment: ''start'',
        		arrow: true
        	}
        	private sanitizer = inject(DomSanitizer);
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		this.toastController = this.getInstance(ToastController);
        		this.modalController = this.getInstance(ModalController);
        		this.local.overlayLoading = ''<span class="ag-overlay-loading-center">''+this.translate.instant(''loading_data'')+''</span>'';
        		this.local.overlayNoRows = ''<span class="ag-overlay-no-rows-center">'' + this.translate.instant(''no_data_available'') + ''</span>'';
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		this.modalTitle = this.translate.instant("userprofil_modal_title");
        		this.modalSubtitle = this.translate.instant("userprofil_modal_description");
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	async presentToast(message: string, cssClass: string = '''') {
        		const toast = await this.toastController.create({
        			message: message,
        			duration: 10000,
        			position: ''bottom'',
        			cssClass: cssClass,
        		});
        
        		await toast.present();
        	}
        	
        	public async loadGridData(pageEvent: string = "") {
        				try {
        					this.local.loading = true;
        					if(this.myaggrid4?.agGrid?.api){
        						this.myaggrid4.agGrid.api.showLoadingOverlay();
        					}
        					var data = await this.c8o.callJsonObject("C8Oforms.admin_groups_get_by_user_id", {user: this.local.navParams.data.user}).async();
        					if (data.error) {
        						this.local.error = true;
        					}
        					else {
        						data = {
        							data: {
        								labels: [
        									{
        										headerName: this.translate.instant("group_name"),
        										field: "group",
        										editable: false,
        										checkboxSelection: this.global?.settings?.admin,
        										headerCheckboxSelection: this.global?.settings?.admin
        									},
        									{
        										headerName: '''',
        										field: ''access'',
        										autoHeight: true,
        										editable: false,
        										sortable: false,
        										filter: false,
        									}
        								],
        								values: ((data.result.length > 0) ? data.result : [])
        							}
        						};
        						if (data.data.labels) {
        							var translations = this.translate.translations[this.translate.currentLang];
        							let finKeyByValue = (value) => {
        								for (const key in translations) {
        									if (translations[key] === value) {
        										return key;
        									}
        								}
        							}
        							data.data.labels = data.data.labels.map((x) => {
        								if (x.hearderName) {									
        									x.headerName = this.translate.instant(x.headerName);
        								}
        								// if it''''s a checkbox then add support for non boolean checkbox
        								if (x?.cellRenderer == "agCheckboxCellRenderer") {
        									if (x?.c8o_type == "stringboolean") {
        										x.valueGetter = (params) => {
        											return !(params.data[x.field] === ''false'');
        										},
        										x.valueSetter = (params) => {
        											params.data[x.field] = params.newValue ? ''true'' : ''false'';
        											return true;
        										}
        									}
        									else {
        										x.valueGetter = (params) => {
        											return params.data[x.field] === true;
        										},
        										x.valueSetter = (params) => {
        											params.data[x.field] = params.newValue;
        											return true;
        										}
        									}
        
        								}
        								if (x?.valueGetter == "lang") {
        									x.cellEditorParams.values = x.cellEditorParams.values.map((x) => {
        										x = this.translate.instant(x);
        										return x;
        									})
        									x.valueGetter = (params) => {
        										if (params?.data?.[x.field]) {
        											return this.translate.instant(params.data[x.field]);
        										}
        										else {
        											return params?.data?.[x.field] ?? "";
        										}
        
        									},
        										x.valueSetter = (params) => {
        											params.data[x.field] = finKeyByValue(params.newValue);
        											return true;
        										}
        								}
        								return x;
        							});
        						}
        						data.data.labels[1].cellRenderer = (params) => {
        						  const group = params.value;
        
        						  if (!group) return '''';
        
        						  const tags = group.split(''[$c8oGroup$]'');
        						  
        						  const icons: Record<string, string> = {
        						    editing_rights: ''✏️'',
        						    nocode_db_rights: ''🧩'',
        						    admin: ''🛡️'',
        						  	formulas: ''ƒ'',
        							publication: ''📤'',
        							admin_readonly: ''🛡''
        						  };
        						  const translations: Record<string, string> = {
        						  	editing_rights: ''editing_rights_label'',
        						  	nocode_db_rights: ''nocode_db_rights_label'',
        						  	formulas: ''formulas_rights'',
        						  	admin: ''admin_label'',
        							publication: ''Publication'',
        							admin_readonly: ''Admin_read_only''
        						  }
        
        						  const tagsHtml = tags.map(tag => {
        						    const icon = icons[tag] || ''❓'';
        						    return `<span style="
        						      padding: 2px 8px;
        						      margin-left: 6px;
        						      border-radius: 12px;
        						      background-color: #eef2f7;
        						      color: #1f2937;
        						      font-weight: 600;
        						      font-size: 14px;
        						    height: 2rem;
        						    ">${icon} ${this.translate.instant(translations[tag])}</span>`;
        						  }).join('''');
        
        						  return `<span>${tagsHtml}</span>`;
        						};
        						this.local.data = data;
        						this.local.data.data.labels[0].editable = false;
        //						this.local.data.data.labels = [this.local.data.data.labels[0]];
        //						console.log(this.local.data);
        					}
        				} catch (e) {
        					this.local.error = true;
        //					console.log(this.local);
        					this.c8o.log.error("An error occured : \n" + JSON.stringify(e));
        				}
        				finally {
        					this.local.loading = false;
        					if(this.myaggrid4?.agGrid?.api){
        						this.myaggrid4.agGrid.api.hideOverlay();
        					}
        					this.ref.markForCheck();
        				}
        			}
        			
        			async showModal(grid = "userToGroup"){
        				const modal = await this.modalController.create({
        			      component: C8Oforms_AddUserToGroupForm,
        				  cssClass: "modalAddGroup",
        				  componentProps:  {selectedUsers: [{data:{"~c8oAcl": this.local.navParams.data.user}}], backButton: true}
        			    });
        			    
        				modal.onDidDismiss().then(async (value) => {
        					if(value?.data?.refresh){
        						this.loadGridData();
        						this.ref.detectChanges();
        					}
        				})
        				return await modal.present();
        			}
        			
        			getH1(): string {
        				let h1 = this.local.navParams.data?.name ;
        				return (h1 != undefined && h1.length > 30) ? h1.substring(0, 30) + ''...'' : h1
        			}
        			
        						public UserCellRenderer(params: any): SafeHtml {
        				//		  console.log(params.data)
        						  const { displayName, name } = params;
        						  const initials = (displayName) ? displayName?.slice(0, 2).toUpperCase() : '''';
        
        						  return this.sanitizer.bypassSecurityTrustHtml(`
        						    <div style="display:flex; align-items:center; gap:12px;wi">
        						      <div style="
        						        width:56px; height:56px; border-radius:50%;
        						        background:#e0f2fe; color:#334155;border: 4px solid #00b4d880;
        						        display:flex; align-items:center; justify-content:center;color:var(--ion-color-newconvertigo);
        						        font-weight:600; font-size:15.75px;
        						      ">
        						        ${((initials !== undefined && initials.length > 0) ? initials : 
        										`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`
        									
        								)}
        						      </div>
        						      <div style="display:flex;width:calc(100% - 50px); flex-direction:column; line-height:1.2;">
        						        <span style="font-weight:600;font-size:18px;line-height:25px;" class="truncate">${displayName || this.translate.instant("Utilisateur_inconnu")}</span>
        						      </div>
        						    </div>
        						  `);
        						}
        						
        					public PermissionsCellRenderer(params: any, tooltip: boolean = false, label: boolean = true): SafeHtml {
        //						console.log(params)
        						if (params === undefined) {
        							return;
        						}
        						let p = params;
        						if (typeof params == ''string'') {
        							let tmp = p.split(''[$c8oGroup$]'');
        							p = {
        								admin: (tmp.indexOf(''admin'') != -1),
        								formulas: (tmp.indexOf(''formulas'') != -1),
        								nocode_db_rights: (tmp.indexOf(''nocode_db_rights'') != -1),
        								publication: (tmp.indexOf(''publication'') != -1),
        								editing_rights: (tmp.indexOf(''editing_rights'') != -1),
        								admin_readonly: (tmp.indexOf(''admin_readonly'') != -1),
        							}
        							
        						}
        						
        						const { admin,  formulas, nocode_db_rights, publication, editing_rights, admin_readonly} = p;	
        						
        						let permissions = [];
        						let permissionsLength = 0;
        						const isTrue = (v: any) => v === true || v === "true";
        
        						
        						for (let i = 0; i < 6; i++) {				
        							if (isTrue(admin) && permissions.indexOf("admin") === -1) {
        							  permissions.push("admin");
        							  permissionsLength++;
        							}
        							
        							if (isTrue(nocode_db_rights) && permissions.indexOf("nocode_db_rights") === -1) {
        							  permissions.push("nocode_db_rights");
        							  permissionsLength++;
        							}
        
        							if (isTrue(formulas) && permissions.indexOf("formulas") === -1) {
        							  permissions.push("formulas");
        							  permissionsLength++;
        							}
        
        							if (isTrue(publication) && permissions.indexOf("publication") === -1) {
        							  permissions.push("publication");
        							  permissionsLength++;
        							}
        
        							if (isTrue(editing_rights) && permissions.indexOf("editing_rights") === -1) {
        							  permissions.push("editing_rights");
        							  permissionsLength++;
        							}
        
        							if (isTrue(admin_readonly) && permissions.indexOf("admin_readonly") === -1) {
        							  permissions.push("admin_readonly");
        							  permissionsLength++;
        							}
        
        
        						}
        						
        			//			console.log(permissions);
        
        					  if (permissionsLength === 0) {
        					    return `<span style="color:#9ca3af;height:100%; font-size:12px;">-</span>`;
        					  }
        
        					  // mapping permission → couleur
        					  const colors: Record<string, string> = {
        					    admin: "rgba(239, 68, 68, 0.5)",          // rouge (#ef4444)
        					    nocode_db_rights: "rgba(245, 158, 11, 0.5)", // orange (#f59e0b)
        					    formulas: "rgba(16, 185, 129, 0.5)",      // vert (#10b981)
        					    publication: "rgba(59, 130, 246, 0.5)",   // bleu (#3b82f6)
        					    editing_rights: "rgba(16, 185, 129, 0.5)", // vert (#10b981)
        					    admin_readonly: "rgba(139, 92, 246, 0.5)" // violet (#8b5cf6)
        					  };
        					  
        					  const styleClasses: Record<string, string> = {
        					    admin: "metric-icon-badge--danger",      // rouge
        					    nocode_db_rights: "metric-icon-badge--warning",       // orange
        					  formulas: "metric-icon-badge--success",       // violet
        					    publication: "metric-icon-badge--info",       // bleu
        					    editing_rights: "metric-icon-badge--success",    // vert
        					    admin_readonly: "metric-icon-badge--tertiary",       // violet
        					  };
        					  
        					  const permsNames: Record<string, string> = {
        					    publication: this.translate.instant("publication_perm"),       // bleu
        					    admin: this.translate.instant("admin_perm"),      // rouge
        					    nocode_db_rights: this.translate.instant("nocode_db_rights_perm"),       // orange
        					    editing_rights: this.translate.instant("editing_rights_perm"),    // vert
        					    admin_readonly: this.translate.instant("admin_readonly_perm"),       // violet
        					  formulas: this.translate.instant("formulas_perm")       // violet
        					  };
        
        					  const dots = permissions.map(p => {
        					    const color = colors[p] || "#9ca3af";
        						const styleClass = styleClasses[p] || "";
        						const styleClass2 = ((tooltip)? (styleClass+''--tooltip'') : '''')
        			//			const styleClass2 = ''''
        					    return `<span class="${styleClass} ${styleClass2} truncate" data-text="${permsNames[p]}" style="filter:brightness(1) contrast(1.75);${(!label) ? ''height:12px !important;width: 10px !important;border-radius:50%;'': ''border-radius:8px;''} background:${color} !important;padding:2px 6px; font-size:11px; display:inline-block;">${(label) ? permsNames[p] : ''''}</span>`;
        					  }).join(" ");
        
        					  return this.sanitizer.bypassSecurityTrustHtml(`<div style="display:flex; flex-wrap:wrap;height: auto;overflow:auto !important;gap:6px; ${(!label) ? ''justify-content:flex-end;'' : ''''} align-items:flex-start;${(label) ? ''margin-bottom: 14px;'':''''}margin-top: 0.5rem;font-size: 12px;line-height: 18px;font-weight: 400;">${dots}</div>`);
        					}
        								
        										
        					public SourceCellRenderer(params: any): SafeHtml {
        					  const { mail, language, provider } = params;
        			//		  console.log(mail, language, provider)
        						const colors: Record<string, string> = {
        						  forms: "#3b82f6",
        						  linkedin: "#3b82f6",
        						  undefined: "#3b82f6", 
        						  google: "#ef4444",      // rouge
        						  azuread: "#8b5cf6",      // violet
        						openid: "#111827"       // gris
        						};
        						
        						const styleClasses: Record<string, string> = {
        						  forms: "metric-icon-badge--info",
        						  undefined: "metric-icon-badge--info",
        						  google: "metric-icon-badge--danger",
        						  openid: "metric-icon-badge--dark",
        						  azuread: "metric-icon-badge--primary",
        						  linkedin: "metric-icon-badge--primary",
        						};
        
        					  return this.sanitizer.bypassSecurityTrustHtml(`
        						  <div style="display:flex;align-items:flex-start;height: 31.5px !important;margin-bottom: 14px;margin-top: 0.5rem;font-size: 12px;line-height: 18px;font-weight: 400;">
        								<span class=${styleClasses[provider]} style="
        						          border-radius:8px; padding:2px 6px; font-size:11px;
        						        ">${(provider == undefined) ? ''Convertigo'' : this.translate.instant(provider)}</span>
        						  </div>
        					  `);
        					}
        	/*End_c8o_CompFunction*/
        '
