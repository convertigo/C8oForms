        '/*Begin_c8o_CompImport*/
        import { C8Oforms_AddUserToGroupForm } from ''../../components/c8oforms.addusertogroupform/c8oforms-addusertogroupform'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public toastController: ToastController;
        	public modalController: ModalController;
        	public selectedGroups: Array<any>;
        	public buttonClicked: string;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		this.toastController = this.getInstance(ToastController);
        		this.modalController = this.getInstance(ModalController);
        		this.local.overlayLoading = ''<span class="ag-overlay-loading-center">''+this.translate.instant(''loading_data'')+''</span>'';
        		this.local.overlayNoRows = ''<span class="ag-overlay-no-rows-center">No Data Available</span>'';
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
