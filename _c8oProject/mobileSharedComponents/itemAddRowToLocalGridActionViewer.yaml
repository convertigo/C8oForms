        '/*Begin_c8o_CompImport*/
        // Using ES6 import syntax
        import hljs from ''highlight.js/lib/core'';
        import javascript from ''highlight.js/lib/languages/javascript'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	// #html-stability: DomSanitizer.bypassSecurityTrustHtml() returns a NEW SafeHtml wrapper on every call.
        	// Called inline in an [innerHTML] binding, it made Angular re-set innerHTML on EVERY change-detection
        	// pass: the HTML was re-parsed and its images re-fetched each time. One wrapper is kept per HTML string,
        	// so the binding only changes when the HTML does. See trustHtml().
        	private trustedHtmlCache: Map<string, any> = new Map();
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		this.local.computed = {};
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	highlight(arg1){
        		if(this.local.computed[arg1] != undefined){
        			return this.local.computed[arg1];
        		}
        		else{
        			let arg2 = { language: ''javascript'', ignoreIllegals: true };
        			let cleanedArg1 = arg1
        			  .split(''\n'')
        			  .filter(line => line.trim() !== '''') // Supprime les lignes vides
        			  .join(''\n'');
        			let computed = hljs.highlight(cleanedArg1, arg2).value;
        			this.local.computed[arg1] = computed;
        			return computed;
        		}
        	}
        	/** #html-stability: the one stable SafeHtml for a given HTML string; see trustedHtmlCache. */
        	public trustHtml(html: any): any {
        		const key = html == null ? "" : "" + html;
        		let trusted = this.trustedHtmlCache.get(key);
        		if (trusted === undefined) {
        			if (this.trustedHtmlCache.size >= 1024) {
        				this.trustedHtmlCache.clear();
        			}
        			trusted = this.router.sanitizer.bypassSecurityTrustHtml(this.removeLocalFileReferences(html));
        			this.trustedHtmlCache.set(key, trusted);
        		}
        		return trusted;
        	}
        	/**
        	 * #local-files: references to files of the author machine (file:///C:/Users/...) cannot load anywhere else and only
        	 * produce a console error at every display. Images and media using one are removed, any other file: attribute
        	 * (href, data, poster) is dropped and the element is kept. Same rule as the tinyMce component of
        	 * lib_ExtendedComponents_ui_ngx, which applies it when content is pasted or loaded into the editor.
        	 */
        	public removeLocalFileReferences(html: any): any {
        		if (typeof html !== "string" || !/file:/i.test(html)) {
        			return html;
        		}
        		const fileUrl = "(?:\"\\s*file:[^\"]*\"|''\\s*file:[^'']*''|file:[^\\s>]*)";
        		const result = html.replace(new RegExp("<(?:img|source|embed)\\b[^>]*\\bsrc\\s*=\\s*" + fileUrl + "[^>]*>", "gi"), "");
        		return result.replace(new RegExp("\\s(?:src|href|data|poster)\\s*=\\s*" + fileUrl, "gi"), "");
        	}
        	/*End_c8o_CompFunction*/
        '
