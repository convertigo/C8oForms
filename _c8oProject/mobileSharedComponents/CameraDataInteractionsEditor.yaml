        /*Begin_c8o_CompFunction*/
        	public getCameraEditorValue(event: any) {
        		let value = event;
        		if (value != null && typeof value === ''object'' && value.out !== undefined) {
        			value = value.out;
        		}
        		if (value != null && typeof value === ''object'' && value.item !== undefined) {
        			value = value.item;
        		}
        		return value;
        	}
        
        	public updateCameraEditorState() {
        		const owner = this.pageOwner != undefined ? this.pageOwner : this.owner;
        		if (owner != undefined && owner["updateState"] != undefined) {
        			owner["updateState"]();
        		}
        		this.ref.markForCheck();
        	}
        
        	public setImageQuality(event: any) {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		const value = this.getCameraEditorValue(event);
        		if (value === null || value === undefined || value === '''') {
        			this.item.config.image_quality = value;
        		} else {
        			const parsed = Number.parseInt(String(value), 10);
        			this.item.config.image_quality = Number.isFinite(parsed)
        				? Math.min(100, Math.max(1, parsed))
        				: undefined;
        		}
        		this.updateCameraEditorState();
        	}
        
        	public setOutputFormat(event: any) {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		this.item.config.output_format = this.getCameraEditorValue(event);
        		this.updateCameraEditorState();
        	}
        /*End_c8o_CompFunction*/
