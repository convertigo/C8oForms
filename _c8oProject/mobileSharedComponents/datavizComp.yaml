        		type: this.type,
        		height: (this.defaultHeight != undefined && this.defaultHeight > 0) ? (this.defaultHeight + ''px'') : ''300px'',
        		width: (typeof this.getCompWidth(window.innerWidth) == "number" && this.getCompWidth(window.innerWidth) > 0) ? this.getCompWidth(window.innerWidth) - 100 : ''300px'',
