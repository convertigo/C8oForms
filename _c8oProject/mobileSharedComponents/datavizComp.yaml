        	/**
        	 * Check responsive column size.
        	 */
        	public checkResponsiveColumnSize(): void {
        		let names = ["sm", "md", "lg", "xl"]
        		let namesErr = []
        		if (this.responsiveColumnSize != undefined && typeof this.responsiveColumnSize == "object") {
        			names.forEach((name) => {
        				if (this.responsiveColumnSize[name] == undefined) {
        					namesErr.push({name:name, message: `Missing key : ${name}\nObject sample that you need to provide :\n{sm: 12, md: "6", lg: 6, xl: 8}`})
        					this.responsiveColumnSize[name] = 12;
        				} else {
        					if (isNaN(Number(this.responsiveColumnSize[name])) ) {
        						namesErr.push({name:name, message: `Not a number value : ...,${name}: ${this.responsiveColumnSize[name]},...\nObject sample that you need to provide :\n{sm: 12, md: 6, lg: 6, xl: "8"}`})
        						this.responsiveColumnSize[name] = 12;
        					} else {						
        						if (Number(this.responsiveColumnSize[name]) < 1 && Number(this.responsiveColumnSize[name]) < 13) {
        							namesErr.push({name:name, message: "Value provided isn''t correct, have to be between 1 and 12"})
        							this.responsiveColumnSize[name] = 12;
        						}
        					}
        				}
        			})
        		} else {
        			this.responsiveColumnSize = {sm: 12, md: 12, lg: 12, xl: 12}
        		}
        		if (namesErr.length > 0) {
        			namesErr.forEach((nameErr) => {
        				console.error(nameErr.message);
        			})
        		}
        	}
        	
        	/**
        	 * Init chart size.
        	 */
        	public initChartSize(): void {
        	  // Attendre un cycle de détection de changement pour éviter l''accès à un élément non rendu
        	  setTimeout(() => {
        		if (!this.datavizCompContent || !this.datavizCompContent.nativeElement) {
        			console.warn(''[initChartSize] datavizCompContainer is not available yet.'');
        			const containerWidth = this.getCompWidth(window.innerWidth) - 100;
        			const containerHeight = ((this.type != ''bar'') ? ((this.defaultHeight != undefined && this.defaultHeight > 0) ? this.defaultHeight : 300) : (this.getCompHeightOnScroll(this.custLength, 40)));
        			this.chartOptions = {
        				type: this.type,
        				height: containerHeight + ''px'',
        				width: containerWidth + ''px''
        			}
        			return;
        	  	}
        		
        	    const containerWidth = this.datavizCompContent.nativeElement?.clientWidth || this.getCompWidth(window.innerWidth) - 100;
        	    const containerHeight = this.datavizCompContent.nativeElement?.clientHeight || ((this.type != ''bar'') ? ((this.defaultHeight != undefined && this.defaultHeight > 0) ? this.defaultHeight : 300) : (this.getCompHeightOnScroll(this.custLength, 40)));
        		this.chartOptions = {
        			type: this.type,
        			height: containerHeight + ''px'',
        			width: containerWidth + ''px'',
        			zoom: {
        			   enabled: true,
        			   allowMouseWheelZoom: false,
        			},
        			events: this.datavizEvents
        		}
        		
        		console.warn(''[initChartSize] datavizCompContainer is now available.'')
        	  });
        	}
        	
        	/**
        	 * Build comp. height.
        	 * @param {number} numberOfElements - number of elements displayed in the graph.
        	 * @param {number} sizePerElement - size of each element we want.
        	 * @returns {number} height of the graph in px.
        	 */
        	public getCompHeightOnScroll(numberOfElements: number, sizePerElement: number = 40): number {
        		let defaultTmp = (typeof this.defaultHeight == "number" && this.defaultHeight > 0) ? this.defaultHeight : 400;
        		if (isNaN(sizePerElement) || isNaN(numberOfElements)) {
        			return defaultTmp;
        		}
        		console.warn(`[getCompHeightOnScroll] Taille par élément : ${sizePerElement}, Nombre d''éléments : ${numberOfElements}, Taille calculée : ${sizePerElement * numberOfElements}`)
        		return (this.maxHeightCardContent < sizePerElement * numberOfElements) ? sizePerElement * numberOfElements : ((this.isExpanded) ? this.maxHeightCardContent - 50 : defaultTmp);
        	}
        	
        	/**
        	 * Build comp. width.
        	 * @param {number} colWidth - default width of the col.
        	 * @param {number} ratio - ratio between 1 and 12.
        	 * @returns {number} width of the graph in px.
        	 */
        	public calculateWidth(colWidth: number, ratio: number): number {
        		// Vérifie si les paramètres sont valides
        		if (!colWidth || !ratio || ratio <= 0) {
        		   console.error(''[calculateWidth] Invalid column width or ratio'');
        		   return 0;
        		}
        
        	    // Calcule la largeur du composant
        	    const compWidth = (colWidth * ratio) / 12; // Ratio est basé sur une grille de 12 colonnes
        		return compWidth;
        	}
        	
        	/**
        	 * Build comp. width with reponsive col size.
        	 * @param {number} innerWidth - width of the window in px.
        	 * @returns {number} width of the graph in px.
        	 */
        	public getCompWidth(innerWidth: number): number {
        	    const colWidth = innerWidth;
        	    // Définit les ratios pour chaque point de rupture
        	    let ratio = 12; // Valeur par défaut (xs)
        	    if (colWidth > 1200) {
        	        ratio = this.isExpanded ? 12 : this.responsiveColumnSize[''xl'']; // xl
        	    } else if (colWidth > 992) {
        	        ratio = this.isExpanded ? 12 : this.responsiveColumnSize[''lg'']; // lg
        	    } else if (colWidth > 768) {
        	        ratio = this.isExpanded ? 12 : this.responsiveColumnSize[''md'']; // md
        	    } else if (colWidth > 576) {
        	        ratio = this.responsiveColumnSize[''sm'']; // sm
        	    }
        	    return this.calculateWidth(colWidth, ratio);
        	}
        
        	/**
        	 * Set the new width of the graph.
        	 * @param {number} targetWidth - new width of the window in px.
        	 */
        	public resizeChart(targetWidth : number = 0): void {
        		try {
        	    	let width: number = (targetWidth > 0) ? this.getCompWidth(targetWidth) - 100 : this.getCompWidth(window.innerWidth) - 100;
        	    	let height: number = (this.defaultHeight != undefined && this.defaultHeight > 0) ? this.defaultHeight : 300;
        			this.maxHeightCardContent = 300;
        			if (this.isExpanded) {
        		    	// Mode plein écran → Prend toute la taille de la fenêtre
        				let heightH = 100;
        				if (this.datavizCompHeader && this.datavizCompHeader.nativeElement) {
        					heightH = this.datavizCompHeader.nativeElement.clientHeight;
        				} else {
        					console.warn(''[resizeChart] Chart header is not available. Skipping soustraction.'');	
        				}
        				width = window.innerWidth - 100;
        				height = (this.type == ''bar'') ? this.getCompHeightOnScroll(this.custLength, 40) : window.innerHeight - heightH;
        				this.maxHeightCardContent =   window.innerHeight - heightH - 50;
        			} else {
        		    	// Taille normale basée sur le conteneur
        				if (this.datavizCompContent && this.datavizCompContent.nativeElement) {
        					width = this.datavizCompContent.nativeElement.clientWidth - 100;
        					height = this.datavizCompContent.nativeElement.clientHeight;
        					this.maxHeightCardContent =  this.datavizCompContent.nativeElement.clientHeight - 50;
        				} else {
        					console.warn(''[resizeChart] Chart container is not available. Skipping resize.'');	
        				}
        				
        				if (this.type == ''bar'') {
        					height = this.getCompHeightOnScroll(this.custLength, 40);
        				}
        			}
        			
        	
        	    	console.log(`[resizeChart] New chart size: ${width}x${height}`);
        			
        			this.chartOptions = {
        				type: this.type,
        				height: height,
        				width: width,
        				zoom: {
        					enabled: true,
        					allowMouseWheelZoom: false
        				},
        				events: this.datavizEvents
        			}
        		} catch(e) {
        			console.error(e)
        		}
          	}
        	
        	/**
        	 * Check if chart or grid could not be displayed
        	 * @returns {boolean}
        	 */
        	public isDataCompLoaded(): boolean {
        		if (
        			this.data?.options == undefined ||
        			this.data?.data == undefined || 
        			this.data?.options?.series[0]?.data.length == 0 ||
        			this.data?.data?.values?.length == 0
        		) {
        			return false;
        		}
        		
        		return true;
        	}
        	
        	/**
        	 * Check Array has a safe format
        	 * @param {Array<any>} values The values returned by the sequence
        	 * @returns {Array<any>}
        	 */
        	public getSafeGridArray(values: Array<any>): Array<any> {
        		try {
        			let tmp2 = values[0].length;
        			let tmp = values[0][0].length;
        		} catch(e) {
        			return values;
        		}
        		return values[0];
        	}
        	
        	/**
        	 * Set new date range.
        	 * @param {any} chartContext - context of the chart.
        	 * @param {any} xaxis - xaxis object.
        	 */
        	public handleZoomUsers(chartContext: any, {xaxis}: any): void {
        		this.zoomStarted.emit({ message: "zoom started" });
        
        		if (!xaxis || typeof xaxis.min !== ''number'' || typeof xaxis.max !== ''number'') {
        			this.zoomEnded.emit({ date: {start:'''', end: '''', reset: true}} );
        			return;
        		}
        
        		try {
        			// Convert epoch to Date object and then to ISO string
        			const zoomStartingISO = new Date(xaxis.min).toISOString();
        			const zoomEndingISO = new Date(xaxis.max).toISOString();
        
        			// Convert ISO string to "YYYY-MM-DD HH:MM:SS.SSS" format
        			const zoomStarting = zoomStartingISO.replace(''T'', '' '').slice(0, -1);
        			const zoomEnding = zoomEndingISO.replace(''T'', '' '').slice(0, -1);
        
        			this.zoomStart = zoomStarting;
        			this.zoomEnd = zoomEnding;
        					
        			this.ref.detectChanges();
        			this.zoomEnded.emit({ date: {start:this.zoomStart.split(" ")[0], end: this.zoomEnd.split(" ")[0], reset: false} });
        		} catch (error) {
        			console.error("Error in handleZoomUsers:", error);
        		}
        
        	}
        
        	/**
        	 * Reset the chart to its initial state.
        	 * @param {any} chartContext - context of the chart.
        	 * @param {any} opts - options object.
        	 * @returns {any} initial date range in the xaxis of the chart.
        	 */
        	public handleResetZoom(chartContext: any, opts: any): any {
        		this.ref.detectChanges();
        		return {
        	  		xaxis: {
        	   			min: this.filterVars.filter((it) => it.type == ''dateStart'')[0].value,
        	    		max: this.filterVars.filter((it) => it.type == ''dateEnd'')[0].value
        	  		}
        		}
        	}
        
        	/**
        	 * HostListener function that listen resize event and trigger functions to resize comp.
        	 * @param {any} event - event object.
        	 */
        	@HostListener(''window:resize'', [''$event''])
        	public onResize(event: any): void {
        		if (this.type != ''grid'') {			
        			this.ref.detectChanges();
        		    this.resizeChart(event.target.innerWidth);
        			this.ref.detectChanges();
        		}
        	}
        	
        	/*End_c8o_CompFunction*/
