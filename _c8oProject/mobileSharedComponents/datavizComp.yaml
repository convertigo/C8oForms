        //				 	zoomed: (chartContext: any, { xaxis }: any) => {
        //						this.handleZoomUsers(chartContext, { xaxis });
        //					},
        //					beforeResetZoom: (chartContext: any, opts: any) => {
        //						this.handleResetZoom(chartContext, opts);
        //					}
        //				}
        //			}
        //			console.log(this.chartOptions)
        		} catch(e) {
        			console.error(e)
        		}
        //		console.log(this.findPageOwner())
          	}
        	
        	/*End_c8o_CompFunction*/
