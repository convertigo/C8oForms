        		console.warn(''billPieChartContainer is now available.'')
        //		console.log(this.chartOptions)
        	  });
        	}
        	
        	/**
        	 * Build comp. width.
        	 * @param {number} colWidth - default width of the col.
        	 * @param {number} ratio - ratio between 1 and 12.
        	 * @returns {number} width of the graph in px.
        	 */
        	public calculateWidth(colWidth: number, ratio: number): number {
        		// Vérifie si les paramètres sont valides
        		if (!colWidth || !ratio || ratio <= 0) {
        		   console.error(''Invalid column width or ratio'');
        		   return 0;
        		}
        
        	    // Calcule la largeur du composant
        	    const compWidth = (colWidth * ratio) / 12; // Ratio est basé sur une grille de 12 colonnes
        		return compWidth;
        	}
        	
        	/**
        	 * Build comp. width with reponsive col size.
        	 * @param {number} innerWidth - width of the window in px.
        	 * @returns {number} width of the graph in px.
        	 */
        	public getCompWidth(innerWidth: number): number {
        	    const colWidth = innerWidth;
        	    // Définit les ratios pour chaque point de rupture
        	    let ratio = 12; // Valeur par défaut (xs)
        	    if (colWidth > 1200) {
        	        ratio = this.isExpanded ? 12 : this.responsiveColumnSize[''xl'']; // xl
        	    } else if (colWidth > 992) {
        	        ratio = this.isExpanded ? 12 : this.responsiveColumnSize[''lg'']; // lg
        	    } else if (colWidth > 768) {
        	        ratio = this.isExpanded ? 12 : this.responsiveColumnSize[''md'']; // md
        	    } else if (colWidth > 576) {
        	        ratio = this.responsiveColumnSize[''sm'']; // sm
        	    }
        	    return this.calculateWidth(colWidth, ratio);
        	}
        
        	/**
        	 * Set the new width of the graph.
        	 * @param {number} targetWidth - new width of the window in px.
        	 */
        	public resizeChart(targetWidth : number = 0): void {
        		try {
        //			console.log(this.chartOptions)
        	    	let width: number = (targetWidth > 0) ? this.getCompWidth(targetWidth) - 100 : this.getCompWidth(window.innerWidth) - 100;
        	    	let height: number = (this.defaultHeight != undefined && this.defaultHeight > 0) ? this.defaultHeight : 300;
        			
        			if (this.isExpanded) {
        		    	// Mode plein écran → Prend toute la taille de la fenêtre
        				let heightH = 100;
        				if (this.datavizCompHeader && this.datavizCompHeader.nativeElement) {
        					heightH = this.datavizCompHeader.nativeElement.clientHeight;
        				} else {
        					console.warn(''Chart header is not available. Skipping soustraction.'');	
        				}
        				width = window.innerWidth - 100;
        				height = window.innerHeight - heightH;
        			} else {
        		    	// Taille normale basée sur le conteneur
        				if (this.datavizCompContent && this.datavizCompContent.nativeElement) {
        					width = this.datavizCompContent.nativeElement.clientWidth - 100;
        					height = this.datavizCompContent.nativeElement.clientHeight;
        				} else {
        					console.warn(''Chart container is not available. Skipping resize.'');	
        				}
        			}
        	
        	    	console.log(`New chart size: ${width}x${height}`);
        	    	// Mettre à jour le graphique Apex ici
        //			this.chartOptions = {
        //				type: ''area'',
        //				height: height,
        //				width: width,
        //				zoom: {
        //					enabled: true,
        //					allowMouseWheelZoom: false
        //				},
