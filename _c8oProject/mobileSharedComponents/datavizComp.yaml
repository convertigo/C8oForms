        	/**
        	 * Check responsive column size.
        	 */
        	public checkResponsiveColumnSize() : void {
        		let names = ["sm", "md", "lg", "xl"]
        		let namesErr = []
        		if (this.responsiveColumnSize != undefined && typeof this.responsiveColumnSize == "object") {
        			names.forEach((name) => {
        				if (this.responsiveColumnSize[name] == undefined) {
        					namesErr.push({name:name, message: `Missing key : ${name}\nObject sample that you need to provide :\n{sm: 12, md: "6", lg: 6, xl: 8}`})
        					this.responsiveColumnSize[name] = 12;
        				} else {
        					if (isNaN(Number(this.responsiveColumnSize[name])) ) {
        						namesErr.push({name:name, message: `Not a number value : ...,${name}: ${this.responsiveColumnSize[name]},...\nObject sample that you need to provide :\n{sm: 12, md: 6, lg: 6, xl: "8"}`})
        						this.responsiveColumnSize[name] = 12;
        					} else {						
        						if (Number(this.responsiveColumnSize[name]) < 1 && Number(this.responsiveColumnSize[name]) < 13) {
        							namesErr.push({name:name, message: "Value provided isn''t correct, have to be between 1 and 12"})
        							this.responsiveColumnSize[name] = 12;
        						}
        					}
        				}
        			})
        		} else {
        			this.responsiveColumnSize = {sm: 12, md: 12, lg: 12, xl: 12}
        		}
        		if (namesErr.length > 0) {
        			namesErr.forEach((nameErr) => {
        				console.error(nameErr.message);
        			})
        		}
        //		console.log(this.responsiveColumnSize)
        	}
        
        	/**
        	 * Set new date range.
        	 * @param {any} chartContext - context of the chart.
        	 * @param {any} xaxis - xaxis object.
        	 */
        	public handleZoomUsers(chartContext: any, {xaxis}: any): void {
        			    this.zoomStarted.emit({ message: "zoom started" });
        
        			    if (!xaxis || typeof xaxis.min !== ''number'' || typeof xaxis.max !== ''number'') {
        					this.zoomEnded.emit({ date: {start:'''', end: '''', reset: true}} );
        			        return;
        			    }
        
        			    try {
        			        // Convert epoch to Date object and then to ISO string
        			        const zoomStartingISO = new Date(xaxis.min).toISOString();
        			        const zoomEndingISO = new Date(xaxis.max).toISOString();
        
        			        // Convert ISO string to "YYYY-MM-DD HH:MM:SS.SSS" format
        			        const zoomStarting = zoomStartingISO.replace(''T'', '' '').slice(0, -1);
        			        const zoomEnding = zoomEndingISO.replace(''T'', '' '').slice(0, -1);
        
        			        this.zoomStart = zoomStarting;
        			        this.zoomEnd = zoomEnding;
        					
        			        this.ref.detectChanges();
        			        this.zoomEnded.emit({ date: {start:this.zoomStart.split(" ")[0], end: this.zoomEnd.split(" ")[0], reset: false} });
        			    } catch (error) {
        			        console.error("Error in handleZoomUsers:", error);
        			    }
        
        	}
        	
        	/**
        	 * Reset the chart to its initial state.
        	 * @param {any} chartContext - context of the chart.
        	 * @param {any} opts - options object.
        	 * @returns {any} initial date range in the xaxis of the chart.
        	 */
        	public handleResetZoom(chartContext: any, opts: any): any {
        			this.ref.detectChanges();
        			return {
        	  			xaxis: {
        //	   				min: this.dateStart,
        //	    			max: this.dateEnd
        	  			}
        			}
        	}
        	
        	/**
        	 * HostListener function that listen resize event and trigger functions to resize comp.
        	 * @param {any} event - event object.
        	 */
        	@HostListener(''window:resize'', [''$event''])
          	public onResize(event: any): void {
        //		console.log(event)
        //		console.log(window.innerWidth)
        		this.ref.detectChanges();
        	    this.resizeChart(event.target.innerWidth);
        		this.ref.detectChanges();
          	}
        	
        	/**
        	 * Init chart size.
        	 */
        	public initChartSize(): void {
        	  // Attendre un cycle de détection de changement pour éviter l''accès à un élément non rendu
        	  setTimeout(() => {
        		if (!this.datavizCompContent || !this.datavizCompContent.nativeElement) {
        		  console.warn(''billPieChartContainer is not available yet.'');
        		  return;
        		}
        		
        	    const containerWidth = this.datavizCompContent.nativeElement.clientWidth || this.getCompWidth(window.innerWidth) - 100;
        	    const containerHeight = this.datavizCompContent.nativeElement.clientHeight || (this.defaultHeight != undefined && this.defaultHeight > 0) ? this.defaultHeight : 300; // Valeur par défaut
