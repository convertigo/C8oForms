        	private parseDropIndex(value: any): Array<number> {
        		if (Array.isArray(value)) {
        			return value.map((entry) => Number(entry)).filter((entry) => Number.isFinite(entry));
        		}
        		if (value == null || value === "") {
        			return [];
        		}
        		return String(value).split(",").map((entry) => Number(entry)).filter((entry) => Number.isFinite(entry));
        	}
        
        	private getCardChildrenLength(page: any, parentIndex: number): number {
        		const targetCardChild = this.targetCardChild || "childrenRefs";
        		const formItem = page?.formsList?.[parentIndex];
        		const flowItem = page?.form?.flows?.[page?.local?.currentIndex]?.elements?.[parentIndex];
        		const children = formItem?.[targetCardChild] ?? formItem?.childrenRefs ?? formItem?.children ?? flowItem?.[targetCardChild] ?? flowItem?.childrenRefs ?? flowItem?.children ?? [];
        		return Array.isArray(children) ? children.length : 0;
        	}
        
        	private normalizeDestinationIndex(page: any, destination: Array<number>, origin: Array<number>): Array<number> {
        		const normalized = [...destination];
        		if (this.card === true && normalized.length < origin.length && normalized.length > 0) {
        			const length = this.getCardChildrenLength(page, normalized[0]);
        			normalized.push(length);
        		}
        		return normalized;
        	}
        
        	private isEquivalentMoveDrop(event: any): boolean {
        		const dataTransfer = event?.dataTransfer;
        		if (dataTransfer == null || dataTransfer.getData("origin") !== "moved") {
        			this.setEquivalentMoveDrop(false);
        			return false;
        		}
        
        		const origin = this.parseDropIndex(dataTransfer.getData("index"));
        		const destination = this.normalizeDestinationIndex(this.pageOwner || this.owner || this, this.parseDropIndex(this.i), origin);
        		if (origin.length === 0 || destination.length === 0 || origin.length !== destination.length) {
        			this.setEquivalentMoveDrop(false);
        			return false;
        		}
        
        		const sameParent = origin.slice(0, -1).every((entry, index) => entry === destination[index]);
        		const originPosition = origin[origin.length - 1];
        		const destinationPosition = destination[destination.length - 1];
        		const equivalent = sameParent && (destinationPosition === originPosition || destinationPosition === originPosition + 1);
        		this.setEquivalentMoveDrop(equivalent);
        		return equivalent;
        	}
        
        	private isEquivalentMoveIndex(origin: Array<number>): boolean {
        		const page = this.pageOwner || this.owner || this;
        		const destination = this.normalizeDestinationIndex(page, this.parseDropIndex(this.i), origin);
        		if (origin.length === 0 || destination.length === 0 || origin.length !== destination.length) {
        			return false;
        		}
        		const sameParent = origin.slice(0, -1).every((entry, index) => entry === destination[index]);
        		const originPosition = origin[origin.length - 1];
        		const destinationPosition = destination[destination.length - 1];
        		return sameParent && (destinationPosition === originPosition || destinationPosition === originPosition + 1);
        	}
        
        	private setEquivalentMoveDrop(value: boolean): void {
        		if (this.local != null) {
        			this.local.skipEquivalentMoveDrop = value;
        			if (value === true) {
        				this.local.isOver = false;
        			}
        		}
        	}
        
        	public shouldSkipEquivalentMoveDrop(event: any): boolean {
        		const skip = this.isEquivalentMoveDrop(event);
        		if (skip === true) {
        			event?.preventDefault?.();
        			event?.stopPropagation?.();
        		}
        		return skip;
        	}
        
        	public shouldHideEquivalentMoveDrop(): boolean {
        		
        		return this.local?.skipEquivalentMoveDrop === true;
        //		const page = this.pageOwner || this.owner || this;
        //		const local = page?.local;
        //		if (local?.draggingOrigin !== "moved") {
        //			return this.local?.skipEquivalentMoveDrop === true;
        //		}
        //		return this.local?.skipEquivalentMoveDrop === true || this.isEquivalentMoveIndex(this.parseDropIndex(local.draggingOriginIndex));
        	}
