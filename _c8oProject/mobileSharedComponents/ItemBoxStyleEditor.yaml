        	public setSelectedBorderTokensAfterReset(tokens: any): void {
        		const width = this.cleanCssValue(tokens?.width) || this.getTargetDefaultBoxStyleValue("borderWidth");
        		const style = this.cleanCssValue(tokens?.style) || this.getTargetDefaultBoxStyleValue("borderStyle");
        		const color = this.cleanCssValue(tokens?.color) || this.getTargetDefaultBoxStyleValue("borderColor");
        		const borderValue = this.composeBorderValue(width, style, color);
        		const defaultBorderValue = this.composeBorderValue(this.getTargetDefaultBoxStyleValue("borderWidth"), this.getTargetDefaultBoxStyleValue("borderStyle"), this.getTargetDefaultBoxStyleValue("borderColor"));
        		const sideProperty = this.getBorderSideProperty(this.selectedBorderSide);
        		if (sideProperty == "") {
        			if (this.normalizeCssComparable(borderValue) == this.normalizeCssComparable(defaultBorderValue)) {
        				this.setTargetBoxStyleValue("border", "");
        				this.setTargetBoxStyleValue("borderWidth", "");
        				this.setTargetBoxStyleValue("borderStyle", "");
        				this.setTargetBoxStyleValue("borderColor", "");
        			}
        			else {
        				this.setTargetBoxStyleValue("border", borderValue);
        				this.setTargetBoxStyleValue("borderWidth", "");
        				this.setTargetBoxStyleValue("borderStyle", "");
        				this.setTargetBoxStyleValue("borderColor", "");
        			}
        		}
        		else if (this.normalizeCssComparable(borderValue) == this.normalizeCssComparable(defaultBorderValue)) {
        			this.setTargetBoxStyleValue(sideProperty, "");
        		}
        		else {
        			this.setTargetBoxStyleValue(sideProperty, borderValue);
        		}
        	}
        
