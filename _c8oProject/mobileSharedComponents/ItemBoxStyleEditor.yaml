        		const color = this.cleanCssValue(tokens?.color) || this.getTargetDefaultBoxStyleValue("borderColor");
        		const borderValue = this.composeBorderValue(width, style, color);
        		const defaultBorderValue = this.composeBorderValue(this.getTargetDefaultBoxStyleValue("borderWidth"), this.getTargetDefaultBoxStyleValue("borderStyle"), this.getTargetDefaultBoxStyleValue("borderColor"));
        		const sideProperty = this.getBorderSideProperty(this.selectedBorderSide);
        		if (sideProperty == "") {
