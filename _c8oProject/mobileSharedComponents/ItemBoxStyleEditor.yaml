            	position: relative;
            	min-width: 0;
            	height: 28px;
            	padding: 0;
            	border: 0;
            	border-left: 1px solid rgba(148, 163, 184, 0.22);
            	background: transparent;
            	color: #475569;
            	font-size: 18px;
            	font-weight: 300;
            	cursor: pointer;
            }
            .c8o-border-style-option:first-child{
            	border-left: 0;
            }
            .c8o-border-style-option:hover,
            .c8o-border-style-option.is-active{
            	background: #dbeafe;
            	color: #0f172a;
            }
            .c8o-style-line{
            	position: absolute;
            	left: 9px;
            	right: 9px;
            	top: 50%;
            	border-top: 1px solid #334155;
            }
            .c8o-style-line-solid{
            	border-top-style: solid;
            }
            .c8o-style-line-dashed{
            	border-top-style: dashed;
            }
            .c8o-style-line-dotted{
            	border-top-style: dotted;
            }
            .c8o-border-color-field{
            	display: grid;
            	grid-template-columns: 30px minmax(0, 1fr);
            	align-items: center;
            	height: 30px;
            	min-width: 0;
            	box-sizing: border-box;
            	border: 1px solid rgba(148, 163, 184, 0.42);
            	border-radius: 5px;
            	background: #ffffff;
            	overflow: hidden;
            }
            .c8o-border-color-swatch{
            	width: 30px;
            	height: 28px;
            	padding: 3px;
            	border: 0;
            	background: #f8fafc;
            	cursor: pointer;
            }
            .c8o-border-color-text{
            	width: 100%;
            	min-width: 0;
            	height: 28px;
            	padding: 0 8px;
            	border: 0;
            	background: transparent;
            	color: #0f172a;
            	font-size: 12px;
            	font-weight: 600;
            	outline: none;
            }
            .c8o-background-editor{
            	display: flex;
            	align-items: center;
            	gap: 8px;
            	width: min(340px, 100%);
            	max-width: 100%;
            	min-height: 40px;
            }
            .c8o-background-color-field{
            	flex: 1 1 auto;
            	width: min(220px, 100%);
            }
            @media (max-width: 560px){
            	.c8o-box-setting-row{
            		grid-template-columns: minmax(0, 1fr);
            		gap: 6px;
            	}
            	.c8o-box-setting-label{
            		min-height: auto;
            	}
            	.c8o-box-setting-control{
            		width: 100%;
            	}
            }
            @media (max-width: 360px){
            	.c8o-box-style-editor{
            		max-width: none;
            		padding: 0;
            	}
            	.c8o-box-model{
            		height: 194px;
            	}
            	.c8o-space-input{
            		width: 36px;
            	}
            	.c8o-padding-shell{
            		inset: 54px 50px 41px;
            	}
            	.c8o-box-label-padding{
            		left: 58px;
            		top: 62px;
            	}
            	.c8o-space-input-pad-top{
            		top: 72px;
            	}
            	.c8o-space-input-pad-bottom{
            		bottom: 42px;
            	}
            	.c8o-space-input-pad-left{
            		left: 58px;
            	}
            	.c8o-space-input-pad-right{
            		right: 58px;
            	}
            	.c8o-border-radius-row{
            		grid-template-columns: 48px 28px minmax(62px, 1fr) 56px;
            		gap: 7px;
            	}
            	.c8o-border-body{
            		grid-template-columns: 82px minmax(0, 1fr);
            		gap: 8px;
            	}
            	.c8o-border-control-row{
            		grid-template-columns: 44px minmax(0, 1fr);
            		gap: 7px;
            	}
            	.c8o-border-side-picker{
            		width: 74px;
            	}
            }'