        	public getChildStyleParentDefaults(parentType: any, property: string): string {
        		if (this.getBoxPartTarget() != "container") {
        			return this.getBoxPartDefaultStyleValue(property);
        		}
        		if (property == "textColor") {
        			return "";
        		}
        		const normalizedParentType = "" + (parentType || "");
        		if (property == "verticalAlign" && normalizedParentType != "layout") {
        			return "";
        		}
        		if (normalizedParentType == "ion-card" || normalizedParentType == "card") {
        			const cardChildDefaults: any = {
        				margin: "0",
        				padding: "0",
        				borderWidth: "0",
        				borderStyle: "solid",
        				borderColor: "#E5E7EB",
        				borderRadius: "0",
        				backgroundColor: "#FFFFFF"
        			};
        			return cardChildDefaults[property] || "";
        		}
        		const layoutChildDefaults: any = {
        			margin: "0 10px 10px 0",
        			padding: "20px 27px",
        			borderWidth: "1px",
        			borderStyle: "solid",
        			borderColor: "#E5E7EB",
        			borderRadius: "10px",
        			backgroundColor: "#FFFFFF",
        			verticalAlign: "stretch"
        		};
        		return layoutChildDefaults[property] || "";
        	}
        
        	public isChildStyleParentType(parentType: any): boolean {
        		const normalizedParentType = "" + (parentType || "");
        		return normalizedParentType == "layout" || normalizedParentType == "ion-card" || normalizedParentType == "card";
        	}
        
        	public getChildStyleContextType(): string {
        		if (this.isLayoutSpacingEditor()) {
        			return "" + (this.item?.type || "");
        		}
        		return this.getBoxStyleParentType();
        	}
        
        	public getDefaultBoxStyleValue(property: string): string {
        		if (this.getBoxPartTarget() != "container") {
        			return this.getBoxPartDefaultStyleValue(property);
        		}
        		if (property == "textColor") {
        			return "";
        		}
        		if (property == "verticalAlign" && this.getBoxPartTarget() != "container") {
        			return "";
        		}
        		if ((this.isChild !== true && this.isChild !== "true") && this.item?.type == "layout") {
        			const layoutRootDefaults: any = {
        				margin: "0",
        				padding: "0",
        				borderWidth: "0",
        				borderStyle: "solid",
        				borderColor: "#E5E7EB",
        				borderRadius: "0",
        				backgroundColor: "transparent"
        			};
        			return layoutRootDefaults[property] || "";
        		}
        		const parentType = this.getBoxStyleParentType();
        		if (this.isChildStyleParentType(parentType)) {
        			return this.getChildStyleParentDefaults(parentType, property);
        		}
        		const defaults: any = {
        			margin: "0 0 10px 0",
        			padding: "20px 27px",
        			borderWidth: "1px",
        			borderStyle: "solid",
        			borderColor: "#E5E7EB",
        			borderRadius: "10px",
        			backgroundColor: "#FFFFFF"
        		};
        		return defaults[property] || "";
        	}
        
        	public isLayoutSpacingEditor(): boolean {
        		return (this.isChild !== true && this.isChild !== "true") && this.isChildStyleParentType(this.item?.type);
        	}
        
        	public isLayoutChildStyleEditor(): boolean {
        		return (this.isChild === true || this.isChild === "true") && this.isChildStyleParentType(this.getBoxStyleParentType());
        	}
        
        	public getStyleSelfTargetLabelKey(): string {
        		const itemType = "" + (this.item?.type || "");
        		return itemType == "ion-card" || itemType == "card" ? "item_box_spacing_target_group" : "item_box_spacing_target_layout";
        	}
        
        	public getChildStyleHintKey(section: string): string {
        		const parentType = this.getBoxStyleParentType();
        		const prefix = parentType == "ion-card" || parentType == "card" ? "item_box_group_child_" : "item_box_layout_child_";
        		if (section == "border") {
        			return prefix + "border_hint";
        		}
        		if (section == "background") {
        			return prefix + "background_hint";
        		}
        		return prefix + "spacing_hint";
        	}
        
        	public getSpacingTarget(): string {
        		if (!this.isLayoutSpacingEditor()) {
        			return "self";
        		}
        		const allowed = ["self", "children", "first", "last"];
        		return allowed.indexOf(this.selectedSpacingTarget) != -1 ? this.selectedSpacingTarget : "children";
        	}
        
        	public getSpacingTargetToggleOptions(): string[] {
        		return [this.getStyleSelfTargetLabelKey(), "item_box_spacing_target_children", "item_box_spacing_target_first", "item_box_spacing_target_last"];
        	}
        
        	public getSpacingTargetToggleModel(): string {
        		const target = this.getSpacingTarget();
        		if (target == "self") {
        			return this.getStyleSelfTargetLabelKey();
        		}
        		if (target == "first") {
        			return "item_box_spacing_target_first";
        		}
        		if (target == "last") {
        			return "item_box_spacing_target_last";
        		}
        		return "item_box_spacing_target_children";
        	}
        
        	public selectSpacingTargetFromToggle(event: any): void {
        		const value = event?.out?.item || event?.out || event;
        		if (value == this.getStyleSelfTargetLabelKey() || value == "item_box_spacing_target_layout" || value == "item_box_spacing_target_group") {
        			this.selectSpacingTarget("self", event);
        			return;
        		}
        		if (value == "item_box_spacing_target_first") {
        			this.selectSpacingTarget("first", event);
        			return;
        		}
        		if (value == "item_box_spacing_target_last") {
        			this.selectSpacingTarget("last", event);
        			return;
        		}
        		this.selectSpacingTarget("children", event);
        	}
        
        	public getSpacingStorageKey(target: string = ""): string {
        		const spacingTarget = target || this.getSpacingTarget();
        		return spacingTarget == "children" ? "default" : spacingTarget;
        	}
        
        	public showBoxPartTargetTabs(): boolean {
        		if (this.isForcedBoxPartTarget()) {
        			return false;
        		}
        		if (this.isLayoutSpacingEditor() && this.getSpacingTarget() == "self") {
        			return false;
        		}
        		return this.getBoxPartTargetToggleOptions().length > 1;
        	}
        
        	public getBoxStyleItemType(): string {
        		return "" + (this.item?.type || "");
        	}
        
        	public isApplicationBoxStyleEditor(): boolean {
        		return this.item != null && this.form != null && this.item === this.form;
        	}
        
        	public isPageBoxStyleEditor(): boolean {
        		if (this.item == null || this.isApplicationBoxStyleEditor()) {
        			return false;
        		}
        		if (this.form != null && Array.isArray(this.form.pages) && this.form.pages.indexOf(this.item) != -1) {
        			return true;
        		}
        		return this.item.pageTechName != null && this.item.config != null;
        	}
        
        	public showInheritedScopeStyleNote(): boolean {
        		if (this.isChild === true || this.isChild === "true") {
        			return false;
        		}
        		return this.isApplicationBoxStyleEditor() || this.isPageBoxStyleEditor();
        	}
        
        	public getInheritedScopeStyleNoteKey(): string {
        		return this.isApplicationBoxStyleEditor() ? "item_box_application_style_note" : "item_box_page_style_note";
        	}
        
        	public normalizeVerticalAlignValue(value: any): string {
        		const normalized = this.cleanCssValue(value).toLowerCase();
        		if (normalized == "top" || normalized == "start" || normalized == "flex-start") {
        			return "start";
        		}
        		if (normalized == "bottom" || normalized == "end" || normalized == "flex-end") {
        			return "end";
        		}
        		if (normalized == "center" || normalized == "middle") {
        			return "center";
        		}
        		if (normalized == "stretch" || normalized == "fill") {
        			return "stretch";
        		}
        		return "";
        	}
        
        	public showLayoutVerticalAlignSettings(): boolean {
        		if (this.getBoxPartTarget() != "container") {
        			return false;
        		}
        		if (this.isLayoutSpacingEditor()) {
        			return this.getChildStyleContextType() == "layout" && this.getSpacingTarget() != "self";
        		}
        		return this.isLayoutChildStyleEditor() && this.getBoxStyleParentType() == "layout";
        	}
        
        	public isLayoutChildVerticalAlignEditor(): boolean {
        		return !this.isLayoutChildrenStyleTarget() && this.isLayoutChildStyleEditor() && this.getBoxStyleParentType() == "layout";
        	}
        
        	public getVerticalAlignLabelKey(value: any): string {
        		const normalized = this.normalizeVerticalAlignValue(value);
        		if (normalized == "start") {
        			return "item_box_vertical_align_top";
        		}
        		if (normalized == "center") {
        			return "item_box_vertical_align_center";
        		}
        		if (normalized == "end") {
        			return "item_box_vertical_align_bottom";
        		}
        		return "item_box_vertical_align_stretch";
        	}
        
        	public getVerticalAlignEditorLabelKey(): string {
        		return this.isLayoutChildVerticalAlignEditor() ? "item_box_vertical_align_child" : "item_box_vertical_align";
        	}
        
        	public getVerticalAlignTooltipKey(): string {
        		return this.isLayoutChildVerticalAlignEditor() ? "item_box_vertical_align_child_tooltip" : "item_box_vertical_align_tooltip";
        	}
        
        	public getVerticalAlignToggleOptions(): string[] {
        		const options = ["item_box_vertical_align_stretch", "item_box_vertical_align_top", "item_box_vertical_align_center", "item_box_vertical_align_bottom"];
        		if (this.isLayoutChildVerticalAlignEditor()) {
        			options.unshift("item_box_default");
        		}
        		return options;
        	}
        
        	public getVerticalAlignToggleModel(): string {
        		const value = this.normalizeVerticalAlignValue(this.getTargetBoxStyleValue("verticalAlign"));
        		if (this.isLayoutChildVerticalAlignEditor() && value == "") {
        			return "item_box_default";
        		}
        		return this.getVerticalAlignLabelKey(value || this.getTargetDefaultBoxStyleValue("verticalAlign") || "stretch");
        	}
        
        	public selectVerticalAlignFromToggle(event: any): void {
        		const value = event?.out?.item || event?.out || event;
        		if (value == "item_box_default") {
        			this.setTargetBoxStyleValue("verticalAlign", "");
        		}
        		else if (value == "item_box_vertical_align_top") {
        			this.setTargetBoxStyleValue("verticalAlign", "start");
        		}
        		else if (value == "item_box_vertical_align_center") {
        			this.setTargetBoxStyleValue("verticalAlign", "center");
        		}
        		else if (value == "item_box_vertical_align_bottom") {
        			this.setTargetBoxStyleValue("verticalAlign", "end");
        		}
        		else {
        			this.setTargetBoxStyleValue("verticalAlign", "stretch");
        		}
        		this.notifyBoxStyleChange();
        	}
        
        	public isForcedComponentBoxPartTarget(): boolean {
        		const itemType = this.getBoxStyleItemType();
        		return itemType == "button";
        	}
        
        	public isForcedContainerBoxPartTarget(): boolean {
        		const itemType = this.getBoxStyleItemType();
        		return itemType == "description";
        	}
        
        	public isForcedBoxPartTarget(): boolean {
        		return this.isForcedComponentBoxPartTarget() || this.isForcedContainerBoxPartTarget();
        	}
        
        	public getBoxPartTargetToggleOptions(): string[] {
        		if (this.isForcedComponentBoxPartTarget()) {
        			return ["item_box_part_target_component"];
        		}
        		if (this.isForcedContainerBoxPartTarget()) {
        			return ["item_box_part_target_container"];
        		}
        		return ["item_box_part_target_container", "item_box_part_target_question", "item_box_part_target_component"];
        	}
        
        	public getAllowedBoxPartTargets(): string[] {
        		const options = this.getBoxPartTargetToggleOptions();
        		const targets: string[] = [];
        		for (let i = 0; i < options.length; i++) {
        			if (options[i] == "item_box_part_target_question") {
        				targets.push("question");
        			}
        			else if (options[i] == "item_box_part_target_component") {
        				targets.push("component");
        			}
        			else {
        				targets.push("container");
        			}
        		}
        		return targets;
        	}
        
        	public getBoxPartTarget(): string {
        		if (this.isForcedComponentBoxPartTarget()) {
        			return "component";
        		}
        		if (this.isForcedContainerBoxPartTarget()) {
        			return "container";
        		}
        		if (!this.showBoxPartTargetTabs()) {
        			return "container";
        		}
        		const allowed = this.getAllowedBoxPartTargets();
        		return allowed.indexOf(this.selectedBoxStylePart) != -1 ? this.selectedBoxStylePart : "container";
        	}
        
        	public getBoxPartTargetToggleModel(): string {
        		const target = this.getBoxPartTarget();
        		if (target == "question") {
        			return "item_box_part_target_question";
        		}
        		if (target == "component") {
        			return "item_box_part_target_component";
        		}
        		return "item_box_part_target_container";
        	}
        
        	public selectBoxPartTargetFromToggle(event: any): void {
        		const value = event?.out?.item || event?.out || event;
        		if (value == "item_box_part_target_question") {
        			this.selectBoxPartTarget("question", event);
        			return;
        		}
        		if (value == "item_box_part_target_component") {
        			this.selectBoxPartTarget("component", event);
        			return;
        		}
        		this.selectBoxPartTarget("container", event);
        	}
        
        	public getBoxPartStyleKey(part: string = ""): string {
        		const boxPart = part || this.getBoxPartTarget();
        		if (boxPart == "question") {
        			return "questionBoxStyle";
        		}
        		if (boxPart == "component") {
        			return "componentBoxStyle";
        		}
        		return "boxStyle";
        	}
        
        	public getBoxPartDefaultStyleValue(property: string): string {
        		if (property == "textColor") {
        			return "";
        		}
        		if (this.getBoxStyleItemType() == "button" && this.getBoxPartTarget() == "component") {
        			const buttonDefaults: any = {
        				margin: "0 0 10px 0",
        				padding: "20px 27px"
        			};
        			if (buttonDefaults[property] != null) {
        				return buttonDefaults[property];
        			}
        		}
        		const defaults: any = {
        			margin: "0",
        			padding: "0",
        			borderWidth: "0",
        			borderStyle: "solid",
        			borderColor: "#E5E7EB",
        			borderRadius: "0",
        			backgroundColor: "#FFFFFF"
        		};
        		return defaults[property] || "";
        	}
        
        	public selectBoxPartTarget(part: string, event?: any): void {
        		try {
        			event?.preventDefault?.();
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		const allowed = this.getAllowedBoxPartTargets();
        		this.selectedBoxStylePart = allowed.indexOf(part) != -1 ? part : (allowed[0] || "container");
        		this.spacingValueEditor = null;
        		this.borderValueEditor = null;
        		this.removeSpacingCloseListener();
        		try {
        			this.ref.markForCheck();
        		}
        		catch (e) {
        		}
        	}
        
        	public boxPartTargetMatches(part: string): boolean {
        		return this.getBoxPartTarget() == part;
        	}
        
        	public showColorSettings(): boolean {
        		const itemType = this.getBoxStyleItemType();
        		const target = this.getBoxPartTarget();
        		if (itemType == "signature" && target == "container") {
        			return false;
        		}
        		return true;
        	}
        
        	public selectSpacingTarget(target: string, event?: any): void {
        		try {
        			event?.preventDefault?.();
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		this.selectedSpacingTarget = target;
        		this.spacingValueEditor = null;
        		this.borderValueEditor = null;
        		this.removeSpacingCloseListener();
        		try {
        			this.ref.markForCheck();
        		}
        		catch (e) {
        		}
        	}
        
        	public spacingTargetMatches(target: string): boolean {
        		return this.getSpacingTarget() == target;
        	}
        
        	public getLayoutChildrenBaseSpacingValue(property: string): string {
        		return this.getLayoutChildrenBaseStyleValue(property);
        	}
        
        	public getLayoutChildrenBaseStyleValue(property: string): string {
        		if (this.getBoxPartTarget() != "container") {
        			return this.getBoxPartDefaultStyleValue(property);
        		}
        		return this.getChildStyleParentDefaults(this.getChildStyleContextType(), property);
        	}
        
        	public getLayoutLastSpacingDefaultValue(property: string, defaultValue: any): string {
        		const value = this.cleanCssValue(defaultValue) || this.getLayoutChildrenBaseSpacingValue(property);
        		if (this.getBoxPartTarget() != "container" || this.getChildStyleContextType() != "layout" || property != "margin") {
        			return value;
        		}
        		const map = this.getMapFromShorthand(value);
        		map.right = "0";
        		return this.serializeBoxMap(map);
        	}
        
        	public getLayoutChildrenSpacingStyle(target: string = "", create: boolean = false, part: string = ""): any {
        		if (this.item == null) {
        			return null;
        		}
        		if (this.item.config == null) {
        			if (!create) {
        				return null;
        			}
        			this.item.config = {};
        		}
        		if (this.item.config.layoutChildrenStyle == null || typeof this.item.config.layoutChildrenStyle != "object" || Array.isArray(this.item.config.layoutChildrenStyle)) {
        			if (!create) {
        				return null;
        			}
        			this.item.config.layoutChildrenStyle = {};
        		}
        		const key = this.getSpacingStorageKey(target);
        		if (this.item.config.layoutChildrenStyle[key] == null || typeof this.item.config.layoutChildrenStyle[key] != "object" || Array.isArray(this.item.config.layoutChildrenStyle[key])) {
        			if (!create) {
        				return null;
        			}
        			this.item.config.layoutChildrenStyle[key] = {};
        		}
        		const scopeStyle = this.item.config.layoutChildrenStyle[key];
        		const boxPart = part || this.getBoxPartTarget();
        		if (boxPart == "container") {
        			return scopeStyle;
        		}
        		const partKey = this.getBoxPartStyleKey(boxPart);
        		if (scopeStyle[partKey] == null || typeof scopeStyle[partKey] != "object" || Array.isArray(scopeStyle[partKey])) {
        			if (!create) {
        				return null;
        			}
        			scopeStyle[partKey] = {};
        		}
        		return scopeStyle[partKey];
        	}
        
        	public cleanupLayoutChildrenStyle(scopeKey: string, part: string = ""): void {
        		if (this.item?.config?.layoutChildrenStyle == null) {
        			return;
        		}
        		const key = scopeKey || this.getSpacingStorageKey();
        		const boxPart = part || this.getBoxPartTarget();
        		const scopeStyle = this.item.config.layoutChildrenStyle[key];
        		if (scopeStyle == null || typeof scopeStyle != "object" || Array.isArray(scopeStyle)) {
        			return;
        		}
        		if (boxPart != "container") {
        			const partKey = this.getBoxPartStyleKey(boxPart);
        			if (scopeStyle[partKey] != null && typeof scopeStyle[partKey] == "object" && !Array.isArray(scopeStyle[partKey]) && Object.keys(scopeStyle[partKey]).length == 0) {
        				delete scopeStyle[partKey];
        			}
        		}
        		if (Object.keys(scopeStyle).length == 0) {
        			delete this.item.config.layoutChildrenStyle[key];
        		}
        		if (Object.keys(this.item.config.layoutChildrenStyle).length == 0) {
        			delete this.item.config.layoutChildrenStyle;
        		}
        	}
        
        	public getSpacingBoxStyleValue(property: string): string {
        		if (this.getSpacingTarget() == "self") {
        			return this.getBoxStyleValue(property);
        		}
        		const style = this.getLayoutChildrenSpacingStyle();
        		const value = style?.[property];
        		return value == null ? "" : "" + value;
        	}
        
        	public setSpacingBoxStyleValue(property: string, value: any): void {
        		if (this.getSpacingTarget() == "self") {
        			this.setBoxStyleValue(property, value);
        			return;
        		}
        		const style = this.getLayoutChildrenSpacingStyle("", true);
        		if (style == null) {
        			return;
        		}
        		const normalized = this.cleanCssValue(value);
        		if (normalized == "") {
        			delete style[property];
        		}
        		else {
        			style[property] = normalized;
        		}
        		const key = this.getSpacingStorageKey();
        		this.cleanupLayoutChildrenStyle(key);
        	}
        
        	public getSpacingDefaultValue(property: string): string {
        		const target = this.getSpacingTarget();
        		if (target == "self") {
        			return this.getDefaultBoxStyleValue(property);
        		}
        		if (target == "children") {
        			return this.getLayoutChildrenBaseSpacingValue(property);
        		}
        		const defaultStyle = this.getLayoutChildrenSpacingStyle("children");
        		const value = this.cleanCssValue(defaultStyle?.[property]);
        		const defaultValue = value != "" ? value : this.getLayoutChildrenBaseSpacingValue(property);
        		return target == "last" ? this.getLayoutLastSpacingDefaultValue(property, defaultValue) : defaultValue;
        	}
        
        	public getEffectiveSpacingValue(property: string): string {
        		const value = this.cleanCssValue(this.getSpacingBoxStyleValue(property));
        		return value != "" ? value : this.getSpacingDefaultValue(property);
        	}
        
        	public setSpacingOverrideValue(property: string, value: any, _defaultValue: any): void {
        		const normalized = this.cleanCssValue(value);
        		this.setSpacingBoxStyleValue(property, normalized);
        	}
        
        	public isLayoutChildrenStyleTarget(): boolean {
        		return this.isLayoutSpacingEditor() && this.getSpacingTarget() != "self";
        	}
        
        	public getTargetBoxStyleValue(property: string): string {
        		if (!this.isLayoutChildrenStyleTarget()) {
        			return this.getBoxStyleValue(property);
        		}
        		const style = this.getLayoutChildrenSpacingStyle();
        		const value = style?.[property];
        		return value == null ? "" : "" + value;
        	}
        
        	public setTargetBoxStyleValue(property: string, value: any): void {
        		if (!this.isLayoutChildrenStyleTarget()) {
        			this.setBoxStyleValue(property, value);
        			return;
        		}
        		this.setSpacingBoxStyleValue(property, value);
        	}
        
        	public getTargetDefaultBoxStyleValue(property: string): string {
        		if (!this.isLayoutChildrenStyleTarget()) {
        			return this.getDefaultBoxStyleValue(property);
        		}
        		const target = this.getSpacingTarget();
        		if (target == "children") {
        			return this.getLayoutChildrenBaseStyleValue(property);
        		}
        		const defaultStyle = this.getLayoutChildrenSpacingStyle("children");
        		const value = this.cleanCssValue(defaultStyle?.[property]);
        		const defaultValue = value != "" ? value : this.getLayoutChildrenBaseStyleValue(property);
        		return target == "last" ? this.getLayoutLastSpacingDefaultValue(property, defaultValue) : defaultValue;
        	}
        
        	public getEffectiveTargetBoxStyleValue(property: string): string {
        		const value = this.cleanCssValue(this.getTargetBoxStyleValue(property));
        		if (property == "textColor") {
        			const lower = value.toLowerCase();
        			if (lower == "none" || lower == "unset") {
        				return "";
        			}
        			if (lower == "auto") {
        				return this.getTargetDefaultBoxStyleValue(property);
        			}
        		}
        		return value != "" ? value : this.getTargetDefaultBoxStyleValue(property);
        	}
        
        	public setTargetBoxStyleOverrideValue(property: string, value: any, _defaultValue: any): void {
        		const normalized = this.cleanCssValue(value);
        		this.setTargetBoxStyleValue(property, normalized);
        	}
        
        	public getBoxStyleParentType(): string {
        		if (this.isChild !== true && this.isChild !== "true") {
        			return "";
        		}
        		const index = parseInt("" + this.idForm, 10);
        		let parent: any = null;
        		if (!isNaN(index)) {
        			parent = this.form?.formulaire?.[index] || this.pageOwner?.formsList?.[index];
        		}
        		if (parent == null) {
        			parent = this.findBoxStyleParentByChildId();
        		}
        		return parent?.type != null ? "" + parent.type : "";
        	}
        
        	public findBoxStyleParentByChildId(): any {
        		const childId = this.item?.id;
        		const list = this.form?.formulaire || this.pageOwner?.formsList || [];
        		if (childId == null || !Array.isArray(list)) {
        			return null;
        		}
        		for (let i = 0; i < list.length; i++) {
        			const parent = list[i];
        			const refs = parent?.childrenRefs || [];
        			if (Array.isArray(refs)) {
        				for (let j = 0; j < refs.length; j++) {
        					const ref = refs[j];
        					if (("" + ref) == ("" + childId) || (ref?.id != null && ("" + ref.id) == ("" + childId))) {
        						return parent;
        					}
        				}
        			}
        		}
        		return null;
        	}
        
        	public getBoxStyleValue(property: string): string {
        		const partKey = this.getBoxPartStyleKey();
        		const value = this.item?.config?.[partKey]?.[property];
        		return value == null ? "" : "" + value;
        	}
        
        	public getEffectiveBoxStyleValue(property: string): string {
        		const value = this.cleanCssValue(this.getBoxStyleValue(property));
        		return value != "" ? value : this.getDefaultBoxStyleValue(property);
        	}
        
        	public setBoxStyleValue(property: string, value: any): void {
        		if (this.item == null) {
        			return;
        		}
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		const partKey = this.getBoxPartStyleKey();
        		if (this.item.config[partKey] == null || typeof this.item.config[partKey] != "object" || Array.isArray(this.item.config[partKey])) {
        			this.item.config[partKey] = {};
        		}
        		const normalized = this.cleanCssValue(value);
        		if (normalized == "") {
        			delete this.item.config[partKey][property];
        		}
        		else {
        			this.item.config[partKey][property] = normalized;
        		}
        		if (Object.keys(this.item.config[partKey]).length == 0) {
        			delete this.item.config[partKey];
        		}
        	}
        
        	public cleanCssValue(value: any): string {
        		if (value == null) {
        			return "";
        		}
        		return ("" + value).replace(/\s*!important\s*/ig, "").trim();
        	}
        
        	public getDefaultTextColorValue(): string {
        		return this.getAutomaticTextColorForBackground(this.getEffectiveTargetBoxStyleValue("backgroundColor"));
        	}
        
        	public getAutomaticTextColorForBackground(backgroundColor: any): string {
        		const rgb = this.getRgbFromCssColor(backgroundColor);
        		if (rgb == null) {
        			return "#000000";
        		}
        		const r = this.getLinearRgbChannel(rgb.r);
        		const g = this.getLinearRgbChannel(rgb.g);
        		const b = this.getLinearRgbChannel(rgb.b);
        		const luminance = (0.2126 * r) + (0.7152 * g) + (0.0722 * b);
        		const blackContrast = (luminance + 0.05) / 0.05;
        		const whiteContrast = 1.05 / (luminance + 0.05);
        		return blackContrast >= whiteContrast ? "#000000" : "#FFFFFF";
        	}
        
        	public getRgbFromCssColor(value: any): any {
        		const color = this.cleanCssValue(value).toLowerCase();
        		if (color == "" || color == "transparent") {
        			return {r: 255, g: 255, b: 255};
        		}
        		let match = color.match(/^#([0-9a-f]{3})$/i);
        		if (match != null) {
        			return {
        				r: parseInt(match[1].charAt(0) + match[1].charAt(0), 16),
        				g: parseInt(match[1].charAt(1) + match[1].charAt(1), 16),
        				b: parseInt(match[1].charAt(2) + match[1].charAt(2), 16)
        			};
        		}
        		match = color.match(/^#([0-9a-f]{6})$/i);
        		if (match != null) {
        			return {
        				r: parseInt(match[1].substring(0, 2), 16),
        				g: parseInt(match[1].substring(2, 4), 16),
        				b: parseInt(match[1].substring(4, 6), 16)
        			};
        		}
        		match = color.match(/^rgba?\(\s*([0-9.]+)\s*,\s*([0-9.]+)\s*,\s*([0-9.]+)/i);
        		if (match != null) {
        			return {
        				r: Math.max(0, Math.min(255, parseFloat(match[1]))),
        				g: Math.max(0, Math.min(255, parseFloat(match[2]))),
        				b: Math.max(0, Math.min(255, parseFloat(match[3])))
        			};
        		}
        		return null;
        	}
        
        	public getLinearRgbChannel(value: any): number {
        		const channel = Math.max(0, Math.min(255, parseFloat("" + value))) / 255;
        		return channel <= 0.03928 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
        	}
        
        	public normalizeCssComparable(value: any): string {
        		let normalized = this.cleanCssValue(value)
        			.toLowerCase()
        			.replace(/\s+/g, " ")
        			.replace(/\b0(?:px|em|rem|%|vh|vw)\b/g, "0")
        			.trim();
        		if (/^rgb\(\s*246\s*,\s*246\s*,\s*246\s*\)$/.test(normalized)) {
        			return "#f6f6f6";
        		}
        		if (/^rgb\(\s*229\s*,\s*231\s*,\s*235\s*\)$/.test(normalized)) {
        			return "#e5e7eb";
        		}
        		if (/^rgb\(\s*255\s*,\s*255\s*,\s*255\s*\)$/.test(normalized)) {
        			return "#ffffff";
        		}
        		return normalized;
        	}
        
        	public setBoxStyleOverrideValue(property: string, value: any, _defaultValue: any): void {
        		const normalized = this.cleanCssValue(value);
        		this.setBoxStyleValue(property, normalized);
        	}
        
        	public splitCssValue(value: any): string[] {
        		const text = this.cleanCssValue(value);
        		const parts = [];
        		let token = "";
        		let depth = 0;
        		for (let i = 0; i < text.length; i++) {
        			const c = text.charAt(i);
        			if (c == "(") {
        				depth++;
        			}
        			else if (c == ")" && depth > 0) {
        				depth--;
        			}
        			if (/\s/.test(c) && depth == 0) {
        				if (token.trim() != "") {
        					parts.push(token.trim());
        					token = "";
        				}
        			}
        			else {
        				token += c;
        			}
        		}
        		if (token.trim() != "") {
        			parts.push(token.trim());
        		}
        		return parts;
        	}
        
        	public getMapFromShorthand(value: any): any {
        		const parts = this.splitCssValue(value);
        		const map: any = {top: "", right: "", bottom: "", left: ""};
        		if (parts.length == 1) {
        			map.top = parts[0];
        			map.right = parts[0];
        			map.bottom = parts[0];
        			map.left = parts[0];
        		}
        		else if (parts.length == 2) {
        			map.top = parts[0];
        			map.right = parts[1];
        			map.bottom = parts[0];
        			map.left = parts[1];
        		}
        		else if (parts.length == 3) {
        			map.top = parts[0];
        			map.right = parts[1];
        			map.bottom = parts[2];
        			map.left = parts[1];
        		}
        		else if (parts.length >= 4) {
        			map.top = parts[0];
        			map.right = parts[1];
        			map.bottom = parts[2];
        			map.left = parts[3];
        		}
        		return map;
        	}
        
        	public getEffectiveSpacingMap(property: string): any {
        		return this.getMapFromShorthand(this.getEffectiveSpacingValue(property));
        	}
        
        	public serializeBoxMap(map: any, emptyValue: string = "0"): string {
        		const top = this.cleanCssValue(map?.top) || emptyValue;
        		const right = this.cleanCssValue(map?.right) || emptyValue;
        		const bottom = this.cleanCssValue(map?.bottom) || emptyValue;
        		const left = this.cleanCssValue(map?.left) || emptyValue;
        		if (top == right && top == bottom && top == left) {
        			return top;
        		}
        		if (top == bottom && right == left) {
        			return top + " " + right;
        		}
        		if (right == left) {
        			return top + " " + right + " " + bottom;
        		}
        		return top + " " + right + " " + bottom + " " + left;
        	}
        
        	public normalizeCssInputValue(value: any, property: string = ""): string {
        		let normalized = this.cleanCssValue(value).replace(",", ".");
        		if (normalized == "") {
        			return "";
        		}
        		const lower = normalized.toLowerCase();
        		if (property == "margin" && lower == "auto") {
        			return "auto";
        		}
        		if (property != "margin" && /^-\d+(\.\d+)?/.test(normalized)) {
        			normalized = normalized.replace(/^-/, "");
        		}
        		if (/^-?\d+(\.\d+)?$/.test(normalized)) {
        			return normalized == "0" ? "0" : normalized + "px";
        		}
        		if (/^-?\d+(\.\d+)?(px|%|em|rem|vh|vw)$/.test(lower)) {
        			return lower;
        		}
        		if (/^(calc|var|min|max|clamp)\(.+\)$/.test(lower)) {
        			return normalized;
        		}
        		return normalized;
        	}
        
        	public getCssDisplayValue(value: any): string {
        		const normalized = this.cleanCssValue(value);
        		if (/^-?\d+(\.\d+)?px$/i.test(normalized)) {
        			return normalized.replace(/px$/i, "");
        		}
        		return normalized;
        	}
        
        	public getSpacingSideValue(property: string, side: string): string {
        		const map = this.getEffectiveSpacingMap(property);
        		return map?.[side] || "0";
        	}
        
        	public getSpacingSideDisplay(property: string, side: string): string {
        		return this.getCssDisplayValue(this.getSpacingSideValue(property, side));
        	}
        
        	public getDefaultSpacingSideValue(property: string, side: string): string {
        		const map = this.getMapFromShorthand(this.getSpacingDefaultValue(property));
        		return map?.[side] || "0";
        	}
        
        	public parseCssNumericValue(value: any): any {
        		const normalized = this.cleanCssValue(value);
        		const match = normalized.match(/^(-?\d+(?:\.\d+)?)(px|%|em|rem|vh|vw)?$/i);
        		if (match == null) {
        			return {number: 0, unit: "px", raw: normalized};
        		}
        		return {
        			number: parseFloat(match[1]),
        			unit: match[2] != null ? match[2].toLowerCase() : "px",
        			raw: normalized
        		};
        	}
        
        	public openSpacingValueEditor(property: string, side: string, event?: any): void {
        		try {
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		const currentValue = this.getSpacingSideValue(property, side);
        		const parsed = this.parseCssNumericValue(currentValue);
        		const target = this.getSpacingTarget();
        		this.borderValueEditor = null;
        		this.spacingValueEditor = {
        			target: target,
        			property: property,
        			side: side,
        			initialValue: currentValue,
        			number: parsed.number,
        			unit: parsed.unit
        		};
        		this.setEditorDragEnabled(false);
        		this.installSpacingCloseListener();
        		try {
        			this.ref.markForCheck();
        		}
        		catch (e) {
        		}
        	}
        
        	public installSpacingCloseListener(): void {
        		if (this.spacingDocumentClickHandler != null) {
        			return;
        		}
        		setTimeout(() => {
        			if (typeof document == "undefined") {
        				return;
        			}
        			if ((this.spacingValueEditor == null && this.borderValueEditor == null) || this.spacingDocumentClickHandler != null) {
        				return;
        			}
        			this.spacingDocumentClickHandler = (event: any) => {
        				const editor = document.getElementById(this.boxStyleEditorId);
        				if (editor != null && editor.contains(event?.target)) {
        					return;
        				}
        				this.closeValueEditors();
        			};
        			document.addEventListener("click", this.spacingDocumentClickHandler, true);
        		}, 0);
        	}
        
        	public removeSpacingCloseListener(): void {
        		if (this.spacingDocumentClickHandler == null) {
        			return;
        		}
        		try {
        			if (typeof document != "undefined") {
        				document.removeEventListener("click", this.spacingDocumentClickHandler, true);
        			}
        		}
        		catch (e) {
        		}
        		this.spacingDocumentClickHandler = null;
        	}
        
        	public closeSpacingValueEditor(event?: any): void {
        		try {
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		this.spacingValueEditor = null;
        		if (this.borderValueEditor == null) {
        			this.removeSpacingCloseListener();
        		}
        		try {
        			this.ref.markForCheck();
        		}
        		catch (e) {
        		}
        	}
        
        	public closeBorderValueEditor(event?: any): void {
        		try {
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		this.borderValueEditor = null;
        		if (this.spacingValueEditor == null) {
        			this.removeSpacingCloseListener();
        		}
        		try {
        			this.ref.markForCheck();
        		}
        		catch (e) {
        		}
        	}
        
        	public closeValueEditors(event?: any): void {
        		try {
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		this.spacingValueEditor = null;
        		this.borderValueEditor = null;
        		this.removeSpacingCloseListener();
        		try {
        			this.ref.markForCheck();
        		}
        		catch (e) {
        		}
        	}
        
        	public spacingEditorMatches(property: string, side: string): boolean {
        		return this.spacingValueEditor != null && this.spacingValueEditor.target == this.getSpacingTarget() && this.spacingValueEditor.property == property && this.spacingValueEditor.side == side;
        	}
        
        	public getSpacingEditorNumber(): number {
        		if (this.spacingValueEditor == null || isNaN(this.spacingValueEditor.number)) {
        			return 0;
        		}
        		return this.spacingValueEditor.number;
        	}
        
        	public getSpacingEditorUnit(): string {
        		return this.spacingValueEditor?.unit || "px";
        	}
        
        	public getSpacingEditorMin(): number {
        		return this.spacingValueEditor?.property == "margin" ? -220 : 0;
        	}
        
        	public getSpacingEditorMax(): number {
        		return 220;
        	}
        
        	public formatSpacingEditorValue(value: any, unit: string = ""): string {
        		const numberValue = parseFloat("" + value);
        		if (isNaN(numberValue)) {
        			return "0";
        		}
        		const resolvedUnit = unit || this.getSpacingEditorUnit() || "px";
        		const rounded = Math.round(numberValue * 100) / 100;
        		if (rounded == 0) {
        			return "0";
        		}
        		return rounded + resolvedUnit;
        	}
        
        	public applySpacingEditorValue(value: any, event?: any): void {
        		if (this.spacingValueEditor == null) {
        			return;
        		}
        		try {
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		const numberValue = parseFloat("" + value);
        		let nextNumber = isNaN(numberValue) ? 0 : numberValue;
        		if (this.spacingValueEditor.property != "margin" && nextNumber < 0) {
        			nextNumber = Math.abs(nextNumber);
        		}
        		this.spacingValueEditor.number = nextNumber;
        		const map = this.getEffectiveSpacingMap(this.spacingValueEditor.property);
        		map[this.spacingValueEditor.side] = this.formatSpacingEditorValue(this.spacingValueEditor.number, this.spacingValueEditor.unit);
        		this.setSpacingOverrideValue(this.spacingValueEditor.property, this.serializeBoxMap(map), this.getSpacingDefaultValue(this.spacingValueEditor.property));
        		this.notifyBoxStyleChange();
        	}
        
        	public setSpacingEditorNumberFromInput(event: any): void {
        		this.applySpacingEditorValue(event?.target?.value, event);
        	}
        
        	public setSpacingEditorUnitFromInput(event: any): void {
        		if (this.spacingValueEditor == null) {
        			return;
        		}
        		try {
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		this.spacingValueEditor.unit = this.cleanCssValue(event?.target?.value) || "px";
        		this.applySpacingEditorValue(this.spacingValueEditor.number, event);
        	}
        
        	public applySpacingPreset(value: number, event?: any): void {
        		this.applySpacingEditorValue(value, event);
        	}
        
        	public isSpacingPresetActive(value: number): boolean {
        		return this.spacingValueEditor != null && Math.round(this.getSpacingEditorNumber()) == value;
        	}
        
        	public resetActiveSpacingValue(event?: any): void {
        		if (this.spacingValueEditor == null) {
        			return;
        		}
        		try {
        			event?.preventDefault?.();
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		const defaultSideValue = this.getDefaultSpacingSideValue(this.spacingValueEditor.property, this.spacingValueEditor.side);
        		const parsed = this.parseCssNumericValue(defaultSideValue);
        		this.spacingValueEditor.number = parsed.number;
        		this.spacingValueEditor.unit = parsed.unit;
        		this.setSpacingBoxStyleValue(this.spacingValueEditor.property, "");
        		this.notifyBoxStyleChange();
        	}
        
        	public setSpacingSideFromInput(property: string, side: string, event: any): void {
        		const map = this.getEffectiveSpacingMap(property);
        		map[side] = this.normalizeCssInputValue(event?.target?.value, property) || "0";
        		this.setSpacingOverrideValue(property, this.serializeBoxMap(map), this.getSpacingDefaultValue(property));
        		if (this.spacingEditorMatches(property, side)) {
        			const parsed = this.parseCssNumericValue(map[side]);
        			this.spacingValueEditor.number = parsed.number;
        			this.spacingValueEditor.unit = parsed.unit;
        		}
        		this.notifyBoxStyleChange();
        	}
        
        	public resetSpacing(event?: any): void {
        		try {
        			event?.preventDefault?.();
        			event?.stopPropagation?.();
        		}
        		catch (e) {
        		}
        		this.setSpacingBoxStyleValue("margin", "");
        		this.setSpacingBoxStyleValue("padding", "");
        		this.setSpacingBoxStyleValue("verticalAlign", "");
        		this.spacingValueEditor = null;
        		this.borderValueEditor = null;
        		this.removeSpacingCloseListener();
        		this.notifyBoxStyleChange();
        	}
        
        	public getBorderTokens(): any {
        		const parsed = this.parseBorderValue(this.getTargetBoxStyleValue("border"));
        		const result: any = {
        			width: parsed.width || this.getTargetBoxStyleValue("borderWidth"),
        			style: parsed.style || this.getTargetBoxStyleValue("borderStyle"),
        			color: parsed.color || this.getTargetBoxStyleValue("borderColor")
        		};
        		return result;
        	}
        
        	public parseBorderValue(value: any): any {
        		const result: any = {width: "", style: "", color: ""};
        		const border = this.cleanCssValue(value);
        		if (border == "") {
        			return result;
        		}
        		const styles = ["none", "hidden", "dotted", "dashed", "solid", "double", "groove", "ridge", "inset", "outset"];
        		const widthKeywords = ["thin", "medium", "thick"];
        		const tokens = this.splitCssValue(border);
        		for (let token of tokens) {
