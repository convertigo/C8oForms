        	public parseBorderValue(value: any): any {
        		const result: any = {width: "", style: "", color: ""};
        		const border = this.cleanCssValue(value);
        		if (border == "") {
        			return result;
        		}
        		const styles = ["none", "hidden", "dotted", "dashed", "solid", "double", "groove", "ridge", "inset", "outset"];
        		const widthKeywords = ["thin", "medium", "thick"];
        		const tokens = this.splitCssValue(border);
        		for (let token of tokens) {
        			const lower = token.toLowerCase();
        			const isWidthToken = widthKeywords.indexOf(lower) != -1 || /^-?\d/.test(lower) || /^(calc|var|min|max|clamp)\(.+\)$/.test(lower);
        			const isColorToken = token.charAt(0) == "#" || lower.indexOf("rgb") == 0 || lower.indexOf("hsl") == 0 || lower.indexOf("var(") == 0 || lower == "transparent" || lower == "currentcolor" || (/^[a-z]+$/i.test(token) && styles.indexOf(lower) == -1 && widthKeywords.indexOf(lower) == -1);
        			if (result.style == "" && styles.indexOf(lower) != -1) {
        				result.style = lower;
        			}
        			else if (result.width == "" && isWidthToken) {
        				result.width = token;
        			}
        			else if (result.color == "" && isColorToken) {
        				result.color = token;
        			}
        			else if (result.width == "") {
        				result.width = token;
        			}
        			else if (result.color == "") {
        				result.color = token;
        			}
        		}
        		return result;
        	}
        
        	public composeBorderValue(width: any, style: any, color: any): string {
        		const normalizedStyle = this.cleanCssValue(style) || this.getTargetDefaultBoxStyleValue("borderStyle");
        		return (this.cleanCssValue(width) || this.getTargetDefaultBoxStyleValue("borderWidth")) + " " + normalizedStyle + " " + (this.cleanCssValue(color) || this.getTargetDefaultBoxStyleValue("borderColor"));
        	}
        
