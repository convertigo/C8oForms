        	public borderRadiusUnits: string[] = ["px", "%", "em", "rem"];
        	public borderWidthUnits: string[] = ["px", "em", "rem"];
        	public spacingDocumentClickHandler: any = null;
        	public selectedBorderSide: string = "all";
        	public selectedSpacingTarget: string = "self";
        	public selectedBoxStylePart: string = "container";
        	public lastStyleEditorItemKey: string = "";
        	public boxStyleEditorId: string = "c8o-box-style-editor-" + Math.floor(Math.random() * 1000000000);
