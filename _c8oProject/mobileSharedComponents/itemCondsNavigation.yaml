                    			let currentMode = page.getVisibleWhenMode(page.local.visibleIf);
                    			let nextMode = event.out;
                    			if(currentMode == nextMode){
                    				if(page.c8oforms_toggleswitch != undefined){
                    					page.c8oforms_toggleswitch.model = currentMode;
                    				}
                    				page.ref.detectChanges();
                    				return false;
                    			}
                    			if(page.shouldWarnBeforeClearingConditionMode(currentMode, nextMode) && page.hasVisibleWhenConditions(page.local.visibleIf)){
                    				let alertController = page.getInstance(AlertController);
                    				const alert = await alertController.create({
                    					header: page.translate.instant("header_pwamsg"),
                    					message: page.translate.instant(page.isButtonStateTab() ? "button_state_switch_confirm" : "visible_when_switch_confirm"),
                    					buttons: [
                    						{
                    							text: page.translate.instant("cancel_pwamsg"),
                    							role: "cancel"
                    						},
                    						{
                    							text: page.translate.instant("continue_pwamsg"),
                    							role: "confirm"
                    						}
                    					]
                    				});
                    				await alert.present();
                    				let res = await alert.onDidDismiss();
                    				if(res.role !== "confirm"){
                    					if(page.c8oforms_toggleswitch != undefined){
                    						page.c8oforms_toggleswitch.model = currentMode;
                    					}
                    					page.ref.detectChanges();
                    					return false;
                    				}
                    			}
                    			page.applyVisibleWhenMode(nextMode);
                    			if (page.local != null && page.local.commitVisibleIf != null) {
                    				page.local.commitVisibleIf();
                    			}
                    		}
                    		catch (e) {
                    			console.error(e);
                    		}
                    		finally {
                    			return;
                    			}
                    '
