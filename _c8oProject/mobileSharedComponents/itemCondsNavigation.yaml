        	}
        
        	public countFilled(){
        		let cpt = 0;
        		this.local.visible.forEach((x)=>{
        			this.isTotalyFilled(x) == true ? cpt ++ : null;
        		})
        		this.local.cptTotalyFilled = cpt;
        	}
        
        	public setVisiblePaletteContext(type: string = "text", monacoEditor: any = false, currentObject: any = null, index: any = null){
        		this.local.visiblePaletteType = type === "ts" ? "ts" : "text";
        		this.local.visiblePaletteMonaco = type === "ts" ? (monacoEditor || false) : false;
        		this.local.visiblePaletteTarget = null;
        		try{
        			if(currentObject != null && Array.isArray(currentObject.conds) && currentObject.conds[index] != null){
        				this.local.visiblePaletteTarget = {
        					currentObject: currentObject,
        					index: +index
        				};
        			}
        		}
        		catch(e){
        		}
        		this.ref.markForCheck();
        	}
        
        	public getVisiblePaletteEditorType(){
        		return this.local != null && this.local.visiblePaletteType === "ts" ? "code" : "html";
        	}
        
        	public getVisiblePaletteTargetCondition(ref: string = ""): any{
        		try{
        			let target = this.local != null ? this.local.visiblePaletteTarget : null;
        			if(target != null && target.currentObject != null && Array.isArray(target.currentObject.conds) && target.currentObject.conds[target.index] != null){
        				return target.currentObject.conds[target.index];
        			}
        		}
        		catch(e){
        		}
        		try{
        			const visible = "cond_visible_";
        			const goToPage = "cond_goToPage_";
        			if(typeof(ref) == "string" && ref.indexOf(visible) != -1 && this.local != null && Array.isArray(this.local.visible)){
        				return this.local.visible[+(ref.substring(visible.length))];
        			}
        			if(typeof(ref) == "string" && ref.indexOf(goToPage) != -1 && this.local != null && Array.isArray(this.local.goToPage)){
        				return this.local.goToPage[+(ref.substring(goToPage.length))];
        			}
        		}
        		catch(e){
        		}
        		return null;
        	}
        
        	public getConditionEditorHost(): any{
        		let host: any = this.pageOwner;
        		try{
        			while(host != null && host.getElementById == undefined && host.pageOwner != null){
        				host = host.pageOwner;
        			}
        		}
        		catch(e){
        		}
        		return host;
        	}
        
        	public getConditionFieldDisplayName(field: any): string{
        		if(field == null){
        			return "";
        		}
        		let path = field.c8opath != null ? "" + field.c8opath : "";
        		if(path == ""){
        			return field.displayName != null && field.displayName !== "" ? "" + field.displayName : (field.name != null && field.name !== "" ? "" + field.name : "");
        		}
        		let base = field.name != null && field.name !== "" ? "" + field.name : "";
        		try{
        			if((base == null || base === "") && field.str != null && field.str !== ""){
        				base = this.getItemNameById(field) || ("" + field.str);
        			}
        		}
        		catch(e){
        		}
        		let parts = path.split(".");
        		if(base == "" && parts.length > 0){
        			base = parts[0];
        		}
        		if(parts.length > 0 && base != "" && (parts[0] == base || parts[0] == field.name)){
        			parts = parts.slice(1);
        		}
        		if(parts.length == 0){
        			return base;
        		}
        		return base + "." + parts.join(".");
        	}
        
        	public enrichConditionFieldReference(field: any): any{
        		let enriched: any = field != null && typeof(field) == "object" ? JSON.parse(JSON.stringify(field)) : {};
        		if((enriched.name == null || enriched.name === "") && enriched.str != null && enriched.str !== ""){
        			enriched.name = this.getItemNameById(enriched);
        		}
        		if(enriched.source == null){
        			enriched.source = true;
        		}
        		if(!Array.isArray(enriched.arr)){
        			enriched.arr = [];
        		}
        		enriched.displayName = this.getConditionFieldDisplayName(enriched);
        		return enriched;
        	}
        	public buildCurrentConditionField(item: any, existing: any = null): any{
        		let field: any = {
        			name: item != null && item.name != null ? item.name : "",
        			displayName: item != null && item.name != null ? item.name : "",
        			str: item != null && item.id != null ? item.id : "",
        			source: true,
        			type: item != null && item.type != null ? item.type : "",
        			arr: []
        		};
        		if(existing != null && typeof(existing) == "object"){
        			if(existing.c8opath != null){
        				field.c8opath = existing.c8opath;
        			}
        			if(existing.c8oPrettyPath != null){
        				field.c8oPrettyPath = existing.c8oPrettyPath;
        			}
        			if(existing.c8obuiltin != null){
        				field.c8obuiltin = existing.c8obuiltin;
        			}
        			if(existing.c8oisobject != null){
        				field.c8oisobject = existing.c8oisobject;
        			}
        		}
        		return this.enrichConditionFieldReference(field);
        	}
        	
        	public async browseConditionField(field: any): Promise<any>{
        		let enriched: any = this.enrichConditionFieldReference(field);
        		try{
        			let host: any = this.getConditionEditorHost();
        			let id: any = enriched != null ? enriched.str : null;
        			if(typeof(id) == "string" && /^\d+$/.test(id)){
        				id = +id;
        			}
        			if(host == null || host.getElementById == undefined || typeof(id) != "number"){
        				return enriched;
        			}
        			let currentElement: any = host.getElementById(id);
        			if(currentElement == null){
        				return enriched;
        			}
        			let hasBrowse = false;
        			try{
        				if(host.searchCompletionWithElem != undefined){
        					let struct: any = await host.searchCompletionWithElem(currentElement, true, false);
        					hasBrowse = (struct != null && typeof(struct) == "object" &&
        						((struct.compl != null && Object.keys(struct.compl).length > 0) ||
        						 (struct.builtin != null && Object.keys(struct.builtin).length > 0)));
        				}
        				else if(host.searchCompletionWithId != undefined){
        					let struct: any = await host.searchCompletionWithId(id, currentElement);
        					if(Array.isArray(struct)){
        						hasBrowse = struct.length > 0;
        					}
        					else if(struct != null && typeof(struct) == "object"){
        						hasBrowse = Object.keys(struct).length > 0;
        					}
        				}
        			}
        			catch(e){
        			}
        			if(!hasBrowse && currentElement.type != "grid" && currentElement.type != "gallery"){
        				return enriched;
        			}
        			let selection: any = null;
        			let modalController = this.getInstance(ModalController);
        			let modal = await modalController.create({
        				component: C8Oforms_TreeviewContent,
        				componentProps: {
        					tree: null,
        					name: enriched.displayName || currentElement.name,
        					path: currentElement.name,
        					handler: (res, builtin, isObject = false) => {
        						selection = {
        							res: res,
        							builtin: builtin,
        							isObject: isObject
        						};
        					},
        					currentElement: currentElement,
        					graphic: true,
        					showHeader: true
        				},
        				cssClass: "modalCSV"
        			});
        			this.ref.detectChanges();
        			await modal.present();
        			await modal.onDidDismiss();
        			if(selection != null){
        				enriched.c8opath = selection.res != null ? selection.res : "";
        				enriched.c8oPrettyPath = "";
        				enriched.c8obuiltin = selection.builtin != null ? selection.builtin : false;
        				enriched.c8oisobject = selection.isObject === true;
        			}
        		}
        		catch(e){
        		}
        		return this.enrichConditionFieldReference(enriched);
        	}
        	
        	public async browseConditionFieldPopover(field: any, event: any): Promise<any>{
        		let enriched: any = this.enrichConditionFieldReference(field);
        		try{
        			let host: any = this.getConditionEditorHost();
        			let id: any = enriched != null ? enriched.str : null;
        			if(typeof(id) == "string" && /^\d+$/.test(id)){
        				id = +id;
        			}
        			if(host == null || host.getElementById == undefined || typeof(id) != "number"){
        				return enriched;
        			}
        			let currentElement: any = host.getElementById(id);
        			if(currentElement == null){
        				return enriched;
        			}
        			let hasBrowse = false;
        			try{
        				if(host.searchCompletionWithElem != undefined){
        					let struct: any = await host.searchCompletionWithElem(currentElement, true, false);
        					hasBrowse = (struct != null && typeof(struct) == "object" &&
        						((struct.compl != null && Object.keys(struct.compl).length > 0) ||
        						 (struct.builtin != null && Object.keys(struct.builtin).length > 0)));
        				}
        				else if(host.searchCompletionWithId != undefined){
        					let struct: any = await host.searchCompletionWithId(id, currentElement);
        					if(Array.isArray(struct)){
        						hasBrowse = struct.length > 0;
        					}
        					else if(struct != null && typeof(struct) == "object"){
        						hasBrowse = Object.keys(struct).length > 0;
        					}
        				}
        			}
        			catch(e){
        			}
        			if(!hasBrowse && currentElement.type != "grid" && currentElement.type != "gallery"){
        				return enriched;
        			}
        			let selection: any = null;
        			let popoverController = this.getInstance(PopoverController);
        			let popover = await popoverController.create({
        				component: C8Oforms_TreeviewContent,
        				event: event,
        				componentProps: {
        					tree: null,
        					name: enriched.displayName || currentElement.name,
        					path: currentElement.name,
        					handler: (res, builtin, isObject = false) => {
        						selection = {
        							res: res,
        							builtin: builtin,
        							isObject: isObject
        						};
        						try{
        							popoverController.dismiss();
        						}
        						catch(e){
        						}
        					},
        					currentElement: currentElement,
        					graphic: true,
        					showHeader: true
        				},
        				cssClass: "modalCSV"
        			});
        			this.ref.detectChanges();
        			await popover.present();
        			await popover.onDidDismiss();
        			if(selection != null){
        				enriched.c8opath = selection.res != null ? selection.res : "";
        				enriched.c8oPrettyPath = "";
        				enriched.c8obuiltin = selection.builtin != null ? selection.builtin : false;
        				enriched.c8oisobject = selection.isObject === true;
        			}
        		}
        		catch(e){
        		}
        		return this.enrichConditionFieldReference(enriched);
        	}
        	/**
        	 * returns type of field (simple, multiple, file, or camSign)
        	 * @param type
        	 */
        	public getType(type: string): string{
        	    if(this.local.multipleField[type] == true){
        	        return "multiple";
        	    }
        	    else if(this.local.simpleField[type] == true){
        	        return "simple";
        	    }
        	    else if(this.local.fileField[type] == true){
        	        return "file";
        	    }
        	    else if(this.local.camSignField[type] == true){
        	        return "camSign"; 
        	    }
        	    else{
        	        return "simple";
        	    }
        	    
        	}
        	public getGoToPageType(type: string): string{
        	    if(this.local.multipleFieldGoToPage[type] == true){
        	        return "multiple";
        	    }
        	    else if(this.local.simpleFieldGoToPage[type] == true){
        	        return "simple";
        	    }
        	    else if(this.local.fileFieldGoToPage[type] == true){
        	        return "file";
        	    }
        	    else if(this.local.camSignFieldGoToPage[type] == true){
        	        return "camSign"; 
        	    }
        	    else{
        	        return "simple";
        	    }
        	    
        	}
        	/**
        	 * convert a string to an array
        	 * @param e
        	 */
        	public strToArr(e){
        	    if(typeof(e)== "string"){
        	        return [e];
        	    }
        	    else{
        	       return e; 
        	    }
        	}
        
        	public getItemNameById(val: any | number): string{
        		var searchArray = this.form.formulaire.concat([]);
        		for (let item of this.form.flows) {
        			searchArray = searchArray.concat(item.elements);
        		}
        		if(typeof val == "string"){
        			val = +val;
        		}
        		// case arg is an id
        	    if(typeof(val) == ''number''){
        	        for(let elem of searchArray){
        	            if(elem.id == val){
        	                return elem.name;
        	            }
        	            else if(elem.type == "ion-card" && elem["children"] != undefined){
        	                for(let child of elem["children"]){
        	                    if(child.id == val){
        	                        return child.name;
        	                    }
        	                }
        	            }
        	        }
        	    }
        		//case arg is an valFIeldObject 
        	    else{
        			// from source
        			if(val.source == true){
        				for(let elem of searchArray){
        	                if(elem.id == val.str){
        	                    return elem.name;
        	                }
        	                else if(elem.type == "ion-card" && elem["children"] != undefined){
        	                    for(let child of elem["children"]){
        	                        if(child.id == val.str){
        	                            return child.name;
        	                        }
        	                    }
        	                }
        	            }
        			}
        			// from string
        			else{
        	       		return val.str;
        	    	}
        	    }
        		return "";
        	}
        
        	/**
        	 * 
        	 * @param name
        	 */
        	public getItemNameByIdOriginal(field: any){
        	    if(field.source == true){
        	        for(let key of Object.keys(this.form.formulaire)){
        	            if(this.form.formulaire[key].id == field.str){
        	                return this.form.formulaire[key].name;
        	            }
        	            else if(this.form.formulaire[key].type == "ion-card" && this.form.formulaire[key].children != undefined){
        	                for(let keyChild of Object.keys(this.form.formulaire[key]["children"])){
        	                    if(this.form.formulaire[key]["children"][keyChild].id == field.str){
        	                        return this.form.formulaire[key]["children"][keyChild].name;
        	                    }
        	                }
        	            }
        	        }
        	    }
        	    else{
        	        return field.str;
        	    }
        	    
        	    return "";
        	}
        
        
        
        	public getItemNameByIdStr(str: any){
        	    for(let key of Object.keys(this.form.formulaire)){
        	            if(this.form.formulaire[key].id == str){
        	                return this.form.formulaire[key].name;
        	            }
        	            else if(this.form.formulaire[key].type == "ion-card" && this.form.formulaire[key].children != undefined){
        	                for(let keyChild of Object.keys(this.form.formulaire[key]["children"])){
        	                    if(this.form.formulaire[key]["children"][keyChild].id == str){
        	                        return this.form.formulaire[key]["children"][keyChild].name;
        	                    }
        	                }
        	            }
        	        }
        	    
        	    
        	    return "";
        	}
        
        	public getPageNameByTech(str){
        	    for(let page of this.form.pages){
        	        if(page.pageTechName == str){
        	            return page.name;
        	        }
        	    }
        	}
        
        	public getLegacyAwareVisibleIf(item: any){
        		if(item == null || typeof(item) != "object"){
        			return null;
        		}
        		if(item.conditions != null && typeof(item.conditions) == "object"){
        			if(item.conditions.visibleIf != null){
        				return item.conditions.visibleIf;
        			}
        			if(item.conditions.type == "visibleIf" || item.conditions.conds != undefined || item.conditions.condVisible != undefined || item.conditions.groups != undefined){
        				return item.conditions;
        			}
        		}
        		if(item.visibleIf != null){
        			return item.visibleIf;
        		}
        		return null;
        	}
        
        	public ensureLegacyAwareConditionContainers(item: any){
        		if(item == null || typeof(item) != "object"){
        			return {};
        		}
        		let legacyVisibleIf = this.getLegacyAwareVisibleIf(item);
        		let legacyGoToPageIf = null;
        		if(item.conditions != null && typeof(item.conditions) == "object" && item.conditions.goToPageIf != null){
        			legacyGoToPageIf = item.conditions.goToPageIf;
        		}
        		else if(item.goToPageIf != null){
        			legacyGoToPageIf = item.goToPageIf;
        		}
        		item.conditions = item.conditions != null && typeof(item.conditions) == "object" ? item.conditions : {};
        		if(item.conditions.visibleIf == null){
        			item.conditions.visibleIf = legacyVisibleIf != null ? legacyVisibleIf : {
        				type: "visibleIf",
        				conds: [],
        				condVisible: "and",
        				groups: []
        			};
        		}
        		if(item.conditions.goToPageIf == null){
        			item.conditions.goToPageIf = legacyGoToPageIf != null ? legacyGoToPageIf : {
        				type:"goToPageIf",
        				conds:[],
        				condVisible:"or",
        				groups:[]
        			};
        		}
        		return item.conditions;
        	}
        	public createEmptyGoToPageCondition(item: any = null){
        		return {
