        	public isButtonStateTab(){
        		return this.tabselected === "button_state_tab_selector";
        	}
        	public isButtonStateConditionMode(mode: string){
        		return mode === "button_state_enabled_when_condition" || mode === "button_state_disabled_when_condition";
        	}
        	public getConditionWhenLabel(){
        		return this.isButtonStateTab() ? this.translate.instant("button_state_when") : this.translate.instant("visible_when");
        	}
        	public getConditionWhenOptions(){
        		return this.isButtonStateTab()
        			? ["button_state_always_enabled", "button_state_enabled_when_condition", "button_state_disabled_when_condition"]
        			: ["visible_when_always", "visible_when_never", "visible_when_auth_required", "visible_when_no_auth_required", "visible_when_condition"];
        	}
        	public shouldShowCurrentConditionEditor(){
        		let mode = this.getVisibleWhenMode(this.local != null ? this.local.visibleIf : null);
        		return this.isButtonStateTab() ? this.isButtonStateConditionMode(mode) : mode == "visible_when_condition";
        	}
        	public shouldWarnBeforeClearingConditionMode(currentMode: string, nextMode: string){
        		if(currentMode == nextMode){
        			return false;
        		}
        		if(this.isButtonStateTab()){
        			return this.isButtonStateConditionMode(currentMode) && !this.isButtonStateConditionMode(nextMode);
        		}
        		return currentMode == "visible_when_condition" && nextMode != "visible_when_condition";
        	}
        	public getVisibleWhenMode(group: any){
        		try{
        			let current: any = group != null && typeof(group) == "object" ? group : this.createEmptyVisibleIfGroup();
        			if(this.isButtonStateTab()){
        				if(this.isButtonStateConditionMode(current.__uiMode)){
        					return current.__uiMode;
        				}
        				let conds = Array.isArray(current.conds) ? current.conds : [];
        				let groups = Array.isArray(current.groups) ? current.groups : [];
        				let legacyConds = Array.isArray(current.__legacyConds) ? current.__legacyConds : [];
        				if(conds.length > 0 || groups.length > 0 || legacyConds.length > 0){
        					return "button_state_enabled_when_condition";
        				}
        				return "button_state_always_enabled";
        			}
        			if(current.__uiMode == "visible_when_condition"){
        				return "visible_when_condition";
        			}
        			let conds = Array.isArray(current.conds) ? current.conds : [];
        			let fieldConds: any[] = [];
        			let groups = Array.isArray(current.groups) ? current.groups : [];
        			let legacyConds = Array.isArray(current.__legacyConds) ? current.__legacyConds.concat([]) : [];
        			for(let cond of conds){
        				if(cond != null && cond.subject != null && cond.subject != "" && cond.subject != "field"){
        					legacyConds.push(cond);
        					continue;
        				}
        				fieldConds.push(cond);
        			}
        			if(fieldConds.length == 0 && groups.length == 0){
        				if(legacyConds.length == 0){
        					return "visible_when_always";
        				}
        				if(legacyConds.length == 1){
        					let cond = legacyConds[0];
        					if(cond != null && cond.subject == "never_visible"){
        						return "visible_when_never";
        					}
        					if(cond != null && cond.subject == "form" && cond.attribute == "anonymous" && cond.operator == "different"){
        						return "visible_when_auth_required";
        					}
        					if(cond != null && cond.subject == "form" && cond.attribute == "anonymous" && cond.operator == "equals"){
        						return "visible_when_no_auth_required";
        					}
        				}
        			}
        		}
        		catch(e){
        		}
        		return "visible_when_condition";
        	}
        	public applyVisibleWhenMode(mode: string){
        		if(this.isButtonStateTab()){
        			let buttonStateIf: any = this.isButtonStateConditionMode(mode) && this.local != null && this.local.visibleIf != null
        				? this.local.visibleIf
        				: this.createEmptyVisibleIfGroup();
        			buttonStateIf.__uiMode = this.isButtonStateConditionMode(mode) ? mode : "button_state_always_enabled";
        			this.local.buttonStateIf = buttonStateIf;
        			this.local.visibleIf = buttonStateIf;
        			this.local.visible = buttonStateIf.conds;
        			this.local.condVisible = buttonStateIf.condVisible;
        			this.local.cptTotalyFilled = 0;
        			this.local.visiblePaletteCollapsed = this.isButtonStateConditionMode(mode) ? false : true;
        			this.local.visiblePaletteTarget = null;
        			this.local.visiblePaletteMonaco = false;
        			this.local.visiblePaletteType = "text";
        			if(this.local != null && this.local.commitButtonStateIf != null){
        				this.local.commitButtonStateIf();
        			}
        			return;
        		}
        		let visibleIf: any = this.createEmptyVisibleIfGroup();
        		switch(mode){
        			case "visible_when_never":
        				visibleIf.__legacyConds = [{
        					type: "visibleIf",
        					subject: "never_visible",
        					attribute: "",
        					operator: ""
        				}];
        				break;
        			case "visible_when_auth_required":
        				visibleIf.__legacyConds = [{
        					type: "visibleIf",
        					subject: "form",
        					attribute: "anonymous",
        					operator: "different"
        				}];
        				break;
        			case "visible_when_no_auth_required":
        				visibleIf.__legacyConds = [{
        					type: "visibleIf",
        					subject: "form",
        					attribute: "anonymous",
        					operator: "equals"
        				}];
        				break;
        			case "visible_when_condition":
        				visibleIf.__uiMode = "visible_when_condition";
        				break;
        			case "visible_when_always":
        			default:
        				break;
        		}
        		this.local.visibleIf = visibleIf;
        		this.local.visible = visibleIf.conds;
        		this.local.condVisible = visibleIf.condVisible;
        		this.local.cptTotalyFilled = 0;
        		this.local.visiblePaletteCollapsed = mode == "visible_when_condition" ? false : true;
        		this.local.visiblePaletteTarget = null;
        		this.local.visiblePaletteMonaco = false;
        		this.local.visiblePaletteType = "text";
        		if(this.local != null && this.local.commitVisibleIf != null){
        			this.local.commitVisibleIf();
        		}
        	}
        	public hasVisibleWhenConditions(group: any){
