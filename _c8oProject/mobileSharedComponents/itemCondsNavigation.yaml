        	public getTinyEditorOwner(): any{
        		let owner: any = this.pageOwner != null ? this.pageOwner : this.owner;
        		let guard = 0;
        		while(owner != null && guard < 20){
        			if(owner.tinyFuncDropWithCancelText != undefined || owner.tinyFuncDrop != undefined || owner.transform$toHtml != undefined){
        				return owner;
        			}
        			let nextOwner = owner.owner != null ? owner.owner : owner.pageOwner;
        			if(nextOwner == owner){
        				break;
        			}
        			owner = nextOwner;
        			guard++;
        		}
        		return this.pageOwner;
        	}
        
        	public tinyFuncDropWithCancelText(editor): void{
        		let owner: any = this.getTinyEditorOwner();
        		if(owner != null && owner.tinyFuncDropWithCancelText != undefined){
        			owner.tinyFuncDropWithCancelText(editor);
        		}
        	}
        
        	public tinyFuncDropWithCancel(editor): void{
        		let owner: any = this.getTinyEditorOwner();
        		if(owner != null && owner.tinyFuncDropWithCancel != undefined){
