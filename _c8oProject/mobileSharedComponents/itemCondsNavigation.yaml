        	public canEditNavigationConditions(item: any = null){
        		let current = item != null ? item : (this.local != null ? this.local.item : null);
        		if(current == null){
        			return false;
        		}
        		return this.getGoToPageType(current.type) != "" && this.getGoToPageType(current.type) != "file"
        			&& !(current.type == "checkbox_group" && current.config?.sourceEnabled == true)
        			&& !(current.type == "radio_group" && current.config?.sourceEnabled == true)
        			&& !(current.type == "checkbox" && current.config?.sourceEnabled == true)
