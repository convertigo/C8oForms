        →: |
          '.div-flex{
          	display: grid;
          	grid-template-columns: var(--c8o-toggle-label-width, 180px) minmax(0, 1fr);
          	align-items: flex-start;
          	column-gap: 16px;
          	row-gap: 8px;
          	width: fit-content;
          	max-width: 100%;
          	padding: var(--c8o-setting-row-padding, 6px 0);
          }
          .div-text{
          	display: flex;
          	min-height: 40px;
          	align-items: center;
          	align-self: center;
          	color: #404040;
          	font-family: Inter;
          	font-size: 14px;
          	font-style: normal;
          	font-weight: 500;
          	line-height: 20px;
          	letter-spacing: -0.15px;
          }
          .div-input{
          	display: flex;
          	height: 40px;
          	min-height: 40px;
          	width: min(320px, 100%);
          	max-width: 100%;
          	padding: 4px 12px;
          	align-items: center;
          	gap: 8px;
          	border-radius: 10px;
          	background: #F5F5F5;
          	box-sizing: border-box;
          }
          .w-100 {
          	width: 100% !important;
          }
          .template-column-unset {
          	grid-template-columns: unset;
          }
          .c8o-text-input{
          	--background: transparent;
          	--color: #1A1A1A;
          	--placeholder-color: #737373;
          	--padding-start: 0;
          	--padding-end: 0;
          	--padding-top: 0;
          	--padding-bottom: 0;
          	--highlight-color-focused: transparent;
          	--highlight-color-valid: transparent;
          	--highlight-color-invalid: transparent;
          	min-height: 32px;
          	font-family: Inter;
          	font-size: 14px;
          	font-style: normal;
          	font-weight: 500;
          	height: 32px;
          	line-height: 20px;
          	letter-spacing: -0.15px;
          	color: #1A1A1A;
          	caret-color: #155DFC;
          	flex: 1 1 auto;
          	min-width: 0;
          }
          .div-suffix{
          	display: flex;
          	align-items: center;
          	flex: 0 0 auto;
          	color: #737373;
          	font-family: Inter;
          	font-size: 14px;
          	font-style: normal;
          	font-weight: 500;
          	line-height: 20px;
          	letter-spacing: -0.15px;
          	user-select: none;
          }
          .c8o-text-input::part(native),
          .c8o-text-input::part(input){
          	color: #1A1A1A;
          	caret-color: #155DFC;
          }
          .c8o-text-input .native-input,
          .c8o-text-input input.native-input{
          	color: #1A1A1A !important;
          	-webkit-text-fill-color: #1A1A1A !important;
          	caret-color: #155DFC !important;
          	opacity: 1 !important;
          	background: transparent !important;
          }
          @media (max-width: 640px) {
          	.div-flex{
          		grid-template-columns: 1fr;
          	}
          	.div-text{
          		min-height: auto;
          		padding: 0;
          	}
          	.div-input{
          		width: 100%;
          	}
          }'
