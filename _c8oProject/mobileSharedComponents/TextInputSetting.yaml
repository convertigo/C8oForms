        		if (!enabled) {
        			return false;
        		}
        		const alwaysVisible = this.tooltipAlwaysVisible === true || this.tooltipAlwaysVisible === "true";
        		return alwaysVisible || (this.local != null && this.local.isHovered === true);
        	}
