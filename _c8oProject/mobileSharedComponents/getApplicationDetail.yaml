        	  public openPWA(doc){ 
        		console.log(this.local?.url_data?.project_url + doc.pwa_subPath);
        	  	window.open(this.local?.url_data?.project_url + ''DisplayObjects/'' + doc.pwa_subPath, "_blank"); 
        	  }
        	  
        	  public formatDate(timestamp: number, locale: ''fr'' | ''en'' | ''it'' | ''es'' | string): string {
        	      const date = new Date(timestamp);
        
        	      const monthLabels = {
        	          en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
        	          fr: ["Janv", "Févr", "Mars", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"],
        	          it: ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"],
        	          es: ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"]
        	      };
        
        	      const months = monthLabels[locale] || monthLabels[''en''];
        
        	      const day = date.getUTCDate().toString().padStart(2, ''0'');
        	      const month = months[date.getUTCMonth()];
        	      const year = date.getUTCFullYear();
        
        	      switch (locale) {
        	          case ''fr'':
        	          case ''it'':
        	          case ''es'':
        	              return ` ${day} ${month} ${year}`;
        	          case ''en'':
        	          default:
        	              return ` ${month} ${day}, ${year}`;
        	      }
        	  }
        
        	  
        	  public getBrowserInfo() {
        	    const userAgent = navigator.userAgent.toLowerCase();
        	    const vendor = navigator.vendor || "";
        
        	    if (navigator["brave"] !== undefined) {
        	      return "Brave";
        	    }
        
        	    if (userAgent.includes("duckduckgo")) {
        	      return "DuckDuckGo";
        	    }
        
        	    if (userAgent.includes("opr") || userAgent.includes("opera")) {
        	      return "Opera";
        	    }
        
        	    if (userAgent.includes("edg")) {
        	      return "Edge";
        	    }
        
        	    if (userAgent.includes("firefox")) {
        	      return "Firefox";
        	    }
        
        	    if (userAgent.includes("chrome") && vendor.includes("Google Inc")) {
        	      return "Chrome";
        	    }
        
        	    if (userAgent.includes("safari")) {
        	      return "Safari";
        	    }
        
        	    return "Navigateur inconnu";
        	  }
        
        
        	/*End_c8o_CompFunction*/
        '
