        	  public openPWA(doc){ 
        //		console.log(this.local?.url_data?.project_url + doc.pwa_subPath);
        	  	window.open(this.local?.url_data?.project_url + ''DisplayObjects/'' + doc.pwa_subPath, "_blank"); 
        	  }
        	  
        	  public formatDate(timestamp: number, locale: ''fr'' | ''en'' | ''it'' | ''es'' | string): string {
        	      const date = new Date(timestamp);
        
        	      const monthLabels = {
        	          en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
        	          fr: ["Janv", "Févr", "Mars", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"],
        	          it: ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"],
        	          es: ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"]
        	      };
        
        	      const months = monthLabels[locale] || monthLabels[''en''];
        
        	      const day = date.getUTCDate().toString().padStart(2, ''0'');
        	      const month = months[date.getUTCMonth()];
        	      const year = date.getUTCFullYear();
        
        	      switch (locale) {
        	          case ''fr'':
        	          case ''it'':
        	          case ''es'':
        	              return ` ${day} ${month} ${year}`;
        	          case ''en'':
        	          default:
        	              return ` ${month} ${day}, ${year}`;
        	      }
        	  }
        
        	  
        	  public getBrowserInfo() {
        	    const userAgent = navigator.userAgent.toLowerCase();
        	    const vendor = navigator.vendor || "";
        
        	    if (navigator["brave"] !== undefined) {
        	      return "Brave";
        	    }
        
        	    if (userAgent.includes("duckduckgo")) {
        	      return "DuckDuckGo";
        	    }
        
        	    if (userAgent.includes("opr") || userAgent.includes("opera")) {
        	      return "Opera";
        	    }
        
        	    if (userAgent.includes("edg")) {
        	      return "Edge";
        	    }
        
        	    if (userAgent.includes("firefox")) {
        	      return "Firefox";
        	    }
        
        	    if (userAgent.includes("chrome") && vendor.includes("Google Inc")) {
        	      return "Chrome";
        	    }
        
        	    if (userAgent.includes("safari")) {
        	      return "Safari";
        	    }
        
        	    return "Navigateur inconnu";
        	  }
        
        
        	  /**
        	    * Retourne le rôle de l''utilisateur en fonction des permissions.
        	    * @param perms - Objet de permissions booléennes
        	    * @returns "Admin" | "Editor" | "Viewer"
        	    */
        	   public getRole(perms: any): "Admin" | "Editor" | "Viewer" {
        
        	     if (perms?.admin && Boolean(perms?.admin)) return "Admin";
        
        //		 console.log(perms)
        	     if (
        	       (perms?.editing_rights && Boolean(perms?.editing_rights)) ||
        	       (perms?.nocode_db_rights && Boolean(perms?.nocode_db_rights))||
        	       (perms?.formulas && Boolean(perms?.formulas)) ||
        	       (perms?.publication && Boolean(perms?.publication)) 
        	     ) {
        	       return "Editor";
        	     }
        
        	     if ((perms?.admin_readonly && Boolean(perms?.admin_readonly))) return "Viewer";
        
        	     return "Viewer"; // fallback
        	   }
        	   
        	   /**
        	     * Retourne une date formatée à partir d''un timestamp selon la langue.
        	     * @param timestamp - Le timestamp (en ms ou s)
        	     * @param locale - Code langue i18n (ex: "fr", "en", "es", "it")
        	     * @returns Une chaîne de la forme "3 juillet 2023 à 12:30"
        	     */
        	    public formatLocalizedDate(timestamp: number | string, locale: string = "fr"): string {
        	      // Si le timestamp est en secondes, on le convertit en millisecondes
        	      const ts = typeof timestamp === "string" ? Number(timestamp) : timestamp;
        	      const date = new Date(ts < 1e12 ? ts * 1000 : ts);
        
        	      const optionsDate: Intl.DateTimeFormatOptions = {
        	        day: "numeric",
        	        month: "long",
        	        year: "numeric"
        	      };
        
        	      const optionsTime: Intl.DateTimeFormatOptions = {
        	        hour: "2-digit",
        	        minute: "2-digit"
        	      };
        
        	      const formattedDate = new Intl.DateTimeFormat(locale, optionsDate).format(date);
        	      const formattedTime = new Intl.DateTimeFormat(locale, optionsTime).format(date);
        
        	      // Séparateur localisé selon la langue
        	      const separator = locale.startsWith("fr") ? " à " : " at ";
        
        	      return `${formattedDate}${separator}${formattedTime}`;
        	    }
        	/*End_c8o_CompFunction*/
        '
