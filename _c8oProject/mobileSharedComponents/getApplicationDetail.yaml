            '		try {
            			page.local.navParams = page.getInstance(NavParams);
            //			console.log(page.local.navParams.data.params.data.key);
            			page.local.form_data = await page.call("C8Oforms.admin_stats_getDocumentById", {id: page.local.navParams.data.params.data.key});
            //			console.log(page.local.form_data);
            			page.local.form_name = page.local.form_data?.couchdb_output?.name;
            			page.local.creator_data = await page.call("C8Oforms.admin_stats_getDocumentById", {id: "C8Oreserved_"+page.local.form_data?.couchdb_output["~c8oAcl"]});
            			page.local.url_data = await page.call("C8Oforms.getConvertigoUrl");
            //			console.log(page.local.creator_data);
            			page.local.creationDate = page.formatDate(Number(page.local.form_data?.couchdb_output?.creationDate), page.translate.currentLang);
            			page.local.lastMofification = page.formatDate(Number(page.local.form_data?.couchdb_output?.lastMofification), page.translate.currentLang);
            			console.log(page.local, page.translate.currentLang);	
            		} catch(e) {
            			console.error(e);
            		}
            //		console.log(page.local.navParams.data);
            '
