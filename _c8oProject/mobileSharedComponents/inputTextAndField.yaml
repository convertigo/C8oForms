        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompFunction*/
        	private getDragOwner(): any {
        		return this.pageOwner?.pageOwner || this.pageOwner || this.owner;
        	}
        	private isSourceDrag(event: any): boolean {
        		try {
        			return event?.dataTransfer?.getData?.("__c8oformsdrag_source") === "true";
        		}
        		catch (e) {
        			return false;
        		}
        	}
        	private htmlDragToValue(html: string): string {
        		if (html == null || html === "") {
        			return "";
        		}
        		const owner = this.getDragOwner();
        		try {
        			if (owner != null && typeof owner.transformHtmlto$ === "function") {
        				return owner.transformHtmlto$(html);
        			}
        		}
        		catch (e) {
        		}
        		return "";
        	}
        	private isDropMarkerValue(value: string): boolean {
        		const clean = value == null ? "" : ("" + value).trim();
        		return clean === "" || clean === "true" || clean === "false" || clean === "__c8oformsdrag_source" || clean === "__c8oformsdrag";
        	}
        	private getDroppedSourceValue(event: any): string {
        		let plain = event?.dataTransfer?.getData?.("text/plain") || "";
        		plain = (plain || "").replace(/[\r\n]+$/g, "").trim();
        		if (!this.isDropMarkerValue(plain)) {
        			return plain;
        		}
        		let html = event?.dataTransfer?.getData?.("text/html") || "";
        		let value = this.htmlDragToValue(html);
        		value = (value || "").replace(/[\r\n]+$/g, "").trim();
        		if (!this.isDropMarkerValue(value)) {
        			return value;
        		}
        		return "";
        	}
        	private getDisplayForDroppedValue(value: string): string {
        		const clean = value == null ? "" : ("" + value).trim();
        		const match = clean.match(/\$\$(?:START)?(\d+)([\s\S]*?)(?:END)?(?:\d+)?\$\$/);
        		if (match != null) {
        			try {
        				const meta = JSON.parse(match[2]);
        				return meta.c8oName || meta.name || (meta.c8opath != null && meta.c8opath !== "" ? ("" + meta.c8opath).split(".").pop() : "") || (this.pageOwner?.getItemNameById != null ? this.pageOwner.getItemNameById(+match[1]) : "") || clean;
        			}
        			catch (e) {
        			}
        		}
        		if (clean.indexOf("api.") === 0 || clean.indexOf("await api.") === 0) {
        			let withoutAwait = clean.indexOf("await ") === 0 ? clean.substring(6).trim() : clean;
        			let last = withoutAwait.split(".").pop() || withoutAwait;
        			return last.indexOf("(") != -1 ? last.substring(0, last.indexOf("(")) : last;
        		}
        		return clean;
        	}
        	public onMultipleDragOver(event: any): boolean {
        		if (!this.inputngx || !this.isSourceDrag(event)) {
        			return true;
        		}
        		event.preventDefault();
        		event.stopPropagation();
        		event.stopImmediatePropagation?.();
        		if (event.dataTransfer != null) {
        			event.dataTransfer.dropEffect = "copy";
        		}
        		return false;
        	}
        	public onMultipleDrop(event: any): boolean {
        		if (!this.inputngx || !this.isSourceDrag(event)) {
        			return true;
        		}
        		event.preventDefault();
        		event.stopPropagation();
        		event.stopImmediatePropagation?.();
        		let value = "";
        		try {
        			value = this.getDroppedSourceValue(event);
        			if (value === "") {
        				return false;
        			}
        			if (this.current == null) {
        				return false;
        			}
        			if (this.current.val2 == null || typeof this.current.val2 !== "object") {
        				this.current.val2 = { str: "", source: false, type: "text", arr: [] };
        			}
        			if (!Array.isArray(this.current.val2.arr)) {
        				this.current.val2.arr = [];
        			}
        			const tag = { value: value, display: this.getDisplayForDroppedValue(value) };
        			if (this.current.val2.arr.findIndex((item) => item != null && item.value === tag.value) === -1) {
        				this.current.val2.arr = this.current.val2.arr.concat([tag]);
        			}
        			this.current.val2.str = "";
        			this.current.val2.source = false;
        			if (this.current.val2.type == null || this.current.val2.type === "") {
        				this.current.val2.type = "text";
        			}
        			this.save.emit(this.current);
        		}
        		catch (e) {
        			this.c8o?.log?.error?.("[InputTextAndField] source drop failed " + (e?.message || JSON.stringify(e)));
        		}
        		return false;
        	}
        	/*End_c8o_CompFunction*/
