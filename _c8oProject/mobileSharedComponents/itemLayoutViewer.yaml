        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	breakpoints = {
        	    xl: ''(min-width: 1200px)'',
        	    lg: ''(min-width: 992px) and (max-width: 1199px)'',
        	    md: ''(min-width: 768px) and (max-width: 991px)'',
        	    sm: ''(min-width: 576px) and (max-width: 767px)'',
        	    xs: ''(max-width: 575px)''
        	  };
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		this.local.currentBreakpoint = this.getBreakpoint();
        		// now listen to the window resize event
        		this.local.funcListener = () => {
        			const breakpoint = this.getBreakpoint();
        			if (this.local.currentBreakpoint !== breakpoint) {
        				this.local.currentBreakpoint = breakpoint;
        				this.ref.detectChanges();
        			}
        		}
        		window.addEventListener(''resize'', this.local.funcListener);
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		window.removeEventListener(''resize'', this.local.funcListener);
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		if (changes.item?.currentValue?.config?.cols) {
        			this.computeColSize();
        			this.computeTabletSize();
        			this.computePhoneLSize();
        			this.computePhonePSize();
        			this.ref.detectChanges();
        		}
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	public trackByObj (index: number, obj: object): number{
          		return +obj;
        	};
        	public computeSize(target, output) {
        		let cols = this.item.config[target];
        		this.local[output] = cols.filter((col, index) => {
        			return col.size > 0;
        		}).map((col) => {
        			return col.size;
        		});
        	}
        	public computeColSize() {
        		this.computeSize(''cols'', ''computedColSize'');
        	}
        	public computeTabletSize() {
        		this.computeSize(''tablet'', ''computedTabletSize'');
        	}
        	public computePhoneLSize() {
        		this.computeSize(''phoneL'', ''computedPhoneLSize'');
        	}
        	public computePhonePSize() {
        		this.computeSize(''phoneP'', ''computedPhonePSize'');
        	}
        	isLastColumn(index: number): boolean {
        		return this.getLayoutRowPosition(index).last;
        	}
        	isLastRow(index: number): boolean {
        		if (this.local.currentBreakpoint) {
        			let currentTrueLen = this.getArraySize(this.local.currentBreakpoint)?.length -1;
        			let trueLen = this.item.childrenRefs.length -1;
        			if((trueLen - index) < currentTrueLen){
        				return true;
        			}
        		}
        		return false;
        	}
        	getBreakpoint(): string {
        	    if (window.matchMedia(this.breakpoints.xl).matches) return ''xl'';
        	    if (window.matchMedia(this.breakpoints.lg).matches) return ''lg'';
        	    if (window.matchMedia(this.breakpoints.md).matches) return ''md'';
        	    if (window.matchMedia(this.breakpoints.sm).matches) return ''sm'';
        	    return ''xs'';
        	}
        	getArraySize(breakpoint: string): any {
        	  const config = {
        	    xl: this.local.computedColSize,
        	    lg: this.local.computedColSize,
        	    md: this.local.computedTabletSize,
        	    sm: this.local.computedPhoneLSize,
        	    xs: this.local.computedPhonePSize
        	  };
        	  return config[breakpoint];
        	}
        	cleanLayoutCssValue(value: any): string {
        		if (value == null) {
        			return "";
        		}
        		return ("" + value).replace(/\s*!important\s*/ig, "").trim();
        	}
        	applyLayoutTextColor(style: any, color: any): void {
        		const value = this.cleanLayoutCssValue(color);
        		if (value == "") {
        			return;
        		}
        		style["color"] = value;
        		style["--color"] = value;
        		style["--ion-text-color"] = value;
        		style["--c8o-box-text-color"] = value;
        	}
        	isLayoutLegacyDefaultTextColor(textColor: any, backgroundColor: any): boolean {
        		const value = this.cleanLayoutCssValue(textColor).toLowerCase().replace(/\s+/g, "");
        		if (value != "#ffffff" && value != "#fff" && value != "rgb(255,255,255)") {
        			return false;
        		}
        		return this.cleanLayoutCssValue(backgroundColor) == "";
        	}
        	getLayoutAutomaticTextColor(backgroundColor: any): string {
        		const rgb = this.getLayoutRgbFromCssColor(backgroundColor);
        		if (rgb == null) {
        			return "#000000";
        		}
        		const r = this.getLayoutLinearRgbChannel(rgb.r);
        		const g = this.getLayoutLinearRgbChannel(rgb.g);
        		const b = this.getLayoutLinearRgbChannel(rgb.b);
        		const luminance = (0.2126 * r) + (0.7152 * g) + (0.0722 * b);
        		const blackContrast = (luminance + 0.05) / 0.05;
        		const whiteContrast = 1.05 / (luminance + 0.05);
        		return blackContrast >= whiteContrast ? "#000000" : "#FFFFFF";
        	}
        	getLayoutRgbFromCssColor(value: any): any {
        		const color = this.cleanLayoutCssValue(value).toLowerCase();
        		if (color == "" || color == "transparent") {
        			return {r: 255, g: 255, b: 255};
        		}
        		let match = color.match(/^#([0-9a-f]{3})$/i);
        		if (match != null) {
        			return {
        				r: parseInt(match[1].charAt(0) + match[1].charAt(0), 16),
        				g: parseInt(match[1].charAt(1) + match[1].charAt(1), 16),
        				b: parseInt(match[1].charAt(2) + match[1].charAt(2), 16)
        			};
        		}
        		match = color.match(/^#([0-9a-f]{6})$/i);
        		if (match != null) {
        			return {
        				r: parseInt(match[1].substring(0, 2), 16),
        				g: parseInt(match[1].substring(2, 4), 16),
        				b: parseInt(match[1].substring(4, 6), 16)
        			};
        		}
        		match = color.match(/^rgba?\(\s*([0-9.]+)\s*,\s*([0-9.]+)\s*,\s*([0-9.]+)/i);
        		if (match != null) {
        			return {
        				r: Math.max(0, Math.min(255, parseFloat(match[1]))),
        				g: Math.max(0, Math.min(255, parseFloat(match[2]))),
        				b: Math.max(0, Math.min(255, parseFloat(match[3])))
        			};
        		}
        		return null;
        	}
        	getLayoutLinearRgbChannel(value: any): number {
        		const channel = Math.max(0, Math.min(255, parseFloat("" + value))) / 255;
        		return channel <= 0.03928 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
        	}
        	getLayoutChildBaseSpacingValue(property: string): string {
        		const defaults: any = {
        			margin: "0 10px 10px 0",
        			padding: "20px 27px",
        			verticalAlign: "stretch"
        		};
        		return defaults[property] || "";
        	}
        	normalizeLayoutVerticalAlign(value: any): string {
        		const normalized = this.cleanLayoutCssValue(value).toLowerCase();
        		if (normalized == "top" || normalized == "start" || normalized == "flex-start") {
        			return "start";
        		}
        		if (normalized == "bottom" || normalized == "end" || normalized == "flex-end") {
        			return "end";
        		}
        		if (normalized == "center" || normalized == "middle") {
        			return "center";
        		}
        		if (normalized == "stretch" || normalized == "fill") {
        			return "stretch";
        		}
        		return "";
        	}
        	getLayoutSpacingMap(value: any): any {
        		const normalized = this.cleanLayoutCssValue(value);
        		const parts = normalized == "" ? [] : normalized.split(/\s+/);
        		const map: any = {top: "0", right: "0", bottom: "0", left: "0"};
        		if (parts.length == 1) {
        			map.top = parts[0];
        			map.right = parts[0];
        			map.bottom = parts[0];
        			map.left = parts[0];
        		}
        		else if (parts.length == 2) {
        			map.top = parts[0];
        			map.right = parts[1];
        			map.bottom = parts[0];
        			map.left = parts[1];
        		}
        		else if (parts.length == 3) {
        			map.top = parts[0];
        			map.right = parts[1];
        			map.bottom = parts[2];
        			map.left = parts[1];
        		}
        		else if (parts.length >= 4) {
        			map.top = parts[0];
        			map.right = parts[1];
        			map.bottom = parts[2];
        			map.left = parts[3];
        		}
        		return map;
        	}
        	serializeLayoutSpacingMap(map: any): string {
        		const top = this.cleanLayoutCssValue(map?.top) || "0";
        		const right = this.cleanLayoutCssValue(map?.right) || "0";
        		const bottom = this.cleanLayoutCssValue(map?.bottom) || "0";
        		const left = this.cleanLayoutCssValue(map?.left) || "0";
        		if (top == right && top == bottom && top == left) {
        			return top;
        		}
        		if (top == bottom && right == left) {
        			return top + " " + right;
        		}
        		if (right == left) {
        			return top + " " + right + " " + bottom;
        		}
        		return top + " " + right + " " + bottom + " " + left;
        	}
        	getLayoutLastSpacingDefaultValue(property: string): string {
        		const value = this.getLayoutChildrenSpacingValue("default", property);
        		if (property != "margin") {
        			return value;
        		}
        		const map = this.getLayoutSpacingMap(value);
        		map.right = "0";
        		return this.serializeLayoutSpacingMap(map);
        	}
        	getLayoutChildrenSpacingStyle(scope: string): any {
        		const config = this.item?.config?.layoutChildrenStyle;
        		if (config == null || typeof config != "object" || Array.isArray(config)) {
        			return null;
        		}
        		const style = config[scope];
        		if (style == null || typeof style != "object" || Array.isArray(style)) {
        			return null;
        		}
        		return style;
        	}
        	getLayoutChildrenSpacingValue(scope: string, property: string): string {
        		const style = this.getLayoutChildrenSpacingStyle(scope);
        		const value = this.cleanLayoutCssValue(style?.[property]);
        		if (value != "") {
        			return value;
        		}
        		if (scope == "default") {
        			return this.getLayoutChildBaseSpacingValue(property);
        		}
        		if (scope == "last") {
        			return this.getLayoutLastSpacingDefaultValue(property);
        		}
        		return this.getLayoutChildrenSpacingValue("default", property);
        	}
        	getLayoutChildrenExplicitStyleValue(scope: string, property: string): string {
        		const style = this.getLayoutChildrenSpacingStyle(scope);
        		const value = this.cleanLayoutCssValue(style?.[property]);
        		if (value != "") {
        			return value;
        		}
        		if (scope != "default") {
        			return this.getLayoutChildrenExplicitStyleValue("default", property);
        		}
        		return "";
        	}
        	getLayoutColumnSizeAt(index: number, sizes: any[]): number {
        		const rawSize = sizes[index % sizes.length];
        		let size = parseFloat("" + rawSize);
        		if (isNaN(size) || size <= 0) {
        			return 12;
        		}
        		return Math.min(size, 12);
        	}
        	getLayoutRowPosition(index: number): any {
        		const current = this.local.currentBreakpoint ? this.getArraySize(this.local.currentBreakpoint) : null;
        		const children = Array.isArray(this.item?.childrenRefs) ? this.item.childrenRefs : [];
        		if (!Array.isArray(current) || current.length == 0 || children.length == 0) {
        			return {first: false, last: false};
        		}
        		let rowStart = 0;
        		let rowWidth = 0;
        		for (let i = 0; i < children.length; i++) {
        			const size = this.getLayoutColumnSizeAt(i, current);
        			if (rowWidth > 0 && rowWidth + size > 12) {
        				if (index >= rowStart && index < i) {
        					return {first: index == rowStart, last: false};
        				}
        				rowStart = i;
        				rowWidth = 0;
        			}
        			rowWidth += size;
        			if (rowWidth >= 12) {
        				if (index >= rowStart && index <= i) {
        					return {first: index == rowStart, last: index == i};
        				}
        				rowStart = i + 1;
        				rowWidth = 0;
        			}
        		}
        		return {
        			first: index == rowStart,
        			last: false
        		};
        	}
        	getLayoutChildSpacingValue(index: number, property: string): string {
        		let value = this.getLayoutChildrenSpacingValue("default", property);
        		const position = this.getLayoutRowPosition(index);
        		if (position.first) {
        			value = this.getLayoutChildrenSpacingValue("first", property);
        		}
        		if (position.last) {
        			value = this.getLayoutChildrenSpacingValue("last", property);
        		}
        		return value;
        	}
        	getLayoutChildExplicitStyleValue(index: number, property: string): string {
        		let value = this.getLayoutChildrenExplicitStyleValue("default", property);
        		const position = this.getLayoutRowPosition(index);
        		if (position.first) {
        			value = this.getLayoutChildrenExplicitStyleValue("first", property);
        		}
        		if (position.last) {
        			value = this.getLayoutChildrenExplicitStyleValue("last", property);
        		}
        		return value;
        	}
        	composeLayoutChildBorderValue(width: string, style: string, color: string): string {
        		return (width || "1px") + " " + (style || "solid") + " " + (color || "#E5E7EB");
        	}
        	getLayoutChildBorderValue(index: number): string {
        		const border = this.getLayoutChildExplicitStyleValue(index, "border");
        		if (border != "") {
        			return border;
        		}
        		const width = this.getLayoutChildExplicitStyleValue(index, "borderWidth");
        		const style = this.getLayoutChildExplicitStyleValue(index, "borderStyle");
        		const color = this.getLayoutChildExplicitStyleValue(index, "borderColor");
        		if (width == "" && style == "" && color == "") {
        			return "";
        		}
        		return this.composeLayoutChildBorderValue(width, style, color);
        	}
        	applyLayoutChildExplicitStyle(style: any, index: number): void {
        		const backgroundColor = this.getLayoutChildExplicitStyleValue(index, "backgroundColor");
        		let textColor = this.getLayoutChildExplicitStyleValue(index, "textColor");
        		const textColorModeFlag = this.getLayoutChildExplicitStyleValue(index, "textColorMode").toLowerCase();
        		if (textColorModeFlag == "none" || textColorModeFlag == "unset" || textColorModeFlag == "default") {
        			textColor = "";
        		}
        		else if (textColorModeFlag == "auto" && textColor == "") {
        			textColor = "auto";
        		}
        		else if (textColorModeFlag == "" && this.isLayoutLegacyDefaultTextColor(textColor, backgroundColor)) {
        			textColor = "";
        		}
        		const textColorMode = textColor.toLowerCase();
        		if (backgroundColor != "") {
        			style["background-color"] = backgroundColor;
        		}
        		if (textColor != "" && textColorMode != "none" && textColorMode != "unset") {
        			this.applyLayoutTextColor(style, textColorMode == "auto" ? this.getLayoutAutomaticTextColor(backgroundColor || style["background-color"]) : textColor);
        		}
        		const border = this.getLayoutChildBorderValue(index);
        		if (border != "") {
        			style["border"] = border;
        		}
        		const borderRadius = this.getLayoutChildExplicitStyleValue(index, "borderRadius");
        		if (borderRadius != "") {
        			style["border-radius"] = borderRadius;
        		}
        		const sides: any = {
        			borderTop: "border-top",
        			borderRight: "border-right",
        			borderBottom: "border-bottom",
        			borderLeft: "border-left"
        		};
        		Object.keys(sides).forEach((property) => {
        			const value = this.getLayoutChildExplicitStyleValue(index, property);
        			if (value != "") {
        				style[sides[property]] = value;
        			}
        		});
        	}
        	getViewerBoxStyleForChild(child: any): any {
        		const item = this.pageOwner?.getItemById?.(child);
        		if (item == null || this.pageOwner == null || typeof this.pageOwner.getViewerItemBoxStyle != "function") {
        			return {};
        		}
        		return this.pageOwner.getViewerItemBoxStyle(item) || {};
        	}
        	getLayoutChildParentVerticalAlignValue(index: number): string {
        		const value = this.normalizeLayoutVerticalAlign(this.getLayoutChildExplicitStyleValue(index, "verticalAlign"));
        		return value != "" ? value : "stretch";
        	}
        	getLayoutChildLocalVerticalAlignValue(child: any): string {
        		const item = this.pageOwner?.getItemById?.(child);
        		return this.normalizeLayoutVerticalAlign(item?.config?.boxStyle?.verticalAlign);
        	}
        	getLayoutChildVerticalAlignValue(child: any, index: number): string {
        		const childValue = this.getLayoutChildLocalVerticalAlignValue(child);
        		if (childValue != "") {
        			return childValue;
        		}
        		return this.getLayoutChildParentVerticalAlignValue(index);
        	}
        	getLayoutChildColumnStyle(child: any, index: number): any {
        		const align = this.getLayoutChildVerticalAlignValue(child, index);
        		const style: any = {
        			display: "flex",
        			"flex-direction": "column",
        			"align-self": "stretch",
        			"align-items": "stretch",
        			"min-width": "0"
        		};
        		if (align == "center") {
        			style["justify-content"] = "center";
        		}
        		else if (align == "end") {
        			style["justify-content"] = "flex-end";
        		}
        		else if (align == "start") {
        			style["justify-content"] = "flex-start";
        		}
        		else {
        			style["justify-content"] = "flex-start";
        		}
        		return style;
        	}
        	getLayoutChildFieldsetStyle(child: any, index: number): any {
        		const align = this.getLayoutChildVerticalAlignValue(child, index);
        		const style: any = {
        			display: "flex",
        			"flex-direction": "column",
        			width: "100%",
        			"min-width": "0",
        			"align-items": "stretch",
        			border: "0",
        			margin: "0",
        			padding: "0"
        		};
        		if (align == "stretch") {
        			style["height"] = "100%";
        			style["flex"] = "1 1 auto";
        		}
        		else {
        			style["height"] = "auto";
        			style["flex"] = "0 0 auto";
        		}
        		return style;
        	}
        	getLayoutChildCardStyle(child: any, index: number): any {
        		const style: any = {};
        		const align = this.getLayoutChildVerticalAlignValue(child, index);
        		style["box-sizing"] = "border-box";
        		style["display"] = "flex";
        		style["flex-direction"] = "column";
        		style["align-self"] = "stretch";
        		style["width"] = "auto";
        		style["height"] = "auto";
        		if (align == "stretch") {
        			style["flex"] = "1 1 auto";
        			style["min-height"] = "0";
        		}
        		else {
        			style["flex"] = "0 0 auto";
        			style["min-height"] = "0";
        		}
        		const margin = this.getLayoutChildSpacingValue(index, "margin");
        		const padding = this.getLayoutChildSpacingValue(index, "padding");
        		if (margin != "") {
        			style["margin"] = margin;
        		}
        		if (padding != "") {
        			style["padding"] = padding;
        		}
        		this.applyLayoutChildExplicitStyle(style, index);
        		const childStyle = this.getViewerBoxStyleForChild(child);
        		const keys = ["margin", "padding", "background-color", "color", "--color", "--ion-text-color", "--c8o-box-text-color", "border", "border-radius", "border-top", "border-right", "border-bottom", "border-left"];
        		for (let i = 0; i < keys.length; i++) {
        			const key = keys[i];
        			if (childStyle[key] != null) {
        				style[key] = childStyle[key];
        			}
        		}
        		return style;
        	}
        	
        	/*End_c8o_CompFunction*/
