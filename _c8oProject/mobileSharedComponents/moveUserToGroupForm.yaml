                			}
                			
                			let docs = page.myaggrid3?.agGrid?.api?.getSelectedNodes().map((node) => { return node.data.group });
                			let docs2 = page.local.navParams.data.selectedUsers.map((node) => { return node.data["~c8oAcl"]});
                			var deleted : any = {success: true};	
                 
                			let meta = {groups: JSON.stringify([page.local.navParams.data.groupSelected]), users: JSON.stringify(docs2)};
                			let sequence = "C8Oforms.admin_users_remove_from_groups";
                			deleted = await this.c8o.callJsonObject(sequence, meta).async();
                   
                			meta = {groups: JSON.stringify(docs), users: JSON.stringify(docs2)};
                			sequence = "C8Oforms.admin_users_post_in_groups";
                
                			deleted = await page.c8o.callJsonObject(sequence, meta).async();
                			if(deleted || (deleted?.success != undefined && deleted?.success.length == 0) || deleted?.success || deleted?.success.indexOf(''is added'') != -1){
                				if (page.local.navParams.data.countUsersGroup == page.local.navParams.data.selectedUsers.length) {
