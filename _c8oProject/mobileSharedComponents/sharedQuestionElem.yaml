        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public getQuestionHtml(): string {
        		if (this.item?.type === "ion-card") {
        			return this.item?.config?.title?.html || "";
        		}
        		return this.item?.config?.html || "";
        	}
        
        	public setQuestionHtml(html: string): void {
        		if (this.item?.type === "ion-card") {
        			if (this.item.config == null) {
        				this.item.config = {};
        			}
        			if (this.item.config.title == null) {
        				this.item.config.title = {};
        			}
        			this.item.config.title.html = html;
        			this.item.config.title.personalized = true;
        			return;
        		}
        		if (this.item?.config != null) {
        			this.item.config.html = html;
        		}
        	}
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		if (this.local.sharedQuestionPaletteCollapsed === undefined) {
