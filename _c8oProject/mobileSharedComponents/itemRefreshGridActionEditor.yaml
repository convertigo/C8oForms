        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public isFlowEditorTab(tab: string): boolean {
        		const selected = this.owner?.["getSelectedMainEditorTab"]?.(this.item);
        		return selected == null || selected === "" || selected === tab;
        	}
        	/*End_c8o_CompDeclaration*/
