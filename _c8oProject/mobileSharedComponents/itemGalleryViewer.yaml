        	public checkColumnDefs(colDef) {
        		let columns = [];
        		try {
        			if (Array.isArray(colDef)) {
        				columns = colDef.map((col) => {
        					if (typeof col == "string") {
        						return { field: col, headerName: col };
        					}
        					return col;
        				});
        			}
        			if (columns.length == 0 && Array.isArray(this.item?.config?.columns)) {
        				columns = this.item.config.columns.map((col) => {
        					const name = col?.name || col?.field || col?.headerName;
        					return { field: name, headerName: name };
        				});
        			}
        		}
        		catch (e) {
        			columns = [];
        		}
        		return columns.filter((col) => col != null && col.hide !== true && (col.field != null || col.headerName != null));
        	}
        	
        	public getGallerySourceConfig() {
        		try {
        			if (this.item?.config?.sourceEnabled === false) {
        				// local data: ignore any leftover enabled source
        				return null;
        			}
        			const sources = this.item?.sources;
        			if (sources == null) {
        				return null;
        			}
        			let source = null;
        			if (this.pageOwner?.getEnabled != null) {
        				const enabled = this.pageOwner.getEnabled(sources);
        				source = enabled != null ? sources[enabled] : null;
        			}
        			if (source == null) {
        				for (let name in sources) {
        					if (sources[name]?.enabled == true) {
        						source = sources[name];
        						break;
        					}
        				}
        			}
        			let raw = source?.vars?.forms_config != null ? source.vars.forms_config : source?.vars?.formsConfig;
        			if (raw != null && raw.str != undefined) {
        				raw = raw.str;
        			}
        			if (typeof raw == "string" && raw.trim() != "") {
        				return JSON.parse(raw);
        			}
        			if (raw != null && typeof raw == "object") {
        				return raw;
        			}
        		}
        		catch (e) {
        		}
        		return null;
        	}
        	
        	public pushGalleryPreviewColumn(columns, seen, name) {
        		if (name == null || ("" + name).trim() == "") {
        			return;
        		}
        		const key = "" + name;
        		if (seen[key] == true) {
        			return;
        		}
        		seen[key] = true;
        		columns.push({ field: key, headerName: key });
        	}
        	
        	public getGalleryPreviewColumns() {
        		let columns = this.checkColumnDefs(this.model?.colDef != undefined ? this.model.colDef : []);
        		if (columns.length > 0) {
        			return columns;
        		}
        		const seen = {};
        		columns = [];
        		const sourceConfig = this.getGallerySourceConfig();
        		if (sourceConfig != null) {
        			if (Array.isArray(sourceConfig.columns)) {
        				sourceConfig.columns.forEach((column) => this.pushGalleryPreviewColumn(columns, seen, column));
        			}
        			if (Array.isArray(sourceConfig.hidden)) {
        				sourceConfig.hidden.forEach((column) => this.pushGalleryPreviewColumn(columns, seen, column));
        			}
        			this.pushGalleryPreviewColumn(columns, seen, sourceConfig.displayValue);
        			this.pushGalleryPreviewColumn(columns, seen, sourceConfig.value);
        		}
        		if (columns.length == 0 && Array.isArray(this.item?.config?.columns)) {
        			this.item.config.columns.forEach((column) => {
        				const name = column?.name || column?.field || column?.headerName || column;
        				this.pushGalleryPreviewColumn(columns, seen, name);
        			});
        		}
        		return columns;
        	}
        	
        	public getGalleryPreviewRows() {
        		const count = Math.max(1, this.getGalleryCardsPerLine());
        		const data = Array.isArray(this.model?.data) ? this.model.data : [];
        		if (data.length > 0) {
        			return data.slice(0, count);
        		}
        		const columns = this.getGalleryPreviewColumns();
        		const rows = [];
        		for (let index = 0; index < count; index++) {
        			const row = {};
        			columns.forEach((column) => {
        				const key = column.field || column.headerName;
        				if (key != null && key != "") {
        					row[key] = key + " " + (index + 1);
        				}
        			});
        			rows.push(row);
        		}
        		return rows;
        	}
        	
        	public getGalleryRows() {
        		if (this.disabled == true) {
        			return this.getGalleryPreviewRows();
        		}
        		return Array.isArray(this.model?.data) ? this.model.data : [];
        	}
        	
        	public getGalleryColumns() {
        		const rows = this.getGalleryRows();
        		let columns = this.checkColumnDefs(this.model?.colDef != undefined ? this.model.colDef : []);
        		if (columns.length == 0 && rows.length > 0 && rows[0] != null) {
        			columns = Object.keys(rows[0]).filter((key) => key != "__rowValue").map((key) => ({ field: key, headerName: key }));
        		}
        		return columns;
        	}
        	
        	public getGalleryCellRawValue(row, column) {
        		if (row == null || column == null) {
        			return "";
        		}
        		const field = column.field || column.headerName;
        		return row[field];
        	}
        	
        	public getGalleryDisplayValue(value) {
        		if (value == null) {
        			return "";
        		}
        		if (Array.isArray(value)) {
        			return value.map((entry) => this.getGalleryDisplayValue(entry)).filter((entry) => entry != "").join(", ");
        		}
        		if (typeof value == "object") {
        			if (value.displayValue != undefined) {
        				return this.getGalleryDisplayValue(value.displayValue);
        			}
        			if (value.value != undefined) {
        				return this.getGalleryDisplayValue(value.value);
        			}
        			if (value.name != undefined) {
        				return value.name;
        			}
        			if (Object.prototype.hasOwnProperty.call(value, "value") || Object.prototype.hasOwnProperty.call(value, "displayValue")) {
        				// cell descriptor with a null value: render nothing
        				return "";
        			}
        			try {
        				return JSON.stringify(value);
        			}
        			catch (e) {
        				return "";
        			}
        		}
        		return "" + value;
        	}
        	
        	public escapeGalleryHtml(value) {
        		return ("" + (value == null ? "" : value))
        			.replace(/&/g, "&amp;")
        			.replace(/</g, "&lt;")
        			.replace(/>/g, "&gt;")
        			.replace(/"/g, "&quot;")
        			.replace(new RegExp(String.fromCharCode(39), "g"), "&#39;");
        	}
        	
        	public getGalleryRowValue(row) {
        		if (row == null) {
        			return {};
        		}
        		if (row.__rowValue != undefined) {
        			return row.__rowValue;
        		}
        		const data = {};
        		for (let key in row) {
        			if (key == "__rowValue") {
        				continue;
        			}
        			const current = row[key];
        			if (current != null && typeof current == "object") {
        				data[current.technicalName || key] = current.value != undefined ? current.value : this.getGalleryDisplayValue(current);
        			}
        			else {
        				data[key] = current;
        			}
        		}
        		return data;
        	}
        	
        	public galleryValueEquals(a, b) {
        		try {
        			return JSON.stringify(this.normalizeGalleryComparableValue(a)) == JSON.stringify(this.normalizeGalleryComparableValue(b));
        		}
        		catch (e) {
        			return false;
        		}
        	}
        	
        	public normalizeGalleryComparableValue(value) {
        		if (value == null || typeof value != "object") {
        			return value;
        		}
        		if (Array.isArray(value)) {
        			return value.map((entry) => this.normalizeGalleryComparableValue(entry));
        		}
        		const normalized = {};
        		Object.keys(value).sort().forEach((key) => {
        			normalized[key] = this.normalizeGalleryComparableValue(value[key]);
        		});
        		return normalized;
        	}
        	
        	public normalizeGallerySelectedEntry(entry) {
        		if (entry == null) {
        			return null;
        		}
        		if (entry.data != undefined) {
        			return this.getGalleryRowValue(entry.data);
        		}
        		return entry;
        	}
        	
        	public getGallerySelectedValues() {
        		const selected = this.outModel?.value;
        		if (Array.isArray(selected)) {
        			return selected.map((entry) => this.normalizeGallerySelectedEntry(entry)).filter((entry) => entry != null);
        		}
        		const techGridSelected = this.pageOwner?.local?.techGrid?.[this.item?.name];
        		if (Array.isArray(techGridSelected)) {
        			return techGridSelected.map((entry) => this.normalizeGallerySelectedEntry(entry)).filter((entry) => entry != null);
        		}
        		return [];
        	}
        	
        	public getGalleryTechGridSelection(selected) {
        		const rows = this.getGalleryRows();
        		return selected.map((entry) => {
        			const rawRow = rows.find((row) => this.galleryValueEquals(this.getGalleryRowValue(row), entry));
        			return { data: rawRow != null ? rawRow : entry };
        		});
        	}
        	
        	public getGalleryReturnedValue() {
        		let returnedValue = this.item?.config?.returned_value;
        		if (returnedValue != null && typeof returnedValue == "object" && returnedValue.item != undefined) {
        			returnedValue = returnedValue.item;
        		}
        		return returnedValue == "cell_selected" ? "row_selected" : returnedValue;
        	}
        	
        	public isGalleryValueEmpty() {
        		const returnedValue = this.getGalleryReturnedValue();
        		const value = this.outModel?.value;
        		if (returnedValue == "multiple_row_selected" || returnedValue == "all_the_data") {
        			return !Array.isArray(value) || value.length == 0;
        		}
        		return value == null || value == "" || (typeof value == "object" && !Array.isArray(value) && Object.keys(value).length == 0);
        	}
        	
        	public updateGalleryMandatoryError() {
        		if (this.item?.config?.mandatory != true || this.redList == null) {
        			return;
        		}
        		const isEmpty = this.isGalleryValueEmpty();
        		if (this.redList === true || this.redList === false) {
        			this.redList = isEmpty;
        		}
        		else {
        			this.redList[this.item.name] = isEmpty;
        		}
        	}
        	
        	public isGalleryRowSelected(row) {
        		const selected = this.outModel?.value;
        		const rowValue = this.getGalleryRowValue(row);
        		if (this.getGalleryReturnedValue() == "multiple_row_selected") {
        			return this.getGallerySelectedValues().some((entry) => this.galleryValueEquals(entry, rowValue));
        		}
        		return selected != null && Object.keys(selected || {}).length > 0 && this.galleryValueEquals(selected, rowValue);
        	}
        	
        	public getConfiguredGalleryTemplate() {
        		const template = this.item?.config?.galleryTemplate;
        		if (typeof template == "string") {
        			return template.trim() != "" ? template : "";
        		}
        		if (template != null && typeof template == "object" && typeof template.str == "string") {
        			return template.str.trim() != "" ? template.str : "";
        		}
        		return "";
        	}
        	
        	public isGalleryPreviewFromDataSource() {
        		if (this.disabled != true) {
        			return false;
        		}
        		if (this.item?.config?.sourceEnabled === false) {
        			return false;
        		}
        		return this.getGallerySourceConfig() != null || this.item?.sources != null;
        	}
        
        	public getGalleryParentItem() {
        		const page = this.pageOwner;
        		if (page != null && typeof page.getResetParentItem == "function") {
        			return page.getResetParentItem(this.item);
        		}
        		const allItems = Array.isArray(page?.formsList) ? page.formsList : (Array.isArray(page?.form?.formulaire) ? page.form.formulaire : []);
        		if (this.item == null || allItems.length == 0) {
        			return null;
        		}
        		for (let parent of allItems) {
        			if (parent == null || parent.id == this.item.id) {
        				continue;
        			}
        			if (this.item.parentRef != null && +this.item.parentRef == +parent.id) {
        				return parent;
        			}
        			if (Array.isArray(parent.childrenRefs) && parent.childrenRefs.map((x) => +x).indexOf(+this.item.id) != -1) {
        				return parent;
        			}
        			if (Array.isArray(parent.childrenRefsElse) && parent.childrenRefsElse.map((x) => +x).indexOf(+this.item.id) != -1) {
        				return parent;
        			}
        		}
        		return null;
        	}
        
        	public isGalleryInsideLayout() {
        		return this.getGalleryParentItem()?.type == "layout";
        	}
        	
        	public getGalleryColumnByName(columns, name) {
        		if (name == null) {
        			return null;
        		}
        		const key = ("" + name).trim();
        		return columns.find((column) => (column.field || column.headerName) == key || column.headerName == key) || { field: key, headerName: key };
        	}
        	
        	public decodeGalleryTemplateHtml(template) {
        		const html = "" + template;
        		if (html.indexOf("&lt;") == -1 && html.indexOf("&gt;") == -1 && html.indexOf("&amp;") == -1) {
        			return html;
        		}
        		try {
        			const textarea = document.createElement("textarea");
        			textarea.innerHTML = html;
        			const decoded = textarea.value;
        			if (decoded.indexOf("<") != -1 && decoded.indexOf(">") != -1) {
        				return decoded;
        			}
        		}
        		catch (e) {
        		}
        		return html;
        	}
        	
        	public prepareGalleryTemplateHtml(template) {
        		// TinyMCE blank lines may be serialized as <p></p> or <p><span></span></p>:
        		// mark them and give them a real line box so they survive rendering
        		try {
        			const container = document.createElement("div");
        			container.innerHTML = this.decodeGalleryTemplateHtml(template);
        			container.querySelectorAll("p").forEach((p) => {
        				const text = (p.textContent || "").replace(/\u00a0/g, " ").trim();
        				if (text == "" && p.querySelector("img,svg,table,div,br") == null) {
        					p.innerHTML = "&nbsp;";
        					p.setAttribute("data-gallery-blank", "true");
        				}
        			});
        			return container.innerHTML;
        		}
        		catch (e) {
        			return "" + template;
        		}
        	}
        	
        	public getGalleryTemplateTokenLabel(rawToken) {
        		try {
        			const match = ("" + rawToken).match(/\{[\s\S]*\}/);
        			if (match != null) {
        				const meta = JSON.parse(match[0]);
        				return meta.name || meta.c8oName || meta.c8oPrettyPath || meta.c8opath || "";
        			}
        		}
        		catch (e) {
        		}
        		return "";
        	}
        	
        	public renderGalleryTemplateHtmlPreview(template) {
        		let prepared = this.prepareGalleryTemplateHtml(template);
        		return prepared.replace(/\$\$(?:START)?(\d+)([\s\S]*?)(?:END)?(?:\d+)?\$\$/g, (match) => {
        			const label = this.getGalleryTemplateTokenLabel(match);
        			if (label == "") {
        				return "";
        			}
        			return `<span class="styleBadge badge badge-md c8o-gallery-template-token" contenteditable="false">${this.escapeGalleryHtml(label)}</span>`;
        		});
        	}
        	
        	public cleanGalleryRenderedHtml(html) {
        		// evaluated badges inject block divs inside <p>, the browser parser then
        		// splits the paragraph and leaves empty <p></p> artifacts: drop them
        		try {
        			const container = document.createElement("div");
        			container.innerHTML = "" + html;
        			container.querySelectorAll("p:not([data-gallery-blank])").forEach((p) => {
        				const text = (p.textContent || "").replace(/\u00a0/g, " ").trim();
        				if (text == "" && p.querySelector("img,svg,table,div,br") == null) {
        					p.remove();
        				}
        			});
        			return container.innerHTML;
        		}
        		catch (e) {
        			return "" + html;
        		}
        	}
        	
        	public renderGalleryTemplate(template, row, columns, index) {
        		if (template == null || template == "") {
        			return "";
        		}
        		const prepared = this.prepareGalleryTemplateHtml(template);
        		if (prepared.indexOf("$$") != -1) {
        			return this.renderGalleryCurrentForTemplate(prepared, row, columns, index);
        		}
        		return prepared.replace(/\{\{\s*(value|column)\s*:\s*([^}]+?)\s*\}\}/g, (match, kind, fieldName) => {
        			const column = this.getGalleryColumnByName(columns, fieldName);
        			if (kind == "column") {
        				return this.escapeGalleryHtml(column?.headerName || column?.field || fieldName);
        			}
        			return this.escapeGalleryHtml(this.getGalleryDisplayValue(this.getGalleryCellRawValue(row, column)));
        		}).replace(/\{\{\s*index\s*\}\}/g, "" + (index + 1));
        	}
        
        	public getGalleryCurrentForElement(row, columns) {
        		const current = {};
        		columns.forEach((column) => {
        			const key = column?.field || column?.headerName;
        			if (key != null && key != "") {
        				// one object per field: X.displayName is the column name, X.displayValue
        				// the cell value; toString keeps a bare drop rendering the value
        				const raw = this.getGalleryCellRawValue(row, column);
        				const rawValue = raw != null && typeof raw == "object" && Object.prototype.hasOwnProperty.call(raw, "value") ? raw.value : raw;
        				const entry = {
        					displayName: "" + (column?.headerName || column?.field || key),
        					name: "" + key,
        					displayValue: this.getGalleryDisplayValue(raw),
        					value: rawValue == null ? "" : rawValue
        				};
        				entry.toString = function () {
        					return "" + (this.displayValue == null ? "" : this.displayValue);
        				};
        				current[key] = entry;
        			}
        		});
        		return current;
        	}
        
        	public renderGalleryPreviewTemplate(template, row, columns, index) {
        		// editor preview: the page does not embed the $$ evaluator, resolve the
        		// badge tokens locally against the current card row
        		try {
        			const api = { currentFor: { index: index, element: this.getGalleryCurrentForElement(row, columns) } };
        			const regex = /\$\$(?:START)?(\d+)(.*?)(?:END)?(?:\d+)?\$\$/g;
        			const rendered = ("" + template).replace(regex, (match, id, metaStr) => {
        				try {
        					const meta = JSON.parse(metaStr.replace(/\\/g, ""));
        					const value = eval(meta.c8opath);
        					return value == null ? "" : this.escapeGalleryHtml("" + value);
        				}
        				catch (e) {
        					return "";
        				}
        			});
        			return this.cleanGalleryRenderedHtml(rendered);
        		}
        		catch (e) {
        			return "";
        		}
        	}
        	
        	public renderGalleryCurrentForTemplate(template, row, columns, index) {
        		// evaluate each badge token in isolation: a field in error is simply
        		// hidden instead of breaking the whole card template
        		try {
        			const api = { currentFor: { index: index, element: this.getGalleryCurrentForElement(row, columns) } };
        			const regex = /\$\$(?:START)?(\d+)([\s\S]*?)(?:END)?(?:\d+)?\$\$/g;
        			const rendered = ("" + template).replace(regex, (match, id, metaStr) => {
        				try {
        					const meta = JSON.parse(metaStr.replace(/\\/g, ""));
        					const value = eval(meta.c8opath);
        					return value == null ? "" : "" + value;
        				}
        				catch (e) {
        					try {
        						this.c8o.log.warn("[gallery] Field hidden, unable to render a card template token", e);
        					}
        					catch (ignored) {
        					}
        					return "";
        				}
        			});
        			return this.cleanGalleryRenderedHtml(rendered);
        		}
        		catch (e) {
        			try {
        				this.c8o.log.warn("[gallery] Unable to render gallery card template", e);
        			}
        			catch (ignored) {
        			}
        			return "";
        		}
        	}
        	
        	public isGallerySelectable() {
        		const returnedValue = this.getGalleryReturnedValue();
        		return this.disabled != true && (returnedValue == "row_selected" || returnedValue == "multiple_row_selected");
        	}
        	
        	public getGalleryBreakpoint(): string {
        		if (window.matchMedia(this.breakpoints.xl).matches) return "xl";
        		if (window.matchMedia(this.breakpoints.lg).matches) return "lg";
        		if (window.matchMedia(this.breakpoints.md).matches) return "md";
        		if (window.matchMedia(this.breakpoints.sm).matches) return "sm";
        		return "xs";
        	}
        	
        	public normalizeGalleryCardsPerLine(value, fallback) {
        		const parsed = parseInt(value, 10);
        		return isNaN(parsed) || parsed < 1 ? fallback : parsed;
        	}
        	
        	public getGalleryCardsPerLine() {
        		const config = this.item?.config || {};
        		const desktop = this.normalizeGalleryCardsPerLine(config.cardsPerLine, 1);
        		const tablet = this.normalizeGalleryCardsPerLine(config.cardsPerLineTablet, desktop);
        		const phoneL = this.normalizeGalleryCardsPerLine(config.cardsPerLinePhoneL, tablet);
        		const phoneP = this.normalizeGalleryCardsPerLine(config.cardsPerLinePhoneP, 1);
        		const breakpoint = this.local.currentGalleryBreakpoint || this.getGalleryBreakpoint();
        		if (breakpoint == "md") {
        			return tablet;
        		}
        		if (breakpoint == "sm") {
        			return phoneL;
        		}
        		if (breakpoint == "xs") {
        			return phoneP;
        		}
        		return desktop;
        	}
        	
        	public isGalleryLoading() {
        		// same signal as grids: page.local.updating[item.id] is 0 while fetching
        		if (this.disabled == true) {
        			return false;
        		}
        		const updating = this.pageOwner?.local?.updating?.[this.item?.id];
        		if (updating === 0) {
        			return true;
        		}
        		// before the first fetch is wired, the model may still be missing entirely
        		return updating === undefined && (this.model == null || this.model.data === undefined);
        	}
        
        	public getGalleryHtml() {
        		const rows = this.getGalleryRows();
        		const columns = this.getGalleryColumns();
        		const template = this.getConfiguredGalleryTemplate();
        		const hasError = this.redList === true || this.redList?.[this.item?.name] === true;
        		const layoutClass = this.isGalleryInsideLayout() ? "c8o-gallery-layout" : "c8o-gallery-list";
        		const selectableClass = this.isGallerySelectable() ? "c8o-gallery-selectable" : "";
        		const cardsPerLine = this.getGalleryCardsPerLine();
        		const gridStyle = ` style="--c8o-gallery-cards-per-line: ${cardsPerLine}"`;
        		let html = `<div class="c8o-gallery-grid ${layoutClass} ${selectableClass} ${hasError ? "c8o-gallery-error" : ""}"${gridStyle}>`;
        		if (rows.length == 0) {
        			if (this.isGalleryLoading()) {
        				html += `<div class="c8o-gallery-empty c8o-gallery-loading"><ion-spinner name="dots"></ion-spinner><span>${this.escapeGalleryHtml(this.translate.instant("loading_data"))}</span></div>`;
        			}
        			else {
        				html += `<div class="c8o-gallery-empty">${this.escapeGalleryHtml(this.translate.instant("no_result_grid"))}</div>`;
        			}
        		}
        		rows.forEach((row, index) => {
        			const selected = this.isGalleryRowSelected(row);
        			const titleColumn = columns[0];
        			const title = titleColumn != null ? this.getGalleryDisplayValue(this.getGalleryCellRawValue(row, titleColumn)) : "";
        			const renderedTemplate = template != "" ? (this.isGalleryPreviewFromDataSource() ? this.renderGalleryTemplateHtmlPreview(template) : this.renderGalleryTemplate(template, row, columns, index)) : "";
        			const cardClass = renderedTemplate != "" ? "c8o-gallery-card-custom" : "c8o-gallery-card-fallback";
        			html += `<button type="button" class="c8o-gallery-card ${cardClass} ${selected ? "c8o-gallery-card-selected" : ""}" data-gallery-index="${index}">`;
        			if (renderedTemplate != "") {
        				html += renderedTemplate;
        			}
        			else {
        				html += `<span class="c8o-gallery-card-title">${this.escapeGalleryHtml(title || ("#" + (index + 1)))}</span>`;
        				html += `<span class="c8o-gallery-card-fields">`;
        				columns.slice(titleColumn != null ? 1 : 0).forEach((column) => {
        					const label = column.headerName || column.field;
        					const value = this.getGalleryDisplayValue(this.getGalleryCellRawValue(row, column));
        					html += `<span class="c8o-gallery-field"><span class="c8o-gallery-field-label">${this.escapeGalleryHtml(label)}</span><span class="c8o-gallery-field-value">${this.escapeGalleryHtml(value)}</span></span>`;
        				});
        				html += `</span>`;
        			}
        			html += `</button>`;
        		});
        		html += `</div>`;
        		return html;
        	}
        	
        	public getGalleryTrustedHtml() {
        		// keep a stable SafeHtml reference between change detection cycles, otherwise
        		// [innerHTML] replaces the DOM on every cycle and card clicks are lost
        		const html = this.getGalleryHtml();
        		if (this.local.galleryHtmlSignature != html || this.local.galleryTrustedHtml == null) {
        			this.local.galleryHtmlSignature = html;
        			this.local.galleryTrustedHtml = this.router.sanitizer.bypassSecurityTrustHtml(html);
        		}
        		return this.local.galleryTrustedHtml;
        	}
        	
        	public syncGalleryAllData() {
        		if (this.getGalleryReturnedValue() != "all_the_data" || this.outModel == null) {
        			return;
        		}
        		try {
        			const values = this.getGalleryRows().map((row) => this.getGalleryRowValue(row));
        			const signature = JSON.stringify(values);
        			if (this.local.galleryRowsSignature != signature) {
        				this.local.galleryRowsSignature = signature;
        				this.outModel.value = values;
        				this.runGalleryDependencies(false);
        			}
        		}
        		catch (e) {
        		}
        	}
        	
        	public async runGalleryDependencies(callConditions = true) {
        		const page = this.pageOwner;
        		try {
        			if (page?.local?.processingDataS == undefined) {
        				page.local.processingDataS = {};
        			}
        			if (page?.local?.functionsToBeCalled?.[this.item.id] != undefined) {
        				if (page.local.processingDataS[this.item.id] != undefined) {
        					try {
        						clearTimeout(page.local.processingDataS[this.item.id]);
        					}
        					catch (e) {
        					}
        				}
        				page.local.processingDataS[this.item.id] = setTimeout(async () => {
        					let alreadyDone = false;
        					let currentSHA = page.shaById?.[this.item.id];
        					try {
        						if (page.local.functionsToBeCalled[this.item.id].filter((x) => currentSHA == x).length > 0) {
        							await page.functionsById[currentSHA]();
        							alreadyDone = true;
        						}
        					}
        					catch (e) {
        						console.error("an error occured", e);
        					}
        					for (let id of page.local.functionsToBeCalled[this.item.id]) {
        						if (!(id == currentSHA && alreadyDone)) {
        							await page.functionsById[id]();
        						}
        					}
        					if (callConditions && page.checkForAnyCondition != undefined) {
        						page.checkForAnyCondition(undefined, true);
        					}
        					page.ref?.detectChanges();
        				}, 0);
        			}
        			else {
        				if (callConditions && page?.checkForAnyCondition != undefined) {
        					page.checkForAnyCondition(undefined, true);
        				}
        				page?.ref?.detectChanges();
        			}
        		}
        		catch (e) {
        			page?.c8o?.log?.error("Error while trying to refresh a gallery data source", e);
        		}
        	}
        	
        	public onGalleryContainerClick(event) {
        		const card = event?.target?.closest?.("[data-gallery-index]");
        		if (card == null || this.disabled == true) {
        			return;
        		}
        		const index = +card.getAttribute("data-gallery-index");
        		const row = this.getGalleryRows()[index];
        		if (row == null || this.outModel == null) {
        			return;
        		}
        		const returnedValue = this.getGalleryReturnedValue();
        		if (returnedValue != "row_selected" && returnedValue != "multiple_row_selected") {
        			return;
        		}
        		if (this.pageOwner.local.techGrid == undefined) {
        			this.pageOwner.local.techGrid = {};
        		}
        		const rowValue = this.getGalleryRowValue(row);
        		if (returnedValue == "multiple_row_selected") {
        			const selected = this.getGallerySelectedValues();
        			const existingIndex = selected.findIndex((entry) => this.galleryValueEquals(entry, rowValue));
        			if (existingIndex >= 0) {
        				selected.splice(existingIndex, 1);
        			}
        			else {
        				selected.push(rowValue);
        			}
        			this.outModel.value = selected;
        			this.pageOwner.local.techGrid[this.item.name] = this.getGalleryTechGridSelection(selected);
        		}
        		else {
        			if (this.isGalleryRowSelected(row)) {
        				this.outModel.value = {};
        				this.pageOwner.local.techGrid[this.item.name] = undefined;
        			}
        			else {
        				this.outModel.value = rowValue;
        				this.pageOwner.local.techGrid[this.item.name] = { data: row };
        			}
        		}
        		this.updateGalleryMandatoryError();
        		this.runGalleryDependencies(true);
        	}
