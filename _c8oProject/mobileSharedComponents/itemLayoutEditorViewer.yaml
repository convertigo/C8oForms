        	public trackById (index: number, obj: object): number{
          		return +obj;
        	};
        	public trackByObj (index: number, obj: object): number{
          		return +obj;
        	};
        	public identifyScheme(target, ouput){
        		let cols = this.item.config[target];
        		let colScheme = cols.reduce((acc, col) => {
        			acc.push(col.size);
        			return acc;
        		}, []).join(''_'');
        		this.local[ouput] = colScheme;
        	}
        	public getLayoutScheme(target){
        		let cols = this.item?.config?.[target] || [];
        		return cols.map((col) => {
        			return col.size;
        		}).join(''_'');
        	}
        	public refreshLayoutSizesIfNeeded(){
        		if (this.item?.config?.cols == null) {
        			return;
        		}
        		let colScheme = this.getLayoutScheme(''cols'');
        		let tabletScheme = this.getLayoutScheme(''tablet'');
        		let phoneLScheme = this.getLayoutScheme(''phoneL'');
        		let phonePScheme = this.getLayoutScheme(''phoneP'');
        		if (
        			this.local.colScheme !== colScheme ||
        			this.local.colSchemeTablet !== tabletScheme ||
        			this.local.colSchemePhoneL !== phoneLScheme ||
        			this.local.colSchemePhoneP !== phonePScheme
        		) {
        			this.local.colScheme = colScheme;
        			this.local.colSchemeTablet = tabletScheme;
        			this.local.colSchemePhoneL = phoneLScheme;
        			this.local.colSchemePhoneP = phonePScheme;
        			this.computeColSize();
        			this.computeTabletSize();
        			this.computePhoneLSize();
        			this.computePhonePSize();
        		}
        	}
        	public computeSize(target, output){
        		let cols = this.item.config[target];
        		this.local[output] = cols.filter((col, index) => {
        	        return col.size > 0;
        	     }).map((col)=>{
        			 return col.size;
        		 });
        	}
        	public identifyColScheme(){
        		this.identifyScheme(''cols'', ''colScheme'');
        	}
        	public identifyTabletScheme(){
        		this.identifyScheme(''tablet'', ''colSchemeTablet'');
        	}
        	public identifyPhoneLScheme(){
        		this.identifyScheme(''phoneL'', ''colSchemePhoneL'');
        	}
        	public identifyPhonePScheme(){
        		this.identifyScheme(''phoneP'', ''colSchemePhoneP'');
        	}
        	public computeColSize(){
        		this.computeSize(''cols'', ''computedColSize'');
        	}
        	public computeTabletSize(){
        		this.computeSize(''tablet'', ''computedTabletSize'');
        	}
        	public computePhoneLSize(){
        		this.computeSize(''phoneL'', ''computedPhoneLSize'');
        	}
        	public computePhonePSize() {
        		this.computeSize(''phoneP'', ''computedPhonePSize'');
        	}
        	public hasSelectedLayoutChild(): boolean {
        		const selected = this.idselectedC || this.pageOwner?.["idselectedC"];
        		return !(selected == null || selected === "");
        	}
        	public getComputedLayoutSize(sizeKey: string, index: number, fallback: number): number {
        		const sizes = this.local[sizeKey];
        		if (sizes == null || sizes.length == 0) {
        			return fallback;
        		}
        		return sizes[index % sizes.length];
        	}
        	public isSelectedLayoutChildRef(childRef: any): boolean {
        		const selected = this.idselectedC || this.pageOwner?.["idselectedC"];
        		if (selected == null || selected === "") {
        			return false;
        		}
        		const child = this.pageOwner?.getElementByID?.(childRef) || this.pageOwner?.getItemById?.(childRef);
        		return selected == childRef || (child != null && selected == child.id);
        	}
        	public canShowLayoutChildDropZones(): boolean {
        		if (this.pageOwner?.local?.dragging !== true || this.pageOwner?.local?.draggingActions === true) {
        			return false;
        		}
        		return !this.isDraggingThisLayoutOrAncestor();
        	}
        	public isDraggingThisLayoutOrAncestor(): boolean {
        		const origin = this.pageOwner?.local?.draggingOriginIndex;
        		if (origin == null || origin === "") {
        			return false;
        		}
        		const originIndexes = Array.isArray(origin) ? origin.map((part: any) => Number(part)) : String(origin || "").split(",").map((part: any) => Number(part));
        		if (!Number.isFinite(originIndexes[0])) {
        			return false;
        		}
        		const originParent = this.pageOwner?.formsList?.[originIndexes[0]];
        		const movedId = Number.isFinite(originIndexes[1]) ? (originParent?.childrenRefs?.[originIndexes[1]] ?? originParent?.children?.[originIndexes[1]]?.id) : originParent?.id;
        		if (movedId == null || this.item == null) {
        			return false;
        		}
        		let current = this.item;
        		let guard = 0;
        		while (current != null && guard < 1000) {
        			if ("" + current.id === "" + movedId) {
        				return true;
        			}
        			if (current.parentRef == null || current.parentRef === "") {
        				return false;
        			}
        			current = this.pageOwner?.formsList?.find((candidate: any) => "" + candidate?.id === "" + current.parentRef);
        			guard++;
        		}
        		return false;
        	}
        	/*End_c8o_CompFunction*/'
