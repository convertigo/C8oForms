      ↓callSequence [ngx.components.UICustomAsyncAction-1759506946995]: 
        actionValue: 
          - xmlizable: 
            - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
            - com.twinsoft.convertigo.beans.common.FormatedContent: 
              →: |
                '		try {
                			let resp = await page.c8o.callJsonObject("C8Oforms.admin_groups_post", {meta: JSON.stringify({group:page.formCreateGroup.form.value.group, user: page.global.settings[''~c8oAcl'']})}).async();
                			if(resp.success !== undefined){
                				try {
                					let meta = {_id: page.formCreateGroup.form.value.group, editing_rights: page.local.editing_rights, formulas: page.local.formulas_rights, publication: this.local.publication,nocode_db_rights: page.local.nocode_db_rights, admin: page.local.admin , admin_readonly: page.local.admin_readonly };
                					let data = await page.c8o.callJsonObject("C8Oforms.admin_group_upsert", {meta: JSON.stringify(meta)}).async();
                
                				} catch (e) {
                					await page.presentToast("An error occured", ''toastError'');
                					return false;
                				}
                				await page.presentToast(page.translate.instant("group_create_successfull", { userName: page.formCreateGroup.form.value.group }), ''toastSuccess'');
                				return true;
                			}
                			else if(resp.success == undefined){
                				await page.presentToast(page.translate.instant("group_already_exists", { userName: page.formCreateGroup.form.value.group }), ''toastError'');
                				return false;
                			}
                			else{
                				await page.presentToast(page.translate.instant("group_create_failed"), ''toastError'');
                				return false;
                			}
                		} catch (e) {
                			console.error(e);
                			await page.presentToast(page.translate.instant("group_create_failed"), ''toastError'');
                			return false;
                		}
                '
