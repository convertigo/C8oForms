      attrName: (ngSubmit)
      eventName: onSubmit
      ↓callSequence [ngx.components.UICustomAsyncAction-1740406706802]: 
        actionValue: 
          - xmlizable: 
            - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
            - com.twinsoft.convertigo.beans.common.FormatedContent: 
              →: |
                '		try {
                			let resp = await page.c8o.callJsonObject("C8Oforms.admin_groups_post", {meta: JSON.stringify({group:page.formCreateGroup.form.value.group, user: page.global.settings[''~c8oAcl'']})}).async();
                			if(resp.success !== undefined){
                				await page.presentToast(page.translate.instant("group_create_sucessfull", { userName: page.formCreateGroup.form.value.group }), ''toastSuccess'');
                				return true;
                			}
                			else if(resp.success == undefined){
                				await page.presentToast(page.translate.instant("group_alreaydy_exists", { userName: page.formCreateGroup.form.value.group }), ''toastError'');
                				return false;
                			}
                			else{
                				await page.presentToast(page.translate.instant("group_create_failed"), ''toastError'');
                				return false;
                			}
                		} catch (e) {
                			console.log(page);
                			console.error(e);
                			await page.presentToast(page.translate.instant("group_create_failed"), ''toastError'');
                			return false;
                		}
                '
