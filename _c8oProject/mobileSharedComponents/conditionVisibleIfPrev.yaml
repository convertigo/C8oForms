        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		this.local.multipleField = {radio_group: true, checkbox_group: true, checkbox: true, location: true};
                this.local.simpleField = {date: true, select: true, datetime: true, time: true, radio: true, text: true, barcode: true, slider: true, business_logic: true, grid: true};
                this.local.fileField = {file: true};
                this.local.camSignField = {img: true, signature:true};
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	public getType(type: string): string{
        	    if(this.local.multipleField[type] == true){
        	        return "multiple";
        	    }
        	    else if(this.local.simpleField[type] == true){
        	        return "simple";
        	    }
        	    else if(this.local.fileField[type] == true){
        	        return "file";
        	    }
                else if(this.local.camSignField[type] == true){
                    return "camSign"; 
                }
                else{
                    return "simple";
                }
        	    
        	}
        	public isConditionPreviewGroup(cond: any): boolean{
        		return cond != null && typeof(cond) == "object" && (Array.isArray(cond.conds) || Array.isArray(cond.groups) || Array.isArray(cond.__legacyConds));
        	}
        	public getConditionPreviewConds(group: any): Array<any>{
        		if(group == null || typeof(group) != "object"){
        			return [];
        		}
        		let conds = Array.isArray(group.conds) ? group.conds : (Array.isArray(group.cond) ? group.cond : []);
        		let groups = Array.isArray(group.groups) ? group.groups : [];
        		let legacyConds = Array.isArray(group.__legacyConds) ? group.__legacyConds : [];
        		return conds.concat(groups).concat(legacyConds);
        	}
        	public isPreviewItemRenderable(cond: any): boolean{
        		try{
        			if(this.isConditionPreviewGroup(cond)){
        				let children = this.getConditionPreviewConds(cond);
        				for(let i = 0; i < children.length; i++){
        					if(this.isPreviewItemRenderable(children[i])){
        						return true;
        					}
        				}
        				return false;
        			}
        			if(cond.subject == "never_visible"){
        				return true;
        			}
        			if(cond.subject == "form" && cond.attribute != undefined && cond.attribute != "" && cond.operator != undefined && cond.operator != ""){
        				return true;
        			}
        			if(cond.subject == "field" && cond.val1 != undefined && cond.operator != undefined && cond.operator != ""){
        				return true;
        			}
        			return false;
        		}
        		catch(e){
        			return false;
        		}
        	}
        	/*End_c8o_CompFunction*/
