        		else {
        			this.filteredIcons = sourceIcons;
        		}
        		return this.filteredIcons;
        	}
        	
        	public filterIconRows(){
        		var icons = this.filterIcons();
        		this.filteredIconRows = [];
        		for (var i = 0; i < icons.length; i += 3) {
        			this.filteredIconRows.push(icons.slice(i, i + 3));
        		}
