        	public filterIcons(){
        		var filter = this.local.filter || "";
        		var sourceIcons = this.getIconSourceList();
        		if (filter == this.lastFilter && sourceIcons == this.lastIconRowsSource) {
        			return this.filteredIcons;
        		}
        		this.lastFilter = filter;
        		this.lastIconRowsSource = sourceIcons;
        		if(filter != ""){
        			this.filteredIcons = sourceIcons.filter(function(x){return x.indexOf(filter) != -1});
