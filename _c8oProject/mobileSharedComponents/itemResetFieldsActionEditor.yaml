        /*Begin_c8o_CompDeclaration*/
        	public isFlowEditorTab(tab: string): boolean {
        		const selected = this.owner?.["getSelectedMainEditorTab"]?.(this.item);
        		return selected == null || selected === "" || selected === tab;
        	}
        
        	public ensureConfig() {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		if (this.item.config.scope == null || this.item.config.scope === "") {
        			this.item.config.scope = "application";
        		}
        	}
        
        	public scopeOptions() {
        		return [
        			{id: "application"},
        			{id: "page"},
        			{id: "component"}
        		];
        	}
        
        	public scopeLabel(value: string) {
        		return this.translate.instant("reset_fields_scope_" + value);
        	}
        
        	public targetPageOptions() {
        		const pages = Array.isArray(this.pageOwner?.form?.pages) ? this.pageOwner.form.pages : [];
        		return pages
        			.filter((page) => page?.pageTechName != null && page.pageTechName !== "")
        			.map((page) => ({id: page.pageTechName, name: page.name}));
        	}
        
        	public targetPageLabel(value: string) {
        		const page = this.pageOwner?.form?.pages?.find((item) => item?.pageTechName === value);
        		return page?.name || value || "";
        	}
        
        	public targetComponentOptions() {
        		const source = Array.isArray(this.pageOwner?.form?.formulaire) ? this.pageOwner.form.formulaire : [];
        		let out = [];
        		let seen = {};
        		let visit = (items) => {
        			if (!Array.isArray(items)) {
        				return;
        			}
        			for (let item of items) {
        				if (item?.id != null && item?.name != null && item.name !== "" && seen[item.id] !== true) {
        					seen[item.id] = true;
        					out.push({id: item.id, name: item.name, type: item.type});
        				}
        				if (Array.isArray(item?.children)) {
        					visit(item.children);
        				}
        			}
        		};
        		visit(source);
        		return out;
        	}
        
        	public targetComponentLabel(value: any) {
        		const id = +value;
        		const item = this.targetComponentOptions().find((elem) => +elem.id === id);
        		return item?.name || value || "";
        	}
        
        	public getActionValue(event: any) {
        		let value = event;
        		if (value != null && typeof value === "object" && value.out !== undefined) {
        			value = value.out;
        		}
        		if (value != null && typeof value === "object" && value.detail != null && value.detail.value !== undefined) {
        			value = value.detail.value;
        		}
        		if (value != null && typeof value === "object" && value.item !== undefined) {
        			return value.item;
        		}
        		return value;
        	}
        
        	public updateActionState() {
        		let owner = this.pageOwner != undefined ? this.pageOwner : this.owner;
        		if (owner != undefined && owner["updateState"] != undefined) {
        			owner["updateState"]();
        		}
        		this.itemChange.emit(this.item);
        		this.ref.markForCheck();
        	}
        
        	public setScope(event: any) {
        		this.ensureConfig();
        		this.item.config.scope = this.getActionValue(event);
        		this.updateActionState();
        	}
        
        	public setTargetPage(event: any) {
        		this.ensureConfig();
        		this.item.config.targetPage = this.getActionValue(event);
        		this.updateActionState();
        	}
        
        	public setTargetElement(event: any) {
        		this.ensureConfig();
        		this.item.config.targetElement = this.getActionValue(event);
        		this.updateActionState();
        	}
        	/*End_c8o_CompDeclaration*/
