        		close(data: any = null, role: string) {
        		  this.popoverController.dismiss(data, role);
        		}
        	
        			public async performBulk(bulkOperation: "deleteGroup" | "updateGroup" | "deleteUsersGroup" | "updateUsersGroup", confirmMsg: string, successMsg: string, errorMsg: string, cancelMsgBtn: string, confirmMsgBtn, right?: string, value?: any) {
        				try {
        					let docs = this.local.selectedNodes.map((node) => { return (bulkOperation == "deleteGroup") ? { "group": node.data.value } : { "oldGroup": node.data.value, newGroup: String(value?.newGroup) } });;
        					let docs2;
        					if (bulkOperation == "updateGroup" || bulkOperation == "deleteGroup") {
        						if (bulkOperation == ''deleteGroup'') {
        							docs2 = this.local.selectedNodes.map((node) => { 
        								return { 
        									"_id": node.data.value,
        									"editing_rights": node.data?.editing_rights || false,
        									"admin": node.data?.admin || false,
        									"nocode_db_rights": node.data?.nocode_db_rights || false,
        									"_rev": node.data?.rev
        								} 
        							});
        						}
        					}
        					let type = this.translate.instant("groups");
        					const performOperation = await this.showConfirmationAlert(
        						this.translate.instant("Confirmation"),
        						this.translate.instant(confirmMsg, { countlines: docs.length, resType: type }),
        						this.translate.instant(cancelMsgBtn),
        						this.translate.instant(confirmMsgBtn)
        					);
        
        					if (performOperation) {
        						let args: any = (bulkOperation != "updateUsersGroup" && bulkOperation != "deleteUsersGroup") ? { docs: JSON.stringify(docs) } : { meta: "" };
        						let sequence;
        						if (bulkOperation == "deleteGroup") {
        							docs.map((it) => {
        								if (it.group?.value != undefined) {
        									it.group = it.group.value;
        								}
        								
        								return it;
        							});
        							docs2.map((it) => {
        								if (it.group?.value != undefined) {
        									it.group = it.group.value;
        								}
        								
        								return it;
        							});
        							
        
        		//					let args: any;
        							docs2 = docs2.map((x)=>{
        								x._deleted = true;
        								return x;
        							});
        							
        		//					console.log(docs2);
        							args = {docs: JSON.stringify(docs2)};
        							args = {...args, "right": "editing_rights", "value": false};
        		//					console.log(args);
        							let data2 = await this.c8o.callJsonObject("C8Oforms.admin_group_upsert_bulk", args).async();
        		//					console.log(data2)
        		//					args = { docs: JSON.stringify(docs) };		
        		//					console.log(docs);		
        		//					let sequence;
        							for (let i = 0; i < docs.length; i++) {
        								args = { meta: JSON.stringify(docs[i]) };
        								sequence = "C8Oforms.admin_groups_delete";
        								let deleted = await this.c8o.callJsonObject(sequence, args).async();
        		//						console.log(deleted);
        //								this.loadGridData();
        								if (deleted?.success || deleted?.success == ''true'') {
        									await this.presentToast(this.translate.instant(successMsg, { countlines: docs.length }), ''toastSuccess'');
        								}
        								else {
        									await this.presentToast(this.translate.instant(errorMsg), ''toastError'');
        								}
        							}
        							return;
        						}
        						let deleted = await this.c8o.callJsonObject(sequence, args).async();
        //						await this.loadGridData();
        						if (deleted?.result?.success) {
        							await this.presentToast(this.translate.instant(successMsg, { countlines: docs.length }), ''toastSuccess'');
        						}
        						else {
        							await this.presentToast(this.translate.instant(errorMsg), ''toastError'');
        						}
        					}
        				} catch (e) {
        //					this.loadGridData();
        					this.close(null, "cancel");
        					await this.presentToast(this.translate.instant(errorMsg), ''toastError'');
        				}
        			}
        
        		public async showConfirmationAlert(header: string, message: string, cancelLabel: string, confirmLabel: string, confirmRed: boolean = true, cancelRed: boolean = false): Promise<boolean> {
        			const alert = await this.alertController.create({
        				header: header,
        				message: message,
        				backdropDismiss: false,
        //				cssClass: ''styleAlertHeight'',
        				cssClass: ''alert-custom text-generic'',
        				buttons: [
        					{
        						cssClass: cancelRed ? "btn text-generic width-fit-content btn-padding-start-0 height-28px btn--danger" : "btn text-generic width-fit-content btn-padding-start-0 height-28px btn--info",
        						text: cancelLabel,
        						role: ''cancel'',
        						handler: () => {
        							return false;
        						}
        					},
        					{
        						cssClass: confirmRed ? "btn text-generic width-fit-content btn-padding-start-0 height-28px btn--danger" : "btn text-generic width-fit-content btn-padding-start-0 height-28px btn--info",
        						text: confirmLabel,
        						handler: () => {
        							return true;
        						}
        					}
        				]
        			});
        
        			await alert.present();
        			return new Promise((resolve) => {
        				alert.onDidDismiss().then((data) => {
        					resolve(!(data.role == ''cancel''));
        				});
        			});
        		}
        		
        		async presentToast(message: string, cssClass: string = '''') {
        			const toast = await this.toastController.create({
        				message: message,
        				duration: 3000,
        				position: ''bottom'',
        				cssClass: cssClass,
        			});
        
        			await toast.present();
        		}
        	/*End_c8o_CompFunction*/
