        	public isJSON(el) {
        		try {
        			JSON.parse(el)
        			return true;
        		}
        		catch (e) {
        			return false;
        		}
        	}
        	public keys(el) {
        		if (el != null) {
        			return Object.keys(el);
        		}
        		return null;
        	}
        	public cptString(key, el) {
        		el = JSON.parse(el);
        		let str = this.translate.instant(key) + ": ";
        		if (Array.isArray(el[key])) {
        			str += el[key].join(", ")
        		} else {
        			str += el[key]
        		}
        		return str;
        	}
        
        	
        	private onCompare(_left: KeyValue<any, any>, _right: KeyValue<any, any>): number {
        		return -1;
        	}
        	
        	public displayDeleteButton(localName, value): void {
        		this.local[localName] = value;
        	}
        	public async __convertTsToText(sourceStr) {
        		try {
        			if (sourceStr == null) {
        				return "";
        			}
        			var raw = "" + sourceStr;
        			var body = raw.trim();
        			if (body.indexOf("(async ()=>{") === 0) {
        				var startReturn = body.indexOf("return ");
        				if (startReturn !== -1) {
        					body = body.substring(startReturn + 7);
        				}
        				var closing = body.lastIndexOf("})();");
        				if (closing !== -1) {
        					body = body.substring(0, closing);
        				}
        			}
        			body = body.trim();
        			if (body.indexOf("return ") === 0) {
        				body = body.substring(7);
        			}
        			body = body.trim();
        			if (body.lastIndexOf(";") === body.length - 1) {
        				body = body.substring(0, body.length - 1);
        			}
        			body = body.trim();
        			if (body === "") {
        				return "";
        			}
        			var translated = body;
        			var builder = "";
        			var tokenRegex = /(\$\$(?:START)?\d+(?:[\s\S]*?)(?:END)?(?:\d+)?\$\$|"(?:\\.|[^"\\])*")/g;
        			var lastIndex = 0;
        			var match;
        			var cleanup = function(fragment) {
        				return fragment.replace(/[+\s;\r\n()]/g, "");
        			};
        			while ((match = tokenRegex.exec(translated)) != null) {
        				if (match.index > lastIndex) {
        					var between = cleanup(translated.substring(lastIndex, match.index));
        					if (between.length > 0) {
        						return raw;
        					}
        				}
        				var token = match[0];
        				if (token.indexOf("$$") === 0) {
        					builder += token;
        				}
        				else {
        					var literal = token;
        					var value = "";
        					try {
        						value = JSON.parse(literal);
        					}
        					catch (ex) {
        						value = literal.substring(1, literal.length - 1);
        					}
        					builder += value;
        				}
        				lastIndex = match.index + match[0].length;
        			}
        			if (lastIndex < translated.length) {
        				var tail = cleanup(translated.substring(lastIndex));
        				if (tail.length > 0) {
        					return raw;
        				}
        			}
        			return builder;
        		}
        		catch (error) {
        			return sourceStr == null ? "" : "" + sourceStr;
        		}
        	};
        	/*End_c8o_CompFunction*/
