                                			// if it''s not ts
                                			if(page.currentObject.type != ''ts''){
                                				let alertController = page.getInstance(AlertController);
                                				// send an alert to confirm data will be lost
                                				const alert = await alertController.create({
                                			      header: page.translate.instant("header_pwamsg"),
                                			      subHeader: page.translate.instant("compat_js"),
                                			      buttons: [
                                					  {
                                						  text: page.translate.instant("cancel_pwamsg"),
                                						  role: ''cancel'',
                                					  },
                                					  {
                                  						  text: page.translate.instant("continue_pwamsg"),
                                  						  role: ''confirm'',
                                  					  },
                                					]
                                			    });
                                			    await alert.present();
                                			    let res = await alert.onDidDismiss();
                                			    let str = "";
                                			    if(res.role === ''confirm''){
                                					let sourceStr = page.currentObject.str != null ? "" + page.currentObject.str : "";
                                					let strWithoutSpace = sourceStr.replace(/\s/g, "");
                                					if(!(strWithoutSpace.indexOf("(async()=>{") == 0) || !(strWithoutSpace.indexOf("})();") == (strWithoutSpace.length - 5)  )){
                                						let parts = [];
                                						let regex = /\$\$(?:START)?(\d+)(.*?)(?:END)?(?:\d+)?\$\$/g;
                                						let lastIndex = 0;
                                						let match;
                                						while((match = regex.exec(sourceStr)) != null){
                                							if(match.index > lastIndex){
                                								let txt = sourceStr.substring(lastIndex, match.index);
                                								if(txt !== ""){
                                									parts.push(JSON.stringify(txt));
                                								}
                                							}
                                							let token = match[0];
                                							let tsExpr = page.pageOwner.transform$toTsMonaco(token);
                                							parts.push(tsExpr && tsExpr !== "" ? tsExpr : ''""'');
                                							lastIndex = match.index + match[0].length;
                                						}
                                						if(lastIndex < sourceStr.length){
                                							let txt = sourceStr.substring(lastIndex);
                                							if(txt !== ""){
                                								parts.push(JSON.stringify(txt));
                                							}
                                						}
                                						let tsBody = parts.filter(function(part){return part !== "";}).join(" + ");
                                						if(parts.length === 0){
                                							return {
                                								str: "(async ()=>{\n\treturn '''';\n})();",
                                								type: ''ts''
                                							};
                                						}
                                						if(tsBody.trim() === ""){
                                							tsBody = "''";
                                						}
                                						return {
                                							str: "(async ()=>{\n\treturn " + tsBody + ";\n})();",
                                							type: ''ts''
                                						};
                                					}
                                					else{
                                						return {
                                							type: ''ts''
                                						};
                                					}
                                				}
                                				else{
                                					return null;
                                				}
                                			}
                                		} catch (e) {
                                		}
                                '
