                                			page.local.props = null;
                                			if (this.global?.settings?.formulas) {
                                				if (page.currentEdit) {
                                					page.currentEdit.editor._editor.bodyElement.style.backgroundColor = "#FFF3CD";
                                				}
                                				let convertedFormulas = "";
                                				if (page.currentObject?.type === "ts") {
                                					convertedFormulas = await page.__convertTsToText(page.currentObject?.str);
                                				}
                                				page.local.props = convertedFormulas === ""
                                					? { props: { type: "text" } }
                                					: { props: { type: "text", str: convertedFormulas, html: false } };
                                				return true;
                                			}
                                			else{
                                				let alertController = page.getInstance(AlertController);
                                				const alert = await alertController.create({
                                					header: page.translate.instant("header_pwamsg"),
                                					subHeader: page.translate.instant("compat_aa"),
                                					buttons: [
                                						{
                                							text: page.translate.instant("cancel_pwamsg"),
                                							role: "cancel",
                                						},
                                						{
                                							text: page.translate.instant("continue_pwamsg"),
                                							role: "confirm",
                                						},
                                					]
                                				});
                                				await alert.present();
                                				let res = await alert.onDidDismiss();
                                				if (res.role !== "confirm") {
                                					return false;
                                				}
                                				let converted = "";
                                				if (page.currentEdit) {
                                					page.currentEdit.editor._editor.bodyElement.style.backgroundColor = "#FFF3CD";
                                				}
                                				page.local.props = { props: { type: "text", str: converted, html: false } };
                                				return true;
                                			}
                                			
                                		} catch (e) {
                                		}
                                
                                '
