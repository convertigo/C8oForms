    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	/**
        	 * The comp. is hidden (true).
        	 */
        	public isHidden: boolean = false;
        	/**
        	 * The chart options.
        	 */
        	public chartOptions: any;
        	/**
        	 * The data labels of the apex chart.
        	 */
        	public dataLabels: any;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/	
        	public redraw(){
        		if(this.libapexcharts_apxchart){
        			setTimeout(()=>{
        				this.libapexcharts_apxchart.apxChart.updateOptions(this.chartOptions);
        			});
        		}
        	}
        	/*End_c8o_CompFunction*/
        '
↓SharedComponent_Event [ngx.components.UISharedComponentEvent-1739522710397]: 
  componentEvent: onChanges
  ↓setLoadingAndData [ngx.components.UICustomAsyncAction-1739522990536]: 
    actionValue: 
      - xmlizable: 
        - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
        - com.twinsoft.convertigo.beans.common.FormatedContent: 
          →: |
            '		try {
            			if (props.parent.scope?.changes?.type?.firstChange) {
            				page.isLoading = true;
            			}
            			if (props.parent.scope?.changes?.data?.currentValue != null) {
            				if (page.type == ''bar'') {
            					// horizontal chart
            					if(page.data.plotOptions?.bar?.horizontal){
            						page.chartOptions = 
            						{
            							type: page.type,
            							redrawOnParentResize: true,
            							height: (page.defaultHeight != undefined && page.defaultHeight > 0) ? (page.defaultHeight + ''px'') : ''300px'',
            							width: ''100%'',
            							zoom: {
            						    	enabled: true,
            						    	allowMouseWheelZoom: false,
            						  	},
            							//events: page.datavizEvents 
            						};
            						page.dataLabels = 
            						{
            							enabled:true,
            							showDuplicates: false,
            						  	show: true,
            						    style: {
            						      colors: [''#000''],
            						    },
            						    formatter: function (val: number) {
            						  		return `${Math.floor(Math.pow(10, val))}`;
            						    },
            						};
            					}
            					// vertical chart
            					else{
            						page.chartOptions =
            						{
            							type: page.type,
            							redrawOnParentResize: true,
            							height: page.defaultHeight,
            							width: ''100%'',
            							zoom: {
            								enabled: true,
            								allowMouseWheelZoom: false,
            							}
            						};
            						page.dataLabels = {
            							enabled: true,
            							showDuplicates: false,
            							show: true,
            							style: {
            								colors: [''#000''],
            							}
            						};
            						page.local.tooltip ={
            						    enabled: true,
            						    // Customize the tooltip content if needed
            							x: {
            								formatter: function(value, { series, seriesIndex, dataPointIndex, w }) {
            						        return page.data.options.xaxis.categories[dataPointIndex];
            						      }
            						    },
            						    y: {
            						      formatter: function(val) {
            						        return val;
            						      }
            						    }
            						  }
            					}
            				}
            				else if(page.type == "line"){
            					page.chartOptions =
            						{
            							type: page.type,
            							redrawOnParentResize: true,
            							height: page.defaultHeight,
            							width: ''100%'',
            							zoom: {
            								enabled: true,
            								allowMouseWheelZoom: false,
            							}
            						};
            				}
            				page.isLoading = false;
            			}
            		} catch (e) {
            
            		}
            		return;
            '
