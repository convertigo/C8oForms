            border-radius: 8px;
            height: 30px;
          }
          
          .skeleton-parent {
          	width: calc(100% - 20px);
          	min-height: 400px;
          	max-height: 400px;
          	margin: 10px;
          }
          
          @keyframes shimmer {
            0% { background-position: -200% 0; }
