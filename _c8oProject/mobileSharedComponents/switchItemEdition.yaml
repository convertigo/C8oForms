          @HostBinding(''style.display'')
          public get hostDisplay(): string {
            return this.shouldCollapseEmptyHost() ? ''none'' : ''block'';
          }
          @HostBinding(''style.height'')
          public get hostHeight(): string {
            return this.shouldCollapseEmptyHost() ? ''0'' : ''100%'';
          }
          @HostBinding(''style.min-height'')
          public get hostMinHeight(): string {
            return this.shouldCollapseEmptyHost() ? ''0'' : ''0'';
          }
