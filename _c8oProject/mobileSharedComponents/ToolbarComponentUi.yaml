        onMenuClick(): void {
          // Handle menu button click
          this.menuClick.emit();
        }
        onHelpClick(): void {
          // Handle help button click
          this.helpClick.emit();
        }
        onNotificationsClick(): void {
          // Handle notifications button click
          this.notificationsClick.emit();
        }
        onSettingsClick(): void {
          // Handle settings button click
          this.settingsClick.emit();
        }
        onAvatarClick(): void {
          // Handle avatar click
          this.avatarClick.emit();
        }
        
        startTypewriter(reset = false) {
        	if (reset) { this.index = 0; this.displayText = ''''; }
        	this.stopTypewriter();
        
        	this.zone.runOutsideAngular(() => {
        		this.typingTimer = setInterval(() => {
        			const next = this.fullText.slice(0, this.index++);
        			this.zone.run(() => {
        				this.displayText = next;
        				this.cdr.detectChanges(); // ou this.cdr.markForCheck() si OnPush
        				if (this.index > this.fullText.length) this.stopTypewriter();
        			});
        		}, 150);
        	});
        }
        
        stopTypewriter() {
        	if (this.typingTimer) { clearInterval(this.typingTimer); this.typingTimer = null; }
        }
        
        getPwaAppName(): string {
        	return this.global?.pwaName || this.global?.pwaShortName || this.appName || this.selectedForm?.name || '''';
        }
        
        getToolbarThemeColor(): string {
        	return this.global?.pwaThemeColor || this.parentLocal?.headerColor || ''var(--ion-color-primary)'';
        }
        
        getToolbarTextColor(): string {
        	if (this.global?.pwa === true) {
        		return this.getContrastingTextColor(this.getToolbarThemeColor());
        	}
        	if (this.parentLocal?.policyColor) {
        		return this.parentLocal.policyColor;
        	}
        	return this.getContrastingTextColor(this.getToolbarThemeColor());
        }
        
        getToolbarStyle(): any {
        	if (this.global?.pwa === true) {
        		return {
        			''background-color'': this.getToolbarThemeColor(),
        			''color'': this.getToolbarTextColor(),
        			''border-bottom'': ''none''
        		};
        	}
        	return {};
        }
        
        getContrastingTextColor(color: string): string {
        	const rgb = this.parseToolbarColor(this.resolveToolbarColor(color));
        	if (rgb == null) {
        		return ''#FFFFFF'';
        	}
        	const srgb = [rgb.r, rgb.g, rgb.b].map(function(value) {
        		const channel = value / 255;
        		return channel <= 0.03928 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
        	});
        	const luminance = 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
        	return luminance > 0.179 ? ''#000000'' : ''#FFFFFF'';
        }
        
        resolveToolbarColor(color: string): string {
        	if (!color) {
        		return '''';
        	}
        	const trimmed = color.trim();
        	if (trimmed.indexOf(''var('') !== 0 || typeof window === ''undefined'' || typeof document === ''undefined'') {
        		return trimmed;
        	}
        	const end = trimmed.indexOf('')'');
        	const content = end === -1 ? trimmed.substring(4) : trimmed.substring(4, end);
        	const property = content.split('','')[0].trim();
        	const fallback = content.indexOf('','') !== -1 ? content.substring(content.indexOf('','') + 1).trim() : '''';
        	if (!property) {
        		return fallback;
        	}
        	const resolved = window.getComputedStyle(document.documentElement).getPropertyValue(property).trim();
        	return resolved || fallback;
        }
        
        parseToolbarColor(color: string): any {
        	if (!color) {
        		return null;
        	}
        	let hex = color.trim();
        	if (hex[0] === ''#'') {
        		hex = hex.substring(1);
        	}
        	if (hex.length === 3) {
        		hex = hex.split('''').map(function(c) { return c + c; }).join('''');
        	}
        	if (hex.length === 6) {
        		const r = parseInt(hex.substring(0, 2), 16);
        		const g = parseInt(hex.substring(2, 4), 16);
        		const b = parseInt(hex.substring(4, 6), 16);
        		if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
        			return { r: r, g: g, b: b };
        		}
        	}
        	const match = color.match(/rgba?\(([^)]+)\)/i);
        	if (match != null) {
        		const parts = match[1].split('','').map(function(part) { return parseFloat(part.trim()); });
        		if (parts.length >= 3 && !isNaN(parts[0]) && !isNaN(parts[1]) && !isNaN(parts[2])) {
        			return { r: parts[0], g: parts[1], b: parts[2] };
        		}
        	}
        	return null;
        }
        
        async detectSvgByContentType(url: string): Promise<boolean | null> {
          try {
            const response = await fetch(url, { method: ''HEAD'' });
        
            const type = response.headers.get(''content-type'');
        
            if (!type) return null;
        
            return type.includes(''svg'');
          } catch {
            return null;
          }
        }
        
        upperFirst(str: string){
           return  str[0].toUpperCase() + str.slice(1);	    
        }
        
        public replaceEmpty(str){
            return str.replace(/ /g, ''_'');
        }
        
        public isMineOrCollab(){
        	if(this[''selectedForm''][''~c8oAcl''] == this.global.user){
        		return true
        	}
        	else if(this.selectedForm.c8oCollabs != undefined){
        		var founded = Object
                    .keys(this.selectedForm.c8oCollabs)
        			.filter((x)=>{return x.substring(12) == this.global.user})
        		return founded.length > 0;
        	}
        	else{
        		return false;
        	}
        }
        public isVisible(): boolean{
            try{
                if(this[''selectedForm''][''~c8oAcl''] == this.global.user){
                    return true
                }
                else{
                    var formGrp = Object
                    .keys(this.selectedForm.c8oGrp)
                    .filter(k => this.selectedForm.c8oGrp[k])
                    
                    var userGrp = Object
                    .keys(this.global.settings.groups)
                    .filter(k => this.global.settings.groups[k]);
                    
                    return (formGrp.filter(e => userGrp.indexOf(e) !== -1)).length > 0;
                }
            }
            catch(e){
                return false;
            }
            
            
            
        }
        public getLevelAccesDoc(action, doc = this[''selectedForm''], settings = this.global.settings){
        	// if I am the owner of the doc
        	let val = 5;
        	if(doc.creator == settings["~c8oAcl"]){
        		return true;
        	}
        	else if(this.global.settings.admin == true){
        		return true;
        	}
        	else {
        		let groups = settings.groups ?? []//; != undefined ? settings.groups.filter((x)=>{ return settings.groups[x] == true}) : [];
        		let isAcollabResp = doc.collabsResponse != undefined && (doc.collabsResponse.indexOf(settings["_id"]) != -1 || doc.collabsResponse.filter(value => (groups.indexOf(value) != -1)).length > 0);
        		let isAcollab = doc.collabs != undefined && (doc.collabs.indexOf(settings["_id"]) != -1 || doc.collabs.filter(value => (groups.indexOf(value) != -1)).length > 0);
        		let isAshared  = doc.shared != undefined && (doc.shared.indexOf(settings["_id"]) != -1 || doc.shared.filter(value => (groups.indexOf(value) != -1)).length > 0);
        		if(isAcollabResp && isAcollab){
        			val = 1;
        		}
        		else if(isAcollab){
        			val = 2;
        		}
        		else if(isAcollabResp){
        			val = 3;
        		}
        		else if(isAshared){
        			val = 4;
        		}
        		console.log(val);
        		switch(action){
        			case "editView":
        				if(val < 3){
        					return true;
        				}
        				else{
        					return false;
        				}
        			case "publishDoc":
        				if(val < 3){
        					return true;
        				}
        				else{
        					return false;
        				}
        			case "VizualiseResponses":
        				if(val == 1 || val == 3){
        					return true;
        				}
        				else{
        					return false;
        				}
        			case "DownloadCsv":
        				if(val == 1 || val == 3){
        					return true;
        				}
        				else{
        					return false;
        				}
        			case "CreatePwa":
        				if(val < 3){
        					return true;
        				}
        				else{
        					return false;
        				}
        			case "ManageAccessRights":
        				if(val < 3){
        					return true;
        				}
        				else{
        					return false;
        				}
        			/*case "ManageAccessRightsResponses":
        				if(val == 1 || val == 3){
        					return true;
        				}
        				else{
        					return false;
        				}
        			break;*/
        			case "ManageLabels":
        				if(val < 3){
        					return true;
        				}
        				else{
        					return false;
        				}
        			case "Thumbnail":
        				if(val < 3){
        					return true;
        				}
        				else{
        					return false;
        				}
        			default:
        				return false;
        		}
        	}
        	
        }
        
        public blobToBase64(blobData){
            return new Promise( async (resolve, reject) => {
                var reader = new FileReader();
                reader.onloadend = function () {
                    resolve(reader.result);
                };
                reader.readAsDataURL(blobData);
            });
        }
        /*End_c8o_CompFunction*/
