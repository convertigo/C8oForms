                →: |
                  '		try {
                  			let user: any = {
                  				surname: this.local.surname ?? '''',
                  				name: this.local.name ?? '''',
                  				mail: this.local.mail ?? '''',
                  				language: this.local.language ?? page.translate.currentLang,
                  				admin: this.local.admin ?? false,
                  				admin_readonly: this.local.admin_readonly ?? false,
                  				formulas: this.local.formulas ?? true,
                  				publication: this.local.publication ?? false,
                  				editing_rights: this.local.editing_rights ?? true,
                  				nocode_db_rights: this.local.nocode_db_rights ?? true
                  			}
                  			
                  			console.log(user)
                  			let resp;
                  			if (user.surname.length === 0 || user.name.length === 0 || user.mail.length === 0) {
                  				resp = {success: false};
                  			} else {				
                  				resp = await page.c8o.callJsonObject("C8Oforms.admin_user_post", {meta: JSON.stringify(user)}).async();
                  			}
                  			 console.log(resp)
                  			if(resp.success === true){
                  				await page.presentToast(page.translate.instant("user_create_sucessfull", { userName: user.mail }), ''toastSuccess'');
                  				return true;
                  			}
                  			else if(resp.success == false){
                  				await page.presentToast(page.translate.instant("user_alreaydy_exists", { userName: user.mail }), ''toastError'');
                  				return false;
                  			}
                  			else{
                  				await page.presentToast(page.translate.instant("user_create_failed"), ''toastError'');
                  				return false;
                  			}
                  //			debugger;
                  		} catch (e) {
                  			await page.presentToast(page.translate.instant("user_create_failed"), ''toastError'');
                  			return false;
                  		}
                  '
