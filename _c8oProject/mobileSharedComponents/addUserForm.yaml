                '		try {
                			
                			let resp = await page.c8o.callJsonObject("C8Oforms.admin_user_post", {meta: JSON.stringify(page.formCreateUser.form.value)}).async();
                			if(resp.success === true){
                				await page.presentToast(page.translate.instant("user_create_sucessfull", { userName: page.formCreateUser.form.value.mail }), ''toastSuccess'');
                				return true;
                			}
                			else if(resp.success == false){
                				await page.presentToast(page.translate.instant("user_alreaydy_exists", { userName: page.formCreateUser.form.value.mail }), ''toastError'');
                				return false;
                			}
                			else{
                				await page.presentToast(page.translate.instant("user_create_failed"), ''toastError'');
                				return false;
                			}
                		} catch (e) {
                			await page.presentToast(page.translate.instant("user_create_failed"), ''toastError'');
                			return false;
                		}
                '
