        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public scopeLabel(value: string) {
        		return this.translate.instant("reset_fields_scope_" + (value || "application"));
        	}
        
        	public targetLabel() {
        		let scope = this.item?.config?.scope || "application";
        		if (scope === "page") {
        			let pageName = this.pageOwner?.getPageNameById?.(this.item?.config?.targetPage);
        			return pageName || this.translate.instant("reset_fields_current_page");
        		}
        		if (scope === "component") {
        			let name = this.pageOwner?.getElementNameById?.(this.item?.config?.targetElement);
        			return name || "";
        		}
        		return "";
        	}
        
        	public summaryLabel() {
        		let scope = this.item?.config?.scope || "application";
        		let label = this.scopeLabel(scope);
        		let target = this.targetLabel();
        		return target != null && target !== "" ? label + " - " + target : label;
        	}
