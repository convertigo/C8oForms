↓global [ngx.components.UIStyle-1747841897543]: 
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '/* Utilitaires */
          .hide {
            display: none;
          }
          
          .display {
            display: block;
          }
          
          /* Panneau contextuel d’aide */
          .panel-container {
            position: fixed;
            z-index: 10000;
            top: 4rem;
            right: 0.325rem;
            height: calc(100% - 10rem);
            width: 40%;
            max-width: 600px;
            min-width: 300px;
            -webkit-box-shadow: 0px 10px 13px -7px var(--ion-color-medium), 5px 5px 15px 5px rgba(var(--ion-color-medium-rgb), 0); 
            box-shadow: 0px 10px 13px -7px var(--ion-color-medium), 5px 5px 15px 5px rgba(var(--ion-color-medium-rgb), 0);
            background-color: var(--ion-color-dark-contrast);
            color: var(--ion-color-dark);
            border: 1px solid var(--ion-color-warning);
            border-radius: 0.325rem;
            
            /* Animation */
            transform: translateX(100%); /* caché à droite */
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s ease, opacity 0.4s ease;
          }
          
          .panel-container-holder {
          	position: fixed;
          	z-index: 5000;
          	right: 0;
          	top: 0;
          	height: 100%;
          	width: 100%;
          	background: transparent;
          }
          
          /* État visible */
          .panel-opened {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
          }
          
          /* Responsive */
          @media (max-width: 768px) {
            .panel-container {
              width: 100%;
            }
          }
          
          @media (min-width: 1440px) {
            .panel-container {
              width: 50%;
            }
          }
          '
