        	public getCurrents(){
        		this.currentName = this.pageOwner.getEnabled(this.item[this.path]);
        		this.current = this.item[this.path][this.currentName];
        			
        	}
        	public async getCurentMetas(){
        		let c = this.isSource ? this.pageOwner.local.treeSource : this.pageOwner.local.tree;
        		if(c != undefined){
        			let split = this.currentName.split(".");
        			let projectName = split[0];
        			let sequenceName = split[1];
        			let meta = null;
        			for(let p of c){
        				if(p.name == projectName){
        					for(let s of p.sequences){
        						if(s.name == sequenceName){
        							if(s.variables != undefined && s.variables.name != undefined){
        								s.variables.name.forEach((entry, index)=>{
        									// if this component has builtin support form forms_filter remove it from ui
        									if(entry == "forms_filter" && this.pageOwner.getMetaFromPalette(this.item.type).hasFilter == true){
        										s.variables.type?.splice(index, 1);
        										s.variables.name.splice(index, 1);
        										s.variables.comment.splice(index, 1);
        									}
        								})
        							}
        							if(s.variables != undefined && s.variables.type != undefined){
        								s.variables.type.forEach((entry, index)=>{
        									// if this component has builtin support form forms_filter remove it from ui
        									if(entry == "__c8o_multi"){
        //										s.variables.type?.splice(index, 1);
        //										s.variables.name.splice(index, 1);
        //										s.variables.comment.splice(index, 1);
        										this.local.addAllowed = true;
        										this.local.addName = s.variables.name[index];
        										if(!Array.isArray(this.current.vars[s.variables.name[index]])){
        											this.current.vars[s.variables.name[index]] = [];
        										}
        									}
        								})
        							}
        							meta = s;
        							meta.url = this.c8o.endpointConvertigo + ''/projects/'' + p.name + ''/logos/'' +  s.name + ''.svg'';
        						}
        						
        					}
        				}
        			}
        //		console.log("META : ", meta)
        			
        		this.currentMetas = meta;
        		this.ref.detectChanges();
        		}
        		
        	}
        public getCurrentVarTypeFromMetas(){
        	let raw_type = this.currentMetas.variables.type?.[this.pageOwner.local.index];
        	if(raw_type?.indexOf("configure=") == 0){
        		return "configure";
        	}
                else{
        		return raw_type;
        	}
        }
        public stripHtml(value){
        	try{
        		return (value == null ? "" : ("" + value).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim());
        	}
        	catch(e){
        		return value == null ? "" : "" + value;
        	}
        }
        public getCurrentUiLang(){
        	try{
        		let lang = this.translate != null && this.translate.currentLang != null ? this.translate.currentLang : (this.global != null ? this.global.language : null);
        		lang = lang == null ? "" : ("" + lang).toLowerCase();
        		if(lang.indexOf("-") != -1){
        			lang = lang.split("-")[0];
        		}
        		return lang != "" ? lang : "en";
        	}
        	catch(e){
        		return "en";
        	}
        }
        public getLocalizedMetaField(value, field){
        	try{
        		if(value == null || field == null || field == ""){
        			return "";
        		}
        		let parsed = value;
        		if(typeof parsed == "string"){
        			parsed = JSON.parse(parsed);
        		}
        		if(parsed == null || typeof parsed != "object"){
        			return this.stripHtml(value);
        		}
        		let lang = this.getCurrentUiLang();
        		let candidates = [lang, "en", "fr", "es", "it"];
        		for(let i = 0; i < candidates.length; i++){
        			let key = candidates[i];
        			if(key != null && key != "" && parsed[key] != null && parsed[key][field] != null && parsed[key][field] != ""){
        				return this.stripHtml(parsed[key][field]);
        			}
        		}
        		if(parsed[field] != null && parsed[field] != ""){
        			return this.stripHtml(parsed[field]);
        		}
        		return "";
        	}
        	catch(e){
        		return this.stripHtml(value);
        	}
        }
        public getVariableButtonLabel(index, baby, sub){
        	try{
        		if(sub != null && sub.name != null && sub.name != ""){
        			return this.stripHtml(sub.name);
        		}
        		let variables = this.currentMetas != null ? this.currentMetas.variables : null;
        		let label = this.pageOwner.getHtmlNameBaby(index, baby, variables);
        		label = this.stripHtml(label);
        		return label != "" ? label : this.stripHtml(baby);
        	}
        	catch(e){
        		return sub != null && sub.name != null ? "" + sub.name : this.stripHtml(baby);
        	}
        }
        public getVariableButtonDesc(index, baby, sub){
        	try{
        		if(sub != null){
        			let variables = this.currentMetas != null ? this.currentMetas.variables : null;
        			let parentLabel = this.stripHtml(this.pageOwner.getHtmlNameBaby(index, baby, variables));
        			return parentLabel != "" ? parentLabel : this.stripHtml(baby);
        		}
        		let comment = "";
        		if(this.currentMetas != null && this.currentMetas.variables != null && this.currentMetas.variables.comment != null){
        			comment = this.getLocalizedMetaField(this.currentMetas.variables.comment[index], "comment");
        			if(comment == ""){
        				comment = this.stripHtml(this.currentMetas.variables.comment[index]);
        			}
        		}
        		if(comment != ""){
        			return comment;
        		}
        		let rawType = this.currentMetas != null && this.currentMetas.variables != null ? this.currentMetas.variables.type[index] : "";
        		return this.stripHtml(rawType);
        	}
        	catch(e){
        		return "";
        	}
        }
        public getAddVariableButtonLabel(){
        	try{
        		return this.translate != null && this.translate.instant != null ? this.translate.instant("add") : "add";
        	}
        	catch(e){
        		return "add";
        	}
        }
        public getAddVariableButtonDesc(){
        	return this.stripHtml(this.local != null ? this.local.addName : "");
        }
        public getFillVariablesGridTemplateColumns(){
        	try{
        		let variablesWidth = this.local != null && this.local.datasourceVariablesCollapsed === true ? "0px" : "239px";
        		let paletteWidth = this.local != null && this.local.datasourceCurrentPaletteCollapsed === true ? "0px" : "minmax(0, 1fr)";
        		return variablesWidth + " 32px " + paletteWidth;
        	}
        	catch(e){
        		return "239px 32px minmax(0, 1fr)";
        	}
        }
        public getVariablesPanelTooltip(){
        	try{
        		return this.translate != null && this.translate.instant != null ? this.translate.instant(this.local != null && this.local.datasourceVariablesCollapsed === true ? "show_variables" : "hide_variables") : (this.local != null && this.local.datasourceVariablesCollapsed === true ? "Show variables" : "Hide variables");
        	}
        	catch(e){
        		return this.local != null && this.local.datasourceVariablesCollapsed === true ? "Show variables" : "Hide variables";
        	}
        }
        public getCurrentPaletteTooltip(){
        	try{
        		return this.translate != null && this.translate.instant != null ? this.translate.instant(this.local != null && this.local.datasourceCurrentPaletteCollapsed === true ? "show_palette" : "hide_palette") : (this.local != null && this.local.datasourceCurrentPaletteCollapsed === true ? "Show palette" : "Hide palette");
        	}
        	catch(e){
        		return this.local != null && this.local.datasourceCurrentPaletteCollapsed === true ? "Show palette" : "Hide palette";
        	}
        }
        public getVariablesPanelStyle(){
        	try{
        		return this.local != null && this.local.datasourceVariablesCollapsed === true ?
        			"flex: 0 0 0px;width: 0px;max-width: 0px;opacity: 0;pointer-events: none;margin-right: 0;" :
        			"flex: 0 0 239px;width: 239px;max-width: 239px;opacity: 1;pointer-events: auto;margin-right: 12px;";
        	}
        	catch(e){
        		return "flex: 0 0 239px;width: 239px;max-width: 239px;opacity: 1;pointer-events: auto;margin-right: 12px;";
        	}
        }
        public getCurrentPaletteStyle(){
        	try{
        		return this.local != null && this.local.datasourceCurrentPaletteCollapsed === true ?
        			"flex: 0 0 0px;width: 0px;max-width: 0px;opacity: 0;pointer-events: none;margin-left: 0;" :
        			"flex: 1 1 auto;width: auto;max-width: none;opacity: 1;pointer-events: auto;margin-left: 12px;";
        	}
        	catch(e){
        		return "flex: 1 1 auto;width: auto;max-width: none;opacity: 1;pointer-events: auto;margin-left: 12px;";
        	}
        }
        public hasCurrentVarPalette(){
        	try{
        		let type = this.getCurrentVarTypeFromMetas();
        		return type != "condition" && type != "configure" && type != "file";
        	}
        	catch(e){
        		return false;
        	}
        }
        public isCurrentPalettePreviewVisible(){
        	try{
        		return this.local != null && this.local.datasourceVariablesCollapsed === true && this.local.datasourceCurrentPaletteCollapsed !== true && this.hasCurrentVarPalette();
        	}
        	catch(e){
        		return false;
        	}
        }
        public getCurrentVariableName(){
        	try{
        		return this.currentMetas != null && this.currentMetas.variables != null && this.currentMetas.variables.name != null ? (this.currentMetas.variables.name[this.pageOwner.local.index] || "") : "";
        	}
        	catch(e){
        		return "";
        	}
        }
        public getCurrentVariableSub(){
        	try{
        		let baby = this.getCurrentVariableName();
        		if(baby != "" && this.pageOwner != null && this.pageOwner.local != null && this.pageOwner.local.indexBis != null && this.current != null && this.current.vars != null && this.current.vars[baby] != null){
        			return this.current.vars[baby][this.pageOwner.local.indexBis];
        		}
        		return null;
        	}
        	catch(e){
        		return null;
        	}
        }
        public getCurrentVariableButtonLabelPreview(){
        	try{
        		let baby = this.getCurrentVariableName();
        		if(baby == ""){
        			return "";
        		}
        		return this.getVariableButtonLabel(this.pageOwner.local.index, baby, this.getCurrentVariableSub());
        	}
        	catch(e){
        		return "";
        	}
        }
        public getCurrentVariableButtonDescPreview(){
        	try{
        		let baby = this.getCurrentVariableName();
        		if(baby == ""){
        			return "";
        		}
        		return this.getVariableButtonDesc(this.pageOwner.local.index, baby, this.getCurrentVariableSub());
        	}
        	catch(e){
        		return "";
        	}
        }
