        					return x.key != ''_c8o_out_c8o'' && ((this.pageOwner.local.tags == undefined || this.pageOwner.local.tags.length == 0) && (this.pageOwner.local.subTags == undefined || this.pageOwner.local.subTags.length == 0)) && (this.pageOwner.query == '''' || this.pageOwner.query == undefined) && (this.pageOwner.local.searchTags == undefined || this.pageOwner.local.searchTags.length == 0) && (this.pageOwner.local.searchSubTags == undefined || this.pageOwner.local.searchSubTags.length == 0)
        				}).length;
        			}
        		}
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
