        /*Begin_c8o_CompFunction*/
        	/**
        	 * Retourne une chaîne "Il y a X ..." adaptée à la langue et au timestamp donné.
        	 * @param {number|string|Date} updatedAt - Timestamp (ms ou s), ou date ISO.
        	 * @param {string} currentLang - Langue (''fr'', ''en'', ''es'', ''it'')
        	 * @returns {string} Exemple : "Il y a 1 jour" / "1 day ago" / "Hace 1 día"
        	 */
        	public timeAgo(updatedAt: number, currentLang: string = ''fr''): string {
        	  const now = Date.now();
        	  const seconds = Math.floor((now - Number(updatedAt)) / 1000);
        //	 console.log(now, updatedAt, this.list[this.i]);
        	  const intervals: Record<string, number> = {
        	    year: 31536000,
        	    month: 2592000,
        	    week: 604800,
        	    day: 86400,
        	    hour: 3600,
        	    minute: 60,
        	    second: 1
        	  };
        
        	  const locales: Record<string, any> = {
        	    fr: {
        	      prefix: ''Il y a'',
        	      suffix: '''',
        	      year: [''an'', ''ans''],
        	      month: [''mois'', ''mois''],
        	      week: [''semaine'', ''semaines''],
        	      day: [''jour'', ''jours''],
        	      hour: [''heure'', ''heures''],
        	      minute: [''minute'', ''minutes''],
        	      second: [''seconde'', ''secondes'']
        	    },
        	    en: {
        	      prefix: '''',
        	      suffix: ''ago'',
        	      year: [''year'', ''years''],
        	      month: [''month'', ''months''],
        	      week: [''week'', ''weeks''],
        	      day: [''day'', ''days''],
        	      hour: [''hour'', ''hours''],
        	      minute: [''minute'', ''minutes''],
        	      second: [''second'', ''seconds'']
        	    },
        	    es: {
        	      prefix: ''Hace'',
        	      suffix: '''',
        	      year: [''año'', ''años''],
        	      month: [''mes'', ''meses''],
        	      week: [''semana'', ''semanas''],
        	      day: [''día'', ''días''],
        	      hour: [''hora'', ''horas''],
        	      minute: [''minuto'', ''minutos''],
        	      second: [''segundo'', ''segundos'']
        	    },
        	    it: {
        	      prefix: '''',
        	      suffix: ''fa'',
        	      year: [''anno'', ''anni''],
        	      month: [''mese'', ''mesi''],
        	      week: [''settimana'', ''settimane''],
        	      day: [''giorno'', ''giorni''],
        	      hour: [''ora'', ''ore''],
        	      minute: [''minuto'', ''minuti''],
        	      second: [''secondo'', ''secondi'']
        	    }
        	  };
        
        	  const locale = locales[currentLang] || locales.fr;
        
        	  if (seconds < 1) {
        	    const justNow = {
        	      fr: ''À l’instant'',
        	      en: ''Just now'',
        	      es: ''Ahora mismo'',
        	      it: ''Proprio adesso''
        	    };
        	    return justNow[currentLang] || justNow.fr;
        	  }
        
        	  for (const [unit, value] of Object.entries(intervals)) {
        	    const count = Math.floor(seconds / value);
        	    if (count >= 1) {
        	      const word = count > 1 ? locale[unit][1] : locale[unit][0];
        	      return `${locale.prefix ? locale.prefix + '' '' : ''''}${count} ${word}${
        	        locale.suffix ? '' '' + locale.suffix : ''''
        	      }`;
        	    }
        	  }
        
        	  return {
        	    fr: ''À l’instant'',
        	    en: ''Just now'',
        	    es: ''Ahora mismo'',
        	    it: ''Proprio adesso''
        	  }[currentLang] || ''Just now'';
        	}
        	/*End_c8o_CompFunction*/
