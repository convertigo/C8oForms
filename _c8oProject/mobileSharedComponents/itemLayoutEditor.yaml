        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		if (changes.item?.currentValue?.config?.cols) {
        			this.identifyColScheme();
        			this.computeColSize();
        			this.identifyTabletScheme();
        			this.computeTabletSize();
        			this.identifyPhoneLScheme();
        			this.computePhoneLSize();
        			this.identifyPhonePScheme();
        			this.computePhonePSize();
        			this.ref.detectChanges();
        		}
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
