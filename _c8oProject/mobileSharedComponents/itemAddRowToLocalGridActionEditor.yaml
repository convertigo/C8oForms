        /*Begin_c8o_CompFunction*/
        	public targetGridOptions() {
        		const grids = this.pageOwner?.getGrids?.();
        		// local tables: galleries are not supported as targets
        		return (Array.isArray(grids) ? grids : []).filter((item) => item?.type == "grid");
        	}
        
        	public targetGridLabel(value: string) {
        		const grid = this.targetGridOptions().find((item) => item?.id === value);
        		return grid?.name || value || "";
        	}
        
        	public getActionValue(event: any) {
        		let value = event;
        		if (value != null && typeof value === "object" && value.out !== undefined) {
        			value = value.out;
        		}
        		if (value != null && typeof value === "object" && value.item !== undefined) {
        			return value.item;
        		}
        		return value;
        	}
        
        	public updateActionState() {
        		let owner = this.pageOwner != undefined ? this.pageOwner : this.owner;
        		if (owner != undefined && owner["updateState"] != undefined) {
        			owner["updateState"]();
        		}
        		this.itemChange.emit(this.item);
        		this.ref.markForCheck();
        	}
        
        	public setTargetGrid(event: any) {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		this.item.config.targetGrid = this.getActionValue(event);
        		this.updateActionState();
        	}
        	/*End_c8o_CompFunction*/'
