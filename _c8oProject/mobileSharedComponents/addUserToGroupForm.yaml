                           let meta = {groups: JSON.stringify(docs), users: JSON.stringify(docs2)};
                           let sequence = "C8Oforms.admin_users_post_in_groups";
                
                           deleted = await page.c8o.callJsonObject(sequence, meta).async();
                			if((deleted?.success != undefined && deleted?.success.length == 0) || deleted?.success || deleted?.success.indexOf(''is added'') != -1){
                				await page.presentToast(page.translate.instant("user_add_to_group_successfull"), ''toastSuccess'');
