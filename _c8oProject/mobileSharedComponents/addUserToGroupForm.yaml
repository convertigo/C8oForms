        '/*Begin_c8o_CompImport*/
        
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public toastController: ToastController;
        	public selectedGroups: Array<any>;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		this.toastController = this.getInstance(ToastController);
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	async presentToast(message: string, cssClass: string = '''') {
        		const toast = await this.toastController.create({
        			message: message,
        			duration: 10000,
        			position: ''bottom'',
        			cssClass: cssClass,
        		});
        
        		await toast.present();
        	}
        	
        	public async loadGridData(pageEvent: string = "") {
        				try {
        					this.local.loading = true;
        					if(this.myaggrid3?.agGrid?.api){
        						this.myaggrid3.agGrid.api.showLoadingOverlay();
        					}
        					var data = await this.c8o.callJsonObject("C8Oforms.admin_groups_get", {}).async();
        					if (data.error) {
        						this.local.error = true;
        					}
        					else {
        						if (data.data.labels) {
        							var translations = this.translate.translations[this.translate.currentLang];
        							let finKeyByValue = (value) => {
        								for (const key in translations) {
        									if (translations[key] === value) {
        										return key;
        									}
        								}
        							}
        							data.data.labels = data.data.labels.map((x) => {
        								x.headerName = this.translate.instant(x.headerName);
        								// if it''''s a checkbox then add support for non boolean checkbox
        								if (x?.cellRenderer == "agCheckboxCellRenderer") {
        									if (x?.c8o_type == "stringboolean") {
        										x.valueGetter = (params) => {
        											return !(params.data[x.field] === ''false'');
        										},
        											x.valueSetter = (params) => {
        												params.data[x.field] = params.newValue ? ''true'' : ''false'';
        												return true;
        											}
        									}
        									else {
        										x.valueGetter = (params) => {
        											return params.data[x.field] === true;
        										},
        										x.valueSetter = (params) => {
        											params.data[x.field] = params.newValue;
        											return true;
        										}
        									}
        
        								}
        								if (x?.valueGetter == "lang") {
        									x.cellEditorParams.values = x.cellEditorParams.values.map((x) => {
        										x = this.translate.instant(x);
        										return x;
        									})
        									x.valueGetter = (params) => {
        										if (params?.data?.[x.field]) {
        											return this.translate.instant(params.data[x.field]);
        										}
        										else {
        											return params?.data?.[x.field] ?? "";
        										}
        
        									},
        										x.valueSetter = (params) => {
        											params.data[x.field] = finKeyByValue(params.newValue);
        											return true;
        										}
        								}
        								return x;
        							});
        						}
        						this.local.data = data;
        						this.local.data.data.labels[0].editable = false;
        						this.local.data.data.labels = [this.local.data.data.labels[0]];
        						console.log(this.local.data);
        					}
        				} catch (e) {
        					this.local.error = true;
        //					console.log(this.local);
        					this.c8o.log.error("An error occured : \n" + JSON.stringify(e));
        				}
        				finally {
        					this.local.loading = false;
        					if(this.myaggrid3?.agGrid?.api){
        						this.myaggrid3.agGrid.api.hideOverlay();
        					}
        					this.ref.markForCheck();
        				}
        			}
        	/*End_c8o_CompFunction*/
