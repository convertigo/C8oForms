        				public getPermissionsValuesGetter(params) {
        				  const d = params.data;
        				  const roles: string[] = [];
        				  const isTrue = (v: any) => v === true || v === "true";
        
        				  if (d.admin === true || d.admin === "true") {
        				    roles.push("Admin");
        				  }
        				  if (d.nocode_db_rights === true || d.nocode_db_rights === "true") {
        				    roles.push("No Code Editor");
        				  }
        				  if (d.admin_readonly === true || d.admin_readonly === "true") {
        				    roles.push("Admin Read Only");
        				  }
        				  if (d.publication === true || d.publication === "true") {
        				    roles.push("Publisher");
        				  }
        				  if (d.editing_rights === true || d.editing_rights === "true") {
        				    roles.push("Editor");
        				  }
        				  if (d.formulas === true || d.formulas === "true") {
        				    roles.push("Formulas Editor");
        				  }
        
        				  return roles.join(" · "); // ex: "Admin · Publisher · Editor"
        				}
        				
        					public getTotalGroups(): number | string {
        						return (this.local.data?.result?.values) ? this.local.data?.result?.values.length : ''—'';
        					}
        					
        					public getTotalActiveGroups(): number | string {
        						if (!this.local.data?.result?.values) {
        							return "—";
        						}
        						return this.local.data?.result?.values.filter(item => (item?.rights?.editing_rights || item?.rights?.formulas || item?.rights?.nocode_db_rights || item?.rights?.admin || item?.rights?.admin_readonly || item?.publication)).length;
        					}
        					
        					public getCurrentActiveGroup(params: any): number | string {
        						if (!this.local.data?.result?.values) {
        							return "—";
        						}
        						return [params.data].filter(item => (item?.editing_rights || item?.formulas || item?.nocode_db_rights || item?.admin || item?.admin_readonly || item?.publication)).length;
        					}
        					
        					public getActiveGroupsPerOfTotalGroups() {
        						let total = this.getTotalGroups();
        						let activeT = this.getTotalActiveGroups();
        						if  (typeof total === ''string'' || typeof activeT === ''string'') {
        							return ''—'';
        						}
        				//		console.log(activeT, total);
        						return Math.floor(activeT / total * 100);
        					}
        					
        					
        					public getUsersAssignedToGroup() {
        						if (!this.local.data?.result?.values) {
        							return "—";
        						}
        						let sum = 0;
        
        						for (let i = 1; i < this.local.data?.result?.values.length; i++) {
        						  sum += (this.local.data?.result?.values[i]?.count) ? Number(this.local.data?.result?.values[i]?.count) : 0;
        						}
        						return (this.local.data?.result?.values) ? sum : ''—'';
        					}
        					
        					public getUniquePerms() {
        						if (!this.local.data?.result?.values) {
        							return "—";
        						}
        						let unique = [];
        						let copy = {};
        						for(let i = 0; i < this.local.data?.result?.values.length; i++) {
        							const item = this.local.data?.result?.values[i];
        							copy = {...item.rights};
        							delete copy["_rev"];
        							let str = JSON.stringify(copy);
        							if (unique.indexOf(str) === -1) {
        								unique.push(str);
        							}
        						}
        						return unique.length;
        					}
        
        					public getGroupDescriptionKey(perms: Permissions): string {
        					  // 🔑 Cas Admin prioritaires
        					  if (perms?.admin && perms?.publication && perms?.editing_rights && perms?.formulas && perms?.nocode_db_rights) {
        					    return "group_desc_admin_full";
        					  }
        					  if (perms?.admin) {
        					    return "group_desc_admin";
        					  }
        					  if (perms?.admin_readonly) {
        					    return "group_desc_admin_readonly";
        					  }
        
        					  // 🔧 Cas editing_rights
        					  if (perms?.editing_rights && perms?.publication && perms?.formulas && perms?.nocode_db_rights) {
        					    return "group_desc_edit_all";
        					  }
        					  if (perms?.editing_rights && perms?.formulas && perms?.nocode_db_rights) {
        					    return "group_desc_edit_db_js";
        					  }
        					  if (perms?.editing_rights && perms?.formulas) {
        					    return "group_desc_edit_js";
        					  }
        					  if (perms?.editing_rights && perms?.nocode_db_rights) {
        					    return "group_desc_edit_db";
        					  }
        					  if (perms?.editing_rights && perms?.publication) {
        					    return "group_desc_edit_publish";
        					  }
        					  if (perms?.editing_rights) {
        					    return "group_desc_edit";
        					  }
        
        					  // 📦 Cas Publication sans édition
        					  if (perms?.publication && perms?.nocode_db_rights) {
        					    return "group_desc_publish_db";
        					  }
        					  if (perms?.publication && perms?.formulas) {
        					    return "group_desc_publish_js";
        					  }
        					  if (perms?.publication) {
        					    return "group_desc_publish";
        					  }
        
        					  // 📊 Cas Data & JS seuls
        					  if (perms?.nocode_db_rights && perms?.formulas) {
        					    return "group_desc_db_js";
        					  }
        					  if (perms?.nocode_db_rights) {
        					    return "group_desc_db";
        					  }
        					  if (perms?.formulas) {
        					    return "group_desc_js";
        					  }
        
        					  // 🔘 Par défaut (aucune permission)
        					  return "—";
        					}
        					
        					public getCardClass(params) {
        					  let clasS = "hover-card-grid";
        						console.log(params.node.selected, this.groupSelected, params.data.value)
        					  if (params?.node?.selected && this.groupSelected !== params?.data?.value ) {
        					    clasS = "hover-card-grid--selected";
        					  } else if (params?.node?.selected && this.groupSelected === params?.data?.value) {
        					    clasS = "hover-card-grid--group-clicked";
        					  }
        
        					  return clasS;
        					}
        					
        					public getCardClass2(params) {
        					  let clasS = "hover-card-grid";
        						console.log(params.node.selected, this.groupSelected, params.data.value)
        					  if (params?.node?.selected && this.userSelected !== params?.data?._id ) {
        					    clasS = "hover-card-grid--selected";
        					  } else if (params?.node?.selected && this.userSelected === params?.data?._id) {
        					    clasS = "hover-card-grid--group-clicked";
        					  }
        
        					  return clasS;
        					}
