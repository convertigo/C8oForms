        	async presentToast(message: string, cssClass: string = '''') {
        		const toast = await this.toastController.create({
        			message: message,
        			duration: 10000,
        			position: ''bottom'',
        			cssClass: cssClass,
        		});
        
        		await toast.present();
        	}
        	
        		public process(labels, editing_apps_default_rights, no_code_db_default_rights, formulas_default_rights, publication_default_rights) {
        			var translations = this.translate.translations[this.translate.currentLang];
        			let finKeyByValue = (value) => {
        				for (const key in translations) {
        					if (translations[key] === value) {
        						return key;
        					}
        				}
        			}
        
        			return labels.map((x) => {
        				if (x.headerName && x.headerName.length > 0) {				
        					x.headerName = this.translate.instant(x.headerName);
        				}
        
        				// Gestion des checkbox
        				if (x?.cellRenderer === "agCheckboxCellRenderer") {
        					if (x?.c8o_type === "stringboolean") {
        						x.valueGetter = (params) => {
        							if(params.colDef.field == "editing_rights"){
        								return params.data[x.field] != undefined ? (params.data[x.field] === ''true'' || params.data[x.field] === true) : editing_apps_default_rights;
        							}
        							else if(params.colDef.field == "nocode_db_rights"){
        								return params.data[x.field] != undefined ? (params.data[x.field] === ''true'' || params.data[x.field] === true) : no_code_db_default_rights;
        							}
        							else if(params.colDef.field == "formulas"){
        								return params.data[x.field] != undefined ? (params.data[x.field] === ''true'' || params.data[x.field] === true) : formulas_default_rights;
        							}
        							else if(params.colDef.field == "publication"){
        								return params.data[x.field] != undefined ? (params.data[x.field] === ''true'' || params.data[x.field] === true) : publication_default_rights;
        							}
        							else{
        								return params.data[x.field] === ''true'' || params.data[x.field] === true;
        							}
        							
        						}
        						x.valueSetter = (params) => {
        							params.data[x.field] = params.newValue ? ''true'' : ''false'';
        							return true;
        						};
        					} else {
        						x.valueGetter = (params) => params.data[x.field] === true;
        						x.valueSetter = (params) => {
        							params.data[x.field] = params.newValue;
        							return true;
        						};
        					}
        				}
        
        				// Gestion de la localisation ("lang")
        				if (x?.valueGetter === "lang") {
        					if (x.cellEditorParams?.values) {
        						x.cellEditorParams.values = x.cellEditorParams.values.map((v) => this.translate.instant(v));
        						x.cellEditorParams.values = x.cellEditorParams.values.children?.map((v) => this.translate.instant(v)) || [];
        					}
        
        					x.valueGetter = (params) => {
        						return params?.data?.[x.field] ? this.translate.instant(params.data[x.field]) : params?.data?.[x.field] ?? "";
        					};
        
        					x.valueSetter = (params) => {
        						params.data[x.field] = finKeyByValue(params.newValue);
        						return true;
        					};
        				}
        
        				return x;
        			});
        		}
        		
        		public async loadGridData(pageEvent: string = "") {
        			try {
        				this.local.loading = true;
        				if (this.myaggrid3?.agGrid?.api) {
        					this.myaggrid3.agGrid.api.showLoadingOverlay();
        				}
        				if (this.myaggrid4?.agGrid?.api) {
        					this.myaggrid4.agGrid.api.showLoadingOverlay();
        				}
        				let admin_write = ( (!this.global?.settings?.admin) ? true : false);
        				let admin_readonly = ( (this.global?.settings?.admin_readonly == undefined || !this.global?.settings?.admin_readonly) ? false : admin_write );
        	//			console.log(admin_readonly);
        
        //				console.log(this.local.navParams?.data?.[''page'']?.local)
        				var data = this.local.data;
        //				console.log(data)
        //				var data = await this.c8o.callJsonObject("C8Oforms.admin_users_get_by_group_v2", {admin_readonly: admin_readonly}).async();
        				let no_code_db_default_rights = data.result?.default_rights.no_code_db_default_rights == true;
        				let editing_apps_default_rights = data.result?.default_rights.editing_apps_default_rights == true;
        				let formulas_default_rights = data.result?.default_rights?.formulas_default_rights == true;
        				let publication_default_rights = data.result?.default_rights?.publication == true;
        				if (data.error) {
        					this.local.error = true;
        				}
        				else {
        					if (data?.result?.labels && data?.result?.childrenLabels) {
        
        						data.result.labels[0].cellRenderer = (params) => {
        							return this.GroupCellRenderer(params);
        						};
        	//					data.result.labels[0].cellRendererParams.suppressRefreshRenderer = false;
        						data.result.labels[0].valueGetter = params =>
        						  `${params.data.value} ${params.data.count}`
        						data.result.labels[0].headerName = this.translate.instant("addusertogroup_modal_header_grid2")
        //						console.log(data.result.childrenLabels)
        						data.result.childrenLabels[0].checkboxSelection = false;
        						data.result.childrenLabels[0].headerCheckboxSelection = false;
        						data.result.childrenLabels[0].headerName = this.translate.instant("addusertogroup_modal_header_grid")+" ("+this.local.selectedUsers.length+")";
        												
        						data.result.childrenLabels[0].cellRenderer = (params) => {
        	//						console.log(params)
        							return this.UsersCellRenderer(params);
        						};
        	//					data.result.childrenLabels[0].cellClass= ''hover-card-grid'';
        	//					data.result.childrenLabels[0].cellClassRules= {
        	//					  ''hover-card-grid--selected'': (params) => params.node.selected,
        	//					  ''hover-card-grid--group-clicked'': (params) =>
        	//					    this.groupSelected === params.data.value,
        	//					};
        	//					data.result.childrenLabels[0].cellRendererParams.suppressRefreshRenderer = false
        						data.result.childrenLabels[0].valueGetter = params =>
        						  `${params.data.mail} ${params.data.language} ${params.data.provider} ${params.data.displayName} ${params.data.name} ${params.data.surname} ${this.getPermissionsValuesGetter(params)}`
        						
        						data.result.labels = this.process(data.result.labels, editing_apps_default_rights, no_code_db_default_rights, formulas_default_rights, publication_default_rights);
        						data.result.childrenLabels = this.process(data.result.childrenLabels, editing_apps_default_rights, no_code_db_default_rights, formulas_default_rights, publication_default_rights);
        					}
        					if (data.result.values?.[0]?.group) {
        						data.result.values[0].group = this.translate.instant(data.result.values?.[0]?.group);
        					}
        
        					this.local.data = data;
        
        					this.valuesCopy = this.local.data?.result?.values;
        
        //					this.all_users = this.local.data?.result?.values[0];
        //					this.local.data.result.values = this.local.data.result.values.slice(1);
        					if (pageEvent == "willLoad") {
        	//					setTimeout(() => {
        	//						const firstRow = this.myaggrid?.agGrid?.api.getDisplayedRowAtIndex(0);
        	//						if (firstRow) {
        	//							firstRow.setSelected(true);
        	//						}
        	//					}, 0);
        //						this.valuesSelected = this.all_users.children;
        //						this.groupSelected = this.all_users.group;
        					}
        				}
        			} 
        			catch (e) {
        				this.local.error = true;
        				console.error(e);
        				this.c8o.log.error("An error occured : \n" + JSON.stringify(e));
        			}
        			finally {
        				this.local.loading = false;
        				if (this.myaggrid3?.agGrid?.api) {
        					this.myaggrid3.agGrid.api.hideOverlay();
        				}
        				if (this.myaggrid4?.agGrid?.api) {
        					this.myaggrid4.agGrid.api.hideOverlay();
        				}
        				this.ref.markForCheck();
        			}
        		}
        		
