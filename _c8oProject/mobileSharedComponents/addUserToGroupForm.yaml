                '		try {
                			let docs = page.myaggrid3?.agGrid?.api?.getSelectedNodes().map((node) => { return { "group": node.data.group} });
                			let docs2 = page.global.selectedUsers.map((node) => { return {"user": node.data["~c8oAcl"]}});
                			var deleted : any = {success: true};	
                //			for(let i = 0; i < docs.length;i++) {
                //				for (let j = 0; j < docs2.length; j++) {				
                //					let args = {meta: JSON.stringify({group: docs[i].group, user: docs2[j].user})};
                //					console.log(args);
                //					let sequence = "C8Oforms.admin_user_add_to_group";
                //					deleted = await page.c8o.callJsonObject(sequence, args).async();
                //				}
                //			}
                			
                			let meta = {groups:[]};
                			for (let i = 0; i < docs.length;i++) {				
                				for (let j = 0; j < docs2.length; j++) {				
                					let args = {group: docs[i].group, user: docs2[j].user};
                					meta.groups.push(args);
                				}
                			}
                			let args = {meta: JSON.stringify(meta)};
                			let sequence = "C8Oforms.admin_user_post_in_group_bulk";
                			deleted = await page.c8o.callJsonObject(sequence, args).async();
                			
                			if(deleted?.success || deleted.indexOf(''is added'') != -1){
                				await page.presentToast(page.translate.instant("group_create_sucessfull", {groupName: ''''}), ''toastSuccess'');
                				return true;
                			}
                			else if(!deleted?.success){
                				await page.presentToast(page.translate.instant("group_alreaydy_exists", { groupName: '''' }), ''toastError'');
                				return false;
                			}
                			else{
                				await page.presentToast(page.translate.instant("group_create_failed"), ''toastError'');
                				return false;
                			}
                		} catch (e) {
                			await page.presentToast(page.translate.instant("group_create_failed"), ''toastError'');
                			return false;
                		}
                '
