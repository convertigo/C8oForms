            ':host {
              display: block;
              width: 100%;
            }
            
            .figma-button {
              display: flex;
              align-items: center;
              gap: 12px;
              width: 100%;
              max-width: 100%;
              padding: 14px;
              border: 2px solid transparent;
              border-radius: 10px;
              background: transparent;
              box-sizing: border-box;
              cursor: pointer;
              text-align: left;
            }
            
            .figma-button--selected {
              border: 2px solid #bedbff;
              background: #eff6ff;
            }
            
            .figma-button--selected .figma-button__icon-badge {
              background: #bedbff;
            }
            
            .figma-button--selected .figma-button__title {
              color: #1447e6;
              font-weight: 600;
            }
            
            .figma-button--unselected {
              border-color: transparent;
              background: transparent;
            }
            
            .figma-button__icon-badge {
              display: flex;
              align-items: center;
              justify-content: center;
              width: 32px;
              height: 32px;
              flex: 0 0 32px;
              border-radius: 10px;
              background: #dbeafe;
            }
            
            .figma-button__icon {
              display: block;
              width: 16px;
              height: 16px;
              color: #1447e6;
            }
            
            .figma-button__text {
              display: flex;
              flex-direction: column;
              align-items: flex-start;
              flex: 1 1 auto;
              width: auto;
              max-width: 100%;
              min-width: 0;
            }
            
            .figma-button__title {
              display: block;
              margin: 0;
