                '		let props = event?.props || {};
                		let previousType = page.item.sources.self.vars.selfVar?.type;
                		let isDefaultChoice = ["radio_group", "checkbox_group", "select", "radio", "checkbox"].indexOf(page.defaultValueGridKind) !== -1;
                		let isSimpleDefaultChoice = ["select", "radio", "checkbox"].indexOf(page.defaultValueGridKind) !== -1;
                		let getEmptyDefaultJs = function(kind) {
                			if (kind === "checkbox") {
                				return "(async ()=>{\n\treturn [];\n})();";
                			}
                			if (kind === "checkbox_group" || kind === "radio_group") {
                				return "(async ()=>{\n\treturn {};\n})();";
                			}
                			return "(async ()=>{\n\treturn '''';\n})();";
                		};
                		let getStoredDefaultJs = function(kind) {
                			if (page.item?.config == null) {
                				return "";
                			}
                			if (kind === "checkbox_group" || kind === "radio_group") {
                				return page.item.config.defaultValuesJs || "";
                			}
                			if (kind === "checkbox" || kind === "radio" || kind === "select") {
                				return page.item.config.defaultValueJs || "";
                			}
                			return "";
                		};
                		if (props.type === "ts" && previousType !== "ts") {
                			props = {...props, str: getStoredDefaultJs(page.defaultValueGridKind) || getEmptyDefaultJs(page.defaultValueGridKind), html: false};
                		}
                		if (isDefaultChoice) {
                			if (page.item.config == null) {
                				page.item.config = {};
                			}
                			if (event?.mode != null) {
                				page.item.config.defaultValuesMode = event.mode;
                				if (event.mode === "visual" && previousType === "ts" && props.str == null) {
                					props = {...props, str: "", html: false};
                				}
                			}
                			else if (props.type === "ts") {
                				page.item.config.defaultValuesMode = "js";
                			}
                			else if (props.type != null && page.item.config.defaultValuesMode === "js") {
                				page.item.config.defaultValuesMode = "text";
                			}
                		}
                		page.item.sources.self.vars.selfVar = {...page.item.sources.self.vars.selfVar, ...props};
                		if (isSimpleDefaultChoice) {
                			if (page.item.sources.self.vars.selfVar.type === "ts") {
                				page.item.config.defaultValuesMode = "js";
                				page.item.config.defaultValueJs = page.item.sources.self.vars.selfVar.str || "";
                			}
                			else {
                				if (page.item.config.defaultValuesMode !== "visual") {
                					page.item.config.defaultValuesMode = "text";
                				}
                				page.item.config.defaultValue = page.item.sources.self.vars.selfVar.str || "";
                			}
                		}
                		resolve();
                '
