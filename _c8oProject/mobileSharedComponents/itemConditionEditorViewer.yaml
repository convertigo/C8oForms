    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompImport*/
        import hljs from ''highlight.js/lib/core'';
        import javascript from ''highlight.js/lib/languages/javascript'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public _idselectedC: any = "";
        	@Input() public get idselectedC() {
        		return this._idselectedC;
        	}
        	public set idselectedC(val: any) {
        		if (val !== undefined && this._idselectedC !== val) {
        			this._idselectedC = val;
        			this.idselectedCChange.emit(val);
        		}
        	}
        	@Output() idselectedCChange = new EventEmitter<any>();
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		this.local.computed = {};
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	public trackById (index: number, obj: object): number{
          		return +obj;
        	};
        	highlight(arg1){
        		if(this.local.computed?.[arg1] != undefined){
        			return this.local.computed[arg1];
        		}
        		else{
        			let arg2 = { language: ''javascript'', ignoreIllegals: true };
        			let cleanedArg1 = arg1
        			  .split(''\n'')
        			  .filter(line => line.trim() !== '''') // Supprime les lignes vides
        			  .join(''\n'');
        			let computed = hljs.highlight(cleanedArg1, arg2).value;
        			this.local.computed[arg1] = computed;
        			return computed;
        		}
        	}
        	isTotalyFilled(cond){
        	    try{
        	        if(cond.subject != undefined && cond.subject == "field" && cond.val1 != undefined && (cond.val1.str != "" || (cond.val1.arr != undefined && cond.val1.arr.length > 0)) && cond.val2 != undefined && (cond.val2.str != "" || (cond.val2.arr != undefined && cond.val2.arr.length > 0)) && cond.operator != undefined && cond.operator != ""){
        			    return true;  
        			  } 
        			  else if(cond.subject != undefined && cond.subject == "field" && cond.val1 != undefined && (cond.val1.str != "" || (cond.val1.arr != undefined && cond.val1.arr.length > 0)) && cond.operator != undefined && cond.operator != "" && (cond.operator == "is_filled" || cond.operator == "is_empty")){
        			     return true; 
        			  }
        			  else if(cond.val1 != undefined && (cond.val1.str != "" || (cond.val1.arr != undefined && cond.val1.arr.length > 0)) && cond.val2 != undefined && (cond.val2.str != "" || (cond.val2.arr != undefined && cond.val2.arr.length > 0)) && cond.operator != undefined && cond.operator != "" && cond.type == "goToPageIf"){
        			      return true;
        			  }
        			  else if((cond.val1 != undefined && (cond.val1.str != "" || (cond.val1.arr != undefined && cond.val1.arr.length > 0)) && cond.operator != undefined && cond.operator != "" && (cond.operator == "is_filled" || cond.operator == "is_empty"))){
        			      return true;
        			  }
        			  else if(cond.subject != undefined && cond.subject == "form" && cond.attribute != undefined && cond.attribute != "" && cond.operator != undefined && cond.operator != ""){
        			      return true;
        			  }
        			  else if(cond.subject != undefined && cond.subject == "field" && cond.val1 != undefined && cond.val1.str != undefined && cond.operator != "" && cond.val1.type == "file"){
        			      return true;
        			  }
        			  else if(cond.subject != undefined && cond.subject == "field" && cond.val1 != undefined && cond.val1.str != undefined && cond.operator != "" && (cond.val1.type == "signature" || cond.val1.type == "img")){
        			      return true;
        			  }
        			  else if(cond.subject == "never_visible"){
        				return true;
        			}
                      else{
                          return false;
                      }
        	    }
        	    catch(e){
        	        return false;
        	    }
        	}
        	/*End_c8o_CompFunction*/'
