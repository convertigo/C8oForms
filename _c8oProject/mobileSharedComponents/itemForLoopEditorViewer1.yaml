        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	public trackById (index: number, obj: object): number{
          		return +obj;
        	};
        	highlight(arg1){
        		if(this.local.computed?.[arg1] != undefined){
        			return this.local.computed[arg1];
        		}
        		else{
        			let arg2 = { language: ''javascript'', ignoreIllegals: true };
        			let cleanedArg1 = arg1
        			  .split(''\n'')
        			  .filter(line => line.trim() !== '''') // Supprime les lignes vides
        			  .join(''\n'');
        			let computed = hljs.highlight(cleanedArg1, arg2).value;
        			this.local.computed[arg1] = computed;
        			return computed;
        		}
        	}
        	/*End_c8o_CompFunction*/
        '
