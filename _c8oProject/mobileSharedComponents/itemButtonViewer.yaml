                    			let canExec = true;
                    			if(page.item.config.checkMandatoryInCurrentPage){
                    				let res = await page.actionBeans.STS1576328658272(page.pageOwner, {}, {indexPage: page.pageOwner.local.currentIndex, pages: page.pageOwner.local.pages, doAll: false}, event);
                    				if(!res?.nextPage){
                    					canExec = false;
                    				}
                    							
                    			}
                    			if(canExec){
                    				page.local.doing = true;
                    				page.ref.detectChanges();
                    				await page.pageOwner.executeFlow(page.item);
                    			}
                    //			
                    		} catch (e) {
                    			console.error("e",e);
                    		
                    		} finally {
                    			page.local.doing = false;
                    			page.ref.detectChanges();
                    			return;
                    		}
                    '
