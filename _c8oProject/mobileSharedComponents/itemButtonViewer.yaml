        '/*Begin_c8o_CompImport*/
        import { debounceTime } from ''rxjs/operators'';
        import { Subject, Subscription } from ''rxjs'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	private inputChangeSubject = new Subject<string>();
        	private subscription: Subscription;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		this.subscription = this.inputChangeSubject.pipe(
        	      debounceTime(300)
        	    ).subscribe(value => {
        	      this.handleDebouncedChange(value);
        	    });
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		if (this.subscription) {
        	      this.subscription.unsubscribe();
        	    }
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	/**
        	 * Checks if a string corresponds to a number.
        	 * @param {string} code - The string to check.
        	 * @returns {boolean} - Returns true if the string corresponds to a number, otherwise false.
        	 */
        	public codeIsADigit(code: string): boolean {
        	    // This regex checks if the `code` string corresponds to a number.
        	    const regex = /^[-+]?[0-9]\d*([.,]\d*)?$/;
        	    
        	    // The `test` method of the regex returns true if the string matches the regex,
        	    // otherwise it returns false.
        	    const isDigit = regex.test(code);
        	    
        	    return isDigit;
        	}
        	handleDebouncedChange(value: string): void {
        		//calling UpdateFunctionsToBeCalledToDataSource shared action
        		this.actionBeans.CTS1609767736560(this, null, {item: value, excludeMySelf: false}, null);
        	}
        
        	/*End_c8o_CompFunction*/
        '
