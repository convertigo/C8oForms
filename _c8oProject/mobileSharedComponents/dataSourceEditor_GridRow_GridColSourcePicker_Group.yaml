      →: |
        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		window["ins"] = this;
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	normalizePaletteFilter(value) {
        		return (value == null ? "" : ("" + value)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        	}
        	
        	pageMatchesFilter(page, query) {
        		const q = this.normalizePaletteFilter(query);
        		if (q === "") {
        			return true;
        		}
        		return this.normalizePaletteFilter(page?.name).indexOf(q) != -1;
        	}
        	
        	itemMatchesFilter(item, query) {
        		const q = this.normalizePaletteFilter(query);
        		if (q === "") {
        			return true;
        		}
        		
        		const values = [
        			item?.name,
        			item?.type,
        			item?.description
        		];
        		
        		for (let i = 0; i < values.length; i++) {
        			if (this.normalizePaletteFilter(values[i]).indexOf(q) != -1) {
        				return true;
        			}
        		}
        		
        		return false;
        	}
        	
        	canDisplayPaletteItem(item, isCardChild = false) {
        		if (item == null) {
        			return false;
        		}
        		
        		const excluded = isCardChild ?
        			["ion-label", "ion-title", "description"] :
        			["ion-label", "ion-title", "description", "chart", "videoCall", "layout", "button"];
        		
        		if (excluded.indexOf(item.type) != -1) {
        			return false;
        		}
        		
        		if (!isCardChild && item.cat == "action") {
        			return false;
        		}
        		
        		let targetType = "";
        		const sources = (this as any)["sources"];
        		try {
        			targetType = this.pageOwner.getTypeByActions(sources);
        		} catch (e) {
        		}
        		
        		if (targetType == "html" && ["img", "file", "signature"].indexOf(item.type) != -1) {
        			return false;
        		}
        		
        		return true;
        	}
        	
        	getFilteredActionItems(items, query, mode = "actions") {
        		const sourceItems = Array.isArray(items) ? items : [];
        		return sourceItems.filter((item) => {
        			if (item == null) {
        				return false;
        			}
        			
        			if (mode == "actions" && !(item.cat == "action" && item.type != "submit")) {
        				return false;
        			}
        			
        			if (mode == "toastless" && !(item.cat == "action" && item.type != "toast")) {
        				return false;
        			}
        			
        			return this.itemMatchesFilter(item, query);
        		});
        	}
        
        	isPaletteTsTarget() {
        		if (this.type != null && this.type != "") {
        			return this.type == "ts";
        		}
        		return this.currentObject?.type == "ts";
        	}
        
        	getPaletteTargetType() {
        		if (this.type == "filter" || this.currentObject?.type == "filter") {
        			return "filter";
        		}
        		if (this.type == "ts" || this.currentObject?.type == "ts") {
        			return "ts";
        		}
        		try {
        			const actionType = this.pageOwner.getTypeByActions(this.sources);
        			if (actionType != "") {
        				return actionType;
        			}
        		}
        		catch (e) {
        		}
        		if (this.type != null && this.type != "") {
        			if (this.type == "text") {
        				return "html";
        			}
        			return this.type;
        		}
        		return "html";
        	}
         
        	getFilteredApiEntries(source, query) {
        		const entries = Object.entries(source || {}).map(([key, value]) => ({ key, value: value as any }));
        		return entries.filter((entry) => {
        			let matches = false;
        			try {
        				matches = this.pageOwner.getIndexOfNormalized2(entry.key, query);
        			} catch (e) {
        				matches = this.normalizePaletteFilter(entry.key).indexOf(this.normalizePaletteFilter(query)) != -1;
        			}
        			
        			if (!matches) {
        				return false;
        			}
        			
        			return this.isPaletteTsTarget() || entry?.value?.action == false;
        		});
        	}
        	
        	pageHasMatchingItems(page, items, query) {
        		const q = this.normalizePaletteFilter(query);
        		const pageMatch = q !== "" && this.pageMatchesFilter(page, query);
        		
        		const sourceItems = Array.isArray(items) ? items : [];
        		for (let i = 0; i < sourceItems.length; i++) {
        			const item = sourceItems[i];
        			if (item?.config?.page != page?.pageTechName) {
        				continue;
        			}
        			
        			if (item?.type == "ion-card" && Array.isArray(item.children)) {
        				for (let j = 0; j < item.children.length; j++) {
        					const child = item.children[j];
        					if (this.canDisplayPaletteItem(child, true) && (q === "" || pageMatch || this.itemMatchesFilter(child, query))) {
        						return true;
        					}
        				}
        			} else if (this.canDisplayPaletteItem(item, false) && (q === "" || pageMatch || this.itemMatchesFilter(item, query))) {
        				return true;
        			}
        		}
        		
        		return false;
        	}
        	
        	getFilteredPages(pages, items, query) {
        		const sourcePages = Array.isArray(pages) ? pages : [];
        		return sourcePages.filter((page) => this.pageHasMatchingItems(page, items, query));
        	}
        	
        	getPaletteSectionKey(section) {
        		return "__palette_section_" + section;
        	}
        	
        	getPaletteFlowLabel(flow) {
        		if (flow?.id == "formulas") {
        			return this.translate.instant(flow.id);
        		}
        		if (flow?.id == "submit") {
        			return this.translate.instant("submit_short");
        		}
        		return flow?.name || this.translate.instant(flow?.id || "");
        	}
        	
        	getPalettePageKey(page) {
        		return "__hidenparams" + (page?.name || "");
        	}
        	
        	isPalettePageExpanded(page) {
        		const key = this.getPalettePageKey(page);
        		if (this.local != null && Object.prototype.hasOwnProperty.call(this.local, key)) {
        			return this.local[key] == null;
        		}
        		const local = this.pageOwner?.local || {};
        		return local[key] == null;
        	}
        	
        	isPaletteSectionExpanded(section) {
        		const key = this.getPaletteSectionKey(section);
        		if (this.local != null && Object.prototype.hasOwnProperty.call(this.local, key)) {
        			return this.local[key] == null;
        		}
        		const local = this.pageOwner?.local || {};
        		return local[key] == null;
        	}
        	
        	getPaletteExpandedStyle(expanded) {
        		return {
        			"display": "grid",
        			"grid-template-rows": expanded ? "1fr" : "0fr",
        			"opacity": expanded ? "1" : "0",
        			"overflow": "hidden",
        			"min-height": "0",
        			"transition": "grid-template-rows 180ms cubic-bezier(0.2, 0, 0, 1), opacity 140ms ease-out",
        			"pointer-events": expanded ? "auto" : "none",
        			"will-change": "grid-template-rows, opacity"
        		};
        	}
        	
        	getPalettePageStyle(page) {
        		const expanded = !this.local?.collapse && this.isPalettePageExpanded(page);
        		return this.getPaletteExpandedStyle(expanded);
        	}
        
        	getPaletteSectionStyle(section) {
        		const expanded = !this.local?.collapse && this.isPaletteSectionExpanded(section);
        		return this.getPaletteExpandedStyle(expanded);
        	}
        	/*End_c8o_CompFunction*/
        '
