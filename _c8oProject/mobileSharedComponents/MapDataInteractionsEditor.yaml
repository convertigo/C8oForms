        	public getMapHeightEditorValue(value: any): string {
        		if (value == null || value == undefined) {
        			return "";
        		}
        		var height = ("" + value).replace(/^\s+|\s+$/g, "");
        		if (height == "") {
        			return "";
        		}
        		height = height.replace(/px$/i, "");
        		var parsedHeight = parseFloat(height);
        		if (isNaN(parsedHeight)) {
        			return "";
        		}
        		if (parsedHeight < 0) {
        			return "0";
        		}
        		return "" + parsedHeight;
        	}
        
        	public normalizeMapHeightInput(value: any): string {
        		return this.getMapHeightEditorValue(value);
        	}
        	/*End_c8o_CompFunction*/
