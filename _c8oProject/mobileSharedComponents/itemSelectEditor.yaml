        	public ensureChoiceDefaultValueConfig(): boolean {
        		if (this.item == null) {
        			return false;
        		}
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		var localSource = this.item.config.sourceEnabled !== true;
        		if (this.item.config.defaultValuesMode == null || this.item.config.defaultValuesMode == "") {
        			this.item.config.defaultValuesMode = localSource ? "visual" : "text";
        		}
        		if (!localSource && this.item.config.defaultValuesMode === "visual") {
        			this.item.config.defaultValuesMode = "text";
        		}
        		if (this.item.config.defaultValueJs == null) {
        			this.item.config.defaultValueJs = "";
        		}
        		if (this.item.sources == null) {
        			this.item.sources = {};
        		}
        		if (this.item.sources.self == null) {
        			this.item.sources.self = { enabled: false, vars: {} };
        		}
        		if (this.item.sources.self.vars == null) {
        			this.item.sources.self.vars = {};
        		}
        		if (this.item.sources.self.vars.selfVar == null) {
        			this.item.sources.self.vars.selfVar = {
        				source: false,
        				type: this.item.config.defaultValuesMode === "js" ? "ts" : "text",
        				str: this.item.config.defaultValuesMode === "js" ? (this.item.config.defaultValueJs || "") : (this.item.config.defaultValue || ""),
        				html: false
        			};
        		}
        		if (this.item.sources.self.vars.selfVar.type === "ts") {
        			this.item.config.defaultValuesMode = "js";
        			this.item.config.defaultValueJs = this.item.sources.self.vars.selfVar.str || "";
        		}
        		else if (this.item.config.defaultValuesMode === "js") {
        			this.item.sources.self.vars.selfVar.type = "ts";
        			this.item.sources.self.vars.selfVar.str = this.item.config.defaultValueJs || "(async ()=>{\n\treturn '''';\n})();";
        			this.item.config.defaultValueJs = this.item.sources.self.vars.selfVar.str || "";
        		}
        		else {
        			if (this.item.config.defaultValuesMode !== "visual" && this.item.config.defaultValuesMode !== "text") {
        				this.item.config.defaultValuesMode = localSource ? "visual" : "text";
        			}
        			if (this.item.config.defaultValuesMode === "text") {
        				this.item.sources.self.vars.selfVar.type = "text";
        				this.item.sources.self.vars.selfVar.str = this.item.sources.self.vars.selfVar.str || this.item.config.defaultValue || "";
        				this.item.config.defaultValue = this.item.sources.self.vars.selfVar.str || "";
        			}
        		}
        		return true;
        	}
        	public setChoiceDefaultValueMode(mode: string): void {
        		if (!this.ensureChoiceDefaultValueConfig()) {
        			return;
        		}
        		if (mode === "visual" && this.item.config.sourceEnabled === true) {
        			mode = "text";
        		}
        		this.item.config.defaultValuesMode = mode;
        		if (mode === "js") {
        			this.item.sources.self.vars.selfVar.type = "ts";
        			this.item.sources.self.vars.selfVar.str = this.item.config.defaultValueJs || "(async ()=>{\n\treturn '''';\n})();";
        			this.item.config.defaultValueJs = this.item.sources.self.vars.selfVar.str;
        		}
        		else if (mode === "text") {
        			this.item.sources.self.vars.selfVar.type = "text";
        			this.item.sources.self.vars.selfVar.str = this.item.config.defaultValue || this.item.sources.self.vars.selfVar.str || "";
        		}
        		try {
        			let owner = this["pageOwner"] != undefined ? this["pageOwner"] : this;
        			if (owner != undefined && owner["updateState"] != undefined) {
        				owner["updateState"]();
        			}
        		}
        		catch (e) {}
        	}
        	/*End_c8o_CompFunction*/
