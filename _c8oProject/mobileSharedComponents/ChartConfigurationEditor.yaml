        			return this.translate.instant("Area");
        		}
        		if (value === "bar") {
        			return this.translate.instant("Bar");
        		}
        		if (value === "pie") {
        			return this.translate.instant("Pie");
        		}
        		if (value === "line") {
        			return this.translate.instant("Line");
        		}
        		if (value === "donut") {
        			return this.translate.instant("Donut");
        		}
        		return this.translate.instant(value);
        	}
        	/*End_c8o_CompFunction*/
