          this.permissions = [
            { name: "Édition d''applications", description: "Créer / modifier / publier.", iconName: "file-tray-full-outline", color: "text-convertigo-blue", bgColor: "bg-convertigo-blue-light" },
            { name: "Publication d''applications", description: "Publier.", iconName: "rocket-outline", color: "text-convertigo-green", bgColor: "bg-green-50" },
            { name: "Formules avancées (JS)", description: "Ajouter des formules complexes en JavaScript.", iconName: "code-slash-outline", color: "text-convertigo-purple", bgColor: "bg-purple-50" },
            { name: "Accès aux bases no-code", description: "Créer / modifier / supprimer des bases, tables et données.", iconName: "server-outline", color: "text-convertigo-orange", bgColor: "bg-orange-50" },
            { name: "Lecture administration", description: "Voir toutes les données d''administration.", iconName: "eye-outline", color: "text-blue-600", bgColor: "bg-blue-50" },
            { name: "Écriture administration", description: "Voir et modifier toutes les données d''administration.", iconName: "create-outline", color: "text-red-600", bgColor: "bg-red-50" }
          ];
        
          this.examples = [
            {
              title: "Exemple 1 - Charlie",
              user: "Charlie",
              groups: ["Groupe D : Formules avancées (JS)"],
              settings: ["C8Oforms.editing_rights_default_enabled: true"],
              result: "Charlie dispose de l''accès à l''édition des applications et peut utiliser les formules avancées (JS).",
              cardClass: "border-convertigo-blue border-2",
              headerClass: "bg-convertigo-blue-light/30",
              iconColor: "text-convertigo-blue"
            },
            {
              title: "Exemple 2 - Dana",
              user: "Dana",
              groups: ["Groupe E : Autorisations en lecture seule", "Groupe F : Lecture admin"],
              settings: ["C8Oforms.editing_rights_default_enabled: true"],
              result: "Dana dispose d''autorisations en lecture seule, de la lecture admin et peut utiliser les formules avancées (JS).",
              cardClass: "border-convertigo-purple border-2",
              headerClass: "bg-purple-50",
              iconColor: "text-convertigo-purple"
            }
          ];
        
          this.guideSteps = [
            { number: "1", title: "Gérer les utilisateurs", description: "Accédez à la section \"Administration > Utilisateurs\" pour ajouter, modifier ou supprimer des utilisateurs. Attribuez-leur les permissions appropriées selon leurs rôles.", value: "step-1", bgColor: "var(--convertigo-blue)" },
            { number: "2", title: "Créer des groupes", description: "Organisez vos utilisateurs en groupes pour simplifier la gestion des permissions. Un utilisateur peut appartenir à plusieurs groupes.", value: "step-2", bgColor: "var(--convertigo-green)" },
            { number: "3", title: "Surveiller l''activité", description: "Utilisez le tableau de bord pour suivre l''activité des utilisateurs, les applications déployées et les performances de votre plateforme.", value: "step-3", bgColor: "var(--convertigo-orange)" },
            { number: "4", title: "Explorer la cartographie", description: "Visualisez la répartition de vos applications, identifiez les éditeurs les plus actifs et analysez les applications complexes.", value: "step-4", bgColor: "var(--convertigo-purple)" }
          ];
        
          this.shortcuts = [
            { title: "Gestion des utilisateurs", description: "Administrer les comptes et permissions", iconName: "people-outline", iconColor: "text-convertigo-blue", bgColor: "bg-convertigo-blue-light" },
            { title: "Gestion des groupes", description: "Créer et gérer les groupes d''utilisateurs", iconName: "shield-checkmark-outline", iconColor: "text-convertigo-green", bgColor: "bg-green-50" },
            { title: "Cartographie des applications", description: "Vue d''ensemble de l''architecture", iconName: "map-outline", iconColor: "text-convertigo-purple", bgColor: "bg-purple-50" },
            { title: "Suivi des évolutions", description: "Historique des modifications", iconName: "layers-outline", iconColor: "text-convertigo-orange", bgColor: "bg-orange-50" }
          ];
        
          this.convertigoSymbols = [
            { iconName: "code-slash-outline", code: "C8Oforms.editing_rights_default_enabled", color: "text-convertigo-blue", description: "Édition d''applications" },
            { iconName: "code-slash-outline", code: "C8Oforms.publishing_rights_default_enabled", color: "text-convertigo-green", description: "Publication d''applications" },
            { iconName: "code-slash-outline", code: "C8Oforms.advanced_formulas_default_enabled", color: "text-convertigo-purple", description: "Formules avancées (JS)" },
            { iconName: "code-slash-outline", code: "C8Oforms.nocode_database_default_enabled", color: "text-convertigo-orange", description: "Accès aux bases no-code" },
            { iconName: "code-slash-outline", code: "C8Oforms.admin_read_rights_default_enabled", color: "text-blue-600", description: "Lecture administration" },
            { iconName: "code-slash-outline", code: "C8Oforms.admin_write_rights_default_enabled", color: "text-red-600", description: "Écriture administration" }
          ];
        
        /*End_c8o_CompConstructor*/
