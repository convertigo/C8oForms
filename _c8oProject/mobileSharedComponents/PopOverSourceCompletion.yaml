        /*Begin_c8o_CompFunction*/
        	public isDisabled(current){
        		if(this.disableAlreadySelected == true){
        			return this.currentItem.name != current && this.currentObject.conds.find((x)=>{return x.name == current}) != null;
        		}
        		return false;
        	}
        	normalizeSourceCompletionSearch(value){
        		return (value == null ? "" : ("" + value)).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        	}
        	sourceCompletionMatchesSearch(item){
        		var search = this.normalizeSourceCompletionSearch(this.local.searchSourceCompletion);
        		if(search == ""){
        			return true;
        		}
        		return this.normalizeSourceCompletionSearch(item && item.displayName).indexOf(search) != -1 || this.normalizeSourceCompletionSearch(item && item.name).indexOf(search) != -1 || this.normalizeSourceCompletionSearch(this.getSourceCompletionType(item)).indexOf(search) != -1;
        	}
        	sortSourceCompletionItems(items){
        		return (Array.isArray(items) ? items.slice() : []).sort(function(a, b){
        			var aLabel = "" + ((a && (a.displayName || a.name)) || "");
        			var bLabel = "" + ((b && (b.displayName || b.name)) || "");
        			return aLabel.localeCompare(bLabel, undefined, {sensitivity: "base", numeric: true});
        		});
        	}
        	getFilteredKeyName(){
        		return this.sortSourceCompletionItems(this.keyName).filter((item) => this.sourceCompletionMatchesSearch(item));
        	}
        	hasSourceCompletionResults(){
        		return this.getFilteredKeyName().length > 0;
        	}
        	getSourceCompletionType(item){
        		return this.normalizeSourceCompletionSearch(item != null ? (item.cType || item.ctype || item.type || "") : "");
        	}
        	getPaletteMeta(type){
        		if(type == null || type == "" || !Array.isArray(this.paletteMetas)){
        			return {};
        		}
        		for(var i = 0; i < this.paletteMetas.length; i++){
        			var group = this.paletteMetas[i];
        			var objects = group != null && Array.isArray(group.objects) ? group.objects : [];
        			for(var j = 0; j < objects.length; j++){
        				if(objects[j] != null && objects[j].type == type){
        					return objects[j];
        				}
        			}
        		}
        		return {};
        	}
        	getSourceCompletionMeta(item){
        		if(item == null){
        			return {};
        		}
        		if(item.icon != null || item.iconPath != null || item.url != null){
        			return item;
        		}
        		return this.getPaletteMeta(item.type);
        	}
        	getSourceCompletionIcon(item){
        		var meta = this.getSourceCompletionMeta(item);
        		if(meta.icon != null && meta.icon != ""){
        			return meta.icon;
        		}
        		return "ban";
        	}
        	getSourceCompletionIconUrl(item){
        		var meta = this.getSourceCompletionMeta(item);
        		if(meta.iconPath != null && meta.iconPath != ""){
        			return meta.iconPath;
        		}
        		if(meta.url != null && meta.url != ""){
        			return meta.url;
        		}
        		return "";
        	}
        	hasSourceCompletionIconUrl(item){
        		return this.getSourceCompletionIconUrl(item) != "";
        	}
        	/*End_c8o_CompFunction*/
        '
