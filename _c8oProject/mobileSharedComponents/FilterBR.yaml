        	public getConditionFieldType(): string {
        		try {
        			let cond = this.currentObject != null && this.currentObject.conds != null ? this.currentObject.conds[this.l] : null;
        			let type = cond != null && cond.val1 != null ? cond.val1.type : "";
        			if (this.conditionKind == "goToPageIf") {
        				return this.pageOwner.getGoToPageType(type);
        			}
        			return this.pageOwner.getType(type);
        		}
        		catch (e) {
        			return "";
        		}
        	}
        	public operatorHasNoRightValue(operator: string): boolean {
        		return ["is_filled", "is_empty", "contains_a_file", "does_not_contain_file", "contains_multiple_files"].indexOf(operator) != -1;
        	}
        	public operatorUsesMultipleValues(operator: string): boolean {
        		return this.getConditionFieldType() == "multiple";
        	}
        	public translateOperator(operator: string): string {
        		if (operator == null || operator === "") {
        			return "";
        		}
        		switch (operator) {
        			case "equal":
        			case "equals":
        				return "=";
        			case "not_equal":
        			case "different":
        				return String.fromCharCode(8800);
        			case "minus":
        				return "<";
        			case "minusequals":
        				return String.fromCharCode(8804);
        			case "greater":
        				return ">";
        			case "greaterequals":
        				return String.fromCharCode(8805);
        		}
        		let brKey = "br_" + operator;
        		let brTranslated = this.translate.instant(brKey);
        		if (brTranslated != brKey) {
        			return brTranslated;
        		}
        		let translated = this.translate.instant(operator);
        		return translated != operator ? translated : operator;
        	}
        	public async __convertTsToText(sourceStr) {
        		try {
        			if (sourceStr == null) {
        				return "";
        			}
        			var raw = "" + sourceStr;
        			var body = raw.trim();
        			if (body.indexOf("(async ()=>{") === 0) {
        				var startReturn = body.indexOf("return ");
        				if (startReturn !== -1) {
        					body = body.substring(startReturn + 7);
        				}
        				var closing = body.lastIndexOf("})();");
        				if (closing !== -1) {
        					body = body.substring(0, closing);
        				}
        			}
        			body = body.trim();
        			if (body.indexOf("return ") === 0) {
        				body = body.substring(7);
        			}
        			body = body.trim();
        			if (body.lastIndexOf(";") === body.length - 1) {
        				body = body.substring(0, body.length - 1);
        			}
        			body = body.trim();
        			if (body === "") {
        				return "";
        			}
        			var translated = body;
        			var builder = "";
        			var tokenRegex = /(\$\$(?:START)?\d+(?:[\s\S]*?)(?:END)?(?:\d+)?\$\$|"(?:\\.|[^"\\])*")/g;
        			var lastIndex = 0;
        			var match;
        			var cleanup = function(fragment) {
        				return fragment.replace(/[+\s;\r\n()]/g, "");
        			};
        			while ((match = tokenRegex.exec(translated)) != null) {
        				if (match.index > lastIndex) {
        					var between = cleanup(translated.substring(lastIndex, match.index));
        					if (between.length > 0) {
        						return raw;
        					}
        				}
        				var token = match[0];
        				if (token.indexOf("$$") === 0) {
        					builder += token;
        				}
        				else {
        					var literal = token;
        					var value = "";
        					try {
        						value = JSON.parse(literal);
        					}
        					catch (ex) {
        						value = literal.substring(1, literal.length - 1);
        					}
        					builder += value;
        				}
        				lastIndex = match.index + match[0].length;
        			}
        			if (lastIndex < translated.length) {
        				var tail = cleanup(translated.substring(lastIndex));
        				if (tail.length > 0) {
        					return raw;
        				}
        			}
        			return builder;
        		}
        		catch (error) {
        			return sourceStr == null ? "" : "" + sourceStr;
        		}
        	}
