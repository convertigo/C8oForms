                    			if(page.currentObject.conds[vars.l].val2.type != ''ts''){
                    				let alertController = page.getInstance(AlertController);
                    				// send an alert to confirm data will be lost
                    				const alert = await alertController.create({
                    			      header: page.translate.instant("header_pwamsg"),
                    			      subHeader: page.translate.instant("compat_js"),
                    			      buttons: [
                    					  {
