        	/** Local query used only to filter displayed select options. */
        	public searchQuery = "";
        	/** Controls the custom searchable options popover without opening the native ion-select overlay. */
        	public isSearchOptionsPopoverOpen = false;
        	/** Element that opened the searchable popover, used to restore focus on dismiss. */
        	private searchOptionsFocusTarget: any = null;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		if ((this.keyName == null || this.keyName == undefined || this.keyName == '''') && !this.disabled) {
        			//indexOf - case of simple array
        			this.local.index = this.options.indexOf(this.model);
        		} else {
        			//findIndex - case of object list
        			this.local.index = this.options.findIndex(item => this.model == item[this.keyName]);
        		}
        //		console.log(''select'', this.model)
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		this.isSearchOptionsPopoverOpen = false;
