        	public showTooltipButton(): boolean {
        		const enabled = this.tooltipEnabled === true || this.tooltipEnabled === "true";
        		if (!enabled) {
        			return false;
        		}
        		const alwaysVisible = this.tooltipAlwaysVisible === true || this.tooltipAlwaysVisible === "true";
        		return alwaysVisible || (this.local != null && this.local.isHovered === true);
        	}
        
        	/** Returns true when the optional local option search is enabled. */
        	public isSearchEnabled(): boolean {
        		return this.searchEnabled === true || this.searchEnabled === "true";
        	}
        
        	/** Options rendered by the select. The source options input is never mutated. */
        	public get filteredOptions(): any[] {
        		const sourceOptions = this.getSourceOptions();
        		const normalizedQuery = this.normalizeSearchText(this.searchQuery);
        		if (!this.isSearchEnabled() || normalizedQuery == "") {
        			return sourceOptions;
        		}
        		return sourceOptions.filter((option) => this.optionMatchesSearch(option, normalizedQuery));
        	}
        
        	/** Updates only the local query used by the controlled searchable popover. */
        	public onSearchChange(eventOrValue: any, _unusedSelectElement?: any): void {
        		const candidate = this.extractSearchValue(eventOrValue);
        		this.searchQuery = candidate == null ? "" : "" + candidate;
        	}
        
        	/** Clears only the local option filter and keeps focus in the searchable popover. */
        	public clearSearch(searchbar?: any): void {
        		this.searchQuery = "";
        		this.focusSearchOptionsInput(searchbar);
        	}
        
        	public openSearchOptions(event?: any): void {
        		if (!this.isSearchEnabled() || this.isComponentDisabled()) {
        			return;
        		}
        		this.searchOptionsFocusTarget = event != null ? (event.currentTarget || event.target || null) : this.searchOptionsFocusTarget;
        		this.isSearchOptionsPopoverOpen = true;
        	}
        
        	public openSearchOptionsFromKeyboard(event?: any): void {
        		const key = event != null ? (event.key || event.code) : null;
        		if (key === "Enter" || key === " " || key === "Space" || key === "Spacebar") {
        			if (event != null && typeof event.preventDefault == "function") {
        				event.preventDefault();
        			}
        			this.openSearchOptions(event);
        		}
        	}
        
        	public closeSearchOptions(): void {
        		this.isSearchOptionsPopoverOpen = false;
        	}
        
        	public onSearchOptionsDidPresent(searchbar?: any): void {
        		this.focusSearchOptionsInput(searchbar);
        	}
        
        	public onSearchOptionsDidDismiss(): void {
        		this.isSearchOptionsPopoverOpen = false;
        		this.focusSearchOptionsTrigger();
        	}
        
        	public hasNoSearchResults(): boolean {
        		return this.isSearchEnabled() && this.normalizeSearchText(this.searchQuery) != "" && this.filteredOptions.length == 0;
        	}
        
        	public getSearchOptionLabel(option: any): string {
        		return this.getOptionSearchText(option);
        	}
        
        	public getSelectedOptionLabel(): string {
        		const sourceOptions = this.getSourceOptions();
        		const optionFromIndex = this.local != null && this.local.index != null && this.local.index >= 0
        			? sourceOptions[this.local.index]
        			: null;
        		const selectedOption = optionFromIndex != null ? optionFromIndex : this.findSelectedOption();
        		return selectedOption == null ? "" : this.getSearchOptionLabel(selectedOption);
        	}
        
        	public isSearchOptionSelected(option: any): boolean {
        		const optionValue = this.getOptionValue(option);
        		if (Array.isArray(this.model)) {
        			return this.model.some((value) => this.sameOptionValue(value, optionValue));
        		}
        		return this.sameOptionValue(this.model, optionValue);
        	}
        
        	public selectSearchOption(option: any): any {
        		if (this.isComponentDisabled()) {
        			return null;
        		}
        		const sourceOptions = this.getSourceOptions();
        		const selectedIndex = sourceOptions.indexOf(option);
        		const selectedValue = this.getOptionValue(option);
        //		console.log(this, selectedIndex, selectedValue)
        		if (this.local == null) {
        			this.local = {};
        		}
        		this.local.index = selectedIndex;
        		this.model = selectedValue;
        //		console.log(this.model)
        		const output = this.hasKeyName() ? {item: this.model, index: selectedIndex} : this.model;
        		this.emitModelChanged(output);
        		this.closeSearchOptions();
        		return output;
        	}
        
        	public isComponentDisabled(): boolean {
        		return this.disabled === true || this.disabled === "true";
        	}
        
        	private extractSearchValue(eventOrValue: any): any {
        		return eventOrValue != null && eventOrValue.detail != null
        			? eventOrValue.detail.value
        			: (eventOrValue != null && eventOrValue.target != null
        				? eventOrValue.target.value
        				: eventOrValue);
        	}
        
        	private focusSearchOptionsInput(searchbar?: any): void {
        		const target = searchbar || (this as any).searchOptionsInput;
        		this.scheduleSearchFocus(() => {
        			try {
        				if (target != null && typeof target.setFocus == "function") {
        					target.setFocus();
        				} else if (target != null && target.nativeElement != null && typeof target.nativeElement.setFocus == "function") {
        					target.nativeElement.setFocus();
        				}
        			} catch (_e) {
        			}
        		});
        	}
        
        	private focusSearchOptionsTrigger(): void {
        		const target = this.searchOptionsFocusTarget;
        		this.searchOptionsFocusTarget = null;
        		this.scheduleSearchFocus(() => {
        			try {
        				if (target != null && typeof target.focus == "function") {
        					target.focus();
        				} else if (target != null && target.nativeElement != null && typeof target.nativeElement.focus == "function") {
        					target.nativeElement.focus();
        				}
        			} catch (_e) {
        			}
        		});
        	}
        
        	private scheduleSearchFocus(callback: () => void): void {
        		if (typeof requestAnimationFrame == "function") {
        			requestAnimationFrame(callback);
        		} else {
        			setTimeout(callback, 0);
        		}
        	}
        
        	private emitModelChanged(output: any): void {
        		try {
        			if (this.modelChanged != null && typeof this.modelChanged.emit == "function") {
        				this.modelChanged.emit(output);
        			}
        		} catch (_e) {
        		}
        	}
        
        	private findSelectedOption(): any {
        		const sourceOptions = this.getSourceOptions();
        		return sourceOptions.find((option) => this.sameOptionValue(this.getOptionValue(option), this.model));
        	}
        
        	private hasKeyName(): boolean {
        		return this.keyName != null && this.keyName != undefined && this.keyName != "" && ("" + this.keyName).length > 0;
        	}
        
        	private getOptionValue(option: any): any {
        		return this.hasKeyName() && option != null && typeof option == "object" ? option[this.keyName] : option;
        	}
        
        	private sameOptionValue(left: any, right: any): boolean {
        		return left == right;
        	}
        
        	private getSourceOptions(): any[] {
        		return Array.isArray(this.options) ? this.options : [];
        	}
        
        	private optionMatchesSearch(option: any, normalizedQuery: string): boolean {
        		return this.normalizeSearchText(this.getOptionSearchText(option)).indexOf(normalizedQuery) != -1;
        	}
        
        	/** Returns the visible option label used for filtering without stringifying technical objects. */
        	private getOptionSearchText(option: any): string {
        		const hasKeyName = this.hasKeyName();
        		let visibleValue = hasKeyName && option != null && typeof option == "object" ? option[this.keyName] : option;
        
        		if (hasKeyName && this.i18nCallback != null && typeof this.i18nCallback == "function") {
        			try {
        				visibleValue = this.i18nCallback(visibleValue);
        			} catch (_e) {
        			}
        		}
        
        		if (visibleValue != null && typeof visibleValue == "object") {
        			visibleValue = visibleValue.label != null
        				? visibleValue.label
        				: (visibleValue.displayValue != null
        					? visibleValue.displayValue
        					: (visibleValue.name != null
        						? visibleValue.name
        						: (visibleValue.value != null
        							? visibleValue.value
        							: (visibleValue.title != null ? visibleValue.title : ""))));
        		}
        
        		const text = visibleValue == null ? "" : "" + visibleValue;
        		if (text != "" && this.translate != null && typeof this.translate.instant == "function") {
        			try {
        				const translated = this.translate.instant(text);
        				if (translated != null && translated != "") {
        					return "" + translated;
        				}
        			} catch (_e) {
        			}
        		}
        		return text;
        	}
        
        	private normalizeSearchText(value: any): string {
        		return (value == null ? "" : "" + value).trim().toLocaleLowerCase();
        	}
        
        	/*End_c8o_CompFunction*/
