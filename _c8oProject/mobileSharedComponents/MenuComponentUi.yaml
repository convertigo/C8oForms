        	onMenuItemClick(item: MenuItem, title): void {
        	  // Placeholder for menu item click handling
        	  this.menuSections.forEach(section => {
        //	    if (section.title === title) {
        	      section.items.forEach(i => {
        			i.active = false;
        			if (i?.items) {
        				i.items.forEach(ii => ii.active = false)
        			}
        		});
        		  
        //	    }
        	  });
        	  
        	  this.administrationSubItems.forEach(it => {it.active = false});
        	  
        //	  console.log(this.menuSections)
        
        	  // Active l''item cliqué
        //	  if (title === "GESTION") {
        //		this.administrationSubItems.forEach(it => {
        //			if (it.label == item.label){
        //				it.active = true;
        //			}
        //		})
        //	  } else {
        //	  }
        	  item.active = true;
        	  this.onMenuItemClickEvent.emit(item)
        	}
        	onLogoutClick(): void {
        	  // Placeholder for logout action handling
        	  this.onLogoutClickEvent.emit()
        	}
        	onCloseClick(): void {
        	  // Placeholder for close menu action handling
        	  this.onCloseClickEvent.emit()
        	}
        	
        	toggleAdministration(item) {
        		item.expanded = !item.expanded;
        		this.isAdministrationExpanded = !this.isAdministrationExpanded
        	}
        /*End_c8o_CompFunction*/
