        '/*Begin_c8o_CompImport*/
        export interface MenuItem {
          label: string;
          iconName: string;
          active?: boolean;
          badge?: number;
          hasArrow?: boolean;
        }
        export interface MenuSection {
          title: string;
          items: MenuItem[];
        }
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        userInitial: string = '''';
        isAdministrationExpanded: boolean = true;
        administrationSubItems: MenuItem[] = [
          { label: ''Accueil'', iconName: ''home-outline'', active: false },
          { label: ''Utilisateurs'', iconName: ''people-outline'', badge: 1, active: false},
          { label: ''Groupes'', iconName: ''heart-outline'', active: false }
        ];
        /*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        
          this.userInitial = this.userName ? this.userName.charAt(0).toUpperCase() : '''';
        
        /*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        
          this.userInitial = this.userName ? this.userName.charAt(0).toUpperCase() : '''';
        
