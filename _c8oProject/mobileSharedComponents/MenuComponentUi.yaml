↓Style [ngx.components.UIStyle-1757346419897]: 
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          'div.menu-container {
            width: 280px;
            height: calc(100vh - 56px);
            padding: 16px;
            color: var(--ion-color-dark);
            border-right: 1px solid #EDEDED;
          }
          
          .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            padding-left: 16px;
            border-bottom: 1px solid #EDEDED;
          }
          
          .user-avatar {
            background-color: var(--convertigo-cyan);
            color: white;
            font-weight: 700;
            font-size: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
          }
          
          .user-details {
            display: flex;
            flex-direction: column;
            font-size: 14px;
          }
          
          .user-name {
            font-weight: 600;
            color: var(--ion-color-dark);
          }
          
          .user-email {
            color: var(--ion-color-medium);
          }
          
          .menu-section {
            margin-top: 24px;
          }
          
          .menu-section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--ion-color-medium);
            margin-bottom: 8px;
            text-transform: uppercase;
          }
          
          .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--ion-color-dark);
          }
          
          .menu-item.active {
            background-color: var(--convertigo-cyan);
            color: var(--ion-color-primary-contrast);
            font-weight: 600;
            border-radius: 12px;
          }
          
          .menu-item-icon {
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: inherit;
          }
          
          .menu-item-badge {
            background-color: var(--convertigo-cyan);
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: auto;
          }
          
          .menu-item.active .menu-item-badge,
          .menu-subitem.active .menu-item-badge {
          	background-color: white;
          	color: var(--convertigo-cyan);
          }
          
          .menu-item-arrow {
            margin-left: auto;
            font-size: 12px;
            color: var(--ion-color-medium);
          }
          
          .menu-actions {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #EDEDED;
            width: calc(100% + 32px);
            margin-left: -16px;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 8px;
            gap: 12px;
          }
          
          .logout-button {
          font-size: 12px;
          padding: 8px 12px;
          border-radius: 12px;
            color: var(--ion-color-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
          }
          
          .logout-button:hover {
          	background-color: #EDEDED;
          }
          
          .close-button {
            --border-radius: 12px;
            --background: var(--ion-color-light);
            color: var(--ion-color-dark);
            font-weight: 600;
            padding: 8px 0;
            width: 100%;
          }
          
          .version-info {
            margin-top: 16px;
            font-size: 12px;
            color: var(--ion-color-medium);
            text-align: center;
          }
          
          .version-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
          }
          
          .version-dot--1 {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--ion-color-success);
          }
          
          .version-dot--0 {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--ion-color-secondary);
          }
          
          .version-dot--2 {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--ion-color-primary);
          }
          
          .version-dot--3 {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--ion-color-warning);
          }
          
          .version-dot--4 {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--ion-color-danger);
          }
          
          .menu-item.expandable {
          //  border: 2px solid var(--ion-color-primary-tint);
            border-radius: 12px;
            padding: 8px 12px;
            font-weight: 600;
          //  color: var(--convertigo-cyan);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
          }
          
          .menu-item.expandable .menu-item-arrow {
            margin-left: auto;
            font-size: 12px;
            color: var(--convertigo-cyan);
            transform: rotate(0deg);
            transition: transform 0.3s ease;
          }
          
          .menu-item.expandable.expanded .menu-item-arrow {
            transform: rotate(180deg);
          }
          
          .menu-subitem {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            padding: 6px 24px;
            cursor: pointer;
            color: var(--ion-color-dark);
          }
          
          .menu-subitem.active {
            background-color: var(--convertigo-cyan);
            color: var(--ion-color-primary-contrast);
            font-weight: 600;
            border-radius: 12px;
          }
          
          .menu-subitem:hover:not(.active),
          .menu-item:hover:not(.active) {
            background-color: #EDEDED;
            border-radius: 12px;
          }
          '
