↓Style [ngx.components.UIStyle-1757346419186]: 
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          'div.modal-container {
          //  padding: 16px;
          }
          
          .modal-header {
          	font-size: 16px;
          }
          
          .modal-header .logo {
            font-size: 16px;
            font-weight: 700;
          //  color: var(--ion-color-primary, #635bff);
            color: var(--convertigo-cyan);
          //  margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            
            background: var(--convertigo-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            ion-icon {
          	font-size: 28px;
          	color: var(--convertigo-cyan) !important;
          	margin-right: 0.35rem;
            }
          }
          
          h2.title {
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 12px;
          }
          
          p.description {
            font-size: 0.875rem;
            color: var(--ion-color-medium-shade);
            margin-bottom: 20px;
          }
          
          ion-input {
            width: 100%;
            margin-top: 4px;
            margin-bottom: 20px;
          }
          
          ion-button.cancel-button {
            --border-radius: 8px;
            color: var(--ion-color-dark);
            background: transparent;
            box-shadow: none;
            border: none;
            margin-right: 12px;
          }
          
          ion-button.send-button {
            --border-radius: 8px;
            color: var(--ion-color-convertigo-contrast);
          }
          
          ion-icon.logo-icon {
            vertical-align: middle;
            margin-right: 6px;
            color: var(--ion-color-primary);
            font-size: 1.5rem;
          }
          
          header.modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 500;
          //  font-size: 1rem;
            margin-bottom: 16px;
          }
          
          header.modal-header span.title-text {
            margin-left: 6px;
            color: var(--ion-color-medium) !important;
          }
          
          button.close-button {
            margin-left: auto;
            background: transparent;
            border: none;
            font-size: 1.25rem;
            color: var(--ion-color-medium-shade);
            cursor: pointer;
          }
          
          label.email-label {
            font-weight: 600;
            font-size: 0.875rem;
