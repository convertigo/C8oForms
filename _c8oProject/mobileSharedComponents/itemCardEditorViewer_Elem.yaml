        	}
        	public onChildCardDragEnd(event?: DragEvent) {
        		event?.stopPropagation();
        		this.endChildDrag();
        		return true;
        	}
        	public endChildDrag() {
        		if (this.childDragInProgress) {
        			this.childDragEndedAt = Date.now();
        		}
        		this.childDragInProgress = false;
        		if (this.pageOwner?.local != null) {
