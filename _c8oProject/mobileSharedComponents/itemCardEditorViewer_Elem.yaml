        	public onChildCardClick(event?: Event) {
        		if (this.childDragInProgress || Date.now() - this.childDragEndedAt < 350 || this.pageOwner?.local?.dragging == true || this.pageOwner?.local?.draggingActions == true) {
        			event?.preventDefault();
        			event?.stopPropagation();
        			return true;
        		}
        		if (this.isChildSelectedFromViewer()) {
        			event?.stopPropagation();
        			return true;
        		}
        		return this.selectChildFromViewer(event);
        	}
        	public onChildCardDragStart(event: DragEvent) {
        		if (this.isDropIndicatorEvent(event) || !this.isCardDragEvent(event) || !this.canDragChildFromViewer()) {
        			event?.preventDefault();
