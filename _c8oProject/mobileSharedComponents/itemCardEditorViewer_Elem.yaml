        		const target = event?.target as HTMLElement;
        		return target?.closest?.("c8oforms-shareddropindicator") != null;
        	}
        	public isCardDragEvent(event?: Event): boolean {
        		const target = event?.target as HTMLElement;
        		const card = target?.closest?.(".class1730737348958, .class1730737348898, .class1730737348901, .class1730737348904");
        		return card != null && this.elementRef?.nativeElement?.contains(card);
        	}
        	public setChildDragImage(event: DragEvent) {
        		const card = this.elementRef?.nativeElement?.querySelector?.(".class1730737348958") as HTMLElement;
        		if (card == null || event.dataTransfer?.setDragImage == null) {
        			return;
        		}
        		document.getElementById("c8o-child-drag-image")?.remove();
        		const clone = card.cloneNode(true) as HTMLElement;
        		const rect = card.getBoundingClientRect();
        		clone.id = "c8o-child-drag-image";
        		clone.style.position = "fixed";
        		clone.style.top = "-10000px";
        		clone.style.left = "-10000px";
        		clone.style.width = rect.width + "px";
        		clone.style.pointerEvents = "none";
        		clone.style.opacity = "0.96";
        		document.body.appendChild(clone);
        		event.dataTransfer.setDragImage(clone, Math.max(0, event.clientX - rect.left), Math.max(0, event.clientY - rect.top));
        	}
        	public isChildSelectedFromViewer(): boolean {
        		return this.child != null && (this.idselectedC == this.child.id || this.owner?.["idselectedC"] == this.child.id || this.pageOwner?.["idselectedC"] == this.child.id);
        	}
        	public getSelectedChildFromViewer(): any {
        		return this.pageOwner?.["idselectedC"] || this.owner?.["idselectedC"] || this.idselectedC || "";
        	}
