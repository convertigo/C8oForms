        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public isFlowEditorTab(tab: string): boolean {
        		const selected = this.owner?.["local"]?.propsTabsSelected?.[this.item?.id] || this.owner?.["tabs"]?.[this.item?.type]?.configuration?.default;
        		return selected == null || selected === "" || selected === tab;
        	}
        
        	public isSelectedConditionBranch(branch: string): boolean {
        		if (this.idselectedC == null || this.idselectedC === "") {
        			return true;
        		}
        		if (this.local?.sel === branch) {
        			return true;
        		}
        		const refs = branch === "else" ? this.item?.childrenRefsElse : this.item?.childrenRefs;
        		return Array.isArray(refs) && refs.indexOf(this.idselectedC) !== -1;
        	}
        	/*End_c8o_CompDeclaration*/
