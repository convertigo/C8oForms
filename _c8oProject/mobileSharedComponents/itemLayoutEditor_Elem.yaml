        	public onChildLayoutClick(event?: Event) {
        		if (this.childDragInProgress || Date.now() - this.childDragEndedAt < 350 || this.pageOwner?.local?.dragging == true || this.pageOwner?.local?.draggingActions == true) {
        			event?.preventDefault();
        			event?.stopPropagation();
        			return true;
        		}
        		if (this.isChildSelectedFromViewer()) {
        			event?.stopPropagation();
        			return true;
        		}
        		return this.selectChildFromViewer(event);
        	}
        	public onChildLayoutDragStart(event: DragEvent) {
        		if (this.isDropIndicatorEvent(event) || !this.isLayoutDragEvent(event) || !this.canDragChildFromViewer()) {
        			event?.preventDefault();
        			event?.stopPropagation();
        			return false;
        		}
        		if (this.child == null || this.pageOwner == null || event?.dataTransfer == null) {
        			return true;
        		}
        		event.stopPropagation();
        		this.childDragInProgress = true;
        		this.installChildDragClickBlocker();
        		this.setChildDragImage(event);
        		this.pageOwner.local.draggingActions = false;
        		this.pageOwner.local.draggingName = this.child.name || "";
        		this.pageOwner.local.draggingType = this.child.type;
        		event.dataTransfer.effectAllowed = "copyMove";
        		event.dataTransfer.setData("__c8oformsdrag", "true");
        		event.dataTransfer.setData(this.child.type, "true");
        		event.dataTransfer.setData("type", this.child.type);
        		event.dataTransfer.setData("origin", "moved");
        		event.dataTransfer.setData("index", [this.indexItem, this.j].toString());
        		this.pageOwner.local.draggingOrigin = "moved";
        		this.pageOwner.local.draggingOriginIndex = [this.indexItem, this.j];
        		this.pageOwner.local.dragging = true;
        //		this.pageOwner.ref.detectChanges();
        		setTimeout(() => {
        			this.pageOwner?.ref?.detectChanges();
        		}, 0);
        		
        //		console.log(this);
        		event.dataTransfer.setData("dropEffect", "copy");
        		event.dataTransfer.setData("text/plain", this.child.name || this.child.type || "c8oforms-child");
        		event.dataTransfer.dropEffect = "copy";
        		const id = "@prefixc8oitem" + this.child.name + "@prefixc8otype" + this.child.type;
        		window["draggingELEMC8O"] = document.getElementById(id) || this.elementRef?.nativeElement;
        		if (window["draggingELEMC8O"] != null) {
        			window["draggingELEMC8O"].ondragend = () => this.endChildDrag();
        		}
        		return true;
        	}
        	public onChildLayoutDragEnd(event?: DragEvent) {
        		event?.stopPropagation();
        		this.endChildDrag();
        		return true;
        	}
        	public endChildDrag() {
        		if (this.childDragInProgress) {
        			this.childDragEndedAt = Date.now();
        		}
        		this.childDragInProgress = false;
        		if (this.pageOwner?.local != null) {
        			this.pageOwner.local.dragging = false;
        			this.pageOwner.local.draggingActions = false;
        			this.pageOwner.local.draggingName = "";
        			delete this.pageOwner.local.draggingOrigin;
        			delete this.pageOwner.local.draggingOriginIndex;
        			this.pageOwner.ref.detectChanges();
        		}
        		document.getElementById("c8o-child-drag-image")?.remove();
        		delete window["draggingELEMC8O"];
        		setTimeout(() => this.removeChildDragClickBlocker(), 15000);
        	}
        	public installChildDragClickBlocker() {
        		this.removeChildDragClickBlocker();
        		this.childDragClickBlocker = (clickEvent: MouseEvent) => {
        			clickEvent.preventDefault();
        			clickEvent.stopPropagation();
        			clickEvent.stopImmediatePropagation();
        			this.removeChildDragClickBlocker();
        		};
        		document.addEventListener("click", this.childDragClickBlocker, true);
        	}
        	public removeChildDragClickBlocker() {
        		if (this.childDragClickBlocker != null) {
        			document.removeEventListener("click", this.childDragClickBlocker, true);
        			this.childDragClickBlocker = undefined;
        		}
        	}
        	public selectChildFromViewer(event?: Event) {
        		event?.stopPropagation();
        		if (this.owner != null && this.child != null) {
        			this.idselectedC = this.child.id;
        			this.owner["idselectedC"] = this.child.id;
        		}
        		if (this.pageOwner != null && this.child != null && this.item != null) {
        			this.pageOwner["idselected"] = this.item.id;
        			this.pageOwner["idselectedC"] = this.child.id;
        			this.pageOwner.local["showItemid"] = this.child.id;
        		}
        		console.log(this.item, this.child);
        		this.pageOwner?.ref?.detectChanges();
        		this.ref.detectChanges();
        		return true;
        	}
        	public canDragLayoutChild(): boolean {
        		return this.renderSelectedEditor ? this.canDragChildFromViewer() : (this.pageOwner?.local?.canDrag || this.global?.isDraggable);
        	}
        	public canDragChildFromViewer(): boolean {
        		return this.child != null && !this.isChildSelectedFromViewer() && this.pageOwner?.local?.draggingActions != true;
        	}
        	public isDropIndicatorEvent(event?: Event): boolean {
        		const target = event?.target as HTMLElement;
        		return target?.closest?.("c8oforms-shareddropindicator") != null;
        	}
        	public isLayoutDragEvent(event?: Event): boolean {
        		const target = event?.target as HTMLElement;
        		const card = target?.closest?.(".layout-child-drag-root, .layout-child-drop-zone, .layout-child-drop-row, .layout-child-drop-col, .class1776776353779, .c8o-child-hover-overlay, .c8o-child-hover-overlay__label");
        		return card != null && this.elementRef?.nativeElement?.contains(card);
        	}
        	public isLayoutClickEvent(event?: Event): boolean {
        		const target = event?.target as HTMLElement;
        		const card = target?.closest?.(".layout-child-drag-root, .class1776776353779");
        		return card != null && this.elementRef?.nativeElement?.contains(card);
        	}
        	public setChildDragImage(event: DragEvent) {
        		const card = this.elementRef?.nativeElement?.querySelector?.(".class1776776353779") as HTMLElement;
        		if (card == null || event.dataTransfer?.setDragImage == null) {
        			return;
        		}
        		document.getElementById("c8o-child-drag-image")?.remove();
        		const clone = card.cloneNode(true) as HTMLElement;
        		const rect = card.getBoundingClientRect();
        		clone.id = "c8o-child-drag-image";
        		clone.style.position = "fixed";
        		clone.style.top = "-10000px";
        		clone.style.left = "-10000px";
        		clone.style.width = rect.width + "px";
        		clone.style.pointerEvents = "none";
        		clone.style.opacity = "0.96";
        		document.body.appendChild(clone);
        		event.dataTransfer.setDragImage(clone, Math.max(0, event.clientX - rect.left), Math.max(0, event.clientY - rect.top));
        	}
        	public isChildSelectedFromViewer(): boolean {
        		return this.child != null && (this.idselectedC == this.child.id || this.owner?.["idselectedC"] == this.child.id || this.pageOwner?.["idselectedC"] == this.child.id);
        	}
        	public getSelectedChildFromViewer(): any {
        		return this.pageOwner?.["idselectedC"] || this.owner?.["idselectedC"] || this.idselectedC || "";
        	}
        	/*End_c8o_CompFunction*/
