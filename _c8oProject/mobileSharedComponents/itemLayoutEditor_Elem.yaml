                      '		if(event.srcElement.id.indexOf("c8o_child2") != -1){
                      			 page.c8o.log.debug("dargstart concerns child2");
                      		}
                      		else{
                      			page.c8o.log.debug("dragstart at level1, index of target to move is "+vars.index);
                      			event.dataTransfer.setData("__c8oformsdrag", true);
                      			event.dataTransfer.setData(vars.item.type, true);
                      			event.dataTransfer.setData("origin", "moved");
                      			event.dataTransfer.setData("index", vars.index);
                      			const dragOwner = page.pageOwner || page;
                      			dragOwner.local.draggingOrigin = "moved";
                      			dragOwner.local.draggingOriginIndex = Array.isArray(vars.index) ? [...vars.index] : String(vars.index).split(",").map((entry) => Number(entry));
                      			dragOwner.local.dragging = true;
                      			dragOwner.ref.detectChanges();
                      			event.dataTransfer.setData("dropEffect", "copy");
                      			// get a copy of dom element to be able to listen dragend event
                      			// in case of destruction into the dom (due to ngIf) of the element and cancel dragging animations
                      			// see https://github.com/convertigo/C8oForms/issues/575
                      			window["draggingELEMC8O"] = document.getElementById(vars.id);
                      			window["draggingELEMC8O"].ondragend = ()=>{
                      				dragOwner.local.dragging = false;
                      				dragOwner.local.draggingActions = false;
                      				dragOwner.local.draggingName = "";
                      				delete dragOwner.local.draggingOrigin;
                      				delete dragOwner.local.draggingOriginIndex;
                      				dragOwner.ref.detectChanges();
                      				delete window["draggingELEMC8O"];
                      			}
                      			resolve();
                      		}
                      '
