        				if (index >= rowStart && index <= i) {
        					return {first: index == rowStart, last: index == i};
        				}
        				rowStart = i + 1;
        				rowWidth = 0;
        			}
        		}
        		return {first: index == rowStart, last: false};
        	}
        	private getHeaderLayoutBreakpoint(): string {
        		if (typeof window == "undefined" || typeof window.matchMedia != "function") {
        			return "xl";
        		}
        		if (window.matchMedia("(min-width: 1200px)").matches) return "xl";
        		if (window.matchMedia("(min-width: 992px) and (max-width: 1199px)").matches) return "lg";
        		if (window.matchMedia("(min-width: 768px) and (max-width: 991px)").matches) return "md";
        		if (window.matchMedia("(min-width: 576px) and (max-width: 767px)").matches) return "sm";
        		return "xs";
        	}
        	private getHeaderLayoutSizes(parentItem: any, breakpoint: string): any[] {
        		var key = breakpoint == "md" ? "tablet" : breakpoint == "sm" ? "phoneL" : breakpoint == "xs" ? "phoneP" : "cols";
        		var config = Array.isArray(parentItem?.config?.[key]) ? parentItem.config[key] : [];
        		return config.filter((col) => col != null && parseFloat("" + col.size) > 0).map((col) => col.size);
        	}
        	public itemHasConfiguredHeaderState(item: any): boolean {
        		return this.itemHasConfiguredDataSource(item) || this.itemHasConfiguredDefaultValue(item) || this.itemHasConfiguredVisibilityCondition(item) || this.itemHasConfiguredNavigationCondition(item) || this.itemHasConfiguredButtonStateCondition(item) || this.itemHasConfiguredBoxStyle(item);
        	}
