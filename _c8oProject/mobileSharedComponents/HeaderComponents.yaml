        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public headerTooNarrow: boolean = false;
        	public headerBelow260: boolean = false;
        	private headerResizeObserver: ResizeObserver | null = null;
        	private headerResizeAnimationFrame: any = null;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		this.disconnectHeaderWidthObserver();
        	/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		setTimeout(() => {
        			this.observeHeaderWidth();
        		});
        	/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	private observeHeaderWidth(): void {
        		const header = this.elRef?.nativeElement?.querySelector(".class1780661784366");
        		this.disconnectHeaderWidthObserver();
        		if (header == null) {
        			this.setHeaderTooNarrow(false);
        			this.setHeaderBelow260(false);
        			return;
        		}
        		this.updateHeaderWidthState(header);
        		if (typeof ResizeObserver === "undefined") {
        			return;
        		}
        		this.headerResizeObserver = new ResizeObserver((entries: ResizeObserverEntry[]) => {
        			const width = entries?.[0]?.contentRect?.width ?? header.getBoundingClientRect().width;
        			this.scheduleHeaderWidthState(width);
        		});
        		this.headerResizeObserver.observe(header);
        	}
        	private disconnectHeaderWidthObserver(): void {
        		if (this.headerResizeObserver != null) {
        			this.headerResizeObserver.disconnect();
        			this.headerResizeObserver = null;
        		}
        		if (this.headerResizeAnimationFrame != null) {
        			cancelAnimationFrame(this.headerResizeAnimationFrame);
        			this.headerResizeAnimationFrame = null;
        		}
        	}
        	private updateHeaderWidthState(header: HTMLElement): void {
        		this.scheduleHeaderWidthState(header.getBoundingClientRect().width);
        	}
        	private scheduleHeaderWidthState(width: number): void {
        		if (this.headerResizeAnimationFrame != null) {
        			cancelAnimationFrame(this.headerResizeAnimationFrame);
        		}
        		this.headerResizeAnimationFrame = requestAnimationFrame(() => {
        			this.headerResizeAnimationFrame = null;
        			this.setHeaderTooNarrow(width < 360);
        			this.setHeaderBelow260(width < 260);
        		});
        	}
        	private setHeaderTooNarrow(value: boolean): void {
        		if (this.headerTooNarrow === value) {
        			return;
        		}
        		this.headerTooNarrow = value;
        		try {
        			this.ref.detectChanges();
        		}
        		catch (e) {
        			this.ref.markForCheck();
        		}
        	}
        	private setHeaderBelow260(value: boolean): void {
        		if (this.headerBelow260 === value) {
        			return;
        		}
        		this.headerBelow260 = value;
        		try {
        			this.ref.detectChanges();
        		}
        		catch (e) {
        			this.ref.markForCheck();
        		}
        	}
        	public getHeaderMetaFromPalette(type: any): any {
        		if (this.pageOwner != null && this.pageOwner.getMetaFromPalette != null) {
        			return this.pageOwner.getMetaFromPalette(type) || {};
        		}
        		var palette = (this.pageOwner != null && this.pageOwner.local != null) ? this.pageOwner.local.Palette : [];
        		if (!Array.isArray(palette)) {
        			palette = [];
        		}
        		for (var i = 0; i < palette.length; i++) {
        			var objects = Array.isArray(palette[i]?.objects) ? palette[i].objects : [];
        			for (var j = 0; j < objects.length; j++) {
        				if (objects[j]?.type === type) {
        					return objects[j];
        				}
        			}
        		}
        		return {};
        	}
        	public itemHasConfiguredDataSource(item: any): boolean {
        		if (this.pageOwner != null && this.pageOwner.itemHasConfiguredDataSource != null) {
        			return this.pageOwner.itemHasConfiguredDataSource(item);
        		}
        		if (item == null || item.sources == null || typeof item.sources != "object") {
        			return false;
        		}
        		for (var sourceKey of Object.keys(item.sources)) {
        			if (sourceKey == "self") {
        				continue;
        			}
        			var source = item.sources[sourceKey];
        			if (source != null && source.enabled === true) {
        				return true;
        			}
        		}
        		return false;
        	}
        	public isHeaderConditionFilled(cond: any): boolean {
        		if (this.pageOwner != null && this.pageOwner.isTotalyFilled != null) {
        			return this.pageOwner.isTotalyFilled(cond);
        		}
        		try {
        			if (cond.subject != undefined && cond.subject == "field" && cond.val1 != undefined && (cond.val1.str != "" || (cond.val1.arr != undefined && cond.val1.arr.length > 0)) && cond.val2 != undefined && (cond.val2.str != "" || (cond.val2.arr != undefined && cond.val2.arr.length > 0)) && cond.operator != undefined && cond.operator != "") {
        				return true;
        			}
        			else if (cond.subject != undefined && cond.subject == "field" && cond.val1 != undefined && (cond.val1.str != "" || (cond.val1.arr != undefined && cond.val1.arr.length > 0)) && cond.operator != undefined && cond.operator != "" && (cond.operator == "is_filled" || cond.operator == "is_empty")) {
        				return true;
        			}
        			else if (cond.val1 != undefined && (cond.val1.str != "" || (cond.val1.arr != undefined && cond.val1.arr.length > 0)) && cond.val2 != undefined && (cond.val2.str != "" || (cond.val2.arr != undefined && cond.val2.arr.length > 0)) && cond.operator != undefined && cond.operator != "" && cond.type == "goToPageIf") {
        				return true;
        			}
        			else if ((cond.val1 != undefined && (cond.val1.str != "" || (cond.val1.arr != undefined && cond.val1.arr.length > 0)) && cond.operator != undefined && cond.operator != "" && (cond.operator == "is_filled" || cond.operator == "is_empty"))) {
        				return true;
        			}
        			else if (cond.subject != undefined && cond.subject == "form" && cond.attribute != undefined && cond.attribute != "" && cond.operator != undefined && cond.operator != "") {
        				return true;
        			}
        			else if (cond.subject != undefined && cond.subject == "field" && cond.val1 != undefined && cond.val1.str != undefined && cond.operator != "" && cond.val1.type == "file") {
        				return true;
        			}
        			else if (cond.subject != undefined && cond.subject == "field" && cond.val1 != undefined && cond.val1.str != undefined && cond.operator != "" && (cond.val1.type == "signature" || cond.val1.type == "img")) {
        				return true;
        			}
        			else if (cond.subject == "never_visible") {
        				return true;
        			}
        		}
        		catch (e) {}
        		return false;
        	}
        	public itemHasFilledConditions(item: any, conditionKey: string): boolean {
        		var conditionBlock = item?.conditions?.[conditionKey];
        		var walk = (group: any): boolean => {
        			if (group == null || typeof group != "object") {
        				return false;
        			}
        			var conds = Array.isArray(group.conds) ? group.conds : [];
        			for (var i = 0; i < conds.length; i++) {
        				if (this.isHeaderConditionFilled(conds[i])) {
        					return true;
        				}
        			}
        			var groups = Array.isArray(group.groups) ? group.groups : [];
        			for (var j = 0; j < groups.length; j++) {
        				if (walk(groups[j])) {
        					return true;
        				}
        			}
        			return false;
        		};
        		return walk(conditionBlock);
        	}
        	public itemHasConfiguredVisibilityCondition(item: any): boolean {
        		if (this.pageOwner != null && this.pageOwner.itemHasConfiguredVisibilityCondition != null) {
        			return this.pageOwner.itemHasConfiguredVisibilityCondition(item);
        		}
        		return this.itemHasFilledConditions(item, "visibleIf");
        	}
        	public itemHasConfiguredNavigationCondition(item: any): boolean {
        		if (this.pageOwner != null && this.pageOwner.itemHasConfiguredNavigationCondition != null) {
        			return this.pageOwner.itemHasConfiguredNavigationCondition(item);
        		}
        		return this.itemHasFilledConditions(item, "goToPageIf");
        	}
        	public itemHasConfiguredHeaderState(item: any): boolean {
        		return this.itemHasConfiguredDataSource(item) || this.itemHasConfiguredVisibilityCondition(item) || this.itemHasConfiguredNavigationCondition(item);
        	}
        	/*End_c8o_CompFunction*/
