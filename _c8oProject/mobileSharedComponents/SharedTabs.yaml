        	getIcon(item, index){
        		if(item.iconName == undefined){
        			return ''book-outline'';
        		}
        		else{
        			let name = item.iconName;
        			if (item.iconName.indexOf(''-outline'') != -1) {
        				name = item.iconName.split(''-outline'')[0]
        			}
        			else if(item.iconName.indexOf(''-sharp'') != -1){
        				name = item.iconName.split(''-sharp'')[0]
        			}
        			return name + (index == this.pageOwner.local.currentIndex ? '''' : ''-outline'');
        		}
        	}
        	/*End_c8o_CompFunction*/
        '
