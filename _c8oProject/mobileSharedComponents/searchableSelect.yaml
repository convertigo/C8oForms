        	public getDropdownPositionStyle(){
        		var style:any = {};
        		if(this.global?.mobilePlat){
        			style["width"] = "100%";
        		}
        		try {
        			var trigger = this.elementRef.nativeElement.querySelector(".class1648542300891");
        			if(trigger != null){
        				var rect = trigger.getBoundingClientRect();
        				var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
        				var spaceBelow = viewportHeight - rect.bottom;
        				var preferredHeight = 280;
        				var margin = 8;
        				if(spaceBelow < preferredHeight && rect.top > spaceBelow){
        					style["bottom"] = "100%";
        					style["top"] = "auto";
        					style["maxHeight"] = Math.max(120, Math.min(preferredHeight, rect.top - margin)) + "px";
        				}
        				else{
        					style["top"] = "100%";
        					style["bottom"] = "auto";
        					style["maxHeight"] = Math.max(120, Math.min(preferredHeight, spaceBelow - margin)) + "px";
        				}
        				style["overflowY"] = "auto";
        			}
        		}
        		catch(e){
        			
        		}
        		return style;
        	}
        	
        	public typeOF(attr){
        		return typeof(attr);
        	}
        	/*End_c8o_CompFunction*/
        
