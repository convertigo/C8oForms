        ↓CustomAsyncAction [ngx.components.UICustomAsyncAction-1743437908331]: 
          actionValue: 
            - xmlizable: 
              - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
              - com.twinsoft.convertigo.beans.common.FormatedContent: 
                →: |
                  '		try {
                  			if (page.local.navParams.data.groupSelected == "all_users") {
                  				await page.presentToast(page.translate.instant("an_error_occured"), ''toastError'');
                  				return true;
                  			}
                  			
                  			if (!page.local.editing_rights && !page.local.nocode_db_rights && !page.local.admin && !page.local.formulas_rights && !page.local.admin_readonly) {
                  				let data = await page.c8o.callJsonObject("C8Oforms.admin_group_delete", {_use_doc_id: page.local.navParams.data.groupSelected}).async();
                  				if (data.couchdb_output?.ok) {
                  					await page.presentToast(page.translate.instant("updated_with_success"), ''toastSuccess'');
                  				} else {
                  					await page.presentToast(page.translate.instant("an_error_occured"), ''toastError'');
                  				}
                  			}
                  			
                  			if (page.local.navParams.data.groupSelected != page.local.group_name && page.local.group_name.length > 0) 
                  			{
                  				var meta: any = {oldGroup: page.local.navParams.data.groupSelected, newGroup: page.local.group_name};
                  				var data = await page.c8o.callJsonObject("C8Oforms.admin_groups_patch", {meta:JSON.stringify(meta)}).async();
                  				if(data.group != undefined){
                  					// supprimer l''ancien document et en créer un nouveau	
                  					if (!(!page.local.editing_rights && !page.local.nocode_db_rights && !page.local.admin && !page.local.formulas_rights && !page.local.admin_readonly)) {						
                  						data = await page.c8o.callJsonObject("C8Oforms.admin_group_delete", {_use_doc_id: page.local.navParams.data.groupSelected}).async();
                  						meta = {
                  							_id: page.local.group_name,
                  							editing_rights: page.local.editing_rights,
                  							formulas: page.local.formulas,
                  							nocode_db_rights: page.local.nocode_db_rights,
                  							admin: page.local.admin,
                  							admin_readonly: page.local.admin_readonly
                  						};
                  						data = await page.c8o.callJsonObject("C8Oforms.admin_group_upsert", {meta: JSON.stringify(meta)}).async();
                  						if (data?.error) {
                  							await page.presentToast(page.translate.instant("an_error_occured"), ''toastError'');
                  							return false;
                  						}
                  					}
                  				}
                  				else{
                  					await page.presentToast(page.translate.instant("an_error_occured"), ''toastError'');
                  					return false;
                  				}
                  				await page.presentToast(page.translate.instant("updated_with_success"), ''toastSuccess'');
                  				return true;
                  			} else {
                  				if (!(!page.local.editing_rights && !page.local.nocode_db_rights && !page.local.admin && !page.local.formulas_rights)) {					
                  					meta = {_id: page.local.group_name, editing_rights: page.local.editing_rights, formulas: page.local.formulas_rights, nocode_db_rights: page.local.nocode_db_rights, admin: page.local.admin, admin_readonly: page.local.admin_readonly };
                  					data = await page.c8o.callJsonObject("C8Oforms.admin_group_upsert", {meta: JSON.stringify(meta)}).async();
                  				}
                  			}
                  			
                  			if (!data?.error) {
                  				await page.presentToast(page.translate.instant("updated_with_success"), ''toastSuccess'');
                  				return true;
                  			} else {
                  				await page.presentToast(page.translate.instant("an_error_occured"), ''toastError'');
                  				return false;
                  			}
                  
                  		} catch (e) {
                  			await page.presentToast(page.translate.instant("an_error_occured"), ''toastError'');
                  			return false;
                  		}
