        			this.computeUnit(changes.config.currentValue.unit);
        			this.ref.detectChanges();
        		}
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
