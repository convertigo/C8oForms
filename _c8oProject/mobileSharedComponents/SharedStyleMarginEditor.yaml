        /*Begin_c8o_CompFunction*/
        	computeUnit(unit){
        		switch(unit){
        		case "px":
        		case "ch":
        		case "auto":
        			if(this.target =='margin'){
        				this.local.label0 = "0";
        				this.local.label10 = "10";
        				this.local.label20 = "20";
        				this.local.label40 = "40";
        				this.local.label60 = "60";
        				this.local.label100 = "100";
        				this.local.label140 = "140";
        				this.local.label220 = "220";
        				this.local.min = - 220;
        				this.local.max = 220;
        			}
        			else if(this.target =='width'){
        				//360 
        				this.local.label0 = "220";
        				this.local.label10 = "360";
        				this.local.label20 = "640";
        				this.local.label40 = "720";
        				this.local.label60 = "940";
        				this.local.label100 = "1280";
        				this.local.label140 = "1360";
        				this.local.label220 = "1440";
        				this.local.min = 0;
        				this.local.max = 1440;
        			}
        			else if(this.target =='font-size'){
        				this.local.label0 = "6";
        				this.local.label10 = "8";
        				this.local.label20 = "10";
        				this.local.label40 = "12";
        				this.local.label60 = "14";
        				this.local.label100 = "16";
        				this.local.label140 = "18";
        				this.local.label220 = "20";
        				this.local.min = 0;
        				this.local.max = 72;
        			}
        			
        			break;
        		case "%":
        		case "vw":
        		case "vh":
        		case "vsw":
        			case "vsh":
        				this.local.label0 = "0";
        				this.local.label10 = "5";
        				this.local.label20 = "10";
        				this.local.label40 = "15";
        				this.local.label60 = "25";
        				this.local.label100 = "50";
        				this.local.label140 = "75";
        				this.local.label220 = "100";
        				this.local.min = -100;
        				this.local.max = 100;
        				if(this.target =='width' || this.target =='font-size'){
        					this.local.min = 0;
        					this.local.max = 100;
        				}
        				break;
        		case "em":
        		case "rem":
        			let multiplier = 1;
        			
        			if(this.target =='width'){
        				multiplier = 10;
        			}
        			this.local.label0 = ((+"0") * multiplier)+"";
        			this.local.label10 = ((+"0.125") * multiplier)+"";
        			this.local.label20 = ((+"0.25") * multiplier)+"";
        			this.local.label40 = ((+"0.5") * multiplier)+"";
        			this.local.label60 = ((+"1") * multiplier)+"";
        			this.local.label100 = ((+"2") * multiplier)+"";
        			this.local.label140 = ((+"4") * multiplier)+"";
        			this.local.label220 = ((+"8") * multiplier)+"";
        			this.local.min = -8;
        			this.local.max = 8;
        			if(this.target =='width' || this.target =='font-size'){
        				this.local.min = 0;
        				this.local.max = +this.local.label220;
        			}
        				break;
        		}
        		
        	}
        	updateValueByBtn(val){
        		if(this.config.unit == "auto"){
        			this.config.unit = "px";
        		}
        		this.config.value = val;
        		this.pageOwner.updateState();
        	}
        	/*End_c8o_CompFunction*/
        
