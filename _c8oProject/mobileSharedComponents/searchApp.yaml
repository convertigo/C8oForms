        			public UserCellRenderer(params: any): SafeHtml {
        	//		  console.log(params.data)
        			  const { displayName, name } = params;
        			  const initials = (displayName) ? displayName?.slice(0, 2).toUpperCase() : '''';
        
        			  return this.sanitizer.bypassSecurityTrustHtml(`
        			    <div style="display:flex; align-items:center; gap:12px;wi">
        			      <div style="
        			        width:56px; height:56px; border-radius:50%;
        			        background:#e0f2fe; color:#334155;border: 4px solid #00b4d880;
        			        display:flex; align-items:center; justify-content:center;color:var(--ion-color-newconvertigo);
        			        font-weight:600; font-size:15.75px;
        			      ">
        			        ${((initials !== undefined && initials.length > 0) ? initials : 
        							`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`
        						
        					)}
        			      </div>
        			      <div style="display:flex;width:calc(100% - 50px); flex-direction:column; line-height:1.2;">
        			        <span style="font-weight:600;font-size:18px;line-height:25px;" class="truncate">${displayName || this.translate.instant("Utilisateur_inconnu")}</span>
        			      </div>
        			    </div>
        			  `);
        			}
        			
        		public PermissionsCellRenderer(params: any, tooltip: boolean = false): SafeHtml {
        //			console.log(params.data)
        			const { admin,  formulas, nocode_db_rights, publication, editing_rights, admin_readonly} = params;	
        			let permissions = [];
        			let permissionsLength = 0;
        			const isTrue = (v: any) => v === true || v === "true";
        
        			
        			for (let i = 0; i < 6; i++) {				
        				if (isTrue(admin) && permissions.indexOf("admin") === -1) {
        				  permissions.push("admin");
        				  permissionsLength++;
        				}
        				
        				if (isTrue(nocode_db_rights) && permissions.indexOf("nocode_db_rights") === -1) {
        				  permissions.push("nocode_db_rights");
        				  permissionsLength++;
        				}
        
        				if (isTrue(formulas) && permissions.indexOf("formulas") === -1) {
        				  permissions.push("formulas");
        				  permissionsLength++;
        				}
        
        				if (isTrue(publication) && permissions.indexOf("publication") === -1) {
        				  permissions.push("publication");
        				  permissionsLength++;
        				}
        
        				if (isTrue(editing_rights) && permissions.indexOf("editing_rights") === -1) {
        				  permissions.push("editing_rights");
        				  permissionsLength++;
        				}
        
        				if (isTrue(admin_readonly) && permissions.indexOf("admin_readonly") === -1) {
        				  permissions.push("admin_readonly");
        				  permissionsLength++;
        				}
        
        
        			}
        			
        //			console.log(permissions);
        
        		  if (permissionsLength === 0) {
        		    return `<span style="color:#9ca3af;height:100%; font-size:12px;">-</span>`;
        		  }
        
        		  // mapping permission → couleur
        		  const colors: Record<string, string> = {
        		    admin: "rgba(239, 68, 68, 0.5)",          // rouge (#ef4444)
        		    nocode_db_rights: "rgba(245, 158, 11, 0.5)", // orange (#f59e0b)
        		    formulas: "rgba(16, 185, 129, 0.5)",      // vert (#10b981)
        		    publication: "rgba(59, 130, 246, 0.5)",   // bleu (#3b82f6)
        		    editing_rights: "rgba(16, 185, 129, 0.5)", // vert (#10b981)
        		    admin_readonly: "rgba(139, 92, 246, 0.5)" // violet (#8b5cf6)
        		  };
        		  
        		  const styleClasses: Record<string, string> = {
        		    admin: "metric-icon-badge--danger",      // rouge
        		    nocode_db_rights: "metric-icon-badge--warning",       // orange
        		  formulas: "metric-icon-badge--success",       // violet
        		    publication: "metric-icon-badge--info",       // bleu
        		    editing_rights: "metric-icon-badge--success",    // vert
        		    admin_readonly: "metric-icon-badge--tertiary",       // violet
        		  };
        		  
        		  const permsNames: Record<string, string> = {
        		    publication: this.translate.instant("publication_perm"),       // bleu
        		    admin: this.translate.instant("admin_perm"),      // rouge
        		    nocode_db_rights: this.translate.instant("nocode_db_rights_perm"),       // orange
        		    editing_rights: this.translate.instant("editing_rights_perm"),    // vert
        		    admin_readonly: this.translate.instant("admin_readonly_perm"),       // violet
        		  formulas: this.translate.instant("formulas_perm")       // violet
        		  };
        
        		  const dots = permissions.map(p => {
        		    const color = colors[p] || "#9ca3af";
        			const styleClass = styleClasses[p] || "";
        			const styleClass2 = ((tooltip)? (styleClass+''--tooltip'') : '''')
        //			const styleClass2 = ''''
        		    return `<span class="${styleClass} ${styleClass2} truncate" data-text="${permsNames[p]}" style="filter:brightness(1) contrast(1.75);border-radius:8px; background:${color} !important;padding:2px 6px; font-size:11px; display:inline-block;">${permsNames[p]}</span>`;
        		  }).join(" ");
        
        		  return this.sanitizer.bypassSecurityTrustHtml(`<div style="display:flex; flex-wrap:wrap;height: auto;overflow:auto !important;gap:6px; align-items:flex-start;margin-bottom: 14px;margin-top: 0.5rem;font-size: 12px;line-height: 18px;font-weight: 400;">${dots}</div>`);
        		}
        					
        							
        		public SourceCellRenderer(params: any): SafeHtml {
        		  const { mail, language, provider } = params;
        //		  console.log(mail, language, provider)
        			const colors: Record<string, string> = {
        			  forms: "#3b82f6",
        			  linkedin: "#3b82f6",
        			  undefined: "#3b82f6", 
        			  google: "#ef4444",      // rouge
        			  azuread: "#8b5cf6",      // violet
        			openid: "#111827"       // gris
        			};
        			
        			const styleClasses: Record<string, string> = {
        			  forms: "metric-icon-badge--info",
        			  undefined: "metric-icon-badge--info",
        			  google: "metric-icon-badge--danger",
        			  openid: "metric-icon-badge--dark",
        			  azuread: "metric-icon-badge--primary",
        			  linkedin: "metric-icon-badge--primary",
        			};
        
        		  return this.sanitizer.bypassSecurityTrustHtml(`
        			  <div style="display:flex;align-items:flex-start;height: 31.5px !important;margin-bottom: 14px;margin-top: 0.5rem;font-size: 12px;line-height: 18px;font-weight: 400;">
        					<span class=${styleClasses[provider]} style="
        			          border-radius:8px; padding:2px 6px; font-size:11px;
        			        ">${(provider == undefined) ? ''Convertigo'' : this.translate.instant(provider)}</span>
        			  </div>
        		  `);
        		}
        	/*End_c8o_CompFunction*/
        '
