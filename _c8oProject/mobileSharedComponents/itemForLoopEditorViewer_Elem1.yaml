        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public _idselectedC: any = "";
        	public childDragInProgress: boolean = false;
        	public childDragEndedAt: number = 0;
        	public childDragClickBlocker: ((event: MouseEvent) => void) | undefined;
        	@Input() public get idselectedC() {
        		return this._idselectedC;
        	}
        	public set idselectedC(val: any) {
        		if (val !== undefined && this._idselectedC !== val) {
        			this._idselectedC = val;
        			this.idselectedCChange.emit(val);
        		}
        	}
        	@Output() idselectedCChange = new EventEmitter<any>();
        
        	public onChildCardClick(event?: Event): boolean {
        		const page: any = this.pageOwner || this.findPageOwner();
        		if (this.childDragInProgress || Date.now() - this.childDragEndedAt < 350 || page?.local?.dragging == true) {
        			event?.preventDefault();
        			event?.stopPropagation();
        			return true;
        		}
        		if (this.isChildSelectedFromViewer()) {
        			event?.stopPropagation();
        			return true;
        		}
        		return this.selectChildFromViewer(event);
        	}
        
        	public onChildCardDragStart(event: DragEvent): boolean {
        		if (this.isDropIndicatorEvent(event) || !this.isCardDragEvent(event) || !this.canDragChildFromViewer()) {
        			event?.preventDefault();
        			event?.stopPropagation();
        			return false;
        		}
        		const page: any = this.pageOwner || this.findPageOwner();
        		const child: any = this.child;
        		if (event?.dataTransfer == null || page == null || child == null) {
        			return true;
        		}
        		const dragOrigin = this.getChildDragOrigin(page);
        		const index = dragOrigin.index;
        		const originCardChild = dragOrigin.originCardChild;
        		const originFlowIndex = dragOrigin.originFlowIndex;
        		event.stopPropagation();
        		this.childDragInProgress = true;
        		this.installChildDragClickBlocker();
        		this.setChildDragImage(event);
        		page.local.flow = true;
        		page.local.draggingName = child.name || "";
        		page.local.draggingType = child.type;
        		page.local.draggingOrigin = "moved";
        		page.local.draggingOriginIndex = index;
        		page.local.draggingActions = true;
        		page.local.draggingFlows = false;
        		event.dataTransfer.effectAllowed = "copyMove";
        		event.dataTransfer.setData("__c8oformsdragactions", "true");
        		event.dataTransfer.setData(child.type, "true");
        		event.dataTransfer.setData("type", child.type);
        		event.dataTransfer.setData("origin", "moved");
        		event.dataTransfer.setData("index", index.toString());
        		event.dataTransfer.setData("dropEffect", "copy");
        		event.dataTransfer.setData("indexOriginFlow", String(originFlowIndex));
        		event.dataTransfer.setData("indexoriginflow", String(originFlowIndex));
        		event.dataTransfer.setData("originCardChildOrigin", originCardChild);
        		event.dataTransfer.setData("text/plain", child.name || child.type || "c8oforms-flow-child");
        		event.dataTransfer.dropEffect = "copy";
        //		this.pageOwner.ref.detectChanges();
        		const id = "@prefixc8oitem" + child.name + "@prefixc8otype" + child.type + "c8o_child1";
        		window["draggingELEMC8O"] = document.getElementById(id) || this.elementRef?.nativeElement;
        		if (window["draggingELEMC8O"] != null) {
        			window["draggingELEMC8O"].ondragend = () => this.endChildDrag();
        		}
        //		page.ref?.detectChanges?.();
        		setTimeout(() => {
        		  try {
        		    this.pageOwner.ref.detectChanges();
        		  } catch (e) {}
        		}, 0);
        		return true;
        	}
        
        	public onChildCardDragEnd(event?: DragEvent): boolean {
        		event?.stopPropagation();
        		this.endChildDrag();
        		return true;
        	}
        
        	public endChildDrag(): void {
        		if (this.childDragInProgress) {
        			this.childDragEndedAt = Date.now();
        		}
        		this.childDragInProgress = false;
        		const page: any = this.pageOwner || this.findPageOwner();
        		if (page?.local != null) {
        			page.local.dragging = false;
        			page.local.draggingActions = false;
        			page.local.draggingFlows = false;
        			page.local.draggingName = "";
        			delete page.local.draggingOrigin;
        			delete page.local.draggingOriginIndex;
        			page.ref?.detectChanges?.();
        		}
        		document.getElementById("c8o-flow-child-drag-image")?.remove();
        		delete window["draggingELEMC8O"];
        		setTimeout(() => this.removeChildDragClickBlocker(), 15000);
        	}
        
        	public installChildDragClickBlocker(): void {
        		this.removeChildDragClickBlocker();
        		this.childDragClickBlocker = (clickEvent: MouseEvent) => {
        			clickEvent.preventDefault();
        			clickEvent.stopPropagation();
        			clickEvent.stopImmediatePropagation();
        			this.removeChildDragClickBlocker();
        		};
        		document.addEventListener("click", this.childDragClickBlocker, true);
        	}
        
        	public removeChildDragClickBlocker(): void {
        		if (this.childDragClickBlocker != null) {
        			document.removeEventListener("click", this.childDragClickBlocker, true);
        			this.childDragClickBlocker = undefined;
        		}
        	}
        
        	public selectChildFromViewer(event?: Event): boolean {
        		event?.stopPropagation();
        		const page: any = this.pageOwner || this.findPageOwner();
        		this.pageOwner = page;
        		if (this.owner != null && this.child != null) {
        			this.idselectedC = "";
        			this.owner["idselectedC"] = "";
        		}
        		if (page != null && this.child != null) {
        			page["idselected"] = this.child.id;
        			page["idselectedC"] = "";
        		}
        		page?.ref?.detectChanges?.();
        		this.ref?.detectChanges?.();
        		return true;
        	}
        
        	public selectParentFlowTab(page: any, parentItem: any, tab: string): void {
        		if (page?.local == null || parentItem?.id == null) {
        			return;
        		}
        		if (page.local.propsTabsSelected == null) {
        			page.local.propsTabsSelected = {};
        		}
        		page.local.propsTabsSelected[parentItem.id] = tab;
        	}
        
        	public canDragChildFromViewer(): boolean {
        		const page: any = this.pageOwner || this.owner?.["pageOwner"];
        		return this.child != null && !this.isChildSelectedFromViewer() && (this.childDragInProgress || page?.local?.draggingActions != true);
        	}
        
        	public getChildDragOrigin(page: any): { index: Array<number>, originCardChild: string, originFlowIndex: number } {
        		const originFlowIndex = this.getOriginFlowIndex(page);
        		const elements = page?.form?.flows?.[originFlowIndex]?.elements;
        		const childId = this.child?.id;
        		const ownerItem = this.owner?.["item"];
        		const parentId = ownerItem?.id ?? this.child?.parentRef;
        		const originCardChild = "childrenRefs";
        		let parentIndex = Number(this.indexItem);
        		let childIndex = Number(this.j);
        
        		if (Array.isArray(elements)) {
        			const foundParentIndex = elements.findIndex((element: any) => element?.id == parentId);
        			if (foundParentIndex > -1) {
        				parentIndex = foundParentIndex;
        			}
        			const parent = parentIndex > -1 ? elements[parentIndex] : ownerItem;
        			if (Array.isArray(parent?.childrenRefs)) {
        				const foundChildIndex = parent.childrenRefs.findIndex((ref: any) => this.getChildRefId(ref) == childId);
        				if (foundChildIndex > -1) {
        					childIndex = foundChildIndex;
        				}
        			}
        		}
        
        		return {
        			index: [
        				Number.isFinite(parentIndex) ? parentIndex : 0,
        				Number.isFinite(childIndex) ? childIndex : 0
        			],
        			originCardChild,
        			originFlowIndex
        		};
        	}
        
        	public getChildRefId(ref: any): any {
        		return typeof ref === "object" ? ref?.id : ref;
        	}
        
        	public getOriginFlowIndex(page: any): number {
        		const currentIndex = Number(page?.local?.currentIndex);
        		const parentId = this.owner?.["item"]?.id ?? this.child?.parentRef;
        		const childId = this.child?.id;
        		const flows = page?.form?.flows;
        		if (Array.isArray(flows)) {
        			const foundIndex = flows.findIndex((flow: any) => {
        				return Array.isArray(flow?.elements) && flow.elements.some((element: any) => element?.id == parentId || element?.id == childId);
        			});
        			if (foundIndex > -1) {
        				return foundIndex;
        			}
        		}
        		return Number.isFinite(currentIndex) ? currentIndex : 0;
        	}
        
        	public isDropIndicatorEvent(event?: Event): boolean {
        		const target = event?.target as HTMLElement;
        		return target?.closest?.("c8oforms-shareddropindicator") != null;
        	}
        
        	public isCardDragEvent(event?: Event): boolean {
        		const target = event?.target as HTMLElement;
        		const selector = ".class1743172004673, .class1743172004613, .class1743172004616, .class1743172004619, .c8o-child-hover-overlay, .c8o-child-hover-overlay__icon, .c8o-child-hover-overlay__label";
        		const card = target?.closest?.(selector);
        		if (card != null && this.elementRef?.nativeElement?.contains(card)) {
        			return true;
        		}
        		return event?.composedPath?.().some((entry: any) => {
        			return entry?.matches?.(selector) && this.elementRef?.nativeElement?.contains(entry);
        		}) == true;
        	}
        
        	public setChildDragImage(event: DragEvent): void {
        		const card = this.elementRef?.nativeElement?.querySelector?.(".class1743172004673") as HTMLElement;
        		if (card == null || event.dataTransfer?.setDragImage == null) {
        			return;
        		}
        		document.getElementById("c8o-flow-child-drag-image")?.remove();
        		const clone = card.cloneNode(true) as HTMLElement;
        		const rect = card.getBoundingClientRect();
        		clone.id = "c8o-flow-child-drag-image";
        		clone.style.position = "fixed";
        		clone.style.top = "-10000px";
        		clone.style.left = "-10000px";
        		clone.style.width = rect.width + "px";
        		clone.style.pointerEvents = "none";
        		clone.style.opacity = "0.96";
        		document.body.appendChild(clone);
        		event.dataTransfer.setDragImage(clone, Math.max(0, event.clientX - rect.left), Math.max(0, event.clientY - rect.top));
        	}
        
        	public isChildSelectedFromViewer(): boolean {
        		const page: any = this.pageOwner || this.owner?.["pageOwner"];
        		return this.child != null && (this.idselectedC == this.child.id || this.owner?.["idselectedC"] == this.child.id || page?.["idselectedC"] == this.child.id);
        	}
        
        	public getSelectedChildFromViewer(): any {
        		const page: any = this.pageOwner || this.owner?.["pageOwner"];
        		return page?.["idselectedC"] || this.owner?.["idselectedC"] || this.idselectedC || "";
        	}
        
