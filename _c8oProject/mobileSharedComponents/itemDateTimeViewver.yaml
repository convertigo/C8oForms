        	}
        
        	public setDateValidationError(errorKey: string): void {
        		const fieldKey = this.getDateFieldKey();
        		const store = this.getDateValidationStore();
        		if (fieldKey !== "") {
        			if (errorKey === "") {
        				delete store[fieldKey];
        			}
        			else {
        				store[fieldKey] = errorKey;
        			}
        		}
        		this.updateMandatoryState(errorKey !== "");
        	}
        
        	public getDateValidationError(): string {
        		const fieldKey = this.getDateFieldKey();
        		if (fieldKey === "") {
        			return "";
        		}
        		const value = this.getDateValidationStore()[fieldKey];
        		return value === "invalid_date" || value === "date_before_min" || value === "date_after_max" ? value : "";
        	}
        
        	public getDateErrorKey(): string {
        		const validationError = this.getDateValidationError();
        		if (validationError !== "") {
        			return validationError;
        		}
        		if (this.redList != null && this.item?.name != null && this.redList[this.item.name] === true) {
        			return "repMandartory";
        		}
        		return "";
        	}
        
        	public hasDateError(): boolean {
        		return this.getDateErrorKey() !== "";
        	}
        
        	public updateMandatoryState(hasDateValidationError: boolean = false): void {
        		if (this.redList == null || this.item?.name == null) {
        			return;
        		}
        		const empty = this.model == null || this.model["value"] == null || this.model["value"] === "";
        		this.redList[this.item.name] = hasDateValidationError || (this.item?.config?.mandatory === true && empty);
        	}
        
        	public commitDate(canonicalValue: any): any {
        		const canonical = this.normalizeCanonicalDate(canonicalValue);
        		const previousValue = this.model != null && this.model["value"] != null ? "" + this.model["value"] : "";
        		if (canonical == null) {
        			if (this.model != null) {
        				this.model["value"] = "";
        			}
        			this.local.value = "";
        			this.local.lastModelValue = "";
        			this.setDateValidationError("invalid_date");
        			this.pageOwner?.ref?.detectChanges();
        			return { notify: previousValue !== "", committed: false };
        		}
        		const validationError = this.validateCanonicalDate(canonical, this.item?.config);
        		if (validationError !== "") {
        			if (this.model != null) {
        				this.model["value"] = "";
        			}
        			this.local.value = canonical;
        			this.local.lastModelValue = "";
        			this.setDateValidationError(validationError);
        			this.pageOwner?.ref?.detectChanges();
        			return { notify: previousValue !== "", committed: false };
        		}
        		if (this.model != null) {
        			this.model["value"] = canonical;
        		}
        		this.local.value = canonical;
        		this.local.manualText = this.formatCanonicalDate(canonical, this.item?.config?.display_format);
        		this.local.lastModelValue = canonical;
        		this.local.lastDisplayFormat = this.item?.config?.display_format || "DD/MM/YYYY";
        		this.local.manualTouched = false;
        		this.setDateValidationError("");
        		this.pageOwner?.ref?.detectChanges();
        		return { notify: previousValue !== canonical, committed: true };
        	}
        
        	public handleManualDateChange(input: any): any {
        		const raw = input == null ? "" : "" + input;
        		const previousValue = this.model != null && this.model["value"] != null ? "" + this.model["value"] : "";
        		this.local.manualText = raw;
        		this.local.manualTouched = true;
        		if (raw.trim() === "") {
        			if (this.model != null) {
        				this.model["value"] = "";
