        	public getDateEntryMode(): string {
        		const configuredMode = this.item?.config?.date_entry_mode;
        		if (configuredMode === "calendar" || configuredMode === "manual" || configuredMode === "both") {
        			return configuredMode;
        		}
        		return this.item?.config?.accessibility === true ? "both" : "calendar";
        	}
        
        	public isManualDateMode(): boolean {
        		const mode = this.getDateEntryMode();
        		return mode === "manual" || mode === "both";
        	}
        
        	public isCalendarDateMode(): boolean {
        		const mode = this.getDateEntryMode();
        		return mode === "calendar" || mode === "both";
        	}
        
        	public getDateFieldKey(): string {
        		const value = this.item?.id != null && this.item.id !== "" ? this.item.id : this.item?.name;
        		return value == null ? "" : "" + value;
        	}
        
        	public getDateErrorId(): string {
        		return "date_error_" + this.getDateFieldKey().replace(/[^a-zA-Z0-9_-]/g, "_");
        	}
        
        	private isGregorianDate(year: number, month: number, day: number): boolean {
        		if (!Number.isInteger(year) || !Number.isInteger(month) || !Number.isInteger(day) || year < 1 || month < 1 || month > 12 || day < 1) {
        			return false;
        		}
        		const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
        		const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        		return day <= days[month - 1];
        	}
        
        	private padDatePart(value: number): string {
        		return value < 10 ? "0" + value : "" + value;
        	}
        
        	public normalizeCanonicalDate(value: any): string | null {
        		if (value == null) {
        			return null;
        		}
        		const raw = ("" + value).trim();
        		const match = /^(\d{4})-(\d{2})-(\d{2})(?:T.*)?$/.exec(raw);
        		if (match == null) {
        			return null;
        		}
        		const year = Number(match[1]);
        		const month = Number(match[2]);
        		const day = Number(match[3]);
        		if (!this.isGregorianDate(year, month, day)) {
        			return null;
        		}
        		return match[1] + "-" + match[2] + "-" + match[3];
        	}
        
        	public formatCanonicalDate(canonicalValue: any, displayFormat: string = this.item?.config?.display_format): string {
        		const canonical = this.normalizeCanonicalDate(canonicalValue);
        		if (canonical == null) {
        			return "";
        		}
        		const year = canonical.substring(0, 4);
        		const month = canonical.substring(5, 7);
        		const day = canonical.substring(8, 10);
        		switch (displayFormat) {
        			case "MM/DD/YY":
        				return month + "/" + day + "/" + year.substring(2);
        			case "DD/MM/YY":
        				return day + "/" + month + "/" + year.substring(2);
        			case "MM/DD/YYYY":
        				return month + "/" + day + "/" + year;
        			case "YYYY/MM/DD":
        				return year + "/" + month + "/" + day;
        			case "DD/MM/YYYY":
        			default:
        				return day + "/" + month + "/" + year;
        		}
        	}
        
        	public parseManualDate(input: any, displayFormat: string = this.item?.config?.display_format): string | null {
        		if (input == null) {
        			return null;
        		}
        		const raw = ("" + input).trim();
        		const supportedFormat = ["MM/DD/YY", "DD/MM/YY", "MM/DD/YYYY", "DD/MM/YYYY", "YYYY/MM/DD"].indexOf(displayFormat) !== -1
        			? displayFormat
        			: "DD/MM/YYYY";
        		const tokens = supportedFormat.split("/");
        		const parts = raw.split("/");
        		if (parts.length !== 3) {
        			return null;
        		}
        		let year = 0;
        		let month = 0;
        		let day = 0;
        		for (let index = 0; index < tokens.length; index++) {
        			const token = tokens[index];
        			const part = parts[index];
        			const expectedLength = token === "YYYY" ? 4 : 2;
        			if (part.length !== expectedLength || !/^\d+$/.test(part)) {
        				return null;
        			}
        			const numericValue = Number(part);
        			if (token === "YYYY") {
        				year = numericValue;
        			}
        			else if (token === "YY") {
        				year = numericValue <= 68 ? 2000 + numericValue : 1900 + numericValue;
        			}
        			else if (token === "MM") {
        				month = numericValue;
        			}
        			else if (token === "DD") {
        				day = numericValue;
        			}
        		}
        		if (!this.isGregorianDate(year, month, day)) {
        			return null;
        		}
        		return ("" + year).padStart(4, "0") + "-" + this.padDatePart(month) + "-" + this.padDatePart(day);
        	}
        
        	public getTodayDateFomatted(): string {
        		const now = new Date();
        		return now.getFullYear() + "-" + this.padDatePart(now.getMonth() + 1) + "-" + this.padDatePart(now.getDate());
        	}
        
        	public validateCanonicalDate(canonicalValue: any, config: any = this.item?.config): string {
        		const canonical = this.normalizeCanonicalDate(canonicalValue);
        		if (canonical == null) {
        			return "invalid_date";
        		}
        		const effectiveConfig = config || {};
        		const configuredMin = this.normalizeCanonicalDate(effectiveConfig.min_datetime);
        		const configuredMax = this.normalizeCanonicalDate(effectiveConfig.max_datetime);
        		const effectiveMin = effectiveConfig.date_less_than_today === true ? this.getTodayDateFomatted() : configuredMin;
        		const effectiveMax = effectiveConfig.date_more_than_today === true ? this.getTodayDateFomatted() : configuredMax;
        		if (effectiveMin != null && canonical < effectiveMin) {
        			return "date_before_min";
        		}
        		if (effectiveMax != null && canonical > effectiveMax) {
        			return "date_after_max";
        		}
        		return "";
        	}
        
        	private getDateValidationStore(): any {
        		if (this.global.__c8oDateValidationErrors == null || typeof this.global.__c8oDateValidationErrors !== "object") {
        			this.global.__c8oDateValidationErrors = {};
        		}
