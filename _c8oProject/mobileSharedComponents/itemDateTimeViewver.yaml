        			this.local.value = "";
        			this.local.lastModelValue = "";
        			this.setDateValidationError("");
        			this.pageOwner?.ref?.detectChanges();
        			return { notify: previousValue !== "", committed: true };
        		}
        		const canonical = this.parseManualDate(raw, this.item?.config?.display_format);
        		if (canonical == null) {
        			if (this.model != null) {
        				this.model["value"] = "";
        			}
        			this.local.value = "";
        			this.local.lastModelValue = "";
        			this.setDateValidationError("invalid_date");
        			this.pageOwner?.ref?.detectChanges();
        			return { notify: previousValue !== "", committed: false };
        		}
        		return this.commitDate(canonical);
        	}
        
        	public syncDateFromModel(): void {
        		if (this.model == null || this.item == null) {
        			return;
        		}
        		const rawValue = this.model["value"] == null ? "" : "" + this.model["value"];
        		const displayFormat = this.item?.config?.display_format || "DD/MM/YYYY";
        		if (rawValue.trim() === "") {
        			this.local.value = "";
        			this.local.manualText = "";
        			this.local.lastModelValue = "";
