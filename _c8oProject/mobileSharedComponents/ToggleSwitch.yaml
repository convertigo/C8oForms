↓Style [ngx.components.UIStyle-1775840606015]: 
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.div-flex{
          	display: grid;
          	grid-template-columns: var(--c8o-toggle-label-width, 180px) minmax(0, 1fr);
          	align-items: flex-start;
          	column-gap: 16px;
          	row-gap: 8px;
          	width: fit-content;
          	max-width: 100%;
          	padding: var(--c8o-setting-row-padding, 6px 0);
          }
          .div-text{
          	display: flex;
          	min-height: 40px;
          	align-items: center;
          	align-self: center;
          	color: #404040;
          	font-family: Inter;
          	font-size: 14px;
          	font-style: normal;
          	font-weight: 500;
          	line-height: 20px; /* 142.857% */
          	letter-spacing: -0.15px;
          }
          .div-toggle{
          	display: flex;
          	//min-height: 40px;
          	height: auto;
          	width: fit-content;
          	max-width: 100%;
          	padding: 4px;
          	align-items: center;
          	gap: 4px;
          	flex-wrap: wrap;
          	border-radius: 10px;
          	background: #F5F5F5;
          }
          .w-100 {	
          	width: 100% !important;
          }
          .template-column-unset {
          	grid-template-columns: unset;
          }
          .c8o-btn{
          	display: flex;
          	//flex: 1 0 0;
          	min-height: 32px;
          	padding: 6px 15.297px 6px 16px;
          	justify-content: center;
          	align-items: center;
          	border-radius: 8px;
          	span{
          			text-align: center;
          			font-family: Inter;
          			font-size: 14px;
          			font-style: normal;
          			font-weight: 500;
          			line-height: 20px; /* 142.857% */
          			letter-spacing: -0.15px;
          		}
          }
          .c8o-btn-selected{
          	background: #FFF;
          	box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.10), 0 1px 2px -1px rgba(0, 0, 0, 0.10);
          	span{
          		color: #155DFC;
          	}
          	
          }
          .c8o-btn-not-selected{
          	background: #F5F5F5;
          	span{
          		color: #525252;
          	}
          	
          }
          @media (max-width: 640px) {
          	.div-flex{
          		grid-template-columns: 1fr;
          	}
          	.div-text{
          		min-height: auto;
          		padding: 0;
          	}
          	.div-toggle{
          		width: 100%;
          	}
          	.c8o-btn{
          		flex: 1 1 auto;
          	}
          }'
