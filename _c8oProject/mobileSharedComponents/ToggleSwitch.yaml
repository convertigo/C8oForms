          	padding: 4px;
          	align-items: center;
          	gap: 4px;
          	flex-wrap: wrap;
          	border-radius: 10px;
          	background: #F5F5F5;
          }
          .w-100 {	
          	width: 100% !important;
          }
          .template-column-unset {
          	grid-template-columns: unset;
          }
          .c8o-btn{
          	display: flex;
          	//flex: 1 0 0;
          	min-height: 32px;
          	padding: 6px 15.297px 6px 16px;
          	justify-content: center;
          	align-items: center;
          	border-radius: 8px;
          	span{
          			text-align: center;
