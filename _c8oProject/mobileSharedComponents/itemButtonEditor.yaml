        '/*Begin_c8o_CompImport*/
        import { C8Oforms_ChooseIcon } from "../../components/c8oforms.chooseicon/c8oforms-chooseicon";
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	@Input() tabselected: any = undefined;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		window["btn"] = this;
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	public buttonFlowOptions() {
        		return (this.pageOwner?.form?.flows || []).slice(2);
        	}
        
        	public buttonFlowLabel(value: string) {
        		return (this.pageOwner?.form?.flows || []).find(flow => flow.id === value)?.name || value;
        	}
        
        	public buttonShapeOptions() {
        		return [{id: ''default''}, {id: ''round''}];
        	}
        
        	public buttonShapeLabel(value: string) {
        		return this.translate.instant(value === ''default'' ? ''rectangular'' : ''round'');
        	}
        
        	public buttonSizeOptions() {
        		return [{id: ''small''}, {id: ''default''}, {id: ''large''}];
        	}
        
        	public buttonSizeLabel(value: string) {
        		if (value === ''default'') {
        			return this.translate.instant(''medium'');
        		}
        		return this.translate.instant(value);
        	}
        
        	public buttonJustifyOptions() {
        		return [{id: ''flex-start''}, {id: ''center''}, {id: ''flex-end''}];
        	}
        
        	public buttonJustifyLabel(value: string) {
        		if (value === ''flex-start'') {
        			return this.translate.instant(''start_l'');
        		}
        		if (value === ''flex-end'') {
        			return this.translate.instant(''end_r'');
        		}
        		return this.translate.instant(''Center'');
        	}
        
        	public buttonAlignOptions() {
        		return [{id: ''flex-start''}, {id: ''center''}, {id: ''flex-end''}];
        	}
        
        	public buttonAlignLabel(value: string) {
        		if (value === ''flex-start'') {
        			return this.translate.instant(''start_t'');
        		}
        		if (value === ''flex-end'') {
        			return this.translate.instant(''end_b'');
        		}
        		return this.translate.instant(''Center'');
        	}
        
        	public buttonIconPositionOptions() {
        		return [{id: ''start''}, {id: ''end''}];
        	}
        
        	public buttonIconPositionLabel(value: string) {
        		return this.translate.instant(value === ''start'' ? ''start_l'' : ''end_r'');
        	}
        
        	public isButtonDataInteractionsTab() {
        		return this.tabselected == ''data_interactions'' || this.tabselected == null || this.tabselected == undefined || this.tabselected == '''';
        	}
        
        	public isButtonStyleTab() {
        		return this.tabselected == ''button_style'';
        	}
        
        	public isButtonIconTab() {
        		return this.tabselected == ''button_icon'';
        	}
        	
        	public ensureButtonConfig() {
        		if (this.item == null) {
        			return {};
        		}
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		return this.item.config;
        	}
        	
        	public buttonDisplayModeOptions() {
        		return [{id: "normal"}, {id: "advanced"}];
        	}
        	
        	public buttonDisplayModeLabel(value: string) {
        		if (value === "advanced") {
        			return this.translate.instant("label_app_mode_advanced");
        		}
        		return "Normal";
        	}
        	
        	public getButtonDisplayMode() {
        		var config = this.ensureButtonConfig();
        		return config.buttonDisplayMode === "advanced" ? "advanced" : "normal";
        	}
        	
        	public isButtonAdvancedDisplayMode() {
        		return this.getButtonDisplayMode() === "advanced";
        	}
        	
        	public getButtonLabelEditorObject() {
        		let config = this.ensureButtonConfig();
        		let label = config.label;
        		if (label != null && typeof label == "object") {
        			if (label.str == null) {
        				label.str = "";
        			}
        			label.html = true;
        			label.type = "html";
        			return label;
        		}
        		let current = label != null ? "" + label : "";
        		if (this.local.buttonLabelEditorObject == null || this.local.buttonLabelEditorValue != current) {
        			this.local.buttonLabelEditorValue = current;
        			this.local.buttonLabelEditorObject = {str: current, html: true, type: "html"};
        		}
        		return this.local.buttonLabelEditorObject;
        	}
        	
        	public saveButtonLabel(props) {
        		let config = this.ensureButtonConfig();
        		let current = this.getButtonLabelEditorObject();
        		let next = {...current, ...props, html: true, type: "html"};
        		config.label = next.str != null ? next.str : "";
        		this.local.buttonLabelEditorValue = config.label;
        		this.local.buttonLabelEditorObject = next;
        		this.ref.markForCheck();
        	}
        	
        	public getToggleValue(event: any) {
        		console.log(event);
        		let value = event;
        		if (value != null && typeof value === ''object'' && value.out !== undefined) {
        			value = value.out;
        		}
        		if (value != null && typeof value === ''object'' && value.item !== undefined) {
        			return value.item;
        		}
        		console.log(value);
        		return value;
        	}
        
        	public updateButtonState() {
        		let owner = this.pageOwner != undefined ? this.pageOwner : this.owner;
        		if (owner != undefined && owner["updateState"] != undefined) {
        			owner["updateState"]();
        		}
        		this.ref.markForCheck();
        	}
        
        	public setButtonFlow(event: any) {
        		console.log(this.item, this.item.flow)
        		this.item.flow = this.getToggleValue(event);
        		console.log(this.item, this.item.flow)
        		this.updateButtonState();
        	}
        
        	public setButtonConfig(key: string, event: any) {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		this.item.config[key] = this.getToggleValue(event);
        		this.updateButtonState();
        	}
        
        	public setButtonConfigDraft(key: string, event: any) {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		this.item.config[key] = this.getToggleValue(event);
        		this.ref.markForCheck();
        	}
        
        	public commitButtonConfig(key: string, event: any) {
        		this.setButtonConfigDraft(key, event);
        		this.updateButtonState();
        	}
        
        	public setButtonMandatory(event: any) {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		this.item.config.checkMandatoryInCurrentPage = this.getToggleValue(event) === ''oui'';
        		this.updateButtonState();
        	}
        	/*End_c8o_CompFunction*/
        '
