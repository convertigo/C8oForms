        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public isFlowEditorTab(tab: string): boolean {
        		const selected = this.owner?.["getSelectedMainEditorTab"]?.(this.item);
        		return selected == null || selected === "" || selected === tab;
        	}
        
        	public isSubmitEditorVisible(): boolean {
        		if (this.owner?.["local"]?.currentPage === "actions") {
        			return true;
        		}
        		const selected = this.owner?.["getSelectedMainEditorTab"]?.(this.item);
        		return selected == null || selected === "" || selected === "submit" || selected === "tab_selector_choice_action" || selected === "tab_selector_conf_action";
        	}
        
        	public getSubmitDatasourceTab(): string {
        		const selected = (this as any).tabselected || (this.owner?.["local"]?.currentPage === "actions" ? null : this.owner?.["getSelectedMainEditorTab"]?.(this.item));
        		if (selected === "tab_selector_choice_action" || selected === "tab_selector_conf_action") {
        			return selected;
        		}
        		const actions = this.item?.actions;
        		const hasSelectedAction = this.pageOwner?.findAvailableActions != null
        			? !this.pageOwner.findAvailableActions(actions)
        			: actions != null && Object.keys(actions).some((key) => actions[key]?.enabled === true || actions[key]?.enabled === "true");
        		return hasSelectedAction ? "tab_selector_conf_action" : "tab_selector_choice_action";
        	}
        	/*End_c8o_CompDeclaration*/
