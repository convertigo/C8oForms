        	public isGalleryQuestionTab() {
        		return this.tabselected == "tab_selector_grid_question";
        	}
        	
        	public isGalleryTemplateTab() {
        		return this.tabselected == "tab_selector_gallery_template";
        	}
        	
        	public isGalleryOrgTab() {
        		return this.tabselected == "tab_selector_grid_org";
        	}
        	
        	public ensureGalleryConfig() {
        		if (this.item == null) {
        			return {};
        		}
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		return this.item.config;
        	}
        
        	public getEnabledGallerySource() {
        		try {
        			const sources = this.item?.sources;
        			if (sources == null) {
        				return null;
        			}
        			if (this.pageOwner?.getEnabled != null) {
        				const enabled = this.pageOwner.getEnabled(sources);
        				return enabled != null ? sources[enabled] : null;
        			}
        			for (let name in sources) {
        				if (sources[name]?.enabled == true) {
        					return sources[name];
        				}
        			}
        		}
        		catch (e) {
        		}
        		return null;
        	}
        
        	public parseGallerySourceConfig() {
        		try {
        			const source = this.getEnabledGallerySource();
        			const vars = source?.vars;
        			if (vars == null) {
        				return null;
        			}
        			let raw = vars.forms_config != null ? vars.forms_config : vars.formsConfig;
        			if (raw != null && raw.str != undefined) {
        				raw = raw.str;
        			}
        			if (typeof raw == "string" && raw.trim() != "") {
        				return JSON.parse(raw);
        			}
        			if (raw != null && typeof raw == "object") {
        				return raw;
        			}
        		}
        		catch (e) {
        		}
        		return null;
        	}
        
        	public addGalleryField(fields, seen, name, label?) {
        		if (name == null || ("" + name).trim() == "") {
        			return;
        		}
        		const key = "" + name;
        		if (seen[key] == true) {
        			return;
        		}
        		seen[key] = true;
        		fields.push({ name: key, label: label != null && ("" + label).trim() != "" ? "" + label : key });
        	}
        
        	public getGalleryModelFields() {
        		const fields = [];
        		const seen = {};
        		const sourceConfig = this.parseGallerySourceConfig();
        		if (sourceConfig != null) {
        			if (Array.isArray(sourceConfig.columns)) {
        				sourceConfig.columns.forEach((column) => this.addGalleryField(fields, seen, column));
        			}
        			if (Array.isArray(sourceConfig.hidden)) {
        				sourceConfig.hidden.forEach((column) => this.addGalleryField(fields, seen, column));
        			}
        			this.addGalleryField(fields, seen, sourceConfig.displayValue);
        			this.addGalleryField(fields, seen, sourceConfig.value);
        		}
        		if (fields.length == 0 && Array.isArray(this.item?.config?.columns)) {
        			this.item.config.columns.forEach((column) => {
        				const name = column?.name || column?.field || column?.headerName;
        				this.addGalleryField(fields, seen, name);
        			});
        		}
        		return fields;
        	}
        
        	public getDisplayedGalleryModelFields() {
        		const fields = [];
        		const seen = {};
        		const sourceConfig = this.parseGallerySourceConfig();
        		if (sourceConfig != null) {
        			const hidden = {};
        			if (Array.isArray(sourceConfig.hidden)) {
        				sourceConfig.hidden.forEach((column) => {
        					if (column != null) {
        						hidden["" + column] = true;
        					}
        				});
        			}
        			if (Array.isArray(sourceConfig.columns)) {
        				sourceConfig.columns.forEach((column) => {
        					if (column != null && hidden["" + column] !== true) {
        						this.addGalleryField(fields, seen, column);
        					}
        				});
        			}
        			if (fields.length == 0) {
        				if (sourceConfig.displayValue != null && hidden["" + sourceConfig.displayValue] !== true) {
        					this.addGalleryField(fields, seen, sourceConfig.displayValue);
        				}
        				if (sourceConfig.value != null && hidden["" + sourceConfig.value] !== true) {
        					this.addGalleryField(fields, seen, sourceConfig.value);
        				}
        			}
        		}
        		if (fields.length == 0 && Array.isArray(this.item?.config?.columns)) {
        			this.item.config.columns.forEach((column) => {
        				if (column?.hide === true) {
        					return;
        				}
        				const name = column?.name || column?.field || column?.headerName;
        				const label = column?.label || column?.headerName || name;
        				this.addGalleryField(fields, seen, name, label);
        			});
        		}
        		return fields;
        	}
        
        	public escapeGalleryString(value) {
        		return ("" + (value == null ? "" : value)).replace(/\\/g, "\\\\").replace(/''/g, "\\''");
        	}
        
        	public escapeGalleryHtml(value) {
        		return ("" + (value == null ? "" : value))
        			.replace(/&/g, "&amp;")
        			.replace(/</g, "&lt;")
        			.replace(/>/g, "&gt;")
        			.replace(/"/g, "&quot;")
        			.replace(/''/g, "&#39;");
        	}
        
        	public getGalleryFieldAccessCode(fieldName) {
        		return "api.currentFor.element[''" + this.escapeGalleryString(fieldName) + "'']";
        	}
        
        	public getGalleryStringLiteral(value) {
        		return "''" + this.escapeGalleryString(value) + "''";
        	}
        
        	public getGalleryFieldPropertyCode(fieldName, property) {
        		return this.getGalleryFieldAccessCode(fieldName) + "." + property;
        	}
        
        	public getGalleryBadgeToken(label, code) {
        		try {
        			// id 1 is the toolbox badge id: $$toVal evaluates c8opath as-is at runtime
        			const badge = this.pageOwner.getBadge(1, label, { c8opath: code }, true, "html");
        			return this.pageOwner.transformHtmlto$(badge, true);
        		}
        		catch (e) {
        			return "";
        		}
        	}
        
        	public getDefaultGalleryTemplate() {
        		const fields = this.getDisplayedGalleryModelFields();
        		if (fields.length == 0) {
        			return "";
        		}
        		let template = "";
        		fields.forEach((field) => {
        			const column = this.getGalleryBadgeToken(field.label + ".displayName", this.getGalleryFieldPropertyCode(field.name, "displayName")) || this.escapeGalleryHtml(field.label);
        			const value = this.getGalleryBadgeToken(field.label + ".displayValue", this.getGalleryFieldPropertyCode(field.name, "displayValue"));
        			template += "<p><strong>" + column + "</strong></p><p>" + value + "</p>";
        		});
        		return template;
        	}
        
        	public getGalleryTemplateSignature() {
        		return JSON.stringify(this.getDisplayedGalleryModelFields().map((field) => field.name + ":" + field.label));
        	}
        
        	public buildDefaultGalleryTemplateObject() {
        		return {
        			str: this.getDefaultGalleryTemplate(),
        			html: true,
        			type: "html",
        			autoGenerated: true,
        			sourceSignature: this.getGalleryTemplateSignature()
        		};
        	}
        
        	public shouldRegenerateGalleryTemplate(config, signature) {
        		const template = config.galleryTemplate;
        		if (template == null || template == "") {
        			return true;
        		}
        		if (typeof template == "object") {
        			if (template.str == null || ("" + template.str).trim() == "") {
        				return true;
        			}
        			return template.autoGenerated == true && template.sourceSignature != signature;
        		}
        		return false;
        	}
        
        	public syncDefaultGalleryTemplate() {
        		const config = this.ensureGalleryConfig();
        		const signature = this.getGalleryTemplateSignature();
        		if (this.shouldRegenerateGalleryTemplate(config, signature)) {
        			config.galleryTemplate = this.buildDefaultGalleryTemplateObject();
        		}
        	}
        
        	public getGalleryTemplateObject() {
        		const config = this.ensureGalleryConfig();
        		this.syncDefaultGalleryTemplate();
        		if (config.galleryTemplate == null || config.galleryTemplate == "") {
        			config.galleryTemplate = this.buildDefaultGalleryTemplateObject();
        		}
        		else if (typeof config.galleryTemplate == "string") {
        			config.galleryTemplate = {
        				str: config.galleryTemplate,
        				html: true,
        				type: "html"
        			};
        		}
        		else if (typeof config.galleryTemplate == "object") {
        			if (config.galleryTemplate.str == null) {
        				config.galleryTemplate.str = "";
        			}
        			config.galleryTemplate.html = true;
        			config.galleryTemplate.type = "html";
        		}
        		return config.galleryTemplate;
        	}
        
        	public saveGalleryTemplate(props) {
        		const config = this.ensureGalleryConfig();
        		const current = this.getGalleryTemplateObject();
        		const keepAutoGenerated = current?.autoGenerated == true && (props == null || props.str == null || props.str == current.str);
        		const next = { ...current, ...props, html: true, type: "html", autoGenerated: keepAutoGenerated };
        		if (keepAutoGenerated) {
        			next.sourceSignature = current.sourceSignature;
        		}
        		else {
        			delete next.sourceSignature;
        		}
        		config.galleryTemplate = next;
        	}
        
        	public resetDefaultGalleryTemplate() {
        		const config = this.ensureGalleryConfig();
        		config.galleryTemplate = this.buildDefaultGalleryTemplateObject();
        		this.local.galleryPaletteSignature = "";
        		this.local.galleryPaletteCache = null;
        		// the mounted TinyMCE editor keeps its initial content: unmount it for one
        		// tick so it is recreated with the regenerated template
        		this.local.galleryTemplateEditorReload = true;
        		this.ref.detectChanges();
        		setTimeout(() => {
        			this.local.galleryTemplateEditorReload = false;
        			this.ref.detectChanges();
        		}, 50);
        	}
        
        	public getGalleryCurrentForPalette() {
        		const apiCurrentFor = {};
        		this.getGalleryModelFields().forEach((field) => {
        			const label = field.label || field.name;
        			// one palette object per field: a bare drop renders the value, and the
        			// dotted style gives X.displayName (column name) / X.displayValue (value)
        			apiCurrentFor[label] = {
        				code: this.getGalleryFieldAccessCode(field.name),
        				icon: "document-text-outline",
        				action: false
        			};
        		});
        		// keep a stable reference between change detection cycles, otherwise the
        		// keyvalue pipe re-creates every palette tile and ion-icon never renders
        		const signature = JSON.stringify(apiCurrentFor);
        		if (this.local.galleryPaletteSignature == signature && this.local.galleryPaletteCache != null) {
        			return this.local.galleryPaletteCache;
        		}
        		this.local.galleryPaletteSignature = signature;
        		this.local.galleryPaletteCache = apiCurrentFor;
        		return apiCurrentFor;
        	}
        	/*End_c8o_CompFunction*/
