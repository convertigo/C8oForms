        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		this.local.galleryPaletteSignature = "";
        		this.local.galleryPaletteCache = null;
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	public isGalleryQuestionTab() {
        		return this.tabselected == "tab_selector_grid_question";
        	}
        	
        	public isGalleryOrgTab() {
        		return this.tabselected == "tab_selector_grid_org";
        	}
        	
        	public ensureGalleryConfig() {
        		if (this.item == null) {
        			return {};
        		}
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		return this.item.config;
        	}
        
        	public getEnabledGallerySource() {
        		try {
        			const sources = this.item?.sources;
        			if (sources == null) {
        				return null;
        			}
        			if (this.pageOwner?.getEnabled != null) {
        				const enabled = this.pageOwner.getEnabled(sources);
        				return enabled != null ? sources[enabled] : null;
        			}
        			for (let name in sources) {
        				if (sources[name]?.enabled == true) {
        					return sources[name];
        				}
        			}
        		}
        		catch (e) {
        		}
        		return null;
        	}
        
        	public parseGallerySourceConfig() {
        		try {
        			const source = this.getEnabledGallerySource();
        			const vars = source?.vars;
        			if (vars == null) {
        				return null;
        			}
        			let raw = vars.forms_config != null ? vars.forms_config : vars.formsConfig;
        			if (raw != null && raw.str != undefined) {
        				raw = raw.str;
        			}
        			if (typeof raw == "string" && raw.trim() != "") {
        				return JSON.parse(raw);
        			}
        			if (raw != null && typeof raw == "object") {
        				return raw;
        			}
        		}
        		catch (e) {
        		}
        		return null;
        	}
        
        	public addGalleryField(fields, seen, name, label?) {
        		if (name == null || ("" + name).trim() == "") {
        			return;
        		}
        		const key = "" + name;
        		if (seen[key] == true) {
        			return;
        		}
        		seen[key] = true;
        		fields.push({ name: key, label: label != null && ("" + label).trim() != "" ? "" + label : key });
        	}
        
        	public getGalleryModelFields() {
        		const fields = [];
        		const seen = {};
        		const sourceConfig = this.parseGallerySourceConfig();
        		if (sourceConfig != null) {
        			if (Array.isArray(sourceConfig.columns)) {
        				sourceConfig.columns.forEach((column) => this.addGalleryField(fields, seen, column));
        			}
        			if (Array.isArray(sourceConfig.hidden)) {
        				sourceConfig.hidden.forEach((column) => this.addGalleryField(fields, seen, column));
        			}
        			this.addGalleryField(fields, seen, sourceConfig.displayValue);
        			this.addGalleryField(fields, seen, sourceConfig.value);
        		}
        		if (fields.length == 0 && Array.isArray(this.item?.config?.columns)) {
        			this.item.config.columns.forEach((column) => {
        				const name = column?.name || column?.field || column?.headerName;
        				this.addGalleryField(fields, seen, name);
        			});
        		}
        		return fields;
        	}
        
        	public escapeGalleryString(value) {
        		return ("" + (value == null ? "" : value)).replace(/\\/g, "\\\\").replace(/''/g, "\\''");
        	}
        
        	public getGalleryFieldAccessCode(fieldName) {
        		return "api.currentFor.element[''" + this.escapeGalleryString(fieldName) + "'']";
        	}
        
        	public getGalleryStringLiteral(value) {
        		return "''" + this.escapeGalleryString(value) + "''";
        	}
        
        	public getGalleryBadgeToken(label, code) {
        		try {
        			const badge = this.pageOwner.getBadge(1, label, { c8opath: code }, true, "html");
        			return this.pageOwner.transformHtmlto$(badge, true);
        		}
        		catch (e) {
        			return "";
        		}
        	}
        
        	public getDefaultGalleryTemplate() {
        		const fields = this.getGalleryModelFields();
        		if (fields.length == 0) {
        			return "";
        		}
        		const title = this.getGalleryBadgeToken(fields[0].label, this.getGalleryFieldAccessCode(fields[0].name));
        		let template = "<div class=\"c8o-gallery-card-title\">" + title + "</div>";
        		if (fields.length > 1) {
        			template += "<div class=\"c8o-gallery-card-fields\">";
        			fields.slice(1, 4).forEach((field) => {
        				const column = this.getGalleryBadgeToken(field.label, this.getGalleryStringLiteral(field.name));
        				const value = this.getGalleryBadgeToken(field.label, this.getGalleryFieldAccessCode(field.name));
        				template += "<div class=\"c8o-gallery-field\"><span class=\"c8o-gallery-field-label\">" + column + "</span><span class=\"c8o-gallery-field-value\">" + value + "</span></div>";
        			});
        			template += "</div>";
        		}
        		return template;
        	}
        
        	public getGalleryTemplateObject() {
        		const config = this.ensureGalleryConfig();
        		if (config.galleryTemplate == null || config.galleryTemplate == "") {
        			config.galleryTemplate = {
        				str: this.getDefaultGalleryTemplate(),
        				html: true,
        				type: "html"
        			};
        		}
        		else if (typeof config.galleryTemplate == "string") {
        			config.galleryTemplate = {
        				str: config.galleryTemplate,
        				html: true,
        				type: "html"
        			};
        		}
        		else if (typeof config.galleryTemplate == "object") {
        			if (config.galleryTemplate.str == null) {
        				config.galleryTemplate.str = "";
        			}
        			config.galleryTemplate.html = true;
        			config.galleryTemplate.type = "html";
        		}
        		return config.galleryTemplate;
        	}
        
        	public saveGalleryTemplate(props) {
        		const config = this.ensureGalleryConfig();
        		const current = this.getGalleryTemplateObject();
        		config.galleryTemplate = { ...current, ...props, html: true, type: "html" };
        	}
        
        	public getGalleryCurrentForPalette() {
        		const apiCurrentFor = {
        			currentIndex: { code: "api.currentFor.index", icon: "information-outline", action: false },
        			currentElement: { code: "api.currentFor.element", iconPath: "assets/images/svg/component/currentFor.svg", action: false }
        		};
        		this.getGalleryModelFields().forEach((field) => {
        			const label = field.label || field.name;
        			const columnLabel = label + " - " + this.translate.instant("gallery_column_name");
        			apiCurrentFor[label] = {
        				code: this.getGalleryFieldAccessCode(field.name),
        				icon: "document-text-outline",
        				action: false
        			};
        			apiCurrentFor[columnLabel] = {
        				code: this.getGalleryStringLiteral(field.name),
        				icon: "text-outline",
        				action: false
        			};
        		});
        		// keep a stable reference between change detection cycles, otherwise the
        		// keyvalue pipe re-creates every palette tile and ion-icon never renders
        		const signature = JSON.stringify(apiCurrentFor);
        		if (this.local.galleryPaletteSignature == signature && this.local.galleryPaletteCache != null) {
        			return this.local.galleryPaletteCache;
        		}
        		this.local.galleryPaletteSignature = signature;
        		this.local.galleryPaletteCache = apiCurrentFor;
        		return apiCurrentFor;
        	}
        	/*End_c8o_CompFunction*/
        '
