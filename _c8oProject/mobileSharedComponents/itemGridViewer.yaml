                                      const link = document.createElement(''a'');
                                      link.href = url;
                                      link.target = ''_self'';
                                      link.rel = ''noopener'';
                                      link.download = vars.file_name || '''';
                                      document.body.appendChild(link);
                                      link.click();
                                      document.body.removeChild(link);
                                      if (component != null) { component.xlsxExporting = false; }
                                      resolve(null);
                                  }
                                  catch (error) {
                                      if (component != null) { component.xlsxExporting = false; }
