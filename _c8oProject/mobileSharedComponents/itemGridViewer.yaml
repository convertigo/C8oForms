                  '		let callSources = false;
                  		if(page.pageOwner != null && page.pageOwner.getPathById != undefined){
                  			if(page.item != null && page.item.config.returned_value === "cell_selected"){
                  				//keep a reference on a row
                  				if(page.pageOwner.local.techGrid == undefined){
                  					page.pageOwner.local.techGrid = {};
                  				}
                  				if(page.pageOwner.local?.techGrid?.[page.item.name] == event.node && page.outModel.value == event?.value && page.outModel.parentNodeId == event?.node?.data?.id?.value){
                  					//deselect
                  					page.pageOwner.local.techGrid[page.item.name] = undefined;
                  					page.outModel.value = {};
                  					page.outModel.parentNodeId = null;
                  					page.myGrid.elementRef.nativeElement.querySelectorAll(''.ag-row-selected'').forEach(child => child.classList.remove(''ag-row-selected''));
                  					event.node.setSelected(false);
                  				}
                  				else{
                  					//select
                  					page.pageOwner.local.techGrid[page.item.name] = event.node;
                  					page.outModel.value = event.value;
                  					page.outModel.parentNodeId = event?.node?.data?.id?.value;
                  					page.myGrid.elementRef.nativeElement.querySelectorAll(''.ag-row-selected'').forEach(child => child.classList.remove(''ag-row-selected''));
                  					event.event.srcElement.closest(''[role="gridcell"]'').classList.add(''ag-row-selected'');
                  				}
                  				callSources = true;
                  				
                  			}
                  			
                  		}
                  		resolve({canCall: callSources}); 		
                  '
