        	public updateGridValues(){
        		let founded = false;
        		let item = this.item;
        		let page = this.pageOwner;
        		if(document.getElementById(this.item.id).getElementsByClassName("justTocheckExistingLoading").length == 0 && page.local.updating[item.id] == 1){
        			// if grids is''nt showing overlay
        			if(page.local.techGrid?.[item.name] != undefined
        				&& this.outModel?.value != undefined
        				&& (
        					typeof this.outModel.value != "object" 
        					|| (
        						Object.keys(this.outModel.value) != undefined
        						&& Object.keys(this.outModel.value).length > 0
        						)
        					)
        				&& this.model != undefined
        			){
        				// if grid''s value returns row_selected or cell_selected
        				if(item.config.returned_value === "row_selected" || item.config.returned_value === "cell_selected"){
        					//itterate over grid to retrive selected row 
        					this.myGrid.agGrid.api.forEachNode((node, rowIndex)=>{
        						// if based on __rowValue
        						if(node.data != undefined && JSON.stringify(node.data) ==  JSON.stringify(page.local.techGrid[item.name].data)){
        						//if(node.data.id.value == this.outModel.value.id ){
        							//ensure that node is visible
        							this.myGrid.agGrid.api.ensureNodeVisible(node);
        							// if returned value is row (so selectable item is the row)
        							if(item.config.returned_value === "row_selected"){
        								//select the node
        								node.setSelected(true, true);
        								// set that we founded element so we won''t remove element from responses
        								founded = true;
        							}
        							// if returned value is cell (so selectable item is the cell)
        							else if(item.config.returned_value === "cell_selected"){
        								//we founded the node, now searching for cell
        								for(let i in node.data){
        									// since __rowValue is not visible, and so is not available to select in case of cell_selected settings ignore it
        									if(i != "__rowValue"){
        										let currentCell = node.data[i];
        										//since there are diffrents type of cell we will search according to its formating
        										// in case of simple string cell 
        										if(typeof currentCell == "string"){
        											if(currentCell == this.outModel?.value?.value){
        												// founded value
        												/**
        													When data has been reloaded into grid, columns ids thakes a wrong value.
        													we are obliged to empty colDefs and set them again
        													see: https://github.com/ag-grid/ag-grid/issues/2889
        												 */
        												this.myGrid.agGrid.api.setColumnDefs([]);
        												this.myGrid.agGrid.api.setColumnDefs(this.checkColumnDefs(this.model["colDef"]));
        												// set focused cell
        												this.myGrid.agGrid.api.setFocusedCell(rowIndex, i);
        												// mark as selected
        												this.myGrid.elementRef.nativeElement.querySelector(`[row-id="${node.id}"]`).querySelector(`[col-id="${currentCell}"]`).classList.add(''ag-row-selected'');
        																								
        												// set that we founded element so we won''t remove element from responses
        												founded = true;
        												break;
        											}
        										}
        										// in case of object cell
        										else if(typeof currentCell == "object"){
        											// if value field exists its value is choosen 
        											if(currentCell.value != undefined && currentCell.value == this.outModel?.value?.value && this.outModel?.value.technicalName == currentCell.technicalName){
        												// founded value
        												/**
        													When data has been reloaded into grid, columns ids thakes a wrong value.
        													we are obliged to empty colDefs and set them again
        													see: https://github.com/ag-grid/ag-grid/issues/2889
        												 */
        												this.myGrid.agGrid.api.setColumnDefs([]);
        												
        												this.myGrid.agGrid.api.setColumnDefs(this.checkColumnDefs(this.model["colDef"]));
        												// set focused cell
        												this.myGrid.agGrid.api.setFocusedCell(rowIndex, i);
        												// mark as selected
        												this.myGrid.elementRef.nativeElement.querySelector(`[row-id="${node.id}"]`).querySelector(`[col-id="${currentCell.technicalName}"]`).classList.add(''ag-row-selected'');
        												// set that we founded element so we won''t remove element from responses
        												founded = true;
        												break;
        											}
        											// if not, displayValue is choosen
        											else if(currentCell.value == undefined && currentCell.displayValue == this.outModel?.value?.value){
        												// founded value
        												/**
        													When data has been reloaded into grid, columns ids thakes a wrong value.
        													we are obliged to empty colDefs and set them again
        													see: https://github.com/ag-grid/ag-grid/issues/2889
        												 */
        												this.myGrid.agGrid.api.setColumnDefs([]);
        												this.myGrid.agGrid.api.setColumnDefs(this.checkColumnDefs(this.model["colDef"]));
        												// set focused cell
        												this.myGrid.agGrid.api.setFocusedCell(rowIndex, i);
        												// mark as selected
        												this.myGrid.elementRef.nativeElement.querySelector(`[row-id="${node.id}"]`).querySelector(`[col-id="${currentCell.technicalName}"]`).classList.add(''ag-row-selected'');
        																								
        												// set that we founded element so we won''t remove element from responses
        												founded = true;
        												break;
        											}
        										}
        									}								
        								}
        							}
        						}
        					})
        					if(!founded){
        						this.outModel.value = {};
        						this.pageOwner.local.techGrid[item.name] = {};
        					}
        					return !founded;
        				}
        				// if grid''s value returns multiple_row_selected
        				else if(item.config.returned_value === "multiple_row_selected"){
        					//itterate over grid to retrive selected row 
        					this.myGrid.agGrid.api.forEachNode((node, rowIndex)=>{
        						// if based on __rowValue
        						if(node.data != undefined && page.local.techGrid[item.name].map((x)=> JSON.stringify(x.data)).includes(JSON.stringify(node.data))){
        							//ensure that node is visible
        							this.myGrid.agGrid.api.ensureNodeVisible(node);
        							//select nodes
        							node.setSelected(true, false);
        							// set that we founded element so we won''t remove element from responses
        							founded = true;
        						}
        					})
        					if(!founded){
        						this.outModel.value = {};
        						this.pageOwner.local.techGrid[item.name] = [];
        					}
        					return !founded;
        				}							
        			}
        			return false;
        		}
        		else{
        			return false;
        		}
        			
        	}
        
            public getGridSourceVariableValue(source, name) {
                let raw = source?.[name];
                if (raw == null && source?.vars != null) {
                    raw = source.vars[name];
                }
                if (raw != null && raw.str != undefined) {
                    raw = raw.str;
                }
                if (raw != null && raw.value != undefined) {
                    raw = raw.value;
                }
                if (typeof raw == "string") {
                    return raw.trim();
                }
                if (typeof raw == "number" || typeof raw == "boolean") {
                    return "" + raw;
                }
                return "";
            }
        
            public getGridSource() {
                try {
                    if (this.item?.config?.sourceEnabled === false) {
                        return null;
                    }
                    const sources = this.item?.sources;
                    if (sources == null) {
                        return null;
                    }
                    let source = null;
                    if (this.pageOwner?.getEnabled != null) {
                        const enabled = this.pageOwner.getEnabled(sources);
                        source = enabled != null ? sources[enabled] : null;
                    }
                    if (source == null) {
                        for (let name in sources) {
                            if (this.isGridEnabledSourceEntry(name, sources[name])) {
                                source = sources[name];
                                break;
                            }
                        }
                    }
                    if (source == null) {
                        for (let name in sources) {
                            if (sources[name]?.vars?.forms_config != null || sources[name]?.vars?.formsConfig != null) {
                                source = sources[name];
                                break;
                            }
                        }
                    }
                    if (source == null) {
                        for (let name in sources) {
                            const candidate = sources[name];
                            if (this.getGridSourceVariableValue(candidate, "__project") != "" && this.getGridSourceVariableValue(candidate, "__sequence") != "") {
                                source = candidate;
                                break;
                            }
                        }
                    }
                    return source;
                }
                catch (e) {
                }
                return null;
            }
        
            public getGridSourceConfigFromSource(source) {
                try {
                    let raw = source?.vars?.forms_config != null ? source.vars.forms_config : source?.vars?.formsConfig;
                    if (raw != null && raw.str != undefined) {
                        raw = raw.str;
                    }
                    if (typeof raw == "string" && raw.trim() != "") {
                        return JSON.parse(raw);
                    }
                    if (raw != null && typeof raw == "object") {
                        return raw;
                    }
                }
                catch (e) {
                }
                return null;
            }
        
            public getGridSourceConfig() {
                return this.getGridSourceConfigFromSource(this.getGridSource());
            }
        
            public isGridEnabledSourceEntry(name, source) {
                const enabled = source?.enabled === true || source?.enabled == "true";
                if (!enabled) {
                    return false;
                }
                if (this.getGridSourceConfigFromSource(source) != null) {
                    return true;
                }
                if (this.getGridSourceVariableValue(source, "__project") != "" && this.getGridSourceVariableValue(source, "__sequence") != "") {
                    return true;
                }
                if ((source?.fullsync === true || source?.fullsync == "true") && ("" + (source?.connectorName || "")).trim() != "" && ("" + (source?.viewName || "")).trim() != "") {
                    return true;
                }
                const sourceName = typeof name == "string" ? name.trim() : "";
                return sourceName != "" && sourceName != "self";
            }
        
            public hasGridConfiguredSource() {
                try {
                    if (this.item?.config?.sourceEnabled === false) {
                        return false;
                    }
                    const sources = this.item?.sources;
                    if (sources != null) {
                        for (let name in sources) {
                            if (this.isGridEnabledSourceEntry(name, sources[name])) {
                                return true;
                            }
                        }
                    }
                    const source = this.getGridSource();
                    if (source == null) {
                        return false;
                    }
                    if (this.getGridSourceConfigFromSource(source) != null) {
                        return true;
                    }
                    return this.getGridSourceVariableValue(source, "__project") != "" && this.getGridSourceVariableValue(source, "__sequence") != "";
                }
                catch (e) {
                }
                return false;
            }
        
            public isGridSourcedEditorPreview() {
                return this.disabled == true && this.hasGridConfiguredSource();
            }
        	
        	public getGridColumnField(column) {
        		if (column == null) {
        			return "";
        		}
        		if (typeof column == "string") {
        			return column;
        		}
        		return column.field || column.name || column.headerName || column.technicalName || "";
        	}
        	
        	public getGridColumnHeader(column) {
        		if (column == null) {
        			return "";
        		}
        		if (typeof column == "string") {
        			return column;
        		}
        		return column.headerName || column.label || column.displayName || column.name || column.field || column.technicalName || "";
        	}
        
            public isGridDefaultSampleColumn(column) {
                const field = ("" + this.getGridColumnField(column)).toLowerCase();
                const header = "" + this.getGridColumnHeader(column);
                return (field == "make" && header == "Make") || (field == "model" && header == "Model") || (field == "price" && header == "Price");
            }
        
            public hasRuntimeGridSourceColumns(colDef) {
                const columns = Array.isArray(colDef) ? colDef : [];
                if (columns.length == 0 || this.item?.config?.sourceEnabled === false) {
                    return false;
                }
                const configuredColumns = Array.isArray(this.item?.config?.columns) ? this.item.config.columns : [];
                if (configuredColumns.length == 0) {
                    return false;
                }
                const configuredKeys = configuredColumns.map((column) => ("" + this.getGridColumnField(column)).trim().toLowerCase()).filter((key) => key != "");
                if (configuredKeys.length == 0) {
                    return false;
                }
                return columns.some((column) => {
                    const key = ("" + this.getGridColumnField(column)).trim().toLowerCase();
                    return key != "" && configuredKeys.indexOf(key) == -1;
                });
            }
        	
        	public pushGridColumnDef(columns, seen, column, hiddenColumns) {
        		const field = this.getGridColumnField(column);
        		if (field == null || ("" + field).trim() == "") {
        			return;
        		}
        		const key = "" + field;
        		if (seen[key] == true) {
        			return;
        		}
        		seen[key] = true;
        		const headerName = this.getGridColumnHeader(column) || key;
        		const columnDef: any = { field: key, headerName: headerName };
        		if (Array.isArray(hiddenColumns) && hiddenColumns.indexOf(key) != -1) {
        			columnDef["hide"] = true;
        		}
        		columns.push(columnDef);
        	}
        
            public getGridConfiguredColumnDefs(includeDefault) {
                const columns = [];
                const seen = {};
                const sourceConfig = this.getGridSourceConfig();
                const hasConfiguredSource = this.hasGridConfiguredSource();
                const hiddenColumns = Array.isArray(sourceConfig?.hidden) ? sourceConfig.hidden.map((column) => "" + column) : [];
                if (Array.isArray(sourceConfig?.columns)) {
                    sourceConfig.columns.forEach((column) => this.pushGridColumnDef(columns, seen, column, hiddenColumns));
                }
                if (!hasConfiguredSource && columns.length == 0 && Array.isArray(this.item?.config?.columns)) {
                    this.item.config.columns.forEach((column) => this.pushGridColumnDef(columns, seen, column, []));
                }
                if (!hasConfiguredSource && columns.length == 0 && includeDefault === true) {
                    this.pushGridColumnDef(columns, seen, { field: "make", headerName: "Make" }, []);
                    this.pushGridColumnDef(columns, seen, { field: "model", headerName: "Model" }, []);
                    this.pushGridColumnDef(columns, seen, { field: "price", headerName: "Price" }, []);
                }
                return columns;
            }
        
            public checkColumnDefs(colDef) {
                let columns = Array.isArray(colDef) ? colDef : [];
                const hasRuntimeSourceColumns = this.hasRuntimeGridSourceColumns(columns);
                const hasConfiguredSource = this.hasGridConfiguredSource() || hasRuntimeSourceColumns;
                const configuredColumns = hasRuntimeSourceColumns ? [] : this.getGridConfiguredColumnDefs(false);
                if (hasConfiguredSource && columns.length > 0) {
                    columns = columns.filter((column) => !this.isGridDefaultSampleColumn(column));
                }
                if (columns.length == 0 && configuredColumns.length > 0) {
                    columns = configuredColumns;
                }
                else if (columns.length > 0 && configuredColumns.length > 0) {
                    const consumedColumnIndexes = new Set<number>();
                    const orderedColumns = [];
                    const matchesConfiguredField = (column, configuredColumn) => {
                        return column?.field == configuredColumn.field || column?.headerName == configuredColumn.headerName || column?.headerName == configuredColumn.field || column?.technicalName == configuredColumn.field;
                    };
                    configuredColumns.forEach((configuredColumn) => {
                        const columnIndex = columns.findIndex((column, index) => !consumedColumnIndexes.has(index) && matchesConfiguredField(column, configuredColumn));
                        if (columnIndex != -1) {
                            const orderedColumn = Object.assign({}, columns[columnIndex]);
                            orderedColumn.headerName = configuredColumn.headerName;
                            if (orderedColumn.field == null || orderedColumn.field == "") {
                                orderedColumn.field = configuredColumn.field;
                            }
                            if (configuredColumn.hide === true) {
                                orderedColumn.hide = true;
                            }
                            orderedColumns.push(orderedColumn);
                            consumedColumnIndexes.add(columnIndex);
                        }
                        else {
                            orderedColumns.push(configuredColumn);
                        }
                    });
                    if (!hasConfiguredSource) {
                        columns.forEach((column, index) => {
                            if (!consumedColumnIndexes.has(index)) {
                                orderedColumns.push(column);
                            }
                        });
                    }
                    columns = orderedColumns;
                }
        
                const normalizedColumns = columns.map((column) => {
                    const nextColumn = Object.assign({}, column);
                    return nextColumn;
                });
                const signature = JSON.stringify(normalizedColumns);
                if (this.local?.colDefSignature != signature) {
                    this.local.colDef = normalizedColumns;
                    this.local.colDefSignature = signature;
                }
                return (Array.isArray(this.local?.colDef) ? this.local.colDef : columns);
            }
        	
        	public getGridPreviewColumns() {
        		let columns = this.checkColumnDefs(this.model?.colDef != undefined ? this.model.colDef : []);
        		if (columns.length == 0) {
        			columns = this.getGridConfiguredColumnDefs(true);
        		}
        		const signature = JSON.stringify(columns);
        		if (this.local != null && this.local.gridPreviewColumnsSignature != signature) {
        			this.local.gridPreviewColumnsSignature = signature;
        			this.local.gridPreviewColumns = columns.map((column) => Object.assign({}, column));
        		}
        		return this.local?.gridPreviewColumns || columns;
        	}
        	
        	public getGridColumns() {
        		return this.disabled == true ? this.getGridPreviewColumns() : this.checkColumnDefs(this.model?.colDef != undefined ? this.model.colDef : []);
        	}
        
            public getGridNoRowsOverlayTemplate() {
                if (this.isGridSourcedEditorPreview()) {
                    const sourceLabel = this.translate.instant("from_data_source");
                    const previewLabel = this.translate.instant("editView");
                    return ''<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-align:center; padding:12px;"><div>'' + sourceLabel + ''<br/><span style="font-size:12px; opacity:0.75;">'' + previewLabel + ''</span></div></div>'';
                }
                return this.global.overlayNoRowsTemplate2;
            }
        	
        	public getGridPreviewRows() {
                if (this.isGridSourcedEditorPreview()) {
                    const signature = "sourced-editor-preview";
                    if (this.local != null && this.local.gridPreviewRowsSignature != signature) {
                        this.local.gridPreviewRowsSignature = signature;
                        this.local.gridPreviewRows = [];
                    }
                    return [];
                }
        		const columns = this.getGridPreviewColumns().filter((column) => column?.hide !== true);
        		const signature = JSON.stringify(columns);
        		if (this.local != null && this.local.gridPreviewRowsSignature == signature && Array.isArray(this.local.gridPreviewRows)) {
        			return this.local.gridPreviewRows;
        		}
        		const rows = [];
        		for (let index = 0; index < 3; index++) {
        			const row = {};
        			columns.forEach((column) => {
        				const key = column.field || column.headerName;
        				if (key != null && key != "") {
        					row[key] = (column.headerName || key) + " " + (index + 1);
        				}
        			});
        			rows.push(row);
        		}
        		if (this.local != null) {
        			this.local.gridPreviewRowsSignature = signature;
        			this.local.gridPreviewRows = rows;
        		}
        		return rows;
        	}
            public isGridPaginationEnabled() {
                if (this.isGridSourcedEditorPreview()) {
                    return false;
                }
                return this.item?.config?.gridPaginationEnabled !== false;
            }
            public isGridFooterEnabled() {
                return this.item?.config?.gridFooterEnabled !== false;
            }
            public getGridRowsPerPage() {
                const rowsPerPage = Number(this.item?.config?.gridRowsPerPage);
                return Number.isFinite(rowsPerPage) && rowsPerPage > 0 ? Math.floor(rowsPerPage) : 10;
            }
            public getGridPaginationPageSizeSelector() {
                if (!this.isGridPaginationEnabled() || !this.isGridFooterEnabled()) {
                    return false;
                }
                const rowsPerPage = this.getGridRowsPerPage();
                const selector = [10, 20, 50, 100];
                if (selector.indexOf(rowsPerPage) == -1) {
                    selector.push(rowsPerPage);
                    selector.sort((a, b) => a - b);
                }
                const selectorKey = selector.join("|");
                if (this.local != null && this.local.gridPaginationPageSizeSelectorKey != selectorKey) {
                    this.local.gridPaginationPageSizeSelectorKey = selectorKey;
                    this.local.gridPaginationPageSizeSelector = selector;
                }
                return this.local?.gridPaginationPageSizeSelector || selector;
            }
            public getGridWrapperClass() {
                return this.isGridFooterEnabled() ? ''blue-theme'' : ''blue-theme gridFooterHidden'';
            }
