                    ↓DoDownload [ngx.components.UICustomAction-1789653751728]: 
                      actionValue: 
                        - xmlizable: 
                          - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
                          - com.twinsoft.convertigo.beans.common.FormatedContent: 
                            →: |
                              '		
                              		page.c8o.log.debug(''[MB] ''+ props.actionFunction +'': ''+ props.actionName);
                              		if (vars.agGrid && vars.agGrid != '''') {
                              			page.csvExporting = true;
                              
                              			try {
                              				const now = new Date();
                              
                              				const stamp = [
                              					now.getFullYear(),
                              					String(now.getMonth() + 1).padStart(2, "0"),
                              					String(now.getDate()).padStart(2, "0"),
                              					"_",
                              					String(now.getHours()).padStart(2, "0"),
                              					String(now.getMinutes()).padStart(2, "0"),
                              					String(now.getSeconds()).padStart(2, "0")
                              				].join("");
                              
                              				const safePrefix =
                              					String(page.item?.id || "grid")
                              						.normalize("NFD")
                              						.replace(/[\u0300-\u036f]/g, "")
                              						.replace(/[^A-Za-z0-9_-]+/g, "_")
                              						.replace(/^_+|_+$/g, "")
                              						.slice(0, 64) || "grid";
                              
                              				const unique = Math.random()
                              					.toString(36)
                              					.slice(2, 8);
                              					
                              				vars.agGrid.api.exportDataAsCsv({
                              					fileName: (
                              						safePrefix +
                              						"_" +
                              						stamp +
                              						"_" +
                              						unique +	
                              						".csv"
                              					),
                              					processCellCallback: (params) => {
                              //						console.log(params)
                              						if (
                              							params.column.getColDef().cellDataType === "object" &&
                              							params.value
                              						) {
                              							return (params?.value?.type == ''html'') ? (
                              								params.value.value?.value ??
                              								params.value.value?.[0]?.value ??
                              								params.value.value ??
                              								""
                              							) : (
                              								params.value.displayValue ??
                              								params.value.value?.value ??
                              								params.value.value?.[0]?.value ??
                              								params.value.value ??
                              								""
                              							);
                              						}
                              
                              						return params.value ?? "";
                              					}
                              				});
                              			}
                              			finally {
                              				page.csvExporting = false;
                              			}
                              		}
                              		resolve(null);		
                              '
