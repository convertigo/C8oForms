                  			if(page.pageOwner != null && page.pageOwner.getPathById != undefined){
                  				if(page.item.config.returned_value === "row_selected" && event.node.selected){
                  					if(page.pageOwner.local?.techGrid?.[page.item.name] == event.node){
                  						// set values to empty
                  						page.outModel.value = {};
                  						page.pageOwner.local.techGrid[page.item.name] = undefined;
                  						event.node.setSelected(false);
                  						callSources = true;
                  					}
                  				}
                  				else if(page.item.config.returned_value === "multiple_row_selected" && event.node.selected){
                  					if(page.pageOwner.local.techGrid[page.item.name]?.find((x)=>{ return x == event.node})){
                  						event.node.setSelected(false);
                  						page.pageOwner.local.techGrid[page.item.name] = page.myGrid.agGrid.api.getSelectedNodes();
                  						let grossData = page.pageOwner.local.techGrid[page.item.name].map((x)=> x.data);
                  						let data = [];
                  						for(var j = 0; j < grossData.length; j++){
                  							data[j] = {};
                  							if(grossData[j].__rowValue != undefined){
                  								data[j] =  grossData.__rowValue
                  							}
                  							else{
                  								for(let i in grossData[j]){
                  									if(typeof(grossData[j][i]) !== "string"){
                  										data[j][grossData[j][i].technicalName] = grossData[j][i].value;
                  									}
                  									else{
                  										data[j][i] = grossData[j][i];
                  									}
                  								}
                  							}
                  						}
                  						page.outModel.value = data;
                  						callSources = true;
                  					}
                  				}
                  			}
                  		} catch (e) {
                  		
                  		}
                  		return {canCall : callSources};
                  '
