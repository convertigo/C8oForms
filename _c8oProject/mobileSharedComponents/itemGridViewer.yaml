        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public xlsxExporting: boolean = false;
        	public csvExporting: boolean = false;
        	public odtExporting: boolean = false;
        	public odsExporting: boolean = false;
        	public exportMenuId: string = "ag-grid-export-" + Math.random().toString(36).slice(2, 10);
        	// #grid-stability: an AG Grid input must keep a STABLE reference.
        	// This was an object literal in the template, so a new defaultColDef was allocated on
        	// EVERY change-detection pass: the grid''s ngOnChanges fired on every pass, its onChanges
        	// handler ends with markForCheck, which schedules the next pass -- a loop at frame rate
        	// that also re-ran the column sizing (hence the repeated AG Grid resetRowHeights warning).
        	private agGridDefaultColDef: any = {autoHeight: true, hide: false, editable: true, sortable: true, resizable: true, filter: true, checkboxSelection: false, singleClickEdit: false};
