              <!-- Template pour les groupes -->
              <ng-container *ngIf="item.type == ''group''; else elseBlock1212">
                  <ion-item style="padding:0 !important" lines="none">
                      <ion-avatar slot="start" style="">
                          <img [src]="item.picture" />
                      </ion-avatar>
                      <ion-label style="margin-top: 0; margin-bottom:0;">
                          <p>{{ item.display}}</p>
                      </ion-label>
                  </ion-item>
              </ng-container>
      
              <!-- Template pour les utilisateurs -->
              <ng-template #elseBlock1212>
                  <ng-container *ngIf="item.type == ''user''; else elseBlock1213">
                      <ion-item style="padding:0 !important" lines="none">
                          <ion-avatar slot="start" style="min-height: 40px; min-width: 40px;">
                              <img [src]="item.picture" />
                          </ion-avatar>
                          <ion-label style="margin-top: 0; margin-bottom:0;text-overflow: ellipsis;white-space: nowrap;">
                              <h2>{{ item.displayName != undefined ? item.displayName + " " : ""}}</h2>
                              <p style="text-overflow: ellipsis;white-space: nowrap;">{{item.displayMail}}</p>
                          </ion-label>
                      </ion-item>
                  </ng-container>
      
                  <!-- Template par défaut -->
                  <ng-template #elseBlock1213>
                      <span>
                          <ion-icon name="person-add"></ion-icon>  {{ item.value}}
                      </span>
                  </ng-template>
              </ng-template>
          </ng-template>'
