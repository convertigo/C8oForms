↓global [ngx.components.UIStyle-1761824846251]: 
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.card-container--app {
          	width: 100%;
          //	height: 86px;
          	
          	border-radius: 16px !important;
          	border: 2px solid rgba(226, 232, 240, 0.50);
          	background: #FFF;
          	box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.03);
          }
          
          .card-container--folder {
          	width: 100%;
          //	height: 86px;
          	
          	border-radius: 16px !important;
          	border: 2px solid rgba(226, 232, 240, 0.50);
          	background: #FFF;
          //	background: linear-gradient(135deg, rgba(255, 251, 235, 0.50) 0%, rgba(255, 247, 237, 0.50) 100%);
          	box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.03);
          }
          
          
          .c-anim-folder,
          .c-anim-app {
            position: absolute;
            bottom: 0;
            left: 8px;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            width: calc(100% - 16px);
            z-index: 3;
            height: 4px;
            transform-origin: left;
            transform: scaleX(0);
          }
          
          .c-anim-folder {
            background: linear-gradient(90deg, #FF6900 0%, #FE9A00 100%);
          }
          
          .c-anim-app {
            background: linear-gradient(
              90deg,
              #14B6E0 0%,
              var(--ion-color-primary) 50%,
              #33D5FF 100%
            );
          }
          
          .is-active {
            animation: scaleGrow 0.8s ease-out forwards;
          }'