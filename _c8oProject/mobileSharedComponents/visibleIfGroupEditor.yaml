        	public getConditionFactoryOwner(): any{
        		let owner: any = this;
        		let guard = 0;
        		while(owner != null && guard < 20){
        			if(owner.createEmptyGoToPageCondition != undefined){
        				return owner;
        			}
        			let nextOwner = owner.owner != null ? owner.owner : owner.pageOwner;
        			if(nextOwner == owner){
        				break;
        			}
        			owner = nextOwner;
        			guard++;
        		}
        		return null;
        	}
        
        	public createGoToPageNestedConditionTemplate(): any{
        		let owner: any = this.getConditionFactoryOwner();
        		let condition: any = null;
        		if(owner != null && owner.createEmptyGoToPageNestedCondition != undefined){
        			condition = owner.createEmptyGoToPageNestedCondition(this.item);
        		}
        		else if(owner != null && owner.createEmptyGoToPageCondition != undefined){
        			condition = owner.createEmptyGoToPageCondition(this.item);
        			delete condition.verb;
        			delete condition.page;
        		}
        		if(condition == null){
        			condition = {
        				type: "goToPageIf",
        				subject: "field",
        				val1: {
        					name: this.item != null && this.item.name != null ? this.item.name : "",
        					displayName: this.item != null && this.item.name != null ? this.item.name : "",
        					str: this.item != null && this.item.id != null ? this.item.id : "",
        					source: true,
        					type: this.item != null && this.item.type != null ? this.item.type : "",
        					arr: []
        				},
        				val2: {str: "", source: false, type: "text", arr: [], html: false},
        				operator: ""
        			};
        		}
        		return condition;
        	}
        
        	public createGoToPageNestedGroupTemplate(): any{
        		return {
        			type: "goToPageIf",
        			condVisible: "and",
        			conds: [this.createGoToPageNestedConditionTemplate()],
        			groups: []
        		};
        	}
        
        	public createVisibleIfConditionTemplate(): any{
        		return {
        			type: "visibleIf",
        			subject: "field",
        			val1: {
        				name: "",
        				displayName: "",
        				str: "",
        				source: true,
        				type: "",
        				arr: []
        			},
        			val2: {
        				str: "",
        				source: false,
        				type: "text",
        				arr: [],
        				html: false
        			},
        			operator: ""
        		};
        	}
        
        	public createVisibleIfGroupTemplate(): any{
        		return {
        			type: "visibleIf",
        			condVisible: "and",
        			conds: [this.createVisibleIfConditionTemplate()],
        			groups: []
        		};
        	}
        
        	public hasUsefulGroupContent(group: any): boolean{
        		if(group == null || typeof(group) != "object"){
        			return false;
        		}
        		let conds: Array<any> = Array.isArray(group.conds) ? group.conds : [];
        		let legacyConds: Array<any> = Array.isArray(group.__legacyConds) ? group.__legacyConds : [];
        		let groups: Array<any> = Array.isArray(group.groups) ? group.groups : [];
        		let hasNavigationAction: boolean = this.conditionKind == "goToPageIf" && ((group.verb != null && group.verb != "") || (group.page != null && group.page != ""));
        		return conds.length > 0 || legacyConds.length > 0 || groups.length > 0 || hasNavigationAction;
        	}
        
        	public pruneEmptyFilterGroups(group: any): void{
        		if(group == null || typeof(group) != "object"){
        			return;
        		}
        		if(!Array.isArray(group.conds)){
        			group.conds = [];
        		}
        		if(!Array.isArray(group.groups)){
        			group.groups = [];
        		}
        		for(let i = group.groups.length - 1; i >= 0; i--){
        			this.pruneEmptyFilterGroups(group.groups[i]);
        			if(!this.hasUsefulGroupContent(group.groups[i])){
        				group.groups.splice(i, 1);
        			}
        		}
        	}
        
        	public saveGroupAfterPrune(): void{
        		this.pruneEmptyFilterGroups(this.group);
        		if(this.parentGroup != null && Array.isArray(this.parentGroup.groups) && this.groupIndex > -1 && !this.hasUsefulGroupContent(this.group)){
        			this.parentGroup.groups.splice(this.groupIndex, 1);
        			this.save.emit(this.parentGroup);
        			return;
        		}
        		this.save.emit(this.group);
        	}
        
        	public ETS1776024617815(stack: any, item1776024604121?: any, childGroup?: any, childIndex?: any): Promise<any>{
        		try{
        			this.saveGroupAfterPrune();
        		}
        		catch(e){
        			console.error(e);
        		}
        		return Promise.resolve(true);
        	}
