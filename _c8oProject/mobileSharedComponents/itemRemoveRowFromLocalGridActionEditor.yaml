        	public removeActionOptions() {
        		return [{id: ''all_the_data''}, {id: ''row_selected''}];
        	}
        
        	public removeActionLabel(value: string) {
        		return this.translate.instant(value);
        	}
        
        	public getActionValue(event: any) {
        		let value = event;
        		if (value != null && typeof value === ''object'' && value.out !== undefined) {
        			value = value.out;
        		}
        		if (value != null && typeof value === ''object'' && value.item !== undefined) {
        			return value.item;
        		}
        		return value;
        	}
        
        	public updateActionState() {
        		let owner = this.pageOwner != undefined ? this.pageOwner : this.owner;
        		if (owner != undefined && owner["updateState"] != undefined) {
        			owner["updateState"]();
        		}
        		this.itemChange.emit(this.item);
        		this.ref.markForCheck();
        	}
        
        	public setRemoveAction(event: any) {
        		if (this.item.config == null) {
        			this.item.config = {};
        		}
        		this.item.config.action = this.getActionValue(event);
        		this.updateActionState();
        	}
        	/*End_c8o_CompFunction*/'
