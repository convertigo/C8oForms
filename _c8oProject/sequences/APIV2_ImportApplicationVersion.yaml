accessibility: Hidden
authenticatedContextRequired: true
comment: |
  Import a file as an application version (#1359).
  Stores an exported .c8oforms file as an import version of an existing draft application, to be restored like any other version.
↓importVersion [steps.SimpleStep-1790180000018]: 
  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    include("js/form_import.js");
    include("js/application_history.js");
    
    var authenticatedUserID = context.getAuthenticatedUser();
    var res = {};
    var draft = getDoc("" + id, null, "c8oforms_fs");
    if (!c8oHistory.isDraft(draft)) {
    	res.error = "not_found";
    }
    else if (!canEditFormDocument(draft, authenticatedUserID)) {
    	res.error = "unauthorized";
    }
    else {
    	try {
    		var file = null;
    		try {
    			file = JSON.parse("" + meta);
    		}
    		catch (e) {
    			file = null;
    		}
    		res = c8oHistory.importFile(draft, file, label, authenticatedUserID);
    	}
    	catch (e) {
    		log.error("application history: unable to import a version into " + id + ": " + e);
    		res = { error: "history_failed" };
    	}
    }'
↓output [steps.JsonToXmlStep-1790180000019]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: res
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: res
↓id [variables.RequestableVariable-1790180000015]: 
  comment: Identifier of the draft application.
↓meta [variables.RequestableVariable-1790180000016]: 
  comment: Content of the exported .c8oforms file (JSON text).
↓label [variables.RequestableVariable-1790180000017]: 
  comment: Optional label of the version, usually the file name.
