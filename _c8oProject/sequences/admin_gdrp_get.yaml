↓readLegacyGdprSymbols [steps.SimpleStep-1786033653583]: 
  expression: |
    'var legacySymbols = {
    	"menu": {"name": "C8Oforms.GDRP-MENU", "exists": false, "value": null, "status": "inactive"},
    	"toast": {"name": "C8Oforms.GDRP-TOAST", "exists": false, "value": null, "status": "inactive"}
    };
    try {
    	function c8oFormsLegacySymbolStatus(symbolName) {
    		var manager = com.twinsoft.convertigo.engine.Engine.theApp.databaseObjectsManager;
    		var names = manager.symbolsGetNames();
    		var exists = names != null && names.contains(symbolName);
    		var value = null;
    		if (exists) {
    			value = manager.symbolsGetValueService(symbolName);
    			if (value == null) {
    				value = "";
    			}
    			value = "" + value;
    		}
    		return {
    			"name": symbolName,
    			"exists": exists === true,
    			"value": exists === true ? value : null,
    			"status": exists === true ? "active" : "inactive"
    		};
    	}
    	legacySymbols.menu = c8oFormsLegacySymbolStatus("C8Oforms.GDRP-MENU");
    	legacySymbols.toast = c8oFormsLegacySymbolStatus("C8Oforms.GDRP-TOAST");
    }
    catch (e) {
    	legacySymbols.menu = {"name": "C8Oforms.GDRP-MENU", "exists": false, "value": null, "status": "error", "message": "" + e};
    	legacySymbols.toast = {"name": "C8Oforms.GDRP-TOAST", "exists": false, "value": null, "status": "error", "message": "" + e};
    }'
