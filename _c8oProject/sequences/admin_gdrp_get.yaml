↓ensureSimplifiedChineseGdprBuckets [steps.SimpleStep-1786013936490]: 
  expression: |
    'try {
    	function c8oFormsIsObject(value) {
    		return value != null && typeof value == "object";
    	}
    	function c8oFormsIsArray(value) {
    		return value != null && typeof value.length == "number" && typeof value.splice == "function";
    	}
    	function c8oFormsEnsureObject(parent, key) {
    		if (!c8oFormsIsObject(parent[key])) {
    			parent[key] = {};
    		}
    		return parent[key];
    	}
    	function c8oFormsBlankSectionFrom(source) {
    		var sourceIcon = c8oFormsIsObject(source) && c8oFormsIsObject(source.icon) ? source.icon : {};
    		return {
    			"title": "",
    			"description": "",
    			"icon": {
    				"color": sourceIcon.color || "var(--ion-color-primary)",
    				"backgroundColor": sourceIcon.backgroundColor || "transparent",
    				"name": sourceIcon.name || "database"
    			}
    		};
    	}
    	function c8oFormsEnsureBlankGdprLocale(data, targetLang) {
    		var toastViewers = c8oFormsEnsureObject(data, "toast_viewers_description");
    		var toastBuilders = c8oFormsEnsureObject(data, "toast_builders_description");
    		var symbols = c8oFormsEnsureObject(data, "symbols");
    		var symbolsMenu = c8oFormsEnsureObject(symbols, "menu");
    		var symbolsToast = c8oFormsEnsureObject(symbols, "toast");
    		var dpoSection = c8oFormsEnsureObject(data, "dpo_section");
    		var sections = c8oFormsEnsureObject(data, "sections");
    		if (toastViewers[targetLang] == null) {
    			toastViewers[targetLang] = "";
    		}
    		if (toastBuilders[targetLang] == null) {
    			toastBuilders[targetLang] = "";
    		}
    		if (symbolsMenu[targetLang] == null) {
    			symbolsMenu[targetLang] = "";
    		}
    		if (symbolsToast[targetLang] == null) {
    			symbolsToast[targetLang] = "";
    		}
    		if (!c8oFormsIsObject(dpoSection[targetLang])) {
    			dpoSection[targetLang] = {"title": "", "description": "", "email": ""};
    		}
    		if (!c8oFormsIsArray(sections[targetLang])) {
    			var sourceSections = c8oFormsIsArray(sections.fr) ? sections.fr : [];
    			sections[targetLang] = [];
    			if (sourceSections.length > 0) {
    				for (var i = 0; i < sourceSections.length; i++) {
    					sections[targetLang].push(c8oFormsBlankSectionFrom(sourceSections[i]));
    				}
    			}
    			else {
    				sections[targetLang].push(c8oFormsBlankSectionFrom(null));
    			}
    		}
    	}
    	var c8oFormsGdprMeta = typeof meta == "string" ? JSON.parse(meta) : meta;
    	if (c8oFormsIsObject(c8oFormsGdprMeta)) {
    		c8oFormsEnsureBlankGdprLocale(c8oFormsGdprMeta, "zh-CN");
    		meta = JSON.stringify(c8oFormsGdprMeta);
    	}
    }
    catch (e) {
    	// Keep the historical GDPR payload when the stored configuration cannot be parsed.
    }'
