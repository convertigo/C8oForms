accessibility: Hidden
authenticatedContextRequired: true
comment: |
  Create an application version (#1359).
  Records the current state of a draft application as a manual version with an optional label.
↓createVersion [steps.SimpleStep-1790180000008]: 
  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    include("js/application_history.js");
    
    var authenticatedUserID = context.getAuthenticatedUser();
    var res = {};
    var draft = getDoc("" + id, null, "c8oforms_fs");
    if (!c8oHistory.isDraft(draft)) {
    	res.error = "not_found";
    }
    else if (!canEditFormDocument(draft, authenticatedUserID)) {
    	res.error = "unauthorized";
    }
    else {
    	try {
    		var entry = c8oHistory.snapshot(draft, "manual", { author: authenticatedUserID, label: label });
    		res.ok = true;
    		res.entry = c8oHistory.summary(entry);
    	}
    	catch (e) {
    		log.error("application history: unable to create a version of " + id + ": " + e);
    		res = { error: "history_failed" };
    	}
    }'
↓output [steps.JsonToXmlStep-1790180000009]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: res
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: res
↓id [variables.RequestableVariable-1790180000006]: 
  comment: Identifier of the draft application.
↓label [variables.RequestableVariable-1790180000007]: 
  comment: Optional label of the version (120 characters at most).
