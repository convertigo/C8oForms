    };
    
    if (responsePageIndex != null) {
        responsePagination.currentPageIndex =
            responsePageIndex;
        responsePagination.currentPageNumber =
            responsePageIndex + 1;
    }
    
    lastResult.pagination = responsePagination;
    
    	return lastResult;
    }
    
    var OUT_FOLDER_TOKEN_PREFIX =
    	"out_folder:v1:";
    
    function createOutFolderPageToken(
    	offset
    ) {
    	return (
    		OUT_FOLDER_TOKEN_PREFIX +
    		offset
    	);
    }
    
    function parseOutFolderPageToken(
    	token
    ) {
    	if (
    		token == null ||
    		token == ""
    	) {
    		return 0;
    	}
    
    	var rawToken =
    		"" + token;
    
    	if (
    		rawToken.indexOf(
    			OUT_FOLDER_TOKEN_PREFIX
    		) != 0
    	) {
    		log.warn(
    			"Invalid out_folder page token: " +
    			rawToken
    		);
    
    		return 0;
    	}
    
    	var offset =
    		parseInt(
    			rawToken.substring(
    				OUT_FOLDER_TOKEN_PREFIX.length
    			),
    			10
    		);
    
    	if (
    		isNaN(offset) ||
    		offset < 0
    	) {
    		return 0;
    	}
    
    	return offset;
    }
    
    function paginateOutFolderResult(
    	result,
    	requestedPageSize,
    	token
    ) {
    	if (result == null) {
    		result = {};
    	}
    
    	var allDocs =
    		Array.isArray(result.docs)
    			? result.docs
    			: [];
    
    	/*
    	 * Important : totalCount correspond à la liste finale,
    	 * après fusion, déduplication et création des dossiers
    	 * virtuels.
    	 */
    	var totalCount =
    		allDocs.length;
    
    	var offset =
    		parseOutFolderPageToken(
    			token
    		);
    
    	/*
    	 * Si le token n''est plus valide après une modification
    	 * des données, on revient à la première page.
    	 */
    	if (
    		offset < 0 ||
    		(
    			offset >= totalCount &&
    			totalCount > 0
    		)
    	) {
    		offset = 0;
    	}
    
    	var endOffset =
    		Math.min(
    			offset + requestedPageSize,
    			totalCount
    		);
    
    	var pageDocs =
    		allDocs.slice(
    			offset,
    			endOffset
    		);
    
    	var hasPreviousPage =
    		offset > 0;
    
    	var hasNextPage =
    		endOffset < totalCount;
    
    	var pageCount =
    		totalCount === 0
    			? 0
    			: Math.ceil(
    				totalCount /
    				requestedPageSize
    			);
    
    	var currentPageIndex =
    		totalCount === 0
    			? 0
    			: Math.floor(
    				offset /
    					requestedPageSize
    			);
    
    	var previousOffset =
    		Math.max(
    			0,
    			offset - requestedPageSize
    		);
    
    	var lastPageOffset =
    		totalCount === 0
    			? 0
    			: Math.floor(
    				(totalCount - 1) /
    					requestedPageSize
    			) * requestedPageSize;
    
    	result.docs =
    		pageDocs;
    
    	result.pagination = {
    		paginated: true,
    		mode: "out_folder_offset",
    
    		pageSize:
    			requestedPageSize,
    
    		returnedCount:
    			pageDocs.length,
    
    		totalCount:
    			totalCount,
    
    		pageCount:
    			pageCount,
    
    		currentPageIndex:
    			currentPageIndex,
    
    		currentPageNumber:
    			currentPageIndex + 1,
    
    		hasPreviousPage:
    			hasPreviousPage,
    
    		/*
    		 * null représente la première page.
    		 *
    		 * hasPreviousPage permet de distinguer :
    		 * - première page : aucun retour possible ;
    		 * - deuxième page : retour possible avec token null.
    		 */
    		previousPageToken:
    			hasPreviousPage &&
    			previousOffset > 0
    				? createOutFolderPageToken(
    					previousOffset
    				)
    				: null,
    
    		hasNextPage:
    			hasNextPage,
    
    		nextPageToken:
    			hasNextPage
    				? createOutFolderPageToken(
    					endOffset
    				)
    				: null,
    
    		firstPageToken:
    			null,
    
    		lastPageToken:
    			pageCount > 1
    				? createOutFolderPageToken(
    					lastPageOffset
    				)
    				: null
    	};
    
    	return result;
    }
    
