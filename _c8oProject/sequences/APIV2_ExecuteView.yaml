    function cloneJson(value) {
    	return JSON.parse(JSON.stringify(value));
    }
    
    function buildAccessSelector(
    	userId,
    	groups
    ) {
    	var accessConditions = [
    		{
    			"$and": [
    				{
    					"~c8oAcl": {
    						"$exists": false
    					}
    				},
    				{
    					"c8oGrp": {
    						"$exists": false
    					}
    				}
    			]
    		},
    		{
    			"~c8oAcl": {
    				"$eq": userId
    			}
    		}
    	];
    
    	for (
    		var groupIndex = 0;
    		groupIndex < groups.length;
    		groupIndex++
    	) {
    		var groupId = groups[groupIndex];
    
    		var groupCondition = {
    			"c8oGrp": {
    				"$or": [
    					{},
    					{
    						"$eq": groupId
    					}
    				]
    			}
    		};
    
    		groupCondition.c8oGrp["$or"][0][groupId] = {
    			"$in": [
    				true,
    				"true"
    			]
    		};
    
    		accessConditions.push(groupCondition);
    	}
    
    	return {
    		"$or": accessConditions
    	};
    }
    
    function getMangoRequestDefinition(targetDefinition) {
    	if (Array.isArray(targetDefinition)) {
    		for (
    			var requestIndex = 0;
    			requestIndex < targetDefinition.length;
    			requestIndex++
    		) {
    			var definition =
    				targetDefinition[requestIndex];
    
    			if (
    				definition != null &&
    				definition.type != "view"
    			) {
    				return JSON.parse(
    					JSON.stringify(definition)
    				);
    			}
    		}
    
    		return {};
    	}
    
    	return JSON.parse(
    		JSON.stringify(targetDefinition || {})
    	);
    }
    
    function getRequestSelectorClauses(
    	requestDefinition
    ) {
    	if (
    		Array.isArray(
    			requestDefinition.selector
    		)
    	) {
    		return JSON.parse(
    			JSON.stringify(
    				requestDefinition.selector
    			)
    		);
    	}
    
    	if (
    		requestDefinition.selector != null &&
    		Array.isArray(
    			requestDefinition.selector["$and"]
    		)
    	) {
    		return JSON.parse(
    			JSON.stringify(
    				requestDefinition
    					.selector["$and"]
    			)
    		);
    	}
    
    	return [];
    }
    
    function getCompatibleUseIndex(
    	requestDefinition,
    	removeAclSuffix
    ) {
    	if (
    		!Array.isArray(
    			requestDefinition.use_index
    		)
    	) {
    		return null;
    	}
    
    	var useIndex = JSON.parse(
    		JSON.stringify(
    			requestDefinition.use_index
    		)
    	);
    
    	/*
    	 * Les requêtes admin ou créateur ne contiennent pas
    	 * le filtre ~c8oAcl. Elles ne doivent donc pas forcer
    	 * l''index suffixé par _by_ACL.
    	 */
    	if (
    		removeAclSuffix === true &&
    		useIndex.length >= 2
    	) {
    		useIndex[1] = useIndex[1].replace(
    			/_by_ACL$/,
    			""
    		);
    	}
    
    	return useIndex;
    }
    
