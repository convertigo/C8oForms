    let mangoquery = {
    	selector: {
    		"$and": []
    	}
    };
    
    // get admin attr
    var admin = params.filters.show_all_apps == true;
    
    var withACL = true;
    try {
    	withACL = requests[target].find((x) => { return x.acl != false }) != null;
    }
    catch (e) {
    
    }
    
    if (admin === true && params.user != null) {
    	admin = false;
    	authenticatedUserID = params.user.substring(12);
    }
    
    // request is acl or group based create filter
    if (!admin && withACL) {
    	// call c8ofullsyncgrp =>  design/get_groups_by_user
    	query = new java.util.HashMap();
    	query.put(''reduce'', ''false'');
    	keys = toJettison([authenticatedUserID]);
    	rows = toJSON(fsclient.postView("c8ofullsyncgrp", ''design'', ''get_groups_by_user'', query, keys)).rows;
    	// call c8oforms_fs =>  authentication/distinctGroups
    	query = new java.util.HashMap();
    	query.put(''reduce'', ''true'');
    	query.put(''group'', ''true'');
    	_use_keys = rows.map((x) => { return x.value });
    	keys = toJettison(_use_keys);
    	if (params.filters.hide_apps_i_created === false) {
    		usedGroups = toJSON(fsclient.postView(targetDB, ''authentication'', ''distinctGroups'', query, keys));
    		usedGroups = usedGroups.rows.map((x) => { return x.key/*.replace(/\./g, ''\\.'') */ });
    	}
    	else {
    		usedGroups = ["C8Oreserved_" + authenticatedUserID];
    	}
    }
    else {
    	usedGroups = [];
    }
    if (target != "formsV2/search" && target != "published_formsV2/search") {
    	var _requests = [];
    	for (var selector of requests[target]) {
    		var _sel = JSON.parse(JSON.stringify(selector));
    		if (_sel.type != "view" && !admin && withACL) {
    			_sel.selector["$and"].push({
    				"~c8oAcl": authenticatedUserID
    			});
    		}
    		else if (_sel.type != "view" && _sel.use_index != null && admin) {
    			if (_sel.use_index.length == 2) {
    				_sel.use_index[1] = _sel.use_index[1].substring(0, _sel.use_index[1].length - 7);
    			}
    		}
    		delete _sel.acl;
    		_requests.push(_sel);
    
    	}
    	var res = { docs: []/*, execution_stats: [], warning: [], querys: [] */ };
    	var _res = null;
    	for (var query of _requests) {
    		if (query.type != "view") {
    			query.limit = 10000;
    			query.execution_stats = true;
