    				typeof postFilter != "function" ||
    				postFilter(doc) === true
    			) {
    				docs.push(doc);
    			}
    		}
    
    		var nextBookmark =
    			result.bookmark != null &&
    			result.bookmark != ""
    				? result.bookmark
    				: null;
    
