    		var transformedFold = [];
    		for (var i = 0; i < res.docs.length; i++) {
    			var item = res.docs[i];
    			if (item.tag && Array.isArray(item.tag) && item.tag.length > 0) {
    				for (var j = 0; j < item.tag.length; j++) {
    					var tag = item.tag[j];
    					if (!tagsUsed[tag]) {
    						tagsUsed[tag] = true;
    						var newItem = {
    							isAtag: true,
    							key: tag
    						};
    						transformedFold.push(newItem);
    					}
    				}
