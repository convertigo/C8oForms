    			var _res = toJSON(fsclient.postFind(targetDB, toJettison(query)));
    			log.warn(JSON.stringify(_res));
    			if (params.filters.hide_apps_i_created !== false) {
    				_res.docs = _res.docs.filter((x) => {
    					return x.creator == authenticatedUserID;
    				})
    			}
    			res.docs = res.docs.concat(_res.docs);
    			//			res.execution_stats.push(_res.execution_stats);
    			//			res.warning.push(_res.warning);
    			//			res.querys.push(query);
    			__res = null;
    		}
    		else {
    			_query = new HashMap();
    			_query.put(''reduce'', ''false'');
    			//_query.put(''include_docs'', ''true'');
    
    			if (target == "formsV2/out_folder" || target == "published_formsV2/out_folder") {
    				keys = toJettison(usedGroups);
    			}
    			else if (target == "formsV2/in_folders" || target == "published_formsV2/in_folders") {
    				keys = toJettison(usedGroups.map((x) => { return [x, params["folder"]] }));
    			}
    			else {
    				keys = null;
    			}
    
    			var _resV = toJSON(fsclient.postView(targetDB, query.design, query.view, _query, keys));
    			_resV = _resV.rows;
    			if (params.filters.hide_apps_i_created !== false) {
    				_resV = _resV.filter((x) => {
    					return x.value.creator == authenticatedUserID;
    				})
    			}
    			if (_resV != undefined) {
    				res.docs = res.docs.concat(_resV.map((x) => {
    					return x.value;
    				}));
    			}
    		}
    
    	}
    	//	let timeBefore = new Date().getTime();
    	if (target.indexOf("published") != -1) {
    		res.docs = res.docs.sort((a, b) => {
    			try {
    				return +(b._id.split("_")[1]) - +(a._id.split("_")[1])
    			}
    			catch (e) {
    				return b._id - +a._id;
    			}
    
    		})
    	}
    	else {
    		res.docs = res.docs.sort((a, b) => {
    			return b._id - +a._id;
    		})
    	}
    	//delete duplicates
    	res.docs = res.docs.filter((item, index, self) => {
    		return index === self.findIndex((t) => {
    			if (t == null || item == null) {
    				return false;
    			}
    			return t._id === item._id
    		})
    	});
    
    	//	res.time = timeBefore - new Date().getTime();
    
    	if ((target == "formsV2/out_folder" || target == "published_formsV2/out_folder") && res.docs) {
    		var tagsUsed = {};
