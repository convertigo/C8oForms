    function buildAccessSelector(
    	userId,
    	groups
    ) {
    	var accessConditions = [
    		{
    			"$and": [
    				{
    					"~c8oAcl": {
    						"$exists": false
    					}
    				},
    				{
    					"c8oGrp": {
    						"$exists": false
    					}
    				}
    			]
    		},
    		{
    			"~c8oAcl": {
    				"$eq": userId
    			}
    		}
    	];
    
    	for (
    		var groupIndex = 0;
    		groupIndex < groups.length;
    		groupIndex++
    	) {
    		var groupId = groups[groupIndex];
    
    		var groupCondition = {
    			"c8oGrp": {
    				"$or": [
    					{},
    					{
    						"$eq": groupId
    					}
    				]
    			}
    		};
    
    		groupCondition.c8oGrp["$or"][0][groupId] = {
    			"$in": [
    				true,
    				"true"
    			]
    		};
    
    		accessConditions.push(groupCondition);
    	}
    
    	return {
    		"$or": accessConditions
    	};
    }
    
    function getMangoRequestDefinition(targetDefinition) {
