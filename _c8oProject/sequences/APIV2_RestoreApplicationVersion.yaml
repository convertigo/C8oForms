accessibility: Hidden
authenticatedContextRequired: true
comment: |
  Restore an application version (#1359).
  Replaces the draft application by one of its versions, keeping its id, URL, access rights and publication. The state it held is kept as a pre_restore version.
↓restoreVersion [steps.SimpleStep-1790180000013]: 
  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    include("js/application_history.js");
    
    var authenticatedUserID = context.getAuthenticatedUser();
    var res = {};
    var draft = getDoc("" + id, null, "c8oforms_fs");
    if (!c8oHistory.isDraft(draft)) {
    	res.error = "not_found";
    }
    else if (!canEditFormDocument(draft, authenticatedUserID)) {
    	res.error = "unauthorized";
    }
    else {
    	try {
    		var entry = c8oHistory.readEntry(draft._id, "" + entryId);
    		if (entry == null) {
    			res.error = "not_found";
    		}
    		else {
    			res = c8oHistory.restore(draft, entry, rev != null && ("" + rev).length ? "" + rev : null, authenticatedUserID);
    		}
    	}
    	catch (e) {
    		log.error("application history: unable to restore " + entryId + " into " + id + ": " + e);
    		res = { error: "restore_failed" };
    	}
    }'
↓output [steps.JsonToXmlStep-1790180000014]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: res
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: res
↓id [variables.RequestableVariable-1790180000010]: 
  comment: Identifier of the draft application.
↓entryId [variables.RequestableVariable-1790180000011]: 
  comment: Identifier of the version to restore.
↓rev [variables.RequestableVariable-1790180000012]: 
  comment: Revision of the draft the caller shows; the restore is refused when the draft changed since. Empty to skip the check.
