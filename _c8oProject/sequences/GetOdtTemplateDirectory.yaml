↓Sequence_JS [steps.SimpleStep-1789723239278]: 
  comment: Validates and canonically confines the template file to C8Oforms/templates/odf.
  expression: |
    'var templateName = String(template_name || "").trim();
    
    if (!/^[\w.-]+\.odt$/i.test(templateName)) {
    	throw new Error("Invalid ODT template name");
    }
    
    var templateRoot = new java.io.File(
    	context.getProjectDirectory(),
    	"templates/odf"
    ).getCanonicalFile();
    
    var templateFile = new java.io.File(
    	templateRoot,
    	templateName
    ).getCanonicalFile();
    
    var templateParent = templateFile.getParentFile();
    
    if (
    	templateParent == null ||
    	!templateParent.equals(templateRoot)
    ) {
    	throw new Error("Invalid ODT template name");
    }
    
    if (
    	!templateFile.exists() ||
    	!templateFile.isFile()
    ) {
    	throw new Error("ODT template not found");
    }
    
    var resolvedTemplatePath = templateFile.getPath();'
