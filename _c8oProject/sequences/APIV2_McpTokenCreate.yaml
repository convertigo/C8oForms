    function base64Url(value) {
    	return String(Base64.getUrlEncoder().withoutPadding().encodeToString(new java.lang.String(String(value)).getBytes("UTF-8")));
    }
    
    function randomBase64Url(size) {
    	var random = new SecureRandom();
    	var bytes = java.lang.reflect.Array.newInstance(java.lang.Byte.TYPE, size);
    	random.nextBytes(bytes);
    	return String(Base64.getUrlEncoder().withoutPadding().encodeToString(bytes));
    }
    
    function sign(data, secretKey) {
    	var mac = Mac.getInstance("HmacSHA256");
    	var keySpec = new SecretKeySpec(new java.lang.String(String(secretKey)).getBytes("UTF-8"), "HmacSHA256");
    	mac.init(keySpec);
    	return String(Base64.getUrlEncoder().withoutPadding().encodeToString(mac.doFinal(new java.lang.String(String(data)).getBytes("UTF-8"))));
    }
    
    function sha256(value) {
    	var digest = MessageDigest.getInstance("SHA-256");
    	return String(Base64.getUrlEncoder().withoutPadding().encodeToString(digest.digest(new java.lang.String(String(value)).getBytes("UTF-8"))));
    }
    
    function isoDate(ms) {
    	var format = new SimpleDateFormat("yyyy-MM-dd''T''HH:mm:ss''Z''");
    	format.setTimeZone(TimeZone.getTimeZone("UTC"));
    	return String(format.format(new java.util.Date(ms)));
    }
    
    function normalizeTokenList(tokens) {
