  Delete form document.
  Removes a form draft or folder after validating ownership.
↓deleteAuthorizedDoc [steps.SimpleStep-1699609320787]: 
  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    include("js/application_history.js");
    
    let authenticatedUserID = context.getAuthenticatedUser();
    let res = {};
    let loglevel = "warn";
    let authGranted = false;
    let db = "c8oforms_fs";
    if (fromResponse == "true") {
       db = "c8oforms_response_fs";
    }
    try{
    	let _id = JSON.parse(id);
    	if(_id instanceof Array){
    		id = _id;
    	}
    	else{
    		id = [id];
    	}
    }
    catch(e){
    	id = [id];
    }
    try{
    	let _rev = JSON.parse(rev);
    	if(_rev instanceof Array){
    		rev = _rev;
    	}
    	else{
    		rev = [rev];
    	}
    }
    catch(e){
    	rev = [rev];
    }
    for(let i = 0; i < id.length; i++){
    	let doc = getDoc(id[i], rev[i], db);
    	// now check if doc is authorized for currentUser
    	let canDelete = doc["creator"] == null || doc["creator"] == authenticatedUserID;
    	if(!canDelete){
    		try{
    			include("js/isAdmin.js");
    			canDelete = true;
    		}
    		catch(e){
    			
    		}
    	}
    	if (canDelete) {
    		let deleted = deleteDoc(id[i], doc._rev, db);
    		if(deleted.ok != true){
    			res.error = true;
    		}
    		else{
    			if(db == "c8oforms_fs" && doc.c8o_view_type_drafts_form == true){
    				// #1359: the versions of a deleted application are deleted with it
    				try{
    					c8oHistory.purge(id[i]);
    				}
    				catch(e){
    					log.warn("Unable to delete the version history of the deleted application " + id[i] + ": " + e);
    				}
    			}
    			if(doc.c8o_view_type_published_form == true){
    				// APIV2_Publish put the creator (and the anonymous user) in this hidden group: drop every membership
    				try{
    					callSequence("lib_FullSyncGrp", "RemoveGroup", { group: "_C8O_HIDDEN_" + id[i] });
    				}
    				catch(e){
    					log.warn("Unable to remove the hidden group of the deleted published form " + id[i] + ": " + e);
    				}
    				let deletedPWA = deleteDoc(id[i]+"_pwa_document", null, db);
    				try{
    					let deletedAno = deleteDoc(id[i]+"_anonymous", null, db);
    				}
    				catch(e){
    					
    				}
    			}
    		}
    	}
    	else{
    		res.error = true;
    	}
    
    }
    
    '
