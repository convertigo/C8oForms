↓Sequence_admin_users_get [steps.SimpleStep-1740999362971]: 
  expression: |
    'query = new java.util.HashMap();
    query.put(''include_docs'', ''true'');
    var response = toJSON(fsclient.getView("c8oforms_fs", ''usersV2'', ''all2'', query));
    
    if(response.error){
    	
    }
    else{
    	var rows = response.rows;
    	var valuesRows = rows;
    	response = {
    		childrenLabels:	
    		[				
    			{
    				headerName: "id",
    				field: "_id",
    				editable: false,
    				checkboxSelection: true,
    				headerCheckboxSelection: true
    			}
    		],
    		labels: [
    			{
    				headerName: "group_name",
    				field: "group",
    				editable: true,
    				checkboxSelection: true,
    				headerCheckboxSelection: true
    			},
    			{
    				headerName: "Editing_rights",
    				field: "editing_rights",
    				c8o_type:"stringboolean",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: true,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			},
    			{
    				headerName: "Nocode_db_rights",
    				field: "nocode_db_rights",
    				c8o_type:"stringboolean",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: true,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			},
    			{
    				headerName: "Admin",
    				field: "admin",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: true,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			}
    		],
    		values: valuesRows
    	};
    	var filtered = groups;
    	filtered.push({group:{text:"any_group"}});
    	filtered.unshift({group:{text:"all_users", attr: {users: String(rows.length)}}});
    	var values = [];
    	var obj = {};
    	for (let i = 0; i < filtered.length; i++) {
    		let item = filtered[i];
    		let children = [];
    		if (item["group"]["text"] == "all_users") {			
    			children = valuesRows.map((it) => {return it.doc;});
    			obj[''children''] = children;
    		} else {
    			obj[''children''] = [];
    		}
    		obj[''group''] = item["group"]["text"];
    		values.push(obj);
    		obj = {};
    	}
    	response.values = values;
    }'
