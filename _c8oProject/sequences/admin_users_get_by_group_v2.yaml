    groups = groups.map((x)=>{
    	var rights = _groups.find((_x)=>{
    		return _x.id == x.group.text
    	});
    	return {
    		value: x.group.text,
    		count: x.group.attr.users,
    		rights: rights == null ? {} : {
    			editing_rights : rights.doc.editing_rights,
    			nocode_db_rights : rights.doc.nocode_db_rights,
    			admin : rights.doc.nocode_db_rights
    		}
    	}
    })
    console.log("my groups :", groups, "warn");
