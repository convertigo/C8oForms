  expression: |
    '// remove _C8O groups
    groups = groups.filter((group) => group.group.text.indexOf(''C8O'') == -1)
    _keys = groups.map((x)=>{return x.group.text})
    // get forms groups rights holders
    query = new HashMap();
    query.put(''reduce'', ''false'');
    query.put(''include_docs'', ''true'');
    keys = toJettison(_keys);
    _groups = toJSON(fsclient.postView("c8oforms_fs", ''groups'', ''rightsByUser'', query, keys)).rows;
    
    groups = groups.map((x)=>{
    	var rights = _groups.find((_x)=>{
    		return _x.id == x.group.text
    	});
    	return {
    		value: x.group.text,
    		count: x.group.attr.users,
    		rights: rights == null ? {} : {
    			editing_rights : rights.doc.editing_rights,
    			formulas : rights.doc.formulas,
    			nocode_db_rights : rights.doc.nocode_db_rights,
    			admin : rights.doc.admin,
    			admin_readonly : rights.doc.admin_readonly,
    			publication: rights.doc.publication,
    			_rev: rights.doc._rev
    		}
    	}
    })
    
    if(targetGroup){
    	query = new java.util.HashMap();
    	query.put(''reduce'', ''false'');
    	keys = toJettison([targetGroup]);
    	_keys = toJSON(fsclient.postView("c8ofullsyncgrp", ''design'', ''get_users_by_group'', query, keys));
    	_keys = _keys.rows.map((x)=>{return "C8Oreserved_"+x.value});
    	query = new java.util.HashMap();
    	query.put(''include_docs'', ''true'');
    	keys = toJettison(_keys);
    	response = toJSON(fsclient.postView("c8oforms_fs", ''usersV2'', ''all2'', query, keys));
    }
    else{
    	query = new java.util.HashMap();
    	query.put(''include_docs'', ''true'');
    	response = toJSON(fsclient.getView("c8oforms_fs", ''usersV2'', ''all2'', query));
    }
    
    
    if(response.error){
    	
    }
    else{
    	response.rows = response.rows.map((row)=>{
    		var editing_rights = row.doc.editing_rights == undefined ? editing_apps_default_rights == "true" : (row.doc.editing_rights === true || row.doc.editing_rights == "true");
    		var nocode_db_rights = row.doc.nocode_db_rights == undefined ? no_code_db_default_rights == "true" : (row.doc.nocode_db_rights === true || row.doc.nocode_db_rights == "true");
    		var admin = row.doc.admin != undefined && (row.doc.admin === true || row.doc.admin == "true");
    		var admin_readonly = row.doc.admin_readonly != undefined && (row.doc.admin_readonly === true || row.doc.admin_readonly == "true");
    		var formulas = row.doc.formulas == undefined ? formulas_default_rights == "true" : (row.doc.formulas === true || row.doc.formulas == "true");
    		var publication = row.doc.publication == undefined ? publication == "true" : (row.doc.publication === true || row.doc.publication == "true");
    		var _rev = (row.doc._rev != undefined) ? row.doc._rev : '''';
    		if(!editing_rights || !nocode_db_rights || !admin || !formulas || !admin_readonly || !publication) {
    			query = new java.util.HashMap();
    			query.put(''reduce'', ''false'');
    			keys = toJettison([row.doc["~c8oAcl"]]);
    			var groupsOf = toJSON(fsclient.postView("c8ofullsyncgrp", ''design'', ''get_groups_by_user'', query, keys));
    			if(groupsOf.rows.length > 0){
    				groupsOf = groupsOf.rows.map((x)=>{return x.value});
    				for(var group of _groups){
    					if(groupsOf.indexOf(group._id) != -1){
    						if(!editing_rights){
    							editing_rights = Boolean(group.doc.editing_rights);
    						}
    						if(!nocode_db_rights){
    							nocode_db_rights = Boolean(group.doc.nocode_db_rights);
    						}
    						if(!admin){
    							admin = group.doc.admin;
    						}
    						if(!admin_readonly){
    							admin = group.doc.admin_readonly;
    						}
    						
    						if (!publication) {
    							publication = group.doc.publication;
    						}
    						
    						if(!formulas){
    							formulas = group.doc.formulas;
    						}
    
    						if(editing_rights && nocode_db_rights && admin && admin_readonly && publication && formulas){
    							break;
    						}
    						
    					}
    				}
    			}
    		}
    		row.doc.editing_rights = editing_rights;
    		row.doc.nocode_db_rights = nocode_db_rights;
    		row.doc.admin = admin;
    		row.doc.admin_readonly = admin_readonly;
    		row.doc.formulas = formulas;
    		row.doc.publication = publication;
    		row.doc._rev = _rev;
    		return row;
    	});
    	admin_readonly = (admin_readonly == "false") ? false : true;
    	response = {
    		default_rights:{
    			"no_code_db_default_rights": no_code_db_default_rights == "true",
    			"editing_apps_default_rights": editing_apps_default_rights == "true",
    			"formulas_default_rights": formulas_default_rights == "true",
    			"publication": publication == "true"
    		},
    		childrenLabels:	
    		[				
    			{
    				headerName: "id",
    				field: "_id",
    				editable: false,
    				hide: true
    			},
    			{
    				headerName: "email_address",
    				field: "mail",
    				editable: false,
    				checkboxSelection: (admin_readonly) ? false : true,
    				headerCheckboxSelection: (admin_readonly) ? false : true
    			},
    			{
    				headerName: "Provider",
    				editable: false,
    				field: "provider"
    			},
    			{
    				headerName: "Editing_rights",
    				field: "editing_rights",
    				c8o_type:"stringboolean",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: false,
    				width: 200,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			},
    			{
    				headerName: "Formulas_rights",
    				field: "formulas",
    				c8o_type:"stringboolean",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: false,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [''true'', ''false''],
    				},
    			},
    			{
    				headerName: "Nocode_db_rights",
    				field: "nocode_db_rights",
    				c8o_type:"stringboolean",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: false,
    				width: 200,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			},
    			{
    				headerName: "Publication",
    				field: "publication",
    				c8o_type:"stringboolean",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: false,
    				width: 200,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			},
    			{
    				headerName: "Admin_read_only",
    				field: "admin_readonly",
    				c8o_type: ''stringboolean'',
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				width: 200,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    				editable: false
    			},
    			{
    				headerName: "Admin",
    				field: "admin",
    				c8o_type: ''stringboolean'',
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				width: 200,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    				editable: false
    			}
    		],
    		labels: [
    			{
    				headerName: "group_name",
    				field: "group",
    				editable: false,
    				checkboxSelection: (admin_readonly) ? false : true,
    				headerCheckboxSelection: (admin_readonly) ? false : true
    			}
    		],
    		values: response.rows
    	};
    	groups.unshift({
    		value: "all_users",
    		count: response.values.length,
    		rights: null,
    		children: targetGroup != null ? null : response.values.map((x)=>{return x.doc})
    	})
    	if(targetGroup != null){
    		response.values = groups.map((x)=>{
    			if(x.value == targetGroup){
    				x.children = response.values.map((x)=>{return x.doc})
    			}
    			return x;
    		})
    	}
    	response.values = groups;
    }'
