    			},
    			{
    				headerName: "Provider",
    				editable: false,
    				field: "provider"
    			},
    			{
    				headerName: "Editing_rights",
    				field: "editing_rights",
    				c8o_type:"stringboolean",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: true,
    				width: 200,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			},
    			{
    				headerName: "Nocode_db_rights",
    				field: "nocode_db_rights",
    				c8o_type:"stringboolean",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: true,
    				width: 200,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			},
    			{
    				headerName: "Admin",
    				field: "admin",
    				cellRenderer: ''agCheckboxCellRenderer'',
    				cellEditor: ''agCheckboxCellEditor'',
    				editable: true,
    				width: 200,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    				editable: false
    			}
    //			{
    //				headerName: '''',
    //				field: ''access'',
    //				autoHeight: true,
    //				sortable: true,
    //				filter: true,
    //			}
    		],
    		labels: [
    			{
    				headerName: "group_name",
    				field: "group",
    				editable: false,
    				checkboxSelection: true,
    				headerCheckboxSelection: true
    			}
    //			{
    //				headerName: '''',
