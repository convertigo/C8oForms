    // check only supported tags (_id _rev favorites published_First language provider mail editing_rights c8o_view_type_users name surname displayName picture admin ~c8oAcl)
    var args = {};
    var arrayAuthorized = ["favorites", "published_first", "language", "provider", "mail", "editing_rights", "c8o_view_type_users", "name", "surname", "displayName", "picture", "admin", "~c8oAcl", "nocode_db_rights", "formulas", "admin_readonly", "publication"];
