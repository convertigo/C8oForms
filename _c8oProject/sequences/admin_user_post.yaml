    '// Imports and helpers functions
    include("js/common.js");
    
    let loglevel = "warn";
    let authenticatedUserID = context.getAuthenticatedUser();
    var doc = {};
    try{
       meta = JSON.parse(meta);
    }
    catch(e){
       meta = {};
    }
    // check only supported tags (_id _rev favorites published_First language provider mail editing_rights c8o_view_type_users name surname displayName picture advancedEditing admin ~c8oAcl)
    var args = {};
    var arrayAuthorized = ["favorites", "published_first", "language", "provider", "mail", "editing_rights", "c8o_view_type_users", "name", "surname", "displayName", "picture", "advancedEditing", "admin", "~c8oAcl", "nocode_db_rights", "formulas", "admin_readonly", "publication"];
    for (let i = 0; i < arrayAuthorized.length; i++) {
    	if (meta[arrayAuthorized[i]] !== undefined) {
    		args[arrayAuthorized[i]] = meta[arrayAuthorized[i]];
    	}
    }
    if(args["provider"] == undefined || args["provider"] === ""){
    	args["provider"] = "forms";
    }
    if(args["editing_rights"] != undefined){
    	args["editing_rights"] = args["editing_rights"] + "";
    }
    if(args["nocode_db_rights"] != undefined){
    	args["nocode_db_rights"] = args["nocode_db_rights"] + "";
    }
    args["c8o_view_type_users"] = true;
    args["_id"] = "C8Oreserved_" + args["mail"];
    args["~c8oAcl"] = args["mail"];
    var resp = (callSequence("lib_UserManager", "AddUser", { user: args["mail"], password: "", askForPasswordReset: "true" }));
    if(resp.document && resp.document.error != undefined){
    	doc.ok = false;
    }
    else{
    	doc = toJSON(fsclient.postDocument(java.lang.String("c8oforms_fs"), toJettison(args), new HashMap(), enums.CouchPostDocumentPolicy.none, new HashMap(), false));
    }
    '
