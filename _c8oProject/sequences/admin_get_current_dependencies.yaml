            var FileReader = java.io.FileReader;
    
            var file = new File(yaml_file_path);
            if (!file.exists()) {
                log.warn("File not found: " + yaml_file_path);
                continue;
            }
    
            var reader = new BufferedReader(new FileReader(file));
            var line;
            var content = "";
            while ((line = reader.readLine()) != null) {
                content += line + "\n";
            }
            reader.close();
    
            // Expression régulière pour trouver la version
            var versionPattern = /version:\s*([0-9.]+\S*)/;
            var match = content.match(versionPattern);
            if (match) {
                var version = match[1];
