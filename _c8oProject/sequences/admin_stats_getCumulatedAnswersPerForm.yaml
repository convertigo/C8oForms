↓sortDataCumulatedAnswersPerDay [steps.SimpleStep-1739542915114]: 
  expression: |
    '
    let cumulated = 0;
    let cumulatedData = Array.from(result);
    for (let i = 0; i < cumulatedData.length; i++) {
      if (cumulatedData[i].value === 0) {
        cumulated = cumulatedData[i].value;
      }
      
      if (cumulatedData[i].value > 0) {
        cumulated = cumulated + cumulatedData[i].value;
    	cumulatedData[i].value = cumulated;
      }
    } 
    cumulatedData.reverse();
    
    let options = [cumulatedData[4],cumulatedData[3],cumulatedData[2],cumulatedData[1],cumulatedData[0]];
    let forms = [cumulatedData[4],cumulatedData[3],cumulatedData[2],cumulatedData[1],cumulatedData[0]];'
