↓normalizedLanguage [steps.ElementStep-1785948822367]: 
  comment: Canonicalizes the SetLanguage language input for the central backend locale contract.
  expression: |
    '(function(candidate) {
        function normalizeBackendLocaleCandidate(value) {
            if (value == null) {
                return null;
            }
            var normalizedValue = ("" + value).replace(/_/g, "-").replace(/^\s+|\s+$/g, "");
            var normalizedLowerValue = normalizedValue.toLowerCase();
            if (normalizedValue === "" || normalizedLowerValue === "undefined" || normalizedLowerValue === "null") {
                return null;
            }
            var primaryLanguage = normalizedLowerValue.split("-")[0];
            if (primaryLanguage === "fr") {
                return "fr";
            }
            if (primaryLanguage === "en") {
                return "en";
            }
            if (primaryLanguage === "es") {
                return "es";
            }
            if (primaryLanguage === "it") {
                return "it";
            }
            if (normalizedLowerValue === "zh-cn" || normalizedLowerValue === "zh-sg" || normalizedLowerValue === "zh-hans") {
                return "zh-CN";
            }
            return null;
        }
        return normalizeBackendLocaleCandidate(candidate);
    })(typeof language == "undefined" ? null : language)'
  output: false
