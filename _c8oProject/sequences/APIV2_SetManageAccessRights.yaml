    // get doc and check rights
    let doc = callSequence("C8Oforms", "APIV2_getDocument", { id: id }).document.res;
    
    if (doc) {
    	var groupsToAdd = doc.c8oGrp != undefined ? Object.assign({}, doc.c8oGrp) : {};
    	var invite_new = [];
    	let ensureGroupFlag = (value) => {
    		if (value != undefined && value != null && value !== "") {
    			groupsToAdd[value] = true;
    		}
    	};
    	["collabs", "collabsResponse", "shared"].forEach((prop) => {
    		let source = doc[prop];
    		if (source != undefined && source != null) {
    			if (Array.isArray(source)) {
    				source.forEach((value) => {
    					ensureGroupFlag(value);
    				});
    			}
    			else if (typeof source.forEach == "function") {
    				source.forEach((value) => {
    					ensureGroupFlag(value);
    				});
    			}
    			else if (typeof source.iterator == "function") {
    				let iterator = source.iterator();
    				while (iterator.hasNext()) {
    					ensureGroupFlag(iterator.next());
    				}
    			}
    			else {
    				ensureGroupFlag(source);
    			}
    		}
    	});
