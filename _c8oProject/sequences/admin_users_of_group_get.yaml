        // Initialisation correcte de l'objet users
        var users = {};
        
        // Filtrer les utilisateurs sans groupes
        users.rows = user.filter((val) => 
            val &&                                  // S'assurer que val est défini
            val['attr'] &&                          // Vérifier que "attr" existe
            (!val['attr']['groups'] || val['attr']['groups'].length == 0) // Aucun groupe ou tableau vide
        );
        
        // Mettre à jour le nombre total
        users.total_count = users.rows.length;
