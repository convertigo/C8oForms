↓sortDataCumulatedAnswersPerDay [steps.SimpleStep-1739542404391]: 
  expression: |
    'result = result.reduce((acc, currentObject, index) => {
      const cumulatedResult = (index === 0)
        ? currentObject.value
        : acc[index - 1].value + currentObject.value;
      acc.push({
        key: currentObject.key,
        value: cumulatedResult
      });
      return acc;
    }, []);'
