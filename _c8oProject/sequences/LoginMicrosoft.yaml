            '(function() {
                function normalizeBackendCreationLocale(value) {
                    if (value == null || value == undefined) {
                        return null;
                    }
                    var valueType = Object.prototype.toString.call(value);
                    if (valueType == "[object Array]" || valueType == "[object Object]") {
                        return null;
                    }
                    var candidate = String(value).replace(/^\s+|\s+$/g, "");
                    if (candidate == "") {
                        return null;
                    }
                    var normalized = candidate.replace(/_/g, "-").toLowerCase();
                    if (normalized == "fr" || normalized == "en" || normalized == "es" || normalized == "it") {
                        return normalized;
                    }
                    if (normalized == "zh-cn" || normalized == "zh-sg" || normalized == "zh-hans") {
                        return "zh-CN";
                    }
                    return null;
                }
                var base = {};
                var normalizedLanguage = normalizeBackendCreationLocale(lang);
                if (normalizedLanguage != null) {
                    base.language = normalizedLanguage;
                }
                return JSON.stringify(base);
            })()'
