comment: |
  Get users by ids.
  Fetches user documents by id to return display metadata.
↓Sequence_JS [steps.SimpleStep-1770061400000]: 
  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    var res = {};
    var users = {};
    var idsList = [];
    try {
    	idsList = JSON.parse(ids);
    }
    catch (e) {
    	if (ids != null && ids !== "") {
    		idsList = ["" + ids];
    	}
    }
    if (!isArray(idsList)) {
    	idsList = [idsList];
    }
    idsList.forEach((entry) => {
    	if (entry == null || entry === "") {
    		return;
    	}
    	var doc;
    	try {
    		doc = getDoc("" + entry, null, "c8oforms_fs");
    	}
    	catch (e) {
    	}
    	if (doc && !doc.error && doc._id != null) {
    		users["" + entry] = {
    			id: doc._id,
    			displayName: doc.displayName,
    			mail: doc.mail,
    			name: doc.name,
    			surname: doc.surname
    		};
    	}
    });
    res.users = users;'
