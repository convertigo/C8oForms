comment: |
  Get users by ids.
  Fetches user documents by id to return display metadata.
↓Sequence_JS [steps.SimpleStep-1770061400000]: 
  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    var res = {};
    var users = {};
    var idsList = [];
    try {
    	idsList = JSON.parse(ids);
    }
    catch (e) {
    	if (ids != null && ids !== "") {
    		idsList = ["" + ids];
    	}
    }
    if (!isArray(idsList)) {
    	idsList = [idsList];
    }
    idsList = idsList.map(function(entry){
    	return entry == null ? "" : "" + entry;
    }).filter(function(entry){
    	return entry != null && entry !== "";
    });
    idsList = idsList.filter(function(value, index, array){
    	return array.indexOf(value) === index;
    });
    if (idsList.length > 0) {
    	try {
    		query = new java.util.HashMap();
    		query.put(''include_docs'', ''true'');
    		query.put(''reduce'', ''false'');
    		keys = toJettison(idsList);
    		var response = toJSON(fsclient.postView("c8oforms_fs", ''usersV2'', ''all2'', query, keys));
    		if (response && response.rows) {
    			response.rows.forEach(function(row){
    				if (row && row.doc) {
    					var doc = row.doc;
    					users["" + doc._id] = {
    						id: doc._id,
    						displayName: doc.displayName,
    						mail: doc.mail,
    						name: doc.name,
    						surname: doc.surname,
    						provider: doc.provider
    					};
    				}
    			});
    		}
    	}
    	catch (e) {
    		log.warn("APIV2_getUsersByIds: bulk lookup failed", e);
    	}
    }
    res.users = users;
    '
