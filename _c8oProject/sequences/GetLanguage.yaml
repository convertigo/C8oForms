      comment: Returns the valid account locale; when supplied, fallbackLanguage is used for an invalid account locale.
      expression: |
        '(function(accountCandidate, fallbackCandidate) {
            function normalizeBackendLocaleCandidate(value) {
                if (value == null) {
                    return null;
                }
                var normalizedValue = ("" + value).replace(/_/g, "-").replace(/^\s+|\s+$/g, "");
                var normalizedLowerValue = normalizedValue.toLowerCase();
                if (normalizedValue === "" || normalizedLowerValue === "undefined" || normalizedLowerValue === "null") {
                    return null;
                }
                var primaryLanguage = normalizedLowerValue.split("-")[0];
                if (primaryLanguage === "fr") return "fr";
                if (primaryLanguage === "en") return "en";
                if (primaryLanguage === "es") return "es";
                if (primaryLanguage === "it") return "it";
        		if (
        		    normalizedLowerValue === "zh" ||
        		    normalizedLowerValue === "zh-cn" ||
        		    normalizedLowerValue === "zh-sg" ||
        		    normalizedLowerValue === "zh-hans" ||
        		    normalizedLowerValue.indexOf("zh-hans-") === 0
        		) {
        		    return "zh-CN";
        		}
                return null;
            }
            var normalizedAccountLanguage = normalizeBackendLocaleCandidate(accountCandidate);
            if (normalizedAccountLanguage != null) {
                return normalizedAccountLanguage;
            }
            var rawFallbackLanguage = fallbackCandidate == null ? "" : ("" + fallbackCandidate).replace(/^\s+|\s+$/g, "");
            if (rawFallbackLanguage !== "") {
                return normalizeBackendLocaleCandidate(rawFallbackLanguage) || "en";
            }
            return "fr";
        })(typeof language == "undefined" ? null : language, typeof fallbackLanguage == "undefined" ? null : fallbackLanguage)'
