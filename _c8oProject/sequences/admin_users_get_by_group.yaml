    'query = new java.util.HashMap();
    query.put(''include_docs'', ''true'');
    var response = toJSON(fsclient.getView("c8oforms_fs", ''usersV2'', ''all2'', query));
    query2 = new java.util.HashMap();
    query2.put(''reduce'', ''false'');
    query2.put(''include_docs'', ''true'');
    var responseg = toJSON(fsclient.getView("c8ofullsyncgrp", ''design'', ''get_groups_by_user'', query2));
    if(response.error){
    	
    }
    else{
    	var rows = response.rows;
    	var valuesRows = rows.map((x) => {
    				x.doc[''group''] = responseg.rows.filter(item => item.key == x.doc[''~c8oAcl''])			
    				.map(item => item.value)
    				.join('', '');
    				if (x.doc[''group''].length == 0) {
    					x.doc[''group''] = "any_group";
    				}
    				return x.doc;
    	});
    	response = {
    		childrenLabels:	
    		[				
    			{
    				headerName: "id",
    				field: "_id",
    				editable: false,
    				width: 200,
    				checkboxSelection: true,
    				headerCheckboxSelection: true
    			},
    			{
    				headerName: "DisplayName",
    				field: "displayName",
    				editable: false
    			},
    			{
    				headerName: "group_name",
    				field: "group",
    				hide: false,
    				editable: false
    			}
    //			{
    //				headerName: "Name",
    //				field: "name"
    //			},
    //			{
    //				headerName: "Surname",
    //				field: "surname"
    //			},
    //			{
    //				headerName: "email_address",
    //				field: "mail"
    //			},
    //			{
    //				headerName: "Provider",
    //				field: "provider"
    //			},
    //			{
    //				headerName: "Language",
    //				field: "language",
    //				valueGetter: "lang",
    //				valueSetter: "lang",
    //			    cellEditor: ''agSelectCellEditor'',
    //			    cellEditorParams: {
    //			      values: [''en'', ''es'', ''fr'', "it"]
    //				}
    //				
    //			}
    		],
    		labels: [
    			{
    				headerName: "group_name",
    				field: "group",
    				editable: true,
    				checkboxSelection: true,
    				headerCheckboxSelection: true
    			},
    			{
    				headerName: "admin_dashboard_users_list_groups_user_count",
    				field: "user",
    				editable: false
    			},
    			{
    				headerName: "Editing_rights",
    				field: "editing_rights",
    				c8o_type:"stringboolean",
    //				cellRenderer: ''agCheckboxCellRenderer'',
    //				cellEditor: ''agCheckboxCellEditor'',
    				editable: true,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			},
    			{
    				headerName: "Nocode_db_rights",
    				field: "nocode_db_rights",
    				c8o_type:"stringboolean",
    //				cellRenderer: ''agCheckboxCellRenderer'',
    //				cellEditor: ''agCheckboxCellEditor'',
    				editable: true,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			},
    			{
    				headerName: "Admin",
    				field: "admin",
    //				cellRenderer: ''agCheckboxCellRenderer'',
    //				cellEditor: ''agCheckboxCellEditor'',
    				editable: true,
    				cellRendererParams: {
    					checkbox: true,
    				},
    				cellEditorParams: {
    					values: [true, false],
    				},
    			}
    		],
    		values: valuesRows
    	};
    	var filtered = groups;
    	filtered.push({group:{text:"any_group"}});
    	filtered.unshift({group:{text:"all_users", attr: {users: String(rows.length)}}});
    	var values = [];
    	var obj = {};
    	for (let i = 0; i < filtered.length; i++) {
    		let item = filtered[i];
    		let children = valuesRows.filter(it => it.group.indexOf(item["group"][''text'']) != -1);
    		obj[''group''] = item["group"]["text"];
    		obj[''user''] = (item["group"]["text"] != "any_group") ? item["group"][''attr''][''users''] : children.length
    		obj[''children''] = (item["group"]["text"] == "all_users") ? valuesRows : children;
    		values.push(obj);
    		obj = {};
    	}
    	response.values = values;
    }'
