↓Sequence_admin_users_get [steps.SimpleStep-1744216468957]: 
  expression: |
    '// remove _C8O groups
    groups = groups.filter((group) => group.group.text.indexOf(''C8O'') == -1)
    _keys = groups.map((x) => { return x.group.text })
    // get forms groups rights holders
    query = new HashMap();
    query.put(''reduce'', ''false'');
    query.put(''include_docs'', ''true'');
    keys = toJettison(_keys);
    _groups = toJSON(fsclient.postView("c8oforms_fs", ''groups'', ''rightsByUser'', query, keys)).rows;
    
    groups = groups.map((x) => {
    	var rights = _groups.find((_x) => {
    		return _x.id == x.group.text
    	});
    	return {
    		group: x.group.text,
    		user: x.group.attr.users,
    		access: rights == null ? {} : {
    			editing_rights: rights.doc.editing_rights,
    			formulas: rights.doc.formulas,
    			nocode_db_rights: rights.doc.nocode_db_rights,
    			admin: rights.doc.admin,
    			admin_readonly: rights.doc.admin_readonly
    		}
    	}
    });
    
    var data = {
    	"labels": [
    		{
    			"headerName": "admin_dashboard_users_list_groups_group_name",
    			"field": "group",
    			"editable": false,
    			"checkboxSelection": true,
    			"headerCheckboxSelection": true
    		},
    		{
    			"headerName": "admin_dashboard_users_list_groups_user_count",
    			"field": "user",
    			"editable": false
    		}
    	],
    	"values": groups
    }'
