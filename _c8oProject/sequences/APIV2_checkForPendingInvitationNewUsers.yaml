accessibility: Private
comment: |
  Check pending invites.
  Looks for pending invitations created for new users in API v2 flows.
↓checkForPendingInvitations [steps.SimpleStep-1733332234800]: 
  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    
    let loglevel = "warn";
    var mangoquery = {
    	selector:
    	{
    		"$and": [
    			{
    				"invited": {
    					"$elemMatch": {
    						"$eq": email
    					}
    				}
    			},
    			{
    				"c8o_view_type_published_form": true
    			}
    		]
    	}
    	,
    	fields: [
    		"_id",
    		"invited",
    		"shared",
    		"c8oGrp"
    	],
    	limit: 1000,
    	"use_index": [
    		"mangoIndexes2",
    		"c8o_view_type_published_form_invited"
    	]
    };
    var res = toJSON(fsclient.postFind("c8oforms_fs", toJettison(mangoquery)));
    if (res.docs) {
    	for (var doc of res.docs) {
    		var invited_after = doc.invited.filter((invited) => { return invited != email });
    		var shared_after = doc.shared;
    		if (shared_after != undefined) {
    			shared_after.push(grp);
    		}
    		else {
    			shared_after = [grp];
    		}
    		var c8oGrp_after = doc.c8oGrp;
    		if (c8oGrp_after != undefined) {
    			c8oGrp_after[grp] = true;
    		}
    		else {
    			c8oGrp_after = {};
    			c8oGrp_after[grp] = true;
    		}
    		var mergeRules = new HashMap();
    		mergeRules.put(java.util.Arrays.asList(new java.lang.String("shared")), new java.lang.String("override"));
    		mergeRules.put(java.util.Arrays.asList(new java.lang.String("invited")), new java.lang.String("override"));
    		mergeRules.put(java.util.Arrays.asList(new java.lang.String("c8oGrp")), new java.lang.String("override"));
    		let response_published = toJSON(fsclient.postDocument(java.lang.String("c8oforms_fs"), toJettison({ _id: doc._id, shared: shared_after, c8oGrp: c8oGrp_after, invited: invited_after }), new HashMap(), enums.CouchPostDocumentPolicy.merge, mergeRules, false));
    	}
    }'
