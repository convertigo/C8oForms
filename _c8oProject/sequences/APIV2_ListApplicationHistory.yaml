↓id [variables.RequestableVariable-1790180000001]: 
  comment: Identifier of the draft application.
↓limit [variables.RequestableVariable-1790180000002]: 
  comment: Number of versions per page (1 to 50).
  value: 20
↓before [variables.RequestableVariable-1790180000003]: 
  comment: Cursor returned as next by the previous page (JSON array); empty for the first page.
