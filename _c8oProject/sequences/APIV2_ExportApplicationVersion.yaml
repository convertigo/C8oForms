accessibility: Hidden
authenticatedContextRequired: true
comment: |
  Export an application version (#1359).
  Downloads one version of a draft application as a .c8oforms file, in the format of the application export.
↓exportVersion [steps.SimpleStep-1790180000028]: 
  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    include("js/application_history.js");
    
    var authenticatedUserID = context.getAuthenticatedUser();
    var res = {};
    var val = null;
    var fileName = null;
    var draft = getDoc("" + id, null, "c8oforms_fs");
    if (!c8oHistory.isDraft(draft)) {
    	res.error = "not_found";
    }
    else if (!canEditFormDocument(draft, authenticatedUserID)) {
    	res.error = "unauthorized";
    }
    else {
    	try {
    		var entry = c8oHistory.readEntry(draft._id, "" + entryId);
    		var file = entry != null ? c8oHistory.exportFile(draft._id, entry) : null;
    		if (file == null) {
    			res.error = "not_found";
    		}
    		else {
    			res.ok = true;
    			val = encodeTxtToBase64Binary(JSON.stringify(file) + "");
    			fileName = encodeURIComponent((file.name || draft._id) + "") + ".c8oforms";
    		}
    	}
    	catch (e) {
    		log.error("application history: unable to export " + entryId + " of " + id + ": " + e);
    		res = { error: "history_failed" };
    	}
    }'
