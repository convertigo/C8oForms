comment: |
  List known users.
  Formats known users for UI selectors including groups and badges.
↓Sequence_JS [steps.SimpleStep-1750839841201]: 
  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    var res = {};
    users = callSequence("C8Oforms", "getKnownUsers", {})["document"]["transaction"]["document"]["couchdb_output"]["rows"];
    //prevent from bug when there are only 1 response
    if (!isArray(users)) {
    	users = [users];
    }
    function cleanUserDisplayValue(value) {
    	if (value == undefined || value == null) {
    		return "";
    	}
    	var text = ("" + value).trim();
    	return text == "undefined" ? "" : text;
    }
    function formatKnownUser(x) {
    	var displayName = cleanUserDisplayValue(x.value.displayName);
    	if (displayName == "") {
    		displayName = (cleanUserDisplayValue(x.value.name) + " " + cleanUserDisplayValue(x.value.surname)).trim();
    	}
    	var displayMail = cleanUserDisplayValue(x.value.mail);
    	var display = displayName != "" && displayMail != "" ? displayName + " " + displayMail : (displayName != "" ? displayName : displayMail);
    	if (display == "") {
    		display = cleanUserDisplayValue(x.id).replace(/^C8Oreserved_/, "");
    	}
    	return {
    		"value": x.id,
    		"displayName": displayName,
    		"displayMail": displayMail,
    		"display": display,
    		"picture": x.value.picture,
    		"type": "user"
    	}
    }
    users = users.map((x) => {
    	return formatKnownUser(x);
    });
    res.users = users;'
