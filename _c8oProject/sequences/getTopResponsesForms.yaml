↓Sequence_JS1 [steps.SimpleStep-1739291107328]: 
  expression: |
    'var result = result.reduce(function(accumulateur, element) {
      if (!element.key) return accumulateur;
      
      var existant = accumulateur.find(function(e) { return e.key === element.key; });
      
      if (existant) {
        existant.value += element.value;
      } else {
        accumulateur.push({
          key: element.key,
          value: element.value
        });
      }
      
      return accumulateur;
    }, []);
    
