  expression: |
    '// Imports and helpers functions
    include("js/common.js");
    let res = toJSON(fsclient.getDocument("c8oforms_fs", ''C8Oreserved_''+authenticatedUserID));
    
    // get current user rights
    var editing_rights = res.editing_rights == undefined ? editing_apps_default_rights == "true" : (res.editing_rights === true || res.editing_rights == "true");
    var nocode_db_rights = res.nocode_db_rights == undefined ? no_code_db_default_rights == "true" : (res.nocode_db_rights === true || res.nocode_db_rights == "true");
    var admin = res.admin != undefined && (res.admin === true || res.admin == "true");
    var admin_readonly = res.admin_readonly != undefined && (res.admin_readonly === true || res.admin_readonly == "true");
    var formulas = res.formulas == undefined ? formulas_default_rights == "true" : (res.formulas === true || res.formulas == "true");
    var publication_right = res.publication == undefined ? publication == "true" : (res.publication === true || res.publication == "true");
    var published_First = (res.published_First === true || res.published_First == "true") ? "true" : "false";
    
    res.editing_rights = editing_rights;
    res.nocode_db_rights = nocode_db_rights;
    res.formulas = formulas;
    res.publication = publication_right;
    res.admin = admin;
    res.admin_readonly = admin_readonly;
    res.published_First = published_First;
    
    if (res.mcp != undefined) {
    	var publicMcp = {};
    	publicMcp.tokens = [];
    	if (res.mcp.tokens != undefined) {
    		var mcpTokens = Array.isArray(res.mcp.tokens) ? res.mcp.tokens : [res.mcp.tokens];
    		for (var i = 0; i < mcpTokens.length; i++) {
    			var token = mcpTokens[i] || {};
    			publicMcp.tokens.push({
    				id: token.id || "",
    				name: token.name || "",
    				createdAt: token.createdAt || "",
    				expiresAt: token.expiresAt || "",
    				lastUsedAt: token.lastUsedAt || "",
    				revokedAt: token.revokedAt || "",
    				status: token.revokedAt != undefined && String(token.revokedAt).length > 0 ? "revoked" : "active",
    				scope: token.scope || "forms:write"
    			});
    		}
    	}
    	res.mcp = publicMcp;
    }
    
    var groups = callSequence("lib_FullSyncGrp", "GroupsOf", { user: authenticatedUserID }).document.group;
    res.groups = groups;
    // if user has all rights no need to search forward in groups to find other rights
    if(editing_rights && nocode_db_rights && admin && formulas && admin_readonly && publication_right){
    	
    }
    else{
    	//search in groups rights
    	
    	if(groups != undefined){
    		if(!Array.isArray(groups)){
    			groups = [groups];
    		}
    		query = new HashMap();
    		query.put(''reduce'', ''false'');
    		query.put(''include_docs'', ''true'');
    		keys = toJettison(groups);
    		groups = toJSON(fsclient.postView("c8oforms_fs", ''groups'', ''rightsByUser'', query, keys)).rows;
    		console.log("my groups :", groups, "warn");
    		if(groups != undefined){
    			for(var group of groups){
    				if(!editing_rights){
    					editing_rights = group.doc.editing_rights;
    				}
    				if(!nocode_db_rights){
    					nocode_db_rights = group.doc.nocode_db_rights;
    				}
    				if(!admin){
    					admin = group.doc.admin;
    				}
    				if(!admin_readonly){
    					admin_readonly = group.doc.admin_readonly;
    				}
    				if(!formulas){
    					formulas = group.doc.formulas;
    				}
    				if(!publication_right){
    					publication_right = group.doc.publication;
    				}
    				if(editing_rights && nocode_db_rights && admin && formulas && admin_readonly && publication_right){
    					break;
    				}
    			}
    		}
    		res.editing_rights = editing_rights;
    		res.nocode_db_rights = nocode_db_rights;
    		res.admin = admin;
    		res.admin_readonly = admin_readonly;
    		res.formulas = formulas;
    		res.publication = publication_right;
    	}
    }'
