↓isGoogleEmail [steps.SimpleStep-1747661312515]: 
  expression: |
    '	
    let isGoogle = false;
    try {
    	if (email.indexOf(''@'') != -1) {	
    		let domain = email.split("@")[1];
    		
    	    let dirContext = new javax.naming.directory.InitialDirContext();
    	    let attributes = dirContext.getAttributes("dns:/" + domain, ["MX"]);
    	    let mxAttr = attributes.get("MX");
    	    if (mxAttr != null) {
    	        let mxRecords = mxAttr.getAll();
    	        while (mxRecords.hasMore()) {
    	            let record = mxRecords.next().toString().toLowerCase();
    	            if (record.includes("google.com")) {
    	                isGoogle = true;
    	                break;
    	            }
    	        }
    	    }
    	}
    } catch (e) {
        log.warn(e);
    }
    
    '
