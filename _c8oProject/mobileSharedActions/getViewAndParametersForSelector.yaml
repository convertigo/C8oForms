          '		try {
          			//define ddoc names
          		    const ddocPublished = "published_formsV2";
          		    const ddocDrafts = "formsV2";
          		    // get value of navparams published
          		    let navParamsPublished = page["navParams"].get(''published'');
          		    if(navParamsPublished != undefined && navParamsPublished != ":published"){
          		        let bool = navParamsPublished == true || navParamsPublished == "true";
                          page.local.published = ((page.global.settings.editing_rights != undefined && (page.global.settings.editing_rights == "true" || page.global.settings.editing_rights == true)) || page.global.settings.editing_rights == undefined) ? bool : true;
                      }
                      else{
                          let bool = page.global.settings["published_First"] == true || page.global.settings["published_First"] == "true";
                          page.local.published = ((page.global.settings.editing_rights != undefined && (page.global.settings.editing_rights == "true" || page.global.settings.editing_rights == true)) || page.global.settings.editing_rights == undefined) ? bool : true;
                          let url : string = window.location.href;
                          page.c8o.log.debug("set new url: \nprevious was: "+url);
                          var index;
                          if(url.indexOf("selector/:published") != -1){
                              index =  url.indexOf("selector/:published") + 9;
                              url = url.substring(0, index) + page.local.published + url.substring(index+10);
                          }
                          else if(url.indexOf("selector/%3Apublished") != -1){
                              index =  url.indexOf("selector/%3Apublished") + 9;
                              url = url.substring(0, index) + page.local.published + url.substring(index+12);
                          }
                          // TODO
                          //window.location.href = url;
                          page.c8o.log.debug("set new url: \nprevious was: "+url +" \nindex is: "+index+ " \nnew url is: "+url);
                         
                      }
          		    // define ddoc switch type of page
                      if(page.local.published == true || page.local.published == "true"){
                          page.local["ddoc"] = ddocPublished;
                      }
                      else{
                          if((page.global.settings.editing_rights != undefined && (page.global.settings.editing_rights == "true" || page.global.settings.editing_rights == true)) || page.global.settings.editing_rights == undefined){
                              page.local["ddoc"] = ddocDrafts;
                          }
                          else{
                              page.local["ddoc"] = ddocPublished;
                          }
                          
                      }
                      const canUseNocodeDatabase = page.global?.settings?.nocode_db_rights == "true" || page.global?.settings?.nocode_db_rights == true;
                      const isDatabaseArea = (page.local.nocodedatabase == true) || (navParamsPublished == "nocodedatabase" && canUseNocodeDatabase);
                      page.local.nocodedatabase = isDatabaseArea;
                      const isPublicationArea = !isDatabaseArea && (page.local.published == true || page.local.published == "true");
                      page.local.selectedTab = isPublicationArea ? "publication" : "edition";
                      page.global.menuItems = [
                        { label: ''ACCUEIL'', items: {edition: {badge: 1, active: !isDatabaseArea && !isPublicationArea}, publication:{badge: 0, active: isPublicationArea}, nocode: {badge: 0, active: isDatabaseArea}} },
                        { label: ''SUPPORT'', items: {rgpd: {badge: 0, active: false}, support: {badge: 0, active: false}}},
                        { label: ''GESTION'', items: {home: {badge: 0, active: false}, users: {badge: 0, active: false}, groups: {badge: 0, active: false},rgpd: {badge: 0, active: false}, settings: {badge: 0, active: false}}}
                      ];
          			
          		} catch (e) {
          			console.error("my err ", e);
          		
          		} finally {
          			return;
          		}
