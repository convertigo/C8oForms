        →: |
          '		const form = page["navParams"]?.data?.form;
          		page.local.historyBusy = true;
          		page.ref.detectChanges();
          		try {
          			const res = (await page.c8o.callJsonObject("C8Oforms.APIV2_CreateApplicationVersion", {
          				id: form._id,
          				label: page.local.historyLabel ?? ""
          			}).async()).res;
          			if (res?.ok === true) {
          				page.local.historyLabel = "";
          				return {msg: page["translate"].instant("history_create_success"), cssClass: "toastSuccess"};
          			}
          			return {msg: page["translate"].instant(res?.error == "unauthorized" ? "history_error_unauthorized" : "history_error_operation"), cssClass: "toastError"};
          		}
          		catch (e) {
          			page.c8o.log.error("[history] unable to create a version", e);
          			return {msg: page["translate"].instant("history_error_operation"), cssClass: "toastError"};
          		}
          		finally {
          			page.local.historyBusy = false;
          			page.ref.detectChanges();
          		}
          '
  comment: Records the current state as a manual version labelled page.local.historyLabel.
