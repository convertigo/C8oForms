      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '		// Adds the chosen .c8oforms file to the history; it is applied like any version, by restoring it.
          		const input: any = event?.target;
          		const file: any = input?.files?.[0];
          		if (file == null) {
          			return {skip: true};
          		}
          		const form = page["navParams"]?.data?.form;
          		page.local.historyBusy = true;
          		page.ref.detectChanges();
          		try {
          			const res = (await page.c8o.callJsonObject("C8Oforms.APIV2_ImportApplicationVersion", {
          				id: form._id,
          				meta: await file.text(),
          				label: file.name
          			}).async()).res;
          			if (res?.ok === true) {
          				return {msg: page["translate"].instant("history_import_success"), cssClass: "toastSuccess"};
          			}
          			const key = res?.error == "invalid_file" ? "history_error_invalid_file" : (res?.error == "unauthorized" ? "history_error_unauthorized" : "history_error_operation");
          			return {msg: page["translate"].instant(key), cssClass: "toastError"};
          		}
          		catch (e) {
          			page.c8o.log.error("[history] unable to import a version", e);
          			return {msg: page["translate"].instant("history_error_operation"), cssClass: "toastError"};
          		}
          		finally {
          			// lets the same file be chosen again
          			input.value = "";
          			page.local.historyBusy = false;
          			page.ref.detectChanges();
          		}
          '
  comment: Reads the file chosen in the (change) event and calls APIV2_ImportApplicationVersion.
