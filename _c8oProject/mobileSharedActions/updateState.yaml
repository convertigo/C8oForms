                      		for (const flow of params.meta.flows) {
                      			await normalizeElementsList(flow?.elements);
                      		}
                      	}
                      	await normalizeElementsList(params?.meta?.actions);
                      }
                      catch (e) {
                      }
                      
                      params.meta = JSON.stringify(params.meta);
                      
