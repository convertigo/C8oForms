                      	return value.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (match, raw) => {
                      		const resolved = resolvePlaceholderToken(raw, nameToId);
                      		return resolved != null ? `<span>${resolved}</span>` : match;
