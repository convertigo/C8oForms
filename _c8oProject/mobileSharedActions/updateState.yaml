                      const resolvePlaceholderToken = (rawToken, nameToId) => {
                      	const token = (rawToken || "").trim();
                      	if (token === "") {
                      		return null;
                      	}
                      	if (token.indexOf("api.") == 0 || token.indexOf("await api.") == 0) {
                      		let apiPath = token;
                      		if (apiPath.indexOf("await ") == 0) {
                      			apiPath = apiPath.substring(6).trim();
                      		}
                      		let apiName = apiPath.split(".").slice(-1)[0] || null;
                      		if (apiName != null && apiName.indexOf("(") != -1) {
                      			apiName = apiName.split("(")[0];
                      		}
                      		return buildC8oToken(1, apiPath, apiName);
                      	}
                      	let cleaned = token;
                      	if (cleaned.indexOf("fields.") == 0) {
                      		cleaned = cleaned.substring(7);
                      	}
                      	if (cleaned.indexOf("field.") == 0) {
                      		cleaned = cleaned.substring(6);
                      	}
                      	if (cleaned.indexOf("actions.") == 0) {
                      		cleaned = cleaned.substring(8);
                      	}
                      	const parts = cleaned.split(".");
                      	const name = parts.shift();
                      	const path = parts.join(".");
                      	const id = name != null ? nameToId[name] : null;
                      	if (id != null && id !== "") {
                      		return buildC8oToken(id, path, null);
                      	}
                      	return null;
                      };
                      const replaceVarsPlaceholders = (value) => {
                      	if (typeof value != "string" || value.indexOf("{{") == -1) {
                      		return value;
                      	}
                      	const nameToId = getNameToIdMap();
                      	return value.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (match, raw) => {
