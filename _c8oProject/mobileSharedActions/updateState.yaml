                      	if (elem.actions != null) {
                      		await normalizeActions(elem.actions);
                      	}
                      	if (Array.isArray(elem.children)) {
                      		for (const child of elem.children) {
                      			await normalizeElement(child);
                      		}
                      	}
                      };
                      const normalizeElementsList = async (elements) => {
                      	if (!Array.isArray(elements)) {
                      		return;
                      	}
                      	for (const elem of elements) {
                      		await normalizeElement(elem);
                      	}
                      };
