          	                    }else{
          	                        page["addElement"](vars.type);
          	                    }
          		            }else{
          		                page["addElement"](vars.type);
          		            }
          		        }else{
          		            page["addElement"](vars.type);
          		        }
          		    }else{
          				if(!page.local.flow){
          					page.local.flow = true;
          					if(vars.type == "submit"){
          						page.local.currentPage = 'submit';
          						page.local.currentIndex = 1;
          					}
          					else{
          						page.local.currentPage = 'formulas';
          						page.local.currentIndex = 0;
          					}
          				}
          				else if(!(vars.type == "business_logic") && page.local.currentPage == 'formulas'){
          					page.local.currentPage = 'submit';
          					page.local.currentIndex = 1;
          				}
          				if(vars.custom == "true" || vars.custom === true){
          					page["addElement"](vars.type, null, null, false, true, 'childrenRefs', vars.elems);
          				}
          				else{
          					page["addElement"](vars.type, null, null, false, true);
          				}
          		        
          		    }
          		}
          		resolve();
          
