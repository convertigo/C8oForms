          		if(page["pageOwner"]){
          			page = page["pageOwner"];
          		}
          		if(vars.type && vars.type != ""){
          		    if(vars.cat != "action"){
          				if(page.local.flow){
          					page.local.currentPage = page.form["pages"][0].pageTechName;
          					page.local.currentIndex = 0;
          					page.local.flow = false;
          				}
