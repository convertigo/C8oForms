          	function prepareGridExport(agGrid: any, filePrefix?: string): any {
          		const api = agGrid?.api;
          
          		if (
          			api == null ||
          			typeof api.getAllDisplayedColumns !== "function" ||
          			typeof api.forEachNodeAfterFilterAndSort !== "function"
          		) {
          			throw new Error("Grid export is unavailable");
          		}
          
          		const normalizeGridExportValue = (column: any, value: any): any => {
          			if (
          				column.getColDef().cellDataType === "object" &&
          				value
          			) {
          				return (value?.type == ''html'') ? (
          					value.value?.value ??
          					value.value?.[0]?.value ??
          					value.value ??
          					""
          				) : (
          					value.displayValue ??
          					value.value?.value ??
          					value.value?.[0]?.value ??
          					value.value ??
          					""
          				);
          			}
          
          			return value ?? "";
          		};
          
          //		const columns: any[] = api.getAllDisplayedColumns() || [];
          		const columns: any[] = (api.getAllDisplayedColumns() || []).filter((column: any) => {
          			const colDef = column.getColDef?.() || {};
          		
          			const displayedName =
          				api.getDisplayNameForColumn?.(column, "csv") ||
          				colDef.headerName ||
          				"";
          		
          			return String(displayedName).trim() !== "";
          		});
          		
          		if (columns.length === 0) {
          			throw new Error("Grid has no visible columns");
          		}
          
          		const usedHeaders: any = {};
          
          		const headers = columns.map((column: any) => {
          			const colDef = column.getColDef?.() || {};
          
          			const displayed =
          				api.getDisplayNameForColumn?.(column, "csv") ||
          				colDef.headerName ||
          				colDef.field ||
          				column.getColId?.() ||
          				"Column";
          
          			const base = String(displayed);
          
          			usedHeaders[base] = (usedHeaders[base] || 0) + 1;
          
          			return usedHeaders[base] === 1
          				? base
          				: base + " (" + usedHeaders[base] + ")";
          		});
          
          
          		const rows: any[] = [];
          
          		api.forEachNodeAfterFilterAndSort((node: any) => {
          			const row: any = {};
          			console.log(node)
          			columns.forEach((column: any, index: number) => {
          				const colDef = column.getColDef?.() || {};
          				console.log(column, colDef)
          				let value: any;
          //				console.log(
          //					"XLSX RAW",
          //					headers[index],
          //					{
          //						cellDataType: colDef.cellDataType,
          //						raw: api.getValue?.(column.getColId?.(), node),
          //						formatted: typeof api.getCellValue === "function"
          //							? api.getCellValue({
          //								rowNode: node,
          //								colKey: column,
          //								useFormatter: true
          //							})
          //							: undefined
          //					}
          //				);
          
          				if (colDef.cellDataType === "object") {
          					value = api.getValue?.(
          						column.getColId?.(),
          						node
          					);
          
          					value = normalizeGridExportValue(
          						column,
          						value
          					);
          				}
          				else {
          					// For standard cells, preserve the displayed/formatted value.
          					if (typeof api.getCellValue === "function") {
          						try {
          							value = api.getCellValue({
          								rowNode: node,
          								colKey: column,
          								useFormatter: true
          							});
          						}
          						catch (e) {
          							value = undefined;
          						}
          					}
          
          					if (value === undefined) {
          						value = api.getValue?.(
          							column.getColId?.(),
          							node
          						);
          
          						if (typeof colDef.valueFormatter === "function") {
          							try {
          								value = colDef.valueFormatter({
          									value: value,
          									data: node.data,
          									node: node,
          									colDef: colDef,
          									column: column,
          									api: api,
          									context: api.getGridOption?.("context")
          								});
          							}
          							catch (e) {
          							}
          						}
          					}
          				}
          
          				row[headers[index]] = value == null ? "" : value;
          			});
          
          			rows.push(row);
          		});
          
          		const now = new Date();
          
          		const stamp = [
          			now.getFullYear(),
          			String(now.getMonth() + 1).padStart(2, "0"),
          			String(now.getDate()).padStart(2, "0"),
          			"_",
          			String(now.getHours()).padStart(2, "0"),
          			String(now.getMinutes()).padStart(2, "0"),
          			String(now.getSeconds()).padStart(2, "0")
          		].join("");
          
          		const safePrefix =
          			String(filePrefix || "grid")
          				.normalize("NFD")
          				.replace(/[\u0300-\u036f]/g, "")
          				.replace(/[^A-Za-z0-9_-]+/g, "_")
          				.replace(/^_+|_+$/g, "")
          				.slice(0, 64) || "grid";
          
          		const unique = Math.random()
          			.toString(36)
          			.slice(2, 8);
          
          		return {
          			rows: rows,
          			fileName:
          				safePrefix +
          				"_" +
          				stamp +
          				"_" +
          				unique +
          				"." +
          				vars.book_type,
          			sheetName: "Export"
          		};
          	}	
          //			const api = vars.agGrid.api;
          			console.log(''EXPPORT'',vars)
          			const api = vars.ag_grid.api
          			// Colonnes actuellement affichées, dans l''ordre du Grid
          			const columns = api.getAllDisplayedColumns();
          	
          			const exportData = [];
          			
          			vars.component.xlsxExporting = true;
          			try {
          			    resolve(prepareGridExport(vars.ag_grid, vars.file_prefix));
          			}
          			catch (error) {
          			    vars.component.xlsxExporting = false;
          			    reject(error);
          			}
          			
