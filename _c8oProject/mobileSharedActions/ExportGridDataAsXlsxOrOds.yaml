          '	function prepareGridExport(agGrid: any, filePrefix?: string): any {
          		const api = agGrid?.api;
          
          		if (
          			api == null ||
          			typeof api.getAllDisplayedColumns !== "function" ||
          			typeof api.forEachNodeAfterFilterAndSort !== "function"
          		) {
          			throw new Error("Grid export is unavailable");
          		}
          
          		const normalizeGridExportValue = (
          			column: any,
          			value: any
          		): any => {
          			if (
          				column.getColDef().cellDataType === "object" &&
          				value
          			) {
          				const rawValue =
          					value.value?.value ??
          					value.value?.[0]?.value ??
          					value.value ??
          					"";
          
          				if (rawValue == null || rawValue === "") {
          					return "";
          				}
          
          				if (value.cType === "number") {
          					const numericValue = Number(rawValue);
          
          					return Number.isFinite(numericValue)
          						? numericValue
          						: rawValue;
          				}
          
          				if (value.cType === "boolean") {
          					if (typeof rawValue === "boolean") {
          						return rawValue;
          					}
          
          					if (rawValue === "true") {
          						return true;
          					}
          
          					if (rawValue === "false") {
          						return false;
          					}
          				}
          
          				return rawValue;
          			}
          
          			return value ?? "";
          		};
          
          		const columns: any[] = (api.getAllDisplayedColumns() || []).filter((column: any) => {
          			const colDef = column.getColDef?.() || {};
          		
          			const displayedName =
          				api.getDisplayNameForColumn?.(column, "csv") ||
          				colDef.headerName ||
          				"";
          		
          			return String(displayedName).trim() !== "";
          		});
          		
          		if (columns.length === 0) {
          			throw new Error("Grid has no visible columns");
          		}
          
          		const usedHeaders: any = {};
          
          		const headers = columns.map((column: any) => {
          			const colDef = column.getColDef?.() || {};
          
          			const displayed =
          				api.getDisplayNameForColumn?.(column, "csv") ||
          				colDef.headerName ||
          				colDef.field ||
          				column.getColId?.() ||
          				"Column";
          
          			const base = String(displayed);
          
          			usedHeaders[base] = (usedHeaders[base] || 0) + 1;
          
          			return usedHeaders[base] === 1
          				? base
          				: base + " (" + usedHeaders[base] + ")";
          		});
          
          
          		const rows: any[] = [];
          
          		api.forEachNodeAfterFilterAndSort((node: any) => {
          			const row: any = {};
          			columns.forEach((column: any, index: number) => {
          				const colDef = column.getColDef?.() || {};
          				let value: any;
          				const rawValue = api.getValue?.(
          					column.getColId?.(),
          					node
          				);
          				if (colDef.headerName === "Budget") {
          					let formattedValue: any;
          					let filterValue: any;
          
          					try {
          						formattedValue = colDef.valueFormatter?.({
          							value: rawValue,
          							data: node.data,
          							node: node,
          							colDef: colDef,
          							column: column,
          							api: api,
          							context: api.getGridOption?.("context")
          						});
          					}
          					catch (e) {
          						formattedValue = "ERROR";
          					}
          
          					try {
          						filterValue = colDef.filterValueGetter?.({
          							data: node.data,
          							node: node,
          							colDef: colDef,
          							column: column,
          							api: api,
          							context: api.getGridOption?.("context")
          						});
          					}
          					catch (e) {
          						filterValue = "ERROR";
          					}
          
          					console.log("BUDGET EXPORT", {
          						rawValue,
          						nodeData: node.data,
          						directNodeValue: node.data?.[colDef.field],
          						formattedValue,
          						filterValue
          					});
          				}
          				if (colDef.cellDataType === "object") {
          					value = api.getValue?.(
          						column.getColId?.(),
          						node
          					);
          
          					value = normalizeGridExportValue(
          						column,
          						value
          					);
          				}
          				else {
          					if (rawValue == null || rawValue === "") {
          						value = "";
          					}
          					else if (colDef.cellDataType === "number") {
          						const numericValue = Number(rawValue);
          
          						value = Number.isFinite(numericValue)
          							? numericValue
          							: rawValue;
          					}
          					else if (colDef.cellDataType === "boolean") {
          						if (typeof rawValue === "boolean") {
          							value = rawValue;
          						}
          						else if (rawValue === "true") {
          							value = true;
          						}
          						else if (rawValue === "false") {
          							value = false;
          						}
          						else {
          							value = rawValue;
          						}
          					}
          					else {
          						value = rawValue;
          
          						if (typeof colDef.valueFormatter === "function") {
          							try {
          								value = colDef.valueFormatter({
          									value: rawValue,
          									data: node.data,
          									node: node,
          									colDef: colDef,
          									column: column,
          									api: api,
          									context: api.getGridOption?.("context")
          								});
          							}
          							catch (e) {
          								value = rawValue;
          							}
          						}
          					}
          				}
          
          				row[headers[index]] = value == null ? "" : value;
          			});
          
          			rows.push(row);
          		});
          
          		const now = new Date();
          
          		const stamp = [
          			now.getFullYear(),
          			String(now.getMonth() + 1).padStart(2, "0"),
          			String(now.getDate()).padStart(2, "0"),
          			"_",
          			String(now.getHours()).padStart(2, "0"),
          			String(now.getMinutes()).padStart(2, "0"),
          			String(now.getSeconds()).padStart(2, "0")
          		].join("");
          
          		const safePrefix =
          			String(filePrefix || "grid")
          				.normalize("NFD")
          				.replace(/[\u0300-\u036f]/g, "")
          				.replace(/[^A-Za-z0-9_-]+/g, "_")
          				.replace(/^_+|_+$/g, "")
          				.slice(0, 64) || "grid";
          
          		const unique = Math.random()
          			.toString(36)
          			.slice(2, 8);
          
          		return {
          			rows: rows,
          			fileName:
          				safePrefix +
          				"_" +
          				stamp +
          				"_" +
          				unique +
          				"." +
          				vars.book_type,
          			sheetName: "Export"
          		};
          	}	
          			const api = vars.ag_grid.api
          			// Colonnes actuellement affichées, dans l''ordre du Grid
          			const columns = api.getAllDisplayedColumns();
          	
          			const exportData = [];
          			
          			const exportingFlag = vars.book_type + "Exporting";
          
          			if (vars.component) {
          				vars.component[exportingFlag] = true;
          			}
          
          			resolve(
          				prepareGridExport(
          					vars.ag_grid,
          					vars.file_prefix
          				)
          			)
          '
