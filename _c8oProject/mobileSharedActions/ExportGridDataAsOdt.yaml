          		function prepareGridExport(agGrid: any, filePrefix?: string): any {
          			const api = agGrid?.api;
          
          			if (
          				api == null ||
          				typeof api.getAllDisplayedColumns !== "function" ||
          				typeof api.forEachNodeAfterFilterAndSort !== "function"
          			) {
          				throw new Error("Grid export is unavailable");
          			}
          
          			const columns: any[] = (api.getAllDisplayedColumns() || []).filter((column: any) => {
          				const colDef = column.getColDef?.() || {};
          
          				const displayedName =
          					api.getDisplayNameForColumn?.(column, "csv") ||
          					colDef.headerName ||
          					"";
          
          				return String(displayedName).trim() !== "";
          			});
          
          			if (columns.length === 0) {
          				throw new Error("Grid has no visible columns");
          			}
          
          			const headers: string[] = columns.map((column: any) => {
          				const colDef = column.getColDef?.() || {};
          
          				return String(
          					api.getDisplayNameForColumn?.(column, "csv") ||
          					colDef.headerName ||
          					colDef.field ||
          					column.getColId?.() ||
          					"Column"
          				);
          			});
          
          			const normalizeGridExportValue = (column: any, value: any): any => {
          				if (
          					column.getColDef().cellDataType === "object" &&
          					value
          				) {
          					return (value?.type == ''html'') ? (
          						value.value?.value ??
          						value.value?.[0]?.value ??
          						value.value ??
          						""
          					) : (
          						value.displayValue ??
          						value.value?.value ??
          						value.value?.[0]?.value ??
          						value.value ??
          						""
          					);
          				}
          
          				return value ?? "";
          			};
          
          			const rows: string[][] = [];
          
          			api.forEachNodeAfterFilterAndSort((node: any) => {
          				const row: string[] = [];
          
          				columns.forEach((column: any) => {
          					const colDef = column.getColDef?.() || {};
          
          					let value: any;
          
          					if (colDef.cellDataType === "object") {
          						value = api.getValue?.(
          							column.getColId?.(),
          							node
          						);
          
          						value = normalizeGridExportValue(
          							column,
          							value
          						);
          					}
          					else {
          						if (typeof api.getCellValue === "function") {
          							try {
          								value = api.getCellValue({
          									rowNode: node,
          									colKey: column,
          									useFormatter: true
          								});
          							}
          							catch (e) {
          								value = undefined;
          							}
          						}
          
          						if (value === undefined) {
          							value = api.getValue?.(
          								column.getColId?.(),
          								node
          							);
          
          							if (typeof colDef.valueFormatter === "function") {
          								try {
          									value = colDef.valueFormatter({
          										value: value,
          										data: node.data,
          										node: node,
          										colDef: colDef,
          										column: column,
          										api: api,
          										context: api.getGridOption?.("context")
          									});
          								}
          								catch (e) {
          								}
          							}
          						}
          					}
          
          					row.push(
          						value == null
          							? ""
          							: String(value)
          					);
          				});
          
          				rows.push(row);
          			});
          
          			const now = new Date();
          
          			const stamp = [
          				now.getFullYear(),
          				String(now.getMonth() + 1).padStart(2, "0"),
          				String(now.getDate()).padStart(2, "0"),
          				"_",
          				String(now.getHours()).padStart(2, "0"),
          				String(now.getMinutes()).padStart(2, "0"),
          				String(now.getSeconds()).padStart(2, "0")
          			].join("");
          
          			const safePrefix =
          				String(filePrefix || "grid")
          					.normalize("NFD")
          					.replace(/[\u0300-\u036f]/g, "")
          					.replace(/[^A-Za-z0-9_-]+/g, "_")
          					.replace(/^_+|_+$/g, "")
          					.slice(0, 64) || "grid";
          
          			const unique = Math.random()
          				.toString(36)
          				.slice(2, 8);
          
          			const fileName =
          				safePrefix +
          				"_" +
          				stamp +
          				"_" +
          				unique +
          				".odt";
          
          			return {
          				fileName: fileName,
          				outputFilename:
          					".//outputs/" +
          					fileName,
          				table: [
          					headers,
          					...rows
          				]
          			};
          		}
          
          
          		function resolveBinUrl(explicitUrl?: any): string {
          			if (
          				explicitUrl != null &&
          				String(explicitUrl).trim() !== ""
          			) {
          				return String(explicitUrl).trim();
          			}
          
          			const currentUrl = window.location.href;
          			const projectsMarker = "/projects/";
          			const projectsIndex =
          				currentUrl.indexOf(projectsMarker);
          
          			if (projectsIndex >= 0) {
          				return (
          					currentUrl.substring(
          						0,
          						projectsIndex
          					) +
          					"/projects/C8Oforms/.bin"
          				);
          			}
          
          			return (
          				window.location.origin +
          				"/convertigo/projects/C8Oforms/.bin"
          			);
          		}
          
          
          		try {
          			
          
          			if (vars.component) {
          				vars.component.odtExporting = true;
          			}
          			
          			
          			const prepared = prepareGridExport(
          				vars.ag_grid,
          				vars.file_prefix
          			);
          
          			const marker =
          				vars.marker != null &&
          				String(vars.marker).trim() !== ""
          					? String(vars.marker)
          					: "__c8o_grid";
          //
          			const inputFilename =
          				vars.input_filename != null
          					? String(vars.input_filename).trim()
          					: "";
          
          			if (
          				inputFilename === "" ||
          				!/^[\w.-]+\.odt$/i.test(inputFilename)
          			) {
          				throw new Error(
          					"Invalid ODT template name"
          				);
          			}
          //
          			const markers = JSON.stringify([
          				{
          					tag: marker,
          					type: "tableh",
          					value: prepared.table
          				}
          			]);
          
          			const binUrl =
          				resolveBinUrl(vars.bin_url);
          
          			const form =
          				document.createElement("form");
          
          			form.method = "POST";
          			form.action = binUrl;
          			form.target = "_self";
          			form.style.display = "none";
          			form.acceptCharset = "UTF-8";
          
          			const appendField = (
          				name: string,
          				value: any
          			) => {
          				const input =
          					document.createElement("input");
          
          				input.type = "hidden";
          				input.name = name;
          				input.value =
          					value == null
          						? ""
          						: String(value);
          
          				form.appendChild(input);
          			};
          
          			appendField(
          				"__sequence",
          				"GetOdtTemplateDirectory"
          			);
          
          			appendField(
          				"template_name",
          				inputFilename
          			);
          
          			appendField(
          				"output_filename",
          				prepared.outputFilename
          			);
          
          			appendField(
          				"markers",
          				markers
          			);
          
          			/*
          			 * Avoid the default "page" break used by u_fill_odt
          			 * for generated tables.
          			 */
          			appendField(
          				"break_before",
          				"auto"
          			);
          
          			document.body.appendChild(form);
          
          			/*
          			 * .bin directly returns the attachment generated by
          			 * u_fill_odt, so the browser starts the ODT download.
          			 */
          			form.submit();
          
          			setTimeout(() => {
          				try {
          					document.body.removeChild(form);
          				}
          				catch (e) {
          				}
          
          				if (vars.component) {
          					vars.component.odtExporting = false;
          				}
          			}, 2000);
          			
          			if (vars.component) {
          				vars.component.odtExporting = false;
          			}
          
          			resolve({
          				fileName:
          					prepared.fileName,
          				outputFilename:
          					prepared.outputFilename,
          				markers: markers
          			});
          		}
          		catch (error) {
          			if (vars.component) {
          				vars.component.odtExporting = false;
          			}
          
          			reject(error);
          		}
          '
