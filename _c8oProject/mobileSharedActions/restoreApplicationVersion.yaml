    ↓Restore [ngx.components.UICustomAsyncAction-1790182000313]: 
      actionValue: 
        - xmlizable: 
          - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
          - com.twinsoft.convertigo.beans.common.FormatedContent: 
            →: |
              '		const form = page["navParams"]?.data?.form;
              		page.local.historyBusy = true;
              		page.ref.detectChanges();
              		try {
              			const res = (await page.c8o.callJsonObject("C8Oforms.APIV2_RestoreApplicationVersion", {
              				id: form._id,
              				entryId: vars.entry.id,
              				rev: page.local.historyRev ?? ""
              			}).async()).res;
              			if (res?.ok === true) {
              				return {
              					close: res.unchanged !== true && page["navParams"]?.data?.fromEditor == true,
              					msg: page["translate"].instant(res.unchanged === true ? "history_restore_unchanged" : "history_restore_success"),
              					cssClass: "toastSuccess"
              				};
              			}
              			const key = res?.error == "conflict" ? "history_error_conflict" : (res?.error == "unauthorized" ? "history_error_unauthorized" : "history_error_operation");
              			return {close: false, msg: page["translate"].instant(key), cssClass: "toastError"};
              		}
              		catch (e) {
              			page.c8o.log.error("[history] unable to restore a version", e);
              			return {close: false, msg: page["translate"].instant("history_error_operation"), cssClass: "toastError"};
              		}
              		finally {
              			page.local.historyBusy = false;
              			page.ref.detectChanges();
              		}
              '
