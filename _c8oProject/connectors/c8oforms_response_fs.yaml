  docdata: 
    →: |
      '{
        "_id": "_design\/stats",
        "filters": {},
        "updates": {},
        "views": {
          "topAnswersForm": {
            "map": "function (doc) {\r\n
          try {\r\n
              if(doc.version !== \"test\"){\r\n
                  emit(doc.formId, 1);\r\n
              }\r\n
              \r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "countAnswersPerForm": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.formId.indexOf(''published_'') != -1) {    \r\n
                  var endIndex = doc.formId.indexOf(\"_anonymous\");\r\n
                  if(endIndex == -1){\r\n
                      emit(doc.formId, 1);\r\n
                  }      \r\n
                  else{\r\n
                      emit(doc.formId.substring(0, endIndex), 1);\r\n
                  }  \r\n
                  \r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "totalAnswersPerDay": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.timestamp !== undefined) {\r\n
                  var date = new Date(Number(doc.timestamp));\r\n
                  var noonDate = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0);\r\n
                  var noonTimestamp = noonDate.getTime();\r\n
                  emit(noonTimestamp, 1);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "proportionTests": {
            "map": "function (doc) {\r\n
          try {\r\n
              if(doc.version == \"test\"){\r\n
                  emit(\"test\", doc._id);\r\n
              }\r\n
              else{\r\n
                  emit(\"prod\", doc._id);\r\n
              }\r\n
              \r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "getInactiveForms": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.formId && doc.timestamp) {\r\n
                  emit(doc.formId, doc.timestamp);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "function (keys, values, rereduce) {\r\n
          try {\r\n
              return Math.max.apply(null, values);\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          }
        }
      }'
