  comment: |
    Design doc stats.
    Views computing statistics for admin dashboards.
  docdata: 
    →: |
      '{
        "_id": "_design\/stats",
        "filters": {},
        "updates": {},
        "views": {
          "topPublishedOwner": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.c8o_view_type_published_form === true && doc.deleted !== true){\r\n
                  emit(doc.creator, 1);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "topPublishedComplex": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.c8o_view_type_published_form === true && doc.deleted !== true){\r\n
                var elementCount = 0;\r\n
                doc.formulaire.forEach(function(item) {\r\n
                  if (item.type === ''ion-card'' && item.children && Array.isArray(item.children)) {\r\n
                    elementCount += item.children.length;\r\n
                  } else {\r\n
                    elementCount += 1;\r\n
                  }\r\n
                });\r\n
                emit([elementCount, doc.creator], elementCount);\r\n
              }\r\n
              \r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          },
          "moreThan5versions": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.c8o_view_type_published_form === true && doc.deleted !== true && +doc.version > 5){\r\n
                  emit(doc.creator, 1);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "countFormsPerDay": {
            "map": "function (doc) {\r\n
          try {\r\n
              if ((doc.c8o_view_type_drafts_form === true || doc.c8o_view_type_published_form === true) \r\n
                  && doc.deleted !== true \r\n
                  && doc.creationDate !== undefined) {            \r\n
                  \r\n
                  var date = new Date(Number(doc.creationDate));\r\n
                  \r\n
                  \/\/ Format YYYY-MM-DD en ajoutant 0 pour les mois et jours à un chiffre\r\n
                  var dateComputedString = String(date.getFullYear()) + ''-'' + \r\n
                      String(date.getMonth() + 1).padStart(2, ''0'') + ''-'' + \r\n
                      String(date.getDate()).padStart(2, ''0'');\r\n
      \r\n
                  emit(dateComputedString, 1);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "totalFormsPerDay": {
            "map": "function (doc) {\r\n
          try {\r\n
              if ((doc.c8o_view_type_drafts_form === true || doc.c8o_view_type_published_form === true) && doc.deleted !== true && doc.creationDate !== undefined) {            \r\n
                  \r\n
                  var date = new Date(Number(doc.creationDate));\r\n
                  var noonDate = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0);\r\n
                  var noonTimestamp = noonDate.getTime();\r\n
                  emit(noonTimestamp, 1);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "total": {
            "map": "function (doc) {\r\n
          try {\r\n
              if(doc.c8o_view_type_published_form === true){\r\n
                  emit(\"total_published_form\", 1);\r\n
              }\r\n
              else if(doc.c8o_view_type_drafts_form === true){\r\n
                  emit(\"total_drafts_form\", 1);\r\n
              }\r\n
              else if(doc.c8o_view_type_users == true){\r\n
                  emit(\"total_users\", 1);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "countUsersByProvider": {
            "map": "function (doc) {\r\n
          try {\r\n
              if(doc.c8o_view_type_users == true && doc.provider != undefined){\r\n
                  emit(doc.provider, doc._id);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "countGroupsByAccess": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.group) {\r\n
                  emit([doc.editing_rights, doc.admin, doc.nocode_db_rights], 1);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          }
        }
      }'
