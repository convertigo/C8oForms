        '/*Begin_c8o_PageImport*/
        type TableItem = {
          id: number;
          name: string;
          order: number;
          database_id: number;
          data_sync: any;
        };
        
        type WorkspaceItem = {
          id: number;
          name: string;
          generative_ai_models_enabled: Record<string, unknown>;
        };
        
        type DatabaseItem = {
          id: number;
          name: string;
          order: number;
          type: string;
          workspace: WorkspaceItem;
          created_on: string;
          tables: TableItem[];
        };
        
        type Selection = {
          workspaceId?: number;
          workspaceName?: string;
          databaseId?: number;
          databaseName?: string;
          tableId?: number;
          tableName?: string;
        };
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		window["p"] = this;
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		/*End_c8o_PageInitialization*/
        /*Begin_c8o_PageAfterViewInit*/
        		/*End_c8o_PageAfterViewInit*/
        /*Begin_c8o_PageFinalization*/
        		/*End_c8o_PageFinalization*/
        /*Begin_c8o_PageFunction*/
        	addInSelectedColumn(colName) {
        		this.local.selectedColumns[colName] = false
        	}
        
        	/**
        	 * Function to get the application ID from a table ID
        	 * 
        	 * Application is in of this structure :
        	 * 
        	 * [
        	 * 	{
        	 * 		"id":85,"name":"Entreprise de pedro","order":1,"type":"database","group":{"id":80,"name":"Rhenus Scan Tracking"},"workspace":{"id":80,"name":"Rhenus Scan Tracking"},
        	 * 	 	"tables":[
        	 * 			{"id":414,"name":"Clients","order":1,"database_id":85},
        	 * 			{"id":415,"name":"Projets","order":2,"database_id":85}]
        	 *  },
        	 * 	{
        	 * 		"id":86,"name":"Tracking","order":2,"type":"database","group":{"id":80,"name":"Rhenus Scan Tracking"},"workspace":{"id":80,"name":"Rhenus Scan Tracking"},
        	 * 		"tables":[
        	 * 			{"id":416,"name":"tracking","order":1,"database_id":86},
        	 * 			{"id":417,"name":"transporteur","order":2,"database_id":86},
        	 *           ...
        	 * 	    ]
        	 *  },
        	 *  ...
        	 * ]	 
        	 */
        	getApplicationIDFromTableId(tableId) {
        		let application = this.listen([''lib_BaseRow.forms_ApplicationsList''])?.array
        		if (application) {
        			for (let app of application) {
        				for (let table of app.tables) {
        					if (table.id == tableId) {
        						return app.id
        					}
        				}
        			}
        		}
        		return 0;
        	}
        
        	async callParentFunction(call, ...args) {
        //		return await new Promise((resolve, reject) => {
        //			if (window.parent) {
        //				const ts = new Date().getTime();
        //				var handler;
        //				window.addEventListener(''message'', handler = (event) => {
        //					if (event.data.ts != ts || event.data.call != call) {
        //						return;
        //					}
        //					window.removeEventListener(''message'', handler);
        //					resolve(event.data.result);
        //				});
        //				setTimeout(() => {
        //					window.removeEventListener(''message'', handler);
        //					reject(new Error(''Parent call timed out''));
        //				}, 5000);
        //				window.parent.postMessage({ts, call, args}, ''*'');
        //			} else {
        //				resolve();
        //			}
        //		});
        		return (window[call]) ? await (window as any)[call](args) : await new Promise((resolve, reject) =>{reject("not found");});
        	}
        	
        	filterDatabasesTree(
        	  data: DatabaseItem[],
        	  selection: Selection
        	): DatabaseItem[] {
        	  if (!this.local?.originalData) {
        		this.local.originalData = data;
        	  }
        	  return (data ?? [])
        	    .filter((db) => {
        	      const matchWorkspaceId =
        	        selection.workspaceId === undefined ||
        	        db.workspace.id === selection.workspaceId;
        
        	      const matchWorkspaceName =
        	        selection.workspaceName === undefined ||
        	        db.workspace.name === selection.workspaceName;
        
        	      const matchDatabaseId =
        	        selection.databaseId === undefined ||
        	        db.id === selection.databaseId;
        
        	      const matchDatabaseName =
        	        selection.databaseName === undefined ||
        	        db.name === selection.databaseName;
        
        	      return (
        	        matchWorkspaceId &&
        	        matchWorkspaceName &&
        	        matchDatabaseId &&
        	        matchDatabaseName
        	      );
        	    })
        	    .map((db) => {
        	      const filteredTables = db.tables.filter((table) => {
        	        const matchTableId =
        	          selection.tableId === undefined || table.id === selection.tableId;
        
        	        const matchTableName =
        	          selection.tableName === undefined ||
        	          table.name === selection.tableName;
        
        	        return matchTableId && matchTableName;
        	      });
        
        	      return {
        	        ...db,
        	        tables:
        	          selection.tableId !== undefined || selection.tableName !== undefined
        	            ? filteredTables
        	            : db.tables,
        	      };
        	    })
        	    .filter((db) => {
        	      if (
        	        selection.tableId !== undefined ||
        	        selection.tableName !== undefined
        	      ) {
        	        return db.tables.length > 0;
        	      }
        	      return true;
        	    });
        	}
        	
        	getWorkspaces(data: DatabaseItem[]): WorkspaceItem[] {
        	  const map = new Map<number, WorkspaceItem>();
        
        	  for (const db of data  ?? []) {
        	    if (!map.has(db.workspace.id)) {
        	      map.set(db.workspace.id, db.workspace);
        	    }
        	  }
        
        	  return Array.from(map.values());
        	}
        	
        	getDatabasesByWorkspace(
        	  data: DatabaseItem[],
        	  workspaceId?: number
        	): DatabaseItem[] {
        	  if (workspaceId === undefined) {
        	    return data;
        	  }
        
        	  return data.filter((db) => db.workspace.id === workspaceId);
        	}
        	
        	getTablesByDatabase(
        	  data: DatabaseItem[],
        	  databaseId?: number
        	): TableItem[] {
        	  if (databaseId === undefined) {
        	    return [];
        	  }
        
        	  const database = data.find((db) => db.id === databaseId);
        	  return database?.tables ?? [];
        	}
        	
        	getSelectionState(
        	  data: DatabaseItem[],
        	  selection: Selection
        	) {
        	  const workspaces = this.getWorkspaces(data);
        
        	  const databases = this.getDatabasesByWorkspace(data, selection.workspaceId);
        
        	  const tables = this.getTablesByDatabase(
        	    databases,
        	    selection.databaseId
        	  );
        
        	  const selectedTable =
        	    selection.tableId !== undefined
        	      ? tables.find((table) => table.id === selection.tableId)
        	      : undefined;
        
        	  return {
        	    workspaces,
        	    databases,
        	    tables,
        	    selectedTable,
        	    filteredTree: this.filterDatabasesTree(data, selection),
        	  };
        	}
        	
        	getWorkspaceAndDatabaseIdsFromTableId(
        	  data: DatabaseItem[],
        	  tableId: number
        	): { workspaceId: number; databaseId: number } | null {
        	  for (const db of data) {
        	    const tableFound = db.tables.find((table) => table.id === tableId);
        
        	    if (tableFound) {
        	      return {
        	        workspaceId: db.workspace.id,
        	        databaseId: db.id,
        	      };
        	    }
        	  }
        
        	  return null;
        	}
        	
        	getTabOptions(): Array<Record<string, string>> {
        	  const options: Array<Record<string, string>> = [];
        
        	  options.push({
        	    displayValue:
        	      typeof this.local?.workspace_id_int === ''number''
        	        ? this.local.groupName
        	        : ''modal_configure_workspace_placeholder''
        	  , value: ''workspaces''});
        
        	  if (this.local.step === ''workspaces'') {
        	    return options;
        	  }
        
        	  options.push({
        	    displayValue:
        	      typeof this.local?.database_id_int === ''number''
        	        ? this.local.baseName
        	        : ''modal_configure_database_placeholder'',
        		value: ''databases''
        	  });
        
        	  if (this.local.step === ''databases'') {
        	    return options;
        	  }
        
        	  options.push({
        	    displayValue:
        	      typeof this.local?.table_id_int === ''number''
        	        ? this.local.tableName
        	        : ''modal_configure_table_placeholder'',
        			value: ''tables''
        	  });
        
        	  return options;
        	}
        	/*End_c8o_PageFunction*/
        '
