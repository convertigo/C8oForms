        			async presentPermissionsPopover(e: Event) {
        			  const popover = await this.popoverController.create({
        			    component: C8Oforms_PopoverPermissions,
        				event: e,                   // positionne le popover à l’endroit du clic
        			    translucent: true,
        			    showBackdrop: false,
        			    backdropDismiss: true,
        			    cssClass: ''popover''
        			  });
        
        			  await popover.present();
        
        			  const { data, role } = await popover.onDidDismiss();
        			}
        		
        		async presentPopover(e: Event) {
        		  const popover = await this.popoverController.create({
        		    component: C8Oforms_PopoverUserActions,
        		    componentProps: {selectedNodes: this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes()},
        			event: e,                   // positionne le popover à l’endroit du clic
        		    translucent: true,
        		    showBackdrop: false,
        		    backdropDismiss: true,
        		    cssClass: ''popover''
        		  });
        
        		  await popover.present();
        
        		  const { data, role } = await popover.onDidDismiss();
        		  if ((role == ''edit'' || role == ''delete'') && data === null) {
        			this.loadGridData();
        		  }
        		  // data null | ''edit_user'' | ''edit_perms'' | ''see_profil''
        //		  console.log(this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes())
        //		  console.log(`Popover dismissed with role: ${role}; and data: ${data}`);
        		  if (data && data.length > 0) {
        			this.showModal(data);
        		  }
        		}
        		
        		applyExternalFilters() {
        //			console.log(this.myaggrid.agGrid.api.getFilterModel())
        		  this.myaggrid.agGrid.api.setFilterModel({
        		    language: {
        				filterType: ''text'',
        				type: ''contains'',
        				filter: this.selectedLanguages.length ? this.selectedLanguages[0] : null
        		    },
        		    provider: {
        				filterType: ''text'',
        				type: ''contains'',
        				filter: this.selectedProviders.length ? this.selectedProviders[0] : null
        		    },
        			permissions: {
        				filterType: ''text'',
        				type: this.selectedPermissions.length && this.selectedPermissions[0] === "Admin" ? ''startsWith'' : ''contains'',
        				filter: this.selectedPermissions.length ? this.selectedPermissions[0] : null
        			}
        		  });
        		  this.myaggrid.agGrid.api.onFilterChanged();
        //		  console.log(this.myaggrid.agGrid.api.getFilterModel());
        		}
        		
        		countFiltersApplied(): number {
        			let tmp = 0;
        			if (this?.myaggrid?.agGrid?.api) {				
        				let filters = this.myaggrid.agGrid.api.getFilterModel();
        				if(filters?.language && filters?.language?.filter && filters.language.filter.length > 0) {
        					tmp++;
        				}
        				
        				if(filters?.provider && filters?.provider?.filter && filters.provider.filter.length > 0) {
        					tmp++;
        				}
        				
        				if(filters?.permissions && filters?.permissions?.filter && filters.permissions.filter.length > 0) {
        					tmp++;
        				}
        			}
        			
        			return tmp;
        		}
        		
        		clearFilters() {
        			this.filters = {
        				language: {
        					all: {checked: true},
        					fr: {checked: false},
        					en: {checked: false},
        					it: {checked: false},
        					es: {checked: false},
        				}, 
        				provider: {
        					all: {checked: true},
        					azuread: {checked: false},
        					google: {checked: false},
        					linkedin: {checked: false},
        					convertigo: {checked: false},
        					openid: {checked: false},
        				},
        				permissions : {
        					all: {checked: true},
        					"Admin": {checked: false},
        					"Admin Read Only": {checked: false},
        					"No Code Editor": {checked: false},
        					"Editor": {checked: false},
        					"Formulas Editor": {checked: false},
        					"Publisher": {checked: false}
        				}
        			};
        			this.selectedLanguages = [];
        			this.selectedProviders = [];
        			this.selectedPermissions = [];
        			this.myaggrid.agGrid.api.setFilterModel({});
        		}
        
        		toggleSelection(event: Event, type: ''language'' | ''provider''|''permissions'', val: string) {
        //		  const input = event.target as HTMLInputElement;
        		  const value = val;
        		  
        //		  console.log(this.filters)
        //		  this.ref.detectChanges()
        
        		  const arr = type === ''language'' ? this.selectedLanguages : type === ''provider'' ? this.selectedProviders : this.selectedPermissions;
        
        		  if (this.filters[type][value].checked && value !== "all") {
        		    // On ajoute la valeur si elle n''existe pas déjà
        		    if (!arr.includes(value)) {
        		      arr[0] = value;
        		    }
        		  } 
        		  else if (this.filters[type][value].checked && value === "all") {
        		    // Sélectionner toutes les valeurs possibles
        		    if (type === ''language'') {
        		      this.selectedLanguages = []; // <- tu peux injecter dynamiquement depuis ton dataset
        		    } else if(type === ''provider'') {
        		      this.selectedProviders = [];
        		    } else {
        				this.selectedPermissions = [];
        			}
        		  } 
        		  else {
        		    if (value === "all") {
        		      // On décoche "all" → on vide le tableau
        		      if (type === ''language'') {
        		        this.selectedLanguages = [];
        		      } else if(type === ''provider'') {
        		        this.selectedProviders = [];
        		      } else {
        				this.selectedPermissions = [];
        			  }
        		    }
        //			else {
        //				      // On retire seulement la valeur
        //				      const index = arr.indexOf(value);
        //				      if (index > -1) arr.splice(index, 1);
        //			}
        		  }
        		  
        		  console.log(this.selectedLanguages, this.selectedProviders, this.selectedPermissions)
        
        		  this.applyExternalFilters();
        		}
        		
        		public filterMain(vars: any) {
        			if(this.filters[vars.type][vars.value].checked == false) {
        				for (const prop in this.filters[vars.type]) {
        					if ("checked" in this.filters[vars.type][prop])
        						this.filters[vars.type][prop].checked = false;
        				}
        				this.filters[vars.type][vars.value].checked = true;
        			this.toggleSelection(event, vars.type, vars.value);	
        			}
        			
        			console.log(this.filters)
        		}
        
        
        	/*End_c8o_PageFunction*/
