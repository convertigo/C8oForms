        	  "No Code Editor": "metric-icon-badge--warning",       // orange
        	"Formulas Editor": "metric-icon-badge--success",       // violet
        	  "Publisher": "metric-icon-badge--info",       // bleu
        	  "Editor": "metric-icon-badge--success",    // vert
