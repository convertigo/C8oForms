scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        import { C8Oforms_AddUserForm } from ''../../components/c8oforms.adduserform/c8oforms-adduserform'';
        import { C8Oforms_EditPermsModal } from ''src/app/components/c8oforms.editpermsmodal/c8oforms-editpermsmodal'';
        import { C8Oforms_EditUserModal } from ''src/app/components/c8oforms.editusermodal/c8oforms-editusermodal'';
        import { C8Oforms_SeeProfilModal } from ''src/app/components/c8oforms.seeprofilmodal/c8oforms-seeprofilmodal'';
        import { C8Oforms_PopoverUserActions } from ''src/app/components/c8oforms.popoveruseractions/c8oforms-popoveruseractions'';
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public alertController: AlertController;
        	public toastController: ToastController;
        	public modalController: ModalController;
        	public popoverController: PopoverController;
        	public searchValue: string = '''';
        	public searchPlaceholder: string = ''Rechercher un utilisateur...'';
        public documentationTemplate: string = `
        ### 📘 {{mdreader_description_title}}
        
        {{mdreader_description_intro}}
        
        - **{{mdreader_description_edit}}**  
          {{mdreader_description_edit_desc}}
        - **{{mdreader_description_publish}}**  
          {{mdreader_description_publish_desc}}
        - **{{mdreader_description_formulas}}**  
          {{mdreader_description_formulas_desc}}
        - **{{mdreader_description_nocode}}**  
          {{mdreader_description_nocode_desc}}
        - **{{mdreader_description_admin_read}}**  
          {{mdreader_description_admin_read_desc}}
        - **{{mdreader_description_admin_write}}**  
          {{mdreader_description_admin_write_desc}}
        
        ---
        
        ### 🔍 {{mdreader_determination_title}}
        
        {{mdreader_determination_intro}}
        
        - **{{mdreader_determination_group_title}}**  
          {{mdreader_determination_group_desc}}
        
        - **{{mdreader_determination_default_title}}**  
          {{mdreader_determination_default_desc_prefix}} <a href="https://doc.convertigo.com/documentation/latest/operating-guide/using-convertigo-administration-console/#global-symbols" target="_blank" rel="noopener noreferrer">{{mdreader_determination_default_link_label}}</a> {{mdreader_determination_default_desc_suffix}} :
          - \`C8Oforms.editing_rights_default_enabled\` (**true** / **false**) : {{mdreader_determination_default_item_1}}  
          - \`C8Oforms.no_code_db_rights_default_enabled\` (**true** / **false**) : {{mdreader_determination_default_item_2}}  
          - \`C8Oforms.formulas_default_enabled\` (**true** / **false**) : {{mdreader_determination_default_item_3}}  
          - \`C8Oforms.publication_rights_default_enabled\` (**true** / **false**) : {{mdreader_determination_default_item_4}}  
        
        ---
        
        ### 👤 {{mdreader_example_1_title}}
        
        - {{mdreader_example_1_user_title}}  
          - {{mdreader_example_1_user}}  
        - {{mdreader_example_1_groups_title}}
          - {{mdreader_example_1_groups}}
        - {{mdreader_example_1_defaults_title}}
          - {{mdreader_example_1_defaults}}
        - {{mdreader_example_1_result_title}}
          - {{mdreader_example_1_result}}
        
        ---
        
        ### 👤 {{mdreader_example_2_title}}
        
        - {{mdreader_example_2_user_title}}
          - {{mdreader_example_2_user}}
        - {{mdreader_example_2_group_title}}
          - {{mdreader_example_2_groups}}
          - {{mdreader_example_2_groups_1}}
        - {{mdreader_example_2_defaults_title}}
          - {{mdreader_example_2_defaults}}
        - {{mdreader_example_2_result_title}}
          - {{mdreader_example_2_result}}
        
        ---
        
        💡 {{mdreader_final_note}}
        `;
        /*
        
        **{{mdreader_example_user}}**
        - {{mdreader_example_groups_title}}
          - {{mdreader_example_groups}}
        - {{mdreader_example_default_settings_title}}
          - {{mdreader_example_default_settings}}
        - {{mdreader_example_result_title}}
          - {{mdreader_example_result}}
          
          */
        
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.alertController = this.getInstance(AlertController);
        		this.toastController = this.getInstance(ToastController);
        		this.modalController = this.getInstance(ModalController);
        		this.popoverController = this.getInstance(PopoverController);
        		this.local.overlayLoading = ''<span class="ag-overlay-loading-center">''+this.translate.instant(''loading_data'')+''</span>'';
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public async loadGridData() {
        			try {
        				this.local.loading = true;
        				if(this.myaggrid?.agGrid?.api){
        					this.myaggrid.agGrid.api.showLoadingOverlay();
        				}
        				let admin_write = ( (!this.global?.settings?.admin) ? true : false);
        				let admin_readonly = ( (this.global?.settings?.admin_readonly == undefined || !this.global?.settings?.admin_readonly) ? false : admin_write );
        //				console.log(admin_readonly);
        				let data = await this.c8o.callJsonObject("C8Oforms.admin_users_get", {admin_readonly: admin_readonly}).async();
        				let no_code_db_default_rights = data.result?.default_rights.no_code_db_default_rights == true;
        				let editing_apps_default_rights = data.result?.default_rights.editing_apps_default_rights == true;
        				let formulas_default_rights = data.result?.default_rights?.formulas_default_rights == true;
        				let publication = data.result?.default_rights?.publication == true;
        				if (data.error) {
        					this.local.error = true;
        				}
        				else {
        					if (data.result.labels) {
        						let translations = this.translate.translations[this.translate.currentLang];
        						let finKeyByValue = (value) => {
        							for (const key in translations) {
        								if (translations[key] === value) {
        									return key;
        								}
        							}
        						}
        						data.result.labels = data.result.labels.map((x) => {
        							if (x.headerName && x.headerName.length > 0) {
        								x.headerName = this.translate.instant(x.headerName);
        								// if it''''s a checkbox then add support for non boolean checkbox
        								if (x?.cellRenderer == "agCheckboxCellRenderer") {
        									if (x?.c8o_type == "stringboolean") {
        										x.valueGetter = (params) => {
        											if(params.colDef.field == "editing_rights"){
        												return params.data[x.field] != undefined ? (params.data[x.field] === ''true'' || params.data[x.field] === true) : editing_apps_default_rights;
        											}
        											else if(params.colDef.field == "nocode_db_rights"){
        												return params.data[x.field] != undefined ? (params.data[x.field] === ''true'' || params.data[x.field] === true) : no_code_db_default_rights;
        											}
        											else if(params.colDef.field == "formulas"){
        												return params.data[x.field] != undefined ? (params.data[x.field] === ''true'' || params.data[x.field] === true) : formulas_default_rights;
        											}
        											else if(params.colDef.field == "publication"){
        												return params.data[x.field] != undefined ? (params.data[x.field] === ''true'' || params.data[x.field] === true) : publication;
        											}
        											else{
        												return params.data[x.field] === ''true'' || params.data[x.field] === true;
        											}
        											
        										},
        											x.valueSetter = (params) => {
        												params.data[x.field] = params.newValue ? ''true'' : ''false'';
        												return true;
        											}
        									}
        									else {
        										x.valueGetter = (params) => {
        											return params.data[x.field] === true;
        										},
        										x.valueSetter = (params) => {
        											params.data[x.field] = params.newValue;
        											return true;
        										}
        									}
        	
        								}
        								if (x?.valueGetter == "lang") {
        									x.cellEditorParams.values = x.cellEditorParams.values.map((x) => {
        										x = this.translate.instant(x);
        										return x;
        									})
        									x.valueGetter = (params) => {
        										if (params?.data?.[x.field]) {
        											return this.translate.instant(params.data[x.field]);
        										}
        										else {
        											return params?.data?.[x.field] ?? "";
        										}
        	
        									},
        										x.valueSetter = (params) => {
        											params.data[x.field] = finKeyByValue(params.newValue);
        											return true;
        										}
        								}
        							}
        							return x;
        						})
        					}
        //					console.log(data.result.labels[1])
        					data.result.labels[1].cellRenderer = (params) => {
        						return this.UserCellRenderer(params);
        					};
        					data.result.labels[1].valueGetter = params =>
        					  `${params.data.displayName} ${params.data.name} ${params.data.surname}`
        					
        					data.result.labels[2].cellRenderer = (params) => {
        						return this.ContactCellRenderer(params);
        					};
        					data.result.labels[2].valueGetter = params =>
        					  `${params.data.mail} ${params.data.language} ${params.data.provider}`
        					
        					data.result.labels[3].cellRenderer = (params) => {
        						return this.PermissionsCellRenderer(params);
        					};
        					data.result.labels[3].valueGetter = params => {
        					  const d = params.data;
        					  const roles: string[] = [];
        					  const isTrue = (v: any) => v === true || v === "true";
        
        					  if (d.admin === true || d.admin === "true") {
        					    roles.push("Admin");
        					  }
        					  if (d.nocode_db_rights === true || d.nocode_db_rights === "true") {
        					    roles.push("No Code Editor");
        					  }
        					  if (d.admin_readonly === true || d.admin_readonly === "true") {
        					    roles.push("Admin Read Only");
        					  }
        					  if (d.publication === true || d.publication === "true") {
        					    roles.push("Publisher");
        					  }
        					  if (d.editing_rights === true || d.editing_rights === "true") {
        					    roles.push("Editor");
        					  }
        					  if (d.formulas === true || d.formulas === "true") {
        					    roles.push("Formulas Editor");
        					  }
        
        					  return roles.join(" "); // ex: "Admin · Publisher · Editor"
        					};
        					
        					data.result.labels[4].cellRenderer = (params) => {
        						return this.ActionsCellRenderer(params);
        					};
        
        					
        					this.local.data = data;
        				}
        			} catch (e) {
        				this.local.error = true;
        				this.c8o.log.error("An error occured : \n" + JSON.stringify(e));
        			}
        			finally {
        				this.local.loading = false;
        				if(this.myaggrid?.agGrid?.api){
        					this.myaggrid.agGrid.api.hideOverlay();
        				}
        				this.ref.markForCheck();
        			}
        		}
        
        		public async performBulk(bulkOperation: "delete" | "update", confirmMsg: string, successMsg: string, errorMsg: string, cancelMsgBtn: string, confirmMsgBtn, right?: string, value?: any) {
        			try {
        				let docs = this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes().map((node) => { return { "_id": node.data._id, "_rev": node.data._rev } });
        				this.popoverActions.dismiss();
        				let type = this.translate.instant("users");
        				const performOperation = await this.showConfirmationAlert(
        					this.translate.instant("Confirmation"),
        					this.translate.instant(confirmMsg, { countlines: docs.length, resType: type }),
        					this.translate.instant(cancelMsgBtn),
        					this.translate.instant(confirmMsgBtn)
        				);
        
        				if (performOperation) {
        					let args: any = {docs: JSON.stringify(docs)};
        					let sequence;
        					if(bulkOperation == "delete"){
        						sequence = "C8Oforms.admin_users_delete";
        					}
        					else{
        						sequence = "C8Oforms.admin_users_patch";
        						args = {...args, "right": right, "value": value};
        					}
        					let deleted = await this.c8o.callJsonObject(sequence, args).async();
        					this.loadGridData();
        					if (deleted?.result?.success) {
        						await this.presentToast(this.translate.instant(successMsg, { countlines: docs.length }), ''toastSuccess'');
        					}
        					else {
        						await this.presentToast(this.translate.instant(errorMsg), ''toastError'');
        					}
        				}
        
        			} catch (e) {
        				this.loadGridData();
        				await this.presentToast(this.translate.instant(errorMsg), ''toastError'');
        			}
        		}
        
        		public async showConfirmationAlert(header: string, message: string, cancelLabel: string, confirmLabel: string, confirmRed: boolean = true, cancelRed: boolean = false): Promise<boolean> {
        			const alert = await this.alertController.create({
        				header: header,
        				message: message,
        				backdropDismiss: false,
        //				cssClass: ''styleAlertHeight'',
        				cssClass: ''alert-custom text-generic'',
        				buttons: [
        					{
        						cssClass: cancelRed ? "btn text-generic width-fit-content btn-padding-start-0 height-28px btn--danger" : "btn text-generic width-fit-content btn-padding-start-0 height-28px btn--info",
        						text: cancelLabel,
        						role: ''cancel'',
        						handler: () => {
        							return false;
        						}
        					},
        					{
        						cssClass: confirmRed ? "btn text-generic width-fit-content btn-padding-start-0 height-28px btn--danger" : "btn text-generic width-fit-content btn-padding-start-0 height-28px btn--info",
        						text: confirmLabel,
        						handler: () => {
        							return true;
        						}
        					}
        				]
        			});
        
        			await alert.present();
        			return new Promise((resolve) => {
        				alert.onDidDismiss().then((data) => {
        					resolve(!(data.role == ''cancel''));
        				});
        			});
        		}
        		async presentToast(message: string, cssClass: string = '''') {
        			const toast = await this.toastController.create({
        				message: message,
        				duration: 3000,
        				position: ''bottom'',
        				cssClass: cssClass,
        			});
        
        			await toast.present();
        		}
        		async showModal(name: string = ''add''){
        			let action = (name === ''add'') ? ''add'' : ((name === ''edit_user'') ? ''edit_user'' : ((name === ''edit_perms'') ? ''edit_perms'' : ''see_profil''))
        			let modalObj = null;
        			switch(action) {
        				case ''add'':
        					modalObj = 	{
        				      component: C8Oforms_AddUserForm,
        					  cssClass: "modal-custom modal-custom--h578px",
        					  showBackdrop: false
        				    }
        					break;
        				case ''edit_user'':
        					modalObj = 	{
        					  component: C8Oforms_EditUserModal,
        					  componentProps: {selectedNodes: this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes()},
        					  cssClass: "modal-custom",
        					  showBackdrop: false
        					}
        					break;
        				case ''edit_perms'':
        					modalObj = 	{
        					  component: C8Oforms_EditPermsModal,
        					  componentProps: {selectedNodes: this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes()},
        					  cssClass: "modal-custom",
        					  showBackdrop: false
        					}
        					break;
        				case ''see_profil'':
        					modalObj = 	{
        					  component: C8Oforms_SeeProfilModal,
        					  componentProps: {selectedNodes: this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes()},
        					  cssClass: "modal-custom modal-custom--h518px",
        					  showBackdrop: false
        					}
        					break;
        				default:
        					break;
        			}
        			if (modalObj === null) {
        				return;
        			}
        			const modal = await this.modalController.create(modalObj);
        		    
        			modal.onDidDismiss().then((value)=>{
        				if(value?.data?.refresh){
        					this.loadGridData();
        				}
        			})
        			return await modal.present();
        		}
        		public renderMarkdown(template: string): string {
        		  return template.replace(/\{\{(.*?)\}\}/g, (_, key) => this.translate.instant(key.trim()) || `{{${key}}}`);
        		}
        		
        		public getAdminCount() {
        			return this.local?.data?.result?.values.filter(
        				dt => dt?.admin
        			).length?.toLocaleString(this.translate.getBrowserCultureLang());
        		}
        		
        		public onQuickFilterChanged(value: string) {
        		  this.myaggrid?.agGrid?.api!.setQuickFilter(value);
        		}
        		
        		public UserCellRenderer(params: any) {
        //		  console.log(params.data)
        		  const { displayName, name } = params.data;
        		  const initials = (displayName) ? displayName?.slice(0, 2).toUpperCase() : '''';
        
        		  return `
        		    <div style="display:flex; align-items:center; gap:12px;">
        		      <div style="
        		        width:32px; height:32px; border-radius:50%;
        		        background:#E2E8F0; color:#334155;
        		        display:flex; align-items:center; justify-content:center;
        		        font-weight:600; font-size:14px;
        		      ">
        		        ${((initials !== undefined && initials.length > 0) ? initials : 
        						`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`
        					
        				)}
        		      </div>
        		      <div style="display:flex;width:calc(100% - 50px); flex-direction:column; line-height:1.2;">
        		        <span style="font-weight:600;" class="truncate">${displayName || "Utilisateur inconnu"}</span>
        		        <span style="font-size:13px; color:#64748b;">${name || "–"}</span>
        		      </div>
        		    </div>
        		  `;
        		}
        		
        		public ContactCellRenderer(params: any) {
        		  const { mail, language, provider } = params.data;
        //		  console.log(mail, language, provider)
        			const colors: Record<string, string> = {
        			  forms: "#3b82f6",
        			  linkedin: "#3b82f6",
        			  undefined: "#3b82f6", 
        			  google: "#ef4444",      // rouge
        			  azuread: "#8b5cf6",      // violet
        			openid: "#111827"       // gris
        			};
        			
        			const styleClasses: Record<string, string> = {
        			  forms: "metric-icon-badge--info",
        			  undefined: "metric-icon-badge--info",
        			  google: "metric-icon-badge--danger",
        			  openid: "metric-icon-badge--dark",
        			  azuread: "metric-icon-badge--primary",
        			  linkedin: "metric-icon-badge--primary",
        			};
        
        		  return `
        		    <div style="height:56px;position:absolute;top:-11.5px">
        				<div>				
        			      <p style="font-size:14px;height:23px;margin:0; color:#111827;width:100%;">${mail}</p>
        				  <div style="display:flex;align-items:center;">
        					  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe-icon lucide-globe"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        				      <span style="margin-left:0.25rem;font-size:12px; color:#64748b;">
        				        ${language} <span class=${styleClasses[provider]} style="
        				          border-radius:8px; padding:2px 6px; font-size:11px;
        				        ">${(provider == undefined) ? ''convertigo'' : provider}</span>
        				      </span>
        				  </div>
        				</div>
        		    </div>
        		  `;
        		}
        
        		public PermissionsCellRenderer(params: any, tooltip: boolean = false) {
        //			console.log(params.data)
        			const { admin,  formulas, nocode_db_rights, publication, editing_rights, admin_readonly} = params.data;	
        			let permissions = [];
        			let permissionsLength = 0;
        			const isTrue = (v: any) => v === true || v === "true";
        
        			
        			for (let i = 0; i < 6; i++) {				
        				if (isTrue(admin) && permissions.indexOf("admin") === -1) {
        				  permissions.push("admin");
        				  permissionsLength++;
        				}
        				
        				if (isTrue(nocode_db_rights) && permissions.indexOf("nocode_db_rights") === -1) {
        				  permissions.push("nocode_db_rights");
        				  permissionsLength++;
        				}
        
        				if (isTrue(formulas) && permissions.indexOf("formulas") === -1) {
        				  permissions.push("formulas");
        				  permissionsLength++;
        				}
        
        				if (isTrue(publication) && permissions.indexOf("publication") === -1) {
        				  permissions.push("publication");
        				  permissionsLength++;
        				}
        
        				if (isTrue(editing_rights) && permissions.indexOf("editing_rights") === -1) {
        				  permissions.push("editing_rights");
        				  permissionsLength++;
        				}
        
        				if (isTrue(admin_readonly) && permissions.indexOf("admin_readonly") === -1) {
        				  permissions.push("admin_readonly");
        				  permissionsLength++;
        				}
        
        
        			}
        			
        //			console.log(permissions);
        
        		  if (permissionsLength === 0) {
        		    return `<span style="color:#9ca3af;height:100%; font-size:12px;">-</span>`;
        		  }
        
        		  // mapping permission → couleur
        		  const colors: Record<string, string> = {
        		    admin: "#ef4444",      // rouge
        		    nocode_db_rights: "#f59e0b",       // orange
        			formulas: "#10b981",       // violet
        		    publication: "#3b82f6",       // bleu
        		    editing_rights: "#10b981",    // vert
        		    admin_readonly: "#8b5cf6",       // violet
        		  };
        		  
        		  const styleClasses: Record<string, string> = {
        		    admin: "metric-icon-badge--danger",      // rouge
        		    nocode_db_rights: "metric-icon-badge--warning",       // orange
        		  formulas: "metric-icon-badge--success",       // violet
        		    publication: "metric-icon-badge--info",       // bleu
        		    editing_rights: "metric-icon-badge--success",    // vert
        		    admin_readonly: "metric-icon-badge--tertiary",       // violet
        		  };
        		  
        		  const permsNames: Record<string, string> = {
        		    publication: "Publication des applications",       // bleu
        		    admin: "Administration",      // rouge
        		    nocode_db_rights: "Édition no-code",       // orange
        		    editing_rights: "Édition des applications",    // vert
        		    admin_readonly: "Administration (consultation)",       // violet
        		  formulas: "Édition Javascript"       // violet
        		  };
        
        		  const dots = permissions.map(p => {
        		    const color = colors[p] || "#9ca3af";
        			const styleClass = styleClasses[p] || "";
        		    return `<span class="${styleClass} ${(tooltip)? styleClass+''--tooltip'' : ''''}" data-text="${permsNames[p]}" style="filter:brightness(1) contrast(1.75);background:${color} !important;width:8px; height:8px; border-radius:50%; display:inline-block;"></span>`;
        		  }).join(" ");
        
        		  return `<div style="display:flex; height: 100%;overflow:auto!important;gap:6px; align-items:center;">${dots}</div>`;
        		}
        		
        		public ActionsCellRenderer(params) {
        	      const wrapper = document.createElement(''div'');
        		  wrapper.style.height = "56px";
        		  wrapper.style.position = "absolute";
        		  wrapper.style.top = "-7px";
        	      wrapper.innerHTML = `
        	        <ion-button style="height:100%;" class="btn text-generic">
        				<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ellipsis-vertical-icon lucide-ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        	        </ion-button>
        	      `;
        	
        	      const ionButton = wrapper.querySelector(''ion-button'');
        	
        		
        	      ionButton?.addEventListener(''click'', 
        			this.presentPopover.bind(this)
        	      );
        	
        	      return wrapper;
        		}
        		
        		async presentPopover(e: Event) {
        		  const popover = await this.popoverController.create({
        		    component: C8Oforms_PopoverUserActions,
        		    componentProps: {selectedNodes: this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes()},
        			event: e,                   // positionne le popover à l’endroit du clic
        		    translucent: true,
        		    showBackdrop: false,
        		    backdropDismiss: true,
        		    cssClass: ''popover''
        		  });
        
        		  await popover.present();
        
        		  const { data, role } = await popover.onDidDismiss();
        		  if ((role == ''edit'' || role == ''delete'') && data === null) {
        			this.loadGridData();
        		  }
        		  // data null | ''edit_user'' | ''edit_perms'' | ''see_profil''
        //		  console.log(this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes())
        //		  console.log(`Popover dismissed with role: ${role}; and data: ${data}`);
        		  if (data && data.length > 0) {
        			this.showModal(data);
        		  }
        		}
        
        	/*End_c8o_PageFunction*/
        '
