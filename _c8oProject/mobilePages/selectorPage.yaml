                                  '		try {
                                  			var _resolve: any = null;
                                  			let popoverController = page.getInstance(PopoverController);
                                  			let data;
                                  			let local_str_data = window.localStorage.getItem("c8oforms_edition_filters");
                                  			try {
                                  				data = JSON.parse(local_str_data);
                                  			}
                                  			catch (e) {
                                  
                                  			}
                                  			if (data == null) {
                                  				data = {};
                                  			}
                                  			const popover = await popoverController.create({
                                  				component: C8Oforms_PopoverFilters,
                                  				event: event,
                                  				componentProps: {
                                  					settings: {...data}
                                  				}
                                  			});
                                  			popover.onDidDismiss().then((dataReturned) => {
                                  				try{
                                  					if (dataReturned.data) {
                                  //						console.log(''Données reçues du popover:'', dataReturned.data);
                                  						let dataTobeInserted = {};
                                  						if (dataReturned.data?.hide_apps_i_created != page.global?.settings.edition_filters?.hide_apps_i_created) {
                                  							dataTobeInserted["hide_apps_i_created"] = dataReturned.data?.hide_apps_i_created;
                                  						}
                                  						if (dataReturned.data?.hide_folders != page.global?.settings.edition_filters?.hide_folders) {
                                  							dataTobeInserted["hide_folders"] = dataReturned.data?.hide_folders;
                                  						}
                                  						if (dataReturned.data?.show_all_apps != page.global?.settings.edition_filters?.show_all_apps) {
                                  							dataTobeInserted["show_all_apps"] = dataReturned.data?.show_all_apps;
                                  						}
                                  						window.localStorage.setItem("c8oforms_edition_filters", JSON.stringify(dataTobeInserted));
                                  						let properties = [''hide_apps_i_created'', ''hide_folders'', ''show_all_apps''];
                                  						let hasChanged = properties.some(prop => {
                                  						    let oldVal = data[prop];
                                  						    if (oldVal === null) oldVal = false;
                                  						    let newVal = dataTobeInserted[prop];
                                  						    return (oldVal === false && newVal === true) || (oldVal === true && newVal === false);
                                  						});
                                  						_resolve(hasChanged);
                                  					}
                                  					else{
                                  						_resolve(false);
                                  					}
                                  				}
                                  				catch(e){
                                  					_resolve(false);
                                  				}
                                  				
                                  			});
                                  			await popover.present();
                                  			return new Promise((resolve)=>{
                                  				_resolve = resolve;
                                  			})
                                  		} catch (e) {
                                  
                                  		}
                                  '
