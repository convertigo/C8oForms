        '/*Begin_c8o_PageImport*/
        import { environment } from ''src/environments/environment'';
        import {C8oFullSyncChangeListener } from "c8osdkangular";
        import * as Pouch from "pouchdb-browser";
        import { C8Oforms_SearchApp } from ''src/app/components/c8oforms.searchapp/c8oforms-searchapp'';
        import {C8Oforms_PopoverFilters} from "../../components/c8oforms.popoverfilters/c8oforms-popoverfilters"
        import {C8Oforms_PopoverSort} from "../../components/c8oforms.popoversort/c8oforms-popoversort"
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public list = [];
        	public listResponses = [];
        	public creating ="";
        	public query = "";
        	public created = new Date().getTime();
        	public form:any;
        	public seeAllTpl: boolean = false;
        	public modalController: ModalController;
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.modalController = this.getInstance(ModalController);
        		//generate a getter and setter for this.local.itemSize
        		this.local.itemSize = 232 * 1/4;
        		this.global.visibleoptions = [];
        		this.local.searchTags = [];
                this.local.searchSubTags = [];
        		this.global.platform.name[''0''] = ""
        		this.global.visibleoptions = [];
        		this.global["visibleoptions1"] = [];
        		//initial item size
        		this.local.itemSize = this.computeItemSize();		
        		// listen to navigator resize event
        		window.addEventListener(''resize'', () => {
        			this.local.itemSize = this.computeItemSize();
        			this.viewport.checkViewportSize();
        		});
        		this.global.grid = true;
        		this.countFilters();
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public countFilters(){
        		let data;
        		let local_str_data = window.localStorage.getItem("c8oforms_edition_filters");
        		try {
        			data = JSON.parse(local_str_data);
        		}
        		catch (e) {
        
        		}
        		if (data == null) {
        			data = {};
        		}
        		let cpt = 0;
        		for(let prop in data){
        			if(data[prop] == true){
        				cpt ++;
        			}
        		}
        		this.local.countFilters = cpt;
        	}
        	computeItemSize(){
        		let width = window.innerWidth;
        		let itemHeight = this.global.grid ? 232 : 130;
        		let ratio = 1/4;
        		if(width < 576){
        			ratio = 1/2;
        		}
        		else if (width < 768) {
        			ratio = 1/2;
        		}
        		else if(width < 992){
        			ratio = 1/3;
        		}
        		else if (width < 1200) {
        			ratio = 1/4;
        		}
        		let result = itemHeight * ratio;
        		return result;
        	}
        	
        	getLevelAccesDoc(doc, settings){
        		// if I am the owner of the doc
        		if(doc.creator == settings["~c8oAcl"]){
        			return 0;
        		}
        		else {
        			let groups = settings.group != undefined ? Object.keys(settings.groups).filter((x)=>{ return settings.groups[x] == true}) : [];
        			let isAcollabResp = doc.collabsResponse != undefined && (doc.collabsResponse.indexOf(settings["_id"]) != -1 || doc.collabsResponse.filter(value => (groups.indexOf(value) != -1)).length > 0);
        			let isAcollab = doc.collabs != undefined && (doc.collabs.indexOf(settings["_id"]) != -1 || doc.collabs.filter(value => (groups.indexOf(value) != -1)).length > 0);
        			let isAshared  = doc.shared != undefined && (doc.shared.indexOf(settings["_id"]) != -1 || doc.shared.filter(value => (groups.indexOf(value) != -1)).length > 0);
        			if(isAcollabResp && isAcollab){
        				return 1;
        			}
        			else if(isAcollab){
        				return 2;
        			}
        			else if(isAcollabResp){
        				return 3;
        			}
        			else if(isAshared){
        				return 4;
        			}
        		}
        	}
        	
        	trackById(index, item) {
        		return item._id ?? item.key;  
        	}
        	trackByKey(index, item) {
        		return item.key;  
        	}
        	public stringi(str){
        	    try{
        	        return JSON.stringify(str);
        	    }
        	    catch(e){
        	        return ''catched''
        	    }
        	}
        	
        	version(rev: string):string{
        	    let index = rev.indexOf("-");
        	    return rev.substring(0,index);
        	    
        	}
        	getSizeObject(obj): number{
        	    if(obj != null){
        	        let count = 0;
        	        for(let item in obj){
        	            if(obj[item]){
        	                count ++;
        	            }
        	        }
        	        return count;
        	    }
        	    else{
        	        return 0;
        	    }
        	    
        	}
        	
        	getSizeObjectFormated(obj){
        	    let count = this.getSizeObject(obj);
        	    return ((count <= 9) ? "0"+ count : count);
        	}
        	
        	getTranslate(msgTosearch :string): Promise<any>{
                return new Promise((resolve, reject)=>{
                    let translate = this.getInstance(TranslateService)
                    translate.get(msgTosearch).subscribe((res: string) => {
                        resolve(res);
                    });
                });        
            }
        	
        	
        	getTime(){
        		return new Date().getTime() + "";
        	}
        	
        	formatTime(date: any){
        	    return new Date(+date).toLocaleString();
        	}
        	
        	getcolorfromEl(id){
        	    var el = document.getElementById(id)
        	    if(el != null){
        	        let rgb = this.getAverageRGB(el);
        	        let hex = this.rgbToHex(rgb);
        	        return this.getContrastYIQ(hex);
        	    }
        	}
        	
        	rgbToHex (rgb) { 
        	    var hex = Number(rgb).toString(16);
        	    if (hex.length < 2) {
        	         hex = "0" + hex;
        	    }
        	    return hex;
        	  }
        	
        	getContrastYIQ(hexcolor){
        	    var r = parseInt(hexcolor.substr(0,2),16);
        	    var g = parseInt(hexcolor.substr(2,2),16);
        	    var b = parseInt(hexcolor.substr(4,2),16);
        	    var yiq = ((r*299)+(g*587)+(b*114))/1000;
        	    return (yiq >= 128) ? ''black'' : ''white'';
        	}
        	
        	getAverageRGB(imgEl) {
        
        	    var blockSize = 5, // only visit every 5 pixels
        	        defaultRGB = {r:0,g:0,b:0}, // for non-supporting envs
        	        canvas = document.createElement(''canvas''),
        	        context = canvas.getContext && canvas.getContext(''2d''),
        	        data, width, height,
        	        i = -4,
        	        length,
        	        rgb = {r:0,g:0,b:0},
        	        count = 0;
        
        	    if (!context) {
        	        return defaultRGB;
        	    }
        
        	    height = canvas.height = imgEl.naturalHeight || imgEl.offsetHeight || imgEl.height;
        	    width = canvas.width = imgEl.naturalWidth || imgEl.offsetWidth || imgEl.width;
        
        	        var src = imgEl.src;
        	        imgEl = new Image;
        	        imgEl.setAttribute(''crossOrigin'', ''anonymous''); 
        	        imgEl.src = src;
        	    
        	    context.drawImage(imgEl, 0, 0);
        	    
        	    //context.canvas.baseURI = this.router.c8o.endpoint;
        	    try {
        	        data = context.getImageData(0, 0, width, height);
        	    } catch(e) {
        	        /* security error, img on diff domain */
        	        return defaultRGB;
        	    }
        
        	    length = data.data.length;
        
        	    while ( (i += blockSize * 4) < length ) {
        	        ++count;
        	        rgb.r += data.data[i];
        	        rgb.g += data.data[i+1];
        	        rgb.b += data.data[i+2];
        	    }
        
        	    // ~~ used to floor values
        	    rgb.r = ~~(rgb.r/count);
        	    rgb.g = ~~(rgb.g/count);
        	    rgb.b = ~~(rgb.b/count);
        
        	    return rgb;
        
        	}
        	
        	updateState() {
                return new Promise((resolve)=>{
                    let params = {};
                    params["_use_policy"] =  "merge";
                    params["thumbnail"] = "";
                });     
            }
            public getPWABaseUrl(){
        		return environment.production ? window.location.href.substring(0, window.location.href.indexOf("mobile/")) : "http://localhost:18080/convertigo/projects/C8Oforms/DisplayObjects/"; 	
        	}
        	public openPWA(list, i){
            	window.open(this.getPWABaseUrl() + list[i].pwa_subPath, "_blank");
        	}
        	
        	public getColTabsNum(): number {
        		if (
        			!(this.global?.settings?.editing_rights == "true" || this.global?.settings?.editing_rights == true)	
        			&&
        			!(this.global?.settings?.nocode_db_rights == "true" || this.global?.settings?.nocode_db_rights == true)
        		) 
        		{
        			return 1;
        		}
        		
        		if (!(this.global?.settings?.editing_rights == "true" || this.global?.settings?.editing_rights == true)) {
        			return 2;
        		}
        		
        		if (!(this.global?.settings?.nocode_db_rights == "true" || this.global?.settings?.nocode_db_rights == true)) {
        			return 2;
        		}
        		
        		return 3;
        	}
        	
        	async showModalSearchApp(e = {}){
        		const modal = await this.modalController.create({
        	      component: C8Oforms_SearchApp,
        		  cssClass: "modal-custom modal-custom--searchapp",
        		  componentProps: e,
        		  showBackdrop: false
        	    });
        	    
        		modal.onDidDismiss().then((value)=>{
        			console.log(this.local.filters)
        			
        			this.ref.detectChanges()
        		})
        		return await modal.present();
        	}
         	/*End_c8o_PageFunction*/
