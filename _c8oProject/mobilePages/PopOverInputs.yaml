scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.local.exclude = {"ion-label": true, "ion-title": true, "layout": true, "button": true};
        		this.local.multiple = {radio_group: true, checkbox_group: true, checkbox: true};
        		this.local.simple = {date: true, select: true, datetime: true, time: true, radio: true, text: true, barcode: true, slider: true, grid: true, business_logic: true};
        		this.local.pages = [];
        		this.local.search = "";
        		this.local.form = this.navParams.data["form"]
        		this.constructPageName();
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	constructPageName(){
        	    for(let i in this.navParams.data.form.pages){
        	        this.local.pages.push({name: this.navParams.data.form.pages[i].name, child:[]});
        	        for(let item of this.navParams.data.form.formulaire){
        	            if(item.config.page == this.navParams.data.form.pages[i].pageTechName){
        	                if(item.cat == "action"){
        	                    //do nothing
        	                }
        	                else if(item.type == "ion-card" && item.children != undefined){
        	                    // recursive
        	                    for(let childs of item.children){
        	                        if(!(this.local.exclude[childs.type] == true)){
        	                            if(this.navParams.data.type != undefined && this.navParams.data.type != ''''){
            	                            if(this.local[this.navParams.data.type][childs.type] == true){
            	                                this.local.pages[i].child.push({name:childs.name, id:childs.id, type: childs.type});
            	                            }
        	                            }
        	                            else{
        	                                this.local.pages[i].child.push({name:childs.name, id:childs.id, type: childs.type});
        	                            }
        	                            
        	                        }
        	                    }
        	                }
        	                else{
        	                    if(!(this.local.exclude[item.type] == true)){
        	                        if(this.navParams.data.type != undefined && this.navParams.data.type != ''''){
        	                            if(this.local[this.navParams.data.type][item.type] == true){
        	                                this.local.pages[i].child.push({name:item.name, id:item.id, type: item.type});
        	                            }
        	                        }
        	                        else{
        	                            this.local.pages[i].child.push({name:item.name, id:item.id, type: item.type});
        	                        }
        	                        
        	                    }
        	                } 
        	            }
        	        }
        	    }
        	    for(let page of this.local.pages){
        	        page.child = this.sortInputs(page.child);
        	    }
        	}
        	normalizeInputSearch(value){
        	    return (value == null ? "" : ("" + value)).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        	}
        	inputMatchesSearch(item){
        	    let search = this.normalizeInputSearch(this.local.search);
        	    if(search == ""){
        	        return true;
        	    }
        	    return this.normalizeInputSearch(item?.name).indexOf(search) != -1 || this.normalizeInputSearch(item?.type).indexOf(search) != -1;
        	}
        	sortInputs(items){
        	    return (Array.isArray(items) ? items.slice() : []).sort((a, b) => {
        	        return ("" + (a?.name || "")).localeCompare("" + (b?.name || ""), undefined, {sensitivity: "base", numeric: true});
        	    });
        	}
        	getFilteredPages(){
        	    return (this.local.pages || []).map((page) => {
        	        return {name: page.name, child: this.sortInputs(page.child).filter((child) => this.inputMatchesSearch(child))};
        	    }).filter((page) => page.child.length > 0);
        	}
        	getFilteredActions(){
        	    return this.sortInputs((this.local.form?.actions || []).filter((action) => action?.type == "business_logic" && this.inputMatchesSearch(action)));
        	}
        	getFilteredFlowElements(flow){
        	    return this.sortInputs((flow?.elements || []).filter((element) => this.inputMatchesSearch(element)));
        	}
        	hasInputResults(){
        	    if(this.getFilteredPages().length > 0 || this.getFilteredActions().length > 0){
        	        return true;
        	    }
        	    for(let flow of (this.local.form?.flows || [])){
        	        if(this.getFilteredFlowElements(flow).length > 0){
        	            return true;
        	        }
        	    }
        	    return false;
        	}
        	constructList(){
        	    for(let item of this.navParams.data.form.formulaire){
        	        if(item.type == "action"){
        	            //do nothing
        	        }
        	        else if(item.type == "ion-card"){
        	            // recursive
        	        }
        	        else{
        	            this.local
        	        }
        	        
        	    }
        	}
        	/*End_c8o_PageFunction*/
        '
