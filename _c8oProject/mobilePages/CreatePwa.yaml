        	public async showToast(msg: string){
        	    let toastController = this.getInstance(ToastController);
                (await toastController.create({
                    message: msg,
                    duration: 3000,
                    position: ''bottom''
                  })).present();
        	}
        	
        	public makeid(length) {
                var result           = '''';
                var characters       = ''ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'';
                var charactersLength = characters.length;
                for ( var i = 0; i < length; i++ ) {
                   result += characters.charAt(Math.floor(Math.random() * charactersLength));
                }
                return result;
            }
        	
        	public detectContentType(base64Content) {
                // base64 encoded data doesn''t contain commas    
               let base64ContentArray = base64Content.split(",")
               // base64 content cannot contain whitespaces but nevertheless skip if there are!
               return [base64ContentArray[0].match(/[^:\s*]\w+\/[\w-+\d.]+(?=[;| ])/)[0], base64ContentArray[1]];
            }
        	
        	public b64toBlob(b64Data, contentType='''', sliceSize=512){
               const byteCharacters = atob(b64Data);
               const byteArrays = [];
        
               for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                 const slice = byteCharacters.slice(offset, offset + sliceSize);
        
                 const byteNumbers = new Array(slice.length);
                 for (let i = 0; i < slice.length; i++) {
                   byteNumbers[i] = slice.charCodeAt(i);
                 }
        
                 const byteArray = new Uint8Array(byteNumbers);
                 byteArrays.push(byteArray);
               }
        
               const blob = new Blob(byteArrays, {type: contentType});
               return blob;
             }
           
        	 public getContrastingTextColor(color) {
        	   let r, g, b;
        
        	   // --- 🔹 HEX ---
        	   if (color.startsWith(''#'')) {
        	     color = color.replace(''#'', '''');
        	     if (color.length === 3) color = color.split('''').map(c => c + c).join('''');
        	     r = parseInt(color.substr(0, 2), 16);
        	     g = parseInt(color.substr(2, 2), 16);
        	     b = parseInt(color.substr(4, 2), 16);
        	   }
        
        	   // --- 🔹 RGB / RGBA ---
        	   else if (color.startsWith(''rgb'')) {
        	     const parts = color.match(/[\d.]+/g).map(Number);
        	     [r, g, b] = parts;
        	   }
        
        	   // --- 🔹 HSL / HSLA ---
        	   else if (color.startsWith(''hsl'')) {
        	     const [h, s, l] = color
        	       .match(/[\d.]+/g)
        	       .map((v, i) => (i === 0 ? Number(v) : Number(v) / 100));
        
        	     // Conversion HSL → RGB
        	     const a = s * Math.min(l, 1 - l);
        	     const f = n => {
        	       const k = (n + h / 30) % 12;
        	       const col = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
        	       return Math.round(255 * col);
        	     };
        	     [r, g, b] = [f(0), f(8), f(4)];
        	   }
        
        	   // --- 🔹 Valeur CSS variable (ex: var(--color)) ---
        	   else if (color.startsWith(''var('')) {
        	     const cssVar = getComputedStyle(document.documentElement)
        	       .getPropertyValue(color.match(/--[a-zA-Z0-9-_]+/)[0])
        	       .trim();
        	     return this.getContrastingTextColor(cssVar || ''#1A1A1A''); // récursion !
        	   }
        
        	   else {
        	     console.warn(''Format de couleur non reconnu:'', color);
        	     return ''#1A1A1A''; // fallback
        	   }
        
        	   // --- 🔹 Calcul de la luminance ---
        	   const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        
        	   return luminance > 0.5 ? ''#1A1A1A'' : ''#FFF'';
        	 }
        
        	 
        
        	/*End_c8o_PageFunction*/
