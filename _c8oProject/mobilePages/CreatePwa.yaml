        '/*Begin_c8o_PageImport*/
        import { sha256 } from ''js-sha256'';
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public form: any = null;
        	public pwa;
        	public isFirstPWA;
        	public realFormFrom: any;
        	public publishInfos: any;
        	public new: boolean;
        	public publish: boolean;
        	
        	public idselected = "";
        	public segment = "";
        	public color: any = ''#ffffff'';
        	public filePreview: any = {source: null, type: null};
        	public hasAnImage = false;
        	public wallpaper: any = null;
        	public key: string = "wallpaper";
        	public file: any;
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		
        		//old
        		this.form = this.navParams.data.form;
        		this.isFirstPWA = this.navParams.data.isFirstPWA != undefined && this.navParams.data.isFirstPWA
        		this.realFormFrom = this.navParams.get("realFormFrom");
        		this.publishInfos = this.navParams.get("publishInfos");
        		
        		//used today
        		this.form = this.navParams.data.form;
        		this.new = this.navParams.data.new;
        		this.publish = this.navParams.data.publish;
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		/*End_c8o_PageInitialization*/
        /*Begin_c8o_PageAfterViewInit*/
