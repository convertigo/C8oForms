        	public initMetrics(type = "1") {
        		if (type === "1") {
        			// case of carto
        		} else {
        			// case of suivi
        //			public vars_suivi :Record<string, string> = {
        //				"C8Oforms.admin_stats_getCumulatedAnswersPerDay": "cumulatedAnswersPerDay",
        //				"C8Oforms.admin_stats_getCountAnswersPerDay": "countAnswersPerDay",
        //				"C8Oforms.admin_stats_getFormsCountPerDay": "appCountPerDay",
        //				"C8Oforms.admin_stats_getCumulatedFormsPerDay": "appCumulatedPerDay"
        //			}
        			try {
        				setTimeout(() => {	
        //					console.log(this.metricsCount)	
        					if (this.metricsCount > 3) {
        						// APPLICATIONS METRICS				
        						// nombre d''applications créées aujourd''hui		
        //						console.log(this.local.appCountPerDay)
        						let today = new Date();
        						let lastAppDate = new Date(this.local.appCountPerDay.data.values[0].key);
        						
        						let c = (today.getFullYear() === lastAppDate.getFullYear() &&
        						today.getMonth() === lastAppDate.getMonth() &&
        						today.getDate() === lastAppDate.getDate() )
        						let yest = this.local.appCountPerDay.data.values.filter((item)=>{
        							const d2 = new Date(item.key);
        							return 	(today.getFullYear() === d2.getFullYear() &&
        									today.getMonth() === d2.getMonth() &&
        									today.getDate() - 1 === d2.getDate() );
        						});
        						if (c) {
        //							console.log(this.local.appCountPerDay.data.values)
        							let stat = ''+'';
        							let value: number | string = 0;
        							if (this.local.appCountPerDay.data.values[1].value > this.local.appCountPerDay.data.values[0].value) {
        								value = this.local.appCountPerDay.data.values[1].value - this.local.appCountPerDay.data.values[0].value;
        								stat = ''—'' + value;
        							} else if (this.local.appCountPerDay.data.values[1].value < this.local.appCountPerDay.data.values[0].value) {								
        								value = this.local.appCountPerDay.data.values[0].value - this.local.appCountPerDay.data.values[1].value
        								stat += value;
        							} else {
        								stat = ''—'';	
        							}
        							this.metrics[0] = {
        								value: this.local.appCountPerDay.data.values[0].value,
        								title: this.translate.instant("metrics_rep1_title"),
        								desc: stat + this.translate.instant("metrics_rep1_desc"),
        								icon: "calendar",
        								type: ''applications'',
        								iconClass: ''metric-icon-badge--info''
        							}
        //							console.log(this.metrics)
        						} else {
        							let stat;
        							if (yest.length > 0) {
        								stat = ''-''+yest[0].value;	
        							} else {
        								stat = 0;
        							}
        							this.metrics[0] = {
        								value: 0,
        								title: this.translate.instant("metrics_rep1_title"),
        								desc: stat + this.translate.instant("metrics_rep1_desc"),
        								icon: "calendar",
        								type: ''applications'',
        								iconClass: ''metric-icon-badge--info''
        							}
        						}
        						// moyenne quotidienne (30 derniers jours) - app créées
        						let lastMonthData = this.local.appCountPerDay.data.values.filter(dt => {
        						  const today = new Date();
        						  const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
        						  return new Date(dt.key) > thirtyDaysAgo;
        						});
        //						console.log(lastMonthData);
        						let sum = lastMonthData.reduce((sum, obj) => sum + obj.value, 0)
        						let av = ((typeof sum == "number") ? sum:0) / lastMonthData.length
        						this.metrics[1] = {
        							value: av,
        							title: this.translate.instant("metrics_rep2_title"),
        							desc: this.translate.instant("metrics_rep2_desc"),
        							icon: "chart-column",
        							type: ''applications'',
        							iconClass: ''metric-icon-badge--success''
        						}
        						console.log(this.local)
        						
        						// total cumulé - app créées
        						
        						this.metrics[2] = {
        							value: this.local.appCumulatedPerDay?.data?.values[0].value ?? 0,
        							title: this.translate.instant("metrics_rep3_title"),
        							desc: this.translate.instant("metrics_rep3_desc"),
        							icon: "trending-up",
        							type: ''applications'',
        							iconClass: ''metric-icon-badge--warning''
        						}
        						
        						// pic d''activité - app créé (jour où le pic est survenu)
        						
        						let maxObject = this.local.appCountPerDay.data.values.reduce((max, obj) =>
        						  obj.value > max.value ? obj : max
        						);
        						
        						let timestamp = maxObject.key; // exemple
        						let date = new Date(timestamp);
        
        						let formatted = `${date.getDate().toString().padStart(2, ''0'')}/${(date.getMonth() + 1)
        						  .toString()
        						  .padStart(2, ''0'')}`;
        						
        						this.metrics[3] = {
        							value: maxObject.value ?? 0,
        							title: this.translate.instant("metrics_rep4_title"),
        							desc: this.translate.instant("metrics_rep4_desc")+formatted,
        							icon: "activity",
        							type: ''applications'',
        							iconClass: ''metric-icon-badge--tertiary''
        						}
        						
        						// RESPONSES METRICS
        						
        						today = new Date();
        						lastAppDate = new Date(this.local.countAnswersPerDay.data.values[0].key);
        						
        						c = (today.getFullYear() === lastAppDate.getFullYear() &&
        						today.getMonth() === lastAppDate.getMonth() &&
        						today.getDate() === lastAppDate.getDate() )
        						yest = this.local.countAnswersPerDay.data.values.filter((item)=>{
        							const d2 = new Date(item.key);
        							return 	(today.getFullYear() === d2.getFullYear() &&
        									today.getMonth() === d2.getMonth() &&
        									today.getDate() - 1 === d2.getDate() );
        						});
        						if (c) {
        //							console.log(this.local.appCountPerDay.data.values)
        							let stat = ''+'';
        							let value: number | string = 0;
        							if (this.local.countAnswersPerDay.data.values[1].value > this.local.countAnswersPerDay.data.values[0].value) {
        								value = this.local.countAnswersPerDay.data.values[1].value - this.local.countAnswersPerDay.data.values[0].value;
        								stat = ''—'' + value;
        							} else if (this.local.countAnswersPerDay.data.values[1].value < this.local.countAnswersPerDay.data.values[0].value) {								
        								value = this.local.countAnswersPerDay.data.values[0].value - this.local.countAnswersPerDay.data.values[1].value
        								stat += value;
        							} else {
        								stat = ''—'';	
        							}
        							this.metrics[4] = {
        								value: this.local.countAnswersPerDay.data.values[0].value,
        								title: this.translate.instant("metrics_rep5_title"),
        								desc: stat + this.translate.instant("metrics_rep5_desc"),
        								icon: "calendar",
        								type: ''responses'',
        								iconClass: ''metric-icon-badge--info''
        							}
        //							console.log(this.metrics)
        						} else {
        							let stat;
        							if (yest.length > 0) {
        								stat = ''-''+yest[0].value;	
        							} else {
        								stat = 0;
        							}
        							this.metrics[4] = {
        								value: 0,
        								title: this.translate.instant("metrics_rep5_title"),
        								desc: stat + this.translate.instant("metrics_rep5_desc"),
        								icon: "calendar",
        								type: ''responses'',
        								iconClass: ''metric-icon-badge--info''
        							}
        						}
        						// moyenne quotidienne (30 derniers jours) - app créées
        						lastMonthData = this.local.countAnswersPerDay.data.values.filter(dt => {
        						  const today = new Date();
        						  const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
        						  return new Date(dt.key) > thirtyDaysAgo;
        						});
        //						console.log(lastMonthData);
        						sum = lastMonthData.reduce((sum, obj) => sum + obj.value, 0) 
        						av = ((typeof sum == "number") ? sum:0) / lastMonthData.length
        //						console.log(av, sum, lastMonthData, 0 / 0)
        						this.metrics[5] = {
        							value: Number.isNaN(av) ? 0 : av,
        							title: this.translate.instant("metrics_rep6_title"),
        							desc: this.translate.instant("metrics_rep6_desc"),
        							icon: "chart-column",
        							type: ''responses'',
        							iconClass: ''metric-icon-badge--success''
        						}
        //						console.log(this.local)
        						
        						// total cumulé - app créées
        						
        						this.metrics[6] = {
        							value: this.local.cumulatedAnswersPerDay?.data?.values[0].value ?? 0,
        							title: this.translate.instant("metrics_rep7_title"),
        							desc: this.translate.instant("metrics_rep7_desc"),
        							icon: "trending-up",
        							type: ''responses'',
        							iconClass: ''metric-icon-badge--warning''
        						}
        						
        						// pic d''activité - app créé (jour où le pic est survenu)
        						
        						maxObject = this.local.countAnswersPerDay.data.values.reduce((max, obj) =>
        						  obj.value > max.value ? obj : max
        						);
        						
        						timestamp = Number(maxObject.key); // exemple
        						date = new Date(timestamp);
        
        						formatted = `${date.getDate().toString().padStart(2, ''0'')}/${(date.getMonth() + 1)
        						  .toString()
        						  .padStart(2, ''0'')}`;
        						
        						this.metrics[7] = {
        							value: maxObject.value ?? 0,
        							title: this.translate.instant("metrics_rep8_title"),
        							desc: this.translate.instant("metrics_rep8_desc")+formatted,
        							icon: "activity",
        							type: ''responses'',
        							iconClass: ''metric-icon-badge--tertiary''
        						}
        						
        						this.local.countAnswersPerDay.options.colors=[''#00B7FF'']
        						this.local.countAnswersPerDay.options.stroke.width = 2;
        						this.local.countAnswersPerDay.options.grid = {
        						  show: true, // active les lignes
        						  borderColor: ''#E5E7EB'', // couleur principale des lignes (#E5E7EB = gris clair)
        						  strokeDashArray: 4, // rend les lignes en pointillés (0 = plein)
        						  position: ''back'',
        						  xaxis: {
        						    lines: {
        						      show: false // ❌ pas de lignes verticales
        						    }
        						  },
        						  yaxis: {
        						    lines: {
        						      show: true // ✅ lignes horizontales visibles
        						    }
        						  },
        						  row: {
        						    colors: [''transparent''], // ou [''#F9FAFB'', ''transparent''] pour alternance
        						    opacity: 0.5
        						  },
        						};
        						
        						this.local.cumulatedAnswersPerDay.options.colors=[''#00B7FF'']
        						this.local.cumulatedAnswersPerDay.options.stroke.width = 2;
        						this.local.cumulatedAnswersPerDay.options.grid = {
        						  show: true, // active les lignes
        						  borderColor: ''#E5E7EB'', // couleur principale des lignes (#E5E7EB = gris clair)
        						  strokeDashArray: 4, // rend les lignes en pointillés (0 = plein)
        						  position: ''back'',
        						  xaxis: {
        						    lines: {
        						      show: false // ❌ pas de lignes verticales
        						    }
