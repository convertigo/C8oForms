            		if (page.navParams.data.target == ''1'') return
            		if (page.intervalRef) clearInterval(page.intervalRef);
            
            		// ⚡ Lance la boucle d’alternance après que tout est affiché
            		page.intervalRef = setInterval(() => {
            		  if (page.isAnimating) return;
            		  page.isAnimating = true;
            
            		  // Étape 1 : déclenche l’animation de sortie
            		  const current = document.querySelector(''.animate-slideIn'');
            		  if (current) {
            		    current.classList.remove(''animate-slideIn'');
            		    current.classList.add(''animate-slideOut'');
            		  }
            
            		  // Étape 2 : change la vue après l’anim
            		  setTimeout(() => {
            		    page.currentMetricsView =
            		      page.currentMetricsView === ''responses'' ? ''applications'' : ''responses'';
            		    page.ref.detectChanges();
            
            		    // Étape 3 : animation d’entrée
            		    setTimeout(() => {
            		      const next = document.querySelector(
            		        page.currentMetricsView === ''responses''
            		          ? ''.DivCardsHeader''
            		          : ''.DivCardsHeader1''
            		      );
            		      if (next) {
            		        next.classList.add(''animate-slideIn'');
            		        next.classList.remove(''animate-slideOut'');
            		      }
            		      page.isAnimating = false;
            		    }, 50);
            		  }, 600); // durée de fadeSlideOut
            		}, 10000);
            		resolve();
            '
