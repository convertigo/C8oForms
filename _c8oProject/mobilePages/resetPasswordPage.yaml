      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public modalTitle: string = ''Réinitialiser le mot de passe'';
        	public descriptionText: string = ''Saisissez l\''adresse e-mail associée à votre compte. Si un compte existe pour l\''e-mail fourni, vous recevrez un lien de réinitialisation de mot de passe sous peu. Veuillez vérifier votre boîte de réception et vos courriers indésirables.'';
        	public usernamePlaceholder = ''Votre adresse mail'';
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.modalTitle = this.translate.instant(''login_modal_title'');
        		this.descriptionText = this.translate.instant(''login_description_text'');
        		this.usernamePlaceholder = this.translate.instant(''login_email_placeholder'');
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	/*End_c8o_PageFunction*/
        '
