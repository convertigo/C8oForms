          'div.modal-container {
          //  padding: 16px;
          	position: relative;
          	display: grid;
          	grid-template-rows: auto auto auto 1fr;
          }
          
          ion-button:nth-child(-n + 2) {
          	text-transform: none;
          	font-size: 14px !important;
          	width: 50%;
          	height: 42px;
          }
          
          .modal-header {
          	font-size: 16px;
          	display: flex;
          	align-items: baseline !important;
          	margin-bottom: 0 !important;
          }
          
          .modal-header .logo {
            font-size: 16px;
            font-weight: 700;
          //  color: var(--ion-color-primary, #635bff);
            color: var(--ion-color-convertigo);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            
            background: var(--ion-color-convertigo);
          //  background-image: linear-gradient(
          //    var(--ion-gradient-angle, 135deg),
          //    var(--ion-color-primary),
          //    var(--ion-color-convertigo)
          //  );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            ion-icon {
          	font-size: 38px;
          	color: var(--ion-color-convertigo) !important;
          	margin-right: 0.35rem;
            }
          }
          
          h2.title {
            font-weight: 700;
            font-size: 17.5px;
            margin-bottom: 21px;
          }
          
          p.description {
            font-size: 14px;
            color: var(--ion-color-medium-shade);
            margin-bottom: 20px;
            margin-top: 0;
            line-height: 22.75px;
          }
          
          ion-input {
            width: 100%;
            margin-top: 4px;
            margin-bottom: 20px;
          }
          
          ion-button.cancel-button {
            --border-radius: 8px;
            color: var(--ion-color-dark);
            background: transparent;
            box-shadow: none;
            border: none;
            margin-right: 12px;
          }
          
          ion-button.cancel-button:hover {
          	--ripple-color: transparent !important;
          	&::part(native) {		
          		box-shadow:
          		0 20px 25px -5px rgba(0, 0, 0, 0.1),
          		0 8px 10px -6px rgba(0, 0, 0, 0.1);
          		transition-property: all;
          		transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
          		transition-duration: 150ms;
          		transition-duration: .3s;
          		transform: scale(1.01);
          	}
          }
          
          ion-button.send-button {
            --border-radius: 8px;
            color: var(--ion-color-convertigo-contrast);
          }
          
          ion-button.send-button:hover {
          	--ripple-color: transparent !important;
          	&::part(native) {		
          		box-shadow:
          		0 20px 25px -5px rgba(0, 0, 0, 0.1),
          		0 8px 10px -6px rgba(0, 0, 0, 0.1);
          		transition-property: all;
          		transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
          		transition-duration: 150ms;
          		transition-duration: .3s;
          		transform: scale(1.01);
          	}
          }
          
          ion-icon.logo-icon {
            vertical-align: middle;
            margin-right: 6px;
            color: var(--ion-color-primary);
            font-size: 1.5rem;
          }
          
          header.modal-header {
            display: flex;
            align-items: center;
          //  justify-content: space-between;
            font-weight: 500;
          //  font-size: 1rem;
            margin-bottom: 16px;
          }
          
          header.modal-header span.title-text {
            margin-left: 16px;
            color: var(--ion-color-medium) !important;
          }
          
          ion-button.close-button {
          	position: absolute;
          	top: 4px;
          	right: 4px;
          	z-index:5;
          	margin: 0;
          	width: auto;
          	background: transparent;
          	--background: transparent;
          	--box-shadow: none;
          	border: none;
          	font-size: 12px;
          	color: var(--ion-color-medium-shade);
          	cursor: pointer;
          }
          
          label.email-label, ion-label.email-label {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            display: block;
          }
          '
