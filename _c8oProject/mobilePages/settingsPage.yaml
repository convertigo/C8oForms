                        →: |
                          '		try {
                          			page.local.mcpBusy = true;
                          			page.local.mcpCreateError = "";
                          			let tokenName: string = (page.local.mcpTokenName || "").trim();
                          			if (!tokenName.length) {
                          				page.local.mcpCreateError = page.translate.instant("mcp_token_label_required");
                          				return;
                          			}
                          			let response: any = await page.c8o.callJsonObject("C8Oforms.APIV2_McpTokenCreate", {name: tokenName}).async();
                          			let result: any = response?.result || response?.document?.result || {};
                          			if (result?.status == "error") {
                          				page.local.mcpCreateError = page.translate.instant(result?.error?.code || "mcp_token_create_failed");
                          				return;
                          			}
                          			page.local.mcpCreatedToken = result?.token || "";
                          			page.local.mcpCreatedTokenInfo = result?.tokenInfo || null;
                          			page.local.mcpTokens = Array.isArray(result?.tokens) ? result.tokens : (result?.tokens != null ? [result.tokens] : []);
                          			page.local.mcpTokenName = "";
                          			try {
                          				if (page.local.mcpCreatedToken && navigator?.clipboard?.writeText) {
                          					await navigator.clipboard.writeText(page.local.mcpCreatedToken);
                          				}
                          			}
                          			catch (copyError) {}
                          		}
                          		catch (e) {
                          			console.error("mcp token create error", e);
                          		}
                          		finally {
                          			page.local.mcpBusy = false;
                          			return;
                          		}
                          '
