        /*Begin_c8o_PageFunction*/
        	public async defineGdrp(translate) {
        		class gdrp {
        			private _text: string = "";
        			private translate: any;
        			constructor(translate: any) {
        				this.translate = translate;
        			}
        			get text(): string {
        				try {
        					let parsed = JSON.parse(this._text);
        					if (parsed[this.translate.currentLang] === undefined) {
        						return this._text;
        					}
        					return parsed[this.translate.currentLang];
        				}
        				catch (e) {
        					return this._text;
        				}
        			}
        			set text(value: string) {
        				this._text = value;
        			}
        		}
        		try {
        			let resp = await this.c8o.callJsonObject("C8Oforms.getGDRPmenu",{["lang"]:translate.currentLang, [C8oLocalCache.PARAM]: new C8oLocalCache(Priority.SERVER, 99999999999999999999)}).async();
        			if (resp.ok == "true") {
        				this.global.c8oGDRPmenu = new gdrp(translate);
        				this.global.c8oGDRPmenu.text = resp.text;
        			}
        			else {
        				this.global.c8oGDRPmenu = null;
        			}
        		}
        		catch (e) {
        			// silent error
        			console.error(e);
        		}
        		try {
        			let resp = await this.c8o.callJsonObject("C8Oforms.getGDRPtoast",{["lang"]:translate.currentLang, ["type"]: "builders", [C8oLocalCache.PARAM]: new C8oLocalCache(Priority.SERVER, 99999999999999999999)}).async()
        //			console.log(resp);
        			if (resp.ok == "true") {
        				this.global.c8oGDRPtoast = new gdrp(translate);
        				this.global.c8oGDRPtoast.text = resp.text;
        			}
        			else {
        				this.global.c8oGDRPtoast = null;
        			}
        		}
        		catch (e) {
        			// silent error
        			console.error(e);
        		}
        //		debugger;
        	}
        	
        	public isValidJSON(str: string): boolean {
        	  if (typeof str !== "string") return false;
        	  if (!str.trim().startsWith("{") && !str.trim().startsWith("[")) return false;
        
        	  try {
        	    JSON.parse(str);
        	    return true;
        	  } catch {
        	    return false;
        	  }
        	}
        	
        	public fixSectionColors(sections) {
        	  const paletteBlue = { color: "#00BCD4", backgroundColor: "#CEFAFE" };
        	  const paletteViolet = { color: "#8B5CF6", backgroundColor: "#F3E8FF" };
        
        	  const palettes = [paletteBlue, paletteViolet];
        
        	  return sections.map((item, index) => {
        	    // palette imposée selon index
        	    const expectedPalette = palettes[index % 2];
        
        	    // Si l''item ne respecte pas la palette attendue, on corrige
        	    if (
        	      item.icon.color !== expectedPalette.color ||
        	      item.icon.backgroundColor !== expectedPalette.backgroundColor
        	    ) {
        	      return {
        	        ...item,
        	        icon: {
        	          ...item.icon,
        	          color: expectedPalette.color,
        	          backgroundColor: expectedPalette.backgroundColor
        	        }
        	      };
        	    }
        
        	    // Sinon on garde tel quel
        	    return item;
        	  });
        	}
        
        	/*End_c8o_PageFunction*/
        '
