        	public registerTinySpacingControls(editor){
        		if(!editor || editor["__c8oSpacingRegistered"]){
        			return;
        		}
        		editor["__c8oSpacingRegistered"] = true;
        		const getTargetBlock = () => {
        			const node = editor.selection.getNode();
        			return editor.dom.getParent(
        				node,
        				"p,div,h1,h2,h3,h4,h5,h6,blockquote,li"
        			) || node;
        		};
        		const setSpacingValue = (block, property, value) => {
        			const normalized = value == null || value === "" ? null : value;
        			editor.dom.setStyle(block, property, normalized);
        		};
        		const applySpacing = (values) => {
        			const block = getTargetBlock();
        			if(values.marginTop !== undefined){
        				setSpacingValue(block, "margin-top", values.marginTop);
        			}
        			if(values.marginRight !== undefined){
        				setSpacingValue(block, "margin-right", values.marginRight);
        			}
        			if(values.marginBottom !== undefined){
        				setSpacingValue(block, "margin-bottom", values.marginBottom);
        			}
        			if(values.marginLeft !== undefined){
        				setSpacingValue(block, "margin-left", values.marginLeft);
        			}
        			if(values.padding !== undefined){
        				setSpacingValue(block, "padding", values.padding);
        			}
        			if(values.paddingTop !== undefined){
        				setSpacingValue(block, "padding-top", values.paddingTop);
        			}
        			if(values.paddingRight !== undefined){
        				setSpacingValue(block, "padding-right", values.paddingRight);
        			}
        			if(values.paddingBottom !== undefined){
        				setSpacingValue(block, "padding-bottom", values.paddingBottom);
        			}
        			if(values.paddingLeft !== undefined){
        				setSpacingValue(block, "padding-left", values.paddingLeft);
        			}
        			editor.nodeChanged();
        		};
        		const clearSpacing = () => {
        			const block = getTargetBlock();
        			[
        				"margin-top",
        				"margin-right",
        				"margin-bottom",
        				"margin-left",
        				"padding",
        				"padding-top",
        				"padding-right",
        				"padding-bottom",
        				"padding-left"
        			].forEach((property) => editor.dom.setStyle(block, property, null));
        			editor.nodeChanged();
        		};
        		const buildSpacingItems = () => {
        			return [
        				{
        					type: "menuitem",
        					text: "Marge basse 8px",
        					onAction: () => applySpacing({ marginBottom: "8px" })
        				},
        				{
        					type: "menuitem",
        					text: "Marge basse 16px",
        					onAction: () => applySpacing({ marginBottom: "16px" })
        				},
        				{
        					type: "menuitem",
        					text: "Marge basse 24px",
        					onAction: () => applySpacing({ marginBottom: "24px" })
        				},
        				{
