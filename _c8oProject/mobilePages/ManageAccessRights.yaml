        	}
        	public creator(){
        		return {displayName: this.local.creator?.displayName, email: this.local.creator?.displayMail, id: this.local.creator?.value ? this.local.creator?.value?.substring(12): ""};
        	}
        	public async showConfirmationAlert(header: string, message: string, cancelLabel: string, confirmLabel: string, cssClass: string, btClass, confirmRed: boolean = true, cancelRed: boolean = false): Promise<boolean> {
        		let alertController = this.getInstance(AlertController)
        		const alert = await alertController.create({
        			header: header,
        			message: message,
        			backdropDismiss: false,
        			cssClass: cssClass,
        			buttons: [
        				{
        					cssClass: cancelRed ? "button-danger" : btClass,
        					text: cancelLabel,
        					role: ''cancel'',
        					handler: () => {
        						return false;
        					}
        				},
        				{
        					cssClass: confirmRed ? "button-danger" : btClass,
        					text: confirmLabel,
        					handler: () => {
        						return true;
        					}
        				}
        			]
        		});
        		await alert.present();
        		return new Promise((resolve) => {
        			alert.onDidDismiss().then((data) => {
        				resolve(!(data.role == ''cancel''));
        			});
        		});
        	}
        	async presentToast(message: string, cssClass: string = '''', position = "bottom", duration = 3000, closeBtn = false) {
        		let opts: any = {
        			message: message,
        			duration: duration,
        			position: position,
        			cssClass: cssClass
        		}
        		if (closeBtn) {
        			opts.buttons = [
        				{
        					side: ''end'',
        					icon: ''close'',
        					text: this.translate.instant("close"),
        					handler: () => {
        						toast.dismiss();
        					}
        				}
        			]
        		}
        		let toastController = this.getInstance(ToastController);
        		const toast = await toastController.create(opts);
        		await toast.present();
        	}
        	/*End_c8o_PageFunction*/
