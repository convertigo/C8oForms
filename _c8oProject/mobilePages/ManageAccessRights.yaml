        					text: "Marge haute 16px",
        					onAction: () => applySpacing({ marginTop: "16px" })
        				},
        				{
        					type: "menuitem",
        					text: "Marge gauche 24px",
        					onAction: () => applySpacing({ marginLeft: "24px" })
        				},
        				{
        					type: "menuitem",
        					text: "Marge droite 24px",
        					onAction: () => applySpacing({ marginRight: "24px" })
        				},
        				{
        					type: "menuitem",
        					text: "Padding 12px",
        					onAction: () => applySpacing({ padding: "12px" })
        				},
        				{
        					type: "menuitem",
        					text: "Padding 24px",
        					onAction: () => applySpacing({ padding: "24px" })
        				},
        				{
        					type: "menuitem",
        					text: "Configurer...",
        					onAction: () => {
        						const block = getTargetBlock();
        						editor.windowManager.open({
        							title: "Configurer les espacements",
        							body: {
        								type: "panel",
        								items: [
        									{
        										type: "input",
        										name: "marginTop",
        										label: "Marge haute",
        										placeholder: "ex: 16px"
        									},
        									{
        										type: "input",
        										name: "marginRight",
        										label: "Marge droite",
        										placeholder: "ex: 24px"
        									},
        									{
        										type: "input",
        										name: "marginBottom",
        										label: "Marge basse",
        										placeholder: "ex: 16px"
        									},
        									{
        										type: "input",
        										name: "marginLeft",
        										label: "Marge gauche",
        										placeholder: "ex: 24px"
        									},
        									{
        										type: "input",
