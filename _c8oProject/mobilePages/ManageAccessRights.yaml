        	public getTitle(){
        		if(this.local.transfer){
        			return this.translate.instant(''transfer_ownership_form2'', {appName: this.local?.form?.name})
        		}
        		else if(this.local.collab){
        			return this.translate.instant(''Add_collaborators'') + '' '' + this.translate.instant(''to_the_app'') + '' '' + this.local?.form?.name
        		}
        		else{
        			return this.translate.instant(''share_form'') + '' '' + this.local?.form?.name
        		}
        	}
        	public isAcollab(id){
        		if(this.local.collab == false && this.local.form.c8oCollabs != undefined && this.local.form.c8oCollabs[id] != undefined && this.local.form.c8oCollabs[id] == true){
        			return true
        		}
        		return false;
        	}
        	public ObjectKeys(obj:any){
        	    if(obj != undefined){
        	        return Object.keys(obj);
        	    }
        	    else{
        	        return []
        	        }
        	}
        	public computeSortLabel(entry: any){
        		if (!entry) {
        			return ""
        		}
        		let base = entry.display ?? entry.displayName ?? entry.displayMail ?? entry.value ?? ""
        		return ("" + base).toLocaleLowerCase()
        	}
        	public computeFilteredGrp(){
        		let source = Array.isArray(this.local.grp) ? this.local.grp.slice() : []
        		source.sort((a, b) => {
        			let aLabel = this.computeSortLabel(a)
        			let bLabel = this.computeSortLabel(b)
        			if (aLabel < bLabel) {
        				return -1
        			}
        			if (aLabel > bLabel) {
        				return 1
        			}
        			return 0
        		})
        		let showGroups = this.local.filters?.showGroups !== false
        		let showUsers = this.local.filters?.showUsers !== false
        		if (showGroups && showUsers) {
        			return source
        		}
        		return source.filter((entry) => {
        			let type = entry?.type
        			if (type == "group") {
        				return showGroups
        			}
        			if (type == "user") {
        				return showUsers
        			}
        			return showUsers
        		})
        	}
        	public refreshFilteredGrp(event = null, target = null){
        		if(!this.local.filters){
        			this.local.filters = { showGroups: true, showUsers: true };
        		}
        		if(target != null){
        			if(this.local.filters.showGroups !== true && this.local.filters.showUsers !== true){
        				if(target == "groups"){
        					this.local.filters.showUsers = true;
        					this.ref.detectChanges();
        				}
        				else{
        					this.local.filters.showGroups = true;
        					this.ref.detectChanges();
        				}
        			}
        		}
        		this.local.filteredGrp = this.computeFilteredGrp();
        	}
        	public normalizeCsvEmail(value){
        		if(value == undefined || value == null){
        			return "";
        		}
        		return ("" + value).trim().toLowerCase();
        	}
        	public normalizeCsvRights(value){
        		if(value == undefined || value == null){
        			return "";
        		}
        		var raw = ("" + value).trim();
        		if((raw.startsWith("\"") && raw.endsWith("\"")) || (raw.startsWith("''") && raw.endsWith("''"))){
        			raw = raw.substring(1, raw.length - 1);
        		}
        		raw = raw.trim().toLowerCase();
        		if(raw == ""){
        			return "";
        		}
        		raw = raw.replace(/[\s-]+/g, "_");
        		raw = raw.replace(/_+/g, "_");
        		raw = raw.replace(/^_+|_+$/g, "");
        		if(raw == "responses"){
        			return "Responses";
        		}
        		if(raw == "edition"){
        			return "Edition";
        		}
        		if(raw == "edition_responses" || raw == "editionresponses"){
        			return "Edition_Responses";
        		}
        		return "";
        	}
        	public extractCsvEntries(text){
        		var csvText = "" + (text != null ? text : "");
        		var lines = csvText.split(/\r?\n/);
        		var values = [];
        		lines.forEach((line)=>{
        			if(line == null){
        				return;
        			}
        			var raw = ("" + line).trim();
        			if(raw == ""){
        				return;
        			}
        			if(raw.charCodeAt(0) == 0xFEFF){
        				raw = raw.substring(1);
        			}
        			var sepIndex = raw.search(/[,;\t]/);
        			var first = "";
        			var second = "";
        			if(sepIndex >= 0){
        				first = raw.substring(0, sepIndex);
        				second = raw.substring(sepIndex + 1);
        				var nextIndex = second.search(/[,;\t]/);
        				if(nextIndex >= 0){
        					second = second.substring(0, nextIndex);
        				}
        			}
        			else{
        				first = raw;
        			}
        			first = ("" + first).trim();
        			second = ("" + second).trim();
        			if((first.startsWith("\"") && first.endsWith("\"")) || (first.startsWith("''") && first.endsWith("''"))){
        				first = first.substring(1, first.length - 1);
        			}
        			if((second.startsWith("\"") && second.endsWith("\"")) || (second.startsWith("''") && second.endsWith("''"))){
        				second = second.substring(1, second.length - 1);
        			}
        			first = first.trim();
        			second = second.trim();
        			if(first == "" || first.indexOf("@") == -1){
        				return;
        			}
        			values.push({email: first, rights: this.normalizeCsvRights(second)});
        		});
        		return values;
        	}
        	public async importUsersFromCsv(event){
        		try {
        			var file = event?.target?.files?.[0] || event?.srcElement?.files?.[0];
        			if(!file){
        				return;
        			}
        			var text = await new Promise((resolve, reject)=>{
        				var reader = new FileReader();
        				reader.onload = ()=>{resolve(reader.result);};
        				reader.onerror = ()=>{reject(reader.error);};
        				reader.readAsText(file);
        			});
        			var entries = this.extractCsvEntries(text);
        			this.addUsersFromCsvEntries(entries);
        		} catch (e) {
        		} finally {
        			try {
        				if(event && event.target){
        					event.target.value = "";
        				}
        			} catch (e) {
        			}
        		}
        	}
        	public addUsersFromCsvEntries(entries){
        		try {
        			if(!Array.isArray(entries) || entries.length == 0){
        				return;
        			}
        			var existing = {};
        			(this.local.newUsersOrGroups || []).forEach((item)=>{
        				var key = this.normalizeCsvEmail(item?.displayMail || item?.display || item?.value);
        				if(key != ""){
        					existing[key] = true;
        				}
        			});
        			(this.local.existingGrpsOrUsersArray || []).forEach((item)=>{
        				var key = this.normalizeCsvEmail(item?.displayMail || item?.display || item?.value);
        				if(key != ""){
        					existing[key] = true;
        				}
        			});
        			var available = Array.isArray(this.local.filteredGrp) ? this.local.filteredGrp : [];
        			entries.forEach((entry)=>{
        				var email = entry?.email != undefined ? entry.email : entry;
        				var rights = entry?.rights;
        				var key = this.normalizeCsvEmail(email);
        				if(key == "" || existing[key]){
        					return;
        				}
        				var found = available.find((item)=>{
        					return item?.type == "user" && this.normalizeCsvEmail(item.displayMail) == key;
        				});
        				if(this.local.collab == true){
        					if(found){
        						if(rights != undefined && rights != null && rights != ""){
        							found.rights = rights;
        						}
        						this.local.newUsersOrGroups.push(found);
        						existing[key] = true;
        					}
        					return;
        				}
        				if(found){
        					this.local.newUsersOrGroups.push(found);
        				}
        				else{
        					this.local.newUsersOrGroups.push({display: email, value: email});
        				}
        				existing[key] = true;
        			});
        			this.ref.detectChanges();
        		} catch (e) {
        		} finally {
        			return;
        		}
        	}
        	public getTinyLang(lang){
        		switch(lang){
        			case "fr":
        				return "fr_FR";
        			case undefined:
        				return "en";
        			default:
        				return lang;
        		}
        	}
        	public getTinyPathLang(lang){
        		switch(lang){
        			case "fr":
        				return "assets/i18n/fr_FR.js"
        			case "en":
        				return null;
        			case undefined:
        				return null;
        			default:
        				return "assets/i18n/" + lang+ ".js";
        		}
        	}
