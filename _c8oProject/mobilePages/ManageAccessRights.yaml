                        				let continue_transfer = await page["showConfirmationAlert"](page.translate.instant(''transfer_ownership_form_appName2'',
                        {appName: page.local.name, name: this.local.usersChoosen?.[0]?.displayName + " ("+this.local.usersChoosen?.[0]?.displayMail+")"}),page.translate.instant(''warn_change_2''), page.translate.instant(''non''), page.translate.instant(''oui''), "alertCustom c8o-alert-create-form","", true, false)
                        				if(continue_transfer){
                        					let resp = await page.c8o.callJsonObject("C8Oforms.APIV2_setOwnerShip", {
                        						id: page.navParams.data.existingGrps._id,
                        						owner : this.local.usersChoosen?.[0]?.value
                        									
                        					}).async();
                        					if(resp?.res?.done === true){
                        						page.presentToast(page.translate.instant("success_transfer", {user: (this.local.usersChoosen?.[0]?.display ?? "")}), "toastSuccess", "bottom", 3000, true);
                        					}
                        					else{
                        						error = true;
                        					}
                        				}
                        				else{
                        					close = false;
                        				}
                        				
                        			}
                        			else{
                        				close = false;
                        				page.presentToast(page.translate.instant("select_user_toast"), "toastWarn", "bottom", 3000, true);
                        			}
                        //			
                        		} catch (e) {
                        			error = true;
                        			console.log("an error occured while calling APIV2_setOwnerShip", e);
                        		} finally {
                        			if(error === true){
                        				//toastError
                        				page.presentToast(page.translate.instant("error_transfer", {user: (this.local.usersChoosen?.[0]?.display ?? "")}), "toastError", "bottom", 5000, true);
                        			}
                        			return close;
                        		}
                        '
