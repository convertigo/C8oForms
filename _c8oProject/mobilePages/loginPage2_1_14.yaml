      ↓CustomAction [ngx.components.UICustomAction-1772532946832]: 
        actionValue: 
          - xmlizable: 
            - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
            - com.twinsoft.convertigo.beans.common.FormatedContent: 
              →: |
                '		/*if(!(props.parent.out.GoogleClientID == undefined || props.parent.out.GoogleClientID == "")){
                		    this.local.continue = false;
                		    this.local.forceContinue = false;
                		}
                		else{
                	        this.local.continue = true;
                
                	        this.local.forceContinue = true;
                		}*/
                		if(props.parent.out.Identifier != null && props.parent.out.Identifier != ""){
                			this.local.identifier = props.parent.out.Identifier;
                		}
                		if(props.parent.out.loginAdLabel != null && props.parent.out.loginAdLabel != ""){
                			this.local.loginAdLabel = props.parent.out.loginAdLabel;
                		}
                		let anyOauth = false;
                		// if google oauth credentials exists display google login button
                		if(props.parent.out.google === true || props.parent.out.google == "true"){
                			//enable google login
                			page.local.google = true;
                			anyOauth = true;
                		}
                		// if xsoft oauth credentials exists display xsoft login button
                		if(props.parent.out.microsoft === true || props.parent.out.microsoft == "true"){
                			//enable xsoft login login
                			page.local.xsoft = true;
                			anyOauth = true;
                		}
                		// if linkedin oauth credentials exists display linkedin login button
                  		if(props.parent.out.linkedin === true || props.parent.out.linkedin == "true"){
                  			//enable google login
                  			page.local.linkedin = true;
                  			anyOauth = true;
                  		}
                		// if linkedin oauth credentials exists display linkedin login button
                  		if(props.parent.out.openId === true || props.parent.out.openId == "true"){
                  			//enable google login
                  			page.local.openId = true;
                  			anyOauth = true;
                  		}
                		if(props.parent.out.openIdBrand != null && props.parent.out.openIdBrand != ""){
                			this.local.openIdBrand = { OpenID: props.parent.out.openIdBrand};
                		}
                		else{
                			this.local.openIdBrand = { OpenID: "OpenID"};
                		}
                		// if user has never loggedin with this browser in ad set default ad value (check it or not)
                		if(window["localStorage"]["getItem"](''__c8o_forms__loginad'') == undefined || window["localStorage"]["getItem"](''__c8o_forms__loginad'') == ""){
                			this.local.loginad = props.parent.out.autoCheckAD === true || props.parent.out.autoCheckAD == "true";
                		}
                		// if ad credentials exists display login ad checkbox 
                		if(props.parent.out.AD === true || props.parent.out.AD == "true"){
                			page.local.ad = true;
                		}
                		else{
                			this.local.loginad = null;
                		}
                		// if hide passwort reset is set 
                		this.local.hidePasswordForgotten = props.parent.out.hidePasswordForgotten === true || props.parent.out.hidePasswordForgotten == "true";
                		this.local.hideConvertigoLogin = props.parent.out.hideConvertigoLogin === true || props.parent.out.hideConvertigoLogin == "true";
                		this.local.continue = this.local.forceContinue = !anyOauth;
                		this.local.cloudBranding = props.parent.out.cloudBranding == "true";
                		this.local.customHeaderLogo = null;
                		if(props.parent.out.customHeaderLogo != null && props.parent.out.customHeaderLogo != ""){
                			this.local.customHeaderLogo = props.parent.out.customHeaderLogo;
                			if(typeof this.local.customHeaderLogo == "string"){
                				this.local.customHeaderLogo = this.local.customHeaderLogo.trim();
                			}
                			if(this.local.customHeaderLogo == ""){
                				this.local.customHeaderLogo = null;
                			}
                		}
                		this.local.customCarouselImages = null;
                		try{
                			let customCarouselImage = props.parent.out.customCarouselImage;
                			if(customCarouselImage != null && customCarouselImage != ""){
                				let parsedCarouselImage = customCarouselImage;
                				if(typeof parsedCarouselImage == "string"){
                					try{
                						parsedCarouselImage = JSON.parse(parsedCarouselImage);
                					}
                					catch(e){
                						parsedCarouselImage = [parsedCarouselImage];
                					}
                				}
                				if(Array.isArray(parsedCarouselImage) == false){
                					parsedCarouselImage = [parsedCarouselImage];
                				}
                				this.local.customCarouselImages = parsedCarouselImage.filter(function(url){
                					return typeof url == "string" && url.trim() != "";
                				});
                				if(this.local.customCarouselImages.length == 0){
                					this.local.customCarouselImages = null;
                				}
                			}
                		}
                		catch(e){
                			this.local.customCarouselImages = null;
                		}
                		this.local.customCarouselImageObjectFit = null;
                		try{
                			let customCarouselImageObjectFit = props.parent.out.customCarouselImageObjectFit;
                			if(customCarouselImageObjectFit != null && customCarouselImageObjectFit != ""){
                				let fit = ("" + customCarouselImageObjectFit).toLowerCase().trim();
                				fit = fit.replace("_", "-");
                				if(fit == "fill" || fit == "contain" || fit == "cover" || fit == "none" || fit == "scale-down"){
                					this.local.customCarouselImageObjectFit = fit;
                				}
                			}
                		}
                		catch(e){
                			this.local.customCarouselImageObjectFit = null;
                		}
                		resolve(null);
                '
