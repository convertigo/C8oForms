  ↓callSequence_admin_stats_home [ngx.components.UICustomAsyncAction-1739813104469]: 
    actionValue: 
      - xmlizable: 
        - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
        - com.twinsoft.convertigo.beans.common.FormatedContent: 
          →: |
            '		try {
            			var data = await page.c8o.callJsonObject("C8Oforms.admin_stats_home", {}).async();
            			if(data.error){
            				page.local.error = true;
            			}
            			else{
            				if(data?.responses?.chartFormsOptions?.labels != undefined){
            					data.responses.chartFormsOptions.labels = data.responses.chartFormsOptions.labels.map((x)=>{
            						return page.translate.instant(x);
            					})
            					data.responses.chartFormsOptions.dataLabels = {
            					    formatter: function (val, opts) {
            					      const total = opts.w.globals.seriesTotals.reduce((a, b) => a + b, 0);
            					      const name = opts.w.globals.labels[opts.seriesIndex];
            						  val = page.local.data.chartFormsOptions.series[opts.seriesIndex];
            					      const percentage = (( val / total) * 100).toFixed(1);
            					      return [`${val} (${percentage}%)`];
            					    }
            					  }
            				}
            				if(data?.responses?.chartResponsesOptions?.labels != undefined){
            					data.responses.chartResponsesOptions.labels = data.responses.chartResponsesOptions.labels.map((x)=>{
            						return page.translate.instant(x);
            					});
            					data.responses.chartResponsesOptions.dataLabels = {
            					    formatter: function (val, opts) {
            					      const total = opts.w.globals.seriesTotals.reduce((a, b) => a + b, 0);
            					      const name = opts.w.globals.labels[opts.seriesIndex];
            						  val = page.local.data.chartResponsesOptions.series[opts.seriesIndex];
            					      const percentage = (( val / total) * 100).toFixed(1);
            					      return [`${val} (${percentage}%)`];
            					    }
            					  }
            				}
            				//chartUsersOptions
            				if(data?.responses?.chartUsersOptions?.labels != undefined){
            					data.responses.chartUsersOptions.labels = data.responses.chartUsersOptions.labels.map((x)=>{
            						return page.translate.instant(x);
            					});
            					data.responses.chartUsersOptions.dataLabels = {
            					    formatter: function (val, opts) {
            					      const total = opts.w.globals.seriesTotals.reduce((a, b) => a + b, 0);
            					      const name = opts.w.globals.labels[opts.seriesIndex];
            						  val = page.local.data.chartUsersOptions.series[opts.seriesIndex];
            					      const percentage = (( val / total) * 100).toFixed(1);
            					      return [`${val} (${percentage}%)`];
            					    }
            					  }
            				}
            				//chartGroupsOptions
            				if(data?.responses?.chartGroupsOptions?.labels != undefined){
            					data.responses.chartGroupsOptions.labels = data.responses.chartGroupsOptions.labels.map((x)=>{
            						return page.translate.instant(x);
            					});
            					data.responses.chartGroupsOptions.dataLabels = {
            					    formatter: function (val, opts) {
            					      const total = opts.w.globals.seriesTotals.reduce((a, b) => a + b, 0);
            					      const name = opts.w.globals.labels[opts.seriesIndex];
            						  val = page.local.data.chartGroupsOptions.series[opts.seriesIndex];
            					      const percentage = (( val / total) * 100).toFixed(1);
            					      return [`${val} (${percentage}%)`];
            					    }
            					  }
            				}
            				page.local.data = data.responses;
            			}
            		} catch (e) {
            			page.local.error = true;
            			page.c8o.log.error("An error occured : \n"+ JSON.stringify(e));
            		} finally {
            			return;
            		}
            '
