        public documentationTemplate: string = `
        ### 📘 {{mdreader_description_title}}
        
        {{mdreader_description_intro}}
        
        - **{{mdreader_description_edit}}**  
          {{mdreader_description_edit_desc}}
        - **{{mdreader_description_publish}}**  
          {{mdreader_description_publish_desc}}
        - **{{mdreader_description_formulas}}**  
          {{mdreader_description_formulas_desc}}
        - **{{mdreader_description_nocode}}**  
          {{mdreader_description_nocode_desc}}
        - **{{mdreader_description_admin_read}}**  
          {{mdreader_description_admin_read_desc}}
        - **{{mdreader_description_admin_write}}**  
          {{mdreader_description_admin_write_desc}}
        
        ---
        
        ### 🧠 {{mdreader_rights_title}}
        
        {{mdreader_rights_intro}}
        
        #### 🔐 {{mdreader_rights_list_title}}
        - **{{mdreader_edit}}** : {{mdreader_edit_desc}}
        - **{{mdreader_publish}}** : {{mdreader_publish_desc}}
        - **{{mdreader_formulas}}** : {{mdreader_formulas_desc}}
        - **{{mdreader_nocode}}** : {{mdreader_nocode_desc}}
        - **{{mdreader_admin_read}}** : {{mdreader_admin_read_desc}}
        - **{{mdreader_admin_write}}** : {{mdreader_admin_write_desc}}
        
        ---
        
        ### 🗺 {{mdreader_map_title}}
        
        {{mdreader_map_intro}}
        - {{mdreader_map_bullet_1}}
        - {{mdreader_map_bullet_2}}
        - {{mdreader_map_bullet_3}}
        
        ---
        
        ### 👤 {{mdreader_example_title}}
        
        - {{mdreader_example_user_title}}
          - {{mdreader_example_user}}
        - {{mdreader_example_groups_title}}
          - {{mdreader_example_groups}}
        - {{mdreader_example_default_settings_title}}
          - {{mdreader_example_default_settings}}
        - {{mdreader_example_result_title}}
          - {{mdreader_example_result}}
        
        💡 {{mdreader_example_explanation}}
        `;
        
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public renderMarkdown(template: string): string {
        	  return template.replace(/\{\{(.*?)\}\}/g, (_, key) => this.translate.instant(key.trim()) || `{{${key}}}`);
        	}
        	/*End_c8o_PageFunction*/
