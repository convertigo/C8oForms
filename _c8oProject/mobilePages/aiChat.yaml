                '		let timeout = (ms)=> {
                		    return new Promise(resolve => setTimeout(resolve, ms));
                		}
                		let runAsyncChat = async ()=>{
                			let start = await page.c8o.callJsonObject("lib_C8Oforms_AI.ChatStart",{
                				form_id: this.navParams?.data?.form_id ?? "",
                				message: props.stack?.root?.out?.message ?? "",
                				reset: props.stack?.root?.out?.reset ?? "false",
                				language: this.global?.settings?.language ?? "en"
                			}).async();
                			let startResponse = start.response || start;
                			let jobId = startResponse?.jobId;
                			if(!jobId){
                				throw new Error("ChatStart returned no jobId");
                			}
                			let startedAt = Date.now();
                			let maxDurationMs = 1000 * 60 * 5;
                			while (Date.now() - startedAt < maxDurationMs) {
                				await timeout(1200);
                				let poll = await page.c8o.callJsonObject("lib_C8Oforms_AI.ChatPoll",{
                					jobId: jobId
                				}).async();
                				let pollResponse = poll.response || poll;
                				let streamText = pollResponse?.stream || pollResponse?.progress || "";
                				if (streamText && Array.isArray(page.local?.chat?.messages) && page.local.chat.messages.length > 0) {
                					let lastMsg = page.local.chat.messages[page.local.chat.messages.length - 1];
                					if (lastMsg?.waiting === true) {
                						lastMsg.content = "" + streamText;
                						page.ref.detectChanges();
                						if (page.content?.scrollToBottom) {
                							page.content.scrollToBottom(120);
                						}
                					}
                				}
                				if (pollResponse?.status == "done") {
                					let payload = pollResponse.response || {};
                					if (payload?.document?.error) {
                						throw payload.document.error;
                					}
                					if (payload?.doc?.error) {
                						throw payload.doc.error;
                					}
                					if (payload?.error) {
                						throw payload.error;
                					}
                					if (!payload.form && payload?.document?.form) {
                						payload = payload.document;
                					}
                					if (!payload.form && payload?.doc?.form) {
                						payload = payload.doc;
                					}
                					if (payload?.form && Array.isArray(payload.form.messages)) {
                						page.local.chat = payload.form;
                						page.ref.detectChanges();
                						if (page.content?.scrollToBottom) {
                							page.content.scrollToBottom(120);
                						}
                					}
                					return payload;
                				}
                				if (pollResponse?.status == "error") {
                					throw (pollResponse?.error || pollResponse?.response?.error || "Chat async error");
                				}
                			}
                			throw new Error("Chat polling timeout");
                		}
                		try {
                			return await runAsyncChat();
                		} catch (e) {
                			console.error("lib_C8Oforms_AI.Chat async error", e);
                			console.warn("lib_C8Oforms_AI.Chat async error on first attempt. We will retry.");
                			try {
                				return await runAsyncChat();
                			} catch (e) {
                				console.error("lib_C8Oforms_AI.Chat async error", e);
                				console.warn("lib_C8Oforms_AI.Chat async error on second attempt. we wont retry.");
                				return {error: "" + e};
                			}
                		}
                '
