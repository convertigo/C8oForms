                    		if (props?.stack?.CallSequence?.out) {
                    			out = props?.stack?.CallSequence?.out;
                    		} else if (props?.stack?.root?.out) {
                    			out = props?.stack?.root?.out;
                    		}
                    		
                    		if (!page.local.chat || typeof page.local.chat != "object") {
                    			page.local.chat = {
                    				id: this.navParams && this.navParams.data ? (this.navParams.data.form_id || "") : "",
                    				messages: []
                    			};
                    		}
                    		
                    		if (!Array.isArray(page.local.chat.messages)) {
                    			page.local.chat.messages = [];
                    		}
                    		
                    		var msgs = page.local.chat.messages;
                    		if (msgs.length > 0) {
                    			var last = msgs[msgs.length - 1];
                    			if (last && last.waiting === true) {
                    				msgs.pop();
                    			}
                    		}
                    		
                    		var err = out.error;
                    		if (!err && out.response && out.response.error) {
                    			err = out.response.error;
                    		}
                    		if (!err && out.document && out.document.error) {
                    			err = out.document.error;
                    		}
                    		if (!err && out.doc && out.doc.error) {
                    			err = out.doc.error;
                    		}
                    		
                    		if (err) {
                    			var message = "";
                    			if (typeof err == "string") {
                    				message = err;
                    			} else if (err.message != null) {
                    				message = "" + err.message;
                    			} else {
                    				try {
                    					message = JSON.stringify(err);
                    				} catch (e) {
                    					message = "" + err;
                    				}
                    			}
                    			msgs.push({role: "assistant", content: message});
                    			page.ref.detectChanges();
                    			resolve();
                    			return;
                    		}
                    		
                    		var outForm = null;
                    		if (out.form && typeof out.form == "object") {
                    			outForm = out.form;
                    		} else if (out.response && out.response.form && typeof out.response.form == "object") {
                    			outForm = out.response.form;
                    		}
                    		if (outForm != null) {
                    			if (!Array.isArray(outForm.messages)) {
                    				outForm.messages = msgs;
                    			}
                    			page.local.chat = outForm;
                    		}
