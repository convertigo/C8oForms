        				cond.subject != undefined &&
        				cond.subject == "field" &&
        				cond.val1 != undefined &&
        				cond.val1.str != undefined &&
        				cond.operator != "" &&
        				cond.val1.type == "file"
        			);
        		} catch (e) {
