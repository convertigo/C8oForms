        		let className = "DynamicClassToast-" + step.id;
        		let styles = `
        		    text-align: center !important;
        		    --border-radius: 5px !important;
        		    --background: ${step.config.color};
        		    --color: ${contrastColor};
        		`;
        		let buttonStyles = `
        		    .${className}::part(button) {
        		        color: ${contrastColor};
        		    }
        		`;
        
        		const styleSheet = document.styleSheets[0];
        		styleSheet.insertRule(`.${className} { ${styles} }`, styleSheet.cssRules.length);
        		styleSheet.insertRule(buttonStyles, styleSheet.cssRules.length);
        		return className;
        	}
        
