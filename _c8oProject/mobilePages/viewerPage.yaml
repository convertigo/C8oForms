          →: |
            '		page.willDestroyEvent.next();
            		page.willDestroyEvent.complete();
            		page.cancelReplicatePushResponse();
            		page.cancelCurrentFlowExecution();
            		page.global.anonymous = null;
            		page.global.published = null;
            		try{
            			page.local.live.cancel();
            		}
            		catch(e){
            			
            		}
            		try{
            			// remove event listener for online
            			window.removeEventListener(''online'', page.local.updateOnlineStatus);
            		}
            		catch(e){
            			
            		}
            		
            		page.c8o.cancelLive("viewLiveViewerPage");
            		if(page.local.databsesTosync != undefined){
            			for(let db in page.local.databsesTosync){
            				page.c8o.callJsonObject("fs://"+db+".replicate_pull",{cancel: true});
            				page.c8o.log.debug("canceled "+db+" pull replication (before leaving page)");
            			}
            		}
            		if(page.local.liveToCancel != undefined){
            			for(let liveQuery of page.local.liveToCancel){
            				page.c8o.cancelLive(liveQuery);
            				page.c8o.log.debug("canceled "+liveQuery+" live query (before leaving page)");
            			}
            		}
            		window.removeEventListener(''popstate'', this.local.listenerPopState);
            		window.removeEventListener(''pushstate'', this.local.listenerPushState);
            		page.restaureTitleRGAA();
            		window.removeEventListener(''resize'', this.local.funcListener);
            		try{
            			if(this.local.toastErr?.length > 0){
            				let alertController = page.getInstance(AlertController)
            				alertController.create({
            				      message: page.translate.instant("msg_dismiss_toasts_err"),
            					  cssClass: "styleAlertHeight",
            				      buttons: [
            				        {
            				          text: page.translate.instant(''non''),
            				          role: ''cancel''
            				        },
            				        {
            				          text: page.translate.instant(''oui''),
            				          handler: () => {
            							this.local.toastErr?.forEach((toast)=>{
            								toast.dismiss();
            							})
            				          }
            				        }
            				      ]
            				    })
            					.then((alert)=>{
            						alert.present();
            					})
            			}
            		}
            		catch(e){
            			this.local.toastErr?.forEach((toast)=>{
            				toast.dismiss();
            			})
            		}
            		
            		
            		resolve();
            '
