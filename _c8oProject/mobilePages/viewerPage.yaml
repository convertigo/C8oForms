        	public async evalHtml(html, name) {
        		if (html != "" && html != null) {
        			let regex = /\$\$(?:START)?(\d+)(.*?)(?:END)?(?:\d+)?\$\$/;
        			let ObjectThatHaveToCallFunc = []
        			let str = this.stringOf$$ToCode(html, "html", ObjectThatHaveToCallFunc, regex, true);
        			let sha = sha256(JSON.stringify(html));
        			this.functionsById[sha] = async () => {
        				try {
        					let page = this;
        					const asyncFunction = Object.getPrototypeOf(async () => { }).constructor(
        						''page'',
        						`return (async () => { return ${str} })();`
        					);
        					let res = await asyncFunction(page);
        					page.local.htmlValue[name] = res != null && res != "null" && res != "undefined" ? res : "";
        				}
        				catch (e) {
        					this.local.htmlValue[name] = "";
        					console.error("ee", e)
        				}
        				finally {
        					this.ref.detectChanges();
        				}
        			}
        			await this.functionsById[sha]();
        			if (sha) {
        				this.fillFunctionsIDToBeCalledFromObjectThatHaveToCallFunc(ObjectThatHaveToCallFunc, sha);
        			}
        		}
        		else {
        			this.local.htmlValue[name] = "";
        		}
        
        	}
        
        	public async fillPages(pages) {
        		pages.forEach(async (page, index) => {
        			await this.evalHtml(page.desc, "pagec8o" + index);
        		})
        	}
        
        
        	/**
        	 * walk a given item to find enabled sources within it 
        	 * 
        	 * @param item item of the form for which we are searching for sources
        	 * @param path the path to find sources within item
        	 * @param isSource define if its a source or an action
        	 * @param noEval define weither this source should be evaluated at the end
        	 * @returns {findVars: Object, findName: string, ObjectThatHaveToCallFunc: Array, sha: string, fullSyncArgs: Object } findVars are the computed variables found, findName is the source name, ObjectThatHaveToCallFunc holds objects id that will update value of current source, sha make a unique reference for this source : a sha of its name and arguments, fullSyncArgs if it''s a fullsync source, then holds fullsync arguments
        	 */
        	public searchForSources(item: any, path: string, isSource: boolean = true, noEval: boolean = false, overrideToTS = false, backend= false): Object {
        		// name of the source to be find
        		let sourceName = "";
        		// vars of the source to be find
        		let vars = {};
        		// fullsync arguments of the source to be find
        		let fullSyncArgs = {};
        		// an array that holds objects id that will update value of current source
        		let ObjectThatHaveToCallFunc = [];
        
        		// itterates over current items sources to find which one is enabled
        		for (let w in item[path]) {
        			// if current source is enabled
        			if (item[path][w].enabled === true) {
        				// iterrate over each vars of the source to find theirs value and store them
        				for (const [key, value] of (<any>Object).entries(item[path][w]["vars"])) {
        					vars[key] = value;
        				}
        				// if it''s a fullsync source, then fill fullsync arguments
        				if (item[path][w]["fullsync"] == true) {
        					fullSyncArgs["isFullsync"] = true;
        					sourceName = "fs://" + item[path][w]["connectorName"] + ".view";
        					let viewName = item[path][w]["viewName"].split("/");
        					fullSyncArgs["ddoc"] = viewName[0];
        					fullSyncArgs["view"] = viewName[1];
        					fullSyncArgs["__live"] = w;
        					fullSyncArgs["connectorName"] = item[path][w]["connectorName"]
        					fullSyncArgs["viewName"] = item[path][w]["viewName"];
        				}
        				// if it''s a standard source, just save its name
        				else {
        					sourceName = w;
        				}
        			}
        		}
        
        		// make a unique reference for this source : a sha of its name and arguments
        		let sha = null;
        		if (fullSyncArgs["isFullsync"] != undefined && fullSyncArgs["isFullsync"] == true) {
        			sha = sha256(JSON.stringify(sourceName) + JSON.stringify(fullSyncArgs) + JSON.stringify(vars));
        		}
        		else {
        			sha = sha256(JSON.stringify(sourceName) + JSON.stringify(vars));
        		}
        
        		// if this source should no be evaluated then set its vars to empty
        		if (noEval) {
        			for (let va in vars) {
        				vars[va] = "";
        			}
        		}
        		// if this source should be evaluated
        		else {
        			// itterate over each vars
        			for (let va in vars) {
        				// if current var is the native select filter
        				if (isSource && va == "forms_filter") {
        					// add a ternary which evaluates the native select filter
        					vars[va] = "page.local.filters_elems[''" + item.id + "''] == undefined ? '''': page.local.filters_elems[''" + item.id + "'']";
        					// indicate that item has to be update when its value change
        					ObjectThatHaveToCallFunc.push(item.id);
        				}
        				else {
        					// if current var is an attachment there is nothing to be evaluated
        					if (vars[va].from_attachment != undefined && vars[va].from_attachment == true) { }
        					// otherwise
        					else {
        						let regex = /\$\$(?:START)?(\d+)(.*?)(?:END)?(?:\d+)?\$\$/;
        						//let regex = /\$\$START(\d+)(.*?)(END\d+)\$\$/;
        						// if its a convertigo x baserow builtin compatible var, then formate it  
        						if (vars[va]["type"] == "filter") {
        							// prepare the expected format
        							let res = { filters: [], mode: null };
        							// evaluate if its a "AND" or a "OR" filter
        							res.mode = vars[va].condVisible.toUpperCase();
        							// foreach var add an entry
        							for (let cond of vars[va].conds) {
        								if (cond.val1.name != "" && cond.operator != "") {
        									res.filters.push({
        										"field": cond.val1.name,
        										"op": cond.operator,
        										"value": this.stringOf$$ToCode(cond.val2.str, overrideToTS ? "ts" : cond.val2.type, ObjectThatHaveToCallFunc, regex, false, backend)
        									})
        								}
        							}
        							// Recursively format nested groups
        							if (Array.isArray(vars[va].groups)) {
        							    for (let subgroup of vars[va].groups) {
        							        let groupFormatted = {
        							            mode: subgroup.condVisible?.toUpperCase() || "AND",
        							            filters: []
        							        };
        
        							        // Conditions of subgroup
        							        if (Array.isArray(subgroup.conds)) {
        							            for (let cond of subgroup.conds) {
        							                if (cond.val1?.name !== "" && cond.operator !== "") {
        							                    groupFormatted.filters.push({
        							                        field: cond.val1.name,
        							                        op: cond.operator,
        							                        value: this.stringOf$$ToCode(cond.val2.str, overrideToTS ? "ts" : cond.val2.type, ObjectThatHaveToCallFunc, regex, false, backend)
        							                    });
        							                }
        							            }
        							        }
        
        							        // Handle nested sub-subgroups
        							        if (Array.isArray(subgroup.groups)) {
        							            for (let subsubgroup of subgroup.groups) {
        							                let subGroupFormatted = {
        							                    mode: subsubgroup.condVisible?.toUpperCase() || "AND",
        							                    filters: []
        							                };
        
        							                if (Array.isArray(subsubgroup.conds)) {
        							                    for (let cond of subsubgroup.conds) {
        							                        if (cond.val1?.name !== "" && cond.operator !== "") {
        							                            subGroupFormatted.filters.push({
        							                                field: cond.val1.name,
        							                                op: cond.operator,
        							                                value: this.stringOf$$ToCode(cond.val2.str, overrideToTS ? "ts" : cond.val2.type, ObjectThatHaveToCallFunc, regex, false, backend)
        							                            });
        							                        }
        							                    }
        							                }
        
        							                groupFormatted.filters.push(subGroupFormatted); // nest level 2
        							            }
        							        }
        
        							        res.filters.push(groupFormatted); // nest level 1
        							    }
        							}
        							// store the result
        							vars[va] = res;
        						}
        						else if (vars[va]["type"] == "sort"){
        //							debugger;
        							vars[va] = { sorts: vars[va].conds};
        						}
        						else if (Array.isArray(vars[va])) {
        							let temp = {};
        							for (let item of vars[va]) {
        								let str = this.stringOf$$ToCode(item.str, overrideToTS ? "ts" : item.type, ObjectThatHaveToCallFunc, regex, false, backend);
        								temp[item.name] = str;
        							}
        							vars[va] = temp;
        						}
        						else {
        							// otherwise
        							let str = this.stringOf$$ToCode(vars[va].str, overrideToTS ? "ts" : vars[va].type, ObjectThatHaveToCallFunc, regex, false, backend);
        							vars[va] = str;
        						}
        					}
        				}
        			}
        		}
        		
        //		console.log({ findVars: vars, findName: sourceName, ObjectThatHaveToCallFunc: ObjectThatHaveToCallFunc, sha: sha, fullSyncArgs: fullSyncArgs })
        		
        		return { findVars: vars, findName: sourceName, ObjectThatHaveToCallFunc: ObjectThatHaveToCallFunc, sha: sha, fullSyncArgs: fullSyncArgs }
        	}
        	
        	public createAndStoreBlobUrl(blob, id) {
        	    const url = URL.createObjectURL(blob);
        	    this.local.keepBlobs[id] = { blob, url }; // Conserver la référence
        	    return url;
        	};
        
        	/**
         * transforms a string of $$ to a c8oforms code compatible expression
         * 
         * @param str entry string of $$ to be computed to code
         * @param type type of entry string "Aa" or "ts"
         * @param ObjectThatHaveToCallFunc holds objects id that will update value of current source
         * @param regex regex to find $$ expressions:  support both $$standalone and $$start$$end expressions
         * @returns string
         */
        	public stringOf$$ToCode(stringOf$$: string, type: string, ObjectThatHaveToCallFunc: Array<any>, regex, html = false, backend=false) {
        		// if stringOf$$ is null undefined or an empty string there is nothing to transform
        		if (stringOf$$ == undefined || stringOf$$ == "") {
        			return "";
        		}
        		// if it''s a "ts" expression escape backquotes
        		if (!(type != undefined && type == "ts")) {
        			stringOf$$ = "`" + stringOf$$.replace(/`/g, "\\`") + "`";
        		}
        
        		let match;
        		let cpt = 0;
        		var lastType = null; 
        		while ((match = regex.exec(stringOf$$)) != null) {
        			cpt++;
        			// start index of current match - we have to save it to be able to replace actual $$ expression by it''s computed value at the end
        			let iStart = match.index;
        			// end index of current match - we have to save it to be able to replace actual $$ expression by it''s computed value at the end
        			let iEnd = match.index + match[0].length;
        			// if it''s a simple $$ expression, with no args (legacy support) such as $$123456789$$
        			if (match[2] == undefined || match[2] == "") {
        				// get target id
        				let id = match[1];
        				// indicate that parent item has to be update when its value change
        				ObjectThatHaveToCallFunc.push(id);
        				// get raw path of the target 
        				let path = this.getPathById(+id);
        				// current value will be stored there
        				let currentVal;
        				// if it''s a "ts" expression
        				if (type != undefined && type == "ts") {
        					currentVal = path;
        				}
        				// if it''s an "Aa" expression
        				else {
        					if(path != null && path != ""){
        						currentVal = "`+(" + path + " instanceof Object ? JSON.stringify(" + path + ") : " + path + ")+`"
        					}
        					else{
        						currentVal = "";
        					}
        					//currentVal = "`+(" + path + " instanceof Object ? JSON.stringify(" + path + ") : " + path + ")+`"
        				}
        				// replace the match string by computed value
        				stringOf$$ = stringOf$$.substring(0, iStart) + currentVal + stringOf$$.substring(iEnd);
        			}
        			// if it''s a modern $$ expression, with args such as $$START{args: args}END$$
        			else {
        				// get target id
        				let id = match[1];
        				// indicate that parent item has to be update when its value change
        				ObjectThatHaveToCallFunc.push(id);
        				// get the definition of this element (base structure)
        				let defElem: any = this.getItemById(id);
        				// get the runtime value of this element (value)
        				let valElem = this.getPathById(+id);
        				// get metadata 
        				let meta = JSON.parse(match[2].replace(/\\/g, ""));
        				let computedMeta = {};
        				if (meta.nested != null) {
        					for (let nestIndex in meta.nested) {
        						let currentNested = meta.nested[nestIndex];
        						computedMeta[nestIndex] = this.$$toVal(this.getItemById(currentNested.id), currentNested, "", 0, this.getPathById(+currentNested.id), 0, +currentNested.id, true);
        					}
        				}
        
        
        				let tmpStr = "";
        				let concat = true;
        				lastType = defElem?.type;
        				// consider its a backend file path
        				if(backend == true && (defElem?.type == "img" || defElem?.type == "signature" || defElem?.type == "file") && meta.nested == undefined && meta.c8opath == "" && (meta.path == "" || meta.path == undefined)){
        					tmpStr = `page.formsSubmit["${defElem.name}"]`;
        					concat = false;
        				}
        				// if it''s a "ts" expression
        				else if (type != undefined && type == "ts") {
        					if(defElem?.type == "signature"){
        						tmpStr = `
        						(() => {
        						  let base64Data = ${this.$$toVal(defElem, meta, stringOf$$, iStart, valElem, iEnd, id, true, false)};
        						  const parts = base64Data.split('';base64,'');
        						  const contentType = parts[0].split('':'')[1];
        						  const raw = window.atob(parts[1]);
        						  const rawLength = raw.length;
        						  const uInt8Array = new Uint8Array(rawLength);
        
        						  for (let i = 0; i < rawLength; ++i) {
        						    uInt8Array[i] = raw.charCodeAt(i);
        						  }
        
        						  return new Blob([uInt8Array], { type: contentType });
        						})()
        						`
        					}
        					else{
        						tmpStr = this.$$toVal(defElem, meta, stringOf$$, iStart, valElem, iEnd, id, true, false);
        					}
        				}
        				else if(type == "html" && (defElem?.type == "img" || defElem?.type == "signature" || defElem?.type == "file")){
        					let valFile = this.$$toVal(defElem, meta, stringOf$$, iStart, valElem, iEnd, id, true, false);
        					switch(defElem.type){
        						case "img" :
        							tmpStr = `\`+(()=>{let url = null;try{url = URL.createObjectURL(${valFile});}catch(e){} if(url != null){return "<img src="+url+">"}else{return ""}})()+\``;
        						break;
        						case "signature" :
        							tmpStr = `\`+(()=>{if(${valFile} != null){return "<img src="+${valFile}+">"}else{return ""}})()+\``;
        						break;
        						case "file" :
        							tmpStr = `\`+(()=>{let str = "";if(${valFile}?.length > 0){for(let file of ${valFile}){let url = URL.createObjectURL(file); if(file.type.startsWith("image/")){str += "<img src="+url+">"}else{str+=''<a href="''+url+''" target="_blank">''+file.name+''</a>&nbsp;''};}}return str;})()+\``;
        						break;
        					}
        				}
        				// if it''s an "Aa" expression
        				else {
        					if(defElem?.type == "signature"){
        						tmpStr = ''`+'';
        						tmpStr += `
        						(() => {
        						  let base64Data = ${this.$$toVal(defElem, meta, stringOf$$, iStart, valElem, iEnd, id, true, false)};
        						  const parts = base64Data.split('';base64,'');
        						  const contentType = parts[0].split('':'')[1];
        						  const raw = window.atob(parts[1]);
        						  const rawLength = raw.length;
        						  const uInt8Array = new Uint8Array(rawLength);
        
        						  for (let i = 0; i < rawLength; ++i) {
        						    uInt8Array[i] = raw.charCodeAt(i);
        						  }
        
        						  return new Blob([uInt8Array], { type: contentType });
        						})()
        						`
        						tmpStr += ''+`'';
        					}
        					else{
        						tmpStr = tmpStr = this.$$toVal(defElem, meta, stringOf$$, iStart, valElem, iEnd, id, false, false);
        					}
        					
        				}
        				for (let nestIndex in computedMeta) {
        					let strToReplace = ".$$START_SUB" + nestIndex + "END_SUB$$";
        					tmpStr = tmpStr.replace(strToReplace, "?.[" + computedMeta[nestIndex] + "]");
        				}
        				if (false && meta.c8otype == "path" && !html) {
        					try {
        						let sp;
        						if (meta.c8obuiltin == "true" || meta.c8obuiltin == true) {
        							sp = meta.c8opath.split(".");
        							if ([''selected_data_c8o_separated_by_coma'', ''not_selected_data_c8o_separated_by_coma'', ''selected_data'', ''not_selected_data''].indexOf(sp[3]) != -1) {
        								sp = meta.c8opath.split(".").slice(4);
        							}
        							if ([''displayValue'', ''value'', ''all_data'', ''selected_data_c8o_separated_by_coma'', ''not_selected_data_c8o_separated_by_coma'', ''selected_data'', ''not_selected_data'', ''fulldate'', ''day'', ''month'', ''year'', ''fullhours'', ''hours'', ''mins'', ''AddressLine'', ''AdminDistrict'', ''AdminDistrict2'', ''CountryRegion'', ''FormattedAddress'', ''Locality'', ''PostalCode'', ''latitude'', ''longitude'', ''altitude'', ''accuracy'', ''altitudeAccuracy'', ''addr'', ''gps'', ''values''].indexOf(sp[2]) != -1) {
        								sp = meta.c8opath.split(".").slice(3);
        							}
        							else {
        								sp = meta.c8opath.split(".").slice(2);
        							}
        						}
        						else {
        							sp = meta.c8opath.split(".");
        							if (sp[0] == "api" || sp[0] == "await api") {
        								sp = null;
        							}
        							else {
        								sp = meta.c8opath.split(".").slice(1);
        							}
        						}
        						if (sp?.length > 0) {
        							tmpStr = tmpStr + "." + sp.join(".");
        						}
        					}
        					catch (e) {
        						console.error("an error occured in stringOf$$ToCode while trying to add suffix to path ", e);
        					}
        				}
        
        				if(concat){
        					stringOf$$ = stringOf$$.substring(0, iStart) + tmpStr + stringOf$$.substring(iEnd);
        				}
        				else{
        					stringOf$$= tmpStr;
        				}
        				
        			}
        		}
        		if(cpt <= 1 && type != "ts" && type != "html" && (lastType == "file" || lastType == "img" || lastType == "signature") && !backend){
        			stringOf$$ = stringOf$$.substring(3);
        			stringOf$$ = stringOf$$.substring(0, stringOf$$.length - 3);
        		}
        //		console.log(stringOf$$)
        		//debugger;
        		return stringOf$$;
        		
        		
        	}
        
        	/**
        	 * compute a given $$ expresion to it''s value code
        	 * @param defElem the definition of target element (base structure)
        	 * @param meta metadata arround the current expression
        	 * @param str expression to be evaluated
        	 * @param iStart start index of current match - we have to save it to be able to replace actual $$ expression by it''s computed value at the end
        	 * @param valElem 
        	 * @param iEnd end index of current match - we have to save it to be able to replace actual $$ expression by it''s computed value at the end
        	 * @param id the id of target element
        	 * @param ts if its a "ts" expression
        	 * @returns string 
        	 */
        	public $$toVal(defElem: any, meta: any, str: string, iStart: number, valElem: any, iEnd: number, id: any, ts: boolean, replaceInstr = true): string {
        		// if defElem is null or undefined there is nothing to compute
        		if (defElem == null && id != "1") {
        			return "";
        		}
        		// if it''s a "toolbox expression from html"
        		else if (id == "1") {
        			let currentVal = "";
        			if (ts) {
        				currentVal = meta.c8opath;
        			}
        			else {
        				let page = this;
        				let e;
        				let async = false;
        				try {
        					e = eval(meta.c8opath);
        				} catch (e) {
        					if (e instanceof SyntaxError && e.message.includes(''await is only valid'')) {
        						async = true;
        					} else {
        						throw e; // Renvoyer l''erreur si ce n''est pas lié à ''await''
        					}
        				}
        				if (async || (e && e.then != undefined)) {
        					currentVal = "`+ " + meta.c8opath + " +`";
        				}
        				else {
        					currentVal = "`+" + meta.c8opath + "+`";
        				}
        
        			}
        			if (replaceInstr) {
        				str = str.substring(0, iStart) + currentVal + str.substring(iEnd);
        				return str;
        			}
        			else {
        				return currentVal;
        			}
        		}
        		// if it''s not a path expression or it''s a graphic formatting expression then generate adequate expression
        		else if ((defElem != null && meta.c8otype != "path") || (meta.c8obuiltin && meta.c8opath.split(".")[1] == "graphic_formatting")) {
        			let s = "`+this.getBadge(" + id + ", " + JSON.stringify(defElem) + ", " + valElem + ", " + JSON.stringify(meta) + ", false, ''html'')+`";
        			if (replaceInstr) {
        				str = str.substring(0, iStart) + s + str.substring(iEnd);
        				return str;
        			}
        			else {
        				return s;
        			}
        
        		}
        		// for any other kind of expression
        		else {
        			// current value will be stored there
        			let currentVal = "";
        			// get raw path of the target 
        			let path = this.getPathById(+id);
        			// switch type of target
        			switch (defElem?.type) {
        				case "grid":
        				case "checkbox":
        				case "radio_group":
        				case "checkbox_group":
        				case "radio":
        				case "slider":
        				case "select":
        				case "datetime":
        				case "time":
        					// if no path is specified and it''s not "ts" expression
        					if (meta.c8opath == "" && !ts && defElem?.type != "grid") {
        						currentVal = "`+" + this.selected_data_c8o_separated_by_coma(path, defElem.type, "TEXT_format", ts) + "+`";
        					}
        					// if path is specified or if it''s "ts" expression
        					else {
        						// split path
        						let splitted = meta.c8opath.split(".");
        						let diffUndefined = " != undefined";
        						// if it''s a grid or a path
        						if (defElem.type == "grid" && meta.c8otype == "path") {
        							const gridName = this.getNameById(+id);
        							if (defElem.config.returned_value == "cell_selected") {
        								let firstSegment = splitted[1];
        								if (firstSegment == undefined || firstSegment == '''') {
        									firstSegment = "cell_selected";
        								}
        								if (firstSegment == "cell_selected" || firstSegment == "cellSelected") {
        									let basePath = "page.formsSubmit?.[''" + gridName + "'']?.[''value'']";
        									let suffix = splitted.slice(2);
        									if (suffix[0] == "value") {
        										basePath = "(((" + basePath + ") != null && typeof (" + basePath + ") == ''object'' && (" + basePath + ")?.[''value''] != undefined) ? (" + basePath + ")?.[''value''] : (" + basePath + "))";
        										suffix = suffix.slice(1);
        									}
        									for (let value of suffix) {
        										basePath += "?.[''" + value + "'']";
        									}
        									if (ts) {
        										currentVal = basePath;
        									}
        									else {
        										currentVal = "`+ (" + basePath + " ?? '''') +`";
        									}
        								}
        								else if (firstSegment == "parentRow") {
        									let basePath = "page.local.techGrid?.[''" + gridName + "'']?.[''data'']";
        									for (let value of splitted.slice(2)) {
        										basePath += "?.[''" + value + "'']";
        									}
        									if (ts) {
        										currentVal = basePath;
        									}
        									else {
        										currentVal = "`+ (" + basePath + " ?? '''') +`";
        									}
        								}
        								else {
        									let basePath = "page.local.techGrid";
        									let indexBased = false;
        									if (defElem.config.returned_value == "all_the_data" || defElem.config.returned_value == "nothing") {
        										basePath = "page.local.sourceValue";
        										indexBased = true;
        									}
        									else if (defElem.config.returned_value == "multiple_row_selected") {
        										indexBased = true;
        									}
        									let splittedLen = splitted.length - 1;
        									splitted.forEach((value, index) => {
        										if (index == 0) {
        											value = gridName;
        										}
        										if (index == 1 && !isNaN(+value) && !indexBased) {
        										}
        										else if (index == 1 && isNaN(+value) && indexBased && !ts) {
        											basePath += "?.[''" + 0 + "'']";
        											basePath += "?.[''" + value + "'']";
        										}
        										else if (index == 1 && !indexBased && !ts) {
        											basePath += "?.[page.getIndexGridAtRunTime(''" + value + "'', ''" + defElem.name + "'')]";
        										}
        										else {
        											if (index == 2 && defElem.config.returned_value == "multiple_row_selected") {
        												basePath += "?.[''data'']";
        											}
        											basePath += "?.[''" + value + "'']";
        											if (index == 0 && defElem.config.returned_value != "multiple_row_selected") {
        												basePath += "?.[''data'']";
        											}
        										}
        									});
        									if (ts) {
        										currentVal = basePath;
        									}
        									else {
        										currentVal = "`+ (" + basePath + " ?? '''') +`";
        									}
        								}
        							}
        							else {
        								// default base path is :
        								let basePath = "page.local.techGrid";
        								let indexBased = false;
        								// if returned value is either all_the_data or nothing, we will use local source value
        								if (defElem.config.returned_value == "all_the_data" || defElem.config.returned_value == "nothing") {
        									basePath = "page.local.sourceValue";
        									indexBased = true;
        								}
        								// if returned value is multiple_row_selected, we set it as index based
        								else if (defElem.config.returned_value == "multiple_row_selected") {
        									indexBased = true;
        								}
        
        								//							let st = "(" + ("" + basePath) + diffUndefined + " && ";
        								let splittedLen = splitted.length - 1;
        								splitted.forEach((value, index) => {
        									// ensure name of grid has not changed
        									if (index == 0) {
        										value = this.getNameById(+id);
        									}
        									// if user first configured it''s grid returned_value to all_the_data or nothing and then changed it, ignore first value key index
        									if (index == 1 && !isNaN(+value) && !indexBased) {
        										// do nothing and ignore first value key index
        									}
        									// if user first configured it''s grid returned_value to cell_selected or row_selected and then changed it, include index key
        									else if (index == 1 && isNaN(+value) && indexBased && !ts) {
        										// add default 0 index key
        										basePath += "?.[''" + 0 + "'']";
        										//									st += ("" + basePath) + diffUndefined + (splittedLen != index ? " && " : " ");
        										// then add the current key value
        										basePath += "?.[''" + value + "'']";
        										//									st += ("" + basePath) + diffUndefined + (splittedLen != index ? " && " : " ");
        									}
        									else if (index == 1 && !indexBased && !ts) {
        										basePath += "?.[page.getIndexGridAtRunTime(''" + value + "'', ''" + defElem.name + "'')]";
        										//									st += ("" + basePath) + diffUndefined + (splittedLen != index ? " && " : " ");
        									}
        									// nominal case everything has been confired correctly
        									else {
        										if (index == 2 && defElem.config.returned_value == "multiple_row_selected") {
        											basePath += "?.[''data'']";
        										}
        										basePath += "?.[''" + value + "'']";
        										//									st += ("" + basePath) + diffUndefined + (splittedLen != index ? " && " : " ");
        										// if experssion is not indexed based, we need to search into data key
        										if (index == 0 && defElem.config.returned_value != "multiple_row_selected") {
        											basePath += "?.[''data'']";
        										}
        									}
        								});
        								if (ts) {
        									if (defElem.config.returned_value == "multiple_row_selected" && splitted.length <= 2) {
        										currentVal = "((" + basePath + " ?? []).map((node)=>node?.data).filter((x)=>x != null))";
        									}
        									else {
        										currentVal = basePath;
        									}
        								}
        								else {
        									if (defElem.config.returned_value == "multiple_row_selected" && splitted.length <= 2) {
        										currentVal = "`+ JSON.stringify((" + basePath + " ?? []).map((node)=>node?.data).filter((x)=>x != null)) +`";
        									}
        									else {
        										currentVal = "`+ (" + basePath + " ?? '''') +`";
        									}
        								}
        							}
        						}
        						// if it''s a builtin expression
        						else if (meta.c8obuiltin == "true" || meta.c8obuiltin == true) {
        							let displayValue = false;
        							let typeTargeted = splitted[1];
        							let verb = splitted[2];
        							let sliceCount = 3;
        							if ((verb != "displayValue" && verb != "value") && this[verb] == undefined) {
        								verb = null;
        								sliceCount = 2;
        							}
        							if (verb == null) {
        								verb = typeTargeted;
        							}
        							else if (verb == "displayValue" || verb == "value") {
        								displayValue = verb == "displayValue";
        								verb = splitted[3] ?? typeTargeted;
        								sliceCount = 4;
        							}
        							let suffix = "";
        							for (let elem of splitted.slice(sliceCount)) {
        								suffix += "?.[''" + elem + "'']";
        							}
        							if (ts) {
        								currentVal = this[verb](path, defElem.type, typeTargeted, ts, displayValue) + suffix;
        							}
        							else {
        								currentVal = "`+ (" + this[verb](path, defElem.type, typeTargeted, ts, displayValue) + suffix + " ?? '''') +`";
        							}
        
        						}
        						else if ((defElem.type == "select" && defElem.sources != undefined && Object.values(defElem.sources).find((x: any) => { return x.enabled == true }) && splitted?.[1] == "displayValue") || (defElem.type == "radio" && defElem.sources != undefined && Object.values(defElem.sources).find((x: any) => { return x.enabled == true }) && splitted?.[1] == "displayValue")) {
        							let basePath = "page.local.techSelect";
        							splitted.forEach((value, index) => {
        								// ensure name of grid has not changed
        								if (index == 0) {
        									value = this.getNameById(+id);
        								}
        								basePath += "?.[''" + value + "'']";
        							});
        							if (ts) {
        								currentVal = basePath;
        							}
        							else {
        								currentVal = "`+ (" + basePath + " ?? '''') +`";
        							}
        
        						}
        						// in any other case
        						else {
        							let sliceCount = 1;
        							if ((defElem.type == "select" && defElem.sources != undefined && Object.values(defElem.sources).find((x: any) => { return x.enabled == true }) && splitted?.[1] == "value") || (defElem.type == "radio" && defElem.sources != undefined && Object.values(defElem.sources).find((x: any) => { return x.enabled == true }) && splitted?.[1] == "value")) {
        								sliceCount = 2;
        							}
        							let suffix = "";
        							for (let elem of meta.c8opath?.split(".")?.slice(sliceCount)) {
        								suffix += "?.[''" + elem + "'']";
        							}
        							if (ts) {
        								currentVal = path + suffix;
        							}
        							else {
        								currentVal = "`+ (" + path + suffix + " ?? '''') +`";
        							}
        						}
        					}
        
        					break;
        				case "location":
        					// default for str checkbox_grp
        					if (meta.c8opath == "") {
        						currentVal = this.selected_data_c8o_separated_by_coma(path, defElem.type, "TEXT_format", ts);
        					}
        					else {
        						let splitted = meta.c8opath.split(".");
        						if (meta.c8obuiltin == "true" || meta.c8obuiltin == true) {
        							let typeTargeted = splitted[1];
        							let verb = splitted[2];
        							if (verb == null) {
        								verb = typeTargeted;
        							}
        							let sliced3 = splitted.slice(3);
        							let strThen = sliced3.length > 0 ? "." + sliced3.join(".") : "";
        							if (ts) {
        								currentVal = this[typeTargeted](path, defElem.type, verb, ts) + strThen;
        							}
        							else {
        								currentVal = "`+ (" + this[typeTargeted](path, defElem.type, verb, ts) + strThen + " ?? '''') +`";
        							}
        						}
        					}
        					break;
        				default:
        					let splitted = meta.c8opath?.split(".")?.slice(1);
        					for (let elem of splitted) {
        						path += "?.[''" + elem + "'']";
        					}
        					if (ts) {
        						currentVal = path;
        					}
        					else {
        						let page = this;
        						let e = eval(path);
        						if (e && e.then != undefined) {
        							currentVal = "`+ ((await (" + path + ")) ?? '''') +`";
        						}
        						else {
        							currentVal = "`+ (" + path + " ?? '''') +`";
        						}
        
        					}
        					break;
        			}
        			if (replaceInstr) {
        				str = str.substring(0, iStart) + currentVal + str.substring(iEnd);
        				return str;
        			}
        			else {
        				return currentVal;
        			}
        
        		}
        	}
        
