        														resolve_set();
        													}, 0)
        												});
        											}
        											this.ref.detectChanges();
        										}
        										catch (e) {
        											page.c8o.log.error("[fillActions] Error while trying to refresh a data source " + JSON.stringify(e), e);
        										}
        									}
        									else{
        										if(findVars.selfVar != ""){
        											console.error("[fillActions] "+ this.translate.instant("error_while_computing_item", {item: item.name}) + " "+ this.translate.instant(res.i18nKey, res.i18nParams) );
        //											if (this.local.toastErr == undefined) {
