        	/**
        	 * Browse conditions and generate JavaScript expressions for visibility.
        	 * @param {object} conditions - The conditions object (defined in Fullsync doc).
        	 * @param {boolean} bool - Optional boolean value to indicate if it is for "goToPageIf" condition.
        	 * @returns {string} - The generated JavaScript expression string.
        	 */
        	public evaluateConditions(conditions: object, bool: boolean = null): string {
        		conditions = this.getLegacyAwareConditions(conditions);
        		if (conditions == null) {
        			return bool == null ? "true" : "";
        		}
        		let jsString: string = "";
        		// Iterate over each condition key
        		for (let conds of Object.keys(conditions)) {
        			switch (conds) {
        				case "visibleIf":
        					jsString += this.detectSubjectAndComplete(
        						conditions[conds]["conds"],
        						conditions[conds]["condVisible"],
        						null,
        						conditions[conds]["groups"]
        					);
        					break;
        				case "goToPageIf":
        					if (bool) {
        						let abc = this.detectSubjectAndComplete(
        							conditions[conds]["conds"],
        							conditions[conds]["condVisible"] != undefined ? conditions[conds]["condVisible"] : conditions[conds]["cond"],
        							true,
        							conditions[conds]["groups"]
        						);
        					}
        					break;
        			}
        		}
        		return jsString;
        	}
        
        	private getLegacyAwareConditions(itemOrConditions: any): any {
        		if (itemOrConditions == null) {
        			return null;
        		}
        
        		let conditions: any = itemOrConditions.conditions != undefined ? itemOrConditions.conditions : itemOrConditions;
        		if (conditions == null) {
        			return null;
        		}
        
        		if (conditions.visibleIf != undefined || conditions.goToPageIf != undefined) {
        			return conditions;
        		}
        
        		if (
        			conditions.type == "visibleIf" ||
        			conditions.type == "goToPageIf" ||
        			conditions.conds != undefined ||
        			conditions.condVisible != undefined ||
        			conditions.groups != undefined
        		) {
        			let wrapped: any = {};
        			if (conditions.type == "goToPageIf") {
        				wrapped.goToPageIf = conditions;
        			}
        			else {
        				wrapped.visibleIf = conditions;
        			}
        			return wrapped;
        		}
        
        		if (itemOrConditions.visibleIf != undefined || itemOrConditions.goToPageIf != undefined) {
        			return {
        				visibleIf: itemOrConditions.visibleIf,
        				goToPageIf: itemOrConditions.goToPageIf
        			};
        		}
        
        		return null;
        	}
        
        	public evaluateItemVisibility(item: any): boolean {
        		let conditions = this.getLegacyAwareConditions(item);
        		if (conditions == null || conditions.visibleIf == null) {
        			return true;
        		}
        		const evaluateVisibleGroup = (group: any): boolean => {
        			if (group == null || typeof group != "object") {
        				return true;
        			}
        			let operator = (group.condVisible != null ? "" + group.condVisible : "and").toLowerCase();
        			let results: Array<boolean> = [];
        			for (let cond of (Array.isArray(group.conds) ? group.conds : [])) {
        				try {
        					if (this.isAfieldSimpleOrMultiple(cond) || this.isAFile(cond) || this.isACamSign(cond)) {
        						results.push(!!this.compute(cond));
        					}
        					else if (this.isAform(cond)) {
        						results.push(!!this.eval("" + this.generateJsVisibleIfForm(cond)));
        					}
        					else if (this.isANeverVisible(cond)) {
        						results.push(false);
        					}
        				}
        				catch (e) {
        					// Ignore malformed conditions and continue evaluation
        				}
        			}
        			for (let childGroup of (Array.isArray(group.groups) ? group.groups : [])) {
        				try {
        					results.push(evaluateVisibleGroup(childGroup));
        				}
        				catch (e) {
        					// Ignore malformed nested groups and continue evaluation
        				}
        			}
        			if (results.length == 0) {
        				return true;
        			}
        			return operator == "or" ? results.some((value) => value === true) : results.every((value) => value === true);
        		};
        		return evaluateVisibleGroup(conditions.visibleIf);
        	}
        
        	private getGoToPageIfConditions(item: any): any {
        		let conditions = this.getLegacyAwareConditions(item);
        		return conditions != null ? conditions.goToPageIf : null;
        	}
        
