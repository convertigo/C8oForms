        	public async performForLoop(step, submitActions, executeSubmit, __id, executionToken = null) {
        		if (!this.isFlowExecutionActive(executionToken)) {
        			return;
        		}
        		var variables: any = {};
        		var sources: any = this.searchForSources(step, "sources", true, false, true);
        		var findVars = sources.findVars;
        		await this.computeVariable(findVars, variables, step);
        		if (!this.isFlowExecutionActive(executionToken)) {
        			return;
        		}
        		if (variables.selfVar != undefined && Array.isArray(variables.selfVar)) {
        			let cpt = 0;
        			for (let elem of variables.selfVar) {
        				if (!this.isFlowExecutionActive(executionToken)) {
        					break;
        				}
        				window["api"].currentFor.index = cpt;
        				window["api"].currentFor.element = elem;
        				for (let ref of step.childrenRefs) {
        					if (!this.isFlowExecutionActive(executionToken)) {
        						break;
        					}
        					let child = this.getItemById(ref);
        					await this.executeStep(child, submitActions, executeSubmit, __id, executionToken);
        				}
        				cpt++;
        			}
        			window["api"].currentFor.index = null;
        			window["api"].currentFor.element = null;
        		}
        	}
        
        	public async performForIfElse(step, submitActions, executeSubmit, __id= null, executionToken = null) {
        		if (!this.isFlowExecutionActive(executionToken)) {
        			return;
        		}
        		var variables: any = {};
        		if (step.sources.self.vars.selfVar.type == "condition") {
        			let jsString: string = "";
        			jsString = this.detectSubjectAndComplete(
        				step.sources.self.vars.selfVar.cond,
        				step.sources.self.vars.selfVar.condVisible,
        				null,
        				step.sources.self.vars.selfVar.groups
        			);
        			try {
        				variables.selfVar = eval(jsString);
        			}
        			catch (e) {
        				variables.selfVar = false;
        			}
        		}
        		else {
        			var variables: any = {};
        			var sources: any = this.searchForSources(step, "sources", true, false, true);
        			var findVars = sources.findVars;
        			await this.computeVariable(findVars, variables, step);
        		}
        		if (!this.isFlowExecutionActive(executionToken)) {
        			return;
        		}
        		if (variables.selfVar == true) {
        			for (let ref of step.childrenRefs) {
        				if (!this.isFlowExecutionActive(executionToken)) {
        					break;
        				}
        				let child = this.getItemById(ref);
        				await this.executeStep(child, submitActions, executeSubmit, __id, executionToken);
        			}
        		}
        		else {
        			for (let ref of step.childrenRefsElse) {
        				if (!this.isFlowExecutionActive(executionToken)) {
        					break;
        				}
        				let child = this.getItemById(ref);
        				await this.executeStep(child, submitActions, executeSubmit, __id, executionToken);
        			}
        		}
        	}
        
