        	private hasLegacyGoToMatrixCondition(group: any): boolean {
        		try {
        			for (let cond of (Array.isArray(group != null ? group.conds : null) ? group.conds : [])) {
        				if (
        					cond != null &&
        					cond.val2 != null &&
        					cond.val2.vals != undefined &&
        					typeof cond.val2.vals == "object" &&
        					Object.keys(cond.val2.vals).length > 0
        				) {
        					return true;
        				}
        			}
        			for (let child of (Array.isArray(group != null ? group.groups : null) ? group.groups : [])) {
        				if (this.hasLegacyGoToMatrixCondition(child)) {
        					return true;
        				}
        			}
        		}
        		catch (e) {
        		}
        		return false;
        	}
        
        	private evaluateGoToConditionMatch(cond: any): boolean {
        		try {
        			if (this.isAfieldSimpleOrMultipleGo(cond) || this.isAFile(cond) || this.isACamSign(cond)) {
        				return !!this.compute(cond);
        			}
        			if (this.isAform(cond)) {
        				return !!this.eval("" + this.generateJsVisibleIfForm(cond));
        			}
        			if (this.isANeverVisible(cond)) {
        				return false;
        			}
        		}
        		catch (e) {
        		}
        		return false;
        	}
        
        	private resetGoToPageTargets(group: any, item: any): void {
        		try {
        			if (group == null || item == null) {
        				return;
        			}
        			let groupAction = group != null ? group.page : null;
        			if (groupAction != null && groupAction !== "") {
        				let groupIndexToGo = this.findIndexOfPageByPageTechName(groupAction);
        				if (groupIndexToGo > -1) {
        					if (this.local.pages[groupIndexToGo].enabled == undefined || typeof this.local.pages[groupIndexToGo].enabled == "boolean") {
        						this.local.pages[groupIndexToGo].enabled = {};
        					}
        					this.local.pages[groupIndexToGo].enabled[item.id] = false;
        				}
        			}
        			for (let cond of (Array.isArray(group.conds) ? group.conds : [])) {
        				let action = cond != null ? cond.page : null;
        				if (action == null || action === "") {
        					continue;
        				}
        				let indexToGo = this.findIndexOfPageByPageTechName(action);
        				if (indexToGo < 0) {
        					continue;
        				}
        				if (this.local.pages[indexToGo].enabled == undefined || typeof this.local.pages[indexToGo].enabled == "boolean") {
        					this.local.pages[indexToGo].enabled = {};
        				}
        				this.local.pages[indexToGo].enabled[item.id] = false;
        			}
        			for (let child of (Array.isArray(group.groups) ? group.groups : [])) {
        				this.resetGoToPageTargets(child, item);
        			}
        		}
        		catch (e) {
        		}
        	}
        
        	private applyGoToCondition(cond: any, item: any): void {
        		try {
        			let action = cond != null ? cond.page : null;
        			if (action == null || action === "") {
        				return;
        			}
        			let indexToGo = this.findIndexOfPageByPageTechName(action);
        			if (indexToGo < 0) {
        				return;
        			}
        			if (cond.verb == undefined || cond.verb == "authorize") {
        				if (this.local.pages[indexToGo].enabled == undefined || typeof this.local.pages[indexToGo].enabled == "boolean") {
        					this.local.pages[indexToGo].enabled = {};
        				}
        				this.local.pages[indexToGo].enabled[item.id] = true;
        				return;
        			}
        			if (cond.verb == "goTo") {
        				this.local.currentIndex = indexToGo;
        				let i = this["navParams"].get("i") != undefined ? this["navParams"].get("i") : ":i";
        				let edit = this["navParams"].get("edit") != undefined ? this["navParams"].get("edit") : ":edit";
        				let formId = this["navParams"].get("formId") != undefined ? this["navParams"].get("formId") : ":formId";
        				history.pushState({ page: this["local"]["currentIndex"], formId: formId, edit: edit, i: i }, "", window.location.pathname.substring(0, window.location.pathname.indexOf("viewer")) + "viewer/" + formId + "/" + edit + "/" + i);
        				this.moveFocus();
        				this.setTitleRGAA();
        				this.ref.detectChanges();
        			}
        		}
        		catch (e) {
        			this.c8o.log.error("An error occurred while applying goToPageIf condition", e);
        		}
        	}
        
        	private evaluateGoToPageIfGroup(group: any, item: any, inheritedAction: any = null): any {
        		let operator = ((group != null && group.condVisible != null ? "" + group.condVisible : "and")).toLowerCase();
        		let groupAction: any = {
        			verb: group != null && group.verb != null && group.verb !== "" ? group.verb : (inheritedAction != null ? inheritedAction.verb : null),
        			page: group != null && group.page != null && group.page !== "" ? group.page : (inheritedAction != null ? inheritedAction.page : null)
        		};
        		let results: Array<boolean> = [];
        		let actions: Array<any> = [];
        		for (let cond of (Array.isArray(group != null ? group.conds : null) ? group.conds : [])) {
        			let matched = this.evaluateGoToConditionMatch(cond);
        			results.push(matched);
        			if (matched && cond != null && cond.page != null && cond.page !== "") {
        				actions.push({
        					verb: cond.verb != null && cond.verb !== "" ? cond.verb : (groupAction.verb != null && groupAction.verb !== "" ? groupAction.verb : "authorize"),
        					page: cond.page
        				});
        			}
        		}
        		for (let child of (Array.isArray(group != null ? group.groups : null) ? group.groups : [])) {
        			let childResult = this.evaluateGoToPageIfGroup(child, item, groupAction);
        			results.push(childResult.matched === true);
        			if (childResult.matched === true) {
        				actions = actions.concat(Array.isArray(childResult.actions) ? childResult.actions : []);
        			}
        		}
        		if (results.length == 0) {
        			return { matched: false, actions: [] };
        		}
        		if (operator == "or") {
        			let matched = results.some((value) => value === true);
        			return { matched: matched, actions: matched ? (groupAction.page != null && groupAction.page !== "" ? [groupAction] : actions) : [] };
        		}
        		let matched = results.every((value) => value === true);
        		return { matched: matched, actions: matched ? (groupAction.page != null && groupAction.page !== "" ? [groupAction] : actions) : [] };
        	}
        
        	private detectGoToPageIfAndComplete(group: any, item: any): void {
        		if (group == null || item == null) {
        			return;
        		}
        		if (this.hasLegacyGoToMatrixCondition(group)) {
        			this.detectTypeAndComplete(Array.isArray(group.conds) ? group.conds : [], item);
        			return;
        		}
        		this.resetGoToPageTargets(group, item);
        		let result = this.evaluateGoToPageIfGroup(group, item);
        		if (result.matched !== true) {
        			return;
        		}
        		for (let cond of (Array.isArray(result.actions) ? result.actions : [])) {
        			this.applyGoToCondition(cond, item);
        		}
        	}
        
        
        	/**
        	 * Find the index of a page in the local pages array based on the page''s technical name.
        	 * @param {string} pageTechName - The technical name of the page.
        	 * @returns {number} - The index of the page in the local pages array, or -1 if not found.
        	 */
        	private findIndexOfPageByPageTechName(pageTechName: string): number {
        		let cpt = 0;
        
        		// Iterate over each page in the local pages array
        		for (let page of this.local.pages) {
        			if (page.pageTechName == pageTechName) {
        				return cpt; // Return the index if the page''s technical name matches
        			}
        			cpt++;
        		}
        
        		return -1; // Return -1 if the page is not found
        	}
        
        	/**
        	 * Compute visibility conditions by detecting the type of conditions.
        	 * @param {Array<any>} conds - An array of conditions.
        	 * @param {string} operatorStr - The string operator.
        	 * @param {boolean} goToPage - Optional boolean value to indicate if it is for "goToPage" condition.
        	 * @returns {string} - The computed JavaScript string for visibility conditions.
        	 */
        	public detectSubjectAndComplete(
        		conds: Array<any>,
        		operatorStr: string,
        		goToPage = null,
        		groups: Array<any> = []
        	): string {
        		let expressions: Array<string> = [];
        		let operator = this.getCondVisibleToSign(operatorStr || "and");
        
        		for (let cond of (Array.isArray(conds) ? conds : [])) {
        			let expression = "";
        			try {
        				if (this.isAfieldSimpleOrMultiple(cond)) {
        					expression = "" + this.compute(cond);
        				}
        				else if (this.isAform(cond)) {
        					expression = "" + this.generateJsVisibleIfForm(cond);
        				}
        				else if (this.isAFile(cond)) {
        					expression = "" + this.compute(cond);
        				}
        				else if (this.isACamSign(cond)) {
        					expression = "" + this.compute(cond);
        				}
        				else if (this.isANeverVisible(cond)) {
        					expression = "false";
        				}
        			}
        			catch (e) {
        				// Handle any exceptions or errors
        			}
        			if (expression != "") {
        				expressions.push(expression);
        			}
        		}
        
        		for (let group of (Array.isArray(groups) ? groups : [])) {
        			try {
        				let groupExpression = this.detectSubjectAndComplete(
        					group != undefined ? group.conds : [],
        					group != undefined && group.condVisible != undefined ? group.condVisible : "and",
        					goToPage,
        					group != undefined && Array.isArray(group.groups) ? group.groups : []
        				);
        				if (groupExpression != "") {
        					expressions.push("(" + groupExpression + ")");
        				}
        			}
        			catch (e) {
        				// Handle any exceptions or errors
        			}
        		}
        
        		if (expressions.length == 0) {
        			return goToPage == null ? "true" : "";
        		}
        
        		return expressions.join(" " + operator + " ");
        	}
        
        
        	/**
        	 * Check if an object is an instance of a field.
        	 * @param {any} object - The object to be checked.
        	 * @returns {boolean} - A boolean value indicating whether the object is an instance of a field.
        	 */
        	private instanceOfField(object: any): boolean {
        		return ''val1'' in object; // Check if the ''val1'' property exists in the object
        	}
        
        	private hasConditionValue(val: any): boolean {
        		return (
        			val != undefined &&
        			(
        				(val.str != undefined && val.str !== "") ||
        				(Array.isArray(val.arr) && val.arr.length > 0)
        			)
        		);
        	}
        
        	/**
        	 * Check if the provided condition is a valid field (simple or multiple).
        	 * @param {FieldObject} cond - The condition object to be checked.
        	 * @returns {boolean} - A boolean value indicating whether the condition is a valid field.
        	 */
        	private isAfieldSimpleOrMultiple(cond: FieldObject): boolean {
        		try {
        			let hasUnaryOperator = cond.operator == "is_filled" || cond.operator == "is_empty";
        			return (
        				cond.subject != undefined &&
        				cond.subject == "field" &&
        				this.hasConditionValue(cond.val1) &&
        				cond.operator != undefined &&
        				cond.operator != "" &&
        				(hasUnaryOperator || this.hasConditionValue(cond.val2))
        			);
        		} catch (e) {
        			return false;
        		}
        	}
        
        	/**
        	 * Check if the provided condition is a valid field (simple or multiple) for "goToPageIf" type.
        	 * @param {FieldObject} cond - The condition object to be checked.
        	 * @returns {boolean} - A boolean value indicating whether the condition is a valid field for "goToPageIf".
        	 */
        	private isAfieldSimpleOrMultipleGo(cond: FieldObject): boolean {
        		try {
        			let hasUnaryOperator = cond.operator == "is_filled" || cond.operator == "is_empty";
        			return (
        				this.hasConditionValue(cond.val1) &&
        				cond.operator != undefined &&
        				cond.operator != "" &&
        				cond.type == "goToPageIf" &&
        				(hasUnaryOperator || this.hasConditionValue(cond.val2))
        			);
        		} catch (e) {
        			return false;
        		}
        	}
        
        	/**
        	 * Check if the provided condition is a valid form.
        	 * @param {FormObject} cond - The condition object to be checked.
        	 * @returns {boolean} - A boolean value indicating whether the condition is a valid form.
        	 */
        	private isAform(cond: FormObject): boolean {
        		try {
        			return (
        				cond.subject != undefined &&
        				cond.subject == "form" &&
        				cond.attribute != undefined &&
        				cond.attribute != "" &&
        				cond.operator != undefined &&
        				cond.operator != ""
        			);
        		} catch (e) {
        			return false;
        		}
        	}
        
        	/**
        	 * Check if the provided condition represents a "never_visible" condition.
        	 * @param {FormObject} cond - The condition object to be checked.
        	 * @returns {boolean} - A boolean value indicating whether the condition is a "never_visible" condition.
        	 */
        	private isANeverVisible(cond: FormObject): boolean {
