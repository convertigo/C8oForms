        	public triggerSourceIds(idsToCall): void {
        		let page = this;
        		if (page.local.techGrid == undefined) {
        			page.local.techGrid = {};
        		}
        		let execIdToCall = async () => {
        			for (let id of idsToCall) {
        				try {
        					page["functionsById"][id](true)
        					.finally(() => {
        						if (page.local.fromResponse) {
        							for (let _id in (page as any).shaById) {
        								if ((page as any).shaById[_id] == id) {
        									let elem = (page as any).getItemById(_id);
        									if (elem.type == "grid" && (page as any).formsSubmit[elem.name].value != null) {
        										let targetGrid = (page as any).all_c8oforms_itemgridviewer._results.find((x) => x.item.name == elem.name);
        										if (targetGrid == undefined) {
        											return;
        										}
        										if (elem.config.returned_value === "row_selected") {
        											targetGrid.myGrid.agGrid.api.forEachNode((node, rowIndex) => {
        												if (node?.data?.id?.value == (page as any).formsSubmit?.[elem.name]?.value?.id) {
        													targetGrid.myGrid.agGrid.api.ensureNodeVisible(node);
        													node.setSelected(true, true);
        												}
        											});
        										}
        										else if (elem.config.returned_value === "multiple_row_selected") {
        											targetGrid.myGrid.agGrid.api.forEachNode((node, rowIndex) => {
        												if ((page as any).formsSubmit?.[elem.name]?.value.map((x) => { return x.id }).includes(node?.data?.id?.value)) {
        													targetGrid.myGrid.agGrid.api.ensureNodeVisible(node);
        													node.setSelected(true, false);
        												}
        											});
        										}
        										else if (elem.config.returned_value === "cell_selected") {
        											targetGrid.myGrid.agGrid.api.forEachNode((node, rowIndex) => {
        												if (node?.data?.id?.value == (page as any).formsSubmit?.[elem.name]?.parentNodeId) {
        													for (let i in node.data) {
        														let currentCell = node.data[i];
        														if (typeof currentCell == "string") {
        															if (currentCell == (page as any).formsSubmit?.[elem.name]?.value) {
        																targetGrid.myGrid.agGrid.api.ensureNodeVisible(node);
        																targetGrid.myGrid.agGrid.api.setFocusedCell(rowIndex, i);
        																targetGrid.myGrid.elementRef.nativeElement.querySelector(`[row-id="${node.id}"]`).querySelector(`[col-id="${currentCell}"]`).classList.add(''ag-row-selected'');
        															}
        														}
        														else {
        															if (currentCell?.technicalName == (page as any).formsSubmit?.[elem.name]?.value.technicalName) {
        																targetGrid.myGrid.agGrid.api.ensureNodeVisible(node);
        																targetGrid.myGrid.agGrid.api.setFocusedCell(rowIndex, i);
        																targetGrid.myGrid.elementRef.nativeElement.querySelector(`[row-id="${node.id}"]`).querySelector(`[col-id="${currentCell?.technicalName}"]`).classList.add(''ag-row-selected'');
        															}
        														}
        													}
        												}
        											});
        										}
        									}
        								}
        							}
        						}
        					});
        				}
        				catch (e) {
        					console.error("an error occured idsToCall", e);
        				}
        			}
        		}
        		execIdToCall();
        	}
        	
        	public async initCurrentPageSources(force = false): Promise<Array<string>> {
        		if (this.formsList == undefined || this.redList == undefined || this.formsSubmit == undefined) {
        			return [];
        		}
        		let currentPageTechName = this.getCurrentPageTechName();
        		if (this.local.initializedSourcePages == undefined) {
        			this.local.initializedSourcePages = {};
        		}
        		if (this.local.initializingSourcePages == undefined) {
        			this.local.initializingSourcePages = {};
        		}
        		if (currentPageTechName != null && !force && this.local.initializedSourcePages[currentPageTechName] == true) {
        			return [];
        		}
        		if (currentPageTechName != null && this.local.initializingSourcePages[currentPageTechName] == true) {
        			return [];
        		}
        		if (currentPageTechName != null) {
        			this.local.initializingSourcePages[currentPageTechName] = true;
        		}
        		try {
        			let idsToCall = await this.fillSources(this.getCurrentPageFormsList(), this.redList, this.formsSubmit);
        			if (currentPageTechName != null) {
        				this.local.initializedSourcePages[currentPageTechName] = true;
        			}
        			this.triggerSourceIds(idsToCall);
        			return idsToCall;
        		}
        		finally {
        			if (currentPageTechName != null) {
        				delete this.local.initializingSourcePages[currentPageTechName];
        			}
        		}
        	}
        	
        	/**
        	 * Supprime les ?. de la LHS des affectations.
        	 * @param {string} src - code JS d’origine
        	 * @returns {string}  - code transformé
        	 */
        	removeSafeOperatorsInLHSOLD(code) {
        		const assignmentRegex = /(^|[^<>=!+\-*/%&|^~?:])((?:const|let|var)?\s*)([^=]+?)(?==)/g;
        		return code.replace(assignmentRegex, (full, prefix, decl, lhs) => {
        			const cleanedLHS = lhs
        				.replace(/\?\.\s*\[/g, ''['')
        				.replace(/\?\.(\w+)/g, ''.$1'');
        			return prefix + decl + cleanedLHS;
        		});
        	}
        	removeSafeOperatorsInLHS(code) {
        	  const ast = parse(code, {
        	    sourceType: "module",
        	    plugins: 		[
        		    "optionalChaining",
        		    ["optionalChainingAssign", { version: "2023-07" }],
        		    "classProperties",
        		    "classPrivateProperties",
        		    "classPrivateMethods"
        		],
        	    errorRecovery: true
        	  });
        
        	  const edits = [];
        
        	  function patchRange(start, end) {
        	    const lhsSrc = code.slice(start, end);
        	    if (!lhsSrc.includes("?."))
        	      return;
        
        	    const cleaned = lhsSrc
        	      .replace(/\?\.\s*\[/g, "[")
        	      .replace(/\?\.(\w+)/g, ".$1");
        
        	    if (cleaned !== lhsSrc) {
        	      edits.push({ start, end, replacement: cleaned });
        	    }
        	  }
        
        	  traverse(ast, {
        	    AssignmentExpression(path) {
        	      const left = path.node.left;
        	      if (left.start == null || left.end == null) return;
        	      patchRange(left.start, left.end);
        	    }
        	  });
        
        	  edits.sort((a, b) => b.start - a.start);
        	  let result = code;
        	  for (const { start, end, replacement } of edits) {
        	    result = result.slice(0, start) + replacement + result.slice(end);
        	  }
        	  return result;
        	}
        	
        	public 	async evalValueIfNeeded(
        		obj: any,
        		childKey: string,
        		evaluator: (code: string) => Promise<any>
        	): Promise<any> {
        		if (obj[childKey] != null && Array.isArray(obj[childKey])) {
        			obj[childKey] = await Promise.all(
        				obj[childKey].map((child: any) =>
        					this.evalValueIfNeeded(child, childKey, evaluator)
        				)
        			);
        		} else if (obj.value != null) {
        			obj.value = await evaluator(obj.value);
        		}
        
        		return obj;
        	}
        	
        	/**
        	 * computes variables ...
        	 * @param findVars the computed variables found
        	 * @param variables variables to be filled
        	 * @param item target item
        	 * @param findName 
        	 */
        	public async computeVariable(findVars, variables, item, findName = null): Promise<any> {
        		let page = this;
        		let names = {};
        		for (let va in findVars) {
        			try {
        				if (typeof findVars[va] == ''string'') {
        					let asyncFunction;
        					try {
        						asyncFunction = Object.getPrototypeOf(async () => { }).constructor(
        							''page'',
        							`return (async () => { var _ex = ${findVars[va]["replaceAll"](" ", "") == "" ? ''""'' :  findVars[va]}; return _ex; })();`
        						);
        					}
        					catch (e) {
        						if (e.message == "Invalid left-hand side in assignment" || e.message == "invalid assignment left-hand side") {
        							asyncFunction = Object.getPrototypeOf(async () => { }).constructor(
        								''page'',
        								`return (async () => {  var _ex = ${this.removeSafeOperatorsInLHS(findVars[va])}; return _ex; })();`
        							);
        						}
        						else {
        							throw e;
        						}
        					}
        					variables[va] = await asyncFunction(page);
        					try{
        						// legacy support for chantiers
        						if(va == "forms_mail_summary" && item?.actions?.["lib_Actions_C8Oforms.forms_notify_response_simple_by_mail_simple"]?.enabled && item?.actions?.["lib_Actions_C8Oforms.forms_notify_response_simple_by_mail_simple"]?.vars?.["forms_mail_summary"]?.type == null && variables[va] != "no" && variables[va] != "non" && variables[va] != "false" && Object.keys(item?.actions?.["lib_Actions_C8Oforms.forms_notify_response_simple_by_mail_simple"]?.vars?.["forms_mail_summary"])?.length > 0 ){
        							variables[va] = true;
        						}
        					}
        					catch(e){
        						
        					}
        					// end legacy
        					if (variables[va] == undefined || variables[va] == "undefined") {
        						delete variables[va];
        					}
        					else if (variables[va].then) {
        						variables[va] = await variables[va];
        						page.ref.markForCheck();
        					}
        					if (variables[va] == undefined || variables[va] == "undefined") {
        						delete variables[va];
        					}
        				}
        
        				else {
        					let res = JSON.parse(JSON.stringify(findVars[va]));
        					const evalInCurrentScope = async (code: string): Promise<any> => {
        						return await eval(code);
        					};
        					// assume its filter
        //					console.log(res)
        					if (res.filters != null && Array.isArray(res.filters)) {
        						res.filters = await Promise.all(
        							res.filters.map((x) => this.evalValueIfNeeded(x, "filters", evalInCurrentScope))
        						);
        						variables[va] = JSON.stringify(res);
        					}
        					else if (res.sorts != null && Array.isArray(res.sorts)) {
        						res.sorts = await Promise.all(
        							res.sorts.map((x) => this.evalValueIfNeeded(x, "sorts", evalInCurrentScope))
        						);
        						variables[va] = JSON.stringify(res);
        					}
        					else {
        						var temp = {};
        						for (let key in findVars[va]) {
        							const asyncFunction = Object.getPrototypeOf(async () => { }).constructor(
        								''page'',
        								`return (async () => { return ${findVars[va][key]} })();`
        							);
        							temp[key] = await asyncFunction(page);
        							if (temp[key] == undefined || temp[key] == "undefined") {
        								delete variables[va];
        							}
        							else if (temp[key].then) {
        								temp[key] = await variables[va];
        							}
        							if (temp[key] == undefined || temp[key] == "undefined") {
        								delete temp[key];
        							}
        						}
        						variables[va] = JSON.stringify(temp);
        					}
        
        
        				}
        			}
        			catch (e) {
        				if (this.local.toastErr == undefined) {
        					this.local.toastErr = [];
        				}
        				this.c8o.log.warn("An error occured while computing variables for " + item.name + " data sources, maybe the source has still not been created");
        				console.error("An error occured while computing variables for " + item.name + " data sources, maybe the source has still not been created", e);
        				if (!this.local.published) {
        					let toastController = this.getInstance(ToastController);
        					let toast = await toastController.create({
        						header: this.translate.instant("error_while_computing_item", {item :item.name}),
        						message: e.message,
        						position: "top",
        						cssClass: "toastError",
        						buttons: [
        							{
        								icon: ''close'',
        								htmlAttributes: {
        									''aria-label'': ''close'',
        								},
        							},
        						]
        					});
        					toast.onDidDismiss().then(() => {
        						if (this.local.toastErr != undefined) {
        							this.local.toastErr = this.local.toastErr.filter((activeToast) => activeToast !== toast);
        						}
        					});
        					await toast.present();
        					this.local.toastErr.push(toast);
        				}
        				delete variables[va];
        			}
        		}
        	}
        
        	/**
        	 * Retrieves the translation for a given message.
        	 * @param {string} msgTosearch - The message to search for translation.
        	 * @returns {Promise<any>} - A promise that resolves to the translation.
        	 */
        	public getTranslate(msgTosearch: string): Promise<any> {
        		return new Promise((resolve, reject) => {
        			let translate = this.getInstance(TranslateService); // Get an instance of the TranslateService
        			translate.get(msgTosearch).subscribe((res: string) => {
        				resolve(res); // Resolve the promise with the translation result
        			});
        		});
        	}
        
        	/**
        	 * Flattens an array and counts the number of non-deleted files.
        	 * @returns {any[]} - An array containing the flattened array and the count of non-deleted files.
        	 */
        	public flatArray(): any[] {
        		let arr = []; // Initialize an empty array to store the flattened elements
        		let cpt = 0; // Initialize a counter for non-deleted files
        
        		// Iterate over each bean in the global object
        		for (let bean in this.global[this.idFiles]) {
        			// Iterate over each file in the current bean
        			for (let file of this.global[this.idFiles][bean]) {
        				if (file.deleted === undefined && file.fromEdit != true) {
        					// If the ''deleted'' property is undefined, it means the file is not deleted
        					arr.push({ file: file, bean: bean }); // Push the file and bean into the array
        					cpt = cpt + 1; // Increment the counter for non-deleted files
        				}
        			}
        		}
        
        		return [arr, cpt]; // Return the array and the count as an array
        	}
        
