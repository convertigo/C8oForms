        	public async executeStep(step, submitActions, executeSubmit, __id = null, executionToken = null) {
        		if (!this.isFlowExecutionActive(executionToken)) {
        			return false;
        		}
        		let submit = false;
        		switch (step.type) {
        			case "business_logic":
        				await await this.performBusinessLogic(step, executionToken);
        				break;
        			case "submit":
        				await this.performSubmitAction(step, submitActions, executeSubmit, __id, executionToken);
        				submit = true;
        				break;
        			case "toast":
        				await this.performToastAction(step);
        				break;
        			case "push_page":
        				await this.performPushPageAction(step);
        				break;
        			case "push_app":
        				await this.performPushAppAction(step, executeSubmit);
        				break;
        			case "add_row_to_local_grid":
        				await this.performAddRowToLocalGrid(step);
        				break;
        			case "remove_row_from_local_grid":
        				await this.performRemoveRowFromLocalGrid(step);
        				break;
        			case "for_loop":
        				await this.performForLoop(step, submitActions, executeSubmit, __id, executionToken);
        				break;
        			case "if_else":
        				await this.performForIfElse(step, submitActions, executeSubmit, __id, executionToken);
        				break;
        			case "refresh_grid":
        				await this.performRefreshGrid(step);
        				break;
        		}
        		return this.isFlowExecutionActive(executionToken) ? submit : false;
        	}
        
        	public async executeFlow(item, executeSubmit = true) {
        		let submit = false;
        		let executionToken = this.startFlowExecutionSession();
        		let __id = this.local.user+''_''+this.local.formId+''_''+new Date().getTime();
        		try {
        			let flowId = item.flow;
        			let currentFlow = this.form.flows.find(f => f.id == flowId);
        			currentFlow = currentFlow.elements;
        			// first execute BL
        			this.fillActionsVars(currentFlow);
        			//await this.fillActions(currentFlow, false);
        			let submitActions = {};
        			// Then execute each action in order
        			for (let step of currentFlow) {
        				// execute current step.
        				if (!this.isFlowExecutionActive(executionToken)) {
        					break;
        				}
        				if (step.parentRef == undefined) {
        					let _submit = await this.executeStep(step, submitActions, executeSubmit, __id, executionToken);
        					if(_submit){
        						submit = true;
        					}
        				}
        
        			}
        			return submitActions;
        
        		} catch (e) {
        			console.error("an error occued while executing flow", e);
        		}
        		finally{
        			if(submit && executeSubmit){
        				this.c8o.callJsonObject("C8Oforms.APIV2_deleteDocument", {id:__id, fromResponse: true, __context: "*", __removeContext: true});
        				// perform deletion of temp docs
        			}
        		}
        	}
        
