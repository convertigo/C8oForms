        	public async checkCanRespond(form, toast=false){
        		if(form.config.oneRespByPerson){		
        			let indexFormId = (form)?._id?.indexOf("_anonymous");
        			let formId =  indexFormId != -1 ? (form)?._id?.substring(0,indexFormId) : (form)?._id;
        			let version = (form)?.version ?? "test";
        			formId = formId + "_" + version;
        			
        			try{
        				let r2 = await this.c8o.callJsonObject("C8Oforms.APIV2_getDocument", {id:formId, fromResponse: "true"}).async();
        				if(r2.res.respondent[this.global.settings._id] == true){
        					this.local.canRespond = false;
        					if(toast){
        						this.presentToast(this.translate.instant("already_responded_once"), ''toastWarn'', "middle", -1, true);
        					}
        				}
        			}
        			catch(e){
        				// silent error => means doc doesn''t exists (can resp)
        			}
        		}
        	}
        	public findSameSourceInBaserow(step) {
        		// find target table
        		let currentTableIds = [];
        		for (let key_source in step.actions) {
        			if (step.actions?.[key_source]?.vars?.forms_config?.str) {
        				var actionConfig = JSON.parse(step.actions?.[key_source]?.vars?.forms_config?.str);
        				//currentTableId = actionConfig?.table_id_int ?? null;
        				if (actionConfig?.table_id_int != null && !currentTableIds.includes(actionConfig?.table_id_int)) {
        					currentTableIds.push(actionConfig?.table_id_int);
        				}
        				if (actionConfig?.link_row_table_id != null && actionConfig?.link_row_table_id?.length > 0) {
        					for (let link of actionConfig?.link_row_table_id) {
        						if (!currentTableIds.includes(link)) {
        							currentTableIds.push(actionConfig?.table_id_int);
        						}
        					}
        				}
        			}
        		}
        		// find source tables 
        		if (currentTableIds?.length > 0) {
        			for (var key_form in this.form["formulaire"]) {
        				var elem = this.form["formulaire"][key_form];
        				if (elem.sources) {
        					for (let key_source in elem.sources) {
        						if (elem?.sources?.[key_source]?.vars?.forms_config?.str) {
        							var sourceConfig = JSON.parse(elem?.sources?.[key_source]?.vars?.forms_config?.str);
        							if (currentTableIds.includes(sourceConfig?.table_id_int)) {
        								//Refresh table
        								let sources: any = this.searchForSources(elem, "sources", true);
        								this.forceRefreshSourceById(sources.sha + elem.id);
        							}
        							else if (sourceConfig?.link_row_table_id != null && sourceConfig?.link_row_table_id?.length > 0) {
        								for (let link of sourceConfig?.link_row_table_id) {
        									if (currentTableIds.includes(link)) {
        										//Refresh table
        										let sources: any = this.searchForSources(elem, "sources", true);
        										this.forceRefreshSourceById(sources.sha + elem.id);
        									}
        								}
        							}
        						}
        					}
        				}
        			}
        		}
        	}
        	public async showConfirmationAlert(header: string, message: string, cancelLabel: string, confirmLabel: string, cssClass: string, btClass, confirmRed: boolean = true, cancelRed: boolean = false): Promise<boolean> {
        		const alert = await this.alertController.create({
        			header: header,
        			message: message,
        			backdropDismiss: false,
        			cssClass: cssClass,
        			buttons: [
        				{
        					cssClass: cancelRed ? "button-danger" : btClass,
        					text: cancelLabel,
        					role: ''cancel'',
        					handler: () => {
        						return false;
        					}
        				},
        				{
        					cssClass: confirmRed ? "button-danger" : btClass,
        					text: confirmLabel,
        					handler: () => {
        						return true;
        					}
        				}
        			]
        		});
        
        		await alert.present();
        		return new Promise((resolve) => {
        			alert.onDidDismiss().then((data) => {
        				resolve(!(data.role == ''cancel''));
        			});
        		});
        	}
        
        	public startFlowExecutionSession() {
        		let token = this.local.user + "_" + this.local.formId + "_" + new Date().getTime() + "_" + Math.random();
        		this.global["__c8oFormsFlowExecutionToken"] = token;
        		this.global["__c8oFormsFlowExecutionCancelled"] = false;
        		return token;
        	}
        
        	public cancelCurrentFlowExecution() {
        		this.global["__c8oFormsFlowExecutionCancelled"] = true;
        		this.global["__c8oFormsFlowExecutionToken"] = null;
        		try {
        			if (this.local["processingDataS"] != undefined) {
        				for (let id in this.local["processingDataS"]) {
        					clearTimeout(this.local["processingDataS"][id]);
        				}
        			}
        		}
        		catch(e){
        			
        		}
        	}
        
        	public isFlowExecutionActive(executionToken = null) {
        		return executionToken == null || (this.global["__c8oFormsFlowExecutionCancelled"] !== true && this.global["__c8oFormsFlowExecutionToken"] == executionToken);
        	}
        
        	public async performSubmitAction(step, submitActions, perform, __id = null, executionToken = null) {
        		if (!this.isFlowExecutionActive(executionToken)) {
        			return;
        		}
        		if (perform || submitActions[step["type"]] == null) {
        			submitActions[step["type"]] = []
        		}
        
        		
        		var doc: any;
        		doc  = {
        			item:
        			{
        				"_id": __id,
        				"_rev": new Date().getTime(),
        				resp: this.formsSubmit,
        				formId: this.local.formId,
        				timestamp: new Date().getTime(),
        				version: this.form?.version != undefined ? this.form?.version : ''test'',
        				actions: submitActions,
        				finished: true,
        				flow:true
        			}
        		};
        		
        		// handle attachments
        		let flat = this["flatArray"]();
        		var attachments = [];
        		var attachments_meta = [];
        		for(let index in flat[0]){
        			let item = flat[0][index];
        			// generate args for push
        			let args;
        			// handle web mode
        			let type = (item["file"].type == undefined || item["file"].type == "") ? "application/octet-stream":item["file"].type;
                    let _file: Blob = new Blob([item["file"]], { type: type });
        			let name = (item["bean"] + "_C80C80_" + item["file"]["name"]+"_C80C80_"+(new Date).getTime());
        			let file = new File([_file], name, {
        			  type: type,
        			  lastModified: new Date().getTime()
        			});
        			attachments.push(file);
        			attachments_meta.push({name:name, contentType:type});
        		}
        		if(this.local.objAtt != undefined){
        	        for(let item in this.local.objAtt){					
        				const name = this.local.objAtt[item]["name"];
        				let index = this["getElementByNameIntoFormSubmit"](item);
        				if(index.length == 1){
        					doc.item.resp[index[0]]["value"] = name;
        					doc.item.resp[index[0]]["att_type"] = true;
        				}
        				else{
        					doc.item.resp[index[0]]["children"][index[1]]["value"] = name;
        					doc.item.resp[index[0]]["children"][index[1]]["att_type"] = true;
        				}
                    }
        	    }
        		
        		for (let item in this.formsSubmit) {
        			if (this.formsSubmit[item]["type"] == "signature" || this.formsSubmit[item]["type"] == "img") {
        				if (this.formsSubmit[item]["value"] != "") {
        					doc.item.resp[item].att_type = true;
        					if (this.formsSubmit[item]["value"] instanceof File || this.formsSubmit[item]["value"] instanceof Blob) {
        						let _file: Blob = new Blob([this.formsSubmit[item]["value"]], { type: this.formsSubmit[item]["value"].type });
        						let file = new File([_file], this.formsSubmit[item]["name"], {
        						  type: this.formsSubmit[item]["value"].type,
        						  lastModified: new Date().getTime()
        						});
        						attachments.push(file);
        						attachments_meta.push({name:this.formsSubmit[item]["name"], contentType: this.formsSubmit[item]["value"].type});
        					}
        					else {
        						const byteCharacters = atob(this.formsSubmit[item]["value"].substring(22));
        					    const byteArrays = [];
        
        					    for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        					        const slice = byteCharacters.slice(offset, offset + 512);
        
        					        const byteNumbers = new Array(slice.length);
        					        for (let i = 0; i < slice.length; i++) {
        					            byteNumbers[i] = slice.charCodeAt(i);
        					        }
        
        					        const byteArray = new Uint8Array(byteNumbers);
        					        byteArrays.push(byteArray);
        					    }
        						let _file: Blob = new Blob(byteArrays, { type: (this.formsSubmit[item]["type"] == "signature" ? ''image/png'' : ''image/jpg'') });
        						let file = new File([_file], this.formsSubmit[item]["name"], {
        						  type: (this.formsSubmit[item]["type"] == "signature" ? ''image/png'' : ''image/jpg''),
        						  lastModified: new Date().getTime()
        						});
        						attachments.push(file);
        						attachments_meta.push({name: this.formsSubmit[item]["name"], contentType: (this.formsSubmit[item]["type"] == "signature" ? ''image/png'' : ''image/jpg'')});
        					}
        
        				}
        
        			}
        		}
        		
        		var variables: any = {};
        		var sources: any = this.searchForSources(step, "actions", false, false, false, true);
        		var findVars = sources.findVars;
        		let do_not_touchVars = {"_c8o_timezone_offset": (new Date().getTimezoneOffset() * 60000 * -1)};
        		for (let i in findVars) {
        			if (findVars[i].from_attachment != undefined && findVars[i].from_attachment) {
        				do_not_touchVars[i] = findVars[i];
        				delete findVars[i];
        			}
        		}
        		await this.computeVariable(findVars, variables, step);
        		if (!this.isFlowExecutionActive(executionToken)) {
        			return;
        		}
        		variables = Object.assign(variables, do_not_touchVars);
        		let currentAction = JSON.parse(JSON.stringify(step));
        		for (let action in currentAction.actions) {
        			if (action == sources.findName) {
        				currentAction.actions[action].vars = variables;
        			}
        			else {
        				delete currentAction.actions[action];
        			}
        		}
        		submitActions[step["type"]].push(currentAction);
        		doc.item.resp = JSON.parse(JSON.stringify(doc.item.resp));
        		doc.item.timestamp = new Date().getTime();
        		for(var i of attachments_meta){
        			i = i.name;
        		    if(i.indexOf("_C80C80_") != -1){
        				let id = i.substring(0, i.indexOf("_"));
        				for(var elems of this["formsList"]){
        					var ele: any = elems;
        					try{
        						if(ele != undefined && doc.item.resp[ele.name] != undefined){
        							if(+ele.id == +id){
        	                            if(doc.item.resp[ele.name]["value"] == undefined || doc.item.resp[ele.name]["value"] == ""){
        	                               doc.item.resp[ele.name]["value"] = [];
        	                            }
        	                            doc.item.resp[ele.name]["value"].push(i);
        	                        }
        							if(doc.item.resp[ele.name]["type"]== "ion-card" && doc.item.resp[ele.name]["children"] != undefined){
        								for(let elem of ele.children){
        									if(+elem.id == +id){
        										if(doc.item.resp[ele.name]["children"][elem.name] != undefined){
        											if(doc.item.resp[ele.name]["children"][elem.name]["value"] == undefined || doc.item.resp[ele.name]["children"][elem.name]["value"] == ""){
        												doc.item.resp[ele.name]["children"][elem.name]["value"] = [];
        											}
        											doc.item.resp[ele.name]["children"][elem.name]["value"].push(i);
        										}
        									}
        								}
        							}
        						}
        					}
        					catch(e){
        						this.c8o.log.warn("an error occured into postRecursive function, this log can be normal", e);
        					}                            
        	            }
        			}
        		}
        		if (perform && this.isFlowExecutionActive(executionToken)) {
        			try{
        				let parsed = JSON.parse(variables["forms_freeVars"]);
        				for(let item in parsed){
        					if (parsed[item]["type"] == "signature" || parsed[item]["type"] == "img" || parsed[item]["type"] == "file") {
        						parsed[item] = perform ? doc.item.resp[parsed[item].name] : this.formsSubmit[parsed[item].name];
        					}
        				}
