        /*Begin_c8o_PageFunction*/
        	
        	/**
        	 * Set expanded component value in array expandedComp
        	 * @param {number} idx - Index of the element in the array.
        	 * @param {string} value - New value of the element.
        	 */
        	public setExpandedComp(idx: number, value: boolean): void {
        		this.compInfos[idx].expanded = value;
        		this.local.fullPage = value;
        	}
        
        	/**
        	 * Check expanded component value in array expandedComp
        	 * @param {number} index - Index of the element in the array.
        	 * @returns {boolean} true if item should be visiblsetExpandedCompe else false.
        	 */
        	public checkIfVisible(index: number): boolean {
        		console.log("check isvvvvvvvvvvvvvvvvvvisible called");
        		for(let i = 0; i < this.compInfos.length; i++) {
        			let element = this.compInfos[i].expanded
        			// si l''élément est agrandi
        			if (element == true) {
        				// si l''index de l''élément agrandi est différent de l''index du comp à évaluer
        				if (i != index) {
        					return false
        				}
        			}
        		}
        		
        		return true
        	}
        
        	/**
        	 * Check at least one expanded component is visible (true) in array expandedComp
        	 * @returns {boolean} true if at least one item is visible else false.
        	 */
        	public atLeastOneIsVisible(): boolean {
        		for(let i = 1; i < this.compInfos.length; i++) {
        			if (this.checkIfVisible(i) == true) {
        				return true
        			}
        		}
        		return false
        	}
        	/*End_c8o_PageFunction*/
