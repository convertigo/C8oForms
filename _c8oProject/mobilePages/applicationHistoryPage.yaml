scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        /*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        /*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	// Display helpers of the version history (#1359); the state lives in this.local.history*.
        	public historyDate(value: any): string {
        		if (value == null) {
        			return "";
        		}
        		try {
        			return new Date(Number(value)).toLocaleString(this.translate.currentLang || undefined, { dateStyle: "medium", timeStyle: "short" } as any);
        		}
        		catch (e) {
        			return "" + value;
        		}
        	}
        	public historyTitle(entry: any): string {
        		return entry?.label || entry?.name || "";
        	}
        	public historyMeta(entry: any): string {
        		const parts: string[] = [];
        		if (entry?.origin === "publish" && entry?.publicationVersion != null) {
        			parts.push(this.translate.instant("history_publication_version", { version: entry.publicationVersion }));
        		}
        		if (entry?.author) {
        			// OAuth accounts are "provider:id:mail": the mail is enough
        			const author = String(entry.author);
        			parts.push(this.translate.instant("history_by", { author: author.substring(author.lastIndexOf(":") + 1) }));
        		}
        		return parts.join(" - ");
        	}
        /*End_c8o_PageFunction*/
        '
