↓PageStyle [ngx.components.UIStyle-1790181000122]: 
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.history {
          	display: flex;
          	flex-direction: column;
          	gap: 14px;
          	padding: 16px;
          	min-height: 100%;
          	box-sizing: border-box;
          }
          .history .modal-header {
          	display: block;
          	padding-right: 32px;
          }
          .history .title-text {
          	gap: 7px;
          }
          .history-actions {
          	display: flex;
          	flex-wrap: wrap;
          	gap: 8px;
          	align-items: center;
          }
          .history-label {
          	flex: 1 1 180px;
          	min-height: 32px !important;
          	height: 32px;
          	border: 1px solid #E2E8F0;
          	border-radius: 8px;
          	font-size: 12px !important;
          	--padding-start: 10px !important;
          	--padding-end: 10px !important;
          }
          .history-button {
          	--border-radius: 8px;
          	height: 32px;
          	margin: 0;
          	font-size: 12px;
          	font-weight: 500;
          	text-transform: none;
          	letter-spacing: normal;
          }
          .history-file {
          	display: inline-flex;
          	align-items: center;
          	gap: 6px;
          	height: 32px;
          	padding: 0 12px;
          	border: 1px solid #E2E8F0;
          	border-radius: 8px;
          	font-size: 12px;
          	font-weight: 500;
          	color: #1A1A1A;
          	cursor: pointer;
          	user-select: none;
          }
          .history-file:hover {
          	background: #F8FAFC;
          }
          .history-file ion-icon {
          	width: 14px;
          	height: 14px;
          	color: #64748B;
          }
          .history-file-input {
          	display: none;
          }
          .history-state {
          	padding: 24px 8px;
          	text-align: center;
          	font-size: 12px;
          	line-height: 18px;
          	color: #64748B;
          }
          .history-state--error {
          	color: #B91C1C;
          }
          .history-list {
          	display: flex;
          	flex-direction: column;
          	border: 1px solid #E2E8F0;
          	border-radius: 10px;
          	overflow: hidden;
          }
          .history-entry {
          	display: flex;
          	align-items: center;
          	justify-content: space-between;
          	gap: 12px;
          	padding: 10px 12px;
          	border-bottom: 1px solid #F1F5F9;
          }
          .history-entry:last-child {
          	border-bottom: none;
          }
          .history-entry-info {
          	display: flex;
          	flex-direction: column;
          	gap: 3px;
          	min-width: 0;
          }
          .history-entry-top {
          	display: flex;
          	flex-wrap: wrap;
          	align-items: center;
          	gap: 6px;
          }
          .history-entry-date {
          	font-size: 12px;
          	font-weight: 600;
          	color: #1A1A1A;
          }
          .history-badge {
          	padding: 0 7px;
          	border-radius: 999px;
          	font-size: 10.5px;
          	line-height: 17px;
          	background: #F1F5F9;
          	color: #475569;
          	white-space: nowrap;
          }
          .history-badge[data-origin="manual"] {
          	background: #E0F2FE;
          	color: #075985;
          }
          .history-badge[data-origin="publish"] {
          	background: #DCFCE7;
          	color: #166534;
          }
          .history-badge[data-origin="import"] {
          	background: #FEF3C7;
          	color: #92400E;
          }
          .history-badge--current {
          	background: var(--ion-color-primary);
          	color: #FFFFFF;
          }
          .history-badge--published {
          	background: #166534;
          	color: #FFFFFF;
          }
          .history-entry-title {
          	overflow: hidden;
          	font-size: 12.25px;
          	color: #1A1A1A;
          	text-overflow: ellipsis;
          	white-space: nowrap;
          }
          .history-entry-meta {
          	font-size: 11px;
          	color: #64748B;
          }
          .history-entry-actions {
          	display: flex;
          	flex-shrink: 0;
          	align-items: center;
          	gap: 2px;
          }
          .history-entry-actions ion-button {
          	height: 28px;
          	margin: 0;
          	font-size: 12px;
          	text-transform: none;
          	letter-spacing: normal;
          }
          .history-more {
          	display: flex;
          	justify-content: center;
          }
          '
