        	public unwrapHistoryResponse(output: any): any {
        		let payload = output;
        		if (payload != null && payload.sequence != null && payload.sequence.document != null) {
        			payload = payload.sequence.document;
        		}
        		if (payload != null && payload.document != null) {
        			payload = payload.document;
        		}
        		for (let i = 0; i < 3 && payload != null && payload.res != null; i++) {
        			payload = payload.res;
        		}
        		return payload || {};
        	}
        
        	public applyHistoryList(output: any): any {
        		const payload = this.unwrapHistoryResponse(output);
        		this.local.loading = false;
        		if (payload.status === ''ok'') {
        			this.local.history = payload;
        			this.local.historyError = null;
        			return {ok: true};
        		}
        		this.local.historyError = payload.error || ''history_operation_failed'';
        		return {ok: false};
        	}
        
        	public historyFailure(): any {
        		this.local.loading = false;
        		this.local.historyError = ''history_operation_failed'';
        		return {ok: false};
        	}
        
        	public applyHistoryAction(output: any, operation: string): any {
        		const payload = this.unwrapHistoryResponse(output);
        		if (payload.status !== ''ok'') {
        			this.local.historyError = payload.error || ''history_operation_failed'';
        			let messageKey = ''history_operation_failed'';
        			if (payload.status === ''conflict'') {
        				messageKey = ''history_restore_conflict'';
        			}
        			else if (payload.error === ''malformed_snapshot'' || payload.error === ''forbidden_snapshot_field'' || payload.error === ''migration_required'') {
        				messageKey = ''history_malformed_version'';
        			}
        			else if (payload.error === ''history_snapshot_missing'') {
        				messageKey = ''history_snapshot_missing'';
        			}
        			else if (operation === ''restore'') {
        				messageKey = ''history_restore_failed'';
        			}
        			return {
        				ok: false,
        				message: this.translate.instant(messageKey),
        				cssClass: ''toastError''
        			};
        		}
        		this.local.historyError = null;
        		if (operation === ''create'' && payload.entry) {
        			const items = (this.local.history && Array.isArray(this.local.history.items)) ? this.local.history.items : [];
        			if (!items.some((item: any) => item.versionId === payload.entry.versionId)) {
        				items.unshift(payload.entry);
        			}
        			this.local.history.items = items;
        			this.local.history.currentRev = payload.currentRev || this.local.history.currentRev;
        		}
        		if (operation === ''restore'' && payload.draft) {
        			const target = this.navParams.data.form;
        			Object.keys(target).forEach((key: string) => delete target[key]);
        			Object.assign(target, payload.draft);
        			const owner = this.navParams.data.pageOwner;
        			if (owner != null && owner.form != null && owner.form._id === target._id) {
        				owner.form = target;
        				owner.formsList = target.formulaire;
        			}
        			if (owner != null && owner.local != null && owner.local.form != null && owner.local.form._id === target._id) {
        				owner.local.form = target;
        			}
        			try {
        				if (owner != null && owner.ref != null) {
        					owner.ref.detectChanges();
        				}
        			}
        			catch (e) {
        			}
        			setTimeout(() => window.location.reload(), 800);
        			const items = (this.local.history && Array.isArray(this.local.history.items)) ? this.local.history.items : [];
        			items.forEach((item: any) => item.isCurrent = false);
        			if (payload.entry) {
        				payload.entry.isCurrent = true;
        				if (!items.some((item: any) => item.versionId === payload.entry.versionId)) {
        					items.unshift(payload.entry);
        				}
        			}
        			this.local.history.items = items;
        			this.local.history.currentRev = payload.rev;
        		}
        		return {
        			ok: true,
        			message: this.translate.instant(operation === ''restore'' ? ''history_restore_success'' : ''history_create_success''),
        			cssClass: ''toastSuccess''
        		};
        	}
        /*End_c8o_PageFunction*/
