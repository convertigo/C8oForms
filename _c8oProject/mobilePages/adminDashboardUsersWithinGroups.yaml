        	public process(labels) {
        		var translations = this.translate.translations[this.translate.currentLang];
        		let finKeyByValue = (value) => {
        			for (const key in translations) {
        				if (translations[key] === value) {
        					return key;
        				}
        			}
        		}
        
        		return labels.map((x) => {
        			if (x.headerName && x.headerName.length > 0) {				
        				x.headerName = this.translate.instant(x.headerName);
        			}
        
        			// Gestion des checkbox
        			if (x?.cellRenderer === "agCheckboxCellRenderer") {
        				if (x?.c8o_type === "stringboolean") {
        					x.valueGetter = (params) => !(params.data[x.field] === ''false'');
        					x.valueSetter = (params) => {
        						params.data[x.field] = params.newValue ? ''true'' : ''false'';
        						return true;
        					};
        				} else {
        					x.valueGetter = (params) => params.data[x.field] === true;
        					x.valueSetter = (params) => {
        						params.data[x.field] = params.newValue;
        						return true;
        					};
        				}
        			}
        
        			// Gestion de la localisation ("lang")
        			if (x?.valueGetter === "lang") {
        				if (x.cellEditorParams?.values) {
        					x.cellEditorParams.values = x.cellEditorParams.values.map((v) => this.translate.instant(v));
        					x.cellEditorParams.values = x.cellEditorParams.values.children?.map((v) => this.translate.instant(v)) || [];
        				}
        
        				x.valueGetter = (params) => {
        					return params?.data?.[x.field] ? this.translate.instant(params.data[x.field]) : params?.data?.[x.field] ?? "";
        				};
        
        				x.valueSetter = (params) => {
        					params.data[x.field] = finKeyByValue(params.newValue);
        					return true;
        				};
        			}
        
        			return x;
        		});
        	}
        
        	public async loadGridData(pageEvent: string = "") {
        		try {
        			this.local.loading = true;
        			if (this.myaggrid?.agGrid?.api) {
        				this.myaggrid.agGrid.api.showLoadingOverlay();
        			}
        			if (this.myaggrid2?.agGrid?.api) {
        				this.myaggrid2.agGrid.api.showLoadingOverlay();
        			}
        			let admin_write = ( (!this.global?.settings?.admin) ? true : false);
        			let admin_readonly = ( (this.global?.settings?.admin_readonly == undefined || !this.global?.settings?.admin_readonly) ? false : admin_write );
        //			console.log(admin_readonly);
        			var data = await this.c8o.callJsonObject("C8Oforms.admin_users_get_by_group_v2", {admin_readonly: admin_readonly}).async();
        			if (data.error) {
        				this.local.error = true;
        			}
        			else {
        				if (data?.result?.labels && data?.result?.childrenLabels) {
        					data.result.labels[0].cellRenderer = (params) => {
        						let tags = "";
        						for(let key in params.data.rights){
        							if(params.data.rights[key] === true || params.data.rights[key] === "true"){
        //								console.log(key);
        								tags += `<span style="
        									    padding: 2px 8px;
        									    margin-left: 6px;
        									    border-radius: 12px;
        									    background-color: #eef2f7;
        									    color: #1f2937;
        									    font-weight: 600;
        									    font-size: 14px;
        									    height: 2rem;
        									  ">${this.icons[key]} ${this.translate.instant(this.translations[key])}</span>`;
        							}
        						}
        					  return `<span>${params.data.value == "all_users" ? this.translate.instant("all_users") : params.data.value} ${tags}</span>`;
        					};
        					
        					data.result.labels[0].valueGetter = function(params) { 
        						return params.data.value;
        					};
        					
        					data.result.childrenLabels[7].cellRenderer = (params) => {
        					  const admin = params.value;
        					  if (admin === true || admin == "true") {
        						return `<span style="
        						    padding: 2px 8px;
        						    margin-left: 6px;
        						    border-radius: 12px;
        						    background-color: #eef2f7;
        						    color: #1f2937;
        						    font-weight: 600;
        						    font-size: 14px;
        						    height: 2rem;
        						  ">${this.icons[''admin'']} ${this.translate.instant(this.translations[''admin''])}</span>`;
        					  }
        					  else{
        						return '''';
        					  }
        					};
        					
        					data.result.childrenLabels[6].cellRenderer = (params) => {
        					  const admin_readonly = params.value;
        					  if (admin_readonly === true || admin_readonly == "true") {
        						return `<span style="
        						    padding: 2px 8px;
        						    margin-left: 6px;
        						    border-radius: 12px;
        						    background-color: #eef2f7;
        						    color: #1f2937;
        						    font-weight: 600;
        						    font-size: 14px;
        						    height: 2rem;
        						  ">${this.icons[''admin_readonly'']} ${this.translate.instant(this.translations[''admin_readonly''])}</span>`;
        					  }
        					  else{
        						return '''';
        					  }
        					};
        					
        					data.result.childrenLabels[3].cellRenderer = (params) => {
        					  const editing_rights = params.value;
        					  if (editing_rights === true || editing_rights == "true"){
        						return `<span style="
        						    padding: 2px 8px;
        						    margin-left: 6px;
        						    border-radius: 12px;
        						    background-color: #eef2f7;
        						    color: #1f2937;
        						    font-weight: 600;
        						    font-size: 14px;
        						    height: 2rem;
        						  ">${this.icons[''editing_rights'']} ${this.translate.instant(this.translations[''editing_rights''])}</span>`;
        					  }
        					  else{
          						return '''';
          					  }
        					};
        					
        					data.result.childrenLabels[4].cellRenderer = (params) => {
        						  const editing_rights = params.value;
        						  if (editing_rights === true || editing_rights == "true"){
        							return `<span style="
        							    padding: 2px 8px;
        							    margin-left: 6px;
        							    border-radius: 12px;
        							    background-color: #eef2f7;
        							    color: #1f2937;
        							    font-weight: 600;
        							    font-size: 14px;
        							    height: 2rem;
        							  ">${this.icons[''formulas'']} ${this.translate.instant(this.translations[''formulas''])}</span>`;
        						  }
        						  else{
        	  						return '''';
        	  					  }
        						};
        					
        					data.result.childrenLabels[5].cellRenderer = (params) => {
        					  const nocode_db_rights = params.value;
        					  if (nocode_db_rights === true || nocode_db_rights == "true") {
        						return `<span style="
        						    padding: 2px 8px;
        						    margin-left: 6px;
        						    border-radius: 12px;
        						    background-color: #eef2f7;
        						    color: #1f2937;
        						    font-weight: 600;
        						    font-size: 14px;
        						    height: 2rem;
        						  ">${this.icons[''nocode_db_rights'']} ${this.translate.instant(this.translations[''nocode_db_rights''])}</span>`;
        					  }
        					  else{
        						return '''';
        					  }
        					};
        					
        					data.result.labels = this.process(data.result.labels);
        					data.result.childrenLabels = this.process(data.result.childrenLabels);
        				}
        				if (data.result.values?.[0]?.group) {
        					data.result.values[0].group = this.translate.instant(data.result.values?.[0]?.group);
        				}
        
        				this.local.data = data;
        
        				this.valuesCopy = this.local.data?.result?.values;
        
        				if (pageEvent == "willLoad") {
        					setTimeout(() => {
        						const firstRow = this.myaggrid?.agGrid?.api.getDisplayedRowAtIndex(0);
        						if (firstRow) {
        							firstRow.setSelected(true);
        						}
        					}, 0);
        					this.valuesSelected = this.local.data?.result?.values[0]?.children;
        					this.groupSelected = this.local.data?.result?.values[0].group;
        				}
        			}
        		} 
        		catch (e) {
        			this.local.error = true;
        			console.error(e);
        			this.c8o.log.error("An error occured : \n" + JSON.stringify(e));
        		}
        		finally {
        			this.local.loading = false;
        			if (this.myaggrid?.agGrid?.api) {
        				this.myaggrid.agGrid.api.hideOverlay();
        			}
        			if (this.myaggrid2?.agGrid?.api) {
        				this.myaggrid2.agGrid.api.hideOverlay();
        			}
        			this.ref.markForCheck();
        		}
        	}
        
        	public async performBulk(bulkOperation: "deleteGroup" | "updateGroup" | "deleteUsersGroup" | "updateUsersGroup", confirmMsg: string, successMsg: string, errorMsg: string, cancelMsgBtn: string, confirmMsgBtn, right?: string, value?: any) {
        		try {
        			let docs;
        			let docs2;
        			if (bulkOperation == "updateGroup" || bulkOperation == "deleteGroup") {
        				// todo : format data structure here (args)
        				docs = this.myaggrid?.agGrid.api?.getSelectedNodes().map((node) => { return (bulkOperation == "deleteGroup") ? { "group": node.data.value } : { "oldGroup": node.data.value, newGroup: value.newGroup } });
        				docs2 = this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes().map((node) => { return { "_id": node.data._id, "_rev": node.data._rev } });
        				if (bulkOperation == ''deleteGroup'') {
        					docs2 = this.lib_extendedcomponents_ui_ngx_aggrid?.agGrid?.api?.getSelectedNodes().map((node) => { 
        						return { 
        							"_id": node.data.value,
        							"editing_rights": node.data?.editing_rights || false,
        							"admin": node.data?.admin || false,
        							"nocode_db_rights": node.data?.nocode_db_rights || false,
        							"_rev": node.data?.rev
        						} 
        					});
        				}
        			} else {
        				docs = this.myaggrid2?.agGrid?.api?.getSelectedNodes().map((node) => { return node.data["~c8oAcl"] });
        			}
        			let type = this.translate.instant("groups");
        			const performOperation = await this.showConfirmationAlert(
        				this.translate.instant("Confirmation"),
        				this.translate.instant(confirmMsg, { countlines: docs.length, resType: type }),
        				this.translate.instant(cancelMsgBtn),
        				this.translate.instant(confirmMsgBtn)
        			);
        
        			if (performOperation) {
        				let args: any = (bulkOperation != "updateUsersGroup" && bulkOperation != "deleteUsersGroup") ? { docs: JSON.stringify(docs) } : { meta: "" };
        				let sequence;
        				if (bulkOperation == "deleteGroup") {
        					docs.map((it) => {
        						if (it.group?.value != undefined) {
        							it.group = it.group.value;
        						}
        						
        						return it;
        					});
        					docs2.map((it) => {
        						if (it.group?.value != undefined) {
        							it.group = it.group.value;
        						}
        						
        						return it;
        					});
        					
        
        //					let args: any;
        					docs2 = docs2.map((x)=>{
        						x._deleted = true;
        						return x;
        					});
        					
        //					console.log(docs2);
        					args = {docs: JSON.stringify(docs2)};
        					args = {...args, "right": "editing_rights", "value": false};
        //					console.log(args);
        					let data2 = await this.c8o.callJsonObject("C8Oforms.admin_group_upsert_bulk", args).async();
        //					console.log(data2)
        //					args = { docs: JSON.stringify(docs) };		
        //					console.log(docs);		
        //					let sequence;
        					for (let i = 0; i < docs.length; i++) {
        						args = { meta: JSON.stringify(docs[i]) };
        						sequence = "C8Oforms.admin_groups_delete";
        						let deleted = await this.c8o.callJsonObject(sequence, args).async();
        //						console.log(deleted);
        						this.loadGridData();
        						if (deleted?.success || deleted?.success == ''true'') {
        							await this.presentToast(this.translate.instant(successMsg, { countlines: docs.length }), ''toastSuccess'');
        						}
        						else {
        							await this.presentToast(this.translate.instant(errorMsg), ''toastError'');
        						}
        					}
        					return;
        				}
        				else if (bulkOperation == "updateGroup") {
        					return;
        				}
        				else if (bulkOperation == "deleteUsersGroup") {
        					let gridCount = this.myaggrid2?.agGrid?.api?.getDisplayedRowCount();
        					let deleted: any = { success: true };
        					let meta = { groups: JSON.stringify([this.groupSelected]), users: JSON.stringify(docs) };
        					let sequence = "C8Oforms.admin_users_remove_from_groups";
        					deleted = await this.c8o.callJsonObject(sequence, meta).async();
        					if (deleted?.success || deleted?.success == ''true'' || deleted?.success.length == 0) {
        						await this.presentToast(this.translate.instant(successMsg, { countlines: docs.length }), ''toastSuccess'');
        						
        						
        						let data = await this.c8o.callJsonObject("C8Oforms.admin_users_get_by_group_v2", {targetGroup: this.groupSelected}).async();
        						
        						this.valuesSelected = data.result.values.find(x=>x.children != null).children;
        						this.myaggrid2.agGrid.api.setGridOption(''rowData'', this.valuesSelected);
        						this.local.selected2 = this.myaggrid2?.agGrid?.api?.getSelectedNodes({ startRow: 0, endRow: 1 }).length > 0;
        						this.local.selectedUsers = this.myaggrid2?.agGrid?.api?.getSelectedNodes();
        						
        						this.ref.detectChanges();
        					}
        					else {
        						await this.presentToast(this.translate.instant(errorMsg), ''toastError'');
        					}
        					if (docs.length == gridCount) {
        						this.loadGridData("willLoad");
        					}
        					return;
        				}
        				else if (bulkOperation == "updateUsersGroup") {
        					sequence = "C8Oforms.admin_users_move_in_group";
        					args = { ...args, "right": right, "value": value };
        				}
        				let deleted = await this.c8o.callJsonObject(sequence, args).async();
        				await this.loadGridData();
        				if (deleted?.result?.success) {
        					await this.presentToast(this.translate.instant(successMsg, { countlines: docs.length }), ''toastSuccess'');
        				}
        				else {
        					await this.presentToast(this.translate.instant(errorMsg), ''toastError'');
        				}
        			}
        		} catch (e) {
        			this.loadGridData();
        			await this.presentToast(this.translate.instant(errorMsg), ''toastError'');
        		}
        	}
        
        	public async showConfirmationAlert(header: string, message: string, cancelLabel: string, confirmLabel: string, confirmRed: boolean = true, cancelRed: boolean = false): Promise<boolean> {
        		const alert = await this.alertController.create({
        			header: header,
        			message: message,
        			backdropDismiss: false,
        			cssClass: ''styleAlertHeight'',
        			buttons: [
        				{
        					cssClass: cancelRed ? "button-danger" : "",
        					text: cancelLabel,
        					role: ''cancel'',
        					handler: () => {
        						return false;
        					}
        				},
        				{
        					cssClass: confirmRed ? "button-danger" : "",
        					text: confirmLabel,
        					handler: () => {
        						return true;
        					}
        				}
        			]
        		});
        
        		await alert.present();
        		return new Promise((resolve) => {
        			alert.onDidDismiss().then((data) => {
        				resolve(!(data.role == ''cancel''));
        			});
        		});
        	}
        
        	async presentToast(message: string, cssClass: string = '''') {
        		const toast = await this.toastController.create({
        			message: message,
        			duration: 3000,
        			position: ''bottom'',
        			cssClass: cssClass,
        		});
        
        		await toast.present();
        	}
        	async showModal(grid = "userToGroup") {
        		let docs = this.myaggrid?.agGrid?.api?.getSelectedNodes().filter((node) => node.data?.value != undefined);
        //		console.log(docs);
        		const modal = await this.modalController.create({
        			component: (grid == "userToGroup") ? C8Oforms_AddUserToGroupForm : ((grid == ''moveUserToGroup'') ?
        				C8Oforms_MoveUserToGroupForm : ((grid == "userGroupsDetail") ? C8Oforms_GetUserGroupsDetail : ((grid == "updateGroup") ? C8Oforms_UpdateGroupAccessRights : C8Oforms_AddGroupForm))),
        			cssClass: "modalAddGroup",
        			componentProps: (grid == "userToGroup") ? { selectedUsers: this.local.selectedUsers } : ((grid == ''moveUserToGroup'') ?
        				{ groupSelected: this.groupSelected, selectedUsers: this.local.selectedUsers, countUsersGroup: this.local.countUsersGroupSelected, page: this } : ((grid == "userGroupsDetail") ? { user: this.userDetailsSelected["~c8oAcl"], name: this.userDetailsSelected["mail"] } :
        					((grid == "updateGroup") ? ((this.myaggrid?.agGrid?.api?.getSelectedNodes().length == 1) ? { groupSelected: this.groupSelected, bulk: false, page: this } : { groupSelected: this.groupSelected, page: this, bulk: true, docs: this.myaggrid?.agGrid?.api?.getSelectedNodes() }) : {})))
        		});
        
        		modal.onDidDismiss().then(async (value) => {
        			if (value?.data?.refresh) {
        				if (grid == "moveUserToGroup" || grid == "userGroupsDetail") {
        					if (this.groupSelected != this.translate.instant(''all_users'')) {
        						var users = await this.c8o.callJsonObject(''C8Oforms.admin_users_of_group_get'', { group: this.groupSelected, _use_key: "group" }).async();
        						this.valuesSelected = users.object.users;
        						this.local.selected2 = this.myaggrid2?.agGrid?.api?.getSelectedNodes({ startRow: 0, endRow: 1 }).length > 0;
        						this.local.selectedUsers = this.myaggrid2?.agGrid?.api?.getSelectedNodes();
        						this.ref.detectChanges();
        					}
        				}
        				await this.loadGridData().then(async (value) => {
        					console.log("loaded");
        				});
        			}
        		})
        		return await modal.present();
        	}
        	
        	public renderMarkdown(template: string): string {
        	  return template.replace(/\{\{(.*?)\}\}/g, (_, key) => this.translate.instant(key.trim()) || `{{${key}}}`);
        	}
        
