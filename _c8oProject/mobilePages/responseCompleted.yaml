    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        import { readability } from ''@ctrl/tinycolor'';
        import { mostReadable } from ''@ctrl/tinycolor'';
        import { TinyColor } from ''@ctrl/tinycolor'';
        import { APP_BASE_HREF } from ''@angular/common'';
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.defineColorsForHeader();
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		/*End_c8o_PageInitialization*/
        /*Begin_c8o_PageAfterViewInit*/
        		/*End_c8o_PageAfterViewInit*/
        /*Begin_c8o_PageFinalization*/
        		/*End_c8o_PageFinalization*/
        /*Begin_c8o_PageFunction*/
        	public defineColorsForHeader(){
        		this.local.headerColor = "#ffffff";
        		this.local.policyColor = "black";
        		this.local.hooverPolicyColor = "black";
        		let btLightColor = "#ff8206";
        		let btLightColor2 = "#ffc906";
        		let secondaryColor = "#32db64";
        		let secondaryColor2 = "#0cbbe7";
        		let dangerColor = "#f53d3d";
        		let dangerColor2 = "#950000";
        		this.local.policyBtLightColor = "btLight";
        		this.local.policySecondaryColor = "secondary";
        		this.local.policyDangerColor = "danger";
        		this.local.pwaThemeReady = true;
        		
        		const applyHeaderTheme = (themeColor) => {
        		    this.local.headerColor = themeColor;
        		    // color asked for theme
        		    const color1 = new TinyColor(this.local.headerColor);
        		    // background color
        		    const color2 = new TinyColor("#ffffff");
        		    // get ALPHA
        		    let amount = color1.getAlpha() * 100;
        		    const visibleColor = color2.mix(color1, amount);
        		    let readabilitBlack = readability(visibleColor, "black");
        		    let readabilitWhite = readability(visibleColor, "white");
        		    const setReadableHoverColor = (useLightHover) => {
        		        let hoverCandidate = useLightHover ? new TinyColor(visibleColor).tint(65).toString() : new TinyColor(visibleColor).shade(65).toString();
        		        if (readability(visibleColor, hoverCandidate) < 4.5) {
        		            hoverCandidate = useLightHover ? new TinyColor(visibleColor).tint(85).toString() : new TinyColor(visibleColor).shade(85).toString();
        		        }
        		        if (readability(visibleColor, hoverCandidate) < 4.5) {
        		            hoverCandidate = this.local.policyColor;
        		        }
        		        this.local.hooverPolicyColor = hoverCandidate;
        		    };
        		    if (readabilitWhite > readabilitBlack) {
        		        this.local.policyColor = "white";
        		        setReadableHoverColor(true);
        		        //this.local.hooverPolicyColor2 = new TinyColor(visibleColor).tint(80).toString();
        		    }
        		    else{
        		    	this.local.policyColor = "black";
        				setReadableHoverColor(false);
        				//this.local.hooverPolicyColor2 = new TinyColor(visibleColor).shade(80).toString();
        			}
        			try{
        				var stylesheet = document.styleSheets[0]
        				stylesheet.insertRule(".tab-selected { color: "+this.local.policyColor+" !important;}");
        			}
        			catch(e){
        				
        			}
        		    //checking for other icons
        		    let readabilitBtLight = readability(visibleColor, btLightColor);
        		    let readabilitBtLight2 = readability(visibleColor, btLightColor2);
        		    if (readabilitBtLight2 > readabilitBtLight) {
        		        this.local.policyBtLightColor = "otherBtLight";
        		    }
        		    let readabilitSecondary = readability(visibleColor, secondaryColor);
        		    let readabilitSecondary2 = readability(visibleColor, secondaryColor2);
        		    if (readabilitSecondary2 > readabilitSecondary) {
        		        this.local.policySecondaryColor = "convertigo";
        		    }
        		    let readabilitDanger = readability(visibleColor, dangerColor);
        		    let readabilitDanger2 = readability(visibleColor, dangerColor2);
        		    if (readabilitDanger2 > readabilitDanger) {
        		        this.local.policyDangerColor = "otherDanger";
        		    }
        		};
        		
        		try {
        			
        		    let indexPWA = window.location.pathname.indexOf("pwas");
        		    let indexMobile = window.location.pathname.indexOf("mobile");
        		    // if we started in standalone pwa mode
        		    if (indexPWA != -1 && indexMobile == -1) {
        		        this.local.pwaThemeReady = false;
        		        if (this.global?.pwaThemeColor) {
        		            applyHeaderTheme(this.global.pwaThemeColor);
        		            this.local.pwaThemeReady = true;
        		        }
        		        // get PWA url base from the current path because the index base href can point to the parent project
        		        const pathParts = window.location.pathname.split("/");
        		        const pwasIndex = pathParts.indexOf("pwas");
        		        const baseUrl = pwasIndex !== -1 && pathParts[pwasIndex + 1] != null
        		            ? window.location.origin + pathParts.slice(0, pwasIndex + 2).join("/") + "/"
        		            : (document.querySelector(''base'')?.getAttribute(''href'') || ''/'');
        		        this.global.pwaGet = this.c8o.httpPublic.get(baseUrl + "manifest.webmanifest");
        		        this.global.pwaGet
        		            .subscribe(
        		                response => {
        		                    if (response["theme_color"] != undefined) {
        		                        this.global.pwaThemeColor = response["theme_color"];
        		                        applyHeaderTheme(response["theme_color"]);
        		                    }
        		                    this.local.pwaThemeReady = true;
        		                },
        		                error => {
        		                    this.local.pwaThemeReady = true;
        		                })
        		    }
        		}
        		catch (e) {
        		    this.local.pwaThemeReady = true;
        		}
        	}
        
        	private hasOwn(obj: any, key: string): boolean {
        	  return Object.prototype.hasOwnProperty.call(obj, key);
        	}
        
        	private getCurrentPage(index = -1): any {
        	  return this.local.pages?.[((index != -1) ? index : this.local.currentIndex)];
        	}
        
        	private isGlobalNavigationEnabled(): boolean {
        	  return (this.form as any)?.globalNavigationEnabled === true;
        	}
        
        	private isIndividualNavigationEnabled(index = -1): boolean {
        	  return this.local.pages?.[((index != -1) ? index : this.local.currentIndex)]?.individualNavigation === true;
        	}
        
        	public getNavigationValue<T>(
        	  key: string,
        	  defaultValue: T,
        	  index = -1,
        	  fallbackToPageWhenGlobalMissing = true
        	): T {
        	  const currentPage = this.getCurrentPage(index);
        	  const globalNavigation = (this.form as any)?.navigation;
        
        	  if (this.isGlobalNavigationEnabled() && !this.isIndividualNavigationEnabled(index)) {
        	    const hasGlobalValue =
        	      globalNavigation &&
        	      this.hasOwn(globalNavigation, key) &&
        	      globalNavigation[key] !== null &&
        	      globalNavigation[key] !== undefined;
        
        	    if (hasGlobalValue) {
        	      return globalNavigation[key];
        	    }
        
        	    if (!fallbackToPageWhenGlobalMissing) {
        	      return defaultValue;
        	    }
        	  }
        
        	  const hasPageValue =
        	    currentPage &&
        	    this.hasOwn(currentPage, key) &&
        	    currentPage[key] !== null &&
        	    currentPage[key] !== undefined;
        
        	  if (hasPageValue) {
        	    return currentPage[key];
        	  }
        
        	  return defaultValue;
        	}
          public getTabsOrientation(index = -1): "horizontal" | "vertical" {
            const orientation = this.getNavigationValue<string>("buttonsOrientation", "horizontal", index);
            return orientation === "vertical" ? "vertical" : "horizontal";
          }
          public getTabsVerticalPosition(index = -1): "left" | "right" {
            const verticalPosition = this.getNavigationValue<string>("buttonsVerticalPosition", "left", index);
            return verticalPosition === "right" ? "right" : "left";
          }
          private isTabsNavigationActive(index = -1): boolean {
            if (!this.getCurrentPage(index)) {
              return false;
            }
            const enabledTab = this.getNavigationValue<boolean>("enabledTab", false, index);
            const enabledButtons = this.getNavigationValue<boolean>("enabledButtons", false, index);
            const positionButtons = this.getNavigationValue<string>("positionButtons", "standard", index);
            return enabledTab === true || (enabledButtons === true && positionButtons === "tab");
          }
          public isVerticalTabsNavigationEnabled(position?: "left" | "right"): boolean {
            if (this.getTabsOrientation() !== "vertical" || !this.isTabsNavigationActive()) {
              return false;
            }
            return position == null || this.getTabsVerticalPosition() === position;
          }
          public isHorizontalTabsNavigationEnabled(): boolean {
            return this.getTabsOrientation() !== "vertical";
          }
          public isTabsEnabledAt(position: "top" | "bottom"): boolean {
            if (!this.getCurrentPage() || this.getTabsOrientation() === "vertical") {
              return false;
            }
            const positionTab = this.getNavigationValue<string>("positionTab", "bottom");
            return positionTab === position && this.isTabsNavigationActive();
          }
        	public isBottomNavigationEnabled(): boolean {
        	  return this.isTabsEnabledAt("bottom");
        	}
        
        	public isTabButtonsNavigationEnabled(): boolean {
        	  if (!this.getCurrentPage()) {
        	    return false;
        	  }
        
        	  const enabledButtons = this.getNavigationValue<boolean>(
        	    "enabledButtons",
        	    false
        	  );
        
        	  const positionButtons = this.getNavigationValue<string>(
        	    "positionButtons",
        	    "standard"
        	  );
        
        	  return (
        	    enabledButtons === true &&
        	    positionButtons === "tab"
        	  );
        	}
        	/*End_c8o_PageFunction*/
