          .signup-text {
            text-align: center;
            font-size: 14px;
            color: var(--ion-color-medium, #666);
            margin-top: 24px;
            user-select: none;
          }
          
          .signup-link {
          //  color: var(--ion-color-primary, #00c6ff);
          //  color: var(--convertigo-cyan);
          color: var(--ion-color-primary);
