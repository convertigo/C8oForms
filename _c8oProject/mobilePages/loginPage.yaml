      - xmlizable: 
        - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
        - com.twinsoft.convertigo.beans.common.FormatedContent: 
          →: |
            '		try {			
            			const logo =
            			  this.local.customHeaderLogo?.trim() ||
            			  this.global.customHeaderLogo?.trim() ||
            			  '''';
            
            			page.local.logo = logo;
            
            			if (!logo) {
            			  page.local.logo = null;
            			  page.local.isSvg = null;
            			} else {
            			  const lower = logo.toLowerCase();
            
            			  // 🔹 1️⃣ Détection rapide par extension
            			  if (lower.endsWith(''.svg'')) {
            			    page.local.isSvg = true;
            			  } else if ([''.png'', ''.jpg'', ''.jpeg'', ''.webp'', ''.avif''].some(e => lower.endsWith(e))) {
            			    page.local.isSvg = false;
            			  } else {
            			    // 🔹 2️⃣ Fallback intelligent (async)
            			    page.detectSvgByContentType(logo).then(isSvg => {
            			      page.local.isSvg = isSvg;
            //				  page.global.isSvg = isSvg;
            			    });
            			  }
            			}
            			
            //			page.global.isSvg = page.local.isSvg;
            
            			page.fullText =
            			  page.global.legacyLogo === true
            			    ? ''Convertigo Forms''
            			    : page.global.legacyLogo
            			      ? page.global.legacyLogo
            			      : ''No Code Studio'';
            
            			page.startTypewriter(true);
            		} catch(e) {
            			console.error(e);
            		}
            		resolve();
            '
