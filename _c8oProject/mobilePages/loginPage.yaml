        '/*Begin_c8o_PageImport*/
        import { NativePageTransitions, NativeTransitionOptions } from ''@ionic-native/native-page-transitions'';
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public fr = false;
        	public en = true;
        	public es = false;
        	public selectedItem;
        	public show = false;
        	username: string = '''';
        	password: string = '''';
        	passwordVisible: boolean = false;
        	subtitleText=''L\''outil No Code simple et intuitif pour créer vos applications personnalisées en quelques clics !'';
        	loginTitle=''Connexion'';
        	loginDescription=''Accédez à votre espace de travail'';
        	usernamePlaceholder=''Email ou nom d\''utilisateur'';
        	passwordPlaceholder=''Votre mot de passe'';
        	loginButtonText=''Se connecter'';
        	forgotPasswordText=''Mot de passe oublié ?'';
        	loginParent=null;
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.show = false;
        		this.local.formId = (this.navParams.get(''formId'') != undefined && this.navParams.get(''formId'') != ":formId" && this.navParams.get(''formId'') != "undefined") ? this.navParams.get(''formId'') : null;
        		this.local.page = (this.navParams.get(''page'') != undefined && this.navParams.get(''page'') != ":page" && this.navParams.get(''page'') != "undefined") ? this.navParams.get(''page'') : null;
        		this.local.edit = (this.navParams.get(''edit'') != undefined && this.navParams.get(''edit'') != ":edit" && this.navParams.get(''edit'') != "undefined") ? this.navParams.get(''edit'') : null;
        		this.local.published = (this.navParams.get(''published'') != undefined && this.navParams.get(''published'') != ":published" && this.navParams.get(''published'') != "undefined") ? this.navParams.get(''published'') : null;
        		this.subtitleText = this.translate.instant(''login_subtitle_text'');
        		this.loginTitle = this.translate.instant(''login_title'');
        		this.loginDescription = this.translate.instant(''login_description'');
        		this.usernamePlaceholder = this.translate.instant(''login_username_placeholder'');
        		this.passwordPlaceholder = this.translate.instant(''login_password_placeholder'');
        		this.loginButtonText = this.translate.instant(''login_button_text'');
        		this.forgotPasswordText = this.translate.instant(''login_forgot_password_text'');
        		this.usernamePlaceholder = this.translate.instant(''login_email_placeholder'');	
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	togglePasswordVisibility(): void {
        	  this.passwordVisible = !this.passwordVisible;
        	}
        	
        	setLanguage(lang){
        		let translate = this.getInstance(TranslateService);
        		window["__c8o__translate"]["use"](lang);
        		this.fr = false;
        		this.en = false;
        		this.es = false;
        		this.selectedItem = lang;
        		this[lang] = true;
        		}
        		
        	getFullYearDate(): number {
        		return new Date().getFullYear();
        	}
        	/*End_c8o_PageFunction*/
        '
