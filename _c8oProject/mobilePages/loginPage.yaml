          .footer {
            text-align: center;
            font-size: 12px;
            color: var(--ion-color-dark);
            margin-top: 10px;
            user-select: none;
          }
          
          /* Conteneur (équiv. motion initial/animate + tailwind classes) */
          .feature-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;           /* gap-6 */
            margin-top: 2rem;      /* mt-8 */
            font-size: 0.875rem;   /* text-sm */
            color: #6b7280;        /* text-gray-500 */
          
            opacity: 0;
            transform: translateY(10px);
            animation: fade-up 0.5s ease forwards;
            animation-delay: 1.2s; /* delay = 1.2s */
          }
          
          /* Élément cliquable avec hover scale + couleur violette */
          .feature {
            display: flex;
            align-items: center;
            gap: 0.5rem;           /* gap-2 */
            transition: transform 0.2s ease, color 0.2s ease;
            cursor: default;
          }
          
          .feature:hover {
            transform: scale(1.05);
            color: #8b5cf6;        /* violet */
          }
          
          /* Icône : suit la couleur du texte via currentColor */
          .feature .icon {
            width: 1rem;           /* w-4 */
            height: 1rem;          /* h-4 */
            display: block;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
          }
          
          /* Animation d’entrée */
          @keyframes fade-up {
            to {
              opacity: 1;
              transform: translateY(0);
            }
          }
          
          /* Accessibilité: réduit/retire les animations si demandé */
          @media (prefers-reduced-motion: reduce) {
            .feature-strip { animation: none; opacity: 1; transform: none; }
            .feature { transition: color 0.01s linear; }
          }
          
          /* Utilitaires équivalents Tailwind */
          .text-left { text-align: left; }
          .max-w-xs  { max-width: 20rem; }        /* ~320px */
          
          /* Conteneur : y:-20→0 & opacity:0→1, delay 0.4s, duration 0.5s */
          .hero-copy {
            opacity: 0;
            transform: translateY(-20px);
            animation: hero-in 0.5s ease forwards;
            animation-delay: 0.4s;
          }
          
          
          @media(min-width: 992px) {	
          /* Titre : fade-in après 0.6s, style équivalent tailwind (white, text-xl, semibold) */
          .hero-title {
            margin: 0 0 .5rem 0;                  /* mb-2 */
            color: #fff;
            font-size: 38px;                  /* text-xl */
            font-weight: 600;                     /* font-semibold */
            /* approximation drop-shadow-lg sur texte */
          //  text-shadow: 0 2px 6px rgba(0,0,0,.35);
            opacity: 0;
            animation: fade-in 0.5s ease forwards;
            animation-delay: 0.6s;
            white-space: pre-wrap;                /* au cas où */
          }
          /* Curseur clignotant: opacity [0,1,0], 1s, infini */
          .cursor {
            display: inline-block;
            animation: blink 1s linear infinite;
            color: #fff;
          }
          }
          
          @media(max-width: 992px) {	
          	/* Titre : fade-in après 0.6s, style équivalent tailwind (white, text-xl, semibold) */
          	.hero-title {
          		position:relative;
          	  margin: 0 0 0 0;                  /* mb-2 */
          //	  color: var(--ion-color-newconvertigo-tint);
          		color: var(--ion-color-primary);
          	  font-size: 38px;                  /* text-xl */
          	  font-weight: 600;                     /* font-semibold */
          	  opacity: 0;
          	  animation: fade-in 0.5s ease forwards;
          	  animation-delay: 0.6s;
          	  white-space: unset !important;          
          	}
          	/* Curseur clignotant: opacity [0,1,0], 1s, infini */
          	.cursor {
          	  display: inline-block;
          	  animation: blink 1s linear infinite;
          //	  color: var(--ion-color-newconvertigo);
          	  color: var(--ion-color-primary);
          	  white-space: unset important;
          	}
          }
          
          
          /* Paragraphe : fade-up (y:10→0), delay 2.5s, duration 0.5s */
          .hero-subtitle {
            color: rgba(255,255,255,.9);          /* text-white/90 */
            font-size: 20px;                   /* text-sm */
            line-height: 1.625;                   /* leading-relaxed */
            margin-bottom: .75rem;                /* mb-3 */
            filter: drop-shadow(0 1px 3px rgba(0,0,0,.25)); /* drop-shadow léger */
            opacity: 0;
            transform: translateY(10px);
            animation: fade-up 0.5s ease forwards;
            animation-delay: 2.5s;
          }
          
          /* Keyframes */
          @keyframes hero-in {
            to { opacity: 1; transform: translateY(0); }
          }
          @keyframes fade-in {
            to { opacity: 1; }
          }
          @keyframes fade-up {
            to { opacity: 1; transform: translateY(0); }
          }
          @keyframes blink {
            0%, 100% { opacity: 0; }
            50%      { opacity: 1; }
          }
          
          /* Accessibilité: réduire les animations si demandé */
          @media (prefers-reduced-motion: reduce) {
            .hero-copy,
            .hero-title,
            .hero-subtitle {
              animation: none !important;
              opacity: 1 !important;
              transform: none !important;
            }
            .cursor { animation: none; }
          }
          
          
