        	startTypewriter(reset = false) {
        		if (reset) { this.index = 0; this.displayText = ''''; }
        		this.stopTypewriter();
        
        		this.zone.runOutsideAngular(() => {
        			this.typingTimer = setInterval(() => {
        				const next = this.fullText.slice(0, this.index++);
        				this.zone.run(() => {
        					this.displayText = next;
        					this.cdr.detectChanges(); // ou this.cdr.markForCheck() si OnPush
        					if (this.index > this.fullText.length) this.stopTypewriter();
        				});
        			}, 150);
        		});
        	}
        
        	stopTypewriter() {
        		if (this.typingTimer) { clearInterval(this.typingTimer); this.typingTimer = null; }
        	}
        	
        	private async loadImage(url: string): Promise<HTMLImageElement> {
        	  return new Promise((resolve, reject) => {
        	    const img = new Image();
        	    img.crossOrigin = ''anonymous'';
        	    img.src = url;
        
        	    img.onload = () => resolve(img);
        	    img.onerror = reject;
        	  });
        	}
        
        	/**
        	 * Analyse complète en un seul chargement
        	 */
        	async analyzeImage(url: string) {
        	  try {
        	    const img = await this.loadImage(url);
        
        	    const dominant = getColorSync(img);
        	    const palette = getPaletteSync(img, { colorCount: 6 });
        	    const swatches = await getSwatches(img);
        
        	    return {
        	      dominantHex: dominant.hex(),
        	      dominantCss: dominant.css(),
        	      dominantIsDark: dominant.isDark,
        	      dominantTextColor: dominant.textColor,
        
        	      palette: palette.map(c => ({
        	        hex: c.hex(),
        	        css: c.css()
        	      })),
        
        	      swatches: Object.fromEntries(
        	        Object.entries(swatches).map(([key, value]) => [
        	          key,
        	          value ? {
        	            hex: value.color.hex(),
        	            textColor: value.color.textColor,
        	            isDark: value.color.isDark
        	          } : null
        	        ])
        	      )
        	    };
        
        	  } catch(e) {
        		console.error(e);
        	    return null;
        	  }
        	}
        	
        	modernizeTextContrast(
        	  bgHex: string,
        	  textHex: string,
        	  minContrast = 4.5
        	): string {
        
        	  const hexToRgb = (hex: string) => {
        	    const clean = hex.replace(''#'', '''');
        	    const bigint = parseInt(clean, 16);
        	    return {
        	      r: (bigint >> 16) & 255,
        	      g: (bigint >> 8) & 255,
        	      b: bigint & 255
        	    };
        	  };
        
        	  const rgbToHsl = (r: number, g: number, b: number) => {
        	    r /= 255; g /= 255; b /= 255;
        	    const max = Math.max(r, g, b);
        	    const min = Math.min(r, g, b);
        	    let h = 0, s = 0;
        	    const l = (max + min) / 2;
        
        	    if (max !== min) {
        	      const d = max - min;
        	      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        	      switch (max) {
        	        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        	        case g: h = (b - r) / d + 2; break;
        	        case b: h = (r - g) / d + 4; break;
        	      }
        	      h /= 6;
        	    }
        
        	    return {
        	      h: h * 360,
        	      s: s * 100,
        	      l: l * 100
        	    };
        	  };
        
        	  const hslToCss = (h: number, s: number, l: number) =>
        	    `hsl(${Math.round(h)}, ${Math.round(s)}%, ${Math.round(l)}%)`;
        
        	  const luminance = (r: number, g: number, b: number) => {
        	    const a = [r, g, b].map(v => {
        	      v /= 255;
        	      return v <= 0.03928
        	        ? v / 12.92
        	        : Math.pow((v + 0.055) / 1.055, 2.4);
        	    });
        	    return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
        	  };
        
        	  const contrastRatio = (bg: string, fg: string) => {
        	    const b = hexToRgb(bg);
        	    const f = hexToRgb(fg);
        	    const l1 = luminance(b.r, b.g, b.b);
        	    const l2 = luminance(f.r, f.g, f.b);
        	    const brightest = Math.max(l1, l2);
        	    const darkest = Math.min(l1, l2);
        	    return (brightest + 0.05) / (darkest + 0.05);
        	  };
        
        	  const bgRgb = hexToRgb(bgHex);
        	  const textRgb = hexToRgb(textHex);
        
        	  const hsl = rgbToHsl(textRgb.r, textRgb.g, textRgb.b);
        
        	  // 🎨 Modernisation
        	  let newS = Math.min(hsl.s + 10, 60); // boost léger saturation
        	  let newL = hsl.l;
        
        	  // Inverser luminosité si trop proche du fond
        	  const isBgDark = luminance(bgRgb.r, bgRgb.g, bgRgb.b) < 0.5;
        
        	  newL = isBgDark ? 88 : 15;
        
        	  let modernColor = hslToCss(hsl.h, newS, newL);
        
        	  // Vérifier contraste, fallback si insuffisant
        	  if (contrastRatio(bgHex, textHex) < minContrast) {
        	    modernColor = isBgDark ? ''#ffffff'' : ''#111111'';
        	  }
        
        	  return modernColor;
        	}
        	
        	async detectSvgByContentType(url: string): Promise<boolean | null> {
        	  try {
        	    const response = await fetch(url, { method: ''HEAD'' });
        
        	    const type = response.headers.get(''content-type'');
        
        	    if (!type) return null;
        
        	    return type.includes(''svg'');
        	  } catch {
        	    return null;
        	  }
        	}
        	/*End_c8o_PageFunction*/
