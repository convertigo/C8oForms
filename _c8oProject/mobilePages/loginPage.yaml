          'ion-grid {
              height: 100%;
          }
          
          ion-row {
          	height: 50%;
          }
          
          /* Dégradé générique en fond */
          .ion-bg-gradient {
          //  background-image: linear-gradient(
          //    var(--ion-gradient-angle, 135deg),
          //    var(--ion-color-primary),
          //    var(--ion-color-convertigo)
          //  );
          //  --background: linear-gradient(
          //    var(--ion-gradient-angle, 135deg),
          //    var(--ion-color-primary),
          //    var(--ion-color-convertigo)
          //  );
            --background: linear-gradient(135deg, rgb(139, 92, 246) 0%, rgb(99, 102, 241) 50%, rgb(0, 188, 212) 100%);
          }
          
          /* Variante pour composants Ionic qui exposent --background */
          .ion-gradient-surface {
            --background: linear-gradient(
              var(--ion-gradient-angle, 135deg),
              var(--ion-gradient-start),
              var(--ion-gradient-end)
            );
          }
          
          /* Bouton dégradé (hover/active/focus alignés) */
          ion-button.ion-gradient {
            --background: linear-gradient(
              var(--ion-gradient-angle, 135deg),
              var(--ion-gradient-start),
              var(--ion-gradient-end)
            );
            --background-hover: var(--background);
            --background-activated: var(--background);
            --background-focused: var(--background);
            color: var(--ion-color-primary-contrast); /* lisibilité */
          }
          
          /* Carte ou popover dégradé */
          ion-card.ion-gradient,
          ion-header.ion-gradient,
          ion-toolbar.ion-gradient {
            --background: linear-gradient(
              var(--ion-gradient-angle, 135deg),
              var(--ion-gradient-start),
              var(--ion-gradient-end)
            );
            color: var(--ion-color-primary-contrast);
          }
