        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		window["xo"] = this;
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public async getResponses(version? : string, summary: boolean = true, indexStart: number = 0, indexEnd: number = 2){
        		try {
        			var meta = JSON.stringify({"lang": this.translate.currentLang});
        			this.local.spinner = true;
        			this.local.formId = this.navParams.get(''formId'');
        		    this.local.offset = new Date().getTimezoneOffset() * 60000 * -1;
        			let responses = (await this.c8o.callJsonObject("C8Oforms.APIV2_getResponses", {meta: meta, csv: "false", formId: this.local.formId, version: version, summary: summary ? "true": "false", indexStart, indexEnd}).async()).res;
        			if(this.local.currentIndex == null){
        				if(version == null){
        					this.local.currentIndex = responses?.versions?.length - 1;
        				}
        				else{
        					this.local.currentIndex = responses?.versions.indexOf(+version);
        				}
        			}
        			this.local.versions = responses?.versions;
        			this.local.published_form =  responses?.published_form;
        			if(summary){
        				this.local.responses[this.local.currentIndex] = responses?.response;
        			}
        			else{
        				this.local.individualResponses[this.local.currentIndex] = responses?.response;
        			}
        			
        			
        		} catch (e) {
        			console.error("an error occured", e)
        		} finally {
        			this.local.spinner = false;
        			this.local.noresponse = false;
        			this.ref.markForCheck();
        			return;
        		}
        	}
        	/*End_c8o_PageFunction*/
        '
