        /*Begin_c8o_PageDeclaration*/
        	public toastController: any;
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		window["xo"] = this;
        		this.toastController = this.getInstance(ToastController);
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	async presentToast(message: string, cssClass: string = '''', position = "bottom", duration = 3000, closeBtn = false) {
        		let opts: any = {
        			message: message,
        			duration: duration,
        			position: position,
        			cssClass: cssClass
        		}
        		if (closeBtn) {
        			opts.buttons = [
        				{
        					side: ''end'',
        					icon: ''close'',
        					text: this.translate.instant("close"),
        					handler: () => {
        						toast.dismiss();
        					}
        				}
        			]
        		}
        		const toast = await this.toastController.create(opts);
        		await toast.present();
        	}
        	public async getResponses(version? : string, summary: boolean = true, indexStart: number = 0, indexEnd: number = 2){
        		try {
        			var meta = JSON.stringify({"lang": this.translate.currentLang});
        			this.local.spinner = true;
        			this.local.formId = this.navParams.get(''formId'');
        		    this.local.offset = new Date().getTimezoneOffset() * 60000 * -1;
        			let responses = (await this.c8o.callJsonObject("C8Oforms.APIV2_getResponses", {meta: meta, csv: "false", formId: this.local.formId, version: version, summary: summary ? "true": "false", indexStart, indexEnd}).async()).res;
        			if(this.local.currentIndex == null){
        				if(version == null){
        					this.local.currentIndex = responses?.versions?.length - 1;
        				}
        				else{
        					this.local.currentIndex = responses?.versions.indexOf(+version);
        				}
        			}
        			this.local.versions = responses?.versions;
        			this.local.published_form =  responses?.published_form;
        			if(summary){
        				this.local.responses[this.local.currentIndex] = responses?.response;
        				await this.loadSharedRespondents(this.local.versions?.[this.local.currentIndex]);
        			}
        			else{
        				this.local.individualResponses[this.local.currentIndex] = responses?.response;
        			}
        			
        			
        		} catch (e) {
        			console.error("an error occured", e)
        		} finally {
        			this.local.spinner = false;
        			this.local.noresponse = false;
        			this.ref.markForCheck();
        			return;
        		}
        	}
        	public async loadSharedRespondents(version? : string){
        		try {
        			this.local.sharedLoading = true;
        			this.local.sharedStats = null;
        			var targetVersion = version;
        			if(targetVersion == null){
        				targetVersion = this.local.versions?.[this.local.currentIndex];
        			}
        			if(targetVersion == null){
        				return;
        			}
        			if(this.local.remindedUsers == null){
        				this.local.remindedUsers = {};
        			}
        			var resp = await this.c8o.callJsonObject("C8Oforms.APIV2_getSharedInviteesStats", {formId: this.local.formId, version: targetVersion}).async();
        			var data = resp?.res;
        			if(data?.form){
        				this.local.published_form_doc = data.form;
        			}
        			if(data?.reminderLinks){
        				this.local.reminderLinks = data.reminderLinks;
        			}
        			var stats = data?.stats != null ? data.stats : null;
        			var list = stats?.list != null ? stats.list : [];
        			list.forEach((entry)=>{
        				if(entry == null){
        					return;
        				}
        				var sharedGroups = entry.sharedGroups;
        				var meta = entry.meta != null ? entry.meta : "";
        				if(sharedGroups != null && sharedGroups.length > 0){
        					var sharedVia = "";
        					if(sharedGroups.length === 1){
        						sharedVia = this.translate.instant(''shared_invitees_shared_via_group'', {group: sharedGroups[0]});
        					}
        					else{
        						sharedVia = this.translate.instant(''shared_invitees_shared_via_groups'', {groups: sharedGroups.join(", ")});
        					}
        					if(sharedVia !== ""){
        						meta = meta !== "" ? (meta + " • " + sharedVia) : sharedVia;
        					}
        				}
        				entry.meta = meta;
        				if(entry.email != null && this.local.remindedUsers?.[entry.email] === true){
        					entry.reminded = true;
        				}
        			});
        			if(stats == null){
        				var respondedCount = list.filter((entry)=> entry != null && entry.responded).length;
        				var remindableCount = list.filter((entry)=> entry != null && !entry.responded && entry.email).length;
        				var total = list.length;
        				stats = {
        					total: total,
        					respondedCount: respondedCount,
        					notRespondedCount: total - respondedCount,
        					remindableCount: remindableCount,
        					noInvitees: false,
        					list: list
        				};
        			}
        			else{
        				stats.list = list;
        			}
        			this.local.sharedStats = stats;
        			if(this.local.sharedStats?.list){
        				this.local.sharedStats.list = this.sortSharedInvitees(this.local.sharedStats.list);
        			}
        		} catch (e) {
        			console.error("an error occured", e)
        		} finally {
        			this.local.sharedLoading = false;
        			this.ref.markForCheck();
        			return;
        		}
        	}
        	private filterSharedInvitees(shared: any){
        		var invited = [];
        		if(shared == null){
        			return invited;
        		}
        		shared.forEach((entry)=>{
        			if(this.isSharedInvitee(entry)){
        				invited.push("" + entry);
        			}
        		});
        		invited = invited.filter((value, index, array)=> array.indexOf(value) === index);
        		invited.sort((a, b)=> ("" + a).localeCompare("" + b));
        		return invited;
        	}
        	private filterSharedGroups(shared: any){
        		var groups = [];
        		if(shared == null){
        			return groups;
        		}
        		shared.forEach((entry)=>{
        			if(typeof entry === "string" && !this.isSharedInvitee(entry)){
        				groups.push("" + entry);
        			}
        		});
        		groups = groups.filter((value, index, array)=> array.indexOf(value) === index);
        		groups.sort((a, b)=> ("" + a).localeCompare("" + b));
        		return groups;
        	}
        public async expandSharedInvitees(shared: any){
        	var invited = this.filterSharedInvitees(shared);
        	var groups = this.filterSharedGroups(shared);
        	var groupByUser = {};
        	if(groups.length === 0){
        		this.local.sharedGroupByUser = {};
        		return invited;
        	}
        	var groupUsers = [];
        	for(var grp of groups){
        		try {
        			var resp = await this.c8o.callJsonObject("lib_FullSyncGrp.UsersOf", {group: grp}).async();
        			var users = resp?.user ?? resp?.document?.user ?? resp?.res?.user;
        			if(users != null){
        				if(!Array.isArray(users)){
        					users = [users];
        				}
        				users.forEach((user)=>{
        					var userId = this.normalizeSharedInviteeId(user);
        					if(userId != null && userId !== ""){
        						groupUsers.push(userId);
        						if(groupByUser[userId] == null){
        							groupByUser[userId] = [];
        						}
        						if(groupByUser[userId].indexOf(grp) === -1){
        							groupByUser[userId].push(grp);
        						}
        					}
        				});
        			}
        		} catch (e) {
        			
        		}
        	}
        	this.local.sharedGroupByUser = groupByUser;
        	var combined = invited.concat(groupUsers);
        	combined = combined.filter((value, index, array)=> array.indexOf(value) === index);
        	return combined;
        }
        private isSharedInvitee(entry: any){
        	if(entry == null){
        		return false;
        	}
        	if(typeof entry !== "string"){
        		return false;
        	}
        	return entry.indexOf("C8Oreserved_") == 0;
        }
        private normalizeSharedInviteeId(entry: any){
        	if(entry == null){
        		return null;
        	}
        	if(typeof entry === "string"){
        		var text = entry.trim();
        		if(text === ""){
        			return null;
        		}
        		var prefix = "C8Oreserved_";
        		if(text.toLowerCase().indexOf(prefix.toLowerCase()) == 0){
        			return prefix + text.substring(prefix.length);
        		}
        		return prefix + text;
        	}
        	if(typeof entry === "object"){
        		var candidate = entry.id ?? entry._id ?? entry.user ?? entry.name ?? entry.email ?? entry.mail;
        		return this.normalizeSharedInviteeId(candidate);
        	}
        	return null;
        }
        public formatSharedInvitee(entry: any){
        	if(entry == null){
        		return "";
        	}
        	var text = "" + entry;
        	var idx = text.lastIndexOf(":");
        	if(idx > -1 && idx < text.length - 1){
        		text = text.substring(idx + 1);
        		return text;
        	}
        	var prefix = "C8Oreserved_";
        	if(text.indexOf(prefix) == 0 && text.length > prefix.length){
        		return text.substring(prefix.length);
        	}
        	return text;
        }
        	public extractSharedInviteeProvider(entry: any){
        		if(entry == null){
        			return "";
        		}
        		var text = "" + entry;
        		var prefix = "C8Oreserved_";
        		if(text.indexOf(prefix) == 0){
        			var idx = text.indexOf(":", prefix.length);
        			if(idx > prefix.length){
        				return text.substring(prefix.length, idx);
        			}
        		}
        		return "";
        	}
        	public initSharedSort(){
        		if(this.local.sharedSort == null){
        			this.local.sharedSort = { key: "label", dir: "asc" };
        		}
        	}
        	public getSharedSortIcon(key: string){
        		this.initSharedSort();
        		if(this.local.sharedSort?.key !== key){
        			return "swap-vertical";
        		}
        		return this.local.sharedSort?.dir === "desc" ? "arrow-down" : "arrow-up";
        	}
        	public sortSharedInvitees(list: any[]){
        		this.initSharedSort();
        		if(list == null || !Array.isArray(list)){
        			return list;
        		}
        		var key = this.local.sharedSort?.key;
        		var dir = this.local.sharedSort?.dir === "desc" ? -1 : 1;
        		var statusValue = function(item){
        			if(item == null){
        				return 0;
        			}
        			if(item.responded){
        				return 2;
        			}
        			if(item.reminded){
        				return 1;
        			}
        			return 0;
        		};
        		var actionValue = function(item){
        			return item != null && !item.responded && item.email ? 1 : 0;
        		};
        		list.sort((a, b)=>{
        			var comp = 0;
        			if(key === "status"){
        				comp = statusValue(a) - statusValue(b);
        			}
        			else if(key === "action"){
        				comp = actionValue(a) - actionValue(b);
        			}
        			else{
        				comp = ("" + (a != null && a.label != null ? a.label : "")).localeCompare("" + (b != null && b.label != null ? b.label : ""));
        			}
        			if(comp === 0){
        				comp = ("" + (a != null && a.label != null ? a.label : "")).localeCompare("" + (b != null && b.label != null ? b.label : ""));
        			}
        			return comp * dir;
        		});
        		return list;
        	}
        	public toggleSharedSort(key: string){
        		try {
        			this.initSharedSort();
        			if(this.local.sharedSort.key === key){
        				this.local.sharedSort.dir = this.local.sharedSort.dir === "asc" ? "desc" : "asc";
        			}
        			else{
        				this.local.sharedSort.key = key;
        				this.local.sharedSort.dir = "asc";
        			}
        			if(this.local.sharedStats?.list){
        				this.local.sharedStats.list = this.sortSharedInvitees(this.local.sharedStats.list);
        			}
        		} catch (e) {
        			
        		} finally {
        			this.ref.markForCheck();
        			return;
        		}
        	}
        	public async loadReminderLinks(){
        		try {
        			if(this.local.reminderLinks != null){
        				return;
        			}
        			var resp = await this.c8o.callJsonObject("C8Oforms.APIV2_GetManageAccessRights", {id: this.local.formId, collab: false}).async();
        			this.local.reminderLinks = {
        				auth: resp?.res?.linkAuth,
        				anon: resp?.res?.linkAnno
        			};
        		} catch (e) {
        			
        		} finally {
        			return;
        		}
        	}
        	public getReminderLink(){
        		return this.local?.reminderLinks?.auth ?? this.local?.reminderLinks?.anon ?? "";
        	}
        	public buildReminderHtml(bodyText: string){
        		var link = this.getReminderLink();
        		var linkHtml = "";
        		if(link != null && link !== ""){
        			var linkLabel = this.translate.instant(''OpenApp'');
        			linkHtml = `<p style="text-align: center;"><strong><a title="${linkLabel}" href="${link}" target="_blank" rel="noopener">${linkLabel}</a></strong></p>`;
        		}
        		return `<div style="padding: 3pt 0; text-align: center; font-size: 1.1875rem; color: #fff; background-color: #326DF7;">Convertigo no code studio</div>
        		<p style="text-align: center;">${bodyText}</p>${linkHtml}`;
        	}
        	public async sendReminderEmail(person: any){
        		try {
        			if(person == null || person.responded === true){
        				return;
        			}
        			var email = person.email;
        			if(email == null || email === ""){
        				return;
        			}
        			await this.loadReminderLinks();
        			var formName = this.local?.published_form_doc?.name ?? this.local?.published_form?.name ?? "";
        			var subject = this.translate.instant(''shared_invitees_remind_subject'', {formName: formName});
        			var bodyText = this.translate.instant(''shared_invitees_remind_body'', {formName: formName});
        			var html = this.buildReminderHtml(bodyText);
        			await this.c8o.callJsonObject("C8Oforms.APIV2_NotifyUsersSharing", {
        				meta: JSON.stringify({
        					group: [],
        					invite_new: [email],
        					subject: subject,
        					body: html
        				})
        			}).async();
        			if(this.local.remindedUsers == null){
        				this.local.remindedUsers = {};
        			}
        			this.local.remindedUsers[email] = true;
        			if(person){
        				person.reminded = true;
        			}
        			this.ref.markForCheck();
        			this.presentToast(this.translate.instant(''shared_invitees_remind_sent'', {email: email}), "toastSuccess", "bottom", 3000, true);
        		} catch (e) {
        			console.log("an error occured while sending reminder", e);
        			this.presentToast(this.translate.instant(''shared_invitees_remind_error''), "toastError", "bottom", 5000, true);
        		} finally {
        			return;
        		}
        	}
        	public async sendReminderToAll(){
        		try {
        			var list = this.local?.sharedStats?.list ?? [];
        			var recipients = list.filter((entry)=> !entry.responded && entry.email).map((entry)=> entry.email);
        			recipients = recipients.filter((value, index, array)=> array.indexOf(value) === index);
        			if(recipients.length === 0){
        				this.presentToast(this.translate.instant(''shared_invitees_remind_all_none''), "toastWarn", "bottom", 3000, true);
        				return;
        			}
        			await this.loadReminderLinks();
        			var formName = this.local?.published_form_doc?.name ?? this.local?.published_form?.name ?? "";
        			var subject = this.translate.instant(''shared_invitees_remind_subject'', {formName: formName});
        			var bodyText = this.translate.instant(''shared_invitees_remind_body'', {formName: formName});
        			var html = this.buildReminderHtml(bodyText);
        			await this.c8o.callJsonObject("C8Oforms.APIV2_NotifyUsersSharing", {
        				meta: JSON.stringify({
        					group: [],
        					invite_new: recipients,
        					subject: subject,
        					body: html
        				})
        			}).async();
        			if(this.local.remindedUsers == null){
        				this.local.remindedUsers = {};
        			}
        			recipients.forEach((email)=>{
        				this.local.remindedUsers[email] = true;
        			});
        			list.forEach((entry)=>{
        				if(entry.email && this.local.remindedUsers[entry.email] === true){
        					entry.reminded = true;
        				}
        			});
        			this.ref.markForCheck();
        			this.presentToast(this.translate.instant(''shared_invitees_remind_all_sent'', {count: recipients.length}), "toastSuccess", "bottom", 3000, true);
        		} catch (e) {
        			console.log("an error occured while sending reminder", e);
        			this.presentToast(this.translate.instant(''shared_invitees_remind_error''), "toastError", "bottom", 5000, true);
        		} finally {
        			return;
        		}
        	}
        	/*End_c8o_PageFunction*/
