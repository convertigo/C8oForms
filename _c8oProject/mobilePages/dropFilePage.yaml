        	public FileConvertSize(aSize: string): string {
        	    let size = Math.abs(parseInt(aSize, 10));
        
        	    if (size === 0) {
        	        return ''0 octets'';
        	    }
        
        	    const def: [number, string][] = [
        	        [1, ''octets''],
        	        [1024, ''ko''],
        	        [1024 * 1024, ''Mo''],
        	        [1024 * 1024 * 1024, ''Go''],
        	        [1024 * 1024 * 1024 * 1024, ''To'']
        	    ];
        
        	    for (let i = 0; i < def.length; i++) {
        	        if (size < def[i][0]) {
        	            return (size / def[i - 1][0]).toFixed(2) + '' '' + def[i - 1][1];
        	        }
        	    }
        
        	    // Gérer le cas où size est plus grand que le plus grand élément dans def
        	    return (size / def[def.length - 1][0]).toFixed(2) + '' '' + def[def.length - 1][1];
        	}
        
        
        
        	public async showToast(msgKey, var1){
        		let msgFiles= "";
        		try{
        			if(var1.length > 1){
        				msgFiles = var1.join(", ");
        			}
        			else{
        				msgFiles = var1[0];
        			}
        		}
        		//slient error
        		catch(e){
        			
        		}
        		let msg:any = await new Promise((resolve)=>{this.translate.get(msgKey, {size: this.max_size != undefined ? this.max_size: 5, listFiles: msgFiles}).subscribe((res)=>{resolve(res)})})
        		let toastController = this.getInstance(ToastController);
        		(await toastController.create({
        		    message: msg,
        		    position: ''bottom'',
        			cssClass: ''toastWarn'',
        			buttons:[
        				{
        		          text: this.translate.instant("close"),
        		          role: ''cancel''
        		    	}
        			]
        		  })).present();
        	}
        
