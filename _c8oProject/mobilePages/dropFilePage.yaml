                      '		try {
                      //			console.log(page.local.navParams.data);
                      			let docs = page.local.navParams.data.docs.map((node) => { 
                      				return {
                      					_id: node.data.value,
                      					editing_rights: page.local.editing_rights,
                      					formulas: page.local.formulas_rights,
                      					nocode_db_rights: page.local.nocode_db_rights, 
                      					admin: page.local.admin,
                      					admin_readonly: page.local.admin_readonly,
                      					publication: page.local.publication
                      				}
                      			});
                      			docs = docs.filter((doc) => doc._id != "all_users");
                      //			console.log(docs);
                      			var args: any;
                      			if (!page.local.editing_rights && !page.local.nocode_db_rights && !page.local.admin && !page.local.admin_readonly && !page.local.publication) {
                      				docs = docs.map((x)=>{
                      					x._deleted = true;
                      					return x;
                      				});
                      				args = {docs: JSON.stringify(docs)};
                      				args = {...args, "right": "editing_rights", "value": false};
                      				let data = await page.c8o.callJsonObject("C8Oforms.admin_group_upsert_bulk", args).async();
                      				if (data?.result?.success) {				
                      					await page.presentToast(page.translate.instant("updated_with_success"), ''toastSuccess'');
                      					return true;
                      				} else {
                      					await page.presentToast(page.translate.instant("an_error_occured"), ''toastError'');
                      					return false;
                      				}
                      			}
                      			args = {docs: JSON.stringify(docs)};
                      			var sequence = "C8Oforms.admin_group_upsert_bulk";
                      			let local = [
                      				"editing_rights",
                      				"formulas_rights",
                      				"nocode_db_rights",
                      				"admin",
                      				"admin_readonly",
                      				"publication"
                      			];
                      			let right;
                      			let value;
                      			let updated;
                      			for (let i = 0; i < 4; i++) {
                      				value = page.local[local[i]];
                      				right = local[i];
                      				args = {...args, "right": right, "value": value};
                      //				console.log(args);
                      				updated = await this.c8o.callJsonObject(sequence, args).async();
                      			}
                      			if (updated?.result?.success) {				
                      				await page.presentToast(page.translate.instant("updated_with_success"), ''toastSuccess'');
                      				return true;
                      			} else {
                      				await page.presentToast(page.translate.instant("an_error_occured"), ''toastError'');
                      				return false;
                      			}
                      
                      		} catch (e) {
                      			console.error(e);
                      			await page.presentToast(page.translate.instant("an_error_occured"), ''toastError'');
                      			return false;
                      		}
                      '
