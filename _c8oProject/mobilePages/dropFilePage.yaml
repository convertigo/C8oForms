                      					meta = {_id: page.local.name, editing_rights: page.local.editing_rights, formulas: page.local.formulas_rights, nocode_db_rights: page.local.nocode_db_rights, admin: page.local.admin, admin_readonly: page.local.admin_readonly, publication:page.local.publication };
                      					data = await page.c8o.callJsonObject("C8Oforms.admin_group_upsert", {meta: JSON.stringify(meta)}).async();
                      				}
