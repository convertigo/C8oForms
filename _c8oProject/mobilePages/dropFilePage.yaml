                  →: |
                    '		try {
                    			if (page.import) {
                    				for (let elem of page.files) {
                    					try {
                    						const reader = new FileReader();
                    						// This fires after the blob has been read/loaded.
                    						reader.addEventListener(''loadend'', async (e) => {
                    							let text = e.srcElement["result"];
                    							let form = JSON.parse(text);
                    							form["fromImport"] = true;
                    							delete form._id;
                    							delete form._attachments;
                    							delete form.creator;
                    							// remove collabs and shared people
                    							form["collabs"] = [];
                    							form["collabsResponse"] = [];
                    							form["shared"] = [];
                    							form["c8oGrp"] = {};
                    							delete form.c8o_view_type_published_form;
                    
                    							if (form.wallpaper && form.wallpaper.enabled == true && form.wallpaper.type && form.wallpaper.type != "color" && form.wallpaper.b64 === undefined) {
                    								form.wallpaper.enabled = false;
                    							}
                    							if (form.thumbnail && form.thumbnail.enabled == true && form.thumbnail.type && form.thumbnail.type != "color" && form.thumbnail.b64 === undefined) {
                    								form.thumbnail.enabled = false;
                    							}
                    							let arrayAttachments: Array<any> = [];
                    							arrayAttachments.push({key: "wallpaper", value: "" + (form.wallpaper?.b64 ?? "")});
                    							delete form.wallpaper?.b64;
                    							arrayAttachments.push({key: "thumbnail", value:"" + (form.thumbnail?.b64 ?? "")});
                    							delete form.thumbnail?.b64;
                    							let __importAttachments = form.__importAttachments;
                    							delete form.__importAttachments;
                    							let params: any = { meta: JSON.stringify(form) };
                    							let res = (await page.c8o.callJsonObject("C8Oforms.APIV2_updateFormulaireDocument", params).async()).res;
                    							for(let elem of arrayAttachments){
                    								try{
                    									let key = elem.key;
                    									let b64 = elem.value;
                    									if(b64 != null && b64 != ""){
                    										// b64 to blob
                    										let byteString = atob(b64.split('','')[1]);
                    										let mimeString = b64.split('','')[0].split('':'')[1].split('';'')[0];
                    										let ab = new ArrayBuffer(byteString.length);
                    										let ia = new Uint8Array(ab);
                    										for (let i = 0; i < byteString.length; i++) {
                    											ia[i] = byteString.charCodeAt(i);
                    										}
                    										let blob = new Blob([ab], { type: mimeString });
                    										// submit attachment
                    										let params = {file: blob, meta: JSON.stringify({"_id": "" + res.id, _up_content_type: mimeString, ["_up_"+key]: true})};
                    										await page.c8o.callJsonObject("C8Oforms.APIV2_updateFormulaireDocument", params).async();
                    									}
                    									
                    								}
                    								catch(e){
                    									console.error("An error occured while trying to import attachement", e);
                    								}
                    							}
                    							if(__importAttachments != undefined){
                    								for(let attach in __importAttachments){
                    									try{
                    										let key = attach;
                    										let b64 = __importAttachments[key];
                    										// b64 to blob
                    										let byteString = atob(b64.split('','')[1]);
                    										let mimeString = b64.split('','')[0].split('':'')[1].split('';'')[0];
                    										let ab = new ArrayBuffer(byteString.length);
                    										let ia = new Uint8Array(ab);
                    										for (let i = 0; i < byteString.length; i++) {
                    											ia[i] = byteString.charCodeAt(i);
                    										}
                    										let blob = new Blob([ab], { type: mimeString });
                    										// submit attachment
                    										let params = {file: blob, meta: JSON.stringify({"_id": "" + res.id, _up_content_type: mimeString, _up_any_file: true, _up_name: key})};
                    										await page.c8o.callJsonObject("C8Oforms.APIV2_updateFormulaireDocument", params).async();
                    									}
                    									catch(e){
                    										console.error("An error occured while trying to import attachement", e);
                    									}
                    								}
                    							}
                    							
                    						})
                    						reader.readAsText(elem);
                    					}
                    					catch (e) {
                    						console.error("err", e)
                    					}
                    				}
                    			}
                    			else if (page.pwa){
                                    this.global["pwafile"] = page.files.slice(0);
                                        
                                }
                    		    else if (page.barcode){
                    		        page.global["barcoderesult"] = page.files.slice(0);
                    		    }
                    		    else{
                    		        page.global[page.id][page.idItem] = this.global[page.id][page.idItem].concat(page.files.slice(0));    
                    		    }
                    
                    		} catch (e) {
                    			console.error("err", e)
                    
                    		} finally {
                    			return;
                    		}
                    '
