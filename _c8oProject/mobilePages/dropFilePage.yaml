        ↓Event [ngx.components.UIControlEvent-1658764714727]: 
          ↓ImportFormHttp [ngx.components.UICustomAsyncAction-1699372417400]: 
            actionValue: 
              - xmlizable: 
                - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
                - com.twinsoft.convertigo.beans.common.FormatedContent: 
                  →: |
                    '		try {
                    			if (page.import) {
                    				const alertController = page.getInstance(AlertController);
                    				const toastController = page.getInstance(ToastController);
                    				const locale = page.translate.currentLang || page.translate.getBrowserLang() || "en";
                    
                    				const unwrap = (output: any): any => {
                    					let payload = output;
                    					if (payload != null && payload.sequence != null && payload.sequence.document != null) {
                    						payload = payload.sequence.document;
                    					}
                    					if (payload != null && payload.document != null) {
                    						payload = payload.document;
                    					}
                    					for (let i = 0; i < 4 && payload != null && payload.res != null; i++) {
                    						payload = payload.res;
                    					}
                    					return payload || {};
                    				};
                    
                    				const callImport = async (operation: string, payload: string = "", target: any = null): Promise<any> => {
                    					const params: any = {
                    						operation,
                    						importPayload: payload,
                    						targetApplicationId: target != null ? target.applicationId : "",
                    						expectedRev: target != null ? target.rev : "",
                    						operationId: "import-" + new Date().getTime() + "-" + Math.random().toString(36).slice(2),
                    						locale
                    					};
                    					return unwrap(await page.c8o.callJsonObject("C8Oforms.APIV2_ImportApplication", params).async());
                    				};
                    
                    				const notify = async (key: string, params: any = {}, error: boolean = false): Promise<void> => {
                    					const toast = await toastController.create({
                    						message: page.translate.instant(key, params),
                    						position: "bottom",
                    						cssClass: error ? "toastError" : "toastSuccess",
                    						duration: 4500,
                    						buttons: [{
                    							text: page.translate.instant("close"),
                    							role: "cancel"
                    						}]
                    					});
                    					await toast.present();
                    				};
                    
                    				const readText = async (file: any): Promise<string> => {
                    					if (file != null && typeof file.text === "function") {
                    						return await file.text();
                    					}
                    					return await new Promise<string>((resolve, reject) => {
                    						const reader = new FileReader();
                    						reader.onload = () => resolve("" + reader.result);
                    						reader.onerror = () => reject(reader.error || new Error("invalid_file"));
                    						reader.readAsText(file);
                    					});
                    				};
                    
                    				const chooseMode = async (validation: any): Promise<string | null> => {
                    					let sourceMessage = "";
                    					if (validation.sourceApplicationName) {
                    						sourceMessage = page.translate.instant("source_application") + ": " + validation.sourceApplicationName;
                    					}
                    					const alert = await alertController.create({
                    						header: page.translate.instant("import_application"),
                    						subHeader: page.translate.instant("import_application_choice"),
                    						message: sourceMessage,
                    						inputs: [
                    							{
                    								type: "radio",
                    								label: page.translate.instant("import_as_new_application"),
                    								value: "copy",
                    								checked: true
                    							},
                    							{
                    								type: "radio",
                    								label: page.translate.instant("restore_into_existing_application"),
                    								value: "restore",
                    								checked: false
                    							}
                    						],
                    						buttons: [
                    							{
                    								text: page.translate.instant("import_cancel"),
                    								role: "cancel"
                    							},
                    							{
                    								text: page.translate.instant("import_continue"),
                    								role: "confirm"
                    							}
                    						]
                    					});
                    					await alert.present();
                    					const dismissed: any = await alert.onDidDismiss();
                    					if (dismissed.role !== "confirm") {
                    						return null;
                    					}
                    					const value = dismissed.data != null && dismissed.data.values != null ?
                    						dismissed.data.values : dismissed.data;
                    					return value === "restore" ? "restore" : "copy";
                    				};
                    
                    				const chooseTarget = async (validation: any): Promise<any | null> => {
                    					const response = await callImport("list");
                    					if (response.status !== "ok" || !Array.isArray(response.items) || response.items.length === 0) {
                    						await notify("import_no_writable_application", {}, true);
                    						return null;
                    					}
                    					const alert = await alertController.create({
                    						header: page.translate.instant("select_application_to_restore"),
                    						message: page.translate.instant("source_application") + ": " + (validation.sourceApplicationName || ""),
                    						inputs: response.items.map((item: any) => ({
                    							type: "radio",
                    							label: (validation.sourceApplicationId === item.applicationId ? "★ " : "") + item.name,
                    							value: item.applicationId,
                    							checked: false
                    						})),
                    						buttons: [
                    							{
                    								text: page.translate.instant("import_cancel"),
                    								role: "cancel"
                    							},
                    							{
                    								text: page.translate.instant("import_continue"),
                    								role: "confirm"
                    							}
                    						]
                    					});
                    					await alert.present();
                    					const dismissed: any = await alert.onDidDismiss();
                    					if (dismissed.role !== "confirm") {
                    						return null;
                    					}
                    					const selectedId = dismissed.data != null && dismissed.data.values != null ?
                    						dismissed.data.values : dismissed.data;
                    					return response.items.find((item: any) => item.applicationId === selectedId) || null;
                    				};
                    
                    				const confirmRestore = async (target: any): Promise<boolean> => {
                    					const alert = await alertController.create({
                    						header: page.translate.instant("restore_import_confirm_title"),
                    						message: page.translate.instant("restore_import_confirm_message", {name: target.name}),
                    						cssClass: "styleAlertHeight",
                    						buttons: [
                    							{
                    								text: page.translate.instant("import_cancel"),
                    								role: "cancel"
                    							},
                    							{
                    								text: page.translate.instant("confirm_restore"),
                    								role: "confirm"
                    							}
                    						]
                    					});
                    					await alert.present();
                    					const dismissed: any = await alert.onDidDismiss();
                    					return dismissed.role === "confirm";
                    				};
                    
                    				let lastResult: any = {cancelled: true};
                    				for (const file of page.files.slice(0, 1)) {
                    					let text: string;
                    					try {
                    						text = await readText(file);
                    					}
                    					catch (readError) {
                    						await notify("import_validation_failed", {}, true);
                    						return {status: "invalid_file"};
                    					}
                    
                    					const validation = await callImport("validate", text);
                    					if (validation.status !== "ok") {
                    						const key = validation.error === "migration_required" ?
                    							"import_unsupported_version" :
                    							(validation.error === "invalid_attachment" ? "import_invalid_attachment" : "import_validation_failed");
                    						await notify(key, {}, true);
                    						return validation;
                    					}
                    
                    					const mode = await chooseMode(validation);
                    					if (mode == null) {
                    						return {cancelled: true};
                    					}
                    
                    					if (mode === "copy") {
                    						const result = await callImport("copy", text);
                    						if (result.status !== "ok") {
                    							const key = result.error === "migration_required" ?
                    								"import_unsupported_version" :
                    								(result.error === "invalid_attachment" ? "import_invalid_attachment" : "import_failed");
                    							await notify(key, {}, true);
                    							return result;
                    						}
                    						await notify("import_success", {name: result.name || validation.sourceApplicationName});
                    						lastResult = result;
                    					}
                    					else {
                    						const target = await chooseTarget(validation);
                    						if (target == null) {
                    							return {cancelled: true};
                    						}
                    						if (!(await confirmRestore(target))) {
                    							return {cancelled: true};
                    						}
                    						const result = await callImport("restore", text, target);
                    						if (result.status !== "ok") {
                    							const key = result.error === "revision_conflict" ?
                    								"import_restore_conflict" :
                    								(result.error === "migration_required" ? "import_unsupported_version" :
                    								(result.error === "invalid_attachment" ? "import_invalid_attachment" : "import_failed"));
                    							await notify(key, {}, true);
                    							return result;
                    						}
                    						await notify("restore_import_success", {name: target.name});
                    						lastResult = result;
                    					}
                    				}
                    				page.local.importResult = lastResult;
                    				return lastResult;
                    			}
                    			else if (page.pwa) {
                    				this.global["pwafile"] = page.files.slice(0);
                    			}
                    			else if (page.barcode) {
                    				page.global["barcoderesult"] = page.files.slice(0);
                    			}
                    			else {
                    				page.global[page.id][page.idItem] = this.global[page.id][page.idItem].concat(page.files.slice(0));
                    			}
                    		}
                    		catch (e) {
                    			console.error("Import application failed", e);
                    			if (page.import) {
                    				try {
                    					await page.showToast("import_failed", []);
                    				}
                    				catch (ignore) {
                    				}
                    			}
                    			return {status: "import_failed"};
                    		}
                    		return;
                    '
