                        					else{
                        						error = true;
                        					}
                        				}
                        				else{
                        					close = false;
                        				}
                        				
                        			}
                        			else{
                        				close = false;
                        				page.presentToast(page.translate.instant("select_user_toast"), "toastWarn", "bottom", 3000, true);
                        			}
                        //			
                        		} catch (e) {
                        			error = true;
                        			console.log("an error occured while calling APIV2_setOwnerShip", e);
                        		} finally {
                        			if(error === true){
                        				//toastError
                        				page.presentToast(page.translate.instant("error_transfer", {user: (this.local.usersChoosen?.[0]?.display ?? "")}), "toastError", "bottom", 5000, true);
                        			}
                        			return close;
                        		}
