              '		try {
              			let resp: any = vars.resp;
              			if(resp.BrevoConversationsID != null && resp.BrevoConversationsID != "" && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) == false){
              				let router = page.getInstance(Router);
              				let conditional = ()=>{
              					return location.pathname?.split("/")?.[5] != "pwas" && router.url.startsWith("viewer") == false;
              				}
              				let initBrevo = ()=>{
              					if(!this.global.__brevonintialized){
              						((d, w, c) => {
              						  // Définir l''ID BrevoConversations
              						  w["BrevoConversationsID"] = resp.BrevoConversationsID;
              						  
              						  // Initialiser la fonction de BrevoConversations
              						  w[c] = w[c] || function() { 
              						    (w[c].q = w[c].q || []).push(arguments); 
              						  };
              						  
              						  // Créer le script dynamiquement
              						  var s = d.createElement(''script'');
              						  s.async = true;
              						  s.src = ''https://conversations-widget.brevo.com/brevo-conversations.js'';
              						  
              						  // Ajouter le script au head
              						  if (d.head) {
              						    d.head.appendChild(s);
              						  }
              						})(document, window, ''BrevoConversations'');
              						this.global.__brevonintialized = true;
              					}
              				}
              				let showBrevo = ()=>{
              					try{
              						document.getElementById("brevo-conversations").style.display = "block";
              					}
              					catch (e) {
              
              					}
              				}
              				let hideBrevo = ()=>{
              					try{
              						document.getElementById("brevo-conversations").style.display = "none";
              					}
              					catch (e) {
              						
              					}
              				}
              				router.events
              			    .pipe(filter(event => event instanceof NavigationEnd))
              			    .subscribe((event: NavigationEnd) => {
              					if (conditional()) {
              						initBrevo();
              						showBrevo();
              					} else {
              						hideBrevo();
              					}
              			    });
              			    // init
              				if (conditional()) {
              					initBrevo();
              				}
              				
              			}
              				
              		} catch (e) {
              		
              		}
              '
