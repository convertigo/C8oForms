        	public async checkBrowserSupport() {
        		//define global object to pop restrictions with unsupported browsers
        		if (this.global.__reserved_c8o_settings == undefined) {
        			this.global.__reserved_c8o_settings = {}
        		}
        
        		// START check Internet explorer support
        
        		// if Internet explorer hasn''t been checked before check it
        		if (this.global.__reserved_c8o_settings["notsupported"] == undefined) {
        			//check that browser is not Internet explorer 
        			var ua = window.navigator.userAgent;
        			var isIE = /MSIE|Trident/.test(ua);
        			// if its Internet explorer show an alert with an error message 
        			if (isIE) {
        				this.global.__reserved_c8o_settings["notsupported"] = true;
        				this.local["notsupported"] = true;
        				let res = await this.get_not_supported_translations();
        				window.alert(res);
        				return !this.global.__reserved_c8o_settings["notsupported"];
        			}
        			else {
        				this.global.__reserved_c8o_settings["notsupported"] = false;
        
        			}
        		}
        		// if we already detected Internet Explorer show an alert with an error message 
        		else if (this.global.__reserved_c8o_settings["notsupported"] == true) {
        			this.local["notsupported"] = true;
        			let res = await this.get_not_supported_translations();
        			window.alert(res);
        			return !this.global.__reserved_c8o_settings["notsupported"];
        		}
        
        		// END check Internet explorer support
        
        		// START check IndexedDB support
        
        		// if IndexedDB hasn''t been checked before check it
        		if (this.global.__reserved_c8o_settings["IndexedDBnotsupported"] == undefined) {
        			let testIndexedDB = async () => {
        				const request = window["indexedDB"]["open"]("MyTestDatabase", 3);
        				request.onsuccess = () => {
        					this.global.__reserved_c8o_settings["IndexedDBnotsupported"] = false;
        					return !this.global.__reserved_c8o_settings["IndexedDBnotsupported"];
        				};
        				request.onerror = async (event) => {
        					this.global.__reserved_c8o_settings["IndexedDBnotsupported"] = true;
        					this.local["notsupported"] = true;
        					let res = await this.get_not_supported_translations();
        					window.alert(res);
        					return !this.global.__reserved_c8o_settings["IndexedDBnotsupported"];
        				};
        			};
        			let resultTestIndexedDB: any = await testIndexedDB();
        			if (resultTestIndexedDB == false) {
        				return resultTestIndexedDB;
        			}
        		}
        		else if (this.global.__reserved_c8o_settings["IndexedDBnotsupported"] == true) {
        			this.local["notsupported"] = true;
        			let res = await this.get_not_supported_translations();
        			window.alert(res);
        			return !this.global.__reserved_c8o_settings["IndexedDBnotsupported"];
        		}
        	}
