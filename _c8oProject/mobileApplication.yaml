componentScriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_AppImport*/
        import { C8oFullSyncChangeListener, C8oLocalCache, Priority, C8oSessionStatus } from "c8osdkangular";
        import { APP_BASE_HREF } from ''@angular/common'';
        import { VersionEvent } from ''@angular/service-worker'';
        import { environment } from ''src/environments/environment'';
        import { ApplicationRef } from ''@angular/core'';
        import { interval, fromEvent } from ''rxjs'';
        import { first } from ''rxjs/operators'';
        /*End_c8o_AppImport*/
        /*Begin_c8o_AppDeclaration*/
        	// --- helpers persistance du flag "pending update" ---
        	public PENDING_KEY = ''pwa.pendingUpdateVersion'';
        	public PENDING_AT = ''pwa.pendingAt'';
        	/*End_c8o_AppDeclaration*/
        /*Begin_c8o_AppSettings*/
        		// get preference log level from local storage
        		let logLevel: any = this.getStoredLogLevel();
        		// enable database prefix, and worker usage for pouchdb fullsync
        		settings.setEnablePrefixBase(true)
        			.setUseWorker(true)
        			.setLogLevelLocal(logLevel)
        			.setForceFormData(true);
        		//.setLogLevelLocal(C8oLogLevel[logLevel]);
        		// monitor PWA updates
        		this.monitorPwaUpdates();
        		// set some globals vars
        		this.initializeGlobals();
        		this.global.isMenuOpen = (window.innerWidth > 1140) ? true : false
        		/*End_c8o_AppSettings*/
        /*Begin_c8o_AppConstructor*/
        		this.getOriginImg();
        		/*End_c8o_AppConstructor*/
        /*Begin_c8o_AppInitialization*/
        
        
        
        
        				// configure pwa behavior
        				this.configurePWA();
        				// set log to true
        				this.c8o.logC8o = true;
        				// configure language pref and fix chrome''s translate issue
        				this.configureLang();
        				// get and set platform informations
        				this.definePlatformInfos(platform);
        				// reveal scrollbars only while interacting with scrollable areas
        				this.initScrollbarVisibility();
        				// set GDRP structure
        				this.defineGdrp(translate);
        				/** monitor session changes */
        				//this.monitorSessions();
        				/** In dev mode only set version from i18n */
        				this.monitorDEVPwaUpdates();
        				/*End_c8o_AppInitialization*/
        /*Begin_c8o_AppFunction*/
        	public getOriginImg() {
        		//compute origin for imgs
        		if (!environment.production) {
        			this.global.originIMG = ''http://localhost:18080'';
        		}
        		else {
        			this.global.originIMG = window.location.origin;
        		}
        	}
        
        	/** Init some globals var */
        	public initializeGlobals() {
        		this.global["platform"] = { "name": [""] };
        		this.global[''visibleoptions''] = [];
        		if (this.global["settings"] == undefined) {
        			this.global["settings"] = { "editing_rights": false };
        		}
        		else {
        			this.global["settings"]["editing_rights"] = false;
        		}
        		// helper to allow changing language from menus
        		window["__c8o__translate"] = this.translate;
        		this.global.since = "" + new Date().getTime();
        	}
        
        	/** retrive local store user preferences about logging */
        	public getStoredLogLevel(): string {
        		let localStorage = window.localStorage.getItem("c8oforms_log_level");
        		let val = (localStorage != undefined && localStorage != '''' ? localStorage : ''WARN'');
        		return C8oLogLevel[val];
        	}
        
        	/** get and set platform informations */
        	public definePlatformInfos(platform) {
        		this.global["platform"] = {};
        		this.global["platform"]["width"] = platform.width();
        		this.global["platform"]["info"] = platform.platforms();
        		this.global["platform"]["name"] = [""]
        		this.global.platform.name = {};
        		const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(window.navigator.userAgent);
        		if (isMobile) {
        			if (platform.platforms()[0] == "android" || platform.platforms()[0] == "cordova" || platform.platforms()[0] == "mobile" || platform.platforms()[0] == "ios") {
        				this.global["platform"]["name"][0] = "mobile";
        				this.global["mobilePlat"] = true;
        			}
        		}
        
        		platform.resize.subscribe((ev) => {
        			this.global["platform"]["width"] = window.innerWidth;
        			this.global["platform"]["info"] = platform.platforms();
        			const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(window.navigator.userAgent);
        			if (isMobile) {
        				if (platform.platforms()[0] == "android" || platform.platforms()[0] == "cordova" || platform.platforms()[0] == "mobile" || platform.platforms()[0] == "ios") {
        					this.global["platform"]["name"][0] = "mobile";
        					this.global["mobilePlat"] = true;
        				}
        			}
        			this.ref.detectChanges();
        		});
        	}
        
        	public initScrollbarVisibility() {
        		if (window["__c8oScrollbarVisibilityInit"]) {
        			return;
        		}
        		window["__c8oScrollbarVisibilityInit"] = true;
        		let hoverTarget: any = null;
        		const getScrollTarget = (target: any) => {
        			if (target instanceof HTMLElement) {
        				return target;
        			}
        			return document.scrollingElement || document.documentElement;
        		};
        		const getScrollableTarget = (target: any) => {
        			let current = target instanceof HTMLElement ? target : null;
        			while (current != null) {
        				if (current.scrollHeight > current.clientHeight + 1 || current.scrollWidth > current.clientWidth + 1) {
        					return current;
        				}
        				current = current.parentElement;
        			}
        			const root: any = document.scrollingElement || document.documentElement;
        			return root?.scrollHeight > root?.clientHeight + 1 ? root : null;
        		};
        		const setHoverTarget = (target: any) => {
        			if (hoverTarget === target) {
        				return;
        			}
        			if (hoverTarget?.classList != undefined) {
        				hoverTarget.classList.remove("scrollbar-hover");
        			}
        			hoverTarget = target;
        			if (hoverTarget?.classList != undefined) {
        				hoverTarget.classList.add("scrollbar-hover");
        			}
        		};
        		window.addEventListener("scroll", (event: any) => {
        			const scrollTarget: any = getScrollTarget(event?.target);
        			if (scrollTarget?.classList == undefined) {
        				return;
        			}
        			scrollTarget.classList.add("scrollbar-active");
        			if (scrollTarget.__c8oScrollbarTimer != undefined) {
        				window.clearTimeout(scrollTarget.__c8oScrollbarTimer);
        			}
        			scrollTarget.__c8oScrollbarTimer = window.setTimeout(() => {
        				scrollTarget.classList.remove("scrollbar-active");
        			}, 700);
        		}, true);
        		window.addEventListener("pointermove", (event: any) => {
        			const scrollTarget: any = getScrollableTarget(event?.target);
        			if (scrollTarget == null) {
        				setHoverTarget(null);
        				return;
        			}
        			const rect = scrollTarget.getBoundingClientRect();
        			const gutterSize = 12;
        			const hasVerticalScrollbar = scrollTarget.scrollHeight > scrollTarget.clientHeight + 1;
        			const hasHorizontalScrollbar = scrollTarget.scrollWidth > scrollTarget.clientWidth + 1;
        			const isOnVerticalScrollbar = hasVerticalScrollbar && event.clientX >= rect.right - gutterSize && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
        			const isOnHorizontalScrollbar = hasHorizontalScrollbar && event.clientY >= rect.bottom - gutterSize && event.clientY <= rect.bottom && event.clientX >= rect.left && event.clientX <= rect.right;
        			setHoverTarget(isOnVerticalScrollbar || isOnHorizontalScrollbar ? scrollTarget : null);
        		}, true);
        		window.addEventListener("pointerleave", () => {
        			setHoverTarget(null);
        		}, true);
        	}
        
        	/** Determine and configure pwa behavior */
        	public configurePWA() {
        		// determine if we are in pwa mode or not
        		let indexPWA = window.location.pathname.indexOf("pwas");
        		let indexMobile = window.location.pathname.indexOf("mobile");
        		// if we started in standalone pwa mode
        		if (indexPWA != -1 && indexMobile == -1) {
        			// get url base
        			this.global.pwa = true;
        			const baseUrl = window.location.origin + this.getInstance(APP_BASE_HREF);
        			this.global.pwaGet = this.c8o.httpPublic.get(baseUrl + "manifest.webmanifest");
        			let standalonePwa = baseUrl.split("/")[baseUrl.split("/").indexOf("pwas") + 1];
        			this.global.standalonePwa = standalonePwa;
        			// try to get manifest.webmanifest to detdermine themes
        			this.global.pwaGet
        				.subscribe(
        					response => {
        						if (response["theme_color"] != undefined) {
        							this.statusBar.backgroundColorByHexString(response["theme_color"]);
        							this.global.pwaThemeColor = response["theme_color"];
        						}
        						else {
        							this.statusBar.backgroundColorByHexString("#0cbbe7");
        						}
        
        					},
        					error => {
        						this.statusBar.backgroundColorByHexString("#0cbbe7");
        					})
        		}
        		// if we started in no-code studio mode
        		else {
        			this.global.standalonePwa = null;
        			this.statusBar.backgroundColorByHexString("#0cbbe7");
        		}
        	}
        
        	/** configure language pref and fix chrome''s translate issue */
        	public configureLang() {
        		// get logs preference from local storage
        		let localLang = window.localStorage.getItem("lang");
        		if (localLang != undefined && localLang != "undefined") {
        			this.translate.setDefaultLang(localLang);
        			this.translate.use(localLang);
        		}
        		else {
        			try {
        				let navLang = navigator.language;
        				if (navLang.indexOf("fr") == 0) {
        					localLang = "fr";
        					this.translate.setDefaultLang(''fr'');
        				}
        				else if (navLang.indexOf("en") == 0) {
        					localLang = "en";
        					this.translate.setDefaultLang(''en'');
        				}
        				else if (navLang.indexOf("es") == 0) {
        					localLang = "es";
        					this.translate.setDefaultLang(''es'');
        				}
        				else {
        					localLang = "en";
        					this.translate.setDefaultLang(''en'');
        				}
        
        			}
        			catch (e) {
        				localLang = "en";
        				this.translate.setDefaultLang(''en'');
        			}
        			this.global["__secretL"] = localLang;
        		}
        		// Fix Chrome''s translate issue and add meta tags
        		window.document.getElementsByTagName("html")[0].setAttribute("lang", localLang);
        
        		// Add meta tags for language and charset
        		let metaLanguage = document.createElement(''meta'');
        		metaLanguage.setAttribute(''http-equiv'', ''Content-Language'');
        		metaLanguage.setAttribute(''content'', localLang);
        		document.getElementsByTagName(''head'')[0].appendChild(metaLanguage);
        
        		let metaCharset = document.createElement(''meta'');
        		metaCharset.setAttribute(''charset'', ''UTF-8'');
        		document.getElementsByTagName(''head'')[0].appendChild(metaCharset);
        
        		this.translate.onLangChange.subscribe((e) => {
        			window.document.getElementsByTagName("html")[0].setAttribute("lang", e.lang);
        
        			// Update meta language tag when language changes
        			metaLanguage.setAttribute(''content'', e.lang);
        		});
        
        		if (Object.keys(this.global.settings).length <= 1) {
        			this.global.settings["language"] = localLang;
        		}
        	}
        
        	/** set gdrp structure */
        	public async defineGdrp(translate) {
        		class gdrp {
        			private _text: string = "";
        			private translate: any;
        			constructor(translate: any) {
        				this.translate = translate;
        			}
        			get text(): string {
        				try {
        					let parsed = JSON.parse(this._text);
        					if (parsed[this.translate.currentLang] === undefined) {
        						return this._text;
        					}
        					return parsed[this.translate.currentLang];
        				}
        				catch (e) {
        					return this._text;
        				}
        			}
        			set text(value: string) {
        				this._text = value;
        			}
        		}
        		try {
        			let resp = await this.c8o.callJsonObject("C8Oforms.getGDRPmenu",{["lang"]:translate.currentLang, [C8oLocalCache.PARAM]: new C8oLocalCache(Priority.SERVER, 99999999999999999999)}).async();
        			if (resp.ok == "true") {
        				this.global.c8oGDRPmenu = new gdrp(translate);
        				this.global.c8oGDRPmenu.text = resp.text;
        			}
        			else {
        				this.global.c8oGDRPmenu = null;
        			}
        		}
        		catch (e) {
        			// silent error
        			console.error(e);
        		}
        		try {
        			let resp = await this.c8o.callJsonObject("C8Oforms.getGDRPtoast",{["lang"]:translate.currentLang, ["type"]: "builders", [C8oLocalCache.PARAM]: new C8oLocalCache(Priority.SERVER, 99999999999999999999)}).async()
        			if (resp.ok == "true") {
        				this.global.c8oGDRPtoast = new gdrp(translate);
        				this.global.c8oGDRPtoast.text = resp.text;
        			}
        			else {
        				this.global.c8oGDRPtoast = null;
        			}
        		}
        		catch (e) {
        			// silent error
        			console.error(e);
        		}
        //		debugger;
        	}
        
        	/** monitor dev PWA updates */
        	public async monitorDEVPwaUpdates() {
        		let updates: SwUpdate = this.getInstance(SwUpdate);
        		// if running in dev mode
        		if (!updates.isEnabled) {
        			// dev mode
        			let v = await this.translate.get(''version_c8o'').toPromise();
        			this.global.app = { state: 1, currentVersion: v, latestVersion: null };
        		}
        	}
        	// imports à ajouter en haut de ton app.component.ts :
        	/*
        	import { ApplicationRef } from ''@angular/core'';
        	import { SwUpdate, VersionEvent } from ''@angular/service-worker'';
        	import { interval, fromEvent } from ''rxjs'';
        	import { first } from ''rxjs/operators'';
        	*/
        
        
        
        	public setPending(v: string | null) {
        		if (v) {
        			localStorage.setItem(this.PENDING_KEY, v);
        			localStorage.setItem(this.PENDING_AT, String(Date.now()));
        		} else {
        			localStorage.removeItem(this.PENDING_KEY);
        			localStorage.removeItem(this.PENDING_AT);
        		}
        	}
        	public getPending(): { v: string | null; at: number | null } {
        		return {
        			v: localStorage.getItem(this.PENDING_KEY),
        			at: Number(localStorage.getItem(this.PENDING_AT) || '''') || null
        		};
        	}
        
        	public async monitorPwaUpdates() {
        		
        		const updates: SwUpdate = this.getInstance(SwUpdate);
        		const appRef: ApplicationRef = this.getInstance(ApplicationRef);
        		const toastCtrl: ToastController = this.getInstance(ToastController);
        		const alertCtrl: AlertController = this.getInstance(AlertController);
        
        		this.global.app = { state: 0, currentVersion: null, latestVersion: null };
        
        
        
        		let _res!: () => void;
        		const _appPromise = new Promise<void>((res) => (_res = res));
        		this.global._appPromise = () => _appPromise;
        
        		// flag runtime + persistant
        		let pendingUpdateVersion: string | null = this.getPending().v;
        
        		// petite utilité: vérifier proprement les updates
        		const checkNow = () => updates.checkForUpdate().catch(() => { });
        
        		if (updates.isEnabled) {
        			// --- FAST-PATH démarrage : cas "rechargement forcé" + SW en attente ---
        			try {
        				const nav = (performance.getEntriesByType?.(''navigation'')?.[0] as PerformanceNavigationTiming | undefined);
        				const isReload = nav?.type === ''reload''; // inclut Ctrl+Maj+R/F5 fort
        				const reg = await navigator.serviceWorker?.getRegistration?.();
        
        				if (reg?.waiting) {
        					// Si reload forcé, on active et on recharge automatiquement pour éviter l''impression de "pas à jour"
        					if (isReload) {
        						this.c8o.log.debug(''Startup: hard reload & waiting SW → activateUpdate() + reload'');
        						try { await updates.activateUpdate(); } catch { }
        						pendingUpdateVersion = null; this.setPending(null);
        						location.reload();
        						return; // la page va se recharger
        					} else {
        						// Sinon, on restaure l''état READY (3) et on repropose le toast
        						this.global.app.state = 3;
        						this.global.app.latestVersion = pendingUpdateVersion;
        						this.c8o.log.debug(`Resume: found waiting ServiceWorker, pending=${pendingUpdateVersion || ''unknown''}`);
        						this.ref.detectChanges();
        
        						const alert = await alertCtrl.create({
        							header: this.translate.instant(''toastUpdateReady'', { version: String(pendingUpdateVersion ?? '''') }),
        							buttons: [{
        								text: this.translate.instant(''restart_app_update''),
        								handler: async () => {
        									try { await updates.activateUpdate(); } catch { }
        									pendingUpdateVersion = null; this.setPending(null);
        									document.location.reload();
        								}
        							},
        							{
        								text: this.translate.instant(''restart_later''),
        								handler: async () => {
        
        								}
        							}],
        							cssClass: ''toastLikeAlert''
        						});
        
        						await alert.present();
        					}
        				} else if (pendingUpdateVersion) {
        					// pas de waiting mais flag stocké → probablement déjà à jour
        					this.c8o.log.debug(`Resume: no waiting SW but pending=${pendingUpdateVersion} → clearing pending`);
        					pendingUpdateVersion = null; this.setPending(null);
        				}
        			} catch { }
        
        			// --- Vérifs aux bons moments ---
        			appRef.isStable.pipe(first(Boolean)).subscribe(() => {
        				checkNow();                                // au démarrage (après stabilité app)
        				interval(15 * 60_000).subscribe(checkNow); // toutes les 15 min
        			});
        			fromEvent(document, ''visibilitychange'').subscribe(() => {
        				if (document.visibilityState === ''visible'') checkNow();
        			});
        			fromEvent(window, ''online'').subscribe(checkNow);
        
        			// --- Abonnement aux évènements SW (on garde ton state + logs) ---
        			updates.versionUpdates.subscribe(async (event: VersionEvent) => {
        				switch (event.type) {
        					case ''NO_NEW_VERSION_DETECTED'':
        						// ne pas écraser READY si une update est en attente
        						if (pendingUpdateVersion) {
        							this.c8o.log.debug(`IGNORE NO_NEW_VERSION_DETECTED (pending=${pendingUpdateVersion})`);
        							return;
        						}
        						this.global.app.currentVersion = event.version.appData[''version''];
        						this.global.app.state = 1;
        						this.c8o.log.debug(
        							`NO_NEW_VERSION_DETECTED for PWA: ${event.version.appData[''name'']}. current=${event.version.appData[''version'']}`
        						);
        						this.ref.detectChanges();
        						_res();
        						break;
        
        					case ''VERSION_DETECTED'':
        						this.global.app.currentVersion = event.version.appData[''version''];
        						this.global.app.state = 2;
        						this.c8o.log.debug(
        							`VERSION_DETECTED for PWA: ${event.version.appData[''name'']}. current=${event.version.appData[''version'']}`
        						);
        						this.ref.detectChanges();
        						_res();
        						break;
        
        					case ''VERSION_READY'': {
        						const currentV = (event as any).currentVersion?.appData?.[''version''];
        						const latestV = (event as any).latestVersion?.appData?.[''version''];
        						this.global.app.currentVersion = currentV;
        						this.global.app.latestVersion = latestV;
        						this.global.app.state = 3;
        
        						pendingUpdateVersion = latestV ?? ''unknown'';
        						this.setPending(pendingUpdateVersion);
        
        						this.c8o.log.debug(
        							`VERSION_READY for ${(event as any).currentVersion?.appData?.[''name'']} current=${currentV} new=${latestV}`
        						);
        
        						if (currentV === latestV) {
        							this.c8o.log.debug(''VERSION_READY but same version → will update at next reload'');
        							_res();
        						} else {
        							const alert = await alertCtrl.create({
        								header: this.translate.instant(''toastUpdateReady'', { version: String(latestV ?? '''') }),
        								buttons: [{
        									text: this.translate.instant(''restart_app_update''),
        									handler: async () => {
        										try { await updates.activateUpdate(); } catch { }
        										pendingUpdateVersion = null; this.setPending(null);
        										document.location.reload();
        									}
        								},
        								{
        									text: this.translate.instant(''restart_later''),
        									handler: async () => {
        
        									}
        								}],
        								cssClass: ''toastLikeAlert''
        							});
        
        							await alert.present();
        						}
        						this.ref.detectChanges();
        						break;
        					}
        
        					case ''VERSION_INSTALLATION_FAILED'':
        						this.global.app.currentVersion = event.version.appData[''version''];
        						this.global.app.state = 4;
        						pendingUpdateVersion = null; this.setPending(null);
        						this.c8o.log.debug(
        							`VERSION_INSTALLATION_FAILED for ${event.version.appData[''name'']} current=${event.version.appData[''version'']} error=${(event as any).error}`
        						);
        						this.ref.detectChanges();
        						_res();
        						break;
        				}
        			});
        
        			// --- Cas irrécouvrable → reload propre ---
        			updates.unrecoverable.subscribe((e) => {
        				this.c8o.log.debug(`SW unrecoverable: ${e.reason || ''''}`);
        				document.location.reload();
        			});
        
        			// --- Si un nouveau contrôleur SW prend la main, on nettoie (et on peut recharger) ---
        			if (navigator?.serviceWorker) {
        				navigator.serviceWorker.addEventListener(''controllerchange'', () => {
        					this.c8o.log.debug(''controllerchange → new SW active'');
        					pendingUpdateVersion = null; this.setPending(null);
        					// Recharge immédiat pour basculer sur la nouvelle version (dé-commente si tu veux auto)
        					// document.location.reload();
        				});
        			}
        		} else {
        			// dev mode
        			const v = await this.translate.get(''version_c8o'').toPromise();
        			this.global.app = { state: 1, currentVersion: v, latestVersion: null };
        			_res();
        		}
        	}
        
        
        
        	public purgeWrongKeys(data) {
        		for (let key in data) {
        			if (data[key] == undefined || data[key] == ":" + key || data[key] == "" || data[key] == "undefined") {
        				delete data[key];
        			}
        		}
        		return data;
        	}
        	// define a function to get erors messages
        	public async get_not_supported_translations() {
        		let res = await this.translate.get("brower_not_supported").toPromise();
        		// in case of translation file fails to load
        		if (res == "brower_not_supported") {
        			if (window.navigator.language.indexOf("fr") == 0) {
        				res = "Votre navigateur n''est pas supporté. Veuillez essayer Chrome, Firefox, Safari, ou Edge (>90)."
        			}
        			else if (window.navigator.language.indexOf("en") == 0) {
        				res = "Your browser is not supported. Please try Chrome, Firefox, Safari, or Edge (>90).";
        			}
