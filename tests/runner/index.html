<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C8oForms — test runner</title>
<style>
  :root { --bg:#0f1222; --panel:#171a2e; --panel2:#1f2340; --ink:#e7e9f3; --mut:#9aa0c0;
          --line:#2a2f52; --blue:#4f9eff; --green:#3ddc84; --red:#ff5a6a; --amber:#ffb547; }
  * { box-sizing:border-box; scrollbar-color:var(--line) #0a0c18; scrollbar-width:thin; }
  *::-webkit-scrollbar { width:10px; height:10px; }
  *::-webkit-scrollbar-track { background:#0a0c18; border-radius:999px; }
  *::-webkit-scrollbar-thumb { background:var(--line); border:2px solid #0a0c18; border-radius:999px; }
  *::-webkit-scrollbar-thumb:hover { background:#3a4270; }
  body { margin:0; height:100vh; overflow:hidden; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { flex:0 0 auto; padding:14px 20px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:12px; background:var(--bg); z-index:5; }
  .topbar { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center; }
  .brand { min-width:0; display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; }
  h1 { font-size:16px; margin:0; font-weight:700; }
  .ver { color:var(--mut); }
  .ver b { color:var(--ink); }
  .grid { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:minmax(420px,1fr) minmax(420px,1fr); gap:16px; padding:16px 20px; align-items:stretch; overflow:hidden; }
  @media (max-width:980px){ body{ height:auto; overflow:auto; } .grid{ grid-template-columns:1fr; overflow:visible; } .console{ height:520px; } #list{ overflow:visible; } }
  .actions { display:flex; gap:10px; align-items:center; justify-content:flex-end; white-space:nowrap; }
  .envbar { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); gap:10px; align-items:stretch; }
  .envchip { min-width:0; display:flex; gap:8px; align-items:center; background:#101426; border:1px solid var(--line); border-radius:8px; padding:6px 9px; color:var(--mut); font-size:12px; }
  .envchip strong { color:var(--ink); font-size:11px; letter-spacing:.03em; }
  .envchip input { min-width:0; flex:1 1 auto; background:var(--panel2); color:var(--green); border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:12px ui-monospace,SFMono-Regular,monospace; outline:none; }
  .envchip input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(79,158,255,.18); }
  .launchbar { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; align-items:stretch; }
  .launchbar > span, .control { min-width:0; min-height:42px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .launchbar > .option-version { grid-column:1 / -1; }
  .launchbar > span label, .control label, .control .label { color:var(--mut); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .check { gap:8px; color:var(--ink); }
  .seg { min-width:0; flex:1 1 320px; display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { flex:1 1 150px; background:transparent; color:var(--mut); border:0; padding:6px 12px; cursor:pointer; font:inherit; white-space:normal; line-height:1.2; }
  .seg button.on { background:var(--blue); color:#04122b; font-weight:700; }
  select { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 28px 6px 10px; font:inherit; }
  input[type=range]{ min-width:120px; flex:1 1 140px; vertical-align:middle; }
  @media (max-width:760px){ .topbar{ grid-template-columns:1fr; } .actions{ justify-content:flex-start; } .envbar{ grid-template-columns:1fr; } .launchbar{ grid-template-columns:1fr; } .seg{ flex-basis:100%; display:grid; grid-template-columns:1fr; } .seg button{ text-align:left; } }
  .listpane { min-height:0; display:flex; flex-direction:column; }
  .listbar { flex:0 0 auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; display:flex; gap:12px; align-items:center; }
  .search { flex:1 1 auto; position:relative; }
  .search input { width:100%; background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font:inherit; outline:none; }
  .search input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(79,158,255,.18); }
  .count { color:var(--mut); font-size:12px; white-space:nowrap; }
  #list { min-height:0; overflow:auto; padding-right:4px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .card h3 { margin:0 0 4px; font-size:14px; }
  .empty { color:var(--mut); text-align:center; padding:30px 16px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .kind { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; }
  .k-regression{ background:rgba(79,158,255,.15); color:var(--blue); }
  .k-open{ background:rgba(255,90,106,.15); color:var(--red); }
  .k-smoke{ background:rgba(61,220,132,.15); color:var(--green); }
  .id { color:var(--mut); font-family:ui-monospace,monospace; font-size:12px; }
  a.id { color:var(--blue); text-decoration:none; }
  a.id:hover { text-decoration:underline; }
  .meta { color:var(--mut); font-size:12px; margin:6px 0; }
  details summary { cursor:pointer; color:var(--mut); font-size:12px; }
  ol { margin:8px 0 0; padding-left:20px; color:var(--mut); font-size:12px; }
  button.run { background:var(--blue); color:#04122b; border:0; border-radius:8px; padding:7px 14px; font-weight:700; cursor:pointer; }
  button.run:disabled { opacity:.4; cursor:not-allowed; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 14px; cursor:pointer; }
  .runall { background:var(--green); color:#03210f; border:0; border-radius:8px; padding:9px 18px; font-weight:800; cursor:pointer; }
  .runall:disabled { opacity:.4; cursor:not-allowed; }
  .stop { background:var(--red); color:#2b050b; border:0; border-radius:8px; padding:9px 18px; font-weight:800; cursor:pointer; }
  .stop:disabled { opacity:.4; cursor:not-allowed; }
  .console { min-height:0; background:#0a0c18; border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; }
  .cbar { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--mut); }
  .dot.run{ background:var(--amber); animation:pulse 1s infinite; }
  .dot.ok{ background:var(--green); } .dot.ko{ background:var(--red); }
  @keyframes pulse{ 50%{ opacity:.3; } }
  pre { margin:0; padding:12px 14px; overflow:auto; flex:1; font:12px/1.5 ui-monospace,SFMono-Regular,monospace; white-space:pre-wrap; word-break:break-word; }
  .log-cmd{ color:var(--blue); } .log-err{ color:var(--red); } .log-phase{ color:var(--amber); font-weight:700; margin-top:8px; }
  .log-ok{ color:var(--green); font-weight:700; } .log-ko{ color:var(--red); font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
  <h1>C8oForms · test runner</h1>
  <span class="ver">deployed: <b id="served">…</b> <button class="ghost" id="refresh" style="padding:3px 8px;">↻</button></span>
    </div>
    <div class="actions">
      <button class="runall" id="runall" title="Run every manifest test with the selected launch options. Disabled for Broken -> Latest because that mode verifies one ticket at a time.">Run all</button>
      <button class="stop" id="stop" disabled title="Cancel the current run and kill the Playwright/deploy process spawned by the runner.">Stop</button>
    </div>
  </div>
  <div class="envbar" aria-label="C8oForms environment">
    <span class="envchip" title="C8OFORMS_BASE_URL points to a Convertigo server host. The /convertigo/projects/C8Oforms/DisplayObjects/mobile/ path is appended automatically.">
      <strong>C8OFORMS_BASE_URL</strong><input id="env-base" autocomplete="off" spellcheck="false" />
    </span>
    <span class="envchip" title="C8OFORMS_APP_URL points to a full app URL, typically an ng serve URL. When set, it is used as-is and wins over C8OFORMS_BASE_URL.">
      <strong>C8OFORMS_APP_URL</strong><input id="env-app" autocomplete="off" spellcheck="false" placeholder="(unset)" />
    </span>
  </div>
  <div class="launchbar" aria-label="Test launch options">
    <span class="option-version" title="Choose which C8oForms release the runner should deploy before executing the selected test.">
      <label>version</label>
      <span class="seg" id="version">
        <button data-v="latest" class="on" title="Resolve the newest release, deploy it if needed, then run the test.">Latest (deploy if needed)</button>
        <button data-v="broken" title="Deploy the manifest brokenVersion first, then run the test against the bug-report version.">Broken (deploy first)</button>
        <button data-v="verify" title="Run one ticket red on brokenVersion, then green on the latest release.">Broken -> Latest</button>
      </span>
    </span>
    <span title="Run Playwright with --headed so the browser is visible while the test executes."><label><input type="checkbox" id="headed" checked /> headed (watch)</label></span>
    <span title="Pass C8OFORMS_SLOWMO to Playwright so each action is slowed down by the selected number of milliseconds."><label>slow-mo <b id="slowval">500</b>ms</label>
      <input type="range" id="slowmo" min="0" max="2000" step="100" value="500" /></span>
    <span title="Choose the browser used by Playwright through C8OFORMS_BROWSER. Chromium remains the default.">
      <label for="browser">browser</label>
      <select id="browser">
        <option value="chromium">Chromium</option>
        <option value="firefox">Firefox</option>
        <option value="webkit">WebKit</option>
      </select>
    </span>
  </div>
</header>

<div class="grid">
  <section class="listpane">
    <div class="listbar">
      <label class="search">
        <input type="search" id="search" placeholder="Search ticket, title, kind, version..." autocomplete="off" />
      </label>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </section>
  <div class="console">
    <div class="cbar"><span class="dot" id="dot"></span><span id="status">idle</span>
      <button class="ghost" id="clear" style="margin-left:auto; padding:3px 10px;">clear</button></div>
    <pre id="log"></pre>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let version = 'latest', running = false, stopping = false, es = null;

// global controls
$('#version').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  version = b.dataset.v;
  [...$('#version').children].forEach((x) => x.classList.toggle('on', x === b));
  render();
});
$('#slowmo').addEventListener('input', (e) => $('#slowval').textContent = e.target.value);
$('#clear').addEventListener('click', () => { $('#log').textContent = ''; setStatus('idle',''); });
$('#refresh').addEventListener('click', refreshVersion);
$('#runall').addEventListener('click', () => {
  if (version === 'verify') return;
  run(['all']);
});
$('#stop').addEventListener('click', stopRun);
$('#search').addEventListener('input', render);

let tests = [];
async function load() {
  const r = await (await fetch('/api/tests')).json();
  tests = r.tests; $('#served').textContent = r.servedVersion; setEnvironment(r.environment || {}); render();
}
async function refreshVersion() {
  $('#served').textContent = '…';
  $('#served').textContent = (await (await fetch('/api/served-version?' + envQuery().toString())).json()).servedVersion;
}

function brokenOf(t){ return t.brokenVersion || t.fixedVersion || t.version || ''; }

function render() {
  const visible = filteredTests();
  $('#list').innerHTML = '';
  $('#count').textContent = `${visible.length}/${tests.length} tests`;
  if (visible.length === 0) {
    $('#list').innerHTML = '<div class="card empty">No test matches the current search.</div>';
  }
  for (const t of visible) {
    const noBroken = (version === 'broken' && !brokenOf(t)) || (version === 'verify' && !t.brokenVersion);
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="row">
        <span class="kind k-${t.kind}">${t.kind}</span>
        <h3>${esc(t.title)}</h3>
      </div>
      <div class="row">${ticketLink(t)}
        <span class="meta">${versionLabel(t)}</span></div>
      ${repro(t)}
      <div class="row" style="margin-top:10px;">
        <button class="run" data-id="${t.id}" ${running || noBroken ? `disabled title="${noBroken ? 'no broken version for this test' : 'a run is already active'}"` : ''}>${runLabel()}</button>
      </div>`;
    $('#list').appendChild(el);
  }
  $('#list').querySelectorAll('button.run').forEach((b) =>
    b.addEventListener('click', () => run([b.dataset.id])));
  $('#runall').disabled = running || version === 'verify';
  $('#runall').title = version === 'verify'
    ? 'Broken -> Latest verification runs one ticket at a time.'
    : 'Run every manifest test with the selected launch options.';
  $('#stop').disabled = !running || stopping;
}

function filteredTests() {
  const q = normalize($('#search').value);
  if (!q) return tests;
  return tests.filter((t) => normalize([
    t.id,
    ticketNumber(t),
    t.issueUrl,
    t.title,
    t.kind,
    t.spec,
    t.brokenVersion,
    t.fixedVersion,
    t.version,
  ].filter(Boolean).join(' ')).includes(q));
}

function ticketNumber(t) {
  return (String(t.issueUrl || '').match(/\/issues\/(\d+)$/) || [])[1] || (String(t.id).match(/^(\d+)/) || [])[1] || '';
}

function ticketLink(t) {
  const label = t.issueUrl ? `#${ticketNumber(t) || t.id}` : t.id;
  if (!t.issueUrl) return `<span class="id">${esc(label)}</span>`;
  return `<a class="id" href="${escAttr(t.issueUrl)}" target="_blank" rel="noreferrer">${esc(label)}</a>`;
}

function setEnvironment(env) {
  const base = env.C8OFORMS_BASE_URL || 'https://test-repro.convertigo.net';
  const app = env.C8OFORMS_APP_URL || '';
  $('#env-base').value = base;
  $('#env-app').value = app;
  $('#env-base').closest('.envchip').title = `C8OFORMS_BASE_URL=${base}\nConvertigo server host; the C8oForms mobile path is appended automatically.`;
  $('#env-app').closest('.envchip').title = `C8OFORMS_APP_URL=${app || '(unset)'}\nFull app URL used as-is; it wins over C8OFORMS_BASE_URL when set. Leave empty to unset it.`;
}

function envQuery() {
  return new URLSearchParams({
    baseUrl: $('#env-base').value.trim(),
    appUrl: $('#env-app').value.trim(),
  });
}

function versionLabel(t) {
  if (version === 'latest') return 'will ensure the latest release is deployed, then run';
  if (version === 'verify') {
    return t.brokenVersion
      ? `will run on <b>${esc(t.brokenVersion)}</b>, then on the latest release`
      : 'no brokenVersion declared';
  }
  const v = brokenOf(t);
  return v ? `will ensure <b>${esc(v)}</b> is deployed, then run` : 'no broken version declared';
}
function runLabel() {
  if (version === 'verify') return 'Verify broken -> latest';
  if (version === 'broken') return 'Run broken';
  return 'Run this';
}
function repro(t) {
  if (!t.reproduction || !t.reproduction.length) return '';
  return `<details><summary>reproduction (${t.reproduction.length} steps)</summary>
    <ol>${t.reproduction.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></details>`;
}
function normalize(s){ return String(s).toLowerCase().replace(/^#/, '').trim(); }
function esc(s){ return String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return esc(s).replace(/"/g, '&quot;'); }

function setStatus(text, kind){ $('#status').textContent = text; $('#dot').className = 'dot' + (kind ? ' ' + kind : ''); }
function append(line, cls){
  const span = document.createElement('span');
  span.className = cls ? 'log-' + cls : '';
  span.textContent = line + '\n';
  $('#log').appendChild(span);
  $('#log').scrollTop = $('#log').scrollHeight;
}

function run(ids) {
  if (running) return;
  running = true; stopping = false; render();
  setStatus('running…', 'run');
  const q = new URLSearchParams({
    ids: ids.join(','), version,
    slowMo: $('#slowmo').value, headed: $('#headed').checked ? '1' : '0',
    browser: $('#browser').value,
  });
  for (const [key, value] of envQuery()) q.set(key, value);
  es = new EventSource('/api/run?' + q.toString());
  es.addEventListener('log', (e) => { const d = JSON.parse(e.data); append(d.line, d.cls); });
  es.addEventListener('phase', (e) => append('\n— ' + JSON.parse(e.data).label + ' —', 'phase'));
  es.addEventListener('done', (e) => {
    const d = JSON.parse(e.data);
    const ok = d.ok;
    append(d.message ? '\n' + d.message : ok ? '\n✓ done — tests passed' : '\n✗ done — tests failed', d.cls || (ok ? 'ok' : 'ko'));
    setStatus(d.status || (ok ? 'passed' : 'failed'), ok ? 'ok' : 'ko');
    finish();
  });
  es.onerror = () => {
    if (!stopping) append('\n[connection closed]', 'err');
    finish();
  };
}
async function stopRun() {
  if (!running || stopping) return;
  stopping = true;
  render();
  append('\n— stopping current run —', 'phase');
  setStatus('stopping…', 'run');
  await fetch('/api/cancel', { method: 'POST' }).catch(() => undefined);
  if (es) {
    es.close();
    es = null;
  }
  append('\n✕ stopped by user', 'ko');
  setStatus('stopped', 'ko');
  finish();
}
function finish(){ if (es){ es.close(); es = null; } running = false; stopping = false; render(); refreshVersion(); }

load();
</script>
</body>
</html>
